וימת.\u003c/span>\u003c/li>\u003c/ol>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":12}'>\u003cbdi>12\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":85}'>\u003cbdi>85\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":88}'>\u003cbdi>88\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"notebox\" data-notes=\"11\">\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"85,86,87,88\" data-title=\"4. מה קורה במהלך פעילות מתמשכת?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N08-5\">\u003ch2 class=\"part\">5. מה אוכלים במהלך אימון?\u003c/h2>\n\u003cp>האפשרויות ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":88}'>שקופית \u003cbdi>88\u003c/bdi>\u003c/button> כוללות משקה ספורט, ג׳ל אנרגיה, סוכריות אנרגיה, חטיפים מתאימים ותמרים. העיקרון אינו שם המסחרי של המוצר אלא תפקידו: לספק פחמימות זמינות תוך שמירה על נוחות עיכול. חשוב להימנע מכמות גבוהה של שומן וסיבים ממש במהלך פעילות עצימה, משום שהם מתעכלים לאט יותר ועשויים לגרום אי־נוחות.\u003c/p>\n\u003caside class=\"gnote q\">\u003cspan class=\"tag\">תרגיל\u003c/span>\u003cdiv>\u003cp>משקה ספורט מכיל 6% פחמימות. כמה גרם פחמימות יש ב־750 מ״ל? 6 גרם בכל 100 מ״ל ← 6×7.5 = 45 גרם. זהו תרגיל מתמטי, לא המלצה כמה לשתות.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-worked beyond\" id=\"N08-A07\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">דוגמת חישוב\u003c/span>\u003cb>חישוב: כמה פחמימות במשקה ברכיבה של 3 שעות\u003c/b>\u003c/div>\u003cdiv class=\"worked\">\u003cp>\u003cstrong>הנתונים:\u003c/strong> רוכבת יוצאת לרכיבה של 3 שעות. היא שותה משקה ספורט בריכוז 6% (בתוך הטווח 4–8% שב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":43}'>שקופית \u003cbdi>43\u003c/bdi>\u003c/button>), כוס אחת בכל 20 דקות (הקצה העליון של 0.5–1 כוס ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":42}'>שקופית \u003cbdi>42\u003c/bdi>\u003c/button>). \u003cstrong>הנחה להמחשה בלבד:\u003c/strong> כוס = 200 מ״ל.\u003c/p>\u003cp>שלב 1: משך של 3 שעות נמצא בקטגוריה ״שעתיים וחצי עד שלוש שעות ויותר״, ולכן מתספים מהשעה הראשונה (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":87}'>שקופית \u003cbdi>87\u003c/bdi>\u003c/button>).\u003cbr>שלב 2: מספר כוסות בשעה: 60 דקות ÷ 20 דקות = 3 כוסות לשעה.\u003cbr>שלב 3: נפח בשעה: 3 כוסות × 200 מ״ל = 600 מ״ל לשעה.\u003cbr>שלב 4: 6% פירושו 6 גרם פחמימות בכל 100 מ״ל.\u003cbr>שלב 5: 600 מ״ל ÷ 100 מ״ל = 6 מנות של 100 מ״ל.\u003cbr>שלב 6: 6 × 6 גרם = 36 גרם פחמימות לשעה.\u003cbr>שלב 7: לכל הרכיבה: 36 גרם לשעה × 3 שעות = 108 גרם פחמימות.\u003cbr>בדיקת טווח: באותו נפח, משקה 4% נותן 6 × 4 = 24 גרם לשעה, ומשקה 8% נותן 6 × 8 = 48 גרם לשעה.\u003c/p>\u003cp>\u003cstrong>התוצאה:\u003c/strong> כ־36 גרם פחמימות לשעה, 108 גרם בכל הרכיבה.\u003c/p>\u003cp>שימי לב: זה תרגיל יחידות. המצגת אינה נותנת יעד של גרמים לשעה במהלך המאמץ, וגרף \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":85}'>שקופית \u003cbdi>85\u003c/bdi>\u003c/button> מתאר מגמה, לא שעה קבועה שבה כל אדם ״נגמר״.\u003c/p>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"beyond-chip\">הבהרה מדעית מעבר למצגת\u003c/span> המצגת לא מגדירה נפח של כוס ולא מחשבת גרמי פחמימות במשקה; הכוס של 200 מ״ל והשילוב בין \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":42}'>שקופית \u003cbdi>42\u003c/bdi>\u003c/button> ל\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":43}'>שקופית \u003cbdi>43\u003c/bdi>\u003c/button> הם הנחות לתרגול יחידות בלבד. · \u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":42}'>\u003cbdi>42\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":43}'>\u003cbdi>43\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":87}'>\u003cbdi>87\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"88\" data-title=\"5. מה אוכלים במהלך אימון?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N08-6\">\u003ch2 class=\"part\">6. התאוששות וארוחה לאחר האימון\u003c/h2>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":89}'>שקופיות \u003cbdi>89–90\u003c/bdi>\u003c/button> מתמקדות בחידוש מאגרי הגליקוגן ובתיקון/בניית רקמות. אם מתאמנת צריכה לבצע אימון נוסף בתוך פחות מ־8 שעות, לחידוש מהיר של מאגרי האנרגיה יש חשיבות מיוחדת. אם המאמץ הבא רחוק יותר, לעיתים קרובות אפשר להסתמך על ארוחות מסודרות במהלך היום במקום להילחץ מחלון של דקות ספורות בלבד. ההיגיון הזה חשוב יותר מהשינון של מספר אחד.\u003c/p>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":89}' aria-label=\"הגדלת שקופית 89\">\u003cimg src=\"images/slide_89.webp\" alt=\"שקופית 89: ארוחה בסיום אימון אירובי, עיתוי ומטרות\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":89}'>שקופית \u003cbdi>89\u003c/bdi>\u003c/button>: ארוחה בסיום אימון אירובי, עיתוי ומטרות\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003cp>המצגת מציגה ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":90}'>שקופית \u003cbdi>90\u003c/bdi>\u003c/button> קצב לימודי של כ־1–1.2 גרם פחמימות לק״ג משקל לשעה במשך כמה שעות במצב התאוששות מהירה. \u003cstrong>דוגמת חישוב בלבד:\u003c/strong> מתאמנת במשקל 60 ק״ג, לפי 1 גרם לק״ג לשעה: 60 גרם פחמימות בשעה. אין בכך הנחיית תזונה אישית.\u003c/p>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":90}' aria-label=\"הגדלת שקופית 90\">\u003cimg src=\"images/slide_90.webp\" alt=\"שקופית 90: תכנון ארוחה והתאוששות לאחר מאמץ\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":90}'>שקופית \u003cbdi>90\u003c/bdi>\u003c/button>: תכנון ארוחה והתאוששות לאחר מאמץ\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-compare deck\" id=\"N08-A08\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">השוואה\u003c/span>\u003cb>התאוששות: פחות מ־8 שעות מול יותר מ־8 שעות\u003c/b>\u003c/div>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>האימון הבא בעוד פחות מ־8 שעות\u003c/th>\u003cth>האימון הבא בעוד יותר מ־8 שעות\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">עיתוי\u003c/th>\u003ctd>חשוב להקפיד לאכול מיד בסיום האימון\u003c/td>\u003ctd>קו מנחה: סמוך לסיום ולא יאוחר מ־90 דקות, אך אין חשיבות גדולה להקפדה על אכילה מיידית\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">פחמימות\u003c/th>\u003ctd>1–1.2 גרם לק״ג לשעה ב־4 השעות הראשונות\u003c/td>\u003ctd>צריכה רגילה\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">הרכב הארוחה\u003c/th>\u003ctd>מגוונת: פחמימות, חלבונים, שומן מהצומח וירקות\u003c/td>\u003ctd>אותו הרכב מגוון\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">מטרות\u003c/th>\u003ctd>חידוש גליקוגן בשרירים ובכבד ותיקון נזקים ברקמות\u003c/td>\u003ctd>אותן מטרות, עם יותר זמן להשיג אותן\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":89}'>\u003cbdi>89\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":90}'>\u003cbdi>90\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-worked beyond\" id=\"N08-A09\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">דוגמת חישוב\u003c/span>\u003cb>חישוב: שני אימונים ביום, הפרש של 6 שעות\u003c/b>\u003c/div>\u003cdiv class=\"worked\">\u003cp>\u003cstrong>הנתונים (להמחשה בלבד):\u003c/strong> ספורטאית במשקל 55 ק״ג מסיימת אימון ב־12:00, והאימון הבא ב־18:00.\u003c/p>\u003cp>שלב 1: הפער בין האימונים: 18:00 − 12:00 = 6 שעות. זה פחות מ־8 שעות, ולכן לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":90}'>שקופית \u003cbdi>90\u003c/bdi>\u003c/button> משתמשים בקצב 1–1.2 גרם לק״ג לשעה ב־4 השעות הראשונות.\u003cbr>שלב 2: הקצה התחתון: 1 גרם/ק״ג/שעה × 55 ק״ג = 55 גרם לשעה.\u003cbr>שלב 3: הקצה העליון: 1.2 גרם/ק״ג/שעה × 55 ק״ג = 66 גרם לשעה.\u003cbr>שלב 4: סך הכול ב־4 השעות הראשונות: 55 גרם/שעה × 4 שעות = 220 גרם, ו־66 גרם/שעה × 4 שעות = 264 גרם.\u003c/p>\u003cp>\u003cstrong>התוצאה:\u003c/strong> 220–264 גרם פחמימות בין 12:00 ל־16:00, החל מאכילה מיד בסיום האימון.\u003c/p>\u003cp>ואם האימון הבא היה רק למחרת בבוקר (יותר מ־8 שעות)? לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":90}'>שקופית \u003cbdi>90\u003c/bdi>\u003c/button> הצריכה ״רגילה״, ואין צורך במספר מיוחד. זה תרגיל חישוב, לא הנחיה אישית.\u003c/p>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"beyond-chip\">הבהרה מדעית מעבר למצגת\u003c/span> \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":90}'>שקופית \u003cbdi>90\u003c/bdi>\u003c/button> כותבת ״1–1.2 גרם לק״ג לשעה״ בלי לציין באיזה רכיב מדובר; הפירוש כפחמימות נשען על \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":89}'>שקופית \u003cbdi>89\u003c/bdi>\u003c/button>, שמטרתה חידוש מאגרי הגליקוגן. · \u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":89}'>\u003cbdi>89\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":90}'>\u003cbdi>90\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-check deck\" id=\"N08-A10\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">בדיקת הבנה\u003c/span>\u003cb>בדיקת הבנה: אימון ערב ואימון בוקר\u003c/b>\u003c/div>\u003cdiv class=\"lcheck\" data-id=\"N08-A10\">\u003cp class=\"lc-q\">\u003cb>מתאמנת מסיימת אימון ב־20:00, והאימון הבא שלה ב־08:00 למחרת. לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":89}'>שקופיות \u003cbdi>89–90\u003c/bdi>\u003c/button>, מה נכון לגבי הארוחה אחרי האימון?\u003c/b>\u003c/p>\u003cdiv class=\"lc-opts\">\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N08-A10\",\"i\":2}'>\u003cspan class=\"k\">א\u003c/span>\u003cspan>ארוחה מגוונת ורגילה מתאימה, ואין חשיבות גדולה לאכילה מיד בסיום\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N08-A10\",\"i\":3}'>\u003cspan class=\"k\">ב\u003c/span>\u003cspan>עדיף להימנע מפחמימות עד הבוקר\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N08-A10\",\"i\":1}'>\u003cspan class=\"k\">ג\u003c/span>\u003cspan>עליה לצרוך 1–1.2 גרם פחמימות לק״ג לשעה במשך 4 שעות\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N08-A10\",\"i\":0}'>\u003cspan class=\"k\">ד\u003c/span>\u003cspan>אם לא תאכל בתוך 15 דקות, הגליקוגן לא יתחדש עד הבוקר\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"lc-exp\" hidden>\u003cp>הפער הוא 12 שעות, יותר מ־8, ולכן לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":89}'>שקופית \u003cbdi>89\u003c/bdi>\u003c/button> אין חשיבות גדולה להקפדה על אכילה מיד בתום האימון, ולפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":90}'>שקופית \u003cbdi>90\u003c/bdi>\u003c/button> הצריכה רגילה. האפשרות של 1–1.2 גרם לק״ג לשעה מפתה כי זה המספר שמופיע בשקופית, אבל הוא שייך רק למצב שבו האימון הבא בעוד פחות מ־8 שעות.\u003c/p>\u003c/div>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":89}'>\u003cbdi>89\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":90}'>\u003cbdi>90\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"notebox\" data-notes=\"9\">\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"89,90\" data-title=\"6. התאוששות וארוחה לאחר האימון\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N08-7\">\u003ch2 class=\"part\">7. טבלת תזמון והשוואה\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>שלב\u003c/th>\u003cth>מה מנסים להשיג?\u003c/th>\u003cth>מה חשוב להבין?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">שעות לפני\u003c/th>\u003ctd>אנרגיה, מאגרים, עיכול נוח\u003c/td>\u003ctd>ארוחה מלאה דורשת זמן עיכול\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">קרוב לאימון\u003c/th>\u003ctd>תוספת אנרגיה זמינה\u003c/td>\u003ctd>נשנוש קטן, התאמה אישית\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">במהלך ארוך\u003c/th>\u003ctd>שמירה על פחמימות ונוזלים\u003c/td>\u003ctd>ככל שהמאמץ מתמשך, הצורך עשוי לגדול\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">מיד לאחר מאמץ\u003c/th>\u003ctd>התחלת התאוששות\u003c/td>\u003ctd>דחיפות גבוהה יותר אם האימון הבא קרוב\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">בהמשך היום\u003c/th>\u003ctd>צרכים יומיים מלאים\u003c/td>\u003ctd>ארוחות מאוזנות ועמידה בצריכה הכוללת\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-example deck\" id=\"N08-A11\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">דוגמה מהאימון\u003c/span>\u003cb>יום שלם של רוכבת: לפני, במהלך ואחרי\u003c/b>\u003c/div>\u003cp>רוכבת מתכננת רכיבה של 3 שעות ב־10:00 ואימון נוסף ב־19:00.\u003c/p>\u003cul>\u003cli>\u003cstrong>06:30, ארוחה מקדימה (3.5 שעות לפני):\u003c/strong> בעיקר פחמימות מורכבות, מעט שומן וסיבים, חלבון בינוני (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":79}'>שקופיות \u003cbdi>79–80\u003c/bdi>\u003c/button>).\u003c/li>\u003cli>\u003cstrong>09:30, ארוחה סמוכה:\u003c/strong> 2–4 תמרים ומים, לתגבור פחמימות זמינות (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":82}'>שקופיות \u003cbdi>82–83\u003c/bdi>\u003c/button>).\u003c/li>\u003cli>\u003cstrong>10:00–13:00, במהלך:\u003c/strong> 3 שעות, ולכן מתספים מהשעה הראשונה: משקה ספורט, ג׳ל או תמרים, עדיף גלוקוז עם פרוקטוז (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":87}'>שקופיות \u003cbdi>87–88\u003c/bdi>\u003c/button>).\u003c/li>\u003cli>\u003cstrong>13:00, מיד בסיום:\u003c/strong> האימון הבא בעוד 6 שעות, פחות מ־8, ולכן אוכלים מיד: ארוחה מגוונת ו־1–1.2 גרם פחמימות לק״ג לשעה ב־4 השעות הראשונות (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":89}'>שקופיות \u003cbdi>89–90\u003c/bdi>\u003c/button>).\u003c/li>\u003c/ul>\u003cp>אם האימון הנוסף היה מחר בבוקר, השלב האחרון היה פחות דחוף.\u003c/p>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":79}'>\u003cbdi>79\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":82}'>\u003cbdi>82\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":83}'>\u003cbdi>83\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":87}'>\u003cbdi>87\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":88}'>\u003cbdi>88\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":89}'>\u003cbdi>89\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":90}'>\u003cbdi>90\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"\" data-title=\"7. טבלת תזמון והשוואה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N08-8\">\u003ch2 class=\"part\">8. תרגול חשיבה ביקורתית\u003c/h2>\n\u003cp>\u003cstrong>א. למה כדאי לצמצם סיבים ושומן סמוך למאמץ עצים, אף שהם חלק מתפריט בריא?\u003c/strong> הם עלולים להאט את התרוקנות הקיבה ולהגדיל אי־נוחות בזמן הפעילות.\u003c/p>\n\u003cp>\u003cstrong>ב. מה המסקנה הנכונה מגרף אחד המדגים נפילת גלוקוז אחרי פעילות ממושכת ללא פחמימות?\u003c/strong> שקיימת אפשרות לתועלת מצריכת פחמימות במאמץ ארוך, לא שכל אדם יקבל אותו גרף.\u003c/p>\n\u003cp>\u003cstrong>ג. למה למתאמנת עם שתי יחידות אימון בהפרש קצר צריך לתת תשומת לב מיוחדת להתאוששות?\u003c/strong> כי יש לה פחות זמן למלא מחדש מאגרי דלק ולחזור לתפקוד.\u003c/p>\n\u003cp>\u003cstrong>ד. האם יש חובה לשתות משקה ספורט בכל אימון של 30 דקות?\u003c/strong> לא; הסביבה, התזונה, משך המאמץ והצרכים האישיים קובעים את ההתאמה.\u003c/p>\n\u003cp>\u003cstrong>ה. מה החשיבות של ״לא לנסות מאכל חדש ביום התחרות״?\u003c/strong> משום שעלולים להופיע תסמיני עיכול או אי־נוחות שיפגעו בביצוע.\u003c/p>\n\u003cdiv class=\"keywords\">\u003cspan class=\"tag\">מילות מפתח\u003c/span>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;תזמון ארוחה&quot;}'>תזמון ארוחה\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;זמינות גלוקוז&quot;}'>זמינות גלוקוז\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;פחמימות זמינות&quot;}'>פחמימות זמינות\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;ריקון קיבה&quot;}'>ריקון קיבה\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;תיסוף במהלך מאמץ&quot;}'>תיסוף במהלך מאמץ\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;גלוקוז ופרוקטוז&quot;}'>גלוקוז ופרוקטוז\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;התאוששות&quot;}'>התאוששות\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;חידוש גליקוגן&quot;}'>חידוש גליקוגן\u003c/button>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"\" data-title=\"8. תרגול חשיבה ביקורתית\">\u003c/div>\u003c/section>","key":"L-N08"}],"guide":{"file":"guide.pdf","filename":"Ofer_Nutrition_Expanded_Study_Guide.pdf","pages":30,"bytes":3869446,"html":"\u003csection class=\"gch\" id=\"g-00\" data-page=\"1\">\u003ch2 class=\"gch-h\">לומדים תזונה עם עפר\u003c/h2>\n\u003ch3>חוברת לימוד מורחבת למבחן\u003c/h3>\n\u003cp>\u003cstrong>תזונת האדם במנוחה ובמאמץ | 90 שקופיות קורס\u003c/strong>\u003c/p>\n\u003cp>חוברת זו משלבת את נושאי המצגת המקורית עם הסברים, מקרים, השוואות ותרשימים חדשים. היא אינה מחליפה ייעוץ רפואי או תזונה אישי. מידע הנחשב העשרה מדעית, ולא ציטוט מן המצגת, מסומן בתוך הפרקים ובנספח הבדיקות.\u003c/p>\n\u003ch3>מפת החומר\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>פרק\u003c/th>\u003cth>נושא\u003c/th>\u003cth>שקופיות\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">01\u003c/th>\u003ctd>יסודות תזונה, תוויות ותוספים\u003c/td>\u003ctd>2–7\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">02\u003c/th>\u003ctd>פחמימות, אינסולין וגליקוגן\u003c/td>\u003ctd>8–16\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">03\u003c/th>\u003ctd>חלבונים וחומצות אמינו\u003c/td>\u003ctd>17–21\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">04\u003c/th>\u003ctd>שומנים, כולסטרול ו-\u003cbdi>HDL/LDL\u003c/bdi>\u003c/td>\u003ctd>22–31\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">05\u003c/th>\u003ctd>נוזלים, נתרן והיפונתרמיה\u003c/td>\u003ctd>32–43\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">06\u003c/th>\u003ctd>תוספים: קפאין, קריאטין, בטא־אלנין\u003c/td>\u003ctd>44–59\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">07\u003c/th>\u003ctd>ויטמינים, מינרלים וסטרס חמצוני\u003c/td>\u003ctd>60–73\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">08\u003c/th>\u003ctd>תזונה לפני, במהלך ולאחר אימון\u003c/td>\u003ctd>74–90\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>חשוב:\u003c/strong> \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":13}'>שקופית \u003cbdi>13\u003c/bdi>\u003c/button> מציינת שאין צורך לשנן את מספרי טבלת המלצות הפחמימות היומית. השאלות החשבוניות בחוברת הן תרגילי הבנת יחידות.\u003c/p>\n\u003c/section>\n\u003csection class=\"gch\" id=\"g-01\" data-page=\"2\">\u003ch2 class=\"gch-h\">\u003cspan class=\"gnum\">פרק \u003cbdi>01\u003c/bdi>\u003c/span>מבוא לתזונת האדם, קבוצות מזון וקריאת תוויות\u003c/h2>\n\u003cp>\u003cstrong>מקור:\u003c/strong> מצגת תזונת האדם במנוחה ובמאמץ, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":2}'>שקופיות \u003cbdi>2–7\u003c/bdi>\u003c/button>.\u003c/p>\n\u003cdiv class=\"dg-static\" data-id=\"01-macronutrients\" data-cap=\"תרשים מקורי להמחשה, פרק 01\">\u003c/div>\n\u003cp>\u003cstrong>מטרת הפרק:\u003c/strong> להבין במה שונה רכיב תזונה מרכיב טכנולוגי המוסף למזון, מה תפקידן של קבוצות רכיבי המזון ומה אפשר ללמוד מתווית.\u003c/p>\n\u003ch3 id=\"g-01-1\" data-page=\"2\">1. מדוע הגוף זקוק למזון?\u003c/h3>\n\u003cp>אוכל הוא גם \u003cem>דלק\u003c/em> וגם \u003cem>חומר בנייה\u003c/em>. הגוף מפרק חלק מרכיבי המזון ומנצל את האנרגיה המשתחררת מתהליכים אלה. רכיבים אחרים משמשים לבניית חלבונים, קרומי תאים, רקמות וחומרים מווסתים. לכן השאלה ״כמה קלוריות יש במזון?״ היא רק אחת מהשאלות החשובות. צריך לשאול גם אילו רכיבים הוא מספק, מה תפקידם והאם צריכתם תואמת את הצרכים.\u003c/p>\n\u003cp>המצגת מבחינה בין \u003cstrong>מאקרונוטריאנטים\u003c/strong> לבין \u003cstrong>מיקרונוטריאנטים\u003c/strong>. מאקרונוטריאנטים הם פחמימות, שומנים וחלבונים. הם נצרכים בכמויות יחסית גדולות ומספקים אנרגיה או חומרי בנייה. מיקרונוטריאנטים הם ויטמינים ומינרלים, הנדרשים בדרך כלל בכמויות קטנות יותר ומשתתפים בתהליכים ביוכימיים, לרבות ניצול האנרגיה, אך אינם בעצמם מקור קלורי משמעותי. ההבחנה היא בכמות ובתפקיד, לא בחשיבות: מחסור ברכיב מיקרו מסוים יכול לפגוע מאוד בתפקוד.\u003c/p>\n\u003ch4>דוגמה לחשיבה נכונה\u003c/h4>\n\u003cp>שתי ארוחות עשויות לספק אותה כמות אנרגיה, אך להיות שונות בהרכב החלבון, איכות השומן, הסיבים, הוויטמינים והמלחים. יש לכן להבחין בין \u003cstrong>ערך אנרגטי\u003c/strong> ובין \u003cstrong>ערך תזונתי\u003c/strong>. כמו כן, אדם שמבצע מאמץ ארוך אינו בהכרח זקוק לאותה ארוחה שמתאימה לאדם היושב רוב היום: דרישות האנרגיה, נוחות מערכת העיכול ועיתוי צריכת המזון משתנים לפי הפעילות.\u003c/p>\n\u003ch3 id=\"g-01-2\" data-page=\"3\">2. פירמידת המזון וקשת המזון\u003c/h3>\n\u003cp>המצגת (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":4}'>שקופית \u003cbdi>4\u003c/bdi>\u003c/button>) מציגה את הפירמידה ואת קשת המזון כאמצעי חזותי להעברת רעיון של תזונה מאוזנת ומגוונת. אלה \u003cstrong>כלי הדרכה\u003c/strong>, ולא נוסחה קשיחה שמתאימה באותה מידה לכל אדם. כל מדינה עשויה להשתמש בהדגשה או בייצוג גרפי אחרים בהתאם להמלצות שלה. חשוב לדעת להסביר מה מטרת הכלי: לעזור לבחור מזונות מקבוצות שונות ולראות את התפריט כמכלול.\u003c/p>\n\u003cp>כדאי לשאול: האם התפריט כולל מגוון? מה מקור הפחמימות? האם יש מזונות המספקים שומן וחלבון? האם יש ירקות ופירות? אם מתאמן מתקשה להגיע לאנרגיה מספקת, ייתכן שיהיה צורך לשנות כמויות או עיתוי בלי לוותר על העיקרון של תפריט מגוון.\u003c/p>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":4}' aria-label=\"הגדלת שקופית 4\">\u003cimg src=\"images/slide_04.webp\" alt=\"שקופית 4: השוואת צורות הדרכה לתזונה נבונה\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":4}'>שקופית \u003cbdi>4\u003c/bdi>\u003c/button>: השוואת צורות הדרכה לתזונה נבונה\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003ch3 id=\"g-01-3\" data-page=\"3\">3. קריאת תווית מזון\u003c/h3>\n\u003cp>ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":5}'>שקופית \u003cbdi>5\u003c/bdi>\u003c/button> מצוינים הפרטים העיקריים בתווית מזון ארוז: שם המוצר, תכולה, רכיבים, טבלת הערכים התזונתיים, פרטי היצרן או ארץ הייצור, ותאריכי ייצור או תפוגה. כאשר מנתחים מוצר לצורכי לימוד, חשוב להבחין בין \u003cstrong>רשימת הרכיבים\u003c/strong> לבין \u003cstrong>טבלת הערכים\u003c/strong>: הראשונה מציגה ממה המוצר מורכב, והשנייה כמה מכל רכיב תזונתי נמצא בכמות מוגדרת של המוצר.\u003c/p>\n\u003cp>\u003cstrong>תרגול לדוגמה:\u003c/strong> על מוצר כתוב שב־100 גרם יש 12 גרם פחמימות, 5 גרם חלבון ו־3 גרם שומן. אם אוכלים 200 גרם, הכמות של כל רכיב מוכפלת פי שניים: 24 גרם פחמימות, 10 גרם חלבון ו־6 גרם שומן. בהעשרה, אפשר להעריך אנרגיה באמצעות 4 קק״ל לגרם פחמימה, 4 לגרם חלבון ו־9 לגרם שומן: 24×4 + 10×4 + 6×9 = 190 קק״ל. החישוב הוא אומדן לימודי, וייתכנו הבדלים לעומת המסומן בפועל.\u003c/p>\n\u003cp>שתי טעויות נפוצות: לחשב תכולה של חבילה שלמה לפי ערכים ל־100 גרם בלי להתאים את המשקל, ולהשוות בין מוצרים כשבאחד הנתונים מוצגים למנה ובשני ל־100 גרם.\u003c/p>\n\u003ch3 id=\"g-01-4\" data-page=\"4\">4. תוסף מזון לעומת תוסף תזונה\u003c/h3>\n\u003cp>זהו הבדל שהמצגת מדגישה ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":6}'>שקופיות \u003cbdi>6–7\u003c/bdi>\u003c/button>. \u003cstrong>תוסף מזון\u003c/strong> הוא חומר המוסף בתהליך הייצור למטרה טכנולוגית, למשל שימור, יציבות, צבע או מרקם. דוגמאות המופיעות במצגת: חומר משמר, צבע מאכל ואבקת אפייה. לעומתו \u003cstrong>תוסף תזונה\u003c/strong> הוא מוצר או רכיב שנצרך כדי להשלים רכיבים תזונתיים או למטרה אחרת, למשל תוספי ויטמינים או מינרלים. אין להסיק מכך שתוסף תזונה נחוץ לכל אדם או שהוא משפר ביצועים.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>שאלה\u003c/th>\u003cth>תוסף מזון\u003c/th>\u003cth>תוסף תזונה\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">מה המטרה?\u003c/th>\u003ctd>שינוי טכנולוגי במוצר\u003c/td>\u003ctd>השלמה תזונתית או מטרה ייעודית\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">באיזה שלב?\u003c/th>\u003ctd>בייצור המזון\u003c/td>\u003ctd>כחלק מצריכת האדם\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">דוגמה\u003c/th>\u003ctd>חומר משמר\u003c/td>\u003ctd>תוסף ברזל במקרה של חסר מאובחן\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"g-01-5\" data-page=\"4\">5. דוגמה מורכבת למבחן\u003c/h3>\n\u003cp>\u003cstrong>מקרה:\u003c/strong> סטודנטית רואה מוצר עם תוספת ויטמין \u003cbdi>B12\u003c/bdi> וחומר משמר. היא אומרת: ״שניהם תוספי מזון, כי שניהם נוספו במפעל״.\u003cbr>\u003cstrong>ניתוח:\u003c/strong> עצם העובדה שהתווספו במפעל אינה מספיקה לסיווג. צריך לבדוק \u003cem>למה\u003c/em> הוסף כל חומר. ויטמין \u003cbdi>B12\u003c/bdi> שהוסף לצורך העשרה תזונתית אינו ממלא את אותו תפקיד טכנולוגי של חומר המשמר.\u003c/p>\n\u003cp>\u003cstrong>מקרה:\u003c/strong> שני מוצרים מכילים 20 גרם פחמימה למנה, אך המנות בגדלים שונים.\u003cbr>\u003cstrong>ניתוח:\u003c/strong> להשוואת ריכוז הפחמימות עדיף קודם להמיר לשיעור אחיד, למשל ל־100 גרם או ל־100 מ״ל, בהתאם למוצר.\u003c/p>\n\u003ch3 id=\"g-01-6\" data-page=\"4\">6. שאלות לבדיקה עצמית\u003c/h3>\n\u003col>\u003cli>למה לא נכון לומר שמיקרונוטריאנטים הם ״פחות חשובים״?\u003c/li>\u003cli>   \u003cstrong>תשובה:\u003c/strong> הכמות הנדרשת קטנה יותר, אך תפקידם בתהליכים חיוניים ומשק האנרגיה משמעותי.\u003c/li>\u003cli>כיצד מבדילים בין תוסף מזון לתוסף תזונה?\u003c/li>\u003cli>   \u003cstrong>תשובה:\u003c/strong> לפי מטרת השימוש, טכנולוגיה של ייצור מזון לעומת השלמה/צריכה תזונתית.\u003c/li>\u003cli>כיצד מחשבים את סך החלבון באריזה של 250 גרם אם בתווית כתוב 8 גרם ל־100 גרם?\u003c/li>\u003cli>   \u003cstrong>תשובה:\u003c/strong> 8×2.5 = 20 גרם.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>מילות מפתח:\u003c/strong> מאקרונוטריאנט, מיקרונוטריאנט, תווית תזונתית, רכיבים, תוסף מזון, תוסף תזונה.\u003c/p>\n\u003c/section>\n\u003csection class=\"gch\" id=\"g-02\" data-page=\"5\">\u003ch2 class=\"gch-h\">\u003cspan class=\"gnum\">פרק \u003cbdi>02\u003c/bdi>\u003c/span>פחמימות, אינסולין, גליקוגן והעמסת פחמימות\u003c/h2>\n\u003cp>\u003cstrong>מקור:\u003c/strong> \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":8}'>שקופיות \u003cbdi>8–16\u003c/bdi>\u003c/button>. \u003cstrong>רמת עומק:\u003c/strong> הבנה של רצף התהליך, השוואות, ניתוח מצבים וחישוב בסיסי. \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":13}'>שקופית \u003cbdi>13\u003c/bdi>\u003c/button> מציינת במפורש ש\u003cstrong>אין צורך לזכור את המספרים\u003c/strong> בטבלת המלצות הפחמימות היומית, ולכן באתר יתורגמו מספרים אלה לתרגול הבנה ולא לשאלות שינון חובה.\u003c/p>\n\u003cdiv class=\"dg-static\" data-id=\"02-glut4-pathways\" data-cap=\"תרשים מקורי להמחשה, פרק 02\">\u003c/div>\n\u003ch3 id=\"g-02-1\" data-page=\"5\">1. פחמימות כדלק זמין\u003c/h3>\n\u003cp>פחמימות מספקות לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":9}'>שקופית \u003cbdi>9\u003c/bdi>\u003c/button> כ־4 קק״ל לגרם. במהלך העיכול חלקן מתפרק לחד־סוכרים הנספגים לדם. גלוקוז הוא דלק מרכזי לתאים, ובייחוד בעל חשיבות למערכת העצבים ולמאמצים שבהם נדרש קצב אספקת אנרגיה גבוה. גלוקוז שנכנס לתא יכול לשמש להפקת אנרגיה או להיאגר בצורת גליקוגן. לכן התגובה של הגוף לארוחה אינה זהה לתגובה בזמן מאמץ: אחרי ארוחה רמת הגלוקוז עשויה לעלות, ואילו בשריר הפעיל הביקוש לדלק עולה והוא יכול להגביר קליטת גלוקוז.\u003c/p>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":9}'>שקופית \u003cbdi>9\u003c/bdi>\u003c/button> מתייחסת גם לחשיבות הפחמימות לתפקוד המוח ומציינת 130 גרם ליום כערך ייחוס. כדאי להבין את הרעיון ולא להתבלבל בין ״דרישת גלוקוז של רקמה״ לבין המלצה אישית קבועה לכמות הפחמימות עבור כל ספורטאית; תפריט בפועל תלוי במצב ובמאמץ.\u003c/p>\n\u003ch3 id=\"g-02-2\" data-page=\"5\">2. אינסולין וקליטת גלוקוז בשריר\u003c/h3>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":10}'>שקופיות \u003cbdi>10–11\u003c/bdi>\u003c/button> מציגות רעיון מפתח: אינסולין ופעילות גופנית יכולים, כל אחד במסלול איתות משלו, להגביר זמינות של נשאי גלוקוז בממברנת תא השריר. בהעשרה מדעית אלה נשאים מסוג \u003cstrong>\u003cbdi>GLUT4\u003c/bdi>\u003c/strong>. כאשר יותר נשאים מגיעים לממברנה, לגלוקוז קל יותר להיכנס לתא בנסיבות מתאימות. אינסולין מופרש בתגובה לעלייה בגלוקוז לאחר ארוחה, בעוד כיווץ שריר יכול להפעיל מסלולים שאינם תלויים באינסולין. לכן \u003cstrong>אינסולין ופעילות גופנית אינם אותו הדבר\u003c/strong>, אף שההשפעה הסופית על קליטת גלוקוז עשויה להיות דומה.\u003c/p>\n\u003cp>\u003cstrong>רצף שכדאי לשנן:\u003c/strong> עלייה בגלוקוז אחרי ארוחה ← עלייה באינסולין ← איתות לתא השריר ← יותר נשאי גלוקוז על פני התא ← כניסת גלוקוז מהדם ← שימוש אנרגטי או אגירה.\u003cbr>\u003cstrong>רצף מקביל בעת מאמץ:\u003c/strong> כיווץ שריר ← איתות תוך־תאי אחר ← העברת נשאים לממברנה ← קליטת גלוקוז לתא הפעיל.\u003c/p>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":10}' aria-label=\"הגדלת שקופית 10\">\u003cimg src=\"images/slide_10.webp\" alt=\"שקופית 10: כניסת גלוקוז לתא שריר בתיווך אינסולין\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":10}'>שקופית \u003cbdi>10\u003c/bdi>\u003c/button>: כניסת גלוקוז לתא שריר בתיווך אינסולין\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003cp>\u003cstrong>שאלה נפוצה:\u003c/strong> ״אם רמת האינסולין יורדת בזמן מאמץ, איך התא עדיין קולט גלוקוז?״ התשובה היא שלכיווץ השריר יש מסלול שמאפשר להגדיל את פעילות הנשאים גם בלי עלייה מקבילה באינסולין. זה אחד ההסברים לתרומתה של פעילות גופנית לשליטה במאזן הגלוקוז.\u003c/p>\n\u003ch3 id=\"g-02-3\" data-page=\"6\">3. מהו גליקוגן ואיפה הוא נשמר?\u003c/h3>\n\u003cp>גליקוגן הוא צורת אגירה של פחמימות בגוף. \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":12}'>שקופית \u003cbdi>12\u003c/bdi>\u003c/button> מציגה סדרי גודל לימודיים של כ־400 גרם בשריר וכ־100 גרם בכבד, תוך הסתייגות שיש הבדלים בין אנשים ובין רמות אימון. \u003cstrong>גליקוגן השריר\u003c/strong> משמש בעיקר את אותו שריר; \u003cstrong>גליקוגן הכבד\u003c/strong> יכול לשמש לשמירה על רמת הגלוקוז בדם ולספק גלוקוז לאיברים אחרים. לפיכך שני מאגרים אלה אינם שקולים, אף ששניהם מורכבים מיחידות גלוקוז.\u003c/p>\n\u003cp>דמיינו שני סוגי מחסנים: מחסן מקומי שמשמש מפעל מסוים, ומחסן מרכזי המשרת את העיר. השריר אינו ״שולח״ באופן ישיר את מאגר הגליקוגן שלו לשריר אחר כמו שהכבד יכול לשחרר גלוקוז לדם. במאמץ ממושך חלק גדול מהשינוי ביכולת להמשיך בעצימות קשור לזמינות דלק ולמאגרי הגליקוגן, אך זמן הדלדול תלוי בעצימות, במשך, בתזונה וברמת האימון. השקופית מציעה ״כשעתיים״ כדוגמה כללית, לא כחוק פיזיולוגי אוניברסלי.\u003c/p>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":12}' aria-label=\"הגדלת שקופית 12\">\u003cimg src=\"images/slide_12.webp\" alt=\"שקופית 12: פירוט המאגרים\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":12}'>שקופית \u003cbdi>12\u003c/bdi>\u003c/button>: פירוט המאגרים\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003ch3 id=\"g-02-4\" data-page=\"7\">4. הקשר בין עומס אימונים לבין כמות הפחמימות בתפריט\u003c/h3>\n\u003cp>ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":13}'>שקופית \u003cbdi>13\u003c/bdi>\u003c/button> מוצגת טבלה שמדגימה כיצד ההמלצה היומית משתנה לפי עצימות ותדירות האימון. \u003cstrong>המרכיב המרכזי לזכור הוא הכיוון:\u003c/strong> ככל שעומס האימונים וצריכת האנרגיה מפחמימות גדלים, כך בדרך כלל גדל הצורך להחזיר פחמימות לתפריט. אין צורך לשנן את המספרים בטבלה לפי הוראת המצגת עצמה. עדיין אפשר לתרגל חישוב של גרם לק״ג כדי להבין מה משמעות היחידה: 5 גרם לק״ג אצל אדם ששוקל 60 ק״ג הם 300 גרם פחמימות ליממה. החישוב כאן הוא דוגמה מתמטית, לא המלצה אישית.\u003c/p>\n\u003ch3 id=\"g-02-5\" data-page=\"7\">5. העמסת פחמימות: למה, מתי ומה המחיר?\u003c/h3>\n\u003cp>העמסת פחמימות (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":14}'>שקופיות \u003cbdi>14–15\u003c/bdi>\u003c/button>) היא אסטרטגיה לפני פעילות ארוכה ומאתגרת שנועדה להעלות את מאגרי הגליקוגן ולדחות עייפות. היא אינה נדרשת לכל אימון. הצגת המצגת: ניתן באמצעותה להגיע למאגרי גליקוגן גדולים יותר, ונזכרות כמה שיטות. חשוב להבחין בין \u003cstrong>מטרת השיטה\u003c/strong> לבין \u003cstrong>אופן הביצוע\u003c/strong>: המטרה היא שיפור זמינות הדלק לתחרות ארוכה; השיטות הן וריאציות של תזמון תזונה ואימון.\u003c/p>\n\u003cp>גליקוגן נאגר יחד עם מים, ולכן גידול במאגרים עשוי להעלות את משקל הגוף וליצור תחושת כבדות. אם הפעילות קצרה ואינה מרוקנת גליקוגן במידה ניכרת, לא בהכרח מתקבל יתרון. זוהי דוגמה לכך שלא ניתן להעתיק אסטרטגיית תזונה של מרתוניסט לתרגול קצר בחדר כושר בלי לברר מה מטרת המאמץ.\u003c/p>\n\u003ch3 id=\"g-02-6\" data-page=\"7\">6. סיבים תזונתיים: טובים לבריאות, תלויי עיתוי באימון\u003c/h3>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":16}'>שקופית \u003cbdi>16\u003c/bdi>\u003c/button> מסכמת שסיבים תזונתיים יכולים לעזור לתחושת שובע, להשפיע על קצב העיכול ולתרום לתפקוד מערכת העיכול. סיבים סופחים מים, ולחלקם השפעה על תגובת הגלוקוז לאחר ארוחה. עם זאת, מזון עתיר סיבים סמוך מאוד למאמץ עצים עלול להכביד על מערכת העיכול. לכן יש להבחין בין ״מה מומלץ בתפריט שגרתי״ לבין ״מה רצוי לאכול ממש לפני פעילות״.\u003c/p>\n\u003ch3 id=\"g-02-7\" data-page=\"8\">7. שאלות תרגול עם פתרונות\u003c/h3>\n\u003cp>\u003cstrong>א. מתאמנת אכלה ארוחת פחמימות לפני אימון. מה משותף לאינסולין ולפעילות הגופנית לגבי השריר?\u003c/strong>\u003cbr>שניהם יכולים לעודד הימצאות נשאי גלוקוז על קרום התא, אך דרך מנגנוני איתות שונים.\u003c/p>\n\u003cp>\u003cstrong>ב. מדוע גליקוגן בכבד חשוב גם לרקמות שאינן הכבד עצמו?\u003c/strong>\u003cbr>משום שהכבד מסוגל לשחרר גלוקוז לדם, וכך לתרום לשמירה על רמת הסוכר בין ארוחות ובמאמץ.\u003c/p>\n\u003cp>\u003cstrong>ג. אימון של 40 דקות: האם בהכרח צריך לבצע העמסת פחמימות מראש?\u003c/strong>\u003cbr>לא. יש לבחון את משך המאמץ, עצימותו והאם קיים יתרון אמיתי בהגדלת המאגרים. אין המלצה להעמיס אוטומטית.\u003c/p>\n\u003cp>\u003cstrong>ד. למה לא כדאי להמציא כלל קשיח של ״כל אדם מרוקן גליקוגן אחרי שעתיים״?\u003c/strong>\u003cbr>מפני שהמשך תלוי במאגרים ההתחלתיים, עצימות, תזונה, רמת כושר וסוג הפעילות.\u003c/p>\n\u003cp>\u003cstrong>בדיקת הבנה:\u003c/strong> אם צריך לבחור בין ארוחה עתירת סיבים כשעה לפני ריצה עצימה לבין ארוחה דלה בסיבים יותר, כיצד תסבירי את השיקול? התשובה קשורה לנוחות העיכול ולא לכך שסיבים ״אינם בריאים״.\u003c/p>\n\u003cp>\u003cstrong>מילות מפתח:\u003c/strong> גלוקוז, אינסולין, \u003cbdi>GLUT4\u003c/bdi>, כיווץ שריר, גליקוגן כבד, גליקוגן שריר, העמסת פחמימות, סיבים תזונתיים.\u003c/p>\n\u003c/section>\n\u003csection class=\"gch\" id=\"g-03\" data-page=\"9\">\u003ch2 class=\"gch-h\">\u003cspan class=\"gnum\">פרק \u003cbdi>03\u003c/bdi>\u003c/span>חלבונים, חומצות אמינו ומבנה החלבון\u003c/h2>\n\u003cp>\u003cstrong>מקור:\u003c/strong> \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":17}'>שקופיות \u003cbdi>17–21\u003c/bdi>\u003c/button>; התייחסות נוספת לאבקות חלבון ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":58}'>שקופיות \u003cbdi>58–59\u003c/bdi>\u003c/button>.\u003c/p>\n\u003cdiv class=\"dg-static\" data-id=\"03-glycogen-stores\" data-cap=\"תרשים מקורי להמחשה, פרק 03\">\u003c/div>\n\u003ch3 id=\"g-03-1\" data-page=\"9\">1. מהו חלבון?\u003c/h3>\n\u003cp>חלבון אינו חומר יחיד אלא משפחה של מולקולות הבנויות משרשראות חומצות אמינו. רצף חומצות האמינו משפיע על האופן שבו החלבון מתקפל ועל תפקידו. בגוף יש חלבוני מבנה, אנזימים, חלבונים שמעבירים חומרים, חלבוני שריר ורכיבים רבים נוספים. בספורט חשובים חלבונים בין היתר לתחזוקה ולהתחדשות רקמות, לבניית מבנה השריר ולהסתגלות לאימון, אך אין להסיק שתוספת חלבון ללא גבול מבטיחה עלייה ליניארית בכוח.\u003c/p>\n\u003cp>בהעשרה כללית, חלבון מספק כ־4 קק״ל לגרם, אך תפקידו אינו רק אספקת אנרגיה. בעוד פחמימות ושומנים נשמרים במאגרים ייעודיים, אין ״מחסן חלבון״ נפרד באותו מובן. חלבוני הגוף ממלאים תפקידים מבניים ותפקודיים, ופירוק שלהם לצורכי אנרגיה כרוך במחיר פיזיולוגי.\u003c/p>\n\u003ch3 id=\"g-03-2\" data-page=\"9\">2. חומצת אמינו: מבנה והבחנה בין חיונית ללא חיונית\u003c/h3>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":18}'>שקופית \u003cbdi>18\u003c/bdi>\u003c/button> מתארת שלד המשותף לחומצות אמינו וקבוצה צדדית שמבדילה ביניהן. חומצות האמינו מתחברות זו לזו בקשר פפטידי ויוצרות שרשראות. המושג \u003cstrong>חומצת אמינו חיונית\u003c/strong> אינו אומר ״חשובה יותר״, אלא שהגוף אינו יכול לייצר אותה בכמות מספקת ולכן צריך לקבל אותה במזון. חומצת אמינו שאינה חיונית אינה ״מיותרת״: היא נחוצה, אך הגוף מסוגל ליצור אותה בתנאים רגילים.\u003c/p>\n\u003cp>במצגת מופיעים המונחים \u003cstrong>טראנסאמינציה\u003c/strong> (העברת קבוצת אמינו בין תרכובות) ו\u003cstrong>דה־אמינציה\u003c/strong> (הסרת קבוצת אמינו). מדוע זה חשוב? כי כאשר חומצת אמינו אינה מנוצלת לבניית חלבון היא יכולה לעבור פירוק ושימוש בשלד הפחמני שלה. החנקן אינו יכול פשוט להיאגר ללא ויסות; הוא עובר עיבוד, בין השאר לאוריאה, המופרשת בשתן.\u003c/p>\n\u003ch4>תרגיל יישומי\u003c/h4>\n\u003cp>סטודנטית טוענת: ״אם חומצת אמינו אינה חיונית, אין צורך בגוף בחומצה הזאת״. זוהי טעות מושגית. המילה ״לא חיונית״ מתארת את הצורך לקבלה ממקור חיצוני, לא את הצורך הביולוגי בה.\u003c/p>\n\u003ch3 id=\"g-03-3\" data-page=\"10\">3. קשר פפטידי והמבנה של החלבון\u003c/h3>\n\u003cp>קשר פפטידי מחבר חומצות אמינו בשרשרת. \u003cstrong>מבנה ראשוני\u003c/strong> הוא רצף חומצות האמינו. הקיפול במרחב יוצר מבנים גבוהים יותר, והוא קריטי לפעילות חלבונים רבים. אפשר לדמיין שרשרת חרוזים: זהות החרוזים וסדרם חשובים, אך גם האופן שבו השרשרת מתקפלת למבנה תלת־ממדי. שני חלבונים עם אותם מרכיבים בכמויות דומות לא בהכרח יפעלו באותו אופן, אם הרצף או המבנה שלהם שונים.\u003c/p>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":20}' aria-label=\"הגדלת שקופית 20\">\u003cimg src=\"images/slide_20.webp\" alt=\"שקופית 20: המחשה של מבנים ברמות שונות\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":20}'>שקופית \u003cbdi>20\u003c/bdi>\u003c/button>: המחשה של מבנים ברמות שונות\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003ch3 id=\"g-03-4\" data-page=\"10\">4. דנטורציה אינה בהכרח פירוק של חומצות האמינו\u003c/h3>\n\u003cp>מצגת \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":20}'>שקופית \u003cbdi>20\u003c/bdi>\u003c/button> מסבירה ש\u003cstrong>דנטורציה\u003c/strong> היא שינוי במבנה המרחבי של החלבון, למשל מחום, חומצה או הקצפה. שינוי המבנה עשוי לשנות פעילות של אנזים או מבנה של חלבון, אבל אינו מחייב שבירת קשרי הפפטיד של המבנה הראשוני. לכן בעת חימום ביצה החלבון משנה את המרקם, אך חומצות האמינו לא נעלמו. צריך להפריד בין ״החלבון איבד את המבנה הפעיל שלו״ לבין ״החלבון חדל להיות רכיב תזונתי״.\u003c/p>\n\u003cp>יש דנטורציה הפיכה בחלק מהמקרים ויש שינוי בלתי הפיך במקרים אחרים. אין להכליל שכל חלבון תמיד חוזר למצבו הקודם עם קירור.\u003c/p>\n\u003ch3 id=\"g-03-5\" data-page=\"10\">5. מהי איכות חלבון לפי ההרכב?\u003c/h3>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":21}'>שקופית \u003cbdi>21\u003c/bdi>\u003c/button> מתייחסת ל־\u003cstrong>\u003cbdi>Amino acid scoring\u003c/bdi>\u003c/strong>, כלומר להשוואת הרכב חומצות האמינו החיוניות בחלבון לתבנית ייחוס. המסר למבחן: בודקים את \u003cstrong>היחס של חומצות האמינו החיוניות\u003c/strong> לצורך, ולא מסתפקים בשאלה ״כמה גרם חלבון יש במוצר״. דוגמה: מוצר יכול להכיל כמות גבוהה של חלבון אך להיות מוגבל יחסית בחומצת אמינו חיונית מסוימת. אין צורך, על בסיס השקופית לבדה, לשנן נוסחאות מתקדמות למדדי איכות אחרים.\u003c/p>\n\u003ch3 id=\"g-03-6\" data-page=\"11\">6. חלבון ממזון לעומת אבקת חלבון\u003c/h3>\n\u003cp>ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":58}'>שקופיות \u003cbdi>58–59\u003c/bdi>\u003c/button> נשאלת שאלה שימושית: האם אבקת חלבון מעניקה יתרון אוטומטי לעומת חלבון שמגיע ממזון? המצגת מדגישה שעמידה בצריכת חלבון מספקת היא העיקר, ושאין הוכחה כללית לתוצאות טובות יותר מעצם היות החלבון ״בתוסף״. לעתים תוסף נוח כאשר אין מזון זמין או קשה להגיע לכמות הדרושה. לכן במבחן חשוב להבדיל בין \u003cstrong>נוחות שימוש\u003c/strong> לבין \u003cstrong>יעילות ביולוגית ייחודית\u003c/strong>.\u003c/p>\n\u003ch3 id=\"g-03-7\" data-page=\"11\">7. שאלות עם תשובות\u003c/h3>\n\u003col>\u003cli>\u003cstrong>מהו קשר פפטידי?\u003c/strong> קשר כימי המחבר שתי חומצות אמינו בשרשרת חלבון.\u003c/li>\u003cli>\u003cstrong>מה ההבדל בין חיונית ללא חיונית?\u003c/strong> הצורך לקבל אותה מהתזונה לעומת יכולת סינתזה עצמית, לא דרגת חשיבות.\u003c/li>\u003cli>\u003cstrong>למה חימום אינו בהכרח מבטל את ערכו התזונתי של חלבון?\u003c/strong> כי לרוב מדובר בשינוי קיפול ולא בהיעלמות חומצות האמינו.\u003c/li>\u003cli>\u003cstrong>למה 20 גרם חלבון אינם מספרים לבד את כל הסיפור?\u003c/strong> משום שגם הרכב חומצות האמינו החיוניות וההקשר התזונתי חשובים.\u003c/li>\u003cli>\u003cstrong>מתי יש טעם לשקול אבקת חלבון?\u003c/strong> כשיש קושי מעשי להשיג כמות מספקת ממזון, ולא כי אבקה עדיפה בהכרח.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>מילות מפתח:\u003c/strong> חומצת אמינו, חומצת אמינו חיונית, קשר פפטידי, מבנה ראשוני, מבנה שלישוני, דנטורציה, טראנסאמינציה, אוריאה, איכות חלבון.\u003c/p>\n\u003c/section>\n\u003csection class=\"gch\" id=\"g-04\" data-page=\"12\">\u003ch2 class=\"gch-h\">\u003cspan class=\"gnum\">פרק \u003cbdi>04\u003c/bdi>\u003c/span>שומנים, חומצות שומן, כולסטרול וליפופרוטאינים\u003c/h2>\n\u003cp>\u003cstrong>מקור:\u003c/strong> \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":22}'>שקופיות \u003cbdi>22–31\u003c/bdi>\u003c/button>.\u003c/p>\n\u003cdiv class=\"dg-static\" data-id=\"04-fat-types\" data-cap=\"תרשים מקורי להמחשה, פרק 04\">\u003c/div>\n\u003cp>\u003cstrong>מטרת הפרק:\u003c/strong> להבין מדוע שומן הוא רכיב חיוני ולא רק מאגר קלוריות, להבחין בין סוגי חומצות השומן ולדעת להסביר את תפקידם של \u003cbdi>HDL\u003c/bdi> ו־\u003cbdi>LDL\u003c/bdi>.\u003c/p>\n\u003ch3 id=\"g-04-1\" data-page=\"12\">1. שומן: חומר בנייה, חומר מוצא ודלק\u003c/h3>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":23}'>שקופית \u003cbdi>23\u003c/bdi>\u003c/button> מתארת שומנים כמולקולות בעלות תפקידים שונים. הם משמשים מקור אנרגיה מרוכז, רכיב בממברנות התאים, חומר מוצא לתרכובות חיוניות, חלק ממערך הבידוד וההגנה בגוף ואמצעי חיוני לספיגה של ויטמינים מסיסי שומן. בצריכה תזונתית שומן מספק כ־9 קק״ל לגרם. \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":24}'>שקופית \u003cbdi>24\u003c/bdi>\u003c/button> מתייחסת גם לערך נמוך יותר לגרם רקמת שומן אגורה בשל הרכב הרקמה, ולכן אין לערבב בין ״גרם שומן בתזונה״ ל״גרם רקמת שומן בגוף״.\u003c/p>\n\u003cp>השומן מתעכל במערכת העיכול ומועבר בצורות שונות. \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":23}'>שקופית \u003cbdi>23\u003c/bdi>\u003c/button> מזכירה ספיגה ומעבר דרך מערכת הלימפה במבנים הקרויים \u003cstrong>כילומיקרונים\u003c/strong>. כדאי להבחין בין טריגליצרידים שנצרכים במזון ובין חומצות שומן שמתקבלות בתהליך עיכול וספיגה, ולא לחשוב שכל השומן נע כחומר חופשי בדם ללא נשאים.\u003c/p>\n\u003ch3 id=\"g-04-2\" data-page=\"12\">2. חומצות שומן רוויות ובלתי רוויות\u003c/h3>\n\u003cp>ההבחנה הבסיסית ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":25}'>שקופיות \u003cbdi>25–26\u003c/bdi>\u003c/button> היא כימית: בחומצת שומן \u003cstrong>רוויה\u003c/strong> אין קשרים כפולים בין אטומי הפחמן בשרשרת, ואילו בחומצת שומן \u003cstrong>בלתי רוויה\u003c/strong> יש לפחות קשר כפול אחד. אם יש קשר כפול אחד, היא \u003cem>חד־בלתי רוויה\u003c/em>; אם יש יותר מאחד, היא \u003cem>רב־בלתי רוויה\u003c/em>. זהו בסיס סיווג, ולא תווית אוטומטית של ״בריא״ ו״לא בריא״ ללא קשר למזון הכולל.\u003c/p>\n\u003cp>\u003cstrong>אומגה־3 ואומגה־6\u003c/strong> הן משפחות של חומצות שומן רב־בלתי רוויות המובחנות לפי מיקום הקשר הכפול הראשון מן הקצה המתילִי של השרשרת. המצגת נותנת דוגמאות למקורות: דגים שמנים, פשתן ואגוזי מלך לאומגה־3; סויה, חמניות וחריע לאומגה־6. יש חומצות שומן חיוניות מסוימות ממשפחות אלה שצריך לקבל בתזונה.\u003c/p>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":25}' aria-label=\"הגדלת שקופית 25\">\u003cimg src=\"images/slide_25.webp\" alt=\"שקופית 25: מבנה כימי והבדל בין רווי לבלתי רווי\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":25}'>שקופית \u003cbdi>25\u003c/bdi>\u003c/button>: מבנה כימי והבדל בין רווי לבלתי רווי\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003cp>\u003cstrong>טעות שמוכרחים להימנע ממנה:\u003c/strong> לקרוא לכל חומצת שומן בלתי רוויה ״אומגה־3״. אומגה־3 היא משפחה מסוימת בתוך הקבוצה הגדולה של חומצות שומן בלתי רוויות.\u003c/p>\n\u003ch3 id=\"g-04-3\" data-page=\"13\">3. אגירת שומן והשפעת מקום האגירה\u003c/h3>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":27}'>שקופית \u003cbdi>27\u003c/bdi>\u003c/button> מבדילה בין \u003cstrong>שומן תת־עורי\u003c/strong> הנמצא מתחת לעור לבין \u003cstrong>שומן ויסצרלי\u003c/strong> סביב איברים פנימיים בחלל הבטן. האחרונה מקושרת לסיכון מטבולי וקרדיווסקולרי מוגבר. חשוב להבין שהצטברות שומן בגוף קשורה למאזן אנרגטי ולהקשר ביולוגי רחב, לא רק לכך שהאדם אכל מזון שומני. כמו כן, כשמדברים על סיכון בריאותי חשוב להימנע מקביעה גורפת שכל שומן תת־עורי ״אינו קשור לעולם לסיכון״.\u003c/p>\n\u003ch3 id=\"g-04-4\" data-page=\"13\">4. כולסטרול: רכיב חיוני שיש להעביר בדם\u003c/h3>\n\u003cp>כולסטרול הוא מולקולה ממשפחת הסטרולים, והגוף משתמש בו בין השאר בממברנות תאים ולייצור חומרים חיוניים. ה\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":29}'>שקופית \u003cbdi>29\u003c/bdi>\u003c/button> מציינת גם ייצור עצמי של כולסטרול בגוף. לכן העובדה שבמזון צמחי אין כולסטרול במובן הרגיל אינה אומרת שהאדם חייב לקבל כולסטרול מן המזון כדי לייצרו בתאים.\u003c/p>\n\u003cp>כיוון שכולסטרול ושומנים רבים אינם מתערבבים בקלות עם המדיום המימי של פלזמת הדם, הגוף משתמש במבני הובלה מיוחדים הקרויים \u003cstrong>ליפופרוטאינים\u003c/strong>. אל תתבלבלו בין המולקולה ״כולסטרול״ לבין כלי הנשיאה שלה.\u003c/p>\n\u003ch3 id=\"g-04-5\" data-page=\"14\">5. \u003cbdi>HDL\u003c/bdi> לעומת \u003cbdi>LDL\u003c/bdi>\u003c/h3>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":31}'>שקופית \u003cbdi>31\u003c/bdi>\u003c/button> מציגה את \u003cstrong>\u003cbdi>LDL\u003c/bdi>\u003c/strong> כמוביל כולסטרול מן הכבד לכיוון הרקמות, ואת \u003cstrong>\u003cbdi>HDL\u003c/bdi>\u003c/strong> כקשור להובלת כולסטרול בחזרה לכבד. המונחים ״טוב״ ו״רע״ משמשים דימוי פשטני. הבנה טובה יותר: שני הסוגים הם חלק ממערך הובלת שומנים; רמותיהם והקשרים לסיכון למחלות לב אינם תכונה מוסרית של ״מולקולה טובה״ או ״מולקולה רעה״. בשאלות המבחן חשוב לקשר כיוון הובלה לסוג הנשאי.\u003c/p>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":31}' aria-label=\"הגדלת שקופית 31\">\u003cimg src=\"images/slide_31.webp\" alt=\"שקופית 31: תיאור HDL ו-LDL\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":31}'>שקופית \u003cbdi>31\u003c/bdi>\u003c/button>: תיאור \u003cbdi>HDL\u003c/bdi> ו-\u003cbdi>LDL\u003c/bdi>\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>מושג\u003c/th>\u003cth>עיקרון\u003c/th>\u003cth>שאלה לבדיקה\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">שומן בתזונה\u003c/th>\u003ctd>מקור אנרגיה מרוכז\u003c/td>\u003ctd>כמה קק״ל ב־1 גרם?\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">רוויה\u003c/th>\u003ctd>היעדר קשר כפול\u003c/td>\u003ctd>איך מסווגים לפי קשרים?\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">חד־בלתי רוויה\u003c/th>\u003ctd>קשר כפול אחד\u003c/td>\u003ctd>במה היא שונה מרב־בלתי רוויה?\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">אומגה־3\u003c/th>\u003ctd>מיקום הקשר הכפול הראשון\u003c/td>\u003ctd>האם זו משפחת שומן או סוג של חלבון?\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>HDL\u003c/bdi>\u003c/th>\u003ctd>קשור להובלת כולסטרול לכבד\u003c/td>\u003ctd>מה כיוון ההובלה?\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>LDL\u003c/bdi>\u003c/th>\u003ctd>קשור להובלת כולסטרול לרקמות\u003c/td>\u003ctd>מה כיוון ההובלה?\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"g-04-6\" data-page=\"14\">6. יישום ושאלות\u003c/h3>\n\u003cp>\u003cstrong>א. מוצר מכיל 12 גרם שומן. כמה אנרגיה נובעת מחלק זה?\u003c/strong> 108 קק״ל, לפי 12×9. זה אינו בהכרח כל הערך הקלורי של המוצר.\u003c/p>\n\u003cp>\u003cstrong>ב. למה זקוקים לנשאי שומן בדם?\u003c/strong> כי שומנים רבים אינם מסיסים היטב בפלזמה, ונדרשת הובלה מסודרת של המולקולות.\u003c/p>\n\u003cp>\u003cstrong>ג. למה חומצת שומן חיונית אינה בהכרח ״חומצת שומן שמספקת את רוב הקלוריות״?\u003c/strong> המונח חיונית מתייחס ליכולת הגוף לסנתז אותה, לא לכמות הקלוריות שהיא תורמת.\u003c/p>\n\u003cp>\u003cstrong>ד. למה שומן ויסצרלי חשוב בהקשר בריאותי?\u003c/strong> מפני שהצטברותו קשורה לעלייה בסיכון למחלות מטבוליות וכלי דם.\u003c/p>\n\u003cp>\u003cstrong>מילות מפתח:\u003c/strong> טריגליצריד, כילומיקרון, שומן רווי, שומן בלתי רווי, אומגה־3, אומגה־6, כולסטרול, \u003cbdi>HDL\u003c/bdi>, \u003cbdi>LDL\u003c/bdi>, שומן ויסצרלי.\u003c/p>\n\u003c/section>\n\u003csection class=\"gch\" id=\"g-05\" data-page=\"16\">\u003ch2 class=\"gch-h\">\u003cspan class=\"gnum\">פרק \u003cbdi>05\u003c/bdi>\u003c/span>משק נוזלים, נתרן, התייבשות והיפונתרמיה\u003c/h2>\n\u003cp>\u003cstrong>מקור:\u003c/strong> מצגת \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":32}'>שקופיות \u003cbdi>32–43\u003c/bdi>\u003c/button>. \u003cstrong>העמקה חיצונית לצורכי דיוק:\u003c/strong> האבחנה הקלינית של היפונתרמיה במאמץ והזהירות משתיית יתר מוסברות גם בקובץ \u003cbutton class=\"linkbtn\" data-act=\"go\" data-route=\"sources\" data-anchor=\"notes\">הערות הדיוק\u003c/button>.\u003c/p>\n\u003cdiv class=\"dg-static\" data-id=\"05-sweat-estimation\" data-cap=\"תרשים מקורי להמחשה, פרק 05\">\u003c/div>\n\u003ch3 id=\"g-05-1\" data-page=\"16\">1. למה נוזלים חשובים למתאמן?\u003c/h3>\n\u003cp>מים אינם רק רכיב שמונע תחושת צמא. הם חלק גדול מנפח הדם והנוזלים הבין־תאיים, ומשמשים סביבה להובלת מומסים, חום וחומרי תזונה. בזמן מאמץ עולה ייצור החום, והגוף משתמש בין היתר בהפרשת זיעה ובהתאדותה כדי להעביר חום אל הסביבה. לכן הצרכים משתנים עם העומס, משך הפעילות, הטמפרטורה, הלחות, סוג הלבוש והבדלים אישיים בין מתאמנים.\u003c/p>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":37}'>שקופיות \u003cbdi>37–38\u003c/bdi>\u003c/button> מתארות דרכי איבוד נוזלים: בשתן, בהזעה, בנשימה ובמקרים מסוימים בשלשול. בזמן מאמץ בחום, ההזעה יכולה להיות גורם משמעותי במיוחד. עם זאת, כמות הזיעה לבדה אינה מלמדת כמה מים יש לשתות בלי לקחת בחשבון משך, קליטה ויציאה של נוזלים נוספים. כמו כן, הזעה כשלעצמה אינה פינוי חום יעיל אלא אם המים מתאדים מן העור.\u003c/p>\n\u003ch3 id=\"g-05-2\" data-page=\"16\">2. נתרן וחשיבותו\u003c/h3>\n\u003cp>נתרן הוא אלקטרוליט מרכזי בנוזל החוץ־תאי, המשתתף בוויסות מאזן הנוזלים, בהעברת אותות חשמליים במערכת העצבים ובתפקוד שריר. הוא מופרש גם בזיעה וגם בשתן. המצגת מזכירה כי צריכה גבוהה עשויה לתרום לעלייה בלחץ הדם אצל חלק מהאנשים, ושמזונות מעובדים מסוימים עשירים בנתרן. אין להסיק מכאן שצריך להימנע מנתרן לחלוטין: השאלה היא מהו המאזן המתאים להקשר האישי.\u003c/p>\n\u003ch4>השוואה חשובה\u003c/h4>\n\u003cp>\u003cstrong>התייבשות\u003c/strong> מתארת אובדן נוזלים ביחס למצב הגוף. \u003cstrong>היפונתרמיה\u003c/strong> מתארת ריכוז נתרן נמוך בדם, מצב שיכול להיווצר בשל עודף מים יחסי, איבוד מלחים או שילוב של גורמים. לא כל מי שחש עייף או מסוחרר במאמץ מיובש, ויש מצבים שבהם שתיית עוד מים דווקא עלולה להזיק.\u003c/p>\n\u003ch3 id=\"g-05-3\" data-page=\"17\">3. היפונתרמיה בזמן מאמץ\u003c/h3>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":35}'>שקופיות \u003cbdi>35–36\u003c/bdi>\u003c/button> מתארות היפונתרמיה בהקשר של שתיית מים רבה או איבוד נתרן. בתיאור הקורס מופיע סף של \u003cstrong>130 מילימול לליטר\u003c/strong>, אך המקורות הקליניים המקובלים מגדירים בדרך כלל היפונתרמיה בריכוז נתרן \u003cstrong>נמוך מ־135 מילימול/ליטר\u003c/strong>. לכן בחבילת הלימוד ההבדל מסומן כ״ניסוח המצגת לעומת הגדרה קלינית״, ואינו מוסתר או מוחלף בשקט.\u003c/p>\n\u003cp>התסמינים האפשריים יכולים לכלול בחילה, כאב ראש, עייפות ובלבול, ובמצבים קשים גם פרכוסים או ירידה בהכרה. מדובר במצב רפואי שדורש אבחון וטיפול מקצועי. באתר הלימוד יש להציג אותו כידע פיזיולוגי, לא ככלי לאבחון עצמי או הנחיית טיפול. במיוחד חשוב להימנע מהנחה ששתייה מוגברת היא תמיד פתרון לכל חולשה במהלך פעילות.\u003c/p>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":35}' aria-label=\"הגדלת שקופית 35\">\u003cimg src=\"images/slide_35.webp\" alt=\"שקופית 35: הצגת היפונתרמיה במצגת הקורס\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":35}'>שקופית \u003cbdi>35\u003c/bdi>\u003c/button>: הצגת היפונתרמיה במצגת הקורס\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003ch3 id=\"g-05-4\" data-page=\"17\">4. מה קורה כשאובדים נוזלים?\u003c/h3>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":39}'>שקופית \u003cbdi>39\u003c/bdi>\u003c/button> מציגה מדרג סכמטי של שיעורי איבוד משקל גוף בנוזלים והשלכות אפשריות על ביצועים. המסר העקרוני חשוב: כאשר מאזן הנוזלים נפגע, עלולים להשתנות וויסות החום, זרימת הדם, מאמץ נתפס ותפקוד פיזי וקוגניטיבי. עם זאת, אי אפשר להסיק מן הטבלה שכל אדם יגיב באופן זהה לסף מסוים של אחוז אובדן משקל. לצורך הלימוד יש להבין \u003cstrong>מגמה ומנגנון\u003c/strong> ולא לשנן את הטבלה כחוק אבחוני מדויק.\u003c/p>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":39}' aria-label=\"הגדלת שקופית 39\">\u003cimg src=\"images/slide_39.webp\" alt=\"שקופית 39: קשר בין איבוד נוזלים לביצוע\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":39}'>שקופית \u003cbdi>39\u003c/bdi>\u003c/button>: קשר בין איבוד נוזלים לביצוע\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003ch3 id=\"g-05-5\" data-page=\"18\">5. איך מעריכים איבוד נוזלים במאמץ?\u003c/h3>\n\u003cp>ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":40}'>שקופית \u003cbdi>40\u003c/bdi>\u003c/button> מוצגת השוואה בין משקל לפני אימון ולאחריו כשיטה לימודית להערכת שינוי נוזלים. אם מתאמן שקל לפני 65.0 ק״ג ואחרי 64.3 ק״ג, הפרש המשקל הוא 0.7 ק״ג. בתרגיל פשוט מניחים שכ־1 ק״ג הפרש משקף בקירוב ליטר מים, ולכן 0.7 ק״ג הם כ־700 מ״ל. אבל אם שתה 500 מ״ל במהלך האימון, האומדן הגס של איבוד הזיעה יהיה 1.2 ליטר, בהנחה שלא נתן שתן ולא היו שינויים נוספים. צריך להבחין בין \u003cstrong>שינוי במשקל\u003c/strong> לבין \u003cstrong>איבוד הזיעה הכולל\u003c/strong>.\u003c/p>\n\u003cp>נוסחה חינוכית:\u003c/p>\u003cdiv class=\"eqn\" dir=\"ltr\">Estimated sweat loss (L) ≈ pre_weight(kg) - post_weight(kg) + fluid_intake(L) - urine_output(L)\u003c/div>\u003cp>הנוסחה היא אומדן פשוט בלבד; היא אינה מחליפה התאמה מקצועית למתאמן, ודורשת יחידות עקביות ומדידה סבירה.\u003c/p>\n\u003ch4>תרגיל נוסף\u003c/h4>\n\u003cp>לפני האימון: 70.2 ק״ג. לאחר האימון: 69.5 ק״ג. נשתו 0.4 ליטר, לא הייתה הפרשת שתן.\u003cbr>שינוי המשקל: 0.7 ק״ג. אומדן זיעה: 0.7 + 0.4 = 1.1 ליטר. אם האימון נמשך 90 דקות, שיעור איבוד משוער הוא כ־0.73 ליטר בשעה.\u003c/p>\n\u003ch3 id=\"g-05-6\" data-page=\"18\">6. שתייה לפני, במהלך ואחרי הפעילות\u003c/h3>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":41}'>שקופיות \u003cbdi>41–43\u003c/bdi>\u003c/button> מציגות כללי אצבע לעיתוי שתייה ולסוג המשקה. ההנחיות שם נועדו להמחיש שהצרכים משתנים לפי עומס, סביבה ומאפיינים אישיים. חשוב במיוחד לזכור שבמאמץ ממושך יש צורך לחשוב גם על אלקטרוליטים ופחמימות, ולא רק על מים. המצגת מזכירה משקה ספורט בריכוז 4%–8% פחמימות במאמצים ארוכים. פירוש הריכוז הוא \u003cstrong>4–8 גרם פחמימות לכל 100 מ״ל משקה\u003c/strong>, כלומר 20–40 גרם ב־500 מ״ל.\u003c/p>\n\u003cp>\u003cstrong>אזהרה בהקשר לימודי:\u003c/strong> המטרה איננה ״לשתות כמה שיותר״. יש הבדל בין התאמה להפסדים לבין שתיית יתר מסוכנת. הימנעו מהצגת כלל שתייה גורף כהוראה רפואית.\u003c/p>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":43}' aria-label=\"הגדלת שקופית 43\">\u003cimg src=\"images/slide_43.webp\" alt=\"שקופית 43: סוגי משקאות במהלך מאמץ\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":43}'>שקופית \u003cbdi>43\u003c/bdi>\u003c/button>: סוגי משקאות במהלך מאמץ\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003ch3 id=\"g-05-7\" data-page=\"19\">7. שאלות הבנה\u003c/h3>\n\u003col>\u003cli>\u003cstrong>למה הזעה מסייעת בקירור?\u003c/strong> מפני שהתאדותה דורשת אנרגיה ומסייעת לפינוי חום מן הגוף.\u003c/li>\u003cli>\u003cstrong>מה ההבדל בין אובדן 0.7 ק״ג ממשקל הגוף לבין אובדן זיעה של 0.7 ליטר?\u003c/strong> הם אינם בהכרח אותו הדבר אם הייתה שתייה או יציאה של נוזלים במהלך האימון.\u003c/li>\u003cli>\u003cstrong>האם כאב ראש במאמץ מוכיח התייבשות?\u003c/strong> לא. הוא תסמין לא ספציפי ויש צורך בהקשר ובבירור מקצועי כשנדרש.\u003c/li>\u003cli>\u003cstrong>איזו טעות יש בניסיון לפתור כל בעיית עייפות במאמץ בשתיית מים מרובה?\u003c/strong> הוא מתעלם מאפשרות של היפונתרמיה וגורמים רפואיים אחרים.\u003c/li>\u003cli>\u003cstrong>איזה ידע חשוב מהטבלה ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":39}'>שקופית \u003cbdi>39\u003c/bdi>\u003c/button>?\u003c/strong> ההשפעה האפשרית של איבוד נוזלים על מערכת החום, הדם והביצוע, ולא הנחה שסף מדויק תקף לכולם.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>מילות מפתח:\u003c/strong> הזעה, התאדות, אלקטרוליט, נתרן, היפונתרמיה, התייבשות, ריכוז פחמימות במשקה, אומדן איבוד זיעה.\u003c/p>\n\u003c/section>\n\u003csection class=\"gch\" id=\"g-06\" data-page=\"20\">\u003ch2 class=\"gch-h\">\u003cspan class=\"gnum\">פרק \u003cbdi>06\u003c/bdi>\u003c/span>תוספי תזונה ומסייעים ארגוגניים בספורט\u003c/h2>\n\u003cp>\u003cstrong>מקור:\u003c/strong> \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":44}'>שקופיות \u003cbdi>44–59\u003c/bdi>\u003c/button>. זהו פרק להבנת מנגנונים, התאמה לסוג מאמץ ויכולת להבחין בין טענה מבוססת לטענה שעדיין נחקרת. אין לראות בו המלצה לצרוך תוסף, מרשם מינון או בדיקת סטטוס עדכנית של תקנות אנטי־דופינג.\u003c/p>\n\u003cdiv class=\"dg-static\" data-id=\"06-supplements\" data-cap=\"תרשים מקורי להמחשה, פרק 06\">\u003c/div>\n\u003ch3 id=\"g-06-1\" data-page=\"20\">1. לפני שמדברים על תוסף: מהי ראיה ליעילות?\u003c/h3>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":45}'>שקופיות \u003cbdi>45–46\u003c/bdi>\u003c/button> מחלקות תוספים לקבוצות לפי רמת הראיות: כאלה שדווח כי יעילותם הוכחה, כאלה שהיעילות נבדקת, כאלה שאין ראיה מספקת ליעילותם, כאלה שנאסרו לפי כללי ספורט, וכאלה שמטרתם להשלים חסר תזונתי. זו \u003cstrong>חלוקה פדגוגית של המצגת\u003c/strong>, ולא רשימה רגולטורית עדכנית ליום הבחינה. סטטוס של חומר בבדיקות סימום צריך לבדוק מול \u003cbdi>WADA\u003c/bdi> ורשימות התחרות הרלוונטיות, ולא רק לפי שקופית ישנה.\u003c/p>\n\u003cp>\u003cstrong>שלוש שאלות מפתח לכל תוסף:\u003c/strong> מהו המנגנון המוצע? לאיזה סוג מאמץ הוא עשוי להיות רלוונטי? מה המגבלות, תופעות הלוואי או חלופות המזון? כך משווים תוספים לפי עיקרון ולא לפי מותג.\u003c/p>\n\u003ch3 id=\"g-06-2\" data-page=\"20\">2. קפאין: השפעה אקוטית יחסית\u003c/h3>\n\u003cp>ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":47}'>שקופיות \u003cbdi>47–50\u003c/bdi>\u003c/button> מתואר קפאין כחומר שעשוי להשפיע על ערנות, תפיסת מאמץ ויכולת להמשיך פעילות, ובמיוחד בפעילות סבולת במצבים מסוימים. המצגת מזכירה גם שינויים בקטכולאמינים ושימוש בשומן. לצורכי מבחן יש להכיר את ההשפעה הכוללת ולא להניח שכל שיפור ביצועים נובע דווקא מ״שריפת שומן״; זה פישוט של מנגנון מורכב יותר.\u003c/p>\n\u003cp>המצגת מציינת כדוגמה טווח \u003cstrong>3–6 מ״ג לק״ג\u003c/strong> ומשך פעילות של מספר שעות עם שיא השפעה בקירוב לאחר שעה. יש הבדלים גדולים בין אנשים בתגובה ובתופעות הלוואי. מכיוון שקפאין פועל יחסית מהר, \u003cstrong>עיתוי הנטילה ביחס למאמץ\u003c/strong> עשוי להיות שיקול לימודי חשוב. זה מנוגד לתוסף שפועל דרך רוויה הדרגתית של מאגרי שריר.\u003c/p>\n\u003ch4>דוגמת חישוב למבחן\u003c/h4>\n\u003cp>אדם במשקל 70 ק״ג, חישוב תיאורטי לפי 3 מ״ג/ק״ג: 3×70 = 210 מ״ג. זהו תרגיל יחידות בלבד, \u003cstrong>לא\u003c/strong> הוראה לנטילת קפאין, והוא לא מתאים בהכרח לכל אדם.\u003c/p>\n\u003cp>\u003cstrong>שאלת עומק:\u003c/strong> למה אותו מינון בקפאין יכול להשפיע שונה על שני אנשים? בשל שונות אישית, הרגלי צריכה, רגישות, מצב בריאותי וגורמים נוספים.\u003c/p>\n\u003ch3 id=\"g-06-3\" data-page=\"21\">3. קריאטין: הגדלת יכולת מערכת הפוספאגן\u003c/h3>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":51}'>שקופיות \u003cbdi>51–53\u003c/bdi>\u003c/button> מתארות את הקריאטין כמשתתף במערכת האנרגיה \u003cbdi>ATP–CP\u003c/bdi>, המספקת אנרגיה מהירה למאמץ קצר ועצים. פוספוקריאטין מאפשר חידוש מהיר של \u003cbdi>ATP\u003c/bdi> במאמצים שבהם הביקוש מיידי וגבוה. כאשר מאגרי הקריאטין בשריר גדלים, הפעילות הרלוונטית ביותר היא בדרך כלל מאמץ קצר ועצים, לעתים במחזורים חוזרים. במצגת מוזכרים כוח, ספרינט והתאוששות בין מאמצים.\u003c/p>\n\u003cp>המצגת מדגישה שהשפעה על המאגרים נוצרת לאורך זמן, ולכן העיתוי המדויק של מנה לפני האימון פחות מרכזי מאשר בקפאין. זהו ההבדל הגדול שיש לשנן: \u003cstrong>קפאין = השפעה יחסית אקוטית ועיתוי; קריאטין = השפעה שנקשרת לשינוי מאגרי השריר לאורך זמן\u003c/strong>.\u003c/p>\n\u003ch3 id=\"g-06-4\" data-page=\"21\">4. בטא־אלנין, קרנוזין והיכולת לבפר חומציות\u003c/h3>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":54}'>שקופיות \u003cbdi>54–57\u003c/bdi>\u003c/button> מדברות על \u003cem>סותרי חומצה\u003c/em> במובן של חומרים המשפיעים על יכולת הגוף להתמודד עם שינויים בחומציות המתרחשים במאמץ עצים. \u003cstrong>קרנוזין\u003c/strong>, המצוי בשריר, קשור ליכולת הבופרינג התוך־תאית, כלומר לקליטת חלק מיוני המימן ולצמצום שינויים חדים ב־\u003cbdi>pH\u003c/bdi>. \u003cstrong>בטא־אלנין\u003c/strong> היא חומר מוצא לקרנוזין, ולכן תוספת ממנה עשויה להגדיל מאגרי קרנוזין לאורך זמן.\u003c/p>\n\u003cp>במקביל מוזכר \u003cstrong>סודיום ביקרבונאט\u003c/strong>, שהרעיון מאחוריו שונה: הגדלת יכולת הבופרינג בעיקר בנוזל החוץ־תאי. יש להימנע מלערבב בין מנגנון תוך־שרירי לזה של הנוזלים מחוץ לתאים.\u003c/p>\n\u003ch4>דיוק מדעי חשוב\u003c/h4>\n\u003cp>ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":55}'>שקופית \u003cbdi>55\u003c/bdi>\u003c/button> מוצגת שרשרת פשטנית של ״חומצת חלב ← חומציות ← עייפות״. במחקר המודרני אין לראות בלקטט עצמו את ״גורם העייפות״ באופן גורף; פעילות עצימה כוללת כמה תהליכים חופפים. לכן באתר יהיה מותר לשאול על \u003cstrong>הרעיון שמציגה השקופית\u003c/strong>, אך לא להציג את הטענה הפשטנית כקשר סיבתי יחיד ללא הסתייגות.\u003c/p>\n\u003ch3 id=\"g-06-5\" data-page=\"21\">5. אבקות חלבון: כלי נוחות, לא קסם\u003c/h3>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":58}'>שקופיות \u003cbdi>58–59\u003c/bdi>\u003c/button> מסבירות שצריכת חלבון מספקת חשובה לעלייה בכוח ולבניית שריר, אך אין הוכחה כללית לכך שצריכה מאבקה \u003cem>כשלעצמה\u003c/em> עדיפה על מזון שמספק חלבון באיכות ובכמות המתאימות. לשימוש באבקת חלבון עשוי להיות יתרון נוחות כאשר המזון אינו זמין או כשקשה להגיע לצריכה מספקת. יש להבחין גם כאן בין תוסף שמוסיף רכיב חסר לבין תוסף שמשנה את ביצועי הגוף ישירות.\u003c/p>\n\u003ch3 id=\"g-06-6\" data-page=\"22\">6. טבלת השוואה חשובה\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>תוסף\u003c/th>\u003cth>רעיון פיזיולוגי\u003c/th>\u003cth>סוג מאמץ או הקשר\u003c/th>\u003cth>עיתוי\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">קפאין\u003c/th>\u003ctd>ערנות/תפיסת מאמץ ומנגנונים נוספים\u003c/td>\u003ctd>יכול לסייע במצבי סבולת ומאמץ שונים\u003c/td>\u003ctd>השפעה אקוטית יחסית\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">קריאטין\u003c/th>\u003ctd>הגדלת מאגרי פוספוקריאטין\u003c/td>\u003ctd>מאמצים קצרים ועצימים\u003c/td>\u003ctd>שימוש לאורך זמן\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">בטא־אלנין\u003c/th>\u003ctd>העלאת קרנוזין בשריר\u003c/td>\u003ctd>מאמצים שבהם בופרינג רלוונטי\u003c/td>\u003ctd>שימוש לאורך זמן\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">סודיום ביקרבונאט\u003c/th>\u003ctd>בופרינג חוץ־תאי\u003c/td>\u003ctd>מצבי מאמץ עצים מסוימים\u003c/td>\u003ctd>תלוי אסטרטגיה, לא מפורט כמתכון\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">אבקת חלבון\u003c/th>\u003ctd>השלמה של צריכת חלבון\u003c/td>\u003ctd>נוחות תזונתית\u003c/td>\u003ctd>לפי יכולת להגיע לצריכה מספקת\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":45}' aria-label=\"הגדלת שקופית 45\">\u003cimg src=\"images/slide_45.webp\" alt=\"שקופית 45: חלוקת תוספים לפי רמת הראיות במצגת\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":45}'>שקופית \u003cbdi>45\u003c/bdi>\u003c/button>: חלוקת תוספים לפי רמת הראיות במצגת\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003ch3 id=\"g-06-7\" data-page=\"22\">7. שאלות יישום\u003c/h3>\n\u003cp>\u003cstrong>א. מדוע קריאטין מתאים יותר כעיקרון למאמצים קצרים ועצימים מאשר לריצת מרתון?\u003c/strong> מאחר שמערכת הפוספאגן מספקת \u003cbdi>ATP\u003c/bdi> במהירות למשכים קצרים, בעוד מאמץ ממושך תלוי בעיקר במסלולים אירוביים.\u003c/p>\n\u003cp>\u003cstrong>ב. מה ההבדל העיקרי בין קפאין לקריאטין בעיתוי?\u003c/strong> קפאין יכול להיות רלוונטי בסמיכות לזמן הפעילות, וקריאטין קשור יותר להצטברות מאגרים עם שימוש מתמשך.\u003c/p>\n\u003cp>\u003cstrong>ג. מדוע לא מספיק לכתוב על תוסף ״עובד״?\u003c/strong> צריך לציין לאיזה יעד, מי האוכלוסייה, איזו איכות ראיות, ומהם הסיכונים.\u003c/p>\n\u003cp>\u003cstrong>ד. מדוע אבקת חלבון אינה עדיפה אוטומטית על כריך או ארוחה?\u003c/strong> העיקר הוא כמות ואיכות הרכיבים המתקבלים ולא צורת השיווק שלהם.\u003c/p>\n\u003cp>\u003cstrong>מילות מפתח:\u003c/strong> ארגוגני, \u003cbdi>WADA\u003c/bdi>, קפאין, מחצית חיים, \u003cbdi>ATP–CP\u003c/bdi>, קריאטין, פוספוקריאטין, קרנוזין, בטא־אלנין, ביקרבונאט, אבקת חלבון.\u003c/p>\n\u003c/section>\n\u003csection class=\"gch\" id=\"g-07\" data-page=\"24\">\u003ch2 class=\"gch-h\">\u003cspan class=\"gnum\">פרק \u003cbdi>07\u003c/bdi>\u003c/span>ויטמינים, מינרלים, ברזל, סידן וסטרס חמצוני\u003c/h2>\n\u003cp>\u003cstrong>מקור:\u003c/strong> \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":60}'>שקופיות \u003cbdi>60–73\u003c/bdi>\u003c/button>. \u003cstrong>מטרת הפרק:\u003c/strong> להבין מה מאפשרים המיקרונוטריאנטים, למה מחסור חשוב ולמה תוסף ללא חסר אינו משפר אוטומטית ביצועים.\u003c/p>\n\u003cdiv class=\"dg-static\" data-id=\"08-micronutrients\" data-cap=\"תרשים מקורי להמחשה, פרק 07\">\u003c/div>\n\u003ch3 id=\"g-07-1\" data-page=\"24\">1. מיקרונוטריאנטים אינם מספקים קלוריות אך נדרשים לתפקוד\u003c/h3>\n\u003cp>מיקרונוטריאנטים הם ויטמינים ומינרלים. ה\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":61}'>שקופית \u003cbdi>61\u003c/bdi>\u003c/button> מדגישה שהם דרושים בכמויות קטנות יחסית, לעתים במיליגרמים או במיקרוגרמים, ואינם תורמים קלוריות. עם זאת, הם משתתפים במערכות אנזימתיות, הולכה עצבית, בניית רקמות, הפקת אנרגיה ותהליכים רבים נוספים. כאן חשוב במיוחד להבחין בין \u003cstrong>חומר שממנו מפיקים אנרגיה\u003c/strong> לבין \u003cstrong>חומר הנחוץ לכך שמערכת ההפקה תעבוד כראוי\u003c/strong>.\u003c/p>\n\u003ch3 id=\"g-07-2\" data-page=\"24\">2. מסיסות בוויטמינים: למה יש לזה משמעות?\u003c/h3>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":62}'>שקופית \u003cbdi>62\u003c/bdi>\u003c/button> מחלקת את הוויטמינים לפי המסיסות והאגירה. \u003cstrong>ויטמינים מסיסי שומן \u003cbdi>A\u003c/bdi>, \u003cbdi>D\u003c/bdi>, \u003cbdi>E\u003c/bdi>, \u003cbdi>K\u003c/bdi>\u003c/strong> נספגים יחד עם שומן תזונתי באופן התלוי במנגנוני ספיגה מתאימים ויכולים להיאגר בגוף. לכן צריכה גבוהה מתוספים של חלק מהם עלולה להיות בעייתית. \u003cstrong>ויטמינים מסיסי מים\u003c/strong> פועלים אחרת מבחינת פיזור ואגירה, אף שאין מכך להסיק שכל עודף שלהם תמיד בטוח.\u003c/p>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":62}'>שקופית \u003cbdi>62\u003c/bdi>\u003c/button> מתייחסת גם להשפעת כמות סיבים גבוהה על ספיגת רכיבים מסוימים. חשוב לא להפוך זאת למסקנה שסיבים ״מזיקים״: השפעתם תלויה בכמות, בסוג וברכיב, ובתזונה מאוזנת הם בדרך כלל תורמים לבריאות.\u003c/p>\n\u003ch3 id=\"g-07-3\" data-page=\"25\">3. למה תוספים אינם שווי ערך למזון מגוון?\u003c/h3>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":63}'>שקופית \u003cbdi>63\u003c/bdi>\u003c/button> קובעת שתיסוף ויטמינים ומינרלים אינו משפר באופן אוטומטי ביצועים אצל מי שמקבלים תזונה מתאימה לצורכיהם. לעומת זאת, אם קיים מחסור מתועד, תיקון החסר עשוי לשפר תפקוד ובריאות. זהו ההבדל בין \u003cstrong>תיקון בעיה קיימת\u003c/strong> לבין \u003cstrong>נטילת חומר עודף מתוך מחשבה שיהיה שיפור נוסף\u003c/strong>. המלצות לתיסוף מחייבות במציאות בדיקה והתאמה מקצועית.\u003c/p>\n\u003ch3 id=\"g-07-4\" data-page=\"25\">4. ברזל: קשר ישיר להובלת חמצן\u003c/h3>\n\u003cp>המצגת ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":64}'>שקופיות \u003cbdi>64–65\u003c/bdi>\u003c/button> מתמקדת בברזל ובהשלכות מחסור. ברזל הוא רכיב חשוב בהמוגלובין, ולכן מחסור משמעותי עשוי לפגוע ביכולת הובלת החמצן. אם המחסור מוביל לאנמיה, הוא עשוי להתבטא בעייפות, חולשה, ירידה בריכוז ובביצועים אירוביים. ההשפעה בולטת במיוחד בפעילות שבה אספקת חמצן נמשכת חיונית לאורך זמן. עם זאת, לא כל עייפות מעידה על מחסור בברזל, והבדיקה והטיפול שייכים למערכת הבריאות.\u003c/p>\n\u003cp>\u003cstrong>מקרה:\u003c/strong> אדם מתאמן מתקשה להחזיק קצב בריצה ממושכת ומתלונן על עייפות. האם מותר לקבוע שהוא סובל מאנמיה על בסיס התיאור? לא. ניתן להסביר את המנגנון האפשרי של השפעת אנמיה על ביצועים, אך לא לאבחן ללא נתונים.\u003c/p>\n\u003ch3 id=\"g-07-5\" data-page=\"25\">5. סידן: לא רק לעצמות\u003c/h3>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":66}'>שקופיות \u003cbdi>66–68\u003c/bdi>\u003c/button> מדגישות שסידן מצוי בעיקר בשלד ובשיניים אך יש לו תפקידים נוספים: הוא משתתף בתהליך כיווץ השריר, בקרישת דם ובוויסות תפקודים תאיים. ריכוז הסידן בדם נשמר בטווח מבוקר, בין השאר באמצעות מסלולים הורמונליים וויטמין \u003cbdi>D\u003c/bdi> שמשתתף בוויסות הספיגה והמאזן. חשוב לזכור שסידן אינו רק ״חומר קשיח שבונה עצם״ אלא גם יון פעיל במנגנוני איתות ובקרה.\u003c/p>\n\u003cp>\u003cstrong>תרגיל משולב:\u003c/strong> מה יקרה אם תאי שריר לא יקבלו את אות הסידן הדרוש למנגנון הכיווץ? לא תתאפשר הפעלה תקינה של אינטראקציות החלבונים המתכווצים. זה מחבר את נושא התזונה לנושא הפיזיולוגיה שנלמד קודם.\u003c/p>\n\u003ch3 id=\"g-07-6\" data-page=\"25\">6. ויטמיני \u003cbdi>B\u003c/bdi>, \u003cbdi>B12\u003c/bdi> וחומצה פולית\u003c/h3>\n\u003cp>ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":69}'>שקופית \u003cbdi>69\u003c/bdi>\u003c/button> מופיעים ויטמיני \u003cbdi>B\u003c/bdi> כמשתתפים במערכות הקשורות לניצול אנרגיה. המצגת אינה ממליצה על תיסוף גורף. \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":70}'>שקופיות \u003cbdi>70–71\u003c/bdi>\u003c/button> מתייחסות ל־\u003cbdi>B12\u003c/bdi> ולחומצה פולית, בעלי תפקיד ביצירת תאי דם אדומים ובהתנהלות תקינה של מערכת העצבים. לכן מחסור יכול להשפיע על תפקוד גופני וקוגניטיבי. ההבחנה בין מקור טבעי במזון לבין מזון מועשר חשובה: המצגת מציגה את מקור \u003cbdi>B12\u003c/bdi> מהמזון מן החי, אך גם מזון מהצומח שהועשר ב־\u003cbdi>B12\u003c/bdi> ותוספי \u003cbdi>B12\u003c/bdi> יכולים לספק אותו. יש לציין זאת במפורש ולא לנסח ״לא קיים כל מקור מחוץ למזון מהחי״.\u003c/p>\n\u003ch3 id=\"g-07-7\" data-page=\"25\">7. סטרס חמצוני ונוגדי חמצון\u003c/h3>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":72}'>שקופיות \u003cbdi>72–73\u003c/bdi>\u003c/button> מציגות \u003cstrong>סטרס חמצוני\u003c/strong> כמצב שבו קיים חוסר איזון בין ייצור חומרים מחמצנים לבין היכולת להתמודד איתם. רדיקלים חופשיים נוצרים באופן טבעי בתהליכים מטבוליים, והפקתם יכולה לעלות בזמן פעילות גופנית. \u003cstrong>נוגדי חמצון\u003c/strong> מסוגלים להשתתף בהפחתת הנזק המחמצן. חשוב לא להפוך זאת להמלצה אוטומטית על מינוני־על של תוספים, משום שגם איתותים הקשורים למאמץ ולהסתגלות לאימון מערבים תהליכים מחמצנים.\u003c/p>\n\u003ch3 id=\"g-07-8\" data-page=\"26\">8. טבלת זיכרון\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>רכיב\u003c/th>\u003cth>תפקיד מרכזי בהקשר הקורס\u003c/th>\u003cth>מה לשאול במבחן\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">ויטמינים מסיסי שומן\u003c/th>\u003ctd>ספיגה עם שומן ואגירה\u003c/td>\u003ctd>אילו אותיות נכללות בקבוצה?\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">ברזל\u003c/th>\u003ctd>חלק ממערכת הובלת החמצן\u003c/td>\u003ctd>איך אנמיה עשויה להשפיע על סבולת?\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">סידן\u003c/th>\u003ctd>עצם, כיווץ שריר וקרישה\u003c/td>\u003ctd>למה אין לראות בו רק רכיב של העצם?\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>B12\u003c/bdi> וחומצה פולית\u003c/th>\u003ctd>תהליכים הקשורים לדם ולמערכת העצבים\u003c/td>\u003ctd>כיצד חסר יכול להשפיע על תפקוד?\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">נוגדי חמצון\u003c/th>\u003ctd>הגנה מפני נזק חמצוני\u003c/td>\u003ctd>האם תיסוף תמיד משפר ביצוע? לא\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"g-07-9\" data-page=\"26\">9. שאלות עם פתרונות\u003c/h3>\n\u003col>\u003cli>\u003cstrong>מדוע תוסף ברזל עשוי לעזור לאדם עם חסר אך לא בהכרח לאחר?\u003c/strong> כי תיקון חסר יכול להחזיר תפקוד תקין, ואילו עודף אינו משפר בהכרח ביצוע.\u003c/li>\u003cli>\u003cstrong>אילו ויטמינים מסיסי שומן?\u003c/strong> \u003cbdi>A\u003c/bdi>, \u003cbdi>D\u003c/bdi>, \u003cbdi>E\u003c/bdi>, \u003cbdi>K\u003c/bdi>.\u003c/li>\u003cli>\u003cstrong>מה משותף לברזל ול־\u003cbdi>B12\u003c/bdi> מבחינת שאלת סבולת?\u003c/strong> שניהם עשויים להשפיע על מערכות הקשורות ליצירת דם או הובלת חמצן, אם קיים חסר.\u003c/li>\u003cli>\u003cstrong>מה ההבדל בין רדיקל חופשי לנוגד חמצון?\u003c/strong> הראשון עשוי להשתתף בתהליכי חמצון ולגרום נזק בעודף; השני מסייע במנגנוני הגנה מאזנים.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>מילות מפתח:\u003c/strong> מיקרונוטריאנט, מסיס שומן, \u003cbdi>ADEK\u003c/bdi>, ברזל, אנמיה, סידן, ויטמין \u003cbdi>D\u003c/bdi>, \u003cbdi>B12\u003c/bdi>, חומצה פולית, סטרס חמצוני, נוגד חמצון.\u003c/p>\n\u003c/section>\n\u003csection class=\"gch\" id=\"g-08\" data-page=\"27\">\u003ch2 class=\"gch-h\">\u003cspan class=\"gnum\">פרק \u003cbdi>08\u003c/bdi>\u003c/span>תזונה לפני אימון, במהלך האימון ובסיומו\u003c/h2>\n\u003cp>\u003cstrong>מקור:\u003c/strong> \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":74}'>שקופיות \u003cbdi>74–90\u003c/bdi>\u003c/button>. זהו פרק ארוך ויישומי במיוחד; במבחן חשוב להבין את \u003cstrong>הסיבה לכל בחירה\u003c/strong> ולא רק לזכור מזון מסוים או זמן קבוע.\u003c/p>\n\u003cdiv class=\"dg-static\" data-id=\"07-meal-timing\" data-cap=\"תרשים מקורי להמחשה, פרק 08\">\u003c/div>\n\u003ch3 id=\"g-08-1\" data-page=\"27\">1. למה עיתוי האכילה משנה?\u003c/h3>\n\u003cp>המזון צריך להסתדר עם המשימה של הגוף. לפני מאמץ חשובה זמינות אנרגיה בלי להכביד על מערכת העיכול. במהלך מאמץ ממושך ייתכן צורך להשלים נוזלים ופחמימות. לאחר מאמץ חשובה התאוששות, בניית רקמות וחידוש מאגרים. אף שהעיתוי יכול להשפיע, צריך לזכור שהצריכה היומית הכוללת והיכולת לעמוד בצרכים לאורך זמן חשובות מאוד.\u003c/p>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":76}'>שקופיות \u003cbdi>76–78\u003c/bdi>\u003c/button> מזכירות שמזונות עשירים בסיבים ובשומן מאטים את ריקון הקיבה, ולכן הם עלולים לגרום אי־נוחות בזמן ריצה עצימה. לעומת זאת, קליטת פחמימות זמינות יכולה לשמש לתגבור אנרגיה. אין פירוש הדבר ששומנים וסיבים אינם חלק חשוב מתזונה טובה, אלא ש\u003cstrong>מזון שמתאים ביום רגיל לא בהכרח מתאים בדקות שלפני מאמץ\u003c/strong>.\u003c/p>\n\u003ch3 id=\"g-08-2\" data-page=\"27\">2. הארוחה המקדימה, שעות לפני האימון\u003c/h3>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":79}'>שקופיות \u003cbdi>79–81\u003c/bdi>\u003c/button> מציגות ארוחה כ־3–4 שעות לפני פעילות אירובית. המטרות: לשמור על זמינות גלוקוז, לתמוך במאגרי גליקוגן, לדחות עייפות ולשמור על נוחות מערכת העיכול ועל מצב נוזלים מתאים. מאפייניה במצגת: בעיקר פחמימות, מעט שומן וסיבים וכמות חלבון מתונה. כאשר הזמן לאימון ארוך יחסית, יש למערכת העיכול אפשרות לעכל ארוחה משמעותית יותר מאשר סמוך מאוד לפעילות.\u003c/p>\n\u003cp>\u003cstrong>דוגמה מהמצגת:\u003c/strong> פסטה עם עוף וירקות מבושלים יכולה להתאים כארוחה מוקדמת, אך גודל המנה והתאמתה לאדם חשובים יותר משם המנה. סטודנט צריך לדעת להסביר למה ארוחה גדולה דקות ספורות לפני ספרינט ממושך בעייתית, גם אם היא עשירה בפחמימות.\u003c/p>\n\u003ch3 id=\"g-08-3\" data-page=\"28\">3. ארוחה קטנה סמוך לאימון\u003c/h3>\n\u003cp>ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":82}'>שקופיות \u003cbdi>82–84\u003c/bdi>\u003c/button> מדברים על טווח של כ־15–60 דקות לפני האימון ועל ארוחה/נשנוש קטן יחסית המספק פחמימות ומים. דוגמאות במצגת: תמרים, לחם עם ריבה או חטיף דגנים דל בסיבים ובשומן. הרעיון הוא להגביר זמינות אנרגיה בלי להעמיס על העיכול. זו אינה חובה לכל אימון, וההעדפה תלויה גם במה שכבר נאכל קודם, בשעת האימון ובניסיון האישי.\u003c/p>\n\u003ch4>מקרה החלטה\u003c/h4>\n\u003cp>שתי מתאמנות יוצאות לריצה ארוכה. אחת אכלה ארוחה מלאה לפני שלוש שעות, והשנייה יצאה מהמיטה ללא ארוחה. האם שתיהן בהכרח צריכות את אותו נשנוש? לא. תזמון, מאגרי אנרגיה, תחושה אישית והיקף המאמץ משתנים, ואין צורך להעתיק תפריט אחיד ל
