:[35],"status":"authored_from_course","enrichment":null},{"id":"N05-MCQ-007","topicId":"N05","question":"מדוע כאב ראש ועייפות אינם אבחנה מספקת של התייבשות?","options":["אין צורך בבירור סימפטומים","כל כאב ראש נגרם מחוסר HDL","התסמינים יכולים להופיע במצבים שונים","רק ספורטאים מרגישים כאב ראש"],"correctIndex":2,"explanation":"לפי שקופית 36, כאבי ראש ותשישות הם גם תסמינים של היפונתרמיה, ירידה בריכוז הנתרן בדם; לפי שקופית 64, עייפות וכאבי ראש הם גם השפעות של חסר בברזל. לכן תסמינים אלה לבדם אינם מבחינים בין המצבים, וזיהוי מצב הנוזלים מחייב הקשר ונתונים, למשל השוואת משקל הבוקר לנקודת ייחוס או שקילה לפני האימון ואחריו (שקופית 40).","difficulty":"understanding","sourceSlides":[36,40,64],"status":"authored_from_course","enrichment":null},{"id":"N05-MCQ-008","topicId":"N05","question":"מה מאפשרת שקילה לפני ואחרי אימון?","options":["לקבוע רמת B12","למדוד כמות סיבי שריר מהירים","להעריך שינוי במסת הגוף כמדד לאומדן מאזן נוזלים","לאבחן היפונתרמיה באופן ודאי"],"correctIndex":2,"explanation":"לפי שקופית 40, שקילה לפני אימון ואחריו היא מדד לאובדן הנוזלים במהלך הפעילות, והיא מאפשרת לחשב את כמות הנוזלים שיש לצרוך לשמירה על מאזן הנוזלים, נכון למאמץ ולתנאי סביבה ספציפיים. השקילה היא כלי לאומדן, לא מדידה מלאה של כל גורמי הנוזלים, ולכן גם אינה מאבחנת היפונתרמיה.","difficulty":"application","sourceSlides":[40],"status":"authored_from_course","enrichment":null},{"id":"N05-MCQ-009","topicId":"N05","question":"מדוע כמות הזיעה הכוללת יכולה להיות גדולה מהפרש המשקל?","options":["בגלל שמסת השומן תמיד זהה","משום שנשתו נוזלים במהלך המאמץ","כי בדופק גבוה אין זיעה","משום שמים אינם שוקלים דבר"],"correctIndex":1,"explanation":"שתייה במהלך האימון מצמצמת את הירידה הנמדדת במשקל.","difficulty":"basic","sourceSlides":[40],"status":"authored_from_course","enrichment":"שקופית 40 מציינת ששקילה לפני האימון ואחריו היא מדד לאובדן הנוזלים; ההבחנה בין כמות הזיעה לבין הפרש המשקל כששותים במהלך האימון היא הרחבה יישומית."},{"id":"N05-MCQ-010","topicId":"N05","question":"מה אומר ריכוז משקה ספורט של 6% פחמימות?","options":["6 גרם פחמימה ל־100 מ״ל","6 גרם חלבון לק״ג משקל","6 כדוריות דם ליחידת נפח","6 ליטר לכל 100 מ״ל"],"correctIndex":0,"explanation":"ריכוז באחוזי משקל/נפח בהקשר המצגת מתורגם לגרמים לכל 100 מ״ל.","difficulty":"understanding","sourceSlides":[43],"status":"authored_from_course","enrichment":"ההמרה מאחוזים לגרמים ל־100 מ״ל אינה כתובה בשקופית 43; השקופית מציינת רק משקה ספורט המכיל 4–8% פחמימות."},{"id":"N05-MCQ-011","topicId":"N05","question":"מה עשוי להשפיע על איבוד נוזלים במאמץ?","options":["רק סוג החלבון בארוחה","רק משקל הטלפון","רק צבע הנעליים","עצימות, משך, חום, לחות ולבוש"],"correctIndex":3,"explanation":"לפי שקופית 38, המשפיע העיקרי על כמות הנוזלים המופרשת בזיעה הוא עומס החום, והיא מושפעת גם ממשך המאמץ ועצימותו, מאקלים הסביבה ומסוג הלבוש והציוד. לפי שקופית 37, איבוד הנוזלים בהזעה גובר בתנאים של אימון, חום ולחות. אלה המשתנים הסביבתיים וההתנהגותיים שבתשובה, ולא סוג החלבון בארוחה או צבע הנעליים.","difficulty":"application","sourceSlides":[37,38],"status":"authored_from_course","enrichment":null},{"id":"N05-MCQ-012","topicId":"N05","question":"איזו טעות מסוכנת בהקשר מאזן נוזלים?","options":["לבדוק את משך הפעילות","להתייחס לתנאי הסביבה","להניח ששתייה רבה ככל האפשר תמיד מיטיבה","לשים לב למאזן אלקטרוליטים"],"correctIndex":2,"explanation":"קיים סיכון לשתיית יתר ולהיפונתרמיה במאמץ ממושך.","difficulty":"basic","sourceSlides":[35],"status":"authored_from_course","enrichment":null},{"id":"N06-MCQ-001","topicId":"N06","question":"מה פירוש תוסף ארגוגני בהקשר המצגת?","options":["חומר שמחליף מים","סוג של ויטמין חיוני בהכרח","תוסף שהופך מזון לצבע","תוסף שמטרתו לסייע בביצוע או בהפקת מאמץ"],"correctIndex":3,"explanation":"לפי שקופית 7, תוסף תזונה יכול לשמש להשלמת חסרים תזונתיים או למטרות אחרות, כמו שיפור ביצועים בספורט; תוסף ארגוגני הוא תוסף שמטרתו לשפר את הביצוע במאמץ. שקופית 63 משתמשת במונח במובן זה: תוספי ויטמינים ומינרלים ״אינם תוסף ארגוגני״, כי אינם משפרים ביצועים אצל מי שצורך תזונה מאוזנת. שקופית 45 מסווגת תוספים כאלה לפי דרגת ההוכחה ליעילותם. המצגת עוסקת אפוא בתוספים שמכוונים לביצועים, להבדיל מהשלמת חסרים.","difficulty":"understanding","sourceSlides":[7,45,63],"status":"authored_from_course","enrichment":null},{"id":"N06-MCQ-002","topicId":"N06","question":"איזו דוגמה מציגה המצגת לתוסף עם ראיות לשימוש ארגוגני?","options":["אבקת אפייה כתוסף מזון","צבע מאכל","מים מזוקקים","קריאטין"],"correctIndex":3,"explanation":"קריאטין מוזכר בקבוצת התוספים בעלי עדויות.","difficulty":"application","sourceSlides":[45],"status":"authored_from_course","enrichment":null},{"id":"N06-MCQ-003","topicId":"N06","question":"איזה שיקול מרכזי בהתאמת תוסף?","options":["מנגנון, סוג מאמץ, ראיות ובטיחות","מחיר גבוה תמיד מעיד על יעילות","צבע האריזה בלבד","מספר העוקבים של הפרסומאי"],"correctIndex":0,"explanation":"לפי שקופיות 45–46, תוספים מסווגים לפי דרגת ההוכחה ליעילותם: יש שיעילותם ובטיחותם הוכחו במחקרים מדעיים איכותיים, יש שיעילותם עדיין נבדקת, יש שאין כלל הוכחה ליעילותם, ויש האסורים לשימוש לפי WADA. בנוסף, כל תוסף מתאים לסוג מאמץ מסוים לפי מנגנון פעולתו: למשל קריאטין משתתף במסלול ATP–CP ומתאים למאמצים קצרים ועצימים (שקופית 52). לכן יש להבחין בין טענות שיווקיות לעדויות מדעיות.","difficulty":"basic","sourceSlides":[45,46,52],"status":"authored_from_course","enrichment":null},{"id":"N06-MCQ-004","topicId":"N06","question":"לאיזו מערכת אנרגיה קשור קריאטין במיוחד?","options":["מערכת החיסון הנרכשת","גליקוליזה במעי בלבד","ATP–CP","ייצור כולסטרול מ־HDL"],"correctIndex":2,"explanation":"שקופית 52 מקשרת קריאטין למערכת הפוספאגן.","difficulty":"understanding","sourceSlides":[52],"status":"authored_from_course","enrichment":null},{"id":"N06-MCQ-005","topicId":"N06","question":"איזה סוג מאמץ מתאים במיוחד לתרומת קריאטין במצגת?","options":["רק פעילות של מספר ימים בלי מנוחה","רק שינה","מאמץ קצר ועצים","רק הליכה מתונה ללא שינוי עצימות"],"correctIndex":2,"explanation":"מאגר פוספוקריאטין קשור לאספקת אנרגיה מהירה.","difficulty":"application","sourceSlides":[52],"status":"authored_from_course","enrichment":null},{"id":"N06-MCQ-006","topicId":"N06","question":"מה ההבדל בעיתוי בין קריאטין לקפאין?","options":["קריאטין הוא נוזל בלבד","שניהם עובדים רק אחרי חצי שנה","קפאין לא נספג בגוף","קריאטין קשור לשינוי מאגרים לאורך זמן וקפאין להשפעה יחסית מהירה"],"correctIndex":3,"explanation":"המצגת מבחינה בין השפעה כרונית של קריאטין לבין השפעה אקוטית יותר של קפאין.","difficulty":"basic","sourceSlides":[53],"status":"authored_from_course","enrichment":null},{"id":"N06-MCQ-007","topicId":"N06","question":"איזה תפקיד מתואר לקפאין בהקשר סבולת?","options":["מונע בכל מצב יצירת ATP","גורם תמיד להתייבשות קשה","מחליף את כל הצורך בחמצן","יכול להפחית תחושת עייפות ולסייע בשמירת עצימות"],"correctIndex":3,"explanation":"לפי שקופית 48, בסבולת לב־ריאה קפאין מאריך את משך המאמץ ודוחה את תחושת העייפות, ומסייע לשמור על מהירות או עצימות עד הגעה לתשישות. בין המנגנונים: הפרשת בטא־אנדורפינים שמפחיתה את תחושת הכאב, הפרשת קטכולאמינים (יותר אדרנלין) והגברת הליפוליזה בתאי השומן. אלה ההשפעות האפשריות של קפאין על תפיסת המאמץ ועל הביצועים.","difficulty":"understanding","sourceSlides":[48],"status":"authored_from_course","enrichment":null},{"id":"N06-MCQ-008","topicId":"N06","question":"מה חשוב לזכור לגבי תגובה לקפאין?","options":["אין הבדל בין מינון מזערי לגבוה","קיימת שונות אישית וייתכנו תופעות לוואי","כולם מגיבים באותה צורה","קפאין אינו פועל על מערכת העצבים"],"correctIndex":1,"explanation":"לפי שקופית 49, יש שונות גנטית בתגובה לקפאין: יש אנשים שאינם מושפעים ממנו כלל, ויש רגישים שיסבלו מתופעות לוואי כבר במינון נמוך. צריכה עודפת, מעל 600 מ״ג ביום, גורמת לתופעות לוואי.","difficulty":"application","sourceSlides":[49],"status":"authored_from_course","enrichment":null},{"id":"N06-MCQ-009","topicId":"N06","question":"איזה חומר הוא קודמן ליצירת קרנוזין?","options":["גליקוגן","נתרן כלורי בלבד","כולסטרול LDL","בטא־אלנין"],"correctIndex":3,"explanation":"קרנוזין נוצר בין השאר מחומצת האמינו היסטידין ובטא־אלנין.","difficulty":"basic","sourceSlides":[56],"status":"authored_from_course","enrichment":null},{"id":"N06-MCQ-010","topicId":"N06","question":"מהו תפקיד פיזיולוגי של קרנוזין בשריר?","options":["תרומה לבופרינג ושמירה על מאזן חומצה־בסיס","הובלת חמצן בנאדיות","ייצור תאי דם אדומים","אגירת סידן בעצם בלבד"],"correctIndex":0,"explanation":"קרנוזין משתתף במנגנוני חציצה בשריר.","difficulty":"understanding","sourceSlides":[56],"status":"authored_from_course","enrichment":null},{"id":"N06-MCQ-011","topicId":"N06","question":"לפי המצגת, מה מאפיין את בטא־אלנין כתוסף?","options":["תוסף שאין כל הוכחה ליעילותו","הורמון שמופרש מהלב","סותר חומצה שמעלה את רמת הקרנוזין בשריר","מקור עיקרי לחומצות שומן חיוניות"],"correctIndex":2,"explanation":"המצגת מסווגת את בטא־אלנין, יחד עם סודיום ביקרבונאט, כסותרי חומצה שיעילותם ובטיחותם הוכחו (שקופיות 45–46). בטא־אלנין מעלה את רמת הקרנוזין בשריר (שקופית 57), וקרנוזין ממלא תפקיד בשמירה על מאזן חומצה–בסיס (שקופית 56).","difficulty":"application","sourceSlides":[45,46,55,56,57],"status":"authored_from_course","enrichment":"ההבחנה בין שני סותרי החומצה, קרנוזין שפועל בתוך תאי השריר וביקרבונאט שפועל בעיקר מחוץ לתאים, אינה מופיעה במצגת."},{"id":"N06-MCQ-012","topicId":"N06","question":"מהי מסקנה סבירה לגבי תוסף חלבון לעומת חלבון ממזון?","options":["אבקה תמיד עדיפה על אוכל","לאוכל אין חומצות אמינו","העמידה בצורך התזונתי חשובה יותר מצורת השיווק","לא ניתן לספק חלבון בלי תוסף"],"correctIndex":2,"explanation":"שקופית 59 שוללת יתרון אוטומטי של אבקה על מזון.","difficulty":"basic","sourceSlides":[59],"status":"authored_from_course","enrichment":null},{"id":"N07-MCQ-001","topicId":"N07","question":"מהם מיקרונוטריאנטים?","options":["פחמימות ושומנים בלבד","גליקוגן וסיבים בלבד","ויטמינים ומינרלים","חלבונים וכולסטרול בלבד"],"correctIndex":2,"explanation":"השקופית 61 מגדירה מיקרונוטריאנטים כוויטמינים ומינרלים.","difficulty":"understanding","sourceSlides":[61],"status":"authored_from_course","enrichment":null},{"id":"N07-MCQ-002","topicId":"N07","question":"מהו מאפיין חשוב של מיקרונוטריאנטים?","options":["אין להם תפקיד במטבוליזם","הם אינם מספקים קלוריות אך נדרשים לתפקוד","אינם קיימים במזון טבעי","כל גרם שלהם מספק 9 קק״ל"],"correctIndex":1,"explanation":"היעדר קלוריות אינו אומר היעדר חשיבות.","difficulty":"application","sourceSlides":[61],"status":"authored_from_course","enrichment":null},{"id":"N07-MCQ-003","topicId":"N07","question":"אילו ויטמינים מסיסי שומן?","options":["רק B12 וחומצה פולית","B1, B2, B12 בלבד","A, D, E, K","C בלבד"],"correctIndex":2,"explanation":"לפי שקופית 62, הוויטמינים המסיסים בשומן הם A, D, E ו־K. מזון שומני מסייע בספיגתם, והם נאגרים בגוף, ולכן צריכה עודפת שלהם עלולה להזיק.","difficulty":"basic","sourceSlides":[62],"status":"authored_from_course","enrichment":null},{"id":"N07-MCQ-004","topicId":"N07","question":"למה חשוב להיזהר מעודף של חלק מהוויטמינים מסיסי השומן?","options":["כי כולם מתנדפים מייד","כי אינם נספגים במעיים","משום שחלקם יכולים להיאגר בגוף","כי הם מקור חמצן יחיד"],"correctIndex":2,"explanation":"האגירה מגבירה את החשיבות של התאמת מינון.","difficulty":"understanding","sourceSlides":[62],"status":"authored_from_course","enrichment":null},{"id":"N07-MCQ-005","topicId":"N07","question":"מתי תיסוף מיקרונוטריאנטים עשוי לסייע?","options":["תמיד ללא תלות בתזונה","כאשר יש חסר או צורך שנקבע בהערכה מקצועית","רק כששם המוצר באנגלית","לכל אדם ללא בדיקה"],"correctIndex":1,"explanation":"השקופית 63 מדגישה תיקון חסרים ולא תיסוף גורף.","difficulty":"application","sourceSlides":[63],"status":"authored_from_course","enrichment":null},{"id":"N07-MCQ-006","topicId":"N07","question":"איזה רכיב חיוני להובלת חמצן בהמוגלובין?","options":["אומגה־6","סוכר שולחני בלבד","סיב תזונתי","ברזל"],"correctIndex":3,"explanation":"ברזל הוא רכיב בהמוגלובין, ולכן הוא משתתף בהובלת החמצן. לפי המצגת, חסר בברזל המוביל לאנמיה פוגע בעיקר במאמצים אירוביים, הדורשים שימוש בחמצן (שקופית 65), ומתבטא גם בעייפות ובחולשה (שקופית 64).","difficulty":"basic","sourceSlides":[64,65],"status":"authored_from_course","enrichment":"הקשר בין ברזל להמוגלובין אינו כתוב בשקופיות; המצגת מתארת רק את השפעות החסר בברזל."},{"id":"N07-MCQ-007","topicId":"N07","question":"למה אנמיה מחוסר ברזל עשויה לפגוע בסבולת אירובית?","options":["יכולת הובלת החמצן של הדם עשויה לרדת","כי כל המים יוצאים מהגוף","כי אין צורך בחמצן במאמץ אירובי","כי קריאטין מתפרק לחלוטין"],"correctIndex":0,"explanation":"לפי שקופית 65, הפגיעה המשמעותית ביותר של חסר בברזל המוביל לאנמיה היא במאמצים אירוביים, הדורשים שימוש בחמצן, למשל ריצה של 30 דקות. היא מתבטאת בפגיעה משמעותית בצריכת החמצן המרבית (צח״מ), בירידה בסף האנאירובי ובירידה ביכולת העבודה לטווח ארוך. ההסבר המקובל לכך הוא שברזל הוא רכיב בהמוגלובין, ולכן במחסור יכולת הובלת החמצן של הדם עשויה לרדת.","difficulty":"understanding","sourceSlides":[65],"status":"authored_from_course","enrichment":"הקשר בין ברזל להמוגלובין ולהובלת חמצן אינו כתוב בשקופיות; המצגת מתארת רק את השפעות החסר בברזל."},{"id":"N07-MCQ-008","topicId":"N07","question":"איזה תפקיד יש לסידן מעבר לבניית עצם?","options":["שינוי צבע הדם","הובלת כולסטרול בלבד","פירוק גליקוגן בכבד לבדו","השתתפות בכיווץ שריר ובקרישת דם"],"correctIndex":3,"explanation":"לפי שקופית 68, מעבר לתפקידו המבני בעצם, לסידן תפקידים חשובים נוספים: תפקיד מרכזי במנגנון כיווץ השריר, השתתפות בבניית השן ותפקיד במנגנון הקרישה. לפי שקופית 66, הוא המינרל הנפוץ בגוף, ורוב הסידן מתרכז בעצמות.","difficulty":"application","sourceSlides":[66,68],"status":"authored_from_course","enrichment":null},{"id":"N07-MCQ-009","topicId":"N07","question":"איזה ויטמין קשור לוויסות ספיגת סידן?","options":["קפאין","ויטמין C בלבד","ויטמין D","ויטמין B12 בלבד"],"correctIndex":2,"explanation":"לפי שקופית 67, רמת הסידן בדם נמצאת תחת בקרה הורמונלית הדוקה, וויטמין D משפר את ספיגת הסידן.","difficulty":"basic","sourceSlides":[67],"status":"authored_from_course","enrichment":null},{"id":"N07-MCQ-010","topicId":"N07","question":"איזה תפקיד מוצג לוויטמיני B בפעילות?","options":["החלפת כל הפחמימות בתפריט","השתתפות בתהליכים הדרושים לניצול אנרגיה","נשיאת HDL בדם","אספקת 9 קק״ל לגרם"],"correctIndex":1,"explanation":"לפי שקופית 69, ויטמיני B מעורבים בייצור אנרגיה בזמן פעילות גופנית, ויש מחקרים שמראים שפעילות גופנית מעלה את הדרישה להם. ויטמיני B משמשים קו־פקטורים בתהליכים מטבוליים.","difficulty":"understanding","sourceSlides":[69],"status":"authored_from_course","enrichment":"המונח קו־פקטורים אינו מופיע במצגת; שקופית 69 מציינת רק שוויטמיני B מעורבים בייצור אנרגיה בזמן פעילות גופנית."},{"id":"N07-MCQ-011","topicId":"N07","question":"מה משותף ל־B12 ולחומצה פולית לפי המצגת?","options":["תפקיד בתהליכי יצירת תאי דם ובתפקוד תקין","שניהם מאגר גליקוגן","שניהם שומן רווי","שניהם אינם מצויים בגוף"],"correctIndex":0,"explanation":"לפי שקופית 71, ל־B12 ולחומצה פולית תפקיד חשוב בייצור תאי דם אדומים, ביצירת מתיונין ובתחזוקת מערכת העצבים המרכזית. מחסור בהם עלול להתבטא באנמיה, בעייפות ובתשישות.","difficulty":"application","sourceSlides":[71],"status":"authored_from_course","enrichment":null},{"id":"N07-MCQ-012","topicId":"N07","question":"מהו סטרס חמצוני?","options":["חוסר איזון הקשור לעלייה בחומרים מחמצנים ונזק אפשרי לתאים","רק עודף כולסטרול בכלי דם","רק מחסור בפחמימות לפני אימון","תהליך שמתרחש רק כשאין פעילות גופנית"],"correctIndex":0,"explanation":"לפי שקופית 72, סטרס חמצוני מציין עלייה בריכוז רדיקלים חופשיים, שפוגעים בתאים ועלולים להביא להרס שלהם. רדיקלים חופשיים נוצרים בתהליכי חמצון שמתרחשים בגוף כל הזמן, למשל בהפקת אנרגיה, וקצב ייצורם עולה בפעילות גופנית, ויותר ככל שהעצימות גבוהה יותר. לפי שקופית 73, נוגדי החמצון מגינים על התאים מפני הנזק הזה.","difficulty":"basic","sourceSlides":[72,73],"status":"authored_from_course","enrichment":null},{"id":"N08-MCQ-001","topicId":"N08","question":"מהי מטרת הארוחה 3–4 שעות לפני אימון אירובי לפי המצגת?","options":["זמינות אנרגיה, מאגרי גליקוגן ונוחות עיכול","יצירת מחסור במים","הצטברות שומן בלבד","ירידה מכוונת בגלוקוז"],"correctIndex":0,"explanation":"שקופית 79 מדגישה אנרגיה, דחיית עייפות ונוחות.","difficulty":"understanding","sourceSlides":[79],"status":"authored_from_course","enrichment":null},{"id":"N08-MCQ-002","topicId":"N08","question":"איזה מאפיין מתאים לארוחה מוקדמת לפני אימון עצים?","options":["רק מלח ללא מים","רק תוסף קריאטין","רק שומן וסיבים בכמות גבוהה","פחמימות עם מעט שומן וסיבים וכמות חלבון מתונה"],"correctIndex":3,"explanation":"לפי שקופית 80, הארוחה המקדימה לפני אימון אירובי מכילה בעיקר פחמימות מורכבות, לשמירה על רמות גלוקוז גבוהות בדם ועל ריכוז הגליקוגן, מעט שומן, מעט סיבים וחלבון בכמות בינונית. כמו כן לא מנסים בה מאכלים חדשים לפני תחרויות.","difficulty":"application","sourceSlides":[80],"status":"authored_from_course","enrichment":null},{"id":"N08-MCQ-003","topicId":"N08","question":"למה עדיף להימנע מארוחה גדולה מאוד סמוך למאמץ?","options":["כדי לאגור יותר LDL","כדי לבטל לחלוטין הזעה","כדי להפחית אי־נוחות בעיכול במהלך הפעילות","כדי שהלב לא יזרים דם"],"correctIndex":2,"explanation":"עיכול ותחושת כבדות עלולים להפריע למאמץ.","difficulty":"basic","sourceSlides":[84],"status":"authored_from_course","enrichment":null},{"id":"N08-MCQ-004","topicId":"N08","question":"איזה סוג נשנוש מופיע סמוך לאימון?","options":["רק ירקות ללא נוזלים","ארוחה עתירת שומן וסיבים בכמות גדולה","צלחת גדולה של בשר שומני רגע לפני","תמרים או לחם עם ריבה ומים"],"correctIndex":3,"explanation":"לפי שקופיות 82–83, ארוחה סמוך לאימון כוללת פחמימות זמינות ומים, ולא מזון עשיר בחלבון, בשומן ובסיבים. דוגמאות מהמצגת: חטיף דגנים דל בשומן ובסיבים, פרוסת לחם עם ריבה, או 2–4 תמרים.","difficulty":"understanding","sourceSlides":[82,83],"status":"authored_from_course","enrichment":null},{"id":"N08-MCQ-005","topicId":"N08","question":"מה מראה הגרף בשקופית 85 בהקשר של מאמץ ארוך?","options":["שגלוקוז אינו קשור לביצועים","שכל אדם חייב לחוות היפוגליקמיה אחרי שעתיים בדיוק","צריכת פחמימות יכולה לסייע בשמירה על זמינות גלוקוז לאורך מאמץ","שרק שומן מאפשר פעילות"],"correctIndex":2,"explanation":"לפי שקופית 85, עד שעה של פעילות ריכוז הסוכר בדם דומה אצל מתאמנים שאוכלים בזמן האימון ואצל מי שלא, ולאחר שעה ההבדל קטן. לאחר שעתיים–שלוש, ללא תיסוף יש ירידה דרסטית (היפוגליקמיה) ואי אפשר להמשיך באותה עצימות, ואילו מי שאוכל שומר על רמות סוכר יציבות יחסית; הקבוצה שלא תיספה כמעט לא הצליחה להמשיך לרכב אחרי 120 דקות. הגרף ממחיש את ההבדל בין תנאי צריכה והיעדר צריכה, אבל אינו מוכיח שכל אדם יחווה היפוגליקמיה אחרי מספר שעות קבוע.","difficulty":"application","sourceSlides":[85],"status":"authored_from_course","enrichment":null},{"id":"N08-MCQ-006","topicId":"N08","question":"באיזה מצב גדלה בדרך כלל החשיבות של תיסוף פחמימות במהלך מאמץ?","options":["תמיד בכל פעילות של 10 דקות","במאמץ ממושך שבו זמינות הדלק נעשית מגבלה","רק בזמן שינה","בלי קשר לזמן המאמץ"],"correctIndex":1,"explanation":"לפי שקופית 86, באימון של עד שעה תיסוף פחמימות אינו משפר את היכולת הגופנית, ובאימון של שעה עד שעתיים הוא לרוב אינו משפר ביצועים (למעט מאמצים לא מחזוריים, כמו כדורגל). לפי שקופית 87, במאמץ של שעתיים וחצי עד שלוש שעות ומעלה יש לתסף פחמימות החל מהשעה הראשונה. כלומר החשיבות גדלה במאמץ ממושך, שבו זמינות הדלק נעשית מגבלה.","difficulty":"basic","sourceSlides":[86,87],"status":"authored_from_course","enrichment":null},{"id":"N08-MCQ-007","topicId":"N08","question":"שקופית 87 ממליצה על שילוב של גלוקוז ופרוקטוז במאמץ ממושך. מה ההסבר המקובל לכך?","options":["כי הם חומצות שומן חיוניות","שניהם בלתי מסיסים במים","הם משתמשים במסלולי ספיגה שונים ועשויים לתרום לאספקת פחמימות","הם אותו ויטמין"],"correctIndex":2,"explanation":"לפי שקופית 87, במאמצים של שעתיים וחצי עד שלוש שעות ומעלה יש לתסף בפחמימות החל מהשעה הראשונה, ועדיפים חד־סוכרים, ובמיוחד שילוב של גלוקוז ופרוקטוז. ההסבר המקובל: שני הסוכרים נספגים במסלולים שונים, ולכן השילוב מאפשר לספק יותר פחמימות.","difficulty":"understanding","sourceSlides":[87],"status":"authored_from_course","enrichment":"ההסבר על מסלולי ספיגה שונים אינו מופיע במצגת; השקופית מציגה רק את ההמלצה."},{"id":"N08-MCQ-008","topicId":"N08","question":"מה היתרון של מזון דל בשומן ובסיבים בזמן מאמץ עצים?","options":["החלפת מערכת העצבים","ביטול הפרשת זיעה","מניעת הגעה של כל גלוקוז לדם","נוחות עיכול יחסית ומעבר מהיר יותר של פחמימות"],"correctIndex":3,"explanation":"שומן וסיבים עשויים לעכב התרוקנות קיבה ולגרום אי־נוחות.","difficulty":"application","sourceSlides":[76,77,88],"status":"authored_from_course","enrichment":null},{"id":"N08-MCQ-009","topicId":"N08","question":"מתי יש חשיבות מיוחדת לחידוש מהיר של גליקוגן אחרי אימון?","options":["רק בלילה ללא פעילות","כשהאימון הבא בעוד שבוע","תמיד בלי קשר לתוכנית","כאשר האימון הבא מתוכנן תוך פחות מכ־8 שעות"],"correctIndex":3,"explanation":"לפי שקופית 89, יש חשיבות להקפדה על אכילה מיד בסיום האימון, לחידוש מאגרי הגליקוגן בשרירים ובכבד, כאשר תדירות האימונים גבוהה והפער עד האימון הבא קצר מ־8 שעות; אחרת אין חשיבות גדולה לאכילה מיד בתום האימון. לפי שקופית 90, במצב זה ההמלצה היא 1–1.2 גרם פחמימות לק״ג לשעה ב־4 השעות הראשונות.","difficulty":"basic","sourceSlides":[89,90],"status":"authored_from_course","enrichment":"שקופית 90 מציינת 1–1.2 גרם לק״ג לשעה בלי לכתוב באיזה רכיב מדובר; הפירוש כפחמימות נשען על שקופית 89, שעוסקת בחידוש מאגרי הגליקוגן, ועל ההנחיה המקובלת."},{"id":"N08-MCQ-010","topicId":"N08","question":"מהי מטרת הארוחה אחרי אימון?","options":["הימנעות קבועה מכל פחמימה","הגדלת היפונתרמיה","חידוש מאגרי אנרגיה ותמיכה בתיקון רקמות","ביטול כל צריכת חלבון"],"correctIndex":2,"explanation":"שקופית 89 מתארת חידוש גליקוגן ותיקון נזקים.","difficulty":"understanding","sourceSlides":[89],"status":"authored_from_course","enrichment":null},{"id":"N08-MCQ-011","topicId":"N08","question":"איזו טענה על חלון האכילה נכונה יותר לפי שקופית 89?","options":["לעיתוי אין משמעות בשום מקרה","הדחיפות משתנה לפי הזמן עד לאימון הבא","חייבים תוסף יקר אחרי כל אימון","לכל אדם חובה לאכול בתוך דקה אחת"],"correctIndex":1,"explanation":"בהפרש קצר בין אימונים יש חשיבות לתזמון ולהשלמה מהירה.","difficulty":"application","sourceSlides":[89],"status":"authored_from_course","enrichment":null},{"id":"N08-MCQ-012","topicId":"N08","question":"מה פירוש משקה ספורט בריכוז 4%–8% פחמימות?","options":["4–8 גרם לכל קילוגרם גוף בכל שעה","4–8 גרם ברזל ל־100 מ״ל","4–8 גרם פחמימה ל־100 מ״ל","4–8 יחידות HDL"],"correctIndex":2,"explanation":"לפי שקופית 43, במאמצים של מעל שעה מומלץ משקה ספורט המכיל 4–8% פחמימות. אחוז במשקה מבטא גרמים בכל 100 מ״ל, ולכן 4%–8% פירושו 4–8 גרם פחמימה בכל 100 מ״ל משקה. זו יחידת ריכוז של המשקה, ולא כמות לק״ג משקל גוף או לשעה.","difficulty":"basic","sourceSlides":[43],"status":"authored_from_course","enrichment":"ההמרה מאחוזים לגרמים ל־100 מ״ל אינה כתובה בשקופית 43; השקופית מציינת רק משקה ספורט המכיל 4–8% פחמימות."}],"flashcards":[{"id":"N01-CARD-001","topicId":"N01","front":"מה ההגדרה המתאימה למאקרונוטריאנטים?","back":"פחמימות, חלבונים ושומנים שנצרכים יחסית בכמויות גדולות\n\nלפי שקופית 3, מאקרונוטריאנטים הם חלבונים, שומנים ופחמימות, והם מספקים לגוף חומרי בנייה ואנרגיה. לעומתם, מיקרונוטריאנטים, ויטמינים ומינרלים, נדרשים בכמויות קטנות של מיליגרמים או מיקרוגרמים (שקופית 61), ולכן המאקרונוטריאנטים הם אלה שנצרכים בכמויות גדולות יחסית.","type":"understanding","sourceSlides":[3,61],"enrichment":null},{"id":"N01-CARD-002","topicId":"N01","front":"מה מאפיין מיקרונוטריאנטים לעומת מאקרונוטריאנטים?","back":"הם נדרשים בדרך כלל בכמויות קטנות ואינם מקור קלורי\n\nויטמינים ומינרלים מאפשרים את שחרור האנרגיה וניצולה (שקופית 3). הם נדרשים בכמויות קטנות, מיליגרמים או מיקרוגרמים, ואינם מכילים קלוריות (שקופית 61).","type":"application","sourceSlides":[3,61],"enrichment":null},{"id":"N01-CARD-003","topicId":"N01","front":"מה מטרת קשת המזון המוצגת במצגת?","back":"להמחיש בחירות מגוונות ומאוזנות של מזון\n\nפירמידת/קשת המזון היא כלי להסברת עקרונות תזונה מגוונת.","type":"basic","sourceSlides":[4],"enrichment":null},{"id":"N01-CARD-004","topicId":"N01","front":"מה אפשר ללמוד מטבלת הערכים התזונתיים?","back":"כמות רכיבים תזונתיים ביחידת משקל או מנה מוגדרת\n\nהתווית כוללת טבלת ערכים תזונתיים עם כמויות.","type":"understanding","sourceSlides":[5],"enrichment":"מיומנות קריאת תוויות: שקופית 5 מונה את רכיבי התווית, כולל הסימון התזונתי, אבל ההבחנה בין ערכים ל־100 גרם לבין ערכים למנה, והחישוב לפיהם, אינם כתובים בה."},{"id":"N01-CARD-005","topicId":"N01","front":"מה מאפשרת רשימת רכיבים לעומת טבלת ערכים תזונתיים?","back":"לזהות ממה מורכב המוצר\n\nהרשימה מפרטת רכיבים; הטבלה מציגה ערכים וכמויות.","type":"application","sourceSlides":[5],"enrichment":null},{"id":"N01-CARD-006","topicId":"N01","front":"מהי הדוגמה המתאימה לתוסף מזון לפי המצגת?","back":"חומר משמר שמוסף בזמן ייצור\n\nתוסף מזון משמש למטרה טכנולוגית במוצר, לא להשלמה תזונתית.","type":"basic","sourceSlides":[6,7],"enrichment":null},{"id":"N01-CARD-007","topicId":"N01","front":"מהי הדוגמה המתאימה לתוסף תזונה?","back":"כמוסת ויטמין שנצרכת להשלמת חסר\n\nתוסף תזונה נועד לספק רכיב תזונתי או יעד תזונתי אחר.","type":"understanding","sourceSlides":[7],"enrichment":null},{"id":"N01-CARD-008","topicId":"N01","front":"איזה מידע חייבים לבדוק כדי להשוות בין שתי תוויות מזון?","back":"האם הערכים מוצגים ל־100 גרם או למנה ובאיזה גודל\n\nהשוואה בין מוצרים אפשרית רק על בסיס כמותי משותף: צריך לבדוק אם הערכים בסימון התזונתי מוצגים ל־100 גרם או למנה, ומה משקל המנה.","type":"application","sourceSlides":[5],"enrichment":"מיומנות קריאת תוויות: שקופית 5 מונה את רכיבי התווית, כולל הסימון התזונתי, אבל ההבחנה בין ערכים ל־100 גרם לבין ערכים למנה אינה כתובה בה."},{"id":"N01-CARD-009","topicId":"N01","front":"מה מטרת הוספת חומר משמר למזון?","back":"לצמצם קלקול ולשמור על בטיחות/איכות\n\nבשקופית 6 נזכרים בטיחות, עיכוב קלקול ושמירת איכות.","type":"basic","sourceSlides":[6,7],"enrichment":null},{"id":"N01-CARD-010","topicId":"N01","front":"היכן בתווית יש לצפות לפרטי יצרן או ארץ ייצור?","back":"במידע על המוצר והיצרן\n\nלפי שקופית 5, תווית על גבי מזון ארוז כוללת, נוסף על שם המוצר, תכולתו, מרכיביו והסימון התזונתי, גם את שם היצרן וכתובתו, או את ארץ הייצור במוצר מיובא, ואת מועד הייצור או התפוגה. לכן פרטי היצרן וארץ הייצור נמצאים במידע על המוצר והיצרן שבתווית, כחלק מסימון מוצר ארוז.","type":"understanding","sourceSlides":[5],"enrichment":null},{"id":"N01-CARD-011","topicId":"N01","front":"מוצר מתויג ב־8 גרם חלבון ל־100 גרם. כמה חלבון יש ב־250 גרם?","back":"20 גרם\n\nהתווית מציגה 8 גרם חלבון ל־100 גרם. 250 גרם הם 2.5 יחידות של 100 גרם (250 ÷ 100 = 2.5), ולכן 8 × 2.5 = 20 גרם חלבון. התרגיל הוא מיומנות קריאת תווית.","type":"application","sourceSlides":[5],"enrichment":"מיומנות קריאת תוויות: שקופית 5 מונה את רכיבי התווית, כולל הסימון התזונתי, אבל ההבחנה בין ערכים ל־100 גרם לבין ערכים למנה, והחישוב לפיהם, אינם כתובים בה."},{"id":"N01-CARD-012","topicId":"N01","front":"למה אי אפשר להסיק שארוחה מזינה רק ממספר הקלוריות?","back":"הרכב חומרים תזונתיים משתנה גם כשהקלוריות דומות\n\nערך אנרגטי וערך תזונתי הם מושגים נבדלים.","type":"basic","sourceSlides":[3],"enrichment":null},{"id":"N02-CARD-001","topicId":"N02","front":"כמה אנרגיה מפיק גרם פחמימות לפי המצגת?","back":"4 קק״ל\n\nכל גרם פחמימה מספק 4 קק״ל (שקופית 9); זהו הערך האנרגטי של פחמימות בתזונה.","type":"understanding","sourceSlides":[9],"enrichment":null},{"id":"N02-CARD-002","topicId":"N02","front":"באיזו צורה נאגרות פחמימות בגוף לפי המצגת?","back":"גליקוגן\n\nגליקוגן הוא מבנה האגירה של יחידות גלוקוז.","type":"application","sourceSlides":[12],"enrichment":null},{"id":"N02-CARD-003","topicId":"N02","front":"מה התפקיד המרכזי של גליקוגן הכבד?","back":"לסייע בשמירה על זמינות גלוקוז לדם\n\nהכבד יכול לפרק גליקוגן ולשחרר גלוקוז לדם.","type":"basic","sourceSlides":[12],"enrichment":null},{"id":"N02-CARD-004","topicId":"N02","front":"מה מאפיין גליקוגן השריר?","back":"משמש בעיקר לצורכי אותו שריר\n\nהשקופית מבחינה בין מאגר מקומי של השריר לבין מאגר הכבד.","type":"understanding","sourceSlides":[12],"enrichment":null},{"id":"N02-CARD-005","topicId":"N02","front":"איזה גורם נוסף לאינסולין עשוי להגביר כניסת גלוקוז לתא שריר?","back":"פעילות גופנית\n\nהכיווץ מעודד העברת נשאי גלוקוז אל הממברנה.","type":"application","sourceSlides":[10],"enrichment":"המצגת מדברת על העלאת רמת נשאי הגלוקוז בתא השריר (שקופיות 10–11). העברת הנשאים אל הממברנה, והשם GLUT4, אינם מופיעים בשקופיות."},{"id":"N02-CARD-006","topicId":"N02","front":"מה משותף לאינסולין ולכיווץ שריר בהקשר קליטת גלוקוז?","back":"שניהם יכולים להגביר נוכחות נשאים בממברנה בדרכים שונות\n\nלפי שקופית 10, גם אינסולין וגם פעילות גופנית גורמים לתא השריר להעלות את רמת נשאי הגלוקוז, וכך כניסת הסוכר לתאים מואצת. לפי שקופית 11, בפעילות גופנית העלייה ברמת הנשאים אינה תלויה באינסולין. כלומר ההשפעה התפקודית דומה, אבל היא מתרחשת דרך אותות שונים.","type":"basic","sourceSlides":[10,11],"enrichment":"המצגת מדברת על העלאת רמת נשאי הגלוקוז בתא השריר (שקופיות 10–11). העברת הנשאים אל הממברנה, והשם GLUT4, אינם מופיעים בשקופיות."},{"id":"N02-CARD-007","topicId":"N02","front":"מהי מטרת העמסת פחמימות לפני מאמץ ארוך?","back":"להגדיל מאגרי גליקוגן ולדחות עייפות\n\nלפי שקופית 14, העמסת פחמימות מתבצעת לפני מאמץ ארוך וקשה, כדי להגדיל ככל האפשר את מאגרי הגליקוגן ולדחות עייפות. היא יכולה להביא את כמות הגליקוגן בגוף לכ־700 גרם.","type":"understanding","sourceSlides":[14],"enrichment":null},{"id":"N02-CARD-008","topicId":"N02","front":"מהו חיסרון אפשרי של העמסת פחמימות כשאינה נחוצה?","back":"תוספת מים ומשקל ללא יתרון תפקודי ברור\n\nגליקוגן נאגָר עם מים, ולכן ייתכן משקל נוסף ותחושת כבדות.","type":"application","sourceSlides":[15],"enrichment":null},{"id":"N02-CARD-009","topicId":"N02","front":"מהו התפקיד של סיבים תזונתיים בתפריט רגיל לפי המצגת?","back":"לתרום לשובע ולפעילות מערכת העיכול\n\nסיבים עשויים להאט התרוקנות קיבה ולעודד פעילות מעיים.","type":"basic","sourceSlides":[16],"enrichment":null},{"id":"N02-CARD-010","topicId":"N02","front":"למה מקובל לצמצם סיבים ממש לפני מאמץ עצים?","back":"הם עלולים להכביד על מערכת העיכול\n\nהקשר הוא נוחות עיכול ועיתוי, לא טענה שסיבים אינם מועילים.","type":"understanding","sourceSlides":[16],"enrichment":null},{"id":"N02-CARD-011","topicId":"N02","front":"מה המסקנה העיקרית מטבלת צריכת הפחמימות בשקופית 13?","back":"הצורך בפחמימות משתנה לפי עומס ועצימות האימון\n\nלפי שקופית 13, ההמלצות לצריכת פחמימות בתזונה היומית מסתמכות על עצימות האימון או המאמץ הגופני ומשכו, על תדירות האימונים ועל היעדים בתוכנית האימון; לכן הצורך משתנה לפי עומס האימון ועצימותו. בשקופית עצמה נכתב שאין צורך לזכור מספרים אלא להבין את העיקרון.","type":"application","sourceSlides":[13],"enrichment":null},{"id":"N02-CARD-012","topicId":"N02","front":"מדוע לא נכון לומר שכל אדם מדלדל גליקוגן אחרי שעתיים בדיוק?","back":"משך הדלדול תלוי בעצימות, במאגרים ובתנאים\n\nלפי שקופית 12, גליקוגן מספיק במאמץ מתמשך ״לכשעתיים״, כלומר זהו אומדן ולא ערך מדויק. אותה שקופית מראה שהמאגרים אינם זהים אצל כולם: בממוצע אפשר לאחסן כ־500 גרם גליקוגן, וספורטאים יותר, כ־600 גרם. משך המאמץ עד לדלדול משתנה גם לפי העצימות והתנאים, והערך במצגת הוא המחשה.","type":"basic","sourceSlides":[12],"enrichment":"שקופית 12 מציינת שגליקוגן ״במאמץ מתמשך מספיק לכשעתיים״. התלות של משך הדלדול בעצימות המאמץ ובתנאים היא הרחבה: זהו אומדן לימודי ולא כלל מדויק (הערת דיוק 5)."},{"id":"N03-CARD-001","topicId":"N03","front":"ממה בנויה שרשרת חלבון?","back":"חומצות אמינו\n\nחלבונים הם פולימרים של חומצות אמינו.","type":"understanding","sourceSlides":[18],"enrichment":null},{"id":"N03-CARD-002","topicId":"N03","front":"מה ההבדל בין חומצת אמינו חיונית ללא חיונית?","back":"חיונית חייבת להתקבל מהתזונה בכמות מספקת\n\nלפי שקופית 18, לחומצות אמינו חיוניות אין בגוף מסלולים ביוכימיים לסינתזה שלהן, ולכן אי אפשר להפחית אותן מהתזונה וחייבים לקבל אותן מהמזון. חומצות אמינו לא חיוניות יכולות להיות מסונתזות בגוף, בתהליך שנקרא טראנסאמינציה, ולכן אפשר להפחית אותן מהתזונה. ההגדרה מתייחסת אפוא ליכולת הגוף לייצר את החומצה.","type":"application","sourceSlides":[18],"enrichment":null},{"id":"N03-CARD-003","topicId":"N03","front":"מהו קשר פפטידי?","back":"קשר המחבר חומצות אמינו בשרשרת\n\nשרשרת פפטידית נוצרת מקשרים בין חומצות אמינו.","type":"basic","sourceSlides":[19],"enrichment":null},{"id":"N03-CARD-004","topicId":"N03","front":"למה רצף חומצות האמינו חשוב?","back":"הוא תורם למבנה ולתפקוד הייחודי של חלבון\n\nמבנה ראשוני מסייע לקבוע את התכונות המרחביות והתפקודיות.","type":"understanding","sourceSlides":[19],"enrichment":null},{"id":"N03-CARD-005","topicId":"N03","front":"מהי דנטורציה של חלבון?","back":"שינוי במבנה המרחבי שלו\n\nלפי שקופית 20, דנטורציה היא הרס המבנה המרחבי של החלבון, למשל בחימום, בחומצה או בהקצפה, והיא עלולה לפגוע בתפקודו. המבנה הראשוני, שרשרת חומצות האמינו, אינו משתנה, וכך גם ערכו התזונתי.","type":"application","sourceSlides":[20],"enrichment":null},{"id":"N03-CARD-006","topicId":"N03","front":"מה נשמר בדרך כלל בעת דנטורציה שאינה מפרקת קשרי פפטיד?","back":"רצף חומצות האמינו\n\nשינוי הקיפול אינו חייב לשבור את השרשרת הראשונית.","type":"basic","sourceSlides":[20],"enrichment":null},{"id":"N03-CARD-007","topicId":"N03","front":"במה עוסק Amino acid scoring בשקופית?","back":"בהשוואת הרכב חומצות אמינו חיוניות לרפרנס\n\nהמדד בוחן את ההרכב הכמותי של חומצות אמינו חיוניות.","type":"understanding","sourceSlides":[21],"enrichment":null},{"id":"N03-CARD-008","topicId":"N03","front":"מהו עיקרון הדה־אמינציה?","back":"הסרת קבוצת אמינו מחומצה אמינית\n\nבתהליך מופרדת קבוצת האמינו ומאפשרת עיבוד החומר.","type":"application","sourceSlides":[18],"enrichment":null},{"id":"N03-CARD-009","topicId":"N03","front":"מהו תפקיד האוריאה בהקשר פירוק חומצות אמינו?","back":"לשאת חנקן להפרשה בשתן\n\nחנקן שמקורו במטבוליזם של חומצות אמינו מופרש בין השאר כאוריאה.","type":"basic","sourceSlides":[18],"enrichment":null},{"id":"N03-CARD-010","topicId":"N03","front":"איזו אמירה על אבקות חלבון תואמת את המצגת?","back":"אין יתרון אוטומטי לעומת מזון כשכמות ואיכות החלבון מספקות\n\nלפי שקופית 59, הקפדה על צריכת חלבון נאותה הוכחה כמשפרת כוח ומסת שריר, אבל אין הוכחה שצריכת חלבון מתוסף מביאה לתוצאות טובות יותר. שימוש בתוסף מוצדק בהיעדר מזון זמין או כשיש קושי להגיע לכמות החלבון הנדרשת מהמזון. כלומר המצגת מתייחסת לתוספים כפתרון נוחות, לא כהכרח ביולוגי.","type":"understanding","sourceSlides":[59],"enrichment":null},{"id":"N03-CARD-011","topicId":"N03","front":"מתי אבקת חלבון עשויה להיות שימושית לפי המצגת?","back":"כשקשה להשיג כמות חלבון מספקת ממזון זמין\n\nצריכת תוסף יכולה לסייע בהשלמת צרכים במגבלות מעשיות.","type":"application","sourceSlides":[59],"enrichment":null},{"id":"N03-CARD-012","topicId":"N03","front":"מה ההבדל בין חלבון לתוסף חלבון?","back":"תוסף הוא אופן אספקה, לא מולקולה בעלת תכונות קסם\n\nהצורה שבה מקבלים חלבון אינה מבטיחה תוצאה עדיפה.","type":"basic","sourceSlides":[59],"enrichment":null},{"id":"N04-CARD-001","topicId":"N04","front":"מהו הערך האנרגטי של גרם שומן בתזונה?","back":"9 קק״ל\n\nלפי שקופית 24, שומן הוא בראש ובראשונה מקור אנרגיה: כל גרם שומן בתזונה מספק 9 קק״ל, ואילו גרם שומן אגור מספק 7 קק״ל. שקופית 23 מציגה את שני הערכים יחד (7/9 קק״ל לגרם). השאלה עוסקת בשומן בתזונה, ולכן התשובה היא 9 קק״ל.","type":"understanding","sourceSlides":[23,24],"enrichment":null},{"id":"N04-CARD-002","topicId":"N04","front":"איזה תפקיד יש לשומן מעבר לאנרגיה?","back":"רכיב בממברנות ומסייע בספיגת ויטמינים מסיסי שומן\n\nשומן ממלא תפקידי מבנה, ויסות וספיגת ADEK.","type":"application","sourceSlides":[23,24],"enrichment":null},{"id":"N04-CARD-003","topicId":"N04","front":"מה מאפיין חומצת שומן רוויה?","back":"אין לה קשרים כפולים בשרשרת הפחמנים\n\nשקופית 25 מגדירה לפי היעדר קשר כפול.","type":"basic","sourceSlides":[25],"enrichment":null},{"id":"N04-CARD-004","topicId":"N04","front":"מה מאפיין חומצת שומן חד־בלתי רוויה?","back":"קשר כפול אחד\n\nלפי שקופית 25, חומצות שומן בלתי רוויות מכילות קשרים כפולים, והן נחלקות לשתי קבוצות: חד־בלתי רוויות (mono) ורב־בלתי רוויות (poly). ״חד״ מציין קשר כפול אחד, ולכן חומצת שומן חד־בלתי רוויה היא תת־קבוצה של הבלתי רוויות שיש לה קשר כפול אחד.","type":"understanding","sourceSlides":[25],"enrichment":null},{"id":"N04-CARD-005","topicId":"N04","front":"מה מאפיין חומצת שומן רב־בלתי רוויה?","back":"יותר מקשר כפול אחד\n\nרב־בלתי רוויה נבדלת במספר הקשרים הכפולים.","type":"application","sourceSlides":[25],"enrichment":null},{"id":"N04-CARD-006","topicId":"N04","front":"איך נקבעת משפחת אומגה־3?","back":"לפי מיקום הקשר הכפול הראשון מן הקצה המתילי\n\nהמונח אומגה מציין מיקום של קשר כפול.","type":"basic","sourceSlides":[25],"enrichment":"שקופית 25 מציינת שהמונח אומגה מציין את מיקום הקשר הכפול הראשון; הפירוט שהספירה מתחילה מהקצה המתילי של השרשרת אינו מופיע במצגת."},{"id":"N04-CARD-007","topicId":"N04","front":"איזו דוגמה מופיעה במצגת למקור אומגה־3?","back":"אגוזי מלך\n\nהמצגת מציינת אגוזי מלך, פשתן ודגים מסוימים.","type":"understanding","sourceSlides":[26],"enrichment":null},{"id":"N04-CARD-008","topicId":"N04","front":"מהו שומן ויסצרלי?","back":"שומן שמצטבר סביב איברים פנימיים בחלל הבטן\n\nלפי שקופית 27, הצטברות שומן סביב האיברים הפנימיים בחלל הבטן מכונה ״שומן ויסצרלי״ או ״שומן בטני״, והיא קשורה לעלייה בסיכון למחלות לב וכלי דם. לעומתו, שומן תת־עורי מצטבר מתחת לעור, בעיקר באזור הישבן והזרועות.","type":"application","sourceSlides":[27],"enrichment":null},{"id":"N04-CARD-009","topicId":"N04","front":"איזה קשר מתואר למצבור שומן ויסצרלי?","back":"קשר לסיכון מטבולי ומחלות לב וכלי דם\n\nלפי שקופית 27, הצטברות שומן ויסצרלי, סביב האיברים הפנימיים בחלל הבטן, קשורה לעלייה בסיכון למחלות לב וכלי דם. כך המצגת מדגישה את ההשפעות הבריאותיות האפשריות של פיזור השומן בגוף.","type":"basic","sourceSlides":[27],"enrichment":"הקשר לסיכון מטבולי אינו כתוב בשקופית 27; המצגת מציינת שהצטברות שומן ויסצרלי קשורה לעלייה בסיכון למחלות לב וכלי דם."},{"id":"N04-CARD-010","topicId":"N04","front":"מהו כולסטרול?","back":"סטרול השייך לקבוצה של מולקולות שומן\n\nלפי שקופית 29, כולסטרול הוא סוג שומן השייך לקבוצת הסטרואידים; מבחינה כימית הוא סטרול, ולכן מתואר כסטרול השייך למולקולות השומן. מקורו במזון מן החי בלבד, רובו מיוצר בגוף עצמו, בעיקר בכבד, והוא נישא בדם על גבי ליפופרוטאינים. הוא אינו חומצת אמינו, אינו ויטמין ואינו סוג של גליקוגן.","type":"understanding","sourceSlides":[29],"enrichment":null},{"id":"N04-CARD-011","topicId":"N04","front":"מה מתאר HDL בהקשר שקופית 31?","back":"מעורבות בהחזרת כולסטרול מן הרקמות לכבד\n\nHDL מקושר לתהליך הובלת כולסטרול בחזרה לכבד.","type":"application","sourceSlides":[31],"enrichment":null},{"id":"N04-CARD-012","topicId":"N04","front":"מה מתאר LDL בהקשר שקופית 31?","back":"מעורבות בהובלת כולסטרול מהכבד לרקמות\n\nLDL מקושר להובלת כולסטרול לכיוון הרקמות.","type":"basic","sourceSlides":[31],"enrichment":null},{"id":"N05-CARD-001","topicId":"N05","front":"איזה תפקיד מרכזי יש לנתרן?","back":"תרומה למאזן נוזלים, הולכה עצבית ותפקוד שריר\n\nלפי שקופית 33, לנתרן, האלקטרוליט הנפוץ ביותר בגוף, יש תפקיד מרכזי בשלושה תחומים: ויסות מאזן המלחים והנוזלים, הולכה עצבית ותפקוד תקין של השרירים.","type":"understanding","sourceSlides":[33],"enrichment":null},{"id":"N05-CARD-002","topicId":"N05","front":"איך נתרן יוצא מהגוף לפי המצגת?","back":"בין היתר בזיעה ובשתן\n\nנתרן מופרש מהגוף בשתן ובזיעה, והוא האלקטרוליט העיקרי שבזיעה (שקופית 33).","type":"application","sourceSlides":[33],"enrichment":null},{"id":"N05-CARD-003","topicId":"N05","front":"למה פעילות גופנית מגבירה לעתים את איבוד הנוזלים?","back":"בגלל הזעה ועלייה באיבוד דרך דרכי הנשימה\n\nלפי שקופית 38, איבוד הנוזלים גובר בעת מאמץ גופני דרך הזיעה, שהיא המנגנון העיקרי לוויסות טמפרטורת הגוף ולמניעת התחממות יתר, ודרך אובדן לחות מדרכי הנשימה. כמות הזיעה מושפעת בעיקר מעומס החום, וגם ממשך המאמץ ועצימותו, מאקלים הסביבה ומסוג הלבוש והציוד.","type":"basic","sourceSlides":[38],"enrichment":null},{"id":"N05-CARD-004","topicId":"N05","front":"מהו תפקיד עיקרי של הזעה במהלך מאמץ בחום?","back":"לסייע בוויסות חום הגוף דרך התאדות\n\nהזעה והתאדותה משמשות להעברת חום מהגוף.","type":"understanding","sourceSlides":[38],"enrichment":null},{"id":"N05-CARD-005","topicId":"N05","front":"מהי היפונתרמיה?","back":"ריכוז נתרן נמוך בדם\n\nזהו מצב הקשור לריכוז נתרן בדם, ולא מילה נרדפת להתייבשות.","type":"application","sourceSlides":[35],"enrichment":null},{"id":"N05-CARD-006","topicId":"N05","front":"איזה גורם עלול לתרום להיפונתרמיה במאמץ?","back":"שתייה מופרזת ביחס להפסדי נוזלים\n\nשתיית יתר היא גורם משמעותי אפשרי, במיוחד במאמץ ממושך.","type":"basic","sourceSlides":[35],"enrichment":null},{"id":"N05-CARD-007","topicId":"N05","front":"מדוע כאב ראש ועייפות אינם אבחנה מספקת של התייבשות?","back":"התסמינים יכולים להופיע במצבים שונים\n\nלפי שקופית 36, כאבי ראש ותשישות הם גם תסמינים של היפונתרמיה, ירידה בריכוז הנתרן בדם; לפי שקופית 64, עייפות וכאבי ראש הם גם השפעות של חסר בברזל. לכן תסמינים אלה לבדם אינם מבחינים בין המצבים, וזיהוי מצב הנוזלים מחייב הקשר ונתונים, למשל השוואת משקל הבוקר לנקודת ייחוס או שקילה לפני האימון ואחריו (שקופית 40).","type":"understanding","sourceSlides":[36,40,64],"enrichment":null},{"id":"N05-CARD-008","topicId":"N05","front":"מה מאפשרת שקילה לפני ואחרי אימון?","back":"להעריך שינוי במסת הגוף כמדד לאומדן מאזן נוזלים\n\nלפי שקופית 40, שקילה לפני אימון ואחריו היא מדד לאובדן הנוזלים במהלך הפעילות, והיא מאפשרת לחשב את כמות הנוזלים שיש לצרוך לשמירה על מאזן הנוזלים, נכון למאמץ ולתנאי סביבה ספציפיים. השקילה היא כלי לאומדן, לא מדידה מלאה של כל גורמי הנוזלים, ולכן גם אינה מאבחנת היפונתרמיה.","type":"application","sourceSlides":[40],"enrichment":null},{"id":"N05-CARD-009","topicId":"N05","front":"מדוע כמות הזיעה הכוללת יכולה להיות גדולה מהפרש המשקל?","back":"משום שנשתו נוזלים במהלך המאמץ\n\nשתייה במהלך האימון מצמצמת את הירידה הנמדדת במשקל.","type":"basic","sourceSlides":[40],"enrichment":"שקופית 40 מציינת ששקילה לפני האימון ואחריו היא מדד לאובדן הנוזלים; ההבחנה בין כמות הזיעה לבין הפרש המשקל כששותים במהלך האימון היא הרחבה יישומית."},{"id":"N05-CARD-010","topicId":"N05","front":"מה אומר ריכוז משקה ספורט של 6% פחמימות?","back":"6 גרם פחמימה ל־100 מ״ל\n\nריכוז באחוזי משקל/נפח בהקשר המצגת מתורגם לגרמים לכל 100 מ״ל.","type":"understanding","sourceSlides":[43],"enrichment":"ההמרה מאחוזים לגרמים ל־100 מ״ל אינה כתובה בשקופית 43; השקופית מציינת רק משקה ספורט המכיל 4–8% פחמימות."},{"id":"N05-CARD-011","topicId":"N05","front":"מה עשוי להשפיע על איבוד נוזלים במאמץ?","back":"עצימות, משך, חום, לחות ולבוש\n\nלפי שקופית 38, המשפיע העיקרי על כמות הנוזלים המופרשת בזיעה הוא עומס החום, והיא מושפעת גם ממשך המאמץ ועצימותו, מאקלים הסביבה ומסוג הלבוש והציוד. לפי שקופית 37, איבוד הנוזלים בהזעה גובר בתנאים של אימון, חום ולחות. אלה המשתנים הסביבתיים וההתנהגותיים שבתשובה, ולא סוג החלבון בארוחה או צבע הנעליים.","type":"application","sourceSlides":[37,38],"enrichment":null},{"id":"N05-CARD-012","topicId":"N05","front":"איזו טעות מסוכנת בהקשר מאזן נוזלים?","back":"להניח ששתייה רבה ככל האפשר תמיד מיטיבה\n\nקיים סיכון לשתיית יתר ולהיפונתרמיה במאמץ ממושך.","type":"basic","sourceSlides":[35],"enrichment":null},{"id":"N06-CARD-001","topicId":"N06","front":"מה פירוש תוסף ארגוגני בהקשר המצגת?","back":"תוסף שמטרתו לסייע בביצוע או בהפקת מאמץ\n\nלפי שקופית 7, תוסף תזונה יכול לשמש להשלמת חסרים תזונתיים או למטרות אחרות, כמו שיפור ביצועים בספורט; תוסף ארגוגני הוא תוסף שמטרתו לשפר את הביצוע במאמץ. שקופית 63 משתמשת במונח במובן זה: תוספי ויטמינים ומינרלים ״אינם תוסף ארגוגני״, כי אינם משפרים ביצועים אצל מי שצורך תזונה מאוזנת. שקופית 45 מסווגת תוספים כאלה לפי דרגת ההוכחה ליעילותם. המצגת עוסקת אפוא בתוספים שמכוונים לביצועים, להבדיל מהשלמת חסרים.","type":"understanding","sourceSlides":[7,45,63],"enrichment":null},{"id":"N06-CARD-002","topicId":"N06","front":"איזו דוגמה מציגה המצגת לתוסף עם ראיות לשימוש ארגוגני?","back":"קריאטין\n\nקריאטין מוזכר בקבוצת התוספים בעלי עדויות.","type":"application","sourceSlides":[45],"enrichment":null},{"id":"N06-CARD-003","topicId":"N06","front":"איזה שיקול מרכזי בהתאמת תוסף?","back":"מנגנון, סוג מאמץ, ראיות ובטיחות\n\nלפי שקופיות 45–46, תוספים מסווגים לפי דרגת ההוכחה ליעילותם: יש שיעילותם ובטיחותם הוכחו במחקרים מדעיים איכותיים, יש שיעילותם עדיין נבדקת, יש שאין כלל הוכחה ליעילותם, ויש האסורים לשימוש לפי WADA. בנוסף, כל תוסף מתאים לסוג מאמץ מסוים לפי מנגנון פעולתו: למשל קריאטין משתתף במסלול ATP–CP ומתאים למאמצים קצרים ועצימים (שקופית 52). לכן יש להבחין בין טענות שיווקיות לעדויות מדעיות.","type":"basic","sourceSlides":[45,46,52],"enrichment":null},{"id":"N06-CARD-004","topicId":"N06","front":"לאיזו מערכת אנרגיה קשור קריאטין במיוחד?","back":"ATP–CP\n\nשקופית 52 מקשרת קריאטין למערכת הפוספאגן.","type":"understanding","sourceSlides":[52],"enrichment":null},{"id":"N06-CARD-005","topicId":"N06","front":"איזה סוג מאמץ מתאים במיוחד לתרומת קריאטין במצגת?","back":"מאמץ קצר ועצים\n\nמאגר פוספוקריאטין קשור לאספקת אנרגיה מהירה.","type":"application","sourceSlides":[52],"enrichment":null},{"id":"N06-CARD-006","topicId":"N06","front":"מה ההבדל בעיתוי בין קריאטין לקפאין?","back":"קריאטין קשור לשינוי מאגרים לאורך זמן וקפאין להשפעה יחסית מהירה\n\nהמצגת מבחינה בין השפעה כרונית של קריאטין לבין השפעה אקוטית יותר של קפאין.","type":"basic","sourceSlides":[53],"enrichment":null},{"id":"N06-CARD-007","topicId":"N06","front":"איזה תפקיד מתואר לקפאין בהקשר סבולת?","back":"יכול להפחית תחושת עייפות ולסייע בשמירת עצימות\n\nלפי שקופית 48, בסבולת לב־ריאה קפאין מאריך את משך המאמץ ודוחה את תחושת העייפות, ומסייע לשמור על מהירות או עצימות עד הגעה לתשישות. בין המנגנונים: הפרשת בטא־אנדורפינים שמפחיתה את תחושת הכאב, הפרשת קטכולאמינים (יותר אדרנלין) והגברת הליפוליזה בתאי השומן. אלה ההשפעות האפשריות של קפאין על תפיסת המאמץ ועל הביצועים.","type":"understanding","sourceSlides":[48],"enrichment":null},{"id":"N06-CARD-008","topicId":"N06","front":"מה חשוב לזכור לגבי תגובה לקפאין?","back":"קיימת שונות אישית וייתכנו תופעות לוואי\n\nלפי שקופית 49, יש שונות גנטית בתגובה לקפאין: יש אנשים שאינם מושפעים ממנו כלל, ויש רגישים שיסבלו מתופעות לוואי כבר במינון נמוך. צריכה עודפת, מעל 600 מ״ג ביום, גורמת לתופעות לוואי.","type":"application","sourceSlides":[49],"enrichment":null},{"id":"N06-CARD-009","topicId":"N06","front":"איזה חומר הוא קודמן ליצירת קרנוזין?","back":"בטא־אלנין\n\nקרנוזין נוצר בין השאר מחומצת האמינו היסטידין ובטא־אלנין.","type":"basic","sourceSlides":[56],"enrichment":null},{"id":"N06-CARD-010","topicId":"N06","front":"מהו תפקיד פיזיולוגי של קרנוזין בשריר?","back":"תרומה לבופרינג ושמירה על מאזן חומצה־בסיס\n\nקרנוזין משתתף במנגנוני חציצה בשריר.","type":"understanding","sourceSlides":[56],"enrichment":null},{"id":"N06-CARD-011","topicId":"N06","front":"לפי המצגת, מה מאפיין את בטא־אלנין כתוסף?","back":"סותר חומצה שמעלה את רמת הקרנוזין בשריר\n\nהמצגת מסווגת את בטא־אלנין, יחד עם סודיום ביקרבונאט, כסותרי חומצה שיעילותם ובטיחותם הוכחו (שקופיות 45–46). בטא־אלנין מעלה את רמת הקרנוזין בשריר (שקופית 57), וקרנוזין ממלא תפקיד בשמירה על מאזן חומצה–בסיס (שקופית 56).","type":"application","sourceSlides":[45,46,55,56,57],"enrichment":"ההבחנה בין שני סותרי החומצה, קרנוזין שפועל בתוך תאי השריר וביקרבונאט שפועל בעיקר מחוץ לתאים, אינה מופיעה במצגת."},{"id":"N06-CARD-012","topicId":"N06","front":"מהי מסקנה סבירה לגבי תוסף חלבון לעומת חלבון ממזון?","back":"העמידה בצורך התזונתי חשובה יותר מצורת השיווק\n\nשקופית 59 שוללת יתרון אוטומטי של אבקה על מזון.","type":"basic","sourceSlides":[59],"enrichment":null},{"id":"N07-CARD-001","topicId":"N07","front":"מהם מיקרונוטריאנטים?","back":"ויטמינים ומינרלים\n\nהשקופית 61 מגדירה מיקרונוטריאנטים כוויטמינים ומינרלים.","type":"understanding","sourceSlides":[61],"enrichment":null},{"id":"N07-CARD-002","topicId":"N07","front":"מהו מאפיין חשוב של מיקרונוטריאנטים?","back":"הם אינם מספקים קלוריות אך נדרשים לתפקוד\n\nהיעדר קלוריות אינו אומר היעדר חשיבות.","type":"application","sourceSlides":[61],"enrichment":null},{"id":"N07-CARD-003","topicId":"N07","front":"אילו ויטמינים מסיסי שומן?","back":"A, D, E, K\n\nלפי שקופית 62, הוויטמינים המסיסים בשומן הם A, D, E ו־K. מזון שומני מסייע בספיגתם, והם נאגרים בגוף, ולכן צריכה עודפת שלהם עלולה להזיק.","type":"basic","sourceSlides":[62],"enrichment":null},{"id":"N07-CARD-004","topicId":"N07","front":"למה חשוב להיזהר מעודף של חלק מהוויטמינים מסיסי השומן?","back":"משום שחלקם יכולים להיאגר בגוף\n\nהאגירה מגבירה את החשיבות של התאמת מינון.","type":"understanding","sourceSlides":[62],"enrichment":null},{"id":"N07-CARD-005","topicId":"N07","front":"מתי תיסוף מיקרונוטריאנטים עשוי לסייע?","back":"כאשר יש חסר או צורך שנקבע בהערכה מקצועית\n\nהשקופית 63 מדגישה תיקון חסרים ולא תיסוף גורף.","type":"application","sourceSlides":[63],"enrichment":null},{"id":"N07-CARD-006","topicId":"N07","front":"איזה רכיב חיוני להובלת חמצן בהמוגלובין?","back":"ברזל\n\nברזל הוא רכיב בהמוגלובין, ולכן הוא משתתף בהובלת החמצן. לפי המצגת, חסר בברזל המוביל לאנמיה פוגע בעיקר במאמצים אירוביים, הדורשים שימוש בחמצן (שקופית 65), ומתבטא גם בעייפות ובחולשה (שקופית 64).","type":"basic","sourceSlides":[64,65],"enrichment":"הקשר בין ברזל להמוגלובין אינו כתוב בשקופיות; המצגת מתארת רק את השפעות החסר בברזל."},{"id":"N07-CARD-007","topicId":"N07","front":"למה אנמיה מחוסר ברזל עשויה לפגוע בסבולת אירובית?","back":"יכולת הובלת החמצן של הדם עשויה לרדת\n\nלפי שקופית 65, הפגיעה המשמעותית ביותר של חסר בברזל המוביל לאנמיה היא במאמצים אירוביים, הדורשים שימוש בחמצן, למשל ריצה של 30 דקות. היא מתבטאת בפגיעה משמעותית בצריכת החמצן המרבית (צח״מ), בירידה בסף האנאירובי ובירידה ביכולת העבודה לטווח ארוך. ההסבר המקובל לכך הוא שברזל הוא רכיב בהמוגלובין, ולכן במחסור יכולת הובלת החמצן של הדם עשויה לרדת.","type":"understanding","sourceSlides":[65],"enrichment":"הקשר בין ברזל להמוגלובין ולהובלת חמצן אינו כתוב בשקופיות; המצגת מתארת רק את השפעות החסר בברזל."},{"id":"N07-CARD-008","topicId":"N07","front":"איזה תפקיד יש לסידן מעבר לבניית עצם?","back":"השתתפות בכיווץ שריר ובקרישת דם\n\nלפי שקופית 68, מעבר לתפקידו המבני בעצם, לסידן תפקידים חשובים נוספים: תפקיד מרכזי במנגנון כיווץ השריר, השתתפות בבניית השן ותפקיד במנגנון הקרישה. לפי שקופית 66, הוא המינרל הנפוץ בגוף, ורוב הסידן מתרכז בעצמות.","type":"application","sourceSlides":[66,68],"enrichment":null},{"id":"N07-CARD-009","topicId":"N07","front":"איזה ויטמין קשור לוויסות ספיגת סידן?","back":"ויטמין D\n\nלפי שקופית 67, רמת הסידן בדם נמצאת תחת בקרה הורמונלית הדוקה, וויטמין D משפר את ספיגת הסידן.","type":"basic","sourceSlides":[67],"enrichment":null},{"id":"N07-CARD-010","topicId":"N07","front":"איזה תפקיד מוצג לוויטמיני B בפעילות?","back":"השתתפות בתהליכים הדרושים לניצול אנרגיה\n\nלפי שקופית 69, ויטמיני B מעורבים בייצור אנרגיה בזמן פעילות גופנית, ויש מחקרים שמראים שפעילות גופנית מעלה את הדרישה להם. ויטמיני B משמשים קו־פקטורים בתהליכים מטבוליים.","type":"understanding","sourceSlides":[69],"enrichment":"המונח קו־פקטורים אינו מופיע במצגת; שקופית 69 מציינת רק שוויטמיני B מעורבים בייצור אנרגיה בזמן פעילות גופנית."},{"id":"N07-CARD-011","topicId":"N07","front":"מה משותף ל־B12 ולחומצה פולית לפי המצגת?","back":"תפקיד בתהליכי יצירת תאי דם ובתפקוד תקין\n\nלפי שקופית 71, ל־B12 ולחומצה פולית תפקיד חשוב בייצור תאי דם אדומים, ביצירת מתיונין ובתחזוקת מערכת העצבים המרכזית. מחסור בהם עלול להתבטא באנמיה, בעייפות ובתשישות.","type":"application","sourceSlides":[71],"enrichment":null},{"id":"N07-CARD-012","topicId":"N07","front":"מהו סטרס חמצוני?","back":"חוסר איזון הקשור לעלייה בחומרים מחמצנים ונזק אפשרי לתאים\n\nלפי שקופית 72, סטרס חמצוני מציין עלייה בריכוז רדיקלים חופשיים, שפוגעים בתאים ועלולים להביא להרס שלהם. רדיקלים חופשיים נוצרים בתהליכי חמצון שמתרחשים בגוף כל הזמן, למשל בהפקת אנרגיה, וקצב ייצורם עולה בפעילות גופנית, ויותר ככל שהעצימות גבוהה יותר. לפי שקופית 73, נוגדי החמצון מגינים על התאים מפני הנזק הזה.","type":"basic","sourceSlides":[72,73],"enrichment":null},{"id":"N08-CARD-001","topicId":"N08","front":"מהי מטרת הארוחה 3–4 שעות לפני אימון אירובי לפי המצגת?","back":"זמינות אנרגיה, מאגרי גליקוגן ונוחות עיכול\n\nשקופית 79 מדגישה אנרגיה, דחיית עייפות ונוחות.","type":"understanding","sourceSlides":[79],"enrichment":null},{"id":"N08-CARD-002","topicId":"N08","front":"איזה מאפיין מתאים לארוחה מוקדמת לפני אימון עצים?","back":"פחמימות עם מעט שומן וסיבים וכמות חלבון מתונה\n\nלפי שקופית 80, הארוחה המקדימה לפני אימון אירובי מכילה בעיקר פחמימות מורכבות, לשמירה על רמות גלוקוז גבוהות בדם ועל ריכוז הגליקוגן, מעט שומן, מעט סיבים וחלבון בכמות בינונית. כמו כן לא מנסים בה מאכלים חדשים לפני תחרויות.","type":"application","sourceSlides":[80],"enrichment":null},{"id":"N08-CARD-003","topicId":"N08","front":"למה עדיף להימנע מארוחה גדולה מאוד סמוך למאמץ?","back":"כדי להפחית אי־נוחות בעיכול במהלך הפעילות\n\nעיכול ותחושת כבדות עלולים להפריע למאמץ.","type":"basic","sourceSlides":[84],"enrichment":null},{"id":"N08-CARD-004","topicId":"N08","front":"איזה סוג נשנוש מופיע סמוך לאימון?","back":"תמרים או לחם עם ריבה ומים\n\nלפי שקופיות 82–83, ארוחה סמוך לאימון כוללת פחמימות זמינות ומים, ולא מזון עשיר בחלבון, בשומן ובסיבים. דוגמאות מהמצגת: חטיף דגנים דל בשומן ובסיבים, פרוסת לחם עם ריבה, או 2–4 תמרים.","type":"understanding","sourceSlides":[82,83],"enrichment":null},{"id":"N08-CARD-005","topicId":"N08","front":"מה מראה הגרף בשקופית 85 בהקשר של מאמץ ארוך?","back":"צריכת פחמימות יכולה לסייע בשמירה על זמינות גלוקוז לאורך מאמץ\n\nלפי שקופית 85, עד שעה של פעילות ריכוז הסוכר בדם דומה אצל מתאמנים שאוכלים בזמן האימון ואצל מי שלא, ולאחר שעה ההבדל קטן. לאחר שעתיים–שלוש, ללא תיסוף יש ירידה דרסטית (היפוגליקמיה) ואי אפשר להמשיך באותה עצימות, ואילו מי שאוכל שומר על רמות סוכר יציבות יחסית; הקבוצה שלא תיספה כמעט לא הצליחה להמשיך לרכב אחרי 120 דקות. הגרף ממחיש את ההבדל בין תנאי צריכה והיעדר צריכה, אבל אינו מוכיח שכל אדם יחווה היפוגליקמיה אחרי מספר שעות קבוע.","type":"application","sourceSlides":[85],"enrichment":null},{"id":"N08-CARD-006","topicId":"N08","front":"באיזה מצב גדלה בדרך כלל החשיבות של תיסוף פחמימות במהלך מאמץ?","back":"במאמץ ממושך שבו זמינות הדלק נעשית מגבלה\n\nלפי שקופית 86, באימון של עד שעה תיסוף פחמימות אינו משפר את היכולת הגופנית, ובאימון של שעה עד שעתיים הוא לרוב אינו משפר ביצועים (למעט מאמצים לא מחזוריים, כמו כדורגל). לפי שקופית 87, במאמץ של שעתיים וחצי עד שלוש שעות ומעלה יש לתסף פחמימות החל מהשעה הראשונה. כלומר החשיבות גדלה במאמץ ממושך, שבו זמינות הדלק נעשית מגבלה.","type":"basic","sourceSlides":[86,87],"enrichment":null},{"id":"N08-CARD-007","topicId":"N08","front":"שקופית 87 ממליצה על שילוב של גלוקוז ופרוקטוז במאמץ ממושך. מה ההסבר המקובל לכך?","back":"הם משתמשים במסלולי ספיגה שונים ועשויים לתרום לאספקת פחמימות\n\nלפי שקופית 87, במאמצים של שעתיים וחצי עד שלוש שעות ומעלה יש לתסף בפחמימות החל מהשעה הראשונה, ועדיפים חד־סוכרים, ובמיוחד שילוב של גלוקוז ופרוקטוז. ההסבר המקובל: שני הסוכרים נספגים במסלולים שונים, ולכן השילוב מאפשר לספק יותר פחמימות.","type":"understanding","sourceSlides":[87],"enrichment":"ההסבר על מסלולי ספיגה שונים אינו מופיע במצגת; השקופית מציגה רק את ההמלצה."},{"id":"N08-CARD-008","topicId":"N08","front":"מה היתרון של מזון דל בשומן ובסיבים בזמן מאמץ עצים?","back":"נוחות עיכול יחסית ומעבר מהיר יותר של פחמימות\n\nשומן וסיבים עשויים לעכב התרוקנות קיבה ולגרום אי־נוחות.","type":"application","sourceSlides":[76,77,88],"enrichment":null},{"id":"N08-CARD-009","topicId":"N08","front":"מתי יש חשיבות מיוחדת לחידוש מהיר של גליקוגן אחרי אימון?","back":"כאשר האימון הבא מתוכנן תוך פחות מכ־8 שעות\n\nלפי שקופית 89, יש חשיבות להקפדה על אכילה מיד בסיום האימון, לחידוש מאגרי הגליקוגן בשרירים ובכבד, כאשר תדירות האימונים גבוהה והפער עד האימון הבא קצר מ־8 שעות; אחרת אין חשיבות גדולה לאכילה מיד בתום האימון. לפי שקופית 90, במצב זה ההמלצה היא 1–1.2 גרם פחמימות לק״ג לשעה ב־4 השעות הראשונות.","type":"basic","sourceSlides":[89,90],"enrichment":"שקופית 90 מציינת 1–1.2 גרם לק״ג לשעה בלי לכתוב באיזה רכיב מדובר; הפירוש כפחמימות נשען על שקופית 89, שעוסקת בחידוש מאגרי הגליקוגן, ועל ההנחיה המקובלת."},{"id":"N08-CARD-010","topicId":"N08","front":"מהי מטרת הארוחה אחרי אימון?","back":"חידוש מאגרי אנרגיה ותמיכה בתיקון רקמות\n\nשקופית 89 מתארת חידוש גליקוגן ותיקון נזקים.","type":"understanding","sourceSlides":[89],"enrichment":null},{"id":"N08-CARD-011","topicId":"N08","front":"איזו טענה על חלון האכילה נכונה יותר לפי שקופית 89?","back":"הדחיפות משתנה לפי הזמן עד לאימון הבא\n\nבהפרש קצר בין אימונים יש חשיבות לתזמון ולהשלמה מהירה.","type":"application","sourceSlides":[89],"enrichment":null},{"id":"N08-CARD-012","topicId":"N08","front":"מה פירוש משקה ספורט בריכוז 4%–8% פחמימות?","back":"4–8 גרם פחמימה ל־100 מ״ל\n\nלפי שקופית 43, במאמצים של מעל שעה מומלץ משקה ספורט המכיל 4–8% פחמימות. אחוז במשקה מבטא גרמים בכל 100 מ״ל, ולכן 4%–8% פירושו 4–8 גרם פחמימה בכל 100 מ״ל משקה. זו יחידת ריכוז של המשקה, ולא כמות לק״ג משקל גוף או לשעה.","type":"basic","sourceSlides":[43],"enrichment":"ההמרה מאחוזים לגרמים ל־100 מ״ל אינה כתובה בשקופית 43; השקופית מציינת רק משקה ספורט המכיל 4–8% פחמימות."},{"id":"N01-GLOSSCARD-01","topicId":"N01","front":"הסבירי במילים שלך: מאקרונוטריאנט","back":"פחמימה, חלבון או שומן: רכיבי מזון שנצרכים בכמויות יחסית גדולות.","type":"understanding","sourceSlides":[3,61],"enrichment":null},{"id":"N01-GLOSSCARD-02","topicId":"N01","front":"הסבירי במילים שלך: מיקרונוטריאנט","back":"ויטמין או מינרל הנדרש בכמות קטנה יחסית.","type":"understanding","sourceSlides":[3,61],"enrichment":null},{"id":"N01-GLOSSCARD-03","topicId":"N01","front":"הסבירי במילים שלך: תווית תזונתית","back":"מידע כמותי על רכיבי המזון, בדרך כלל ביחס למנה או ל־100 גרם.","type":"understanding","sourceSlides":[2,3,4,5,6,7],"enrichment":"מיומנות קריאת תוויות: שקופית 5 מונה את רכיבי התווית, כולל הסימון התזונתי, אבל ההבחנה בין ערכים ל־100 גרם לבין ערכים למנה, והחישוב לפיהם, אינם כתובים בה."},{"id":"N01-GLOSSCARD-04","topicId":"N01","front":"הסבירי במילים שלך: רכיבים","back":"חומרים שמרכיבים את מוצר המזון.","type":"understanding","sourceSlides":[2,3,4,5,6,7],"enrichment":null},{"id":"N01-GLOSSCARD-05","topicId":"N01","front":"הסבירי במילים שלך: תוסף מזון","back":"חומר המוסף למטרה טכנולוגית בתהליך הייצור.","type":"understanding","sourceSlides":[2,3,4,5,6,7],"enrichment":null},{"id":"N01-GLOSSCARD-06","topicId":"N01","front":"הסבירי במילים שלך: תוסף תזונה","back":"מוצר המשמש להשלמת רכיב תזונה או למטרה תזונתית אחרת.","type":"understanding","sourceSlides":[2,3,4,5,6,7],"enrichment":null},{"id":"N01-GLOSSCARD-07","topicId":"N01","front":"הסבירי במילים שלך: קשת המזון","back":"איור הנחיות לתזונה מגוונת ומאוזנת.","type":"understanding","sourceSlides":[2,3,4,5,6,7],"enrichment":null},{"id":"N01-GLOSSCARD-08","topicId":"N01","front":"הסבירי במילים שלך: ערך אנרגטי","back":"כמות האנרגיה המתקבלת מהמזון, בקק״ל.","type":"understanding","sourceSlides":[3,9,24],"enrichment":null},{"id":"N02-GLOSSCARD-01","topicId":"N02","front":"הסבירי במילים שלך: גלוקוז","back":"חד־סוכר המשמש דלק לתאים.","type":"understanding","sourceSlides":[9,87],"enrichment":null},{"id":"N02-GLOSSCARD-02","topicId":"N02","front":"הסבירי במילים שלך: גליקוגן","back":"צורת אגירת פחמימות בשריר ובכבד.","type":"understanding","sourceSlides":[8,9,10,11,12,13,14,15,16],"enrichment":null},{"id":"N02-GLOSSCARD-03","topicId":"N02","front":"הסבירי במילים שלך: אינסולין","back":"הורמון שיכול לעודד קליטת גלוקוז ויצירת מאגרים אחרי ארוחה.","type":"understanding","sourceSlides":[8,9,10,11,12,13,14,15,16],"enrichment":"יצירת מאגרים (גליקוגן) בהשפעת אינסולין אינה כתובה במצגת; שקופית 10 מתארת רק את העלאת נשאי הגלוקוז בתא השריר ואת הירידה ברמת הסוכר בדם."},{"id":"N02-GLOSSCARD-04","topicId":"N02","front":"הסבירי במילים שלך: GLUT4","back":"נשא גלוקוז בשריר וברקמת שומן שנוכחותו בממברנה מגיבה לאינסולין ולמאמץ.","type":"understanding","sourceSlides":[8,9,10,11,12,13,14,15,16],"enrichment":"השם GLUT4, נוכחות הנשא ברקמת שומן ותנועתו לממברנה אינם מופיעים במצגת; שקופיות 10–11 מדברות על ״נשאי גלוקוז בתא שריר״ שרמתם עולה בהשפעת אינסולין ופעילות גופנית."},{"id":"N02-GL ירי במילים שלך: חלון התאוששות","back":"פרק הזמן שבו תזמון תזונה עשוי להיות חשוב יותר, במיוחד בין אימונים קרובים.","type":"understanding","sourceSlides":[74,75,76,77,78,79,80,81,82,83,84,85,86,87,88,89,90],"enrichment":null},{"id":"N08-GLOSSCARD-08","topicId":"N08","front":"הסבירי במילים שלך: תיסוף פחמימות","back":"צריכת פחמימות במהלך פעילות כדי לשמור על זמינות דלק.","type":"understanding","sourceSlides":[74,75,76,77,78,79,80,81,82,83,84,85,86,87,88,89,90],"enrichment":null}],"trueFalse":[{"id":"TF-001","topicId":"N01","statement":"ויטמינים מספקים יותר קלוריות מפחמימות.","correct":false,"explanation":"לא נכון. ויטמינים אינם מכילים קלוריות (שקופית 61), ואילו כל גרם פחמימה מספק 4 קק״ל (שקופית 9).","sourceSlides":[9,61],"enrichment":null},{"id":"TF-002","topicId":"N01","statement":"מטרה טכנולוגית בהוספת חומר למזון שונה מהשלמת חסר תזונתי.","correct":true,"explanation":"נכון. לפי שקופית 7, תוסף מזון הוא חומר שמוסף למזון בתהליך הייצור כדי להשיג מטרה טכנולוגית, כמו חומר משמר, צבע מאכל או אבקת אפייה. תוסף תזונה מוסף שלא לצורך מטרה טכנולוגית, ואפשר לצרוך אותו גם כשלעצמו כדי להשלים חסרים תזונתיים או למטרות אחרות, כמו ויטמינים ומינרלים. זו ההבחנה בין תוסף מזון לתוסף תזונה.","sourceSlides":[7],"enrichment":null},{"id":"TF-003","topicId":"N01","statement":"ערכים ל־100 גרם זהים תמיד לערכים למנה.","correct":false,"explanation":"לא נכון. הערכים ל־100 גרם זהים לערכים למנה רק כשהמנה שוקלת בדיוק 100 גרם; אחרת צריך להמיר לפי משקל המנה.","sourceSlides":[5],"enrichment":"מיומנות קריאת תוויות: ההבחנה בין ערכים ל־100 גרם לבין ערכים למנה אינה כתובה בשקופית 5."},{"id":"TF-004","topicId":"N01","statement":"פירמידת המזון היא כלי הסברה להרכב תזונה מגוון.","correct":true,"explanation":"נכון. לפי שקופית 4, פירמידת המזון (או קשת המזון) היא צורה גרפית להעברת מסר של תזונה נבונה, שנועדה לסייע בבחירת תזונה מאוזנת ומגוונת מכל קבוצות המזון.","sourceSlides":[4],"enrichment":null},{"id":"TF-005","topicId":"N02","statement":"גליקוגן השריר וגליקוגן הכבד ממלאים את אותו תפקיד בדיוק.","correct":false,"explanation":"הכבד יכול לשחרר גלוקוז לדם ואילו השריר משתמש בעיקר במאגר המקומי.","sourceSlides":[12],"enrichment":null},{"id":"TF-006","topicId":"N02","statement":"אינסולין ופעילות גופנית עשויים שניהם לעודד כניסת גלוקוז לשריר.","correct":true,"explanation":"נכון. לפי שקופיות 10–11, גם אינסולין וגם פעילות גופנית מעלים את רמת נשאי הגלוקוז בתא השריר, אבל במנגנונים שונים: בפעילות גופנית העלייה אינה תלויה באינסולין.","sourceSlides":[10,11],"enrichment":null},{"id":"TF-007","topicId":"N02","statement":"שקופית 13 אומרת שחייבים לשנן את כל המלצות הגרם לק״ג.","correct":false,"explanation":"בשקופית כתוב במפורש שאין צורך לזכור את המספרים.","sourceSlides":[13],"enrichment":null},{"id":"TF-008","topicId":"N02","statement":"העמסת פחמימות מתאימה בהכרח לכל אימון קצר.","correct":false,"explanation":"לא נכון. לפי שקופית 14, העמסת פחמימות נעשית לפני מאמץ ארוך וקשה, כדי להגדיל את מאגרי הגליקוגן ולדחות עייפות; היא מכוונת למאמצים ארוכים שבהם זמינות הגליקוגן מגבילה. לפי שקופית 15, לפני מאמצים שאינם צפויים לרוקן את מאגרי הגליקוגן היא אינה מומלצת: אגירת הגליקוגן מביאה גם לאגירת מים, ולכן במקום יתרון מטאבולי היא עלולה לפגוע בגלל עלייה במשקל ותחושת כבדות.","sourceSlides":[14,15],"enrichment":null},{"id":"TF-009","topicId":"N03","statement":"חומצת אמינו לא חיונית אינה משמשת את הגוף.","correct":false,"explanation":"הגוף זקוק לה, אך מסוגל לייצרה.","sourceSlides":[18],"enrichment":null},{"id":"TF-010","topicId":"N03","statement":"דנטורציה של חלבון יכולה לשנות מבנה מרחבי בלי לשבור את השרשרת הראשונית.","correct":true,"explanation":"נכון. לפי שקופית 20, דנטורציה הורסת את המבנה המרחבי של החלבון (למשל בחימום, בחומצה או בהקצפה), אבל המבנה הראשוני, שרשרת חומצות האמינו, אינו משתנה, וכך גם ערכו התזונתי.","sourceSlides":[20],"enrichment":null},{"id":"TF-011","topicId":"N03","statement":"איכות חלבון קשורה גם להרכב חומצות האמינו החיוניות.","correct":true,"explanation":"Amino acid scoring בוחן אותן ביחס לרפרנס.","sourceSlides":[21],"enrichment":null},{"id":"TF-012","topicId":"N03","statement":"אבקת חלבון עדיפה תמיד על חלבון ממזון.","correct":false,"explanation":"המצגת שוללת יתרון גורף לעצם הצורה.","sourceSlides":[59],"enrichment":null},{"id":"TF-013","topicId":"N04","statement":"חומצת שומן רוויה מכילה קשר כפול אחד לפחות.","correct":false,"explanation":"לא נכון. לפי שקופית 25, חומצות שומן רוויות הן ללא קשרים כפולים; חומצות השומן הבלתי רוויות הן אלה שמכילות קשרים כפולים.","sourceSlides":[25],"enrichment":null},{"id":"TF-014","topicId":"N04","statement":"אומגה־3 היא משפחה בתוך חומצות שומן רב־בלתי רוויות.","correct":true,"explanation":"נכון. לפי שקופית 26, אומגה־3 ואומגה־6 הן שתי משפחות של חומצות שומן רב־בלתי רוויות, נוזליות בטמפרטורת החדר. לפי שקופית 25, המונח אומגה מציין את מיקום הקשר הכפול הראשון, וזה מה שמבחין בין המשפחות.","sourceSlides":[25,26],"enrichment":null},{"id":"TF-015","topicId":"N04","statement":"HDL ו־LDL הם נשאי שומנים בדם.","correct":true,"explanation":"ליפופרוטאינים מסייעים בהובלת שומנים.","sourceSlides":[31],"enrichment":null},{"id":"TF-016","topicId":"N04","statement":"כולסטרול הוא זהה לגליקוגן.","correct":false,"explanation":"לא נכון. לפי שקופית 29, כולסטרול הוא סוג שומן השייך לקבוצת הסטרואידים, שמקורו במזון מן החי ונישא בדם על גבי ליפופרוטאינים. לפי שקופית 12, גליקוגן הוא מאגר הפחמימות בגוף, בשרירים ובכבד. אלה מולקולות שונות עם תפקידים שונים.","sourceSlides":[12,29],"enrichment":null},{"id":"TF-017","topicId":"N05","statement":"אומדן הזיעה הכולל יכול להיות גדול מהירידה במשקל אם שתו במהלך האימון.","correct":true,"explanation":"יש להוסיף שתייה ולתקן הפרשות נוספות.","sourceSlides":[40],"enrichment":"אומדן הזיעה (הפרש המשקל, ועוד השתייה, פחות השתן) הוא הרחבה של שקופית 40: השקופית מציינת רק ששקילה לפני האימון ואחריו היא מדד לאובדן הנוזלים ומאפשרת לחשב כמה לשתות."},{"id":"TF-018","topicId":"N05","statement":"כל כאב ראש לאחר ריצה הוא בהכרח התייבשות.","correct":false,"explanation":"יש אבחנות אפשריות אחרות, לרבות היפונתרמיה.","sourceSlides":[36],"enrichment":null},{"id":"TF-019","topicId":"N05","statement":"שקופיות משק הנוזלים מתייחסות גם לאובדן דרך הנשימה.","correct":true,"explanation":"נכון. לפי שקופית 37, איבוד הנוזלים גובר גם דרך הנשימה, במאמץ ובגבהים, נוסף על הזעה, שתן ושלשול.","sourceSlides":[37],"enrichment":null},{"id":"TF-020","topicId":"N05","statement":"שתיית יתר במאמץ ממושך אינה יכולה להזיק.","correct":false,"explanation":"לא נכון. לפי שקופית 35, שתיית מים מרובה מדי (״הרעלת מים״) עלולה לגרום להיפונתרמיה, ירידה בריכוז הנתרן בדם.","sourceSlides":[35],"enrichment":null},{"id":"TF-021","topicId":"N06","statement":"קפאין וקריאטין מתוארים במצגת כבעלי אותו עיתוי בדיוק.","correct":false,"explanation":"האחד אקוטי יותר והשני תלוי במאגרים לאורך זמן.","sourceSlides":[53],"enrichment":null},{"id":"TF-022","topicId":"N06","statement":"קריאטין קשור למסלול ATP–CP.","correct":true,"explanation":"זהו מסלול אנרגיה למאמצים קצרים ועצימים.","sourceSlides":[52],"enrichment":null},{"id":"TF-023","topicId":"N06","statement":"בטא־אלנין קשורה להגדלת קרנוזין בשריר.","correct":true,"explanation":"נכון. לפי שקופית 57, בטא־אלנין מעלה את רמת הקרנוזין בשריר; לפי שקופית 56, ריכוז הבטא־אלנין הוא הגורם המגביל ביצירת קרנוזין.","sourceSlides":[56,57],"enrichment":null},{"id":"TF-024","topicId":"N06","statement":"לכל תוסף שכתוב עליו ״משפר ביצועים״ יש בהכרח ראיות חזקות.","correct":false,"explanation":"לא נכון. לפי שקופית 45, תוספים מסווגים לפי דרגת ההוכחה ליעילותם: לצד תוספים שיעילותם הוכחה (כמו קריאטין וקפאין) יש תוספים שיעילותם עדיין נבדקת (גלוטמין, HMB) ותוספים שאין כלל הוכחה ליעילותם (חומצות אמינו, ג׳ינסנג, קרניטין). לכן הכיתוב ״משפר ביצועים״ אינו מבטיח ראיות חזקות, ויש להבחין בין רמות ראיות ובטיחות.","sourceSlides":[45],"enrichment":null},{"id":"TF-025","topicId":"N07","statement":"ויטמינים מסיסי שומן כוללים A,D,E,K.","correct":true,"explanation":"נכון. לפי שקופית 62, הוויטמינים המסיסים בשומן הם A, D, E ו־K. מזון שומני מסייע בספיגתם, והם נאגרים בגוף, ולכן צריכה עודפת שלהם עלולה להזיק.","sourceSlides":[62],"enrichment":null},{"id":"TF-026","topicId":"N07","statement":"חסר ברזל משמעותי עשוי לפגוע בסבולת אירובית.","correct":true,"explanation":"נכון. לפי שקופית 65, חסר בברזל המוביל לאנמיה פוגע בעיקר במאמצים אירוביים, הדורשים שימוש בחמצן, וגורם לירידה ביכולת העבודה לטווח ארוך. פגיעה בהובלת חמצן עלולה לצמצם את היכולת.","sourceSlides":[65],"enrichment":"הקשר בין ברזל להמוגלובין ולהובלת חמצן אינו כתוב בשקופיות; המצגת מתארת רק את השפעות החסר בברזל."},{"id":"TF-027","topicId":"N07","statement":"סידן משתתף גם במנגנון כיווץ השריר.","correct":true,"explanation":"נכון. לפי שקופית 68, מעבר לתפקידו המבני בעצם, לסידן תפקיד מרכזי במנגנון כיווץ השריר, והוא משתתף גם בבניית השן ובמנגנון הקרישה.","sourceSlides":[68],"enrichment":null},{"id":"TF-028","topicId":"N07","statement":"תיסוף מיקרונוטריאנטים מומלץ באופן גורף לכל ספורטאי.","correct":false,"explanation":"בשקופית 63 מתואר תיסוף לפי חסר והערכה מקצועית.","sourceSlides":[63],"enrichment":null},{"id":"TF-029","topicId":"N08","statement":"סיבים ושומן עשויים להכביד על העיכול סמוך למאמץ עצים.","correct":true,"explanation":"נכון. סיבים תזונתיים ושומנים מאטים את קצב ריקון הקיבה (שקופיות 16, 77), ולכן המצגת אינה ממליצה על מזון עשיר בהם בארוחה סמוך לאימון (שקופית 83).","sourceSlides":[16,77,83],"enrichment":null},{"id":"TF-030","topicId":"N08","statement":"תוספת פחמימות במהלך מאמץ ארוך עשויה לסייע בשמירה על גלוקוז בדם.","correct":true,"explanation":"נכון. לפי שקופית 85, עד שעה ריכוז הסוכר דומה אצל מי שאוכל בזמן האימון ומי שלא, אבל לאחר שעתיים–שלוש ללא תיסוף יש ירידה חדה (היפוגליקמיה). לכן במאמץ ארוך מתספים פחמימות (שקופיות 87–88).","sourceSlides":[85,87,88],"enrichment":null},{"id":"TF-031","topicId":"N08","statement":"דחיפות חידוש הגליקוגן אינה תלויה במרווח עד האימון הבא.","correct":false,"explanation":"לא נכון. לפי שקופית 89, יש חשיבות להקפדה על אכילה מיד בסיום האימון, לחידוש מאגרי הגליקוגן, כשתדירות האימונים גבוהה והפער עד האימון הבא קצר מ־8 שעות; אחרת אין חשיבות גדולה לאכילה מיד בתום האימון. כלומר הדחיפות תלויה במרווח עד האימון הבא.","sourceSlides":[89],"enrichment":null},{"id":"TF-032","topicId":"N08","statement":"ארוחה גדולה לפני מאמץ עצים תמיד עדיפה על נשנוש קטן.","correct":false,"explanation":"ככל שמתקרבים לאימון יש לשים לב לגודל הארוחה ולנוחות העיכול.","sourceSlides":[84],"enrichment":null}],"cases":[{"id":"CASE-001","topicId":"N01","title":"שתי אריזות","scenario":"מוצר A מכיל 6 גרם חלבון למנה של 75 גרם. מוצר B מכיל 9 גרם חלבון ל־100 גרם. איזה מוצר מרוכז יותר בחלבון?","modelAnswer":"מוצר A: 6 גרם חלבון ב־75 גרם, כלומר 6 ÷ 75 × 100 = 8 גרם ל־100 גרם. מוצר B: 9 גרם ל־100 גרם. B מרוכז יותר. חייבים בסיס משקל משותף.","sourceSlides":[5],"enrichment":"מיומנות קריאת תוויות: שקופית 5 מונה את רכיבי התווית, כולל הסימון התזונתי, אבל ההבחנה בין ערכים ל־100 גרם לבין ערכים למנה, והחישוב לפיהם, אינם כתובים בה."},{"id":"CASE-002","topicId":"N01","title":"בחירת תוסף","scenario":"באריזה מופיעים ויטמין מועשר וחומר משמר. האם כל רכיב שהוסף במפעל הוא ״תוסף מזון״?","modelAnswer":"לא. מסווגים לפי מטרת ההוספה: תזונתית לעומת טכנולוגית.","sourceSlides":[7],"enrichment":null},{"id":"CASE-003","topicId":"N02","title":"צום ופעילות","scenario":"אדם לא אכל שעות רבות ואז מתחיל פעילות. איזה מאגר מסייע לשמור על גלוקוז בדם ומה שונה בשריר?","modelAnswer":"גליקוגן הכבד יכול לסייע באספקת גלוקוז לדם. גליקוגן שריר נצרך בעיקר מקומית.","sourceSlides":[12],"enrichment":null},{"id":"CASE-004","topicId":"N02","title":"סיבי מזון לפני ריצה","scenario":"מתאמנת אוכלת סלט גדול עתיר סיבים עשר דקות לפני ריצה עצימה ומרגישה אי־נוחות. הסבירו מדוע.","modelAnswer":"סיבים עשויים להאט ריקון קיבה, ובקרבה למאמץ עצים להכביד על מערכת העיכול. אין פירושו שהם מזיקים בתפריט שגרתי.","sourceSlides":[16],"enrichment":null},{"id":"CASE-005","topicId":"N03","title":"חימום ביצה","scenario":"ביצה מחוממת משנה את מרקמה. האם חומצות האמינו בחלבון נעלמו?","modelAnswer":"לא; שינוי במבנה המרחבי של החלבון אינו אומר ששרשרת חומצות האמינו נעלמה.","sourceSlides":[20],"enrichment":null},{"id":"CASE-006","topicId":"N03","title":"אבקה במקום מזון","scenario":"מתאמן מקבל את מלוא החלבון הדרוש ממזון מגוון ורוצה אבקה כי היא ״בהכרח בונה יותר שריר״. מה חסר בטענה?","modelAnswer":"אין יתרון אוטומטי לעצם הצורה של התוסף אם הצרכים, האיכות והכמות כבר מסופקים.","sourceSlides":[59],"enrichment":null},{"id":"CASE-007","topicId":"N04","title":"שתי מולקולות","scenario":"במולקולה אחת יש אפס קשרים כפולים ובשנייה שניים. איך תסווגו אותן?","modelAnswer":"הראשונה רוויה, כי לפי שקופית 25 חומצות שומן רוויות הן ללא קשרים כפולים. השנייה רב־בלתי רוויה: היא מכילה קשרים כפולים, ולכן היא בלתי רוויה, ויש בה יותר מקשר כפול אחד, ולכן היא שייכת לקבוצת הרב־בלתי רוויות (poly) ולא לחד־בלתי רוויות (mono).","sourceSlides":[25],"enrichment":null},{"id":"CASE-008","topicId":"N04","title":"סיכון מטבולי","scenario":"שני אנשים בעלי מסת שומן דומה אך פיזור שונה: אחד עם יותר שומן ויסצרלי. מה ההשלכה האפשרית?","modelAnswer":"לפי שקופית 27, הצטברות שומן ויסצרלי, סביב האיברים הפנימיים בחלל הבטן, קשורה לעלייה בסיכון למחלות לב וכלי דם. לכן אצל מי שיש לו יותר שומן ויסצרלי צפוי סיכון מטבולי וכלי דם גבוה יותר, גם כשמסת השומן הכוללת דומה; ההשוואה אינה אבחנה של אדם מסוים.","sourceSlides":[27],"enrichment":"הקשר לסיכון מטבולי אינו כתוב בשקופית 27; המצגת מציינת שהצטברות שומן ויסצרלי קשורה לעלייה בסיכון למחלות לב וכלי דם."},{"id":"CASE-009","topicId":"N05","title":"אומדן זיעה","scenario":"לפני אימון 70.0 ק״ג, אחרי 69.4 ק״ג, במהלך האימון נשתו 0.5 ליטר. אין שתן. חשבו אומדן זיעה.","modelAnswer":"אובדן משקל: 70.0 − 69.4 = 0.6 ק״ג, שהם בקירוב 0.6 ליטר נוזלים. מוסיפים את השתייה במהלך האימון: 0.6 + 0.5 = 1.1 ליטר זיעה בקירוב (אין שתן להפחית).","sourceSlides":[40],"enrichment":"אומדן הזיעה (הפרש המשקל, ועוד השתייה, פחות השתן) הוא הרחבה של שקופית 40: השקופית מציינת רק ששקילה לפני האימון ואחריו היא מדד לאובדן הנוזלים ומאפשרת לחשב כמה לשתות. גם ההנחה שק״ג אחד של הפרש משקל שווה בקירוב לליטר נוזלים אינה כתובה במצגת."},{"id":"CASE-010","topicId":"N05","title":"עייפות ושתייה","scenario":"רץ מסיים מאמץ ממושך עם כאב ראש אחרי ששתה כמויות גדולות מאוד. האם ברור שהוא ״צריך עוד מים״?","modelAnswer":"לא. יש להביא בחשבון גם היפונתרמיה ולפנות להערכה רפואית מתאימה לפי חומרת התסמינים.","sourceSlides":[35,36],"enrichment":null},{"id":"CASE-011","topicId":"N06","title":"בחירת תוסף לס
