כל מצב.\u003c/p>\n\u003ch3 id=\"g-08-4\" data-page=\"28\">4. מה קורה במהלך פעילות מתמשכת?\u003c/h3>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":85}'>שקופית \u003cbdi>85\u003c/bdi>\u003c/button> מציגה גרף להשוואת ריכוזי גלוקוז והיכולת להמשיך במאמץ בנוכחות או בהיעדר צריכת פחמימות. חשוב לתאר את \u003cstrong>מה שהגרף מנסה להמחיש\u003c/strong>: במאמץ ממושך, אספקת פחמימות מבחוץ עשויה לסייע לשמירה על זמינות גלוקוז, בעוד ללא צריכה יכולות להתרחש ירידות משמעותיות בחלק מהמצבים. אסור לנסח מכך ״כל אדם יחווה היפוגליקמיה אחרי שעתיים בדיוק״.\u003c/p>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":85}' aria-label=\"הגדלת שקופית 85\">\u003cimg src=\"images/slide_85.webp\" alt=\"שקופית 85: גרף השפעת צריכת פחמימות במהלך מאמץ\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":85}'>שקופית \u003cbdi>85\u003c/bdi>\u003c/button>: גרף השפעת צריכת פחמימות במהלך מאמץ\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":86}'>שקופיות \u003cbdi>86–88\u003c/bdi>\u003c/button> מציגות הבחנה בין פעילות קצרה, פעילות של כשעה עד שעתיים, ופעילות ממושכת יותר. המסר היישומי: במאמץ קצר יחסית, במיוחד לאחר תזונה מספקת, תרומת האכילה תוך כדי יכולה להיות קטנה. ככל שהפעילות מתמשכת, הסבירות לתועלת מצריכת פחמימות גדלה. באימוני משחק מתחלפים שמערבים ריכוז ושינויים בעצימות ייתכנו שיקולים אחרים מאשר בפעילות מחזורית מתונה.\u003c/p>\n\u003cp>המצגת מזכירה שילוב של גלוקוז ופרוקטוז בפעילות ארוכה. בהעשרה: אלו חד־סוכרים המשתמשים במנגנוני ספיגה שונים, ולכן שילובם יכול לסייע כשצריכת הפחמימות גבוהה במאמצי סבולת ארוכים. אין צורך לתת לפרק זה מתכון נטילה אישי.\u003c/p>\n\u003ch3 id=\"g-08-5\" data-page=\"29\">5. מה אוכלים במהלך אימון?\u003c/h3>\n\u003cp>האפשרויות ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":88}'>שקופית \u003cbdi>88\u003c/bdi>\u003c/button> כוללות משקה ספורט, ג׳ל אנרגיה, סוכריות אנרגיה, חטיפים מתאימים ותמרים. העיקרון אינו שם המסחרי של המוצר אלא תפקידו: לספק פחמימות זמינות תוך שמירה על נוחות עיכול. חשוב להימנע מכמות גבוהה של שומן וסיבים ממש במהלך פעילות עצימה, משום שהם מתעכלים לאט יותר ועשויים לגרום אי־נוחות.\u003c/p>\n\u003cp>\u003cstrong>תרגיל:\u003c/strong> משקה ספורט מכיל 6% פחמימות. כמה גרם פחמימות יש ב־750 מ״ל? 6 גרם בכל 100 מ״ל ← 6×7.5 = 45 גרם. זהו תרגיל מתמטי, לא המלצה כמה לשתות.\u003c/p>\n\u003ch3 id=\"g-08-6\" data-page=\"29\">6. התאוששות וארוחה לאחר האימון\u003c/h3>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":89}'>שקופיות \u003cbdi>89–90\u003c/bdi>\u003c/button> מתמקדות בחידוש מאגרי הגליקוגן ובתיקון/בניית רקמות. אם מתאמנת צריכה לבצע אימון נוסף בתוך פחות מ־8 שעות, לחידוש מהיר של מאגרי האנרגיה יש חשיבות מיוחדת. אם המאמץ הבא רחוק יותר, לעיתים קרובות אפשר להסתמך על ארוחות מסודרות במהלך היום במקום להילחץ מחלון של דקות ספורות בלבד. ההיגיון הזה חשוב יותר מהשינון של מספר אחד.\u003c/p>\n\u003cp>המצגת מציגה ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":90}'>שקופית \u003cbdi>90\u003c/bdi>\u003c/button> קצב לימודי של כ־1–1.2 גרם פחמימות לק״ג משקל לשעה במשך כמה שעות במצב התאוששות מהירה. \u003cstrong>דוגמת חישוב בלבד:\u003c/strong> מתאמנת במשקל 60 ק״ג, לפי 1 גרם לק״ג לשעה: 60 גרם פחמימות בשעה. אין בכך הנחיית תזונה אישית.\u003c/p>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":90}' aria-label=\"הגדלת שקופית 90\">\u003cimg src=\"images/slide_90.webp\" alt=\"שקופית 90: תכנון ארוחה והתאוששות לאחר מאמץ\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":90}'>שקופית \u003cbdi>90\u003c/bdi>\u003c/button>: תכנון ארוחה והתאוששות לאחר מאמץ\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003ch3 id=\"g-08-7\" data-page=\"29\">7. טבלת תזמון והשוואה\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>שלב\u003c/th>\u003cth>מה מנסים להשיג?\u003c/th>\u003cth>מה חשוב להבין?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">שעות לפני\u003c/th>\u003ctd>אנרגיה, מאגרים, עיכול נוח\u003c/td>\u003ctd>ארוחה מלאה דורשת זמן עיכול\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">קרוב לאימון\u003c/th>\u003ctd>תוספת אנרגיה זמינה\u003c/td>\u003ctd>נשנוש קטן, התאמה אישית\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">במהלך ארוך\u003c/th>\u003ctd>שמירה על פחמימות ונוזלים\u003c/td>\u003ctd>ככל שהמאמץ מתמשך, הצורך עשוי לגדול\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">מיד לאחר מאמץ\u003c/th>\u003ctd>התחלת התאוששות\u003c/td>\u003ctd>דחיפות גבוהה יותר אם האימון הבא קרוב\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">בהמשך היום\u003c/th>\u003ctd>צרכים יומיים מלאים\u003c/td>\u003ctd>ארוחות מאוזנות ועמידה בצריכה הכוללת\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"g-08-8\" data-page=\"30\">8. תרגול חשיבה ביקורתית\u003c/h3>\n\u003cp>\u003cstrong>א. למה כדאי לצמצם סיבים ושומן סמוך למאמץ עצים, אף שהם חלק מתפריט בריא?\u003c/strong> הם עלולים להאט את התרוקנות הקיבה ולהגדיל אי־נוחות בזמן הפעילות.\u003c/p>\n\u003cp>\u003cstrong>ב. מה המסקנה הנכונה מגרף אחד המדגים נפילת גלוקוז אחרי פעילות ממושכת ללא פחמימות?\u003c/strong> שקיימת אפשרות לתועלת מצריכת פחמימות במאמץ ארוך, לא שכל אדם יקבל אותו גרף.\u003c/p>\n\u003cp>\u003cstrong>ג. למה למתאמנת עם שתי יחידות אימון בהפרש קצר צריך לתת תשומת לב מיוחדת להתאוששות?\u003c/strong> כי יש לה פחות זמן למלא מחדש מאגרי דלק ולחזור לתפקוד.\u003c/p>\n\u003cp>\u003cstrong>ד. האם יש חובה לשתות משקה ספורט בכל אימון של 30 דקות?\u003c/strong> לא; הסביבה, התזונה, משך המאמץ והצרכים האישיים קובעים את ההתאמה.\u003c/p>\n\u003cp>\u003cstrong>ה. מה החשיבות של ״לא לנסות מאכל חדש ביום התחרות״?\u003c/strong> משום שעלולים להופיע תסמיני עיכול או אי־נוחות שיפגעו בביצוע.\u003c/p>\n\u003cp>\u003cstrong>מילות מפתח:\u003c/strong> תזמון ארוחה, זמינות גלוקוז, פחמימות זמינות, ריקון קיבה, תיסוף במהלך מאמץ, גלוקוז ופרוקטוז, התאוששות, חידוש גליקוגן.\u003c/p>\n\u003c/section>","toc":[{"id":"g-00","n":"00","title":"לומדים תזונה עם עפר","page":1,"sections":[]},{"id":"g-01","n":"01","title":"מבוא לתזונת האדם, קבוצות מזון וקריאת תוויות","page":2,"sections":[{"id":"g-01-1","title":"1. מדוע הגוף זקוק למזון?","page":2},{"id":"g-01-2","title":"2. פירמידת המזון וקשת המזון","page":3},{"id":"g-01-3","title":"3. קריאת תווית מזון","page":3},{"id":"g-01-4","title":"4. תוסף מזון לעומת תוסף תזונה","page":4},{"id":"g-01-5","title":"5. דוגמה מורכבת למבחן","page":4},{"id":"g-01-6","title":"6. שאלות לבדיקה עצמית","page":4}]},{"id":"g-02","n":"02","title":"פחמימות, אינסולין, גליקוגן והעמסת פחמימות","page":5,"sections":[{"id":"g-02-1","title":"1. פחמימות כדלק זמין","page":5},{"id":"g-02-2","title":"2. אינסולין וקליטת גלוקוז בשריר","page":5},{"id":"g-02-3","title":"3. מהו גליקוגן ואיפה הוא נשמר?","page":6},{"id":"g-02-4","title":"4. הקשר בין עומס אימונים לבין כמות הפחמימות בתפריט","page":7},{"id":"g-02-5","title":"5. העמסת פחמימות: למה, מתי ומה המחיר?","page":7},{"id":"g-02-6","title":"6. סיבים תזונתיים: טובים לבריאות, תלויי עיתוי באימון","page":7},{"id":"g-02-7","title":"7. שאלות תרגול עם פתרונות","page":8}]},{"id":"g-03","n":"03","title":"חלבונים, חומצות אמינו ומבנה החלבון","page":9,"sections":[{"id":"g-03-1","title":"1. מהו חלבון?","page":9},{"id":"g-03-2","title":"2. חומצת אמינו: מבנה והבחנה בין חיונית ללא חיונית","page":9},{"id":"g-03-3","title":"3. קשר פפטידי והמבנה של החלבון","page":10},{"id":"g-03-4","title":"4. דנטורציה אינה בהכרח פירוק של חומצות האמינו","page":10},{"id":"g-03-5","title":"5. מהי איכות חלבון לפי ההרכב?","page":10},{"id":"g-03-6","title":"6. חלבון ממזון לעומת אבקת חלבון","page":11},{"id":"g-03-7","title":"7. שאלות עם תשובות","p ,"page":25},{"id":"g-07-5","title":"5. סידן: לא רק לעצמות","page":25},{"id":"g-07-6","title":"6. ויטמיני B, B12 וחומצה פולית","page":25},{"id":"g-07-7","title":"7. סטרס חמצוני ונוגדי חמצון","page":25},{"id":"g-07-8","title":"8. טבלת זיכרון","page":26},{"id":"g-07-9","title":"9. שאלות עם פתרונות","page":26}]},{"id":"g-08","n":"08","title":"תזונה לפני אימון, במהלך האימון ובסיומו","page":27,"sections":[{"id":"g-08-1","title":"1. למה עיתוי האכילה משנה?","page":27},{"id":"g-08-2","title":"2. הארוחה המקדימה, שעות לפני האימון","page":27},{"id":"g-08-3","title":"3. ארוחה קטנה סמוך לאימון","page":28},{"id":"g-08-4","title":"4. מה קורה במהלך פעילות מתמשכת?","page":28},{"id":"g-08-5","title":"5. מה אוכלים במהלך אימון?","page":29},{"id":"g-08-6","title":"6. התאוששות וארוחה לאחר האימון","page":29},{"id":"g-08-7","title":"7. טבלת תזמון והשוואה","page":29},{"id":"g-08-8","title":"8. תרגול חשיבה ביקורתית","page":30}]}],"words":5950},"episodes":[]}</script>
<script>

// לומדים תזונה עם עפר — all practice and grading run on the inlined banks (package/data); no model calls at run time.

const D = JSON.parse(document.getElementById('data').textContent);
const TOPICS = D.topics.map(t => ({ id: t.id, name: t.title, slides: `${t.slideStart}–${t.slideEnd}`, color: t.color }));
const TOPIC = Object.fromEntries(TOPICS.map(t => [t.id, t]));
const Q = Object.fromEntries(D.mcq.map(q => [q.id, q]));
const FC = Object.fromEntries(D.flashcards.map(c => [c.id, c]));
const TF = Object.fromEntries(D.trueFalse.map(t => [t.id, t]));
const SLIDE = Object.fromEntries(D.slides.map(s => [s.n, s]));
const NOTE = Object.fromEntries(D.sourceNotes.map(n => [n.n, n]));
const DG = Object.fromEntries(D.diagrams.map(d => [d.id, d]));
const H = Object.fromEntries(D.diagrams.flatMap(d => d.hotspots.map(h => [h.id, h])));
const VX = Object.fromEntries(D.orders.map(o => [o.id, o]));
const ADD = Object.fromEntries(D.lessonAdditions.map(b => [b.id, b]));
const NOTES_BY_SLIDE = {}; for (const n of D.sourceNotes) for (const s of n.slides) (NOTES_BY_SLIDE[s] = NOTES_BY_SLIDE[s] || []).push(n.n);
const HAS_IMG = new Set(D.slideImages);
const normQ = s => String(s).replace(/[^\p{L}\p{N}]/gu, '');
const DIFF = { basic: 'בסיסית', understanding: 'הבנה', application: 'יישום' };
const LETTERS = ['א', 'ב', 'ג', 'ד'];
const DAY = 86400000;

// ---------- small helpers ----------
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
// Escape and isolate Latin runs (CO₂, VO₂max, "Power Stroke") as one unit so they keep their order inside Hebrew sentences.
// Entities made by esc() (&quot; &amp; …) are matched first and left alone, so their letters are never wrapped.
// Sequence arrows: the V2 banks write "A → B"; in right-to-left text that points backwards, so it is shown as "A ← B" like the V1 lessons.
const tx = s => esc(s).replace(/→/g, '←').replace(/(&[a-z]+;|&#\d+;)|([A-Za-z][A-Za-z0-9₀-₉]*(?:[–\-/+.][A-Za-z0-9₀-₉]+)*(?: [A-Za-z0-9][A-Za-z0-9₀-₉]*(?:[–\-/+.][A-Za-z0-9₀-₉]+)*)*)/g, (m, ent, w) => ent || `<bdi>${w}</bdi>`);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const nowISO = () => new Date().toISOString();
const pagesTxt = p => Array.isArray(p) ? (p.length > 1 && p.every((v, i) => i === 0 || v === p[i - 1] + 1) ? `${p[0]}–${p[p.length - 1]}` : p.join(', ')) : String(p);
// Provenance: the deck slides the item cites, each one a button that opens the slide. A slide with a known
// deck-vs-science difference (SOURCE_NOTES_AND_VERIFY) adds a "הערת דיוק" chip.
const slideBtn = n => `<button class="slref" data-act="openSlide" data-args='{"n":${n}}'><bdi>${n}</bdi></button>`;
const srcOf = (x, plain) => {
  const sl = x.sourceSlides || []; if (!sl.length) return '';
  // inside a button (the flashcard) the reference is plain text: buttons cannot nest
  if (plain) return `<span class="srcref">מקור: מצגת תזונה, ${sl.length > 1 ? 'שקופיות' : 'שקופית'} <bdi>${sl.join(', ')}</bdi></span>`;
  const notes = [...new Set(sl.flatMap(s => NOTES_BY_SLIDE[s] || []))];
  return `<span class="srcref">מקור: מצגת תזונה, ${sl.length > 1 ? 'שקופיות' : 'שקופית'} ${sl.map(slideBtn).join(', ')}${notes.map(n => ` <button class="notechip" data-act="openNote" data-args='{"n":${n}}'>הערת דיוק: ${esc(NOTE[n].title)}</button>`).join('')}</span>`;
};
// Content that goes beyond the deck carries an 'enrichment' label in the dataset; it is shown with the explanation so the
// student can tell exam material (the slides) from added background.
const enrichNote = x => x && x.enrichment ? `<span class="enrich"><b>העשרה, לא מופיע במצגת:</b> ${tx(x.enrichment)}</span>` : '';
const topicChip = id => id && TOPIC[id] ? `<span class="chip t" style="--tc:${TOPIC[id].color}"><span class="tid">${id}</span> ${esc(TOPIC[id].name)}</span>` : '';
const fmtDateTime = iso => { try { return new Date(iso).toLocaleString('he-IL', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch { return ''; } };
const fmtDur = sec => { sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec / 60), s = sec % 60; return `${m}:${String(s).padStart(2, '0')}`; };
const plural = (n, one, many) => n === 1 ? one : `${n} ${many}`;
const fmtNum = n => (Math.round(n * 1000) / 1000).toLocaleString('en-US', { maximumFractionDigits: 3 });
const ICON = {
  home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  learn: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M9 7h6"/>',
  cards: '<rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/>',

  flashcards: {}, mcqAttempts: [], matchingAttempts: [], sequenceAttempts: [], calcAttempts: [], tfAttempts: [], visualAttempts: [], lessonChecks: {},

function normalize(s) {

  for (const k of Object.keys(b)) if (s[k] === undefined) s[k] = b[k];
  for (const k of ARRAYS) if (!Array.isArray(s[k])) return null;
  if (typeof s.flashcards !== 'object' || Array.isArray(s.flashcards)) return null;

}
function trimState(s) {
  const cap = (k, n) => { if (s[k].length > n) s[k] = s[k].slice(-n); };
  cap('mcqAttempts', 1000); cap('matchingAttempts', 200); cap('sequenceAttempts', 200); cap('calcAttempts', 300); cap('tfAttempts', 400); cap('examResults', 30);
  if (Array.isArray(s.visualAttempts)) cap('visualAttempts', 300);
}
const store = { local: false, remote: 'pending', ref: null, writing: false, dirty: false, timer: null, lastSync: null };
function loadLocal() {
  try { const raw = localStorage.getItem(LS_KEY); store.local = true; return raw ? normalize(JSON.parse(raw)) : null; }
  catch { store.local = false; return null; }
}
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); store.local = true; } catch { store.local = false; } }
let S = loadLocal() || blankState();

function scheduleRemote() { if (!store.ref) return; clearTimeout(store.timer); store.timer = setTimeout(flushRemote, 1500); }
async function flushRemote() {
  if (!store.ref) return;

  store.writing = true;
  try { await store.ref.set(JSON.parse(JSON.stringify(S))); store.lastSync = Date.now(); store.remote = 'on'; }
  catch (e) { const code = e && e.code; if (code === 'unavailable') store.dirty = true; else { store.ref = null; store.remote = code === 'invalid_argument' ? 'readonly' : 'off'; } }
  store.writing = false; renderStatus();

}
async function initRemote() {
  const c = window.claude;

  try {
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user) { store.remote = 'off'; renderStatus(); return; }
    const uid = await user.id();
    if (!uid) { store.remote = 'off'; renderStatus(); return; }
    const ref = db.doc(`data/users/${uid}/progress`);
    const snap = await ref.get();
    store.ref = ref; store.remote = 'on';
    const remote = snap.exists ? normalize(JSON.parse(JSON.stringify(snap.data()))) : null;
    if (remote && (!S.updatedAt || (remote.updatedAt && remote.updatedAt > S.updatedAt))) { S = remote; saveLocal(); render(); }

// ---------- derived stats ----------
function latestBy(list) { const m = {}; for (const a of list) m[a.questionId] = a; return m; }
function topicStats(tid) {
  const qs = D.mcq.filter(q => q.topicId === tid);
  const ids = new Set(qs.map(q => q.id));
  const att = S.mcqAttempts.filter(a => ids.has(a.questionId));
  const latest = latestBy(att); const uniq = Object.values(latest);
  const cards = D.flashcards.filter(c => c.topicId === tid);
  const recent = att.slice(-5);
  const lesson = D.lessons.find(l => l.topicId === tid);
  return {
    bank: qs.length, attempts: att.length, correct: att.filter(a => a.correct).length, unique: uniq.length,
    mastery: uniq.length >= 5 ? pct(uniq.filter(a => a.correct).length, uniq.length) : null, coverage: pct(uniq.length, qs.length),
    recentWrong: recent.filter(a => !a.correct).length, recentN: recent.length,
    cards: cards.length, cardsKnown: cards.filter(c => S.flashcards[c.id]?.rating === 'known').length,
    lessonDone: lesson ? S.completedLessons.includes(lesson.key) : false,
  };
}
function cardIsDue(id, now = Date.now()) { const c = S.flashcards[id]; return !c || !c.nextDueAt || Date.parse(c.nextDueAt) <= now; }
const dueCards = tid => { const now = Date.now(); return D.flashcards.filter(c => (!tid || c.topicId === tid) && S.flashcards[c.id] && cardIsDue(c.id, now)); };
const newCards = tid => D.flashcards.filter(c => (!tid || c.topicId === tid) && !S.flashcards[c.id]);

// first try vs later tries, per question, from the stored attempt log
function tryStats() {
  const by = {}; for (const a of S.mcqAttempts) (by[a.questionId] = by[a.questionId] || []).push(a);
  let f = 0, fOk = 0, r = 0, rOk = 0;
  for (const list of Object.values(by)) { f++; if (list[0].correct) fOk++; for (const a of list.slice(1)) { r++; if (a.correct) rOk++; } }
  return { first: f, firstOk: fOk, retry: r, retryOk: rOk };
}

// The study plan: fixed rules checked in order, so the reason shown is always the rule that fired.
function plan() {
  const out = [];
  if (S.activeExam) out.push({ title: 'יש מבחן פתוח', text: `ענית על ${Object.keys(S.activeExam.answers).length} מתוך ${S.activeExam.qids.length} שאלות. אפשר להמשיך מאותה נקודה.`, cta: 'המשך למבחן', act: 'go', args: { route: 'exam' } });
  const due = dueCards().length;
  if (due >= 8) out.push({ title: `${due} כרטיסיות מחכות לחזרה`, text: 'הגיע מועד החזרה שלהן לפי הדירוג הקודם שלך.', cta: 'לחזרה על כרטיסיות', act: 'startCardsQuick', args: { mode: 'due' } });
  let worst = null;
  for (const t of TOPICS) { const st = topicStats(t.id); if (st.recentN >= 3 && st.recentWrong >= 2 && (!worst || st.recentWrong > worst.st.recentWrong)) worst = { t, st }; }
  if (worst) out.push({ title: `לחזור על ${worst.t.name}`, text: `${worst.st.recentWrong} טעויות ב-${worst.st.recentN} התשובות האחרונות בנושא.`, cta: 'תרגול הטעויות בנושא', act: 'startPracticeQuick', args: { topic: worst.t.id, pool: 'mistakes' } });
  const next = D.lessons.find(l => !S.completedLessons.includes(l.key));
  if (next) out.push({ title: `ללמוד: ${next.title}`, text: `${next.unit}. בסוף כל תת-נושא יש תרגול על השקופיות שלו.`, cta: 'לפתיחת הפרק', act: 'openLesson', args: { key: next.key } });
  let low = null;
  for (const t of TOPICS) { const st = topicStats(t.id); if (!low || st.coverage < low.st.coverage) low = { t, st }; }
  if (low && low.st.coverage < 60) out.push({ title: `לתרגל: ${low.t.name}`, text: `ענית על ${low.st.unique} מתוך ${low.st.bank} השאלות בנושא, הכיסוי הנמוך ביותר.`, cta: 'תרגול 10 שאלות', act: 'startPracticeQuick', args: { topic: low.t.id, pool: 'unseen' } });

  return out.slice(0, 3);
}

const EPS = () => D.episodes.filter(e => e.src);
const epTotal = eps => Math.round(eps.reduce((a, e) => a + (e.durationSec || 0), 0) / 60);
const fmtLen = min => min >= 60 ? `כ־${Math.floor(min / 60)} שעות ו־${min % 60} דקות` : `כ־${min} דקות`;

  const heard = eps.filter(e => S.listened[e.id]).length;

    ${next ? `<div class="pod-now">
      <span class="small muted">${onTopic ? 'מתאים ליחידה שאת לומדת עכשיו' : heard ? 'הפרק הבא שעוד לא הואזן' : 'מתחילים מכאן'}</span>
      <b class="pod-title">פרק ${String(next.n).padStart(2, '0')} · ${tx(next.title)}</b>
      <div class="row">${next.topicId ? topicChip(next.topicId) : '<span class="chip">כל היחידות</span>'}${next.durationSec ? `<span class="counter">${fmtDur(next.durationSec)}</span>` : ''}</div>
      <audio controls preload="none" src="${esc(next.src)}" data-ep="${next.id}" aria-label="נגן: ${esc(next.title)}"></audio>
      <div class="checks"><label><input type="checkbox" data-act-change="listened" data-ep="${next.id}" ${S.listened[next.id] ? 'checked' : ''}> סימון כהואזן</label></div>

    <div class="row between"><span class="small" id="podCount">הואזנו ${heard} מתוך ${eps.length}</span><button class="btn small" data-act="go" data-route="listen">כל הפרקים ←</button></div>

// Latest-wrong items of every graded kind, newest first, kept by item id across sessions.

  return [...Object.values(latestBy(S.mcqAttempts)).filter(a => !a.correct).map(a => ({ id: a.questionId, at: a.answeredAt, kind: 'q' })),
    ...Object.values(tfLatest()).filter(a => !a.correct).map(a => ({ id: a.itemId, at: a.answeredAt, kind: 'tf' }))].filter(r => (r.kind === 'q' ? Q : TF)[r.id]).sort((a, b) => b.at.localeCompare(a.at));
}

// Plain text of each lesson section, built once from the rendered HTML, for search.
let SECTION_INDEX = null;
function sectionIndex() {
  if (SECTION_INDEX) return SECTION_INDEX;
  const div = document.createElement('div'); SECTION_INDEX = [];
  for (const l of D.lessons) { div.innerHTML = l.html; for (const s of l.sections) { const el = div.querySelector('#' + s.id); if (el) SECTION_INDEX.push({ lesson: l, sec: s, text: el.textContent.replace(/\s+/g, ' ') }); } }

}
function learnSearchHTML() {
  const q = (view.learnQ || '').trim().toLowerCase();

  return `<p class="small" style="margin:0" role="status">${hits.length ? `נמצאו ${hits.length} חלקים` : 'לא נמצא. נסי מילה אחרת.'}</p>
  ${hits.slice(0, 30).map(x => { const i = x.text.toLowerCase().indexOf(q); const snip = i >= 0 ? x.text.slice(Math.max(0, i - 50), i + 90) : x.text.slice(0, 120);

}

// No two questions with the same wording; difficulties interleaved. "balanced_by_topic" deals the questions to the
// eight topics in turn, so each gets an equal share (±1). A fourth, local mode builds an exam from open mistakes.
function buildExam(bp) {
  const used = new Set(), wording = new Set(), picked = [];
  const ok = q => !used.has(q.id) && !wording.has(normQ(q.question));
  const take1 = pool => { const q = pool.find(ok); if (!q) return false; used.add(q.id); wording.add(normQ(q.question)); picked.push(q); return true; };
  const interleave = pool => { const b = ['basic', 'understanding', 'application'].map(d => shuffle(pool.filter(q => q.difficulty === d))); const out = []; while (b.some(x => x.length)) for (const x of b) if (x.length) out.push(x.shift()); return out; };
  if (bp.mode === 'balanced_by_topic') {
    const pools = shuffle(TOPICS.map(t => interleave(D.mcq.filter(q => q.topicId === t.id))));
    while (picked.length < bp.count && pools.some(p => p.some(ok))) for (const p of pools) { if (picked.length >= bp.count) break; take1(p); }

  return { qs: qs.map(q => q.id), cs: cs.map(c => c.id) };
}

  labCheck: a => { const d = DG[a.d]; const mode = dgMode(d); const lab = labState(d, mode); const T = labTargets(d, mode); lab.checked = true; lab.picked = null;
    S.visualAttempts.push({ id: `${d.id}:${mode}`, kind: 'label', correct: T.filter(h => lab.assign[h.id] === h.id).length, total: T.length, answeredAt: nowISO() }); commit(); rerenderDiagram(a.d); },
  labReset: a => { const d = DG[a.d]; delete view.lab[d.id + ':' + dgMode(d)]; rerenderDiagram(a.d); },
  vxMove: a => { const st = vxState(a.id); const j = a.i + a.d; if (j < 0 || j >= st.order.length) return; [st.order[a.i], st.order[j]] = [st.order[j], st.order[a.i]]; rerenderVx(a.id); const b = document.querySelector(`#vx-${a.id} .seq li:nth-child(${j + 1}) [data-act="vxMove"]:not([disabled])`); if (b) b.focus({ preventScroll: true }); },
  vxCheck: a => { const o = VX[a.id]; const st = vxState(a.id); st.checked = true; const sc = seqScore(o, st.order); S.visualAttempts.push({ id: o.id, kind: 'order', exact: sc.exact, correct: sc.exact ? sc.max : sc.adj, total: sc.max, answeredAt: nowISO() }); commit(); rerenderVx(a.id); },
  vxReset: a => { delete view.vx[a.id]; rerenderVx(a.id); },
  lessonCheck: a => { if (S.lessonChecks[a.id]) return; const b = ADD[a.id]; S.lessonChecks[a.id] = { i: a.i, correct: a.i === b.correctIndex, at: nowISO() }; commit(); paintLessonChecks(); },
  lessonCheckRetry: a => { delete S.lessonChecks[a.id]; commit(); paintLessonChecks(); },
  zoomSlide: a => zoomSheet(a.n),
  openSlide: a => { view.slideN = a.n; go('sources'); },
  closeSlide: () => { view.slideN = null; render(); },
  openNote: a => { view.slideN = null; go('sources', {}, { noFocus: true }); const t = document.getElementById('notes'); if (t) { t.scrollIntoView({ block: 'start' }); window.scrollBy(0, -70); } },
  glossSearch: a => { view.glossQ = a.q; view.glossTopic = 'all'; go('glossary'); },
  // study guide
  guideMode: a => { const p = guidePrefs(); if (p.mode === a.m) return; p.mode = a.m; saveGuidePrefs(); render(); },
  guideFont: a => { const p = guidePrefs(); const i = GUIDE_FONTS.indexOf(p.font) + a.d; if (i < 0 || i >= GUIDE_FONTS.length) return; p.font = GUIDE_FONTS[i]; saveGuidePrefs(); const el = $('#guideHtml'); if (el) el.style.setProperty('--gfont', p.font); const top = window.scrollY; render(); window.scrollTo({ top }); },
  guideZoom: a => { const p = guidePrefs(); if (p.zoom === a.z) return; const cur = +($('#guidePos')?.textContent.match(/\d+/)?.[0] || 1); p.zoom = a.z; view.guideJump = null; view.guidePage = cur; render(); },
  guideJump: a => { if (guidePrefs().mode === 'html') guideScroll(a.id); else { const pg = guidePageOf(a.id); if (pg) guideScroll('gp-' + pg); } },
  guideGoPage: () => { const n = +$('#guidePage')?.value; if (n >= 1 && n <= D.guide.pages) guideScroll('gp-' + n); else toast(`מספר עמוד בין 1 ל־${D.guide.pages}`); },
  guideDownload: async () => { try { await saveFile(D.guide.filename, await guideBlob(), 'החוברת נשמרה'); } catch { toast('לא ניתן לטעון את החוברת כרגע'); } },
  // backup
  exportJSON: async () => {
    const json = JSON.stringify(S, null, 1); const name = `ofer-nutrition-progress-${new Date().toISOString().slice(0, 10)}.json`;
    if (await saveFile(name, new Blob([json], { type: 'application/json' }), 'קובץ הגיבוי נשמר')) return;
    $('#backupArea').innerHTML = `<div class="stack"><p class="small" style="margin:0">אפשר להעתיק את הטקסט ולשמור אותו בקובץ <span class="mono">${esc(name)}</span>:</p><textarea id="exportBox" readonly aria-label="נתוני הגיבוי">${esc(json)}</textarea><button class="btn small" data-act="copyExport" style="align-self:flex-start">העתקה</button></div>`;
  },
  copyExport: async () => { const box = $('#exportBox'); try { await navigator.clipboard.writeText(box.value); toast('הועתק'); } catch { box.focus(); box.select(); toast('הטקסט מסומן. אפשר להעתיק אותו ידנית'); } },
  importOpen: () => {
    $('#backupArea').innerHTML = `<div class="stack"><label class="field"><span>קובץ גיבוי (JSON)</span><input type="file" id="importFile" accept="application/json,.json"></label><label class="field"><span>או הדבקת תוכן הגיבוי</span><textarea id="importBox" aria-label="תוכן הגיבוי"></textarea></label><button class="btn small" data-act="importCheck" style="align-self:flex-start">בדיקת הגיבוי</button><div id="importMsg" role="status"></div></div>`;
    $('#importFile').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('#importBox').value = r.result; ACT.importCheck(); }; r.readAsText(f); });
  },
  importCheck: () => {
    let s = null; try { s = normalize(JSON.parse($('#importBox').value)); } catch { s = null; }
    const msg = $('#importMsg');
    if (!s) { msg.innerHTML = '<p class="small" style="color:var(--bad);margin:0">זה לא נראה כמו גיבוי של אתר התזונה (חסר schemaVersion 1, או שזה גיבוי של אתר אחר).</p>'; return; }
    view.pendingImport = s;
    msg.innerHTML = `<div class="panel warmtint"><p style="margin:0">בגיבוי: ${s.mcqAttempts.length} תשובות, ${Object.keys(s.flashcards).length} כרטיסיות מדורגות, ${s.examResults.length} מבחנים${s.updatedAt ? ` · עדכון אחרון ${fmtDateTime(s.updatedAt)}` : ''}.</p><p class="small" style="margin:0">הייבוא יחליף את ההתקדמות הנוכחית במסלול התזונה.</p><div class="row"><button class="btn primary" data-act="importApply">החלפה בגיבוי</button><button class="btn" data-act="importCancel">ביטול</button></div></div>`;
  },
  importApply: () => { S = view.pendingImport; view.pendingImport = null; for (const k of Object.keys(view)) delete view[k]; commit(); render(); toast('הגיבוי שוחזר'); },
  importCancel: () => { view.pendingImport = null; $('#backupArea').innerHTML = ''; },
  resetCardsAsk: () => openSheet(`<h2 id="sheetTitle">לאפס את הכרטיסיות?</h2><p>כל הדירוגים ומועדי החזרה של ${Object.keys(S.flashcards).length} הכרטיסיות שתורגלו יימחקו. שאר ההתקדמות נשארת.</p><div class="row"><button class="btn danger" data-act="resetCardsYes">איפוס הכרטיסיות</button><button class="btn" data-act="closeSheet">ביטול</button></div>`, '.btn:not(.danger)'),
  resetCardsYes: () => { S.flashcards = {}; view.cards = null; commit(); closeSheet(); render(); toast('הכרטיסיות אופסו'); },
  resetAsk: () => openSheet(`<h2 id="sheetTitle">לאפס את כל ההתקדמות?</h2><p>כל התשובות, הדירוגים, המבחנים וההערכות במסלול התזונה יימחקו${store.remote === 'on' ? ', גם מהשמירה בחשבון' : ''}. מומלץ לייצא גיבוי לפני כן.</p><div class="row"><button class="btn danger" data-act="resetYes">איפוס</button><button class="btn" data-act="closeSheet">ביטול</button></div>`, '.btn:not(.danger)'),
  resetYes: () => { S = blankState(); for (const k of Object.keys(view)) delete view[k]; commit(); closeSheet(); go('home'); toast('ההתקדמות אופסה'); },
};
// A diagram re-renders in place (on its own screen or inside a lesson) so the page keeps its scroll position.
function rerenderDiagram(id) {
  const el = document.getElementById('dg-' + id); const d = D.diagrams.find(x => x.id === id);
  if (!el || !d) return render();
  const tmp = document.createElement('div'); tmp.innerHTML = diagramHTML(d, { compact: el.classList.contains('compact') });
  el.replaceWith(tmp.firstElementChild);
}

// Delegated events: clicks carry data-act + JSON data-args; form controls update the current screen's form state.
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault();
  let args = {}; try { args = el.dataset.args ? JSON.parse(el.dataset.args) : {}; } catch { }
  fn(args, el, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'glossTopic') { view.glossTopic = el.value; $('#glossList').innerHTML = glossListHTML(); return; }
  if (el.id === 'examTimed') { view.examTimed = el.checked; render(); return; }
  if (el.dataset.actChange === 'listened') { S.listened[el.dataset.ep] = el.checked; commit(); syncListened(el.dataset.ep); return; }
  const form = el.closest('[data-form]'); if (!form) return;
  const fd = new FormData(form); const kind = form.dataset.form;
  if (kind === 'cards') view.cardForm = { topic: fd.get('cardTopic'), mode: fd.get('cardMode'), size: fd.get('cardSize'), mix: fd.get('cardMix') === 'on', type: fd.get('cardType') };
  if (kind === 'practice') view.practiceForm = { topic: fd.get('prTopic'), diff: fd.get('prDiff'), size: fd.get('prSize'), pool: fd.get('prPool') };
  if (kind === 'tf') view.tfForm = { topic: fd.get('tfTopic'), size: fd.get('tfSize'), pool: fd.get('tfPool') };
  const id = el.id || el.name, val = el.value;
  render();
  const again = document.getElementById(id) || document.querySelector(`[name="${el.name}"][value="${CSS.escape(val)}"]`);
  if (again) again.focus({ preventScroll: true });
});
// Typing: searches update in place, so the field keeps focus; case drafts are saved as you type.
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'glossQ') { view.glossQ = el.value; $('#glossList').innerHTML = glossListHTML(); return; }
  if (el.id === 'learnQ') { view.learnQ = el.value; $('#learnHits').innerHTML = learnSearchHTML(); return; }
  if (el.id === 'caseDraft') { clearTimeout(ACT._caseT); ACT._caseT = setTimeout(() => { S.caseDrafts[el.dataset.case] = el.value; commit(); }, 800); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.closest('[data-drill]')) { e.preventDefault(); ACT.drillCheck({ id: e.target.closest('[data-drill]').dataset.drill }); }
  // SVG hotspots are focusable groups: Enter or Space opens them like a click
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('g.dhs[data-act]')) { e.preventDefault(); ACT.hotspot(JSON.parse(e.target.dataset.args)); }
  if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  if (route === 'cards' && view.cards && !view.cards.done && !e.target.closest('input,select,textarea,button,a')) {
    if (e.key === ' ' && !view.cards.flipped) { e.preventDefault(); ACT.flipCard(); }
    else if (view.cards.flipped && ['1', '2', '3'].includes(e.key)) ACT.rateCard({ r: ['unknown', 'almost', 'known'][+e.key - 1] });
  }
});
document.addEventListener('toggle', e => { const k = e.target.dataset?.actToggle; if (k === 'examMap') view.examMapOpen = e.target.open; if (k === 'toc') view.tocOpen = e.target.open; if (k === 'guideToc') view.guideTocOpen = e.target.open; }, true);
window.addEventListener('hashchange', () => { const r = location.hash.slice(1); if (r && r !== route && ROUTES[r]) go(r); });

// ---------- boot ----------
(function boot() {
  const h = location.hash.slice(1);
  route = ROUTES[h] ? h : 'home';
  renderStatus(); render(); initRemote();
})();
// An episode played to the end is marked as heard.
document.addEventListener('ended', e => { const id = e.target.dataset?.ep; if (id && !S.listened[id]) { S.listened[id] = true; commit(); syncListened(id); toast('הפרק סומן כהואזן'); } }, true);

</script>
</body></html>
