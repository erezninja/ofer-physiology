שמדברים על תוסף: מהי ראיה ליעילות?","slides":[45,46]},{"id":"s-N06-2","title":"2. קפאין: השפעה אקוטית יחסית","slides":[47,48,49,50]},{"id":"s-N06-3","title":"3. קריאטין: הגדלת יכולת מערכת הפוספאגן","slides":[51,52,53]},{"id":"s-N06-4","title":"4. בטא־אלנין, קרנוזין והיכולת לבפר חומציות","slides":[54,55,56,57]},{"id":"s-N06-5","title":"5. אבקות חלבון: כלי נוחות, לא קסם","slides":[58,59]},{"id":"s-N06-6","title":"6. טבלת השוואה חשובה","slides":[45]},{"id":"s-N06-7","title":"7. שאלות יישום","slides":[]}],"html":"\u003cp class=\"lsrc\">\u003cspan class=\"tag\">מקור\u003c/span> \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":44}'>שקופיות \u003cbdi>44–59\u003c/bdi>\u003c/button>. זהו פרק להבנת מנגנונים, התאמה לסוג מאמץ ויכולת להבחין בין טענה מבוססת לטענה שעדיין נחקרת. אין לראות בו המלצה לצרוך תוסף, מרשם מינון או בדיקת סטטוס עדכנית של תקנות אנטי־דופינג.\u003c/p>\n\u003csection class=\"lsec\" id=\"s-N06-1\">\u003ch2 class=\"part\">1. לפני שמדברים על תוסף: מהי ראיה ליעילות?\u003c/h2>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":45}'>שקופיות \u003cbdi>45–46\u003c/bdi>\u003c/button> מחלקות תוספים לקבוצות לפי רמת הראיות: כאלה שדווח כי יעילותם הוכחה, כאלה שהיעילות נבדקת, כאלה שאין ראיה מספקת ליעילותם, כאלה שנאסרו לפי כללי ספורט, וכאלה שמטרתם להשלים חסר תזונתי. זו \u003cstrong>חלוקה פדגוגית של המצגת\u003c/strong>, ולא רשימה רגולטורית עדכנית ליום הבחינה. סטטוס של חומר בבדיקות סימום צריך לבדוק מול \u003cbdi>WADA\u003c/bdi> ורשימות התחרות הרלוונטיות, ולא רק לפי שקופית ישנה.\u003c/p>\n\u003caside class=\"gnote kind\">\u003cspan class=\"tag\">שלוש שאלות מפתח לכל תוסף\u003c/span>\u003cdiv>\u003cp>מהו המנגנון המוצע? לאיזה סוג מאמץ הוא עשוי להיות רלוונטי? מה המגבלות, תופעות הלוואי או חלופות המזון? כך משווים תוספים לפי עיקרון ולא לפי מותג.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-compare deck\" id=\"N06-A01\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">השוואה\u003c/span>\u003cb>חמש דרגות ההוכחה במצגת\u003c/b>\u003c/div>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>דרגת ההוכחה\u003c/th>\u003cth>דוגמאות במצגת\u003c/th>\u003cth>מה זה אומר\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">יעילותם הוכחה\u003c/th>\u003ctd>קריאטין, קפאין, סותרי חומצה: בטא־אלנין וסודיום ביקרבונאט\u003c/td>\u003ctd>יעילות ובטיחות הוכחו במחקרים איכותיים (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":46}'>שקופית \u003cbdi>46\u003c/bdi>\u003c/button>)\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">יעילותם עדיין נבדקת\u003c/th>\u003ctd>גלוטמין, \u003cbdi>HMB\u003c/bdi>\u003c/td>\u003ctd>אין עדיין מסקנה; לא מציגים אותם כ״עובדים״\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">אין כלל הוכחה ליעילותם\u003c/th>\u003ctd>חומצות אמינו, ג׳ינסנג, קרניטין\u003c/td>\u003ctd>אין בסיס להציג אותם כמשפרי ביצוע\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">אסורים לפי \u003cbdi>WADA\u003c/bdi>\u003c/th>\u003ctd>אפדרין, סטרואידים אנאבוליים\u003c/td>\u003ctd>אסורים בספורט, בלי קשר להשפעתם\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">השלמת חסרים תזונתיים\u003c/th>\u003ctd>ברזל, סידן, ויטמין \u003cbdi>D\u003c/bdi>, מגנזיום, ויטמין \u003cbdi>B12\u003c/bdi>, חומצה פולית\u003c/td>\u003ctd>המטרה היא לתקן חסר, לא לשפר ביצוע\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":45}'>\u003cbdi>45\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":46}'>\u003cbdi>46\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-misconception deck\" id=\"N06-A02\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">טעות נפוצה\u003c/span>\u003cb>״תוסף מוכח עובד לכולן ובכל ענף״\u003c/b>\u003c/div>\u003cp>\u003cstrong>האמונה השגויה:\u003c/strong> אם תוסף נמצא בקבוצה ״שיעילותם הוכחה״, הוא ישפר את הביצוע של כל ספורטאית בכל סוג מאמץ.\u003c/p>\u003cp>\u003cstrong>למה זה שגוי:\u003c/strong> ההוכחה נוגעת לסוג מאמץ מסוים ולתגובה של אנשים. קריאטין מתאים למאמצים קצרים ועצימים, כמו ריצת 100 מטר או שחייה של 50 מטר (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":52}'>שקופיות \u003cbdi>52–53\u003c/bdi>\u003c/button>), ולא בהכרח לרצת מרתון. בקפאין יש שונות גנטית: יש אנשים שלא מושפעים כלל, ויש רגישים שיסבלו מתופעות לוואי כבר במינון נמוך (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":49}'>שקופית \u003cbdi>49\u003c/bdi>\u003c/button>).\u003c/p>\u003cp>\u003cstrong>הניסוח הנכון:\u003c/strong> ״מוכח״ פירושו שיש ראיות איכותיות ליעילות ולבטיחות במצבים מסוימים. תמיד שואלים: לאיזה מאמץ ולמי.\u003c/p>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":45}'>\u003cbdi>45\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":46}'>\u003cbdi>46\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":49}'>\u003cbdi>49\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":52}'>\u003cbdi>52\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":53}'>\u003cbdi>53\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"notebox\" data-notes=\"10\">\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"45,46\" data-title=\"1. לפני שמדברים על תוסף: מהי ראיה ליעילות?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N06-2\">\u003ch2 class=\"part\">2. קפאין: השפעה אקוטית יחסית\u003c/h2>\n\u003cp>ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":47}'>שקופיות \u003cbdi>47–50\u003c/bdi>\u003c/button> מתואר קפאין כחומר שעשוי להשפיע על ערנות, תפיסת מאמץ ויכולת להמשיך פעילות, ובמיוחד בפעילות סבולת במצבים מסוימים. המצגת מזכירה גם שינויים בקטכולאמינים ושימוש בשומן. לצורכי מבחן יש להכיר את ההשפעה הכוללת ולא להניח שכל שיפור ביצועים נובע דווקא מ״שריפת שומן״; זה פישוט של מנגנון מורכב יותר.\u003c/p>\n\u003cp>המצגת מציינת כדוגמה טווח \u003cstrong>3–6 מ״ג לק״ג\u003c/strong> ומשך פעילות של מספר שעות עם שיא השפעה בקירוב לאחר שעה. יש הבדלים גדולים בין אנשים בתגובה ובתופעות הלוואי. מכיוון שקפאין פועל יחסית מהר, \u003cstrong>עיתוי הנטילה ביחס למאמץ\u003c/strong> עשוי להיות שיקול לימודי חשוב. זה מנוגד לתוסף שפועל דרך רוויה הדרגתית של מאגרי שריר.\u003c/p>\n\u003ch3>דוגמת חישוב למבחן\u003c/h3>\n\u003cp>אדם במשקל 70 ק״ג, חישוב תיאורטי לפי 3 מ״ג/ק״ג: 3×70 = 210 מ״ג. זהו תרגיל יחידות בלבד, \u003cstrong>לא\u003c/strong> הוראה לנטילת קפאין, והוא לא מתאים בהכרח לכל אדם.\u003c/p>\n\u003caside class=\"gnote q\">\u003cspan class=\"tag\">שאלת עומק\u003c/span>\u003cdiv>\u003cp>למה אותו מינון בקפאין יכול להשפיע שונה על שני אנשים? בשל שונות אישית, הרגלי צריכה, רגישות, מצב בריאותי וגורמים נוספים.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-steps deck\" id=\"N06-A03\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">שלב אחר שלב\u003c/span>\u003cb>מה קפאין עושה במאמץ סבולת\u003c/b>\u003c/div>\u003col class=\"steps\">\u003cli>\u003cspan>הקפאין נספג, ופעילותו מגיעה לשיא כעבור כשעה (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":50}'>שקופית \u003cbdi>50\u003c/bdi>\u003c/button>).\u003c/span>\u003c/li>\u003cli>\u003cspan>הוא מגביר הפרשת קטכולאמינים, כלומר יותר אדרנלין.\u003c/span>\u003c/li>\u003cli>\u003cspan>הוא מגביר הפרשת בטא־אנדורפינים, ולכן תחושת הכאב פוחתת.\u003c/span>\u003c/li>\u003cli>\u003cspan>הוא מגביר ליפוליזה בתאי השומן: יותר חומצות שומן יוצאות מתאי השומן אל הדם.\u003c/span>\u003c/li>\u003cli>\u003cspan>התוצאה לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":48}'>שקופית \u003cbdi>48\u003c/bdi>\u003c/button>: המאמץ נמשך זמן רב יותר, תחושת העייפות נדחית, והספורטאית שומרת על מהירות ועצימות עד התשישות.\u003c/span>\u003c/li>\u003cli>\u003cspan>אצל מי שצורכת קפאין באופן קבוע מופיעה הסתגלות, והאפקט מתפוגג מהר (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":50}'>שקופית \u003cbdi>50\u003c/bdi>\u003c/button>).\u003c/span>\u003c/li>\u003c/ol>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":48}'>\u003cbdi>48\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":50}'>\u003cbdi>50\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-worked deck\" id=\"N06-A04\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">דוגמת חישוב\u003c/span>\u003cb>קפאין לפי משקל גוף: תרגיל יחידות\u003c/b>\u003c/div>\u003cdiv class=\"worked\">\u003cp>\u003cstrong>הנתונים (מתאמנת לדוגמה):\u003c/strong> רצה במשקל 60 ק״ג לפני מרוץ אירובי שמתחיל ב־08:00. זה תרגיל יחידות בלבד, לא המלצת מינון.\u003c/p>\u003cp>שלב 1, הקצה התחתון של הטווח הארגוגני: 3 מ״ג/ק״ג × 60 ק״ג = 180 מ״ג\u003cbr>שלב 2, הקצה העליון: 6 מ״ג/ק״ג × 60 ק״ג = 360 מ״ג\u003cbr>שלב 3, הטווח לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":49}'>שקופית \u003cbdi>49\u003c/bdi>\u003c/button>: 180–360 מ״ג\u003cbr>שלב 4, השוואה לסף תופעות הלוואי ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":49}'>שקופית \u003cbdi>49\u003c/bdi>\u003c/button> (מעל 600 מ״ג ביום): 360 מ״ג &lt; 600 מ״ג. גם הקצה העליון מתחת לסף, אבל אנשים רגישים עלולים לסבול מתופעות לוואי כבר במינון נמוך יותר.\u003cbr>שלב 5, עיתוי לפני מאמץ אירובי, כשעה וחצי לפני (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":50}'>שקופית \u003cbdi>50\u003c/bdi>\u003c/button>): 08:00 − 1:30 = 06:30\u003cbr>שלב 6, מחצית חיים של 3–6 שעות: מתוך 180 מ״ג יישארו אחרי מחצית חיים אחת 180 ÷ 2 = 90 מ״ג, כלומר בין 09:30 ל־12:30.\u003c/p>\u003cp>\u003cstrong>התוצאה:\u003c/strong> בתרגיל הטווח הוא 180–360 מ״ג, כשעה וחצי לפני הזינוק.\u003c/p>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":49}'>\u003cbdi>49\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":50}'>\u003cbdi>50\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"47,48,49,50\" data-title=\"2. קפאין: השפעה אקוטית יחסית\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N06-3\">\u003ch2 class=\"part\">3. קריאטין: הגדלת יכולת מערכת הפוספאגן\u003c/h2>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":51}'>שקופיות \u003cbdi>51–53\u003c/bdi>\u003c/button> מתארות את הקריאטין כמשתתף במערכת האנרגיה \u003cbdi>ATP–CP\u003c/bdi>, המספקת אנרגיה מהירה למאמץ קצר ועצים. פוספוקריאטין מאפשר חידוש מהיר של \u003cbdi>ATP\u003c/bdi> במאמצים שבהם הביקוש מיידי וגבוה. כאשר מאגרי הקריאטין בשריר גדלים, הפעילות הרלוונטית ביותר היא בדרך כלל מאמץ קצר ועצים, לעתים במחזורים חוזרים. במצגת מוזכרים כוח, ספרינט והתאוששות בין מאמצים.\u003c/p>\n\u003cdiv class=\"dg-slot\" data-id=\"13-creatine-atp-pc\">\u003c/div>\n\u003cp>המצגת מדגישה שהשפעה על המאגרים נוצרת לאורך זמן, ולכן העיתוי המדויק של מנה לפני האימון פחות מרכזי מאשר בקפאין. זהו ההבדל הגדול שיש לשנן: \u003cstrong>קפאין = השפעה יחסית אקוטית ועיתוי; קריאטין = השפעה שנקשרת לשינוי מאגרי השריר לאורך זמן\u003c/strong>.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-steps beyond\" id=\"N06-A05\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">שלב אחר שלב\u003c/span>\u003cb>מערכת הפוספאגן (\u003cbdi>ATP–CP\u003c/bdi>) והקריאטין\u003c/b>\u003c/div>\u003col class=\"steps\">\u003cli>\u003cspan>בזינוק של ספרינט הביקוש ל־\u003cbdi>ATP\u003c/bdi> בשריר קופץ מיד, ומאגר ה־\u003cbdi>ATP\u003c/bdi> המוכן בשריר קטן.\u003c/span>\u003c/li>\u003cli>\u003cspan>פוספוקריאטין (\u003cbdi>CP\u003c/bdi>) מוסר קבוצת פוספט ל־\u003cbdi>ADP\u003c/bdi>, וכך נוצר \u003cbdi>ATP\u003c/bdi> חדש כמעט מיד, בלי צורך בחמצן.\u003c/span>\u003c/li>\u003cli>\u003cspan>זו המערכת המהירה ביותר, אבל מאגר ה־\u003cbdi>CP\u003c/bdi> מספיק לשניות ספורות בלבד של מאמץ מרבי.\u003c/span>\u003c/li>\u003cli>\u003cspan>כשה־\u003cbdi>CP\u003c/bdi> אוזל, השריר נשען יותר על המסלול האנאירובי הלקטי ונוצרת חומצת חלב. ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":53}'>שקופית \u003cbdi>53\u003c/bdi>\u003c/button> זה מוביל לעייפות.\u003c/span>\u003c/li>\u003cli>\u003cspan>תוסף קריאטין מגדיל את מאגרי הקריאטין בשריר, בתהליך של מספר שבועות.\u003c/span>\u003c/li>\u003cli>\u003cspan>מאגר גדול יותר מאריך את השימוש במעגל הפוספוגני, ולכן נדחים השימוש במסלול הלקטי, יצירת חומצת החלב והעייפות.\u003c/span>\u003c/li>\u003cli>\u003cspan>בהפסקה בין מאמצים ה־\u003cbdi>CP\u003c/bdi> נבנה מחדש, ומאגר גדול יותר תורם להתאוששות מהירה יותר בין מאמצים.\u003c/span>\u003c/li>\u003cli>\u003cspan>בנוסף, ספיחת מים אל השריר מגרה סינתזת חלבוני שריר, וכך הקריאטין תורם גם לכוח ולמסת השריר.\u003c/span>\u003c/li>\u003c/ol>\n    \u003cp class=\"add-src\">\u003cspan class=\"beyond-chip\">הבהרה מדעית מעבר למצגת\u003c/span> העברת הפוספט מפוספוקריאטין ל־\u003cbdi>ADP\u003c/bdi>, משך הפעולה של שניות ספורות ובנייה מחדש של \u003cbdi>CP\u003c/bdi> במנוחה הם ידע מקובל בפיזיולוגיה שאינו כתוב ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":52}'>שקופיות \u003cbdi>52–53\u003c/bdi>\u003c/button>, והקשר הישיר בין חומצת חלב לעייפות הוא מודל מפושט. · \u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":52}'>\u003cbdi>52\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":53}'>\u003cbdi>53\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"vx-slot\" data-id=\"VX-03\">\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"51,52,53\" data-title=\"3. קריאטין: הגדלת יכולת מערכת הפוספאגן\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N06-4\">\u003ch2 class=\"part\">4. בטא־אלנין, קרנוזין והיכולת לבפר חומציות\u003c/h2>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":54}'>שקופיות \u003cbdi>54–57\u003c/bdi>\u003c/button> מדברות על \u003cem>סותרי חומצה\u003c/em> במובן של חומרים המשפיעים על יכולת הגוף להתמודד עם שינויים בחומציות המתרחשים במאמץ עצים. \u003cstrong>קרנוזין\u003c/strong>, המצוי בשריר, קשור ליכולת הבופרינג התוך־תאית, כלומר לקליטת חלק מיוני המימן ולצמצום שינויים חדים ב־\u003cbdi>pH\u003c/bdi>. \u003cstrong>בטא־אלנין\u003c/strong> היא חומר מוצא לקרנוזין, ולכן תוספת ממנה עשויה להגדיל מאגרי קרנוזין לאורך זמן.\u003c/p>\n\u003cdiv class=\"dg-slot\" data-id=\"14-carnosine-buffering\">\u003c/div>\n\u003cp>במקביל מוזכר \u003cstrong>סודיום ביקרבונאט\u003c/strong>, שהרעיון מאחוריו שונה: הגדלת יכולת הבופרינג בעיקר בנוזל החוץ־תאי. יש להימנע מלערבב בין מנגנון תוך־שרירי לזה של הנוזלים מחוץ לתאים.\u003c/p>\n\u003ch3>דיוק מדעי חשוב\u003c/h3>\n\u003cp>ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":55}'>שקופית \u003cbdi>55\u003c/bdi>\u003c/button> מוצגת שרשרת פשטנית של ״חומצת חלב ← חומציות ← עייפות״. במחקר המודרני אין לראות בלקטט עצמו את ״גורם העייפות״ באופן גורף; פעילות עצימה כוללת כמה תהליכים חופפים. לכן באתר יהיה מותר לשאול על \u003cstrong>הרעיון שמציגה השקופית\u003c/strong>, אך לא להציג את הטענה הפשטנית כקשר סיבתי יחיד ללא הסתייגות.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-steps beyond\" id=\"N06-A06\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">שלב אחר שלב\u003c/span>\u003cb>מחומציות לבופר: קרנוזין ובטא־אלנין\u003c/b>\u003c/div>\u003col class=\"steps\">\u003cli>\u003cspan>במאמץ עצים השריר מפיק אנרגיה מהר במסלול הגליקוליזה.\u003c/span>\u003c/li>\u003cli>\u003cspan>לפי המודל במצגת נוצרת חומצת חלב, ויוני מימן חופשיים מצטברים: החומציות בשריר ובדם עולה.\u003c/span>\u003c/li>\u003cli>\u003cspan>החומציות פוגעת ביכולת השריר להפיק כוח, הקצב יורד ומופיעה התעייפות.\u003c/span>\u003c/li>\u003cli>\u003cspan>קרנוזין בשריר קושר חלק מיוני המימן החופשיים ומפחית את החומציות. זו פעולת בופר, והיא מאפשרת המשך תפקוד.\u003c/span>\u003c/li>\u003cli>\u003cspan>קרנוזין נוצר מצימוד של חומצת האמינו היסטידין עם בטא־אלנין.\u003c/span>\u003c/li>\u003cli>\u003cspan>ריכוז בטא־אלנין בדם נמוך יחסית להיסטידין, ולכן הוא הגורם המגביל ביצירת קרנוזין.\u003c/span>\u003c/li>\u003cli>\u003cspan>תוסף בטא־אלנין מעלה את רמת הקרנוזין בשריר, וכך גדלה יכולת הבופר.\u003c/span>\u003c/li>\u003cli>\u003cspan>דיוק: במחקר המודרני לקטט עצמו אינו ״הרעלן״ שגורם לעייפות. יוני המימן נוצרים מכמה תהליכים, ולעייפות יש כמה סיבות. למבחן זכרי את רעיון הבופר: קשירת יוני מימן.\u003c/span>\u003c/li>\u003c/ol>\n    \u003cp class=\"add-src\">\u003cspan class=\"beyond-chip\">הבהרה מדעית מעבר למצגת\u003c/span> \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":55}'>שקופית \u003cbdi>55\u003c/bdi>\u003c/button> מציגה את חומצת החלב כגורם העייפות; במחקר המודרני יוני המימן אינם מיוחסים ללקטט בלבד, ועייפות השריר נובעת מכמה תהליכים חופפים. · \u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":55}'>\u003cbdi>55\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":56}'>\u003cbdi>56\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":57}'>\u003cbdi>57\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-check deck\" id=\"N06-A07\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">בדיקת הבנה\u003c/span>\u003cb>שאלת הבנה: למה דווקא בטא־אלנין?\u003c/b>\u003c/div>\u003cdiv class=\"lcheck\" data-id=\"N06-A07\">\u003cp class=\"lc-q\">\u003cb>קרנוזין נבנה מהיסטידין ומבטא־אלנין. למה התוסף שמעלה קרנוזין בשריר הוא דווקא בטא־אלנין?\u003c/b>\u003c/p>\u003cdiv class=\"lc-opts\">\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N06-A07\",\"i\":1}'>\u003cspan class=\"k\">א\u003c/span>\u003cspan>כי היסטידין אסור לשימוש לפי \u003cbdi>WADA\u003c/bdi>\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N06-A07\",\"i\":2}'>\u003cspan class=\"k\">ב\u003c/span>\u003cspan>כי בטא־אלנין עצמו קושר את יוני המימן במקום הקרנוזין\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N06-A07\",\"i\":3}'>\u003cspan class=\"k\">ג\u003c/span>\u003cspan>כי היסטידין אינו מצוי בגוף כלל\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N06-A07\",\"i\":0}'>\u003cspan class=\"k\">ד\u003c/span>\u003cspan>כי ריכוז בטא־אלנין בדם נמוך יחסית להיסטידין, ולכן הוא הגורם המגביל ביצירת קרנוזין\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"lc-exp\" hidden>\u003cp>לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":56}'>שקופית \u003cbdi>56\u003c/bdi>\u003c/button> יצירת הקרנוזין מוגבלת על ידי הרכיב הזמין פחות, ובדם זה בטא־אלנין, ולכן הוספתו מעלה את הקרנוזין. האפשרות שבטא־אלנין עצמו קושר יוני מימן מפתה, אבל לפי המצגת את הבופרינג עושה הקרנוזין, ובטא־אלנין הוא רק אבן הבניין המגבילה שלו.\u003c/p>\u003c/div>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":56}'>\u003cbdi>56\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":57}'>\u003cbdi>57\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"vx-slot\" data-id=\"VX-04\">\u003c/div>\n\u003cdiv class=\"notebox\" data-notes=\"4\">\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"54,55,56,57\" data-title=\"4. בטא־אלנין, קרנוזין והיכולת לבפר חומציות\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N06-5\">\u003ch2 class=\"part\">5. אבקות חלבון: כלי נוחות, לא קסם\u003c/h2>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":58}'>שקופיות \u003cbdi>58–59\u003c/bdi>\u003c/button> מסבירות שצריכת חלבון מספקת חשובה לעלייה בכוח ולבניית שריר, אך אין הוכחה כללית לכך שצריכה מאבקה \u003cem>כשלעצמה\u003c/em> עדיפה על מזון שמספק חלבון באיכות ובכמות המתאימות. לשימוש באבקת חלבון עשוי להיות יתרון נוחות כאשר המזון אינו זמין או כשקשה להגיע לצריכה מספקת. יש להבחין גם כאן בין תוסף שמוסיף רכיב חסר לבין תוסף שמשנה את ביצועי הגוף ישירות.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-example deck\" id=\"N06-A08\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">דוגמה מהאימון\u003c/span>\u003cb>מתי אבקה מוצדקת: שתי שחקניות\u003c/b>\u003c/div>\u003cp>\u003cstrong>שחקנית א׳\u003c/strong> בקבוצת כדורסל אוכלת ארוחות מסודרות עם מקורות חלבון ומגיעה לכמות החלבון הנדרשת לה. לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":59}'>שקופית \u003cbdi>59\u003c/bdi>\u003c/button> צריכת חלבון נאותה היא שמשפרת כוח ומסת שריר, ואין הוכחה שחלבון מתוסף מביא תוצאות טובות יותר. אבקה לא תיתן לה יתרון.\u003c/p>\u003cp>\u003cstrong>שחקנית ב׳\u003c/strong> באותה קבוצה נמצאת בטורניר עם ימי משחקים ארוכים ונסיעות. לעתים אין לה מזון זמין, וקשה לה להגיע לכמות החלבון הנדרשת מהמזון. אלה בדיוק שני המצבים שבהם המצגת אומרת שתוסף מוצדק.\u003c/p>\u003cp>\u003cstrong>העיקרון:\u003c/strong> השאלה איננה ״אבקה או לא״, אלא האם מגיעים לכמות חלבון מספקת. האבקה היא כלי להשלמה.\u003c/p>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופית \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":59}'>\u003cbdi>59\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"58,59\" data-title=\"5. אבקות חלבון: כלי נוחות, לא קסם\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N06-6\">\u003ch2 class=\"part\">6. טבלת השוואה חשובה\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>תוסף\u003c/th>\u003cth>רעיון פיזיולוגי\u003c/th>\u003cth>סוג מאמץ או הקשר\u003c/th>\u003cth>עיתוי\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">קפאין\u003c/th>\u003ctd>ערנות/תפיסת מאמץ ומנגנונים נוספים\u003c/td>\u003ctd>יכול לסייע במצבי סבולת ומאמץ שונים\u003c/td>\u003ctd>השפעה אקוטית יחסית\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">קריאטין\u003c/th>\u003ctd>הגדלת מאגרי פוספוקריאטין\u003c/td>\u003ctd>מאמצים קצרים ועצימים\u003c/td>\u003ctd>שימוש לאורך זמן\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">בטא־אלנין\u003c/th>\u003ctd>העלאת קרנוזין בשריר\u003c/td>\u003ctd>מאמצים שבהם בופרינג רלוונטי\u003c/td>\u003ctd>שימוש לאורך זמן\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">סודיום ביקרבונאט\u003c/th>\u003ctd>בופרינג חוץ־תאי\u003c/td>\u003ctd>מצבי מאמץ עצים מסוימים\u003c/td>\u003ctd>תלוי אסטרטגיה, לא מפורט כמתכון\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">אבקת חלבון\u003c/th>\u003ctd>השלמה של צריכת חלבון\u003c/td>\u003ctd>נוחות תזונתית\u003c/td>\u003ctd>לפי יכולת להגיע לצריכה מספקת\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"dg-slot\" data-id=\"06-supplements\">\u003c/div>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":45}' aria-label=\"הגדלת שקופית 45\">\u003cimg src=\"images/slide_45.webp\" alt=\"שקופית 45: חלוקת תוספים לפי רמת הראיות במצגת\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":45}'>שקופית \u003cbdi>45\u003c/bdi>\u003c/button>: חלוקת תוספים לפי רמת הראיות במצגת\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-check deck\" id=\"N06-A09\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">בדיקת הבנה\u003c/span>\u003cb>שאלת יישום: איזה תוסף לאיזה מאמץ?\u003c/b>\u003c/div>\u003cdiv class=\"lcheck\" data-id=\"N06-A09\">\u003cp class=\"lc-q\">\u003cb>אצנית 100 מטר ורצת מרתון בוחרות כל אחת תוסף אחד מקבוצת ״יעילותם הוכחה״. איזה שילוב מתאים לעקרונות המצגת?\u003c/b>\u003c/p>\u003cdiv class=\"lc-opts\">\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N06-A09\",\"i\":1}'>\u003cspan class=\"k\">א\u003c/span>\u003cspan>קריאטין לרצת המרתון, כי הוא מאריך את משך המאמץ\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N06-A09\",\"i\":3}'>\u003cspan class=\"k\">ב\u003c/span>\u003cspan>גלוטמין לשתיהן, כי יעילותו הוכחה\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N06-A09\",\"i\":2}'>\u003cspan class=\"k\">ג\u003c/span>\u003cspan>קפאין לאצנית בלבד, כי השפעתו נבנית לאורך שבועות\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N06-A09\",\"i\":0}'>\u003cspan class=\"k\">ד\u003c/span>\u003cspan>קריאטין לאצנית ה־100 מטר, וקפאין לרצת המרתון\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"lc-exp\" hidden>\u003cp>קריאטין מאריך את השימוש במערכת הפוספוגנית ולכן מתאים למאמץ קצר ועצים (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":52}'>שקופיות \u003cbdi>52–53\u003c/bdi>\u003c/button>), ואילו קפאין מתואר ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":48}'>שקופית \u003cbdi>48\u003c/bdi>\u003c/button> כמאריך את משך המאמץ בסבולת לב־ריאה. קריאטין לרצת המרתון מפתה כי ׳הארכת משך המאמץ׳ נשמע מתאים, אבל זו השפעת הקפאין בסבולת; וגלוטמין נמצא בכלל בקבוצה שיעילותה עדיין נבדקת.\u003c/p>\u003c/div>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":45}'>\u003cbdi>45\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":48}'>\u003cbdi>48\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":52}'>\u003cbdi>52\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":53}'>\u003cbdi>53\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"notebox\" data-notes=\"10\">\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"45\" data-title=\"6. טבלת השוואה חשובה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N06-7\">\u003ch2 class=\"part\">7. שאלות יישום\u003c/h2>\n\u003cp>\u003cstrong>א. מדוע קריאטין מתאים יותר כעיקרון למאמצים קצרים ועצימים מאשר לריצת מרתון?\u003c/strong> מאחר שמערכת הפוספאגן מספקת \u003cbdi>ATP\u003c/bdi> במהירות למשכים קצרים, בעוד מאמץ ממושך תלוי בעיקר במסלולים אירוביים.\u003c/p>\n\u003cp>\u003cstrong>ב. מה ההבדל העיקרי בין קפאין לקריאטין בעיתוי?\u003c/strong> קפאין יכול להיות רלוונטי בסמיכות לזמן הפעילות, וקריאטין קשור יותר להצטברות מאגרים עם שימוש מתמשך.\u003c/p>\n\u003cp>\u003cstrong>ג. מדוע לא מספיק לכתוב על תוסף ״עובד״?\u003c/strong> צריך לציין לאיזה יעד, מי האוכלוסייה, איזו איכות ראיות, ומהם הסיכונים.\u003c/p>\n\u003cp>\u003cstrong>ד. מדוע אבקת חלבון אינה עדיפה אוטומטית על כריך או ארוחה?\u003c/strong> העיקר הוא כמות ואיכות הרכיבים המתקבלים ולא צורת השיווק שלהם.\u003c/p>\n\u003cdiv class=\"keywords\">\u003cspan class=\"tag\">מילות מפתח\u003c/span>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;ארגוגני&quot;}'>ארגוגני\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;WADA&quot;}'>\u003cbdi>WADA\u003c/bdi>\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;קפאין&quot;}'>קפאין\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;מחצית חיים&quot;}'>מחצית חיים\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;ATP–CP&quot;}'>\u003cbdi>ATP–CP\u003c/bdi>\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;קריאטין&quot;}'>קריאטין\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;פוספוקריאטין&quot;}'>פוספוקריאטין\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;קרנוזין&quot;}'>קרנוזין\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;בטא־אלנין&quot;}'>בטא־אלנין\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;ביקרבונאט&quot;}'>ביקרבונאט\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;אבקת חלבון&quot;}'>אבקת חלבון\u003c/button>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"\" data-title=\"7. שאלות יישום\">\u003c/div>\u003c/section>","key":"L-N06"},{"topicId":"N07","title":"ויטמינים, מינרלים, ברזל, סידן וסטרס חמצוני","unit":"יחידה 07","sections":[{"id":"s-N07-1","title":"1. מיקרונוטריאנטים אינם מספקים קלוריות אך נדרשים לתפקוד","slides":[61]},{"id":"s-N07-2","title":"2. מסיסות בוויטמינים: למה יש לזה משמעות?","slides":[62]},{"id":"s-N07-3","title":"3. למה תוספים אינם שווי ערך למזון מגוון?","slides":[63]},{"id":"s-N07-4","title":"4. ברזל: קשר ישיר להובלת חמצן","slides":[64,65]},{"id":"s-N07-5","title":"5. סידן: לא רק לעצמות","slides":[66,67,68]},{"id":"s-N07-6","title":"6. ויטמיני B, B12 וחומצה פולית","slides":[69,70,71]},{"id":"s-N07-7","title":"7. סטרס חמצוני ונוגדי חמצון","slides":[72,73]},{"id":"s-N07-8","title":"8. טבלת זיכרון","slides":[]},{"id":"s-N07-9","title":"9. שאלות עם פתרונות","slides":[]}],"html":"\u003cp class=\"lsrc\">\u003cspan class=\"tag\">מקור\u003c/span> \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":60}'>שקופיות \u003cbdi>60–73\u003c/bdi>\u003c/button>. \u003cstrong>מטרת הפרק:\u003c/strong> להבין מה מאפשרים המיקרונוטריאנטים, למה מחסור חשוב ולמה תוסף ללא חסר אינו משפר אוטומטית ביצועים.\u003c/p>\n\u003csection class=\"lsec\" id=\"s-N07-1\">\u003ch2 class=\"part\">1. מיקרונוטריאנטים אינם מספקים קלוריות אך נדרשים לתפקוד\u003c/h2>\n\u003cp>מיקרונוטריאנטים הם ויטמינים ומינרלים. ה\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":61}'>שקופית \u003cbdi>61\u003c/bdi>\u003c/button> מדגישה שהם דרושים בכמויות קטנות יחסית, לעתים במיליגרמים או במיקרוגרמים, ואינם תורמים קלוריות. עם זאת, הם משתתפים במערכות אנזימתיות, הולכה עצבית, בניית רקמות, הפקת אנרגיה ותהליכים רבים נוספים. כאן חשוב במיוחד להבחין בין \u003cstrong>חומר שממנו מפיקים אנרגיה\u003c/strong> לבין \u003cstrong>חומר הנחוץ לכך שמערכת ההפקה תעבוד כראוי\u003c/strong>.\u003c/p>\n\u003cdiv class=\"dg-slot\" data-id=\"08-micronutrients\">\u003c/div>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-misconception deck\" id=\"N07-A01\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">טעות נפוצה\u003c/span>\u003cb>״ויטמינים נותנים אנרגיה״\u003c/b>\u003c/div>\u003cp>\u003cstrong>האמונה השגויה:\u003c/strong> ויטמיני \u003cbdi>B\u003c/bdi> ״נותנים אנרגיה״, ולכן כדור ויטמינים לפני תחרות יוסיף כוח.\u003c/p>\u003cp>\u003cstrong>למה זה שגוי:\u003c/strong> מיקרונוטריאנטים אינם מכילים קלוריות (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":61}'>שקופית \u003cbdi>61\u003c/bdi>\u003c/button>). ויטמיני \u003cbdi>B\u003c/bdi> \u003cstrong>מעורבים בייצור\u003c/strong> אנרגיה (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":69}'>שקופית \u003cbdi>69\u003c/bdi>\u003c/button>). כלומר הם חלק מהכלים של ״המפעל״, לא הדלק שנכנס אליו. הדלק מגיע מפחמימות, משומנים ומחלבונים.\u003c/p>\u003cp>\u003cstrong>הניסוח הנכון:\u003c/strong> ויטמינים ומינרלים מאפשרים לגוף להפיק אנרגיה מהמזון, אך אינם מקור אנרגיה בעצמם. כשצריכת האנרגיה גבוהה, הצרכים בדרך כלל נענים דרך התזונה (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":69}'>שקופית \u003cbdi>69\u003c/bdi>\u003c/button>).\u003c/p>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":61}'>\u003cbdi>61\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":69}'>\u003cbdi>69\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"61\" data-title=\"1. מיקרונוטריאנטים אינם מספקים קלוריות אך נדרשים לתפקוד\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N07-2\">\u003ch2 class=\"part\">2. מסיסות בוויטמינים: למה יש לזה משמעות?\u003c/h2>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":62}'>שקופית \u003cbdi>62\u003c/bdi>\u003c/button> מחלקת את הוויטמינים לפי המסיסות והאגירה. \u003cstrong>ויטמינים מסיסי שומן \u003cbdi>A\u003c/bdi>, \u003cbdi>D\u003c/bdi>, \u003cbdi>E\u003c/bdi>, \u003cbdi>K\u003c/bdi>\u003c/strong> נספגים יחד עם שומן תזונתי באופן התלוי במנגנוני ספיגה מתאימים ויכולים להיאגר בגוף. לכן צריכה גבוהה מתוספים של חלק מהם עלולה להיות בעייתית. \u003cstrong>ויטמינים מסיסי מים\u003c/strong> פועלים אחרת מבחינת פיזור ואגירה, אף שאין מכך להסיק שכל עודף שלהם תמיד בטוח.\u003c/p>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":62}'>שקופית \u003cbdi>62\u003c/bdi>\u003c/button> מתייחסת גם להשפעת כמות סיבים גבוהה על ספיגת רכיבים מסוימים. חשוב לא להפוך זאת למסקנה שסיבים ״מזיקים״: השפעתם תלויה בכמות, בסוג וברכיב, ובתזונה מאוזנת הם בדרך כלל תורמים לבריאות.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-compare beyond\" id=\"N07-A02\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">השוואה\u003c/span>\u003cb>ויטמינים מסיסי שומן מול מסיסי מים\u003c/b>\u003c/div>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>מסיסי שומן\u003c/th>\u003cth>מסיסי מים\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">מי בקבוצה\u003c/th>\u003ctd>\u003cbdi>A\u003c/bdi>, \u003cbdi>D\u003c/bdi>, \u003cbdi>E\u003c/bdi>, \u003cbdi>K\u003c/bdi>\u003c/td>\u003ctd>ויטמיני \u003cbdi>B\u003c/bdi>, וגם ויטמין \u003cbdi>C\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">ספיגה\u003c/th>\u003ctd>מזון שומני מסייע בספיגתם (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":62}'>שקופית \u003cbdi>62\u003c/bdi>\u003c/button>)\u003c/td>\u003ctd>מתמוססים במים ואינם תלויים בשומן שבארוחה\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">אגירה\u003c/th>\u003ctd>נאגרים בגוף (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":62}'>שקופית \u003cbdi>62\u003c/bdi>\u003c/button>)\u003c/td>\u003ctd>אגירה מוגבלת יחסית ועודף מופרש ברובו בשתן (\u003cbdi>B12\u003c/bdi> יוצא דופן ונאגר בכבד)\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">עודף\u003c/th>\u003ctd>צריכה עודפת עלולה להזיק (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":62}'>שקופית \u003cbdi>62\u003c/bdi>\u003c/button>)\u003c/td>\u003ctd>סיכון נמוך יותר, אבל עודף ממושך מתוספים אינו בהכרח בטוח\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">משמעות מעשית\u003c/th>\u003ctd>המאגר בגוף מאפשר גמישות בין ימים\u003c/td>\u003ctd>צריך אספקה סדירה יותר מהתזונה\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"beyond-chip\">הבהרה מדעית מעבר למצגת\u003c/span> המצגת מתארת רק את הקבוצה מסיסת השומן; עמודת מסיסי המים (ויטמיני \u003cbdi>B\u003c/bdi> ו־\u003cbdi>C\u003c/bdi>, אגירה מוגבלת והפרשה בשתן) היא ידע מקובל מספרי הלימוד. · \u003cspan class=\"small muted\">לפי שקופית \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":62}'>\u003cbdi>62\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-check deck\" id=\"N07-A03\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">בדיקת הבנה\u003c/span>\u003cb>בדיקת הבנה: ספיגה עם ארוחה\u003c/b>\u003c/div>\u003cdiv class=\"lcheck\" data-id=\"N07-A03\">\u003cp class=\"lc-q\">\u003cb>מתאמנת נוטלת כמוסת ויטמין \u003cbdi>D\u003c/bdi> (לפי המלצת רופא). מדוע הספיגה עשויה להיות טובה יותר כשהיא נוטלת אותה עם ארוחה שיש בה מעט שומן?\u003c/b>\u003c/p>\u003cdiv class=\"lc-opts\">\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N07-A03\",\"i\":1}'>\u003cspan class=\"k\">א\u003c/span>\u003cspan>כי ויטמין \u003cbdi>D\u003c/bdi> מסיס שומן, ומזון שומני מסייע בספיגתו\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N07-A03\",\"i\":2}'>\u003cspan class=\"k\">ב\u003c/span>\u003cspan>כי השומן בארוחה הופך את ויטמין \u003cbdi>D\u003c/bdi> לסידן\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N07-A03\",\"i\":3}'>\u003cspan class=\"k\">ג\u003c/span>\u003cspan>כי הסיבים התזונתיים בארוחה מגבירים את ספיגתו\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N07-A03\",\"i\":0}'>\u003cspan class=\"k\">ד\u003c/span>\u003cspan>כי ויטמין \u003cbdi>D\u003c/bdi> מסיס במים, ולכן הארוחה מוסיפה לו נוזלים\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"lc-exp\" hidden>\u003cp>ויטמין \u003cbdi>D\u003c/bdi> שייך לקבוצת \u003cbdi>A\u003c/bdi>, \u003cbdi>D\u003c/bdi>, \u003cbdi>E\u003c/bdi>, \u003cbdi>K\u003c/bdi>, ו\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":62}'>שקופית \u003cbdi>62\u003c/bdi>\u003c/button> קובעת שמזון שומני מסייע בספיגת הוויטמינים האלה. התשובה על הסיבים מפתה כי מדובר ב״ארוחה בריאה״, אבל לפי אותה שקופית סיבים דווקא מעכבים ספיגה של ויטמינים ומינרלים.\u003c/p>\u003c/div>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופית \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":62}'>\u003cbdi>62\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"62\" data-title=\"2. מסיסות בוויטמינים: למה יש לזה משמעות?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N07-3\">\u003ch2 class=\"part\">3. למה תוספים אינם שווי ערך למזון מגוון?\u003c/h2>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":63}'>שקופית \u003cbdi>63\u003c/bdi>\u003c/button> קובעת שתיסוף ויטמינים ומינרלים אינו משפר באופן אוטומטי ביצועים אצל מי שמקבלים תזונה מתאימה לצורכיהם. לעומת זאת, אם קיים מחסור מתועד, תיקון החסר עשוי לשפר תפקוד ובריאות. זהו ההבדל בין \u003cstrong>תיקון בעיה קיימת\u003c/strong> לבין \u003cstrong>נטילת חומר עודף מתוך מחשבה שיהיה שיפור נוסף\u003c/strong>. המלצות לתיסוף מחייבות במציאות בדיקה והתאמה מקצועית.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-example deck\" id=\"N07-A04\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">דוגמה מהאימון\u003c/span>\u003cb>שתי שחקניות, אותו בקבוק תוסף\u003c/b>\u003c/div>\u003cp>נועה ומאיה משחקות כדורסל באותה קבוצה.\u003c/p>\u003cul>\u003cli>\u003cstrong>נועה\u003c/strong> אוכלת תזונה מאוזנת ולוקחת מולטי־ויטמין כדי לקפוץ גבוה יותר. לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":63}'>שקופית \u003cbdi>63\u003c/bdi>\u003c/button> אין לצפות לשיפור. עודף של ויטמין מסיס שומן אף עלול להזיק (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":62}'>שקופית \u003cbdi>62\u003c/bdi>\u003c/button>).\u003c/li>\u003cli>\u003cstrong>מאיה\u003c/strong> עייפה כל הזמן. אנשי מקצוע בודקים אותה ומוצאים חסר. אצלה התיסוף צפוי להועיל (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":63}'>שקופית \u003cbdi>63\u003c/bdi>\u003c/button>).\u003c/li>\u003c/ul>\u003cp>\u003cstrong>השורה התחתונה:\u003c/strong> אצל מאיה התוסף \u003cstrong>מתקן חסר\u003c/strong>, אצל נועה הוא \u003cstrong>מוסיף עודף\u003c/strong>.\u003c/p>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":62}'>\u003cbdi>62\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":63}'>\u003cbdi>63\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"63\" data-title=\"3. למה תוספים אינם שווי ערך למזון מגוון?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N07-4\">\u003ch2 class=\"part\">4. ברזל: קשר ישיר להובלת חמצן\u003c/h2>\n\u003cp>המצגת ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":64}'>שקופיות \u003cbdi>64–65\u003c/bdi>\u003c/button> מתמקדת בברזל ובהשלכות מחסור. ברזל הוא רכיב חשוב בהמוגלובין, ולכן מחסור משמעותי עשוי לפגוע ביכולת הובלת החמצן. אם המחסור מוביל לאנמיה, הוא עשוי להתבטא בעייפות, חולשה, ירידה בריכוז ובביצועים אירוביים. ההשפעה בולטת במיוחד בפעילות שבה אספקת חמצן נמשכת חיונית לאורך זמן. עם זאת, לא כל עייפות מעידה על מחסור בברזל, והבדיקה והטיפול שייכים למערכת הבריאות.\u003c/p>\n\u003cdiv class=\"dg-slot\" data-id=\"15-iron-oxygen\">\u003c/div>\n\u003caside class=\"gnote q\">\u003cspan class=\"tag\">מקרה\u003c/span>\u003cdiv>\u003cp>אדם מתאמן מתקשה להחזיק קצב בריצה ממושכת ומתלונן על עייפות. האם מותר לקבוע שהוא סובל מאנמיה על בסיס התיאור? לא. ניתן להסביר את המנגנון האפשרי של השפעת אנמיה על ביצועים, אך לא לאבחן ללא נתונים.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-steps beyond\" id=\"N07-A05\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">שלב אחר שלב\u003c/span>\u003cb>מהברזל שבצלחת ועד החמצן בשריר\u003c/b>\u003c/div>\u003col class=\"steps\">\u003cli>\u003cspan>ברזל מגיע מהמזון ונספג במעי. כמות גבוהה של סיבים עלולה לעכב את ספיגתו (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":62}'>שקופית \u003cbdi>62\u003c/bdi>\u003c/button>).\u003c/span>\u003c/li>\u003cli>\u003cspan>בגוף הברזל נכלל בהמוגלובין, החלבון שבתוך תאי הדם האדומים.\u003c/span>\u003c/li>\u003cli>\u003cspan>בריאות ההמוגלובין קושר חמצן, והדם מוביל אותו לשרירים העובדים.\u003c/span>\u003c/li>\u003cli>\u003cspan>בשריר החמצן משמש להפקת אנרגיה במאמץ אירובי, למשל ריצה של 30 דקות (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":65}'>שקופית \u003cbdi>65\u003c/bdi>\u003c/button>).\u003c/span>\u003c/li>\u003cli>\u003cspan>בחסר שמוביל לאנמיה יש פחות המוגלובין, ולכן פחות חמצן מגיע לשריר.\u003c/span>\u003c/li>\u003cli>\u003cspan>התוצאה לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":65}'>שקופית \u003cbdi>65\u003c/bdi>\u003c/button>: פגיעה משמעותית בצח״מ, ירידה בסף האנאירובי וירידה ביכולת העבודה לטווח ארוך. לכן הפגיעה הגדולה ביותר היא במאמצים אירוביים.\u003c/span>\u003c/li>\u003c/ol>\n    \u003cp class=\"add-src\">\u003cspan class=\"beyond-chip\">הבהרה מדעית מעבר למצגת\u003c/span> המצגת מפרטת את השפעות חסר הברזל; המנגנון דרך המוגלובין בתאי הדם האדומים שקושר חמצן בריאות הוא פיזיולוגיה מקובלת מספרי הלימוד. · \u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":62}'>\u003cbdi>62\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":64}'>\u003cbdi>64\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":65}'>\u003cbdi>65\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-check deck\" id=\"N07-A06\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">בדיקת הבנה\u003c/span>\u003cb>בדיקת הבנה: מי נפגע יותר מאנמיה?\u003c/b>\u003c/div>\u003cdiv class=\"lcheck\" data-id=\"N07-A06\">\u003cp class=\"lc-q\">\u003cb>לשני ספורטאים יש אנמיה מחסר ברזל באותה מידה: רץ 10 ק״מ ומטיל כדור ברזל. לפי המצגת, אצל מי צפויה פגיעה גדולה יותר בביצוע, ולמה?\u003c/b>\u003c/p>\u003cdiv class=\"lc-opts\">\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N07-A06\",\"i\":1}'>\u003cspan class=\"k\">א\u003c/span>\u003cspan>אצל הרץ, כי מאמץ ארוך תלוי באספקת חמצן רציפה לשריר\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N07-A06\",\"i\":2}'>\u003cspan class=\"k\">ב\u003c/span>\u003cspan>אצל שניהם באותה מידה, כי אנמיה פוגעת רק בריכוז\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N07-A06\",\"i\":3}'>\u003cspan class=\"k\">ג\u003c/span>\u003cspan>אצל אף אחד, כי ברזל קשור רק לבניית העצם\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N07-A06\",\"i\":0}'>\u003cspan class=\"k\">ד\u003c/span>\u003cspan>אצל מטיל הכדור, כי ברזל הוא שבונה את כוח השריר\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"lc-exp\" hidden>\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":65}'>שקופית \u003cbdi>65\u003c/bdi>\u003c/button> קובעת שהפגיעה המשמעותית ביותר היא במאמצים אירוביים, הדורשים שימוש בחמצן לאורך זמן, ולכן הרץ נפגע יותר. התשובה ״שניהם באותה מידה״ מפתה כי באמת יש לאנמיה השפעות מנטליות כמו ירידה בריכוז, אבל יש לה גם השפעות פיזיולוגיות על הצח״מ ועל הסף האנאירובי, והן פוגעות בעיקר במאמץ הארוך.\u003c/p>\u003c/div>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופית \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":65}'>\u003cbdi>65\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"64,65\" data-title=\"4. ברזל: קשר ישיר להובלת חמצן\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N07-5\">\u003ch2 class=\"part\">5. סידן: לא רק לעצמות\u003c/h2>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":66}'>שקופיות \u003cbdi>66–68\u003c/bdi>\u003c/button> מדגישות שסידן מצוי בעיקר בשלד ובשיניים אך יש לו תפקידים נוספים: הוא משתתף בתהליך כיווץ השריר, בקרישת דם ובוויסות תפקודים תאיים. ריכוז הסידן בדם נשמר בטווח מבוקר, בין השאר באמצעות מסלולים הורמונליים וויטמין \u003cbdi>D\u003c/bdi> שמשתתף בוויסות הספיגה והמאזן. חשוב לזכור שסידן אינו רק ״חומר קשיח שבונה עצם״ אלא גם יון פעיל במנגנוני איתות ובקרה.\u003c/p>\n\u003caside class=\"gnote q\">\u003cspan class=\"tag\">תרגיל משולב\u003c/span>\u003cdiv>\u003cp>מה יקרה אם תאי שריר לא יקבלו את אות הסידן הדרוש למנגנון הכיווץ? לא תתאפשר הפעלה תקינה של אינטראקציות החלבונים המתכווצים. זה מחבר את נושא התזונה לנושא הפיזיולוגיה שנלמד קודם.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-example beyond\" id=\"N07-A07\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">דוגמה מהאימון\u003c/span>\u003cb>סידן בריצה אחת\u003c/b>\u003c/div>\u003cp>רצה יוצאת לריצת שטח. סידן עובד אצלה בכמה מקומות בבת אחת:\u003c/p>\u003cul>\u003cli>\u003cstrong>מבנה:\u003c/strong> השלד סופג את העומס בכל צעד. סידן הוא יותר מ־98% מהחומר הקשה בעצמות ובשיניים (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":66}'>שקופית \u003cbdi>66\u003c/bdi>\u003c/button>).\u003c/li>\u003cli>\u003cstrong>כיווץ:\u003c/strong> כל כיווץ של שרירי הרגליים תלוי בסידן (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":68}'>שקופית \u003cbdi>68\u003c/bdi>\u003c/button>).\u003c/li>\u003cli>\u003cstrong>קרישה:\u003c/strong> אם היא נשרטת בנפילה, סידן משתתף בקרישה (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":68}'>שקופית \u003cbdi>68\u003c/bdi>\u003c/button>).\u003c/li>\u003cli>\u003cstrong>בקרה:\u003c/strong> רמת הסידן בדם נשמרת קבועה בבקרה הורמונלית, וויטמין \u003cbdi>D\u003c/bdi> משפר את ספיגתו (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":66}'>שקופיות \u003cbdi>66–67\u003c/bdi>\u003c/button>).\u003c/li>\u003c/ul>\u003cp>\u003cstrong>למה הבקרה חשובה?\u003c/strong> כיווץ וקרישה דורשים רמת סידן יציבה בדם בכל רגע. כשהצריכה מהמזון נמוכה, הבקרה יכולה לשחרר סידן מהעצם כדי לשמור על הרמה בדם. העצם משמשת גם כ״מחסן״.\u003c/p>\n    \u003cp class=\"add-src\">\u003cspan class=\"beyond-chip\">הבהרה מדעית מעבר למצגת\u003c/span> העובדה שהבקרה ההורמונלית יכולה לשחרר סידן מהעצם כדי לשמור על רמתו בדם אינה מופיעה בשקופיות; זו פיזיולוגיה מקובלת. · \u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":66}'>\u003cbdi>66\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":67}'>\u003cbdi>67\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":68}'>\u003cbdi>68\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"66,67,68\" data-title=\"5. סידן: לא רק לעצמות\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N07-6\">\u003ch2 class=\"part\">6. ויטמיני \u003cbdi>B\u003c/bdi>, \u003cbdi>B12\u003c/bdi> וחומצה פולית\u003c/h2>\n\u003cp>ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":69}'>שקופית \u003cbdi>69\u003c/bdi>\u003c/button> מופיעים ויטמיני \u003cbdi>B\u003c/bdi> כמשתתפים במערכות הקשורות לניצול אנרגיה. המצגת אינה ממליצה על תיסוף גורף. \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":70}'>שקופיות \u003cbdi>70–71\u003c/bdi>\u003c/button> מתייחסות ל־\u003cbdi>B12\u003c/bdi> ולחומצה פולית, בעלי תפקיד ביצירת תאי דם אדומים ובהתנהלות תקינה של מערכת העצבים. לכן מחסור יכול להשפיע על תפקוד גופני וקוגניטיבי. ההבחנה בין מקור טבעי במזון לבין מזון מועשר חשובה: המצגת מציגה את מקור \u003cbdi>B12\u003c/bdi> מהמזון מן החי, אך גם מזון מהצומח שהועשר ב־\u003cbdi>B12\u003c/bdi> ותוספי \u003cbdi>B12\u003c/bdi> יכולים לספק אותו. יש לציין זאת במפורש ולא לנסח ״לא קיים כל מקור מחוץ למזון מהחי״.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-compare deck\" id=\"N07-A08\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">השוואה\u003c/span>\u003cb>\u003cbdi>B12\u003c/bdi> וחומצה פולית: מתפקיד לסימן מחסור\u003c/b>\u003c/div>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>תפקיד (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":71}'>שקופית \u003cbdi>71\u003c/bdi>\u003c/button>)\u003c/th>\u003cth>סימני מחסור שקשורים אליו\u003c/th>\u003cth>מה זה עלול לעשות למתאמנת\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">ייצור תאי דם אדומים\u003c/th>\u003ctd>אנמיה, עייפות ותשישות\u003c/td>\u003ctd>פחות יכולת להחזיק מאמץ ממושך, בדומה לחסר ברזל\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">תחזוקת מערכת העצבים המרכזית\u003c/th>\u003ctd>בלבול, פגיעה בזיכרון, בעיות בשיווי משקל, דיכאון\u003c/td>\u003ctd>פגיעה בשיווי המשקל, בריכוז ובקבלת החלטות במשחק\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופית \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":71}'>\u003cbdi>71\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-misconception beyond\" id=\"N07-A09\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">טעות נפוצה\u003c/span>\u003cb>״אין שום דרך לקבל \u003cbdi>B12\u003c/bdi> בלי מזון מהחי״\u003c/b>\u003c/div>\u003cp>\u003cstrong>האמונה השגויה:\u003c/strong> מי שאינה אוכלת מזון מהחי לא יכולה לקבל \u003cbdi>B12\u003c/bdi> בשום דרך.\u003c/p>\u003cp>\u003cstrong>למה זה לא מדויק:\u003c/strong> \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":70}'>שקופית \u003cbdi>70\u003c/bdi>\u003c/button> קובעת שהמקור היחידי לוויטמין הוא מהחי. זה נכון לגבי המקורות \u003cstrong>הטבעיים\u003c/strong> במזון. אבל יש מזונות מהצומח \u003cstrong>שהועשרו\u003c/strong> ב־\u003cbdi>B12\u003c/bdi>, ויש תוספי \u003cbdi>B12\u003c/bdi>.\u003c/p>\u003cp>\u003cstrong>הניסוח הנכון:\u003c/strong> במבחן כתבי כמו המצגת: המקור הטבעי של \u003cbdi>B12\u003c/bdi> הוא מזון מהחי. בהבהרה: מזון מועשר ותוספים מספקים אותו גם לטבעונים. כמו כל תיסוף, ההחלטה נעשית אחרי בדיקה וייעוץ של איש מקצוע (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":63}'>שקופית \u003cbdi>63\u003c/bdi>\u003c/button>).\u003c/p>\n    \u003cp class=\"add-src\">\u003cspan class=\"beyond-chip\">הבהרה מדעית מעבר למצגת\u003c/span> \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":70}'>שקופית \u003cbdi>70\u003c/bdi>\u003c/button> מציינת את החי כמקור היחידי; קיומם של מזונות מהצומח המועשרים ב־\u003cbdi>B12\u003c/bdi> ושל תוספי \u003cbdi>B12\u003c/bdi> הוא תוספת מעבר למצגת. · \u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":63}'>\u003cbdi>63\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":70}'>\u003cbdi>70\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"notebox\" data-notes=\"3\">\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"69,70,71\" data-title=\"6. ויטמיני B, B12 וחומצה פולית\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N07-7\">\u003ch2 class=\"part\">7. סטרס חמצוני ונוגדי חמצון\u003c/h2>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":72}'>שקופיות \u003cbdi>72–73\u003c/bdi>\u003c/button> מציגות \u003cstrong>סטרס חמצוני\u003c/strong> כמצב שבו קיים חוסר איזון בין ייצור חומרים מחמצנים לבין היכולת להתמודד איתם. רדיקלים חופשיים נוצרים באופן טבעי בתהליכים מטבוליים, והפקתם יכולה לעלות בזמן פעילות גופנית. \u003cstrong>נוגדי חמצון\u003c/strong> מסוגלים להשתתף בהפחתת הנזק המחמצן. חשוב לא להפוך זאת להמלצה אוטומטית על מינוני־על של תוספים, משום שגם איתותים הקשורים למאמץ ולהסתגלות לאימון מערבים תהליכים מחמצנים.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-steps deck\" id=\"N07-A10\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">שלב אחר שלב\u003c/span>\u003cb>איך נוצר סטרס חמצוני במאמץ\u003c/b>\u003c/div>\u003col class=\"steps\">\u003cli>\u003cspan>בגוף מתרחשים כל הזמן תהליכי חמצון, למשל בתהליך הפקת האנרגיה.\u003c/span>\u003c/li>\u003cli>\u003cspan>בתהליכים האלה נוצרים רדיקלים חופשיים.\u003c/span>\u003c/li>\u003cli>\u003cspan>בפעילות גופנית קצב ייצור הרדיקלים עולה משמעותית, וככל שהעצימות גבוהה יותר, הקצב עולה יותר.\u003c/span>\u003c/li>\u003cli>\u003cspan>נוגדי חמצון מגינים על התאים מפני הנזק שהרדיקלים גורמים.\u003c/span>\u003c/li>\u003cli>\u003cspan>כשריכוז הרדיקלים עולה (יותר ממה שההגנה מנטרלת), זהו סטרס חמצוני: הרדיקלים פוגעים בתאים ועלולים להביא להרס שלהם.\u003c/span>\u003c/li>\u003c/ol>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":72}'>\u003cbdi>72\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":73}'>\u003cbdi>73\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-misconception beyond\" id=\"N07-A11\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">טעות נפוצה\u003c/span>\u003cb>״עוד נוגדי חמצון = יותר ביצועים״\u003c/b>\u003c/div>\u003cp>\u003cstrong>האמונה השגויה:\u003c/strong> אימון עצים מייצר רדיקלים חופשיים, ולכן כדאי לקחת מינון גבוה של תוספי נוגדי חמצון אחרי כל אימון כדי לשפר ביצועים.\u003c/p>\u003cp>\u003cstrong>למה זה שגוי:\u003c/strong> לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":63}'>שקופית \u003cbdi>63\u003c/bdi>\u003c/button>, תוספים אינם משפרים ביצועים אצל מי שצורכת תזונה מאוזנת, ואין המלצה גורפת לתיסוף. בנוסף, הרדיקלים שנוצרים באימון הם גם אותות שעוזרים לגוף להסתגל לאימון. יש מחקרים שמצאו שמינונים גבוהים מאוד של נוגדי חמצון עלולים להחליש חלק מההסתגלויות.\u003c/p>\u003cp>\u003cstrong>הניסוח הנכון:\u003c/strong> נוגדי חמצון מגינים על התאים מפני נזק הרדיקלים (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":73}'>שקופית \u003cbdi>73\u003c/bdi>\u003c/button>). מקורם הטבעי הוא תזונה מגוונת, ותיסוף נעשה רק אחרי בדיקה וייעוץ מקצועי.\u003c/p>\n    \u003cp class=\"add-src\">\u003cspan class=\"beyond-chip\">הבהרה מדעית מעבר למצגת\u003c/span> המידע שרדיקלים שנוצרים באימון משמשים גם כאותות להסתגלות, ושמינונים גבוהים של תוספי נוגדי חמצון עשויים להחליש חלק מההסתגלויות, אינו מופיע במצגת. · \u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":63}'>\u003cbdi>63\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":72}'>\u003cbdi>72\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":73}'>\u003cbdi>73\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"72,73\" data-title=\"7. סטרס חמצוני ונוגדי חמצון\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N07-8\">\u003ch2 class=\"part\">8. טבלת זיכרון\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>רכיב\u003c/th>\u003cth>תפקיד מרכזי בהקשר הקורס\u003c/th>\u003cth>מה לשאול במבחן\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">ויטמינים מסיסי שומן\u003c/th>\u003ctd>ספיגה עם שומן ואגירה\u003c/td>\u003ctd>אילו אותיות נכללות בקבוצה?\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">ברזל\u003c/th>\u003ctd>חלק ממערכת הובלת החמצן\u003c/td>\u003ctd>איך אנמיה עשויה להשפיע על סבולת?\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">סידן\u003c/th>\u003ctd>עצם, כיווץ שריר וקרישה\u003c/td>\u003ctd>למה אין לראות בו רק רכיב של העצם?\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>B12\u003c/bdi> וחומצה פולית\u003c/th>\u003ctd>תהליכים הקשורים לדם ולמערכת העצבים\u003c/td>\u003ctd>כיצד חסר יכול להשפיע על תפקוד?\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">נוגדי חמצון\u003c/th>\u003ctd>הגנה מפני נזק חמצוני\u003c/td>\u003ctd>האם תיסוף תמיד משפר ביצוע? לא\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-check deck\" id=\"N07-A12\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">בדיקת הבנה\u003c/span>\u003cb>בדיקת הבנה: שני מסלולים לאנמיה\u003c/b>\u003c/div>\u003cdiv class=\"lcheck\" data-id=\"N07-A12\">\u003cp class=\"lc-q\">\u003cb>לפי המצגת, חסר באילו רכיבים יכול להוביל לאנמיה ולכן לפגוע ביכולת לבצע מאמץ ממושך?\u003c/b>\u003c/p>\u003cdiv class=\"lc-opts\">\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N07-A12\",\"i\":2}'>\u003cspan class=\"k\">א\u003c/span>\u003cspan>ויטמין \u003cbdi>K\u003c/bdi> ונוגדי חמצון\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N07-A12\",\"i\":3}'>\u003cspan class=\"k\">ב\u003c/span>\u003cspan>נתרן ואשלגן\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N07-A12\",\"i\":1}'>\u003cspan class=\"k\">ג\u003c/span>\u003cspan>סידן וויטמין \u003cbdi>D\u003c/bdi>\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N07-A12\",\"i\":0}'>\u003cspan class=\"k\">ד\u003c/span>\u003cspan>ברזל, וגם \u003cbdi>B12\u003c/bdi> וחומצה פולית\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"lc-exp\" hidden>\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":65}'>שקופית \u003cbdi>65\u003c/bdi>\u003c/button> מתארת חסר ברזל המוביל לאנמיה, ו\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":71}'>שקופית \u003cbdi>71\u003c/bdi>\u003c/button> מציינת אנמיה כסימן מחסור ב־\u003cbdi>B12\u003c/bdi> ובחומצה פולית, שמשתתפים בייצור תאי דם אדומים. האפשרות ״סידן וויטמין \u003cbdi>D\u003c/bdi>״ מפתה כי גם הם מינרל וויטמין שעובדים יחד, אבל המצגת קושרת אותם לעצם, לכיווץ שריר ולקרישה, לא לייצור תאי דם ולאנמיה.\u003c/p>\u003c/div>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":65}'>\u003cbdi>65\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":71}'>\u003cbdi>71\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"\" data-title=\"8. טבלת זיכרון\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N07-9\">\u003ch2 class=\"part\">9. שאלות עם פתרונות\u003c/h2>\n\u003col>\u003cli>\u003cdetails class=\"solve\">\u003csummary>מדוע תוסף ברזל עשוי לעזור לאדם עם חסר אך לא בהכרח לאחר?\u003c/summary>\u003cp>כי תיקון חסר יכול להחזיר תפקוד תקין, ואילו עודף אינו משפר בהכרח ביצוע.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>אילו ויטמינים מסיסי שומן?\u003c/summary>\u003cp>\u003cbdi>A\u003c/bdi>, \u003cbdi>D\u003c/bdi>, \u003cbdi>E\u003c/bdi>, \u003cbdi>K\u003c/bdi>.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>מה משותף לברזל ול־\u003cbdi>B12\u003c/bdi> מבחינת שאלת סבולת?\u003c/summary>\u003cp>שניהם עשויים להשפיע על מערכות הקשורות ליצירת דם או הובלת חמצן, אם קיים חסר.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>מה ההבדל בין רדיקל חופשי לנוגד חמצון?\u003c/summary>\u003cp>הראשון עשוי להשתתף בתהליכי חמצון ולגרום נזק בעודף; השני מסייע במנגנוני הגנה מאזנים.\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\n\u003cdiv class=\"keywords\">\u003cspan class=\"tag\">מילות מפתח\u003c/span>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;מיקרונוטריאנט&quot;}'>מיקרונוטריאנט\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;מסיס שומן&quot;}'>מסיס שומן\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;ADEK&quot;}'>\u003cbdi>ADEK\u003c/bdi>\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;ברזל&quot;}'>ברזל\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;אנמיה&quot;}'>אנמיה\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;סידן&quot;}'>סידן\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;ויטמין D&quot;}'>ויטמין \u003cbdi>D\u003c/bdi>\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;B12&quot;}'>\u003cbdi>B12\u003c/bdi>\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;חומצה פולית&quot;}'>חומצה פולית\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;סטרס חמצוני&quot;}'>סטרס חמצוני\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;נוגד חמצון&quot;}'>נוגד חמצון\u003c/button>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"\" data-title=\"9. שאלות עם פתרונות\">\u003c/div>\u003c/section>","key":"L-N07"},{"topicId":"N08","title":"תזונה לפני אימון, במהלך האימון ובסיומו","unit":"יחידה 08","sections":[{"id":"s-N08-1","title":"1. למה עיתוי האכילה משנה?","slides":[76,77,78]},{"id":"s-N08-2","title":"2. הארוחה המקדימה, שעות לפני האימון","slides":[79,80,81]},{"id":"s-N08-3","title":"3. ארוחה קטנה סמוך לאימון","slides":[82,83,84]},{"id":"s-N08-4","title":"4. מה קורה במהלך פעילות מתמשכת?","slides":[85,86,87,88]},{"id":"s-N08-5","title":"5. מה אוכלים במהלך אימון?","slides":[88]},{"id":"s-N08-6","title":"6. התאוששות וארוחה לאחר האימון","slides":[89,90]},{"id":"s-N08-7","title":"7. טבלת תזמון והשוואה","slides":[]},{"id":"s-N08-8","title":"8. תרגול חשיבה ביקורתית","slides":[]}],"html":"\u003cp class=\"lsrc\">\u003cspan class=\"tag\">מקור\u003c/span> \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":74}'>שקופיות \u003cbdi>74–90\u003c/bdi>\u003c/button>. זהו פרק ארוך ויישומי במיוחד; במבחן חשוב להבין את \u003cstrong>הסיבה לכל בחירה\u003c/strong> ולא רק לזכור מזון מסוים או זמן קבוע.\u003c/p>\n\u003csection class=\"lsec\" id=\"s-N08-1\">\u003ch2 class=\"part\">1. למה עיתוי האכילה משנה?\u003c/h2>\n\u003cp>המזון צריך להסתדר עם המשימה של הגוף. לפני מאמץ חשובה זמינות אנרגיה בלי להכביד על מערכת העיכול. במהלך מאמץ ממושך ייתכן צורך להשלים נוזלים ופחמימות. לאחר מאמץ חשובה התאוששות, בניית רקמות וחידוש מאגרים. אף שהעיתוי יכול להשפיע, צריך לזכור שהצריכה היומית הכוללת והיכולת לעמוד בצרכים לאורך זמן חשובות מאוד.\u003c/p>\n\u003cdiv class=\"dg-slot\" data-id=\"07-meal-timing\">\u003c/div>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":76}'>שקופיות \u003cbdi>76–78\u003c/bdi>\u003c/button> מזכירות שמזונות עשירים בסיבים ובשומן מאטים את ריקון הקיבה, ולכן הם עלולים לגרום אי־נוחות בזמן ריצה עצימה. לעומת זאת, קליטת פחמימות זמינות יכולה לשמש לתגבור אנרגיה. אין פירוש הדבר ששומנים וסיבים אינם חלק חשוב מתזונה טובה, אלא ש\u003cstrong>מזון שמתאים ביום רגיל לא בהכרח מתאים בדקות שלפני מאמץ\u003c/strong>.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-compare deck\" id=\"N08-A01\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">השוואה\u003c/span>\u003cb>ההשפעה המיידית של כל רכיב\u003c/b>\u003c/div>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>רכיב\u003c/th>\u003cth>השפעה מיידית (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":76}'>שקופיות \u003cbdi>76–78\u003c/bdi>\u003c/button>)\u003c/th>\u003cth>מה זה אומר סמוך לאימון\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">פחמימות פשוטות או מורכבות\u003c/th>\u003ctd>מעלות את רמת הסוכר בדם\u003c/td>\u003ctd>מקור לאנרגיה זמינה\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">פחמימות מלאות, סיבים תזונתיים\u003c/th>\u003ctd>מאטים את ריקון הקיבה, את העיכול ואת מעבר הסוכר לדם\u003c/td>\u003ctd>האנרגיה מגיעה לאט יותר, והקיבה מלאה יותר זמן\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">שומנים\u003c/th>\u003ctd>מאטים את ריקון הקיבה ומתעכלים לאט\u003c/td>\u003ctd>עלולים לגרום אי־נוחות בעיכול במהלך הפעילות\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">חלבונים\u003c/th>\u003ctd>אין השפעה מיידית\u003c/td>\u003ctd>אינם מקור לתגבור אנרגיה מהיר\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":76}'>\u003cbdi>76\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":77}'>\u003cbdi>77\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":78}'>\u003cbdi>78\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"76,77,78\" data-title=\"1. למה עיתוי האכילה משנה?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N08-2\">\u003ch2 class=\"part\">2. הארוחה המקדימה, שעות לפני האימון\u003c/h2>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":79}'>שקופיות \u003cbdi>79–81\u003c/bdi>\u003c/button> מציגות ארוחה כ־3–4 שעות לפני פעילות אירובית. המטרות: לשמור על זמינות גלוקוז, לתמוך במאגרי גליקוגן, לדחות עייפות ולשמור על נוחות מערכת העיכול ועל מצב נוזלים מתאים. מאפייניה במצגת: בעיקר פחמימות, מעט שומן וסיבים וכמות חלבון מתונה. כאשר הזמן לאימון ארוך יחסית, יש למערכת העיכול אפשרות לעכל ארוחה משמעותית יותר מאשר סמוך מאוד לפעילות.\u003c/p>\n\u003caside class=\"gnote kind\">\u003cspan class=\"tag\">דוגמה מהמצגת\u003c/span>\u003cdiv>\u003cp>פסטה עם עוף וירקות מבושלים יכולה להתאים כארוחה מוקדמת, אך גודל המנה והתאמתה לאדם חשובים יותר משם המנה. סטודנט צריך לדעת להסביר למה ארוחה גדולה דקות ספורות לפני ספרינט ממושך בעייתית, גם אם היא עשירה בפחמימות.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-example deck\" id=\"N08-A02\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">דוגמה מהאימון\u003c/span>\u003cb>שחיינית לפני תחרות אחר הצהריים\u003c/b>\u003c/div>\u003cp>שחיינית מתחרה ב־16:00. ב־12:30, כ־3.5 שעות לפני, היא אוכלת את ארוחת הצהריים מדוגמת המצגת: פסטה, חזה עוף בתנור וירקות מבושלים (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":81}'>שקופית \u003cbdi>81\u003c/bdi>\u003c/button>).\u003c/p>\u003cul>\u003cli>\u003cstrong>פסטה:\u003c/strong> בעיקר פחמימות מורכבות, לגלוקוז בדם ולמילוי גליקוגן בשרירים ובכבד (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":79}'>שקופיות \u003cbdi>79–80\u003c/bdi>\u003c/button>).\u003c/li>\u003cli>\u003cstrong>חזה עוף בתנור:\u003c/strong> חלבון בינוני ומעט שומן (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":80}'>שקופית \u003cbdi>80\u003c/bdi>\u003c/button>).\u003c/li>\u003cli>\u003cstrong>ירקות בכמות מתונה:\u003c/strong> מעט סיבים, לנוחות העיכול.\u003c/li>\u003cli>\u003cstrong>מים:\u003c/strong> למניעת התייבשות (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":79}'>שקופית \u003cbdi>79\u003c/bdi>\u003c/button>).\u003c/li>\u003c/ul>\u003cp>חברה מציעה לה מנה חדשה. היא מסרבת: לא מנסים מאכלים חדשים לפני תחרויות (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":80}'>שקופית \u003cbdi>80\u003c/bdi>\u003c/button>).\u003c/p>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":79}'>\u003cbdi>79\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":80}'>\u003cbdi>80\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":81}'>\u003cbdi>81\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"79,80,81\" data-title=\"2. הארוחה המקדימה, שעות לפני האימון\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N08-3\">\u003ch2 class=\"part\">3. ארוחה קטנה סמוך לאימון\u003c/h2>\n\u003cp>ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":82}'>שקופיות \u003cbdi>82–84\u003c/bdi>\u003c/button> מדברים על טווח של כ־15–60 דקות לפני האימון ועל ארוחה/נשנוש קטן יחסית המספק פחמימות ומים. דוגמאות במצגת: תמרים, לחם עם ריבה או חטיף דגנים דל בסיבים ובשומן. הרעיון הוא להגביר זמינות אנרגיה בלי להעמיס על העיכול. זו אינה חובה לכל אימון, וההעדפה תלויה גם במה שכבר נאכל קודם, בשעת האימון ובניסיון האישי.\u003c/p>\n\u003ch3>מקרה החלטה\u003c/h3>\n\u003cp>שתי מתאמנות יוצאות לריצה ארוכה. אחת אכלה ארוחה מלאה לפני שלוש שעות, והשנייה יצאה מהמיטה ללא ארוחה. האם שתיהן בהכרח צריכות את אותו נשנוש? לא. תזמון, מאגרי אנרגיה, תחושה אישית והיקף המאמץ משתנים, ואין צורך להעתיק תפריט אחיד לכל מצב.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-compare deck\" id=\"N08-A03\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">השוואה\u003c/span>\u003cb>שלוש ארוחות לפני אימון: מה ההבדל?\u003c/b>\u003c/div>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>3–4 שעות לפני\u003c/th>\u003cth>בין שעה ל־3–4 שעות לפני (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":84}'>שקופית \u003cbdi>84\u003c/bdi>\u003c/button>)\u003c/th>\u003cth>15–60 דקות לפני\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">מטרה\u003c/th>\u003ctd>גלוקוז תקין, מילוי גליקוגן, דחיית עייפות\u003c/td>\u003ctd>שילוב של שתי המטרות\u003c/td>\u003ctd>תגבור בפחמימות זמינות\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">הרכב\u003c/th>\u003ctd>בעיקר פחמימות מורכבות, מעט שומן וסיבים, חלבון בינוני\u003c/td>\u003ctd>כמו הארוחה המקדימה\u003c/td>\u003ctd>פחמימות ומים, לא מזון עשיר בחלבון, בשומן ובסיבים\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">כמות\u003c/th>\u003ctd>ארוחה מלאה\u003c/td>\u003ctd>קטנה יותר, כמו הארוחה הסמוכה\u003c/td>\u003ctd>קטנה: ארוחת ביניים\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">דוגמה\u003c/th>\u003ctd>פסטה, חזה עוף בתנור וירקות מבושלים\u003c/td>\u003ctd>כריך כן, צלחת פסטה לא\u003c/td>\u003ctd>2–4 תמרים, או פרוסת לחם וריבה, עם מים\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":79}'>\u003cbdi>79\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":80}'>\u003cbdi>80\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":82}'>\u003cbdi>82\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":83}'>\u003cbdi>83\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":84}'>\u003cbdi>84\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-check deck\" id=\"N08-A04\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">בדיקת הבנה\u003c/span>\u003cb>בדיקת הבנה: ריצה ארוכה אחרי ארוחה\u003c/b>\u003c/div>\u003cdiv class=\"lcheck\" data-id=\"N08-A04\">\u003cp class=\"lc-q\">\u003cb>רצה יוצאת לריצה של 15 ק״מ ב־18:00 ואוכלת ב־16:00 ארוחה אחת לפני הריצה. מדוע המצגת ממליצה שתאכל כמות קטנה יחסית?\u003c/b>\u003c/p>\u003cdiv class=\"lc-opts\">\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N08-A04\",\"i\":2}'>\u003cspan class=\"k\">א\u003c/span>\u003cspan>כי לפני ריצה ארוכה צריך להימנע מכל פחמימה\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N08-A04\",\"i\":3}'>\u003cspan class=\"k\">ב\u003c/span>\u003cspan>כי ארוחה גדולה מעלה מיד את רמת החלבון בדם\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N08-A04\",\"i\":1}'>\u003cspan class=\"k\">ג\u003c/span>\u003cspan>כי עדיף להגיע לריצה ארוכה כשמערכת העיכול העליונה מרוקנת, כדי להפחית תסמיני עיכול\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N08-A04\",\"i\":0}'>\u003cspan class=\"k\">ד\u003c/span>\u003cspan>כי פחמימות שנאכלות שעתיים לפני הריצה אינן נספגות כלל\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"lc-exp\" hidden>\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":84}'>שקופית \u003cbdi>84\u003c/bdi>\u003c/button> ממליצה להגיע לאימון ארוך כשמערכת העיכול העליונה מרוקנת, ולכן להימנע מכמות גדולה, משומן ומסיבים כשעתיים לפני; ההרכב נשאר בעיקר פחמימות. האפשרות ״להימנע מכל פחמימה״ מפתה כי מדובר בהקטנת הארוחה, אבל המצגת מקטינה את הכמות ולא מוציאה את הפחמימות, שהן עיקר הארוחה.\u003c/p>\u003c/div>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופית \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":84}'>\u003cbdi>84\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"82,83,84\" data-title=\"3. ארוחה קטנה סמוך לאימון\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N08-4\">\u003ch2 class=\"part\">4. מה קורה במהלך פעילות מתמשכת?\u003c/h2>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":85}'>שקופית \u003cbdi>85\u003c/bdi>\u003c/button> מציגה גרף להשוואת ריכוזי גלוקוז והיכולת להמשיך במאמץ בנוכחות או בהיעדר צריכת פחמימות. חשוב לתאר את \u003cstrong>מה שהגרף מנסה להמחיש\u003c/strong>: במאמץ ממושך, אספקת פחמימות מבחוץ עשויה לסייע לשמירה על זמינות גלוקוז, בעוד ללא צריכה יכולות להתרחש ירידות משמעותיות בחלק מהמצבים. אסור לנסח מכך ״כל אדם יחווה היפוגליקמיה אחרי שעתיים בדיוק״.\u003c/p>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":85}' aria-label=\"הגדלת שקופית 85\">\u003cimg src=\"images/slide_85.webp\" alt=\"שקופית 85: גרף השפעת צריכת פחמימות במהלך מאמץ\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":85}'>שקופית \u003cbdi>85\u003c/bdi>\u003c/button>: גרף השפעת צריכת פחמימות במהלך מאמץ\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":86}'>שקופיות \u003cbdi>86–88\u003c/bdi>\u003c/button> מציגות הבחנה בין פעילות קצרה, פעילות של כשעה עד שעתיים, ופעילות ממושכת יותר. המסר היישומי: במאמץ קצר יחסית, במיוחד לאחר תזונה מספקת, תרומת האכילה תוך כדי יכולה להיות קטנה. ככל שהפעילות מתמשכת, הסבירות לתועלת מצריכת פחמימות גדלה. באימוני משחק מתחלפים שמערבים ריכוז ושינויים בעצימות ייתכנו שיקולים אחרים מאשר בפעילות מחזורית מתונה.\u003c/p>\n\u003cp>המצגת מזכירה שילוב של גלוקוז ופרוקטוז בפעילות ארוכה. בהעשרה: אלו חד־סוכרים המשתמשים במנגנוני ספיגה שונים, ולכן שילובם יכול לסייע כשצריכת הפחמימות גבוהה במאמצי סבולת ארוכים. אין צורך לתת לפרק זה מתכון נטילה אישי.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-compare deck\" id=\"N08-A05\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">השוואה\u003c/span>\u003cb>תיסוף פחמימות לפי משך הפעילות\u003c/b>\u003c/div>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>משך ואופי הפעילות\u003c/th>\u003cth>מה ראו (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":85}'>שקופיות \u003cbdi>85–86\u003c/bdi>\u003c/button>)\u003c/th>\u003cth>המסקנה במצגת\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">עד שעה\u003c/th>\u003ctd>רמת הסוכר דומה בין מי שאוכלת לבין מי שלא, ואין הבדל ביכולת\u003c/td>\u003ctd>תיסוף לא רלוונטי, בהנחה שהיו ארוחות מסודרות\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">שעה עד שעתיים, מאמץ מחזורי\u003c/th>\u003ctd>לרוב אין שיפור בביצועים\u003c/td>\u003ctd>תיסוף לפי הניסיון של המתאמנת\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">עד שעתיים, מאמץ לא מחזורי (כדורגל)\u003c/th>\u003ctd>שינויי עצימות רבים, ריכוז ותגובה: התיסוף כן עוזר\u003c/td>\u003ctd>תיסוף מועיל\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">שעתיים וחצי עד שלוש שעות ויותר\u003c/th>\u003ctd>בלי תיסוף, ירידה חדה בסוכר אחרי שעתיים־שלוש\u003c/td>\u003ctd>לתסף מהשעה הראשונה, עדיף חד־סוכרים וגלוקוז עם פרוקטוז\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":85}'>\u003cbdi>85\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":86}'>\u003cbdi>86\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":87}'>\u003cbdi>87\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-steps deck\" id=\"N08-A06\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">שלב אחר שלב\u003c/span>\u003cb>למה הסוכר צונח אחרי שעתיים־שלוש בלי תיסוף\u003c/b>\u003c/div>\u003col class=\"steps\">\u003cli>\u003cspan>בתחילת מאמץ ממושך השריר משתמש בגליקוגן שלו. גליקוגן השריר משמש את השריר בלבד (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":12}'>שקופית \u003cbdi>12\u003c/bdi>\u003c/button>).\u003c/span>\u003c/li>\u003cli>\u003cspan>גליקוגן הכבד מתפרק לגלוקוז שיוצא לדם ומשם לרקמות. כך נשמרת רמת הסוכר בדם (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":12}'>שקופית \u003cbdi>12\u003c/bdi>\u003c/button>).\u003c/span>\u003c/li>\u003cli>\u003cspan>במאמץ מתמשך הגליקוגן מספיק לכשעתיים (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":12}'>שקופית \u003cbdi>12\u003c/bdi>\u003c/button>). זה אומדן לימודי, והקצב תלוי בעצימות ובאדם.\u003c/span>\u003c/li>\u003cli>\u003cspan>בלי תיסוף, כשהמאגרים מתרוקנים, אחרי שעתיים־שלוש יש ירידה חדה בסוכר (היפוגליקמיה) ואי אפשר להמשיך באותה עצימות. בניסוי, אחרי 120 דקות הקבוצה שלא תיספה כמעט לא הצליחה להמשיך לרכב (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":85}'>שקופית \u003cbdi>85\u003c/bdi>\u003c/button>).\u003c/span>\u003c/li>\u003cli>\u003cspan>פחמימות שנאכלות במהלך המאמץ מוסיפות גלוקוז לדם, שומרות על רמת סוכר יציבה יחסית וחוסכות בגליקוגן (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":88}'>שקופית \u003cbdi>88\u003c/bdi>\u003c/button>).\u003c/span>\u003c/li>\u003cli>\u003cspan>שימי לב: הגרף מראה מגמה בניסוי מסוים. הוא אינו קובע שכל אדם יגיע להיפוגליקמיה בדקה מס
