ר על פרמטר כמותי- בודקים את כמות חומצות האמינו השונות בחלבון ומשווים לרפרנס. הבדיקה מתייחסת לח\"א חיוניות בלבד."},{"n":22,"title":"שומנים","text":"שומנים"},{"n":23,"title":"תעודת זהות","text":"תעודת זהות מולקולה אורגנית .ישנם סוגים רבים של שומנים , אשר בחלקם הגדול מורכבים משרשראות או טבעות של אטומי פחמן ומימן , ומכילים יסודות נוספים כמו חמצן וחנקן. אחד מאבות המזון העיקריים , מהווה לרוב בין20% 35% מסך הקלוריות היומי בתפריט מאוזן. עובר פירוק במערכת העיכול לצורות שונות– בעיקר טריגליצרידים וחומצות שומן חופשיות , נארז במבנים הנקראים כילומיקרונים ונספג דרך מערכת הלימפה. אגירה– נאגר בצורה של ט"},{"n":24,"title":"תפקידים נוספים","text":"תפקידים נוספים בראש ובראשונה– מקור אנרגיה( קק\"ל לגרם שומן בתזונה , קק\" לגרם שומן אגור.) הגנה על רקמות ואיברים פנימיים. בידוד– מניעת אובדן חום. חומר מוצא לתרכובות שונות כמו הורמונים ,מלחי מרה ועוד. ממיסים של ויטמינים מסיסי שומן( A,D,E,K מתווכים את כניסתם במעי ונשיאתם בדם."},{"n":25,"title":"ח.ש .","text":"ח.ש . רוויותVS ח.ש . לא רוויות רוויות– ללא קשרים כפולים. בלתי רוויות– מכילות קשרים כפולים. אומגה( אוN )מציין את מיקום הקשר הכפול הראשון. חומצות השומן הבלתי רוויות נחלקות לשתי קבוצות: חד- בלתי רוויות– mono רב- בלתי רוויות- poly"},{"n":26,"title":"חומצות שומן רב","text":"חומצות שומן רב בלתי רווי נוזלי בטמפ 'החדר אומגה3 שמן פשתן דגי מים קרים אגוזי מלך אומגה6 סויה חמניות חריע חומצות שומן אלו הן חיוניות! אינן מיוצרות בגוף , יש לצרוך מהמזון."},{"n":27,"title":"שומן והשמנה","text":"שומן והשמנה הצטברות שומן ברקמות השונות( הנובעת בשל עומס קלורי ולאו דווקא בשל צריכת שומן ) מביאה למצב שמוגדר\"השמנה.\" הצטברות שומן מתחת לעור מכונה\"שומן תת עורי\" ונוטה להתרחש בעיקר באיזור הישבן והזרועות ,ואינו מקושר לעליה בסיכון למחלות שונות. הצטברות שומן סביב האיברים הפנימיים בחלל הבטן מכונה\"שומן וסצרלי \" או\"שומן בטני\" ,והצטברותו קשורה לעליה בסיכון למחלות לב וכלי דם."},{"n":28,"title":"כולסטרול","text":"כולסטרול"},{"n":29,"title":"כולסטרול","text":"כולסטרול סוג שומן השייך לקבוצת הסטרואידים. מקור הכולסטרול מן החי בלבד( לכן לא ימצא במוצרים מן הצומח.) מקור עיקר הכולסטרול בגוף הוא מייצור עצמי. הכבד(בעיקר ) ומערכת העיכול מייצרים כ- 97% מהכולסטרול האנדוגני. נישא בדם על גבי ליפופרוטאינים."},{"n":30,"title":"ליפופרוטאינים","text":"ליפופרוטאינים"},{"n":31,"title":"ליפופרוטאינים","text":"ליפופרוטאינים נשאי שומן המורכבים משומנים הקשורים לחלבון , ומתייחסים אליהם כחלבונים הנושאים שומן בגוף– הם בעצם כדורים שבנויים ממברנה כפולה ומשמשים כ\"כלי תחבורה \"לשומנים בתוך זרם הדם. שני סוגים עיקריים של ליפופרוטאינים: HDL נושאים שומנים(כולסטרול בעיקר ) מן התאים לכבד( מכונה גם \"כולסטרול טוב\" מכיוון שהוא מפנה בצורה יעילה כולסטרול מתוך זרם הדם.) ישנו יחס הפוך בין רמותHDL לסיכון למחלות לב. ניתן להעלות"},{"n":32,"title":"משק הנוזלים","text":"משק הנוזלים"},{"n":33,"title":"נתרן","text":"נתרן האלקטרוליט הנפוץ ביותר בגוף. תפקיד מרכזי ב: וויסות מאזן המלחים והנוזלים הולכה עצבית תפקוד תקין של השרירים. מופרש בשתן ובזיעה(האלקטרוליט העיקרי המצוי בזיעה.)"},{"n":34,"title":"נתרן","text":"נתרן צריכה גבוהה עלולה לגרום ליתר לחץ דם בחלק מהאוכלוסיה. נוכחות בכמות גבוהה במזונות מעובדים. ישנו מאמץ מוסדי להורדת רמות הנתרן במזונות מעובדים."},{"n":35,"title":"היפונתרמיה (עודף מיום )","text":"היפונתרמיה (עודף מיום ) ירידה בריכוז הנתרן בדם( מתחת ל130 מילימול/ליטר דם) כתוצאה מאובדן מלחים רב בזיעה ו/או משתיית מים מרובה מידי 'הרעלת מים' במאמצים שנמשכים פחות מ- שעות בד\"כ עקב שתיה מרובה במאמצים של יותר מ- שעות ללא תלות בכמות השתייה."},{"n":36,"title":"תסמינים","text":"תסמינים מצבים קלים מצבים מתקדמים הקאות כאבי ראש כיווצי שרירים נפיחות בכפות הידיים והרגליים סחרחורות אי שקט ועצבנות תשישות בלבול , חולשה ואובדן התמצאות פירכוסים אובדן הכרה ומוות"},{"n":37,"title":"מתי גובר איבוד הנוזלים","text":"מתי גובר איבוד הנוזלים הזעה– למשל בתנאים של אימון , חום , לחות וכו'. נשימה– במאמץ , בגבהים. בשתן– שתייה מרובה. שלשול– סיכון לאיבוד של עד5 ליטר ליום."},{"n":38,"title":"משק הנוזלים במאמץ","text":"משק הנוזלים במאמץ איבוד נוזלים גובר בעת מאמץ גופני דרך הזיעה (המנגנון העיקרי לוויסות טמפ ' הגוף ומניעת התחממות יתר) אובדן לחות מדרכי הנשימה המשפיע העיקרי על כמות הנוזלים המופרשת בזיעה- עומס החום מושפע ממשך המאמץ ועצימותו אקלים הסביבה סוג הלבוש והציוד"},{"n":39,"title":"שיעור אובדן","text":"שיעור אובדן נוזלים ביחס למשקל הגוף השפעה עד2%אין פגיעה בביצועים ובתפקוד 2-4% ויותר פגיעה בביצוע האירובי ובתפקוד הקוגניטיבי 4-6% ויותר פגיעה ביכולת האנאירובית ובכח השרירים מעל6% ירידה בקצב ההזעה הפחתה בזרימת הדם לעור עלייה בטמפ 'הגוף פגיעה משמעותית ביכולת הביצוע עליה בסיכון לנזקי חום התייבשות"},{"n":40,"title":"הערכת מאזן הנוזלים ורמת ההתייבשות","text":"הערכת מאזן הנוזלים ורמת ההתייבשות השוואה לנקודת ייחוס שקילת בוקר עקבית משקל בוקר נמוך משמעותית מנקודת הייחוס התייבשות שקילה לפני ואחרי אימון מדד לאובדן נוזלים במהלך הפעילות מאפשרת חישוב כמות הנוזלים שיש לצרוך לשמירה על מאזן הנוזלים נכון למאמץ ותנאי סביבה ספציפיים"},{"n":41,"title":"שתיית נוזלים בפעילות","text":"שתיית נוזלים בפעילות בד\"כ לא שותים מספיק במהלך פעילות גופנית תחושת צמא רק לאחר איבוד נוזלים של כ- 2% ממשקל הגוף מתאמן צמא הוא מתאמן מיובש!! לכן צמא אינו מדד מדוייק לאיבוד נוזלים. כדי למנוע התייבשות בזמן מאמץ– אין להמתין לתחושת צמא כמות השתיה הנדרשת שונה בין אדם לאדם ותלויה גם בעצימות המאמץ , משכו ,תנאי הסביבה והכושר הגופני."},{"n":42,"title":"כללי אצבע לצריכת נוזלים","text":"כללי אצבע לצריכת נוזלים לפני פעילות גופנית– מומלץ לשתות בכמות שתוביל לשתן בהיר . כלל אצבע כוס מים בכל30 דקות בשעתיים שלפני הפעילות. במהלך הפעילות– 0.5-1 כוס מים בכל20 דקות. לאחר פעילות– 1.5 ל ' לכל1 ק\" ג אובדן משקל( במידה ויש צורך בהתאוששות מהירה) ,או שתייה רגילה עד להגעה לצבע שתן בהיר. ניתן לבצע התאמה של כללי האצבע בהתאם לצבע השתן לפני הפעילות ולשינויים במשקל במהלך הפעילות. בפעילות הנמשכת מעל לשע"},{"n":43,"title":"מה לשתות","text":"מה לשתות עדיפות למים קרירים(נספגים מהקיבה ומהמעי הדק מהר יותר ) – טמפ ' נוחה. במהלך מאמצים של מעל שעה מומלץ משקה ספורט המכיל4-8% פחמימות וכמות קטנה של מלח"},{"n":44,"title":"תוספי תזונה","text":"תוספי תזונה"},{"n":45,"title":"על פי דרגת הוכחה","text":"על פי דרגת הוכחה תוספים שיעילותם הוכחה. תוספים שיעילותם עדיין נבדקת. תוספים שאין כלל הוכחה ליעילותם. תוספים אסורים לשימוש על פי חוקי הארגון העולמי למניעת סימום בספורט( WADA .) תוספים הנחוצים לשם השלמת חסרים תזונתיים. דרגת הוכחה דוגמאות תוספים שיעילותם הוכחה קריאטין ,קפאין , סותרי חומצה– בטא אלאנין וסודיום ביקרבונאט תוספים שיעילותם עדיין נבדקת גלוטמין , HMB תוספים שאין כלל הוכחה ליעילותם חומצות אמי"},{"n":46,"title":"על פי דרגת הוכחה","text":"על פי דרגת הוכחה סותרי חומצה– בטא אלאנין וסודיום ביקרבונאט. יעילותם ובטיחות השימוש בהם הוכחו במחקרים מדעיים איכותיים."},{"n":47,"title":"קפאין","text":"קפאין"},{"n":48,"title":"קפאין וסבולת לב ריאה","text":"קפאין וסבולת לב ריאה .1הארכת משך זמן המאמץ ודחיית תחושת העייפות. .2שמירה על מהירות/עצימות עד הגעה לתשישות. הפרשה של בטא אנדורפינים–הפחתה של תחושת הכאב. הפרשה של קטכולאמינים –יותר אדרנלין בהשפעת קפאין. הגברת ליפוליזה בתאי שומן– מגביר ניוד של חומצות שומן אל מחוץ לתאי השומן."},{"n":49,"title":"המלצות","text":"המלצות תוסף הראה תוצאות טובות יותר משתיית קפה. מינון ארגוגני– 3-6 מ\"ג/ק\"ג גוף שונות גנטית בתגובה ובהשפעה: יש אנשים שלא מושפעים כלל מנטילת קפאין. יש אנשים שרגישים לקפאין ויסבלו מתופעות לוואי כבר במינון נמוך יותר. תופעות לוואי בצריכה עודפת– מעל600 מ\"ג ביום."},{"n":50,"title":"עיתוי","text":"עיתוי זמן מחצית חיים– 3-6 שעות. פעילות שיא– כעבור שעה. לפני מאמץ קצר/ שיפור קוגניטיבי– כ שעה לפני המאמץ. לפני מאמץ אירובי– כ שעה וחצי לפני המאמץ. בשימוש בטווח ארוך רואים הסתגלות. אצל צרכני קפאין על בסיס קבוע ,האפקט התפוגג מהר."},{"n":51,"title":"קריאטין","text":"קריאטין"},{"n":52,"title":"קריאטין","text":"קריאטין משתתף במסלול.ATP-CP הוכח כבעל פוטנציאל להעלאת מסת השריר. מסייע בהפקת אנרגיה בפעולות קצרות ועצימות. מתאים למאמצים קצרים ועצימים , כמו אימוני כח עצימים , ריצת100 מטר וכד'."},{"n":53,"title":"איך הגדלת מאגרי","text":"איך הגדלת מאגרי הקריאטין בשריר תשפיע על הביצוע במאמץ בראש ובראשונה , הארכת השימוש במעגל האנרגיה הפוספוגני , וכתוצאה מכך: דחיית השימוש במסלול האנאירובי לקטי דחייה ביצירת ח.חלב דחיית עייפות. שיפור במאמצים קצרים ועצימים מגביר כח ותורם לעלייה במסת השריר. התאוששות מהירה יותר בין מאמצים. ספיחת מים אל השריר שמובילה לגירוי סינטזת חלבוני שריר. הגדלת מאגרי הקריאטין היא תהליך של מספר שבועות , לכן אין חשיבו"},{"n":54,"title":"סותרי חומצה","text":"סותרי חומצה"},{"n":55,"title":"היגיון תיאורטי","text":"היגיון תיאורטי הפקת אנרגיה במסלול הגליקוליזה יצירת חומצת חלב. הצטברות חומצת חלב עלייה בחומציות בשריר ובדם ירידה ביכולת השריר להפיק כוח ירידה בקצב הפעילות והתעייפות. סותרי החומצה :קשירת יוני המימן החופשיים והפחתת רמת החומציות בשריר מאפשר המשך תפקוד."},{"n":56,"title":"קרנוזין","text":"קרנוזין נמצא בריכוז גבוה ברקמות שרירי השלד ובתאי המוח. ממלא תפקיד בשמירה על מאזן חומצה–בסיס. יכול למנוע עייפות שרירים. נוצר ע\"י צימוד בין ח\" היסטדין וביתא אלנין. ריכוז ביתא אלנין בדם נמוך יחסית להיסטדין ולכן מהווה גורם מגביל ביצירת קרנוזין."},{"n":57,"title":"ביתא","text":"ביתא אלאנין נגזרת של חומצה אמינית לא חיונית המצויה בגופנו באופן טבעי. ניתן למצוא אותה גם במזונות כמו בשר בקר, עוף והודו. מעלה את רמת הקרנוזין בשריר."},{"n":58,"title":"אבקות","text":"אבקות חלבון."},{"n":59,"title":"חלבון מתזונהVS","text":"חלבון מתזונהVS חלבון מתוסף הקפדה על צריכת חלבון נאותה הוכחה כמשפרת כח ומסת שריר אין הוכחה שצריכת חלבון מתוסף מביאה לתוצאות טובות יותר מתי מוצדק להשתמש בתוסף בהעדר מזון זמין כשיש קושי להגיע לכמות החלבון הנדרשת מהמזון"},{"n":60,"title":"מיקרונוטריאנטים","text":"מיקרונוטריאנטים"},{"n":61,"title":"מה הם","text":"מה הם מיקרונוטריאנטים ויטמינים ומינרלים. אינם מיוצרים בגוף וחיוני לקבלם מהתזונה.* נדרשים בכמויות קטנות(מיקרו ) – מ\"ג/מק\"ג. מספקים חומרים חיוניים אך אינם מכילים קלוריות."},{"n":62,"title":"ספיגה ואגירה","text":"ספיגה ואגירה מגוון מנגנוני ספיגה ואגירה. סיבים תזונתיים מעכבים ספיגה של ויטמינים ומינרלים. ויטמינים מסיסי שומן– A,D,E,K מזון שומני מסייע בספיגתם , נאגרים בגוף ,ועל כן צריכה עודפת עלולה להזיק."},{"n":63,"title":"אינם תוסף","text":"אינם תוסף ארגוגני שימוש בתוספי ויטמינים ומינרלים אינו משפר ביצועים אצל אנשים שצורכים דיאטה מאוזנת ומתאימה לצוריכהם האנרגטיים. אין המלצה גורפת לתיסוף של מיקרונוטריאנטים , לא לאוכלוסיה כללית ולא לספורטאים. ספורטאים(וגם אלו שאינם ) הסובלים מחוסרים ייהנו מתיסוף כזה. כל המלצה לתיסוף תיעשה לאחר בדיקה וייעוץ ע\" אנשי מקצוע מוסמכים(תזונאי קליני/רופא.)"},{"n":64,"title":"חסר בברזל– השפעות קליניות","text":"חסר בברזל– השפעות קליניות עייפות חולשה כאבי ראש חוסר תאבון עצבנות פגיעה במערכת החיסון וויסות החום."},{"n":65,"title":"חסר בברזל המוביל לאנמיה–","text":"חסר בברזל המוביל לאנמיה– השפעות מנטליות ופיזיולוגיות השפעות מנטליות ירידה בריכוז. ירידה בזיכרון. ירידה בערנות. ירידה במוטיבציה. השפעות פזיולוגית פגיעה משמעותית בצח\"מ. ירידה בסף האנארובי. ירידה ביכולת העבודה לטווח ארוך. הפגיעה המשמעותית ביותר היא במאמצים אירוביים– כאלה הדורשים שימוש בחמצן(מאמצים ארוכים , למשל ריצה למשך30דקות)."},{"n":66,"title":"סידן(","text":"סידן( calcium המינרל הנפוץ בגוף- מהווה יותר מ- 98% של החומר הקשה בעצמות ובשיניים. כמותו בגוף- כ– 1,000 גרם. רוב הסידן מתרכז בעצמות. ישנה חשיבות גדולה מאוד לשמירה על רמת סידן קבועה בדם."},{"n":67,"title":"בקרה הורמונלית","text":"בקרה הורמונלית רמת הסידן בדם נמצאת תחת בקרה הורמונלית הדוקה דרך מספר מנגנונים שונים ,ביניהם: ויטמיןD - משפר את ספיגת הסידן."},{"n":68,"title":"תפקידים","text":"תפקידים מעבר לתפקיד מבני בעצם , לסידן תפקידים חשובים רבים נוספים: תפקיד מרכזי במנגנון כיווץ השריר. משתתף בבניית השן. תפקיד במנגנון קרישה ועוד."},{"n":69,"title":"ויטמיניB","text":"ויטמיניB מעורבים בייצור אנרגיה בזמן הפעילות הגופנית. ישנם מחקרים שמראים שפעילות גופנית מעלה את הדרישה של ויטמיניB. כאשר צריכת האנרגיה גבוהה ,בד\" כ הצרכים נענים דרך התזונה. אין המלצה גורפת לתיסוף , כל המלצה כזאת תינתן לאחר בדיקה וייעוץ ע\"י גורמים מוסמכים."},{"n":70,"title":"12","text":"12 - מקורות המקור היחידי לויטמין זה הוא מהחי"},{"n":71,"title":"12","text":"12 וחומצה פולית בעלי תפקיד חשוב ב: ייצור תאי דם אדומים יצירת מתיונין (וקריאטין) תחזוקה של מערכת העצבים המרכזית. סימני מחסור: אנמיה עייפות ותשישות בלבול ,פגיעה בזיכרון ,בעיות בשיווי משקל ,דיכאון."},{"n":72,"title":"סטרס חימצוני","text":"סטרס חימצוני סטרס חימצוני מציין עליה בריכוז רדיקלים חופשיים אשר פוגעים בתאים ועלולים להביא להרס שלהם. רדיקלים חופשיים נוצרים בתהליכי חימצון אשר מתרחשים באופן תמידי בגוף(למשל בתהליך הפקת אנרגיה) , וקצב ייצורים עולה משמעותית במהלך פעילות גופנית. ככל שעצימות הפעילות גבוהה יותר– קצב יייצור הרדיקלים החופשיים עולה."},{"n":73,"title":"סטרס חימצוני ונוגדי חימצון","text":"סטרס חימצוני ונוגדי חימצון תפקידם של נוגדי החימצון הוא להגן על התאים מפני הנזק שנגרם ע\"י הרדיקלים החופשיים."},{"n":74,"title":"עיתוי אכילה","text":"עיתוי אכילה ושתיה"},{"n":75,"title":"השפע","text":"השפע ו ת מיידיות של רכיבי התזונה על מערכות הגוף"},{"n":76,"title":"פחמימות","text":"פחמימות פשוטות/מורכבות: מעלות את רמות הסוכר בדם מלאות/סיבים תזונתיים: מאטות את ריקון הקיבה ,את תהליך העיכול ואת מעבר הסוכר לזרם הדם"},{"n":77,"title":"שומנים","text":"שומנים מאטים את קצב ריקון הקיבה. מתעכלים באיטיות יחסית ועלולים לגרום לאי נוחות במערכת העיכול במהלך פעילות גופנית."},{"n":78,"title":"חלבונים","text":"חלבונים אין השפעה מיידית"},{"n":79,"title":"ארוחה לפני אימון אירובי","text":"ארוחה לפני אימון אירובי עיתוי– 3-4 שעות לפני האימון מטרות: שמירה על רמה תקינה של גלוקוז בדם איחסון מירבי של גלוקוז בגליקוגן בשרירים ובכבד דחיית עייפות שמירה על נוחות במערכת העיכול אספקת נוזלים למניעת התייבשות"},{"n":80,"title":"מאפיינים","text":"מאפיינים מכילה בעיקר פחמימות מורכבות לשמירה על רמות גלוקוז גבוהות בדם וריכוז גליקוגן. מעט שומן. מעט סיבים. חלבונים- בינוני. לא לבצע ניסיונות של מאכלים חדשים לפני תחרויות."},{"n":81,"title":"דוגמא לארוחה","text":"דוגמא לארוחה ארוחת בוקר : חביתה + סלט + גבינה +לחמנייה. ארוחת צהריים : פסטה + חזה עוף בתנור +ירקות מבושלים."},{"n":82,"title":"ארוחה בסמוך לאימון אירובי","text":"ארוחה בסמוך לאימון אירובי עיתוי– 15-60 דקות לפני האימון. מטרה– תגבור בפחמימות זמינות לפני האימון. מאפיינים: ארוחת ביניים כתגבור לארוחה גדולה ארוחה יחידה לפני מאמץ שמבוצע בשעת בוקר מוקדמת. הארוחה כוללת פחמימות ומים."},{"n":83,"title":"ארוחה בסמוך לאימון אירובי","text":"ארוחה בסמוך לאימון אירובי לא מומלץ לצרוך: מזון עשיר בחלבון ,בשומן ובסיבים תזונתיים דוגמא לארוחה :נוסף למים , חטיף דגנים דל בשומן ובסיבים תזונתיים/ פרוסת לחם + ריבה/ 2-4 תמרים."},{"n":84,"title":"שימו לב!","text":"שימו לב! במידה ואוכלים ארוחה אחת לפני אימון עצים , בטווח של פחות מ3-4 שעות ויותר משעה לפני האימון , המאפיינים שלה יהיו בין המאפיינים של הארוחה המקדימה והמאפיינים של הארוחה בסמוך. כלומר: מבחינת מרכיבי מזון– בעיקר פחמימות , מעט סיבים ושומן ומעט חלבון(דומה לארוחה מקדימה) ומבחינת כמות– דומה יותר לארוחה בסמוך לאימון(למשל כריך כן ,צלחת פסטה לא... כמובן שככל שמתקרבים לזמן האימון ,הכמות תהיה קטנה יותר ,על"},{"n":85,"title":"ריכוז גלוקוז במהלך הפעילות והצורך לתסף","text":"ריכוז גלוקוז במהלך הפעילות והצורך לתסף פחמימות עד שעה , ריכוז הסוכר דומה בין מתאמנים שאוכלים בזמן אימון לבין מתאמנים שלא אוכלים. לאחר שעה– הבדל קטן בין הקבוצות. לאחר שעתיים- שלוש– ללא תיסוף ישנה ירידה דרסטית (היפוגליקמיה )ולא ניתן להמשיך באותה עצימות או בכלל . לעומת זאת מי שאוכל שומר על רמות סוכר קבועות יחסית גם לאחר שעתיים. קבוצה שלא תיספה , לאחר120 דקות- כמעט ולא הצליחו להמשיך לרכב."},{"n":86,"title":"מתי ואיך נתסף בזמן פעילות","text":"מתי ואיך נתסף בזמן פעילות עד שעת אימון לא ראו הבדל ביכולת הגופנית עם צריכת הפחמימות . התיסוף הפחמימתי לא רלוונטי באורך אימון כזה בכל עצימות שהיא בהנחה שהיו ארוחות מסודרות שכן כללו כמות פחמימות וקלוריות בכמות מתאימה. שעה עד שעתיים תיסוף פחמימתי לרוב לא משפר ביצועים. במאמצים לא מחזוריים(כדורגל למשל )הכוללים שינויי עצימות רבים , ופעולות שדורשות ריכוז ותגובה ,נמצא שתיסוף בפעילויות של עד שעתיים כן עוזר"},{"n":87,"title":"מתי ואיך נתסף בזמן פעילות","text":"מתי ואיך נתסף בזמן פעילות שעתיים וחצי– שלוש שעות ויותר: יש לתסף בפחמימות החל מהשעה הראשונה. עדיף חד סוכרים ,ועדיף שילוב של גלוקוז ופרוקטוז."},{"n":88,"title":"אכילה בזמן אימון- סיכום","text":"אכילה בזמן אימון- סיכום מטרה– אספקת אנרגיה לשרירים , שמירה על רמת גלוקוז וחיסכון בגליקוגן השריר/כבד ,דחיית עייפות , הפחתת נזק לשרירים והתאוששות מהירה לאחר המאמץ. מאפיינים– ארוחה פחמימתית ,תוך צמצום כמויות של חלבונים , שומנים וסיבים תזונתיים. דוגמא למרכיבי המזון– משקה ספורט ,ג'ל אנרגיה ,סוכריות אנרגיה , חטיף דגנים דל בשומן וסיבים תזונתיים ותמרים. במאמצים שנמשכים מעל לשעתיים."},{"n":89,"title":"ארוחה בסיום אימון אירובי","text":"ארוחה בסיום אימון אירובי עיתוי– סמוך לסיום האימון ולא יאוחר מ90 דקות מסיומו ישנה חשיבות להקפדה על אכילה מיד בסיום האימון כאשר תדירות האימונים גבוהה והפער בין אימון לאימון קצר מ8 שעות , אחרת אין חשיבות גדולה להקפדה על אכילה מיד בתום האימון. מטרות: חידוש מאגרי הגליקוגן בשרירים ובכבד. תיקון נזקים בשרירים וברקמות."},{"n":90,"title":"מאפיינים","text":"מאפיינים ארוחה מגוונת ,כוללת את כל קבוצות המזון :פחמימות ,חלבונים , שומן מהצומח וירקות. זמן עד האימון הבא גרם/ק\"ג/שעה פחות מ- 8 שעות1-1.2 ב- 4 השעות הראשונות יותר מ- 8 שעות רגיל"}],"sourceNotes":[{"n":1,"title":"היפונתרמיה","slides":[35],"text":"המצגת כותבת ״מתחת ל־130 mmol/L״. הגדרה קלינית נפוצה להיפונתרמיה במאמץ היא **מתחת ל־135 mmol/L**, כאשר חומרת התסמינים וההקשר חשובים. **הנחיה:** במבחן על ניסוח המצגת, ציין את נוסח המקור ובמקביל הצג הסתייגות. מקור חיצוני: NCBI Bookshelf.","links":[{"text":"NCBI Bookshelf","url":"https://www.ncbi.nlm.nih.gov/books/NBK572128/"}]},{"n":2,"title":"מתי לשתות","slides":[41,42,43],"text":"ניתנים כללי אצבע ובחלקם נוסח ״אל תחכו לצמא״. אל תהפוך זאת להמלצה רפואית גורפת לשתייה עודפת. עודף שתייה במאמץ עשוי להוביל להיפונתרמיה. מקור חיצוני: Exercise-Associated Hyponatremia.","links":[{"text":"Exercise-Associated Hyponatremia","url":"https://www.ncbi.nlm.nih.gov/books/NBK572128/"}]},{"n":3,"title":"B12","slides":[70],"text":"נכתב שהמקור היחידי הוא מן החי. זה נכון ביחס למקורות *טבעיים* של B12 במזון שגרתי, אך קיימים מזונות מהצומח **מועשרים ב־B12** ותוספים. מקור חיצוני: NIH Office of Dietary Supplements.","links":[{"text":"NIH Office of Dietary Supplements","url":"https://ods.od.nih.gov/factsheets/VitaminB12-Consumer/"}]},{"n":4,"title":"חומצת חלב ועייפות","slides":[55],"text":"מוצג קשר סיבתי פשוט בין לקטט, חומציות ועייפות. פיזיולוגיית עייפות שריר מורכבת יותר, ואין לייחס ללקטט כשלעצמו את כל העייפות. **הנחיה:** בשיעור הצג זאת כמודל לימודי מפושט ושאל על רעיון הבופרינג, לא על לקטט כ״רעלן״.","links":[]},{"n":5,"title":"גליקוגן מספיק לשעתיים","slides":[12],"text":"זה אומדן פדגוגי, לא כלל מדויק. המאמץ, עצימותו ונתוני האדם משנים את הקצב.","links":[]},{"n":6,"title":"אומגה־3 ואומגה־6","slides":[26],"text":"המילה ״חיוניות״ נוגעת לחומצות שומן חיוניות מסוימות ממשפחות אלה, לא לכל מולקולה בקבוצה. הבחנה בין משפחה לבין חומצה חיונית ספציפית חשובה לדיוק.","links":[]},{"n":7,"title":"רקמת שומן תת־עורי","slides":[27],"text":"הכתוב על היעדר קשר לסיכון הוא פישוט. הסיכון בריאותי תלוי בהקשר ובהתפלגות שומן; אל תקבע ״תמיד חסר סיכון״.","links":[]},{"n":8,"title":"העמסת פחמימות וטבלת הכמויות","slides":[13,14,15],"text":"המצגת מציינת שאין צורך לזכור מספרים בטבלת שקופית 13. יש לשאול על העיקרון; מספרי החישובים בחבילה משמשים להמחשת יחידות. מקור השוואתי: ISSN Position Stand on Nutrient Timing.","links":[{"text":"ISSN Position Stand on Nutrient Timing","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC5596471/"}]},{"n":9,"title":"עיתוי ההתאוששות","slides":[89],"text":"הנחיה לאכול בתוך 90 דקות מופיעה כקו מנחה לימודי, אך עיקרון ההקשר חשוב יותר: כשיש אימונים קרובים במיוחד, חשיבות תזמון ההתאוששות גדלה; אחרת העמידה בתזונה כוללת משמעותית מאוד. מקור השוואתי: ISSN Nutrient Timing.","links":[{"text":"ISSN Nutrient Timing","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC5596471/"}]},{"n":10,"title":"רשימות תוספים וסימום","slides":[45],"text":"לא להציג רשימת המצגת כאישור עדכני של WADA. ראו את רשימת WADA 2026. אין ייעוץ על התחמקות מבדיקות או נטילת חומרים אסורים.","links":[{"text":"רשימת WADA 2026","url":"https://www.wada-ama.org/sites/default/files/2025-09/2026list_en_final_clean_september_2025.pdf"}]},{"n":11,"title":"פחמימות במאמץ","slides":[85,86,87],"text":"גרף/דוגמה מתוך מצגת אינם מוכיחים שכל אדם יחווה היפוגליקמיה לאחר מספר שעות קבוע. מדברים על מגמה ועל מצב מסוים.","links":[]},{"n":12,"title":"שומן ו-HDL/LDL","slides":[31],"text":"דימוי ״טוב״ ו״רע״ הוא פשטני. חשוב ללמד מהו ליפופרוטאין ומה הקשר שלו להובלת כולסטרול ולא רק לשנן את הכינוי.","links":[]}],"importReport":{"counts":{"mcq":96,"flashcards":173,"trueFalse":32,"cases":16,"matchingGames":8,"sequenceChallenges":10,"calculationExercises":12,"glossaryEntries":77,"originalDiagrams":8,"courseSlideImages":16},"visual":{"siteDiagrams":7,"hotspots":68,"labelExercises":28,"orders":4,"lessonAdditions":81,"additionsBeyond":26},"ids":{"checked":424,"changed":[]},"manifest":{"mcq":96,"flashcards":173,"trueFalse":32,"cases":16,"matchingGames":8,"sequenceChallenges":10,"calculationExercises":12,"glossaryEntries":77,"originalDiagrams":8,"courseSlideImages":16},"keyDistribution":[26,23,25,22],"tfBalance":[16,16],"mcqDifficulty":{"basic":32,"understanding":32,"application":32},"needsInstructorReview":0,"corrections":{"changes":263,"items":181,"audit1":21,"audit2":100,"completeness":48,"mirrored":45},"enrichmentLabels":71,"crossTopic":{"N01-MCQ-002":[61],"N01-CARD-002":[61],"TF-001":[9,61],"TF-029":[16],"N08-MCQ-012":[43],"N08-CARD-012":[43]},"explanationReview":[],"warnings":[],"builtAt":"2026-11-16"},"lessons":[{"topicId":"N01","title":"מבוא לתזונת האדם, קבוצות מזון וקריאת תוויות","unit":"יחידה 01","sections":[{"id":"s-N01-1","title":"1. מדוע הגוף זקוק למזון?","slides":[]},{"id":"s-N01-2","title":"2. פירמידת המזון וקשת המזון","slides":[4]},{"id":"s-N01-3","title":"3. קריאת תווית מזון","slides":[5]},{"id":"s-N01-4","title":"4. תוסף מזון לעומת תוסף תזונה","slides":[6,7]},{"id":"s-N01-5","title":"5. דוגמה מורכבת למבחן","slides":[]},{"id":"s-N01-6","title":"6. שאלות לבדיקה עצמית","slides":[]}],"html":"\u003cp class=\"lsrc\">\u003cspan class=\"tag\">מקור\u003c/span> מצגת תזונת האדם במנוחה ובמאמץ, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":2}'>שקופיות \u003cbdi>2–7\u003c/bdi>\u003c/button>. \u003cstrong>מטרת הפרק:\u003c/strong> להבין במה שונה רכיב תזונה מרכיב טכנולוגי המוסף למזון, מה תפקידן של קבוצות רכיבי המזון ומה אפשר ללמוד מתווית.\u003c/p>\n\u003csection class=\"lsec\" id=\"s-N01-1\">\u003ch2 class=\"part\">1. מדוע הגוף זקוק למזון?\u003c/h2>\n\u003cp>אוכל הוא גם \u003cem>דלק\u003c/em> וגם \u003cem>חומר בנייה\u003c/em>. הגוף מפרק חלק מרכיבי המזון ומנצל את האנרגיה המשתחררת מתהליכים אלה. רכיבים אחרים משמשים לבניית חלבונים, קרומי תאים, רקמות וחומרים מווסתים. לכן השאלה ״כמה קלוריות יש במזון?״ היא רק אחת מהשאלות החשובות. צריך לשאול גם אילו רכיבים הוא מספק, מה תפקידם והאם צריכתם תואמת את הצרכים.\u003c/p>\n\u003cdiv class=\"dg-slot\" data-id=\"01-macronutrients\">\u003c/div>\n\u003cp>המצגת מבחינה בין \u003cstrong>מאקרונוטריאנטים\u003c/strong> לבין \u003cstrong>מיקרונוטריאנטים\u003c/strong>. מאקרונוטריאנטים הם פחמימות, שומנים וחלבונים. הם נצרכים בכמויות יחסית גדולות ומספקים אנרגיה או חומרי בנייה. מיקרונוטריאנטים הם ויטמינים ומינרלים, הנדרשים בדרך כלל בכמויות קטנות יותר ומשתתפים בתהליכים ביוכימיים, לרבות ניצול האנרגיה, אך אינם בעצמם מקור קלורי משמעותי. ההבחנה היא בכמות ובתפקיד, לא בחשיבות: מחסור ברכיב מיקרו מסוים יכול לפגוע מאוד בתפקוד.\u003c/p>\n\u003ch3>דוגמה לחשיבה נכונה\u003c/h3>\n\u003cp>שתי ארוחות עשויות לספק אותה כמות אנרגיה, אך להיות שונות בהרכב החלבון, איכות השומן, הסיבים, הוויטמינים והמלחים. יש לכן להבחין בין \u003cstrong>ערך אנרגטי\u003c/strong> ובין \u003cstrong>ערך תזונתי\u003c/strong>. כמו כן, אדם שמבצע מאמץ ארוך אינו בהכרח זקוק לאותה ארוחה שמתאימה לאדם היושב רוב היום: דרישות האנרגיה, נוחות מערכת העיכול ועיתוי צריכת המזון משתנים לפי הפעילות.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-compare deck\" id=\"N01-A01\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">השוואה\u003c/span>\u003cb>מאקרו לעומת מיקרו: כמות, תפקיד וקלוריות\u003c/b>\u003c/div>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>מאפיין\u003c/th>\u003cth>מאקרונוטריאנטים\u003c/th>\u003cth>מיקרונוטריאנטים\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">מי הם?\u003c/th>\u003ctd>פחמימות, שומנים וחלבונים\u003c/td>\u003ctd>ויטמינים ומינרלים\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">תפקיד לפי המצגת\u003c/th>\u003ctd>מספקים לגוף חומרי בניין ואנרגיה\u003c/td>\u003ctd>מאפשרים את שחרור האנרגיה וניצולה\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">כמות נדרשת\u003c/th>\u003ctd>כמויות גדולות יחסית\u003c/td>\u003ctd>כמויות קטנות: מ״ג או מק״ג\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">קלוריות\u003c/th>\u003ctd>כן, הם מקור האנרגיה במזון\u003c/td>\u003ctd>אינם מכילים קלוריות\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":3}'>\u003cbdi>3\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":61}'>\u003cbdi>61\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-check deck\" id=\"N01-A02\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">בדיקת הבנה\u003c/span>\u003cb>בדיקת הבנה: ויטמינים ואנרגיה\u003c/b>\u003c/div>\u003cdiv class=\"lcheck\" data-id=\"N01-A02\">\u003cp class=\"lc-q\">\u003cb>ויטמינים קשורים למשק האנרגיה בגוף. למה בכל זאת לא נכון לומר שתוסף ויטמינים ״נותן אנרגיה״?\u003c/b>\u003c/p>\u003cdiv class=\"lc-opts\">\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N01-A02\",\"i\":1}'>\u003cspan class=\"k\">א\u003c/span>\u003cspan>כי ויטמינים נותנים אנרגיה רק אחרי שהם נאגרים בכבד בצורת גליקוגן\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N01-A02\",\"i\":3}'>\u003cspan class=\"k\">ב\u003c/span>\u003cspan>כי הם נדרשים בכמות קטנה, אבל כל מיליגרם שלהם מספק יותר קלוריות מגרם פחמימה\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N01-A02\",\"i\":2}'>\u003cspan class=\"k\">ג\u003c/span>\u003cspan>כי ויטמינים הם חומרי בניין בלבד ואין להם שום קשר לאנרגיה\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N01-A02\",\"i\":0}'>\u003cspan class=\"k\">ד\u003c/span>\u003cspan>כי ויטמינים אינם מכילים קלוריות; הם מאפשרים לגוף לשחרר ולנצל אנרגיה שמגיעה מהמאקרונוטריאנטים\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"lc-exp\" hidden>\u003cp>לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":61}'>שקופית \u003cbdi>61\u003c/bdi>\u003c/button> מיקרונוטריאנטים אינם מכילים קלוריות, ולפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":3}'>שקופית \u003cbdi>3\u003c/bdi>\u003c/button> תפקידם לאפשר את שחרור האנרגיה וניצולה, כך שהם משתתפים במשק האנרגיה בלי להיות הדלק עצמו. התשובה ״חומרי בניין בלבד״ מפתה, אבל היא מנתקת אותם לגמרי מהאנרגיה, בניגוד ל\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":3}'>שקופית \u003cbdi>3\u003c/bdi>\u003c/button>.\u003c/p>\u003c/div>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":3}'>\u003cbdi>3\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":61}'>\u003cbdi>61\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"\" data-title=\"1. מדוע הגוף זקוק למזון?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N01-2\">\u003ch2 class=\"part\">2. פירמידת המזון וקשת המזון\u003c/h2>\n\u003cp>המצגת (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":4}'>שקופית \u003cbdi>4\u003c/bdi>\u003c/button>) מציגה את הפירמידה ואת קשת המזון כאמצעי חזותי להעברת רעיון של תזונה מאוזנת ומגוונת. אלה \u003cstrong>כלי הדרכה\u003c/strong>, ולא נוסחה קשיחה שמתאימה באותה מידה לכל אדם. כל מדינה עשויה להשתמש בהדגשה או בייצוג גרפי אחרים בהתאם להמלצות שלה. חשוב לדעת להסביר מה מטרת הכלי: לעזור לבחור מזונות מקבוצות שונות ולראות את התפריט כמכלול.\u003c/p>\n\u003cp>כדאי לשאול: האם התפריט כולל מגוון? מה מקור הפחמימות? האם יש מזונות המספקים שומן וחלבון? האם יש ירקות ופירות? אם מתאמן מתקשה להגיע לאנרגיה מספקת, ייתכן שיהיה צורך לשנות כמויות או עיתוי בלי לוותר על העיקרון של תפריט מגוון.\u003c/p>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":4}' aria-label=\"הגדלת שקופית 4\">\u003cimg src=\"images/slide_04.webp\" alt=\"שקופית 4: השוואת צורות הדרכה לתזונה נבונה\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":4}'>שקופית \u003cbdi>4\u003c/bdi>\u003c/button>: השוואת צורות הדרכה לתזונה נבונה\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-misconception deck\" id=\"N01-A03\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">טעות נפוצה\u003c/span>\u003cb>הפירמידה היא לא תפריט אחיד לכולם\u003c/b>\u003c/div>\u003cp>\u003cstrong>התפיסה השגויה:\u003c/strong> ״הפירמידה היא תפריט מדויק, זהה לכל אדם ולכל מדינה.״\u003c/p>\u003cp>\u003cstrong>למה זה לא נכון:\u003c/strong> \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":4}'>שקופית \u003cbdi>4\u003c/bdi>\u003c/button> מתארת את הפירמידה ואת הקשת כצורה גרפית שנועדה להעביר מסר של תזונה נבונה ולסייע בבחירת תזונה מאוזנת ומגוונת מכל קבוצות המזון. היא גם מציינת ש״כל מדינה והפירמידה שלה״. כלומר זה כלי הדרכה, לא נוסחה.\u003c/p>\u003cp>\u003cstrong>הניסוח הנכון:\u003c/strong> הפירמידה והקשת מכוונות לגיוון ולאיזון בין קבוצות המזון. ההתאמה לאדם מסוים, למשל לשחיינית שמתאמנת פעמיים ביום, נעשית לפי הצרכים שלה, כמו שרואים בהמשך הקורס בהמלצות הפחמימות לפי עומס אימונים.\u003c/p>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":4}'>\u003cbdi>4\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":13}'>\u003cbdi>13\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"4\" data-title=\"2. פירמידת המזון וקשת המזון\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N01-3\">\u003ch2 class=\"part\">3. קריאת תווית מזון\u003c/h2>\n\u003cp>ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":5}'>שקופית \u003cbdi>5\u003c/bdi>\u003c/button> מצוינים הפרטים העיקריים בתווית מזון ארוז: שם המוצר, תכולה, רכיבים, טבלת הערכים התזונתיים, פרטי היצרן או ארץ הייצור, ותאריכי ייצור או תפוגה. כאשר מנתחים מוצר לצורכי לימוד, חשוב להבחין בין \u003cstrong>רשימת הרכיבים\u003c/strong> לבין \u003cstrong>טבלת הערכים\u003c/strong>: הראשונה מציגה ממה המוצר מורכב, והשנייה כמה מכל רכיב תזונתי נמצא בכמות מוגדרת של המוצר.\u003c/p>\n\u003caside class=\"gnote q\">\u003cspan class=\"tag\">תרגול לדוגמה\u003c/span>\u003cdiv>\u003cp>על מוצר כתוב שב־100 גרם יש 12 גרם פחמימות, 5 גרם חלבון ו־3 גרם שומן. אם אוכלים 200 גרם, הכמות של כל רכיב מוכפלת פי שניים: 24 גרם פחמימות, 10 גרם חלבון ו־6 גרם שומן. בהעשרה, אפשר להעריך אנרגיה באמצעות 4 קק״ל לגרם פחמימה, 4 לגרם חלבון ו־9 לגרם שומן: 24×4 + 10×4 + 6×9 = 190 קק״ל. החישוב הוא אומדן לימודי, וייתכנו הבדלים לעומת המסומן בפועל.\u003c/p>\u003c/div>\u003c/aside>\n\u003cp>שתי טעויות נפוצות: לחשב תכולה של חבילה שלמה לפי ערכים ל־100 גרם בלי להתאים את המשקל, ולהשוות בין מוצרים כשבאחד הנתונים מוצגים למנה ובשני ל־100 גרם.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-worked beyond\" id=\"N01-A04\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">דוגמת חישוב\u003c/span>\u003cb>מ־100 גרם למה שאוכלים בפועל: חטיף אנרגיה\u003c/b>\u003c/div>\u003cdiv class=\"worked\">\u003cp>נתון (דוגמה להמחשה): בתווית של חטיף אנרגיה כתוב ל־100 גרם: 60 גרם פחמימות ו־15 גרם שומן. החטיף שוקל 40 גרם.\u003cbr>שלב 1, יחס החטיף ל־100 גרם: 40 גרם ÷ 100 גרם = 0.4\u003cbr>שלב 2, פחמימות בחטיף: 60 גרם × 0.4 = 24 גרם פחמימות\u003cbr>שלב 3, שומן בחטיף: 15 גרם × 0.4 = 6 גרם שומן\u003cbr>שלב 4, אנרגיה מפחמימות (4 קק״ל לגרם, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":9}'>שקופית \u003cbdi>9\u003c/bdi>\u003c/button>): 24 גרם × 4 קק״ל/גרם = 96 קק״ל\u003cbr>שלב 5, אנרגיה משומן (9 קק״ל לגרם שומן בתזונה, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":24}'>שקופית \u003cbdi>24\u003c/bdi>\u003c/button>): 6 גרם × 9 קק״ל/גרם = 54 קק״ל\u003cbr>שלב 6, סכום: 96 קק״ל + 54 קק״ל = 150 קק״ל\u003cbr>\u003cstrong>תוצאה:\u003c/strong> בחטיף יש 24 גרם פחמימות, 6 גרם שומן וכ־150 קק״ל מפחמימות ומשומן (החלבון לא נכלל בדוגמה).\u003c/p>\u003cp>שימי לב: הטעות הנפוצה היא לחשוב שבחטיף יש 60 גרם פחמימות. 60 גרם הם ב־100 גרם מוצר, והחטיף שוקל רק 40 גרם.\u003c/p>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"beyond-chip\">הבהרה מדעית מעבר למצגת\u003c/span> השקופית מונה את רכיבי התווית בלבד; הצגת הערכים ל־100 גרם היא הנוהג המקובל בסימון תזונתי, והמספרים של החטיף הם דוגמה להמחשה. · \u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":5}'>\u003cbdi>5\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":9}'>\u003cbdi>9\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":24}'>\u003cbdi>24\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-worked beyond\" id=\"N01-A05\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">דוגמת חישוב\u003c/span>\u003cb>השוואה הוגנת: מנה מול 100 גרם\u003c/b>\u003c/div>\u003cdiv class=\"worked\">\u003cp>נתון (דוגמה להמחשה): דגני בוקר א׳: 18 גרם פחמימות למנה של 30 גרם. דגני בוקר ב׳: 55 גרם פחמימות ל־100 גרם.\u003cbr>שלב 1, פחמימות בכל גרם של א׳: 18 גרם ÷ 30 גרם = 0.6 גרם פחמימות לגרם מוצר\u003cbr>שלב 2, המרה של א׳ ל־100 גרם: 0.6 × 100 גרם = 60 גרם פחמימות ל־100 גרם\u003cbr>שלב 3, השוואה באותה יחידה: א׳ = 60 גרם ל־100 גרם, ב׳ = 55 גרם ל־100 גרם\u003cbr>\u003cstrong>תוצאה:\u003c/strong> מוצר א׳ מרוכז יותר בפחמימות, אף שהמספר על האריזה שלו (18) נראה קטן בהרבה מ־55.\u003c/p>\u003cp>הכלל: משווים ריכוז רק אחרי שהבאנו את שני המוצרים לאותה יחידה.\u003c/p>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"beyond-chip\">הבהרה מדעית מעבר למצגת\u003c/span> השקופית מונה את רכיבי התווית בלבד; הצגת ערכים למנה או ל־100 גרם היא נוהג מקובל בסימון, והמספרים כאן הם דוגמה להמחשה. · \u003cspan class=\"small muted\">לפי שקופית \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":5}'>\u003cbdi>5\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"5\" data-title=\"3. קריאת תווית מזון\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N01-4\">\u003ch2 class=\"part\">4. תוסף מזון לעומת תוסף תזונה\u003c/h2>\n\u003cp>זהו הבדל שהמצגת מדגישה ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":6}'>שקופיות \u003cbdi>6–7\u003c/bdi>\u003c/button>. \u003cstrong>תוסף מזון\u003c/strong> הוא חומר המוסף בתהליך הייצור למטרה טכנולוגית, למשל שימור, יציבות, צבע או מרקם. דוגמאות המופיעות במצגת: חומר משמר, צבע מאכל ואבקת אפייה. לעומתו \u003cstrong>תוסף תזונה\u003c/strong> הוא מוצר או רכיב שנצרך כדי להשלים רכיבים תזונתיים או למטרה אחרת, למשל תוספי ויטמינים או מינרלים. אין להסיק מכך שתוסף תזונה נחוץ לכל אדם או שהוא משפר ביצועים.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>שאלה\u003c/th>\u003cth>תוסף מזון\u003c/th>\u003cth>תוסף תזונה\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">מה המטרה?\u003c/th>\u003ctd>שינוי טכנולוגי במוצר\u003c/td>\u003ctd>השלמה תזונתית או מטרה ייעודית\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">באיזה שלב?\u003c/th>\u003ctd>בייצור המזון\u003c/td>\u003ctd>כחלק מצריכת האדם\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">דוגמה\u003c/th>\u003ctd>חומר משמר\u003c/td>\u003ctd>תוסף ברזל במקרה של חסר מאובחן\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-compare deck\" id=\"N01-A06\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">השוואה\u003c/span>\u003cb>תוסף מזון מול תוסף תזונה: חמש שאלות\u003c/b>\u003c/div>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>שאלה\u003c/th>\u003cth>תוסף מזון\u003c/th>\u003cth>תוסף תזונה\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">למה מוסיפים אותו?\u003c/th>\u003ctd>להשגת מטרה טכנולוגית במוצר המזון\u003c/td>\u003ctd>לא למטרה טכנולוגית: להשלמת חסרים תזונתיים או למטרות אחרות, כמו שיפור ביצועים בספורט\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">האם צורכים אותו לבד?\u003c/th>\u003ctd>לא, אינו מיועד לצריכה כשלעצמו\u003c/td>\u003ctd>כן, אפשר לצרוך אותו גם כשלעצמו\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">דוגמאות מהמצגת\u003c/th>\u003ctd>חומר משמר, צבע מאכל, אבקת אפייה\u003c/td>\u003ctd>ויטמינים ומינרלים\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">את מי הוא משרת?\u003c/th>\u003ctd>את המוצר: בטיחות, עיכוב קלקול, איכות, מגוון וזמינות\u003c/td>\u003ctd>את האדם שצורך אותו\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">שאלת המפתח לסיווג\u003c/th>\u003ctd>מה הוא עושה למזון?\u003c/td>\u003ctd>מה הוא אמור לתת לגוף?\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":6}'>\u003cbdi>6\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":7}'>\u003cbdi>7\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-misconception deck\" id=\"N01-A07\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">טעות נפוצה\u003c/span>\u003cb>״תוסף תזונה זה רק כדור״\u003c/b>\u003c/div>\u003cp>\u003cstrong>התפיסה השגויה:\u003c/strong> ״תוסף תזונה הוא רק כדור או קפסולה, וכל מה שמוסיפים למזון במפעל הוא תוסף מזון.״\u003c/p>\u003cp>\u003cstrong>למה זה לא נכון:\u003c/strong> לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":7}'>שקופית \u003cbdi>7\u003c/bdi>\u003c/button>, תוסף תזונה הוא רכיב \u003cstrong>המוסף למזון\u003c/strong> שלא לצורך מטרה טכנולוגית, ושאפשר לצרוך אותו \u003cstrong>גם\u003c/strong> כשלעצמו. כלומר ויטמין או מינרל יכולים להופיע בתוך מוצר מזון ועדיין להיחשב תוסף תזונה. מה שקובע הוא המטרה, לא הצורה ולא השלב שבו הוסף.\u003c/p>\u003cp>\u003cstrong>הניסוח הנכון:\u003c/strong> מסווגים לפי השאלה ״למה הוסף?״. מטרה טכנולוגית במוצר: תוסף מזון. השלמה תזונתית או מטרה אחרת עבור הגוף: תוסף תזונה.\u003c/p>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופית \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":7}'>\u003cbdi>7\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"6,7\" data-title=\"4. תוסף מזון לעומת תוסף תזונה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N01-5\">\u003ch2 class=\"part\">5. דוגמה מורכבת למבחן\u003c/h2>\n\u003caside class=\"gnote q\">\u003cspan class=\"tag\">מקרה\u003c/span>\u003cdiv>\u003cp>סטודנטית רואה מוצר עם תוספת ויטמין \u003cbdi>B12\u003c/bdi> וחומר משמר. היא אומרת: ״שניהם תוספי מזון, כי שניהם נוספו במפעל״. \u003cstrong>ניתוח:\u003c/strong> עצם העובדה שהתווספו במפעל אינה מספיקה לסיווג. צריך לבדוק \u003cem>למה\u003c/em> הוסף כל חומר. ויטמין \u003cbdi>B12\u003c/bdi> שהוסף לצורך העשרה תזונתית אינו ממלא את אותו תפקיד טכנולוגי של חומר המשמר.\u003c/p>\u003c/div>\u003c/aside>\n\u003caside class=\"gnote q\">\u003cspan class=\"tag\">מקרה\u003c/span>\u003cdiv>\u003cp>שני מוצרים מכילים 20 גרם פחמימה למנה, אך המנות בגדלים שונים. \u003cstrong>ניתוח:\u003c/strong> להשוואת ריכוז הפחמימות עדיף קודם להמיר לשיעור אחיד, למשל ל־100 גרם או ל־100 מ״ל, בהתאם למוצר.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-check deck\" id=\"N01-A08\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">בדיקת הבנה\u003c/span>\u003cb>בדיקת הבנה: ברזל ואבקת אפייה\u003c/b>\u003c/div>\u003cdiv class=\"lcheck\" data-id=\"N01-A08\">\u003cp class=\"lc-q\">\u003cb>למאפה דגנים הוסיפו במפעל ברזל כדי להעשיר אותו, ואבקת אפייה כדי שיתפח. איזה משפט מסווג נכון את השניים?\u003c/b>\u003c/p>\u003cdiv class=\"lc-opts\">\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N01-A08\",\"i\":2}'>\u003cspan class=\"k\">א\u003c/span>\u003cspan>שניהם תוספי תזונה, כי שניהם נאכלים יחד עם המזון\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N01-A08\",\"i\":3}'>\u003cspan class=\"k\">ב\u003c/span>\u003cspan>הברזל הוא תוסף מזון כי הוא מינרל, ואבקת האפייה היא תוסף תזונה כי היא משפרת את המוצר\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N01-A08\",\"i\":1}'>\u003cspan class=\"k\">ג\u003c/span>\u003cspan>אבקת האפייה היא תוסף מזון (מטרה טכנולוגית), והברזל הוא תוסף תזונה (השלמה תזונתית)\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N01-A08\",\"i\":0}'>\u003cspan class=\"k\">ד\u003c/span>\u003cspan>שניהם תוספי מזון, כי שניהם הוכנסו בתהליך הייצור\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"lc-exp\" hidden>\u003cp>אבקת האפייה משנה את המוצר עצמו, וזו מטרה טכנולוגית (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":7}'>שקופית \u003cbdi>7\u003c/bdi>\u003c/button>), ואילו הברזל נוסף כדי להשלים רכיב תזונתי לגוף, ולכן הוא תוסף תזונה. התשובה ״שניהם הוכנסו בייצור״ מפתה, אבל שלב ההוספה אינו קובע את הסיווג; המטרה קובעת.\u003c/p>\u003c/div>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":6}'>\u003cbdi>6\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":7}'>\u003cbdi>7\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"\" data-title=\"5. דוגמה מורכבת למבחן\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N01-6\">\u003ch2 class=\"part\">6. שאלות לבדיקה עצמית\u003c/h2>\n\u003col>\u003cli>למה לא נכון לומר שמיקרונוטריאנטים הם ״פחות חשובים״?\u003c/li>\u003cli>   \u003cstrong>תשובה:\u003c/strong> הכמות הנדרשת קטנה יותר, אך תפקידם בתהליכים חיוניים ומשק האנרגיה משמעותי.\u003c/li>\u003cli>כיצד מבדילים בין תוסף מזון לתוסף תזונה?\u003c/li>\u003cli>   \u003cstrong>תשובה:\u003c/strong> לפי מטרת השימוש, טכנולוגיה של ייצור מזון לעומת השלמה/צריכה תזונתית.\u003c/li>\u003cli>כיצד מחשבים את סך החלבון באריזה של 250 גרם אם בתווית כתוב 8 גרם ל־100 גרם?\u003c/li>\u003cli>   \u003cstrong>תשובה:\u003c/strong> 8×2.5 = 20 גרם.\u003c/li>\u003c/ol>\n\u003cdiv class=\"keywords\">\u003cspan class=\"tag\">מילות מפתח\u003c/span>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;מאקרונוטריאנט&quot;}'>מאקרונוטריאנט\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;מיקרונוטריאנט&quot;}'>מיקרונוטריאנט\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;תווית תזונתית&quot;}'>תווית תזונתית\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;רכיבים&quot;}'>רכיבים\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;תוסף מזון&quot;}'>תוסף מזון\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;תוסף תזונה&quot;}'>תוסף תזונה\u003c/button>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"\" data-title=\"6. שאלות לבדיקה עצמית\">\u003c/div>\u003c/section>","key":"L-N01"},{"topicId":"N02","title":"פחמימות, אינסולין, גליקוגן והעמסת פחמימות","unit":"יחידה 02","sections":[{"id":"s-N02-1","title":"1. פחמימות כדלק זמין","slides":[9]},{"id":"s-N02-2","title":"2. אינסולין וקליטת גלוקוז בשריר","slides":[10,11]},{"id":"s-N02-3","title":"3. מהו גליקוגן ואיפה הוא נשמר?","slides":[12]},{"id":"s-N02-4","title":"4. הקשר בין עומס אימונים לבין כמות הפחמימות בתפריט","slides":[13]},{"id":"s-N02-5","title":"5. העמסת פחמימות: למה, מתי ומה המחיר?","slides":[14,15]},{"id":"s-N02-6","title":"6. סיבים תזונתיים: טובים לבריאות, תלויי עיתוי באימון","slides":[16]},{"id":"s-N02-7","title":"7. שאלות תרגול עם פתרונות","slides":[]}],"html":"\u003cp class=\"lsrc\">\u003cspan class=\"tag\">מקור\u003c/span> \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":8}'>שקופיות \u003cbdi>8–16\u003c/bdi>\u003c/button>. \u003cstrong>רמת עומק:\u003c/strong> הבנה של רצף התהליך, השוואות, ניתוח מצבים וחישוב בסיסי. \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":13}'>שקופית \u003cbdi>13\u003c/bdi>\u003c/button> מציינת במפורש ש\u003cstrong>אין צורך לזכור את המספרים\u003c/strong> בטבלת המלצות הפחמימות היומית, ולכן באתר יתורגמו מספרים אלה לתרגול הבנה ולא לשאלות שינון חובה.\u003c/p>\n\u003csection class=\"lsec\" id=\"s-N02-1\">\u003ch2 class=\"part\">1. פחמימות כדלק זמין\u003c/h2>\n\u003cp>פחמימות מספקות לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":9}'>שקופית \u003cbdi>9\u003c/bdi>\u003c/button> כ־4 קק״ל לגרם. במהלך העיכול חלקן מתפרק לחד־סוכרים הנספגים לדם. גלוקוז הוא דלק מרכזי לתאים, ובייחוד בעל חשיבות למערכת העצבים ולמאמצים שבהם נדרש קצב אספקת אנרגיה גבוה. גלוקוז שנכנס לתא יכול לשמש להפקת אנרגיה או להיאגר בצורת גליקוגן. לכן התגובה של הגוף לארוחה אינה זהה לתגובה בזמן מאמץ: אחרי ארוחה רמת הגלוקוז עשויה לעלות, ואילו בשריר הפעיל הביקוש לדלק עולה והוא יכול להגביר קליטת גלוקוז.\u003c/p>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":9}'>שקופית \u003cbdi>9\u003c/bdi>\u003c/button> מתייחסת גם לחשיבות הפחמימות לתפקוד המוח ומציינת 130 גרם ליום כערך ייחוס. כדאי להבין את הרעיון ולא להתבלבל בין ״דרישת גלוקוז של רקמה״ לבין המלצה אישית קבועה לכמות הפחמימות עבור כל ספורטאית; תפריט בפועל תלוי במצב ובמאמץ.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-worked deck\" id=\"N02-A01\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">דוגמת חישוב\u003c/span>\u003cb>כמה אנרגיה המוח מקבל מגלוקוז?\u003c/b>\u003c/div>\u003cdiv class=\"worked\">\u003cp>נתונים (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":9}'>שקופית \u003cbdi>9\u003c/bdi>\u003c/button>): המוח זקוק לכ־130 גרם גלוקוז ביום, ולכל גרם פחמימה ערך אנרגטי של 4 קק״ל.\u003cbr>חישוב: 130 גרם × 4 קק״ל/גרם = 520 קק״ל ביום\u003cbr>\u003cstrong>תוצאה:\u003c/strong> כ־520 קק״ל ביום מגלוקוז משמשות לתפקוד המוח.\u003c/p>\u003cp>\u003cstrong>מה החישוב מלמד:\u003c/strong> זו דרישה של רקמה אחת, לא המלצת פחמימות יומית לספורטאית. כמות הפחמימות בתפריט נקבעת לפי עצימות, משך ותדירות האימונים (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":13}'>שקופית \u003cbdi>13\u003c/bdi>\u003c/button>).\u003c/p>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":9}'>\u003cbdi>9\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":13}'>\u003cbdi>13\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"9\" data-title=\"1. פחמימות כדלק זמין\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N02-2\">\u003ch2 class=\"part\">2. אינסולין וקליטת גלוקוז בשריר\u003c/h2>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":10}'>שקופיות \u003cbdi>10–11\u003c/bdi>\u003c/button> מציגות רעיון מפתח: אינסולין ופעילות גופנית יכולים, כל אחד במסלול איתות משלו, להגביר זמינות של נשאי גלוקוז בממברנת תא השריר. בהעשרה מדעית אלה נשאים מסוג \u003cstrong>\u003cbdi>GLUT4\u003c/bdi>\u003c/strong>. כאשר יותר נשאים מגיעים לממברנה, לגלוקוז קל יותר להיכנס לתא בנסיבות מתאימות. אינסולין מופרש בתגובה לעלייה בגלוקוז לאחר ארוחה, בעוד כיווץ שריר יכול להפעיל מסלולים שאינם תלויים באינסולין. לכן \u003cstrong>אינסולין ופעילות גופנית אינם אותו הדבר\u003c/strong>, אף שההשפעה הסופית על קליטת גלוקוז עשויה להיות דומה.\u003c/p>\n\u003cdiv class=\"dg-slot\" data-id=\"02-glut4-pathways\">\u003c/div>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":11}' aria-label=\"הגדלת שקופית 11\">\u003cimg src=\"images/slide_11.webp\" alt=\"שקופית 11: פעילות גופנית מעלה את רמת נשאי הגלוקוז בשריר בלי תלות באינסולין\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":11}'>שקופית \u003cbdi>11\u003c/bdi>\u003c/button>: פעילות גופנית מעלה את רמת נשאי הגלוקוז בשריר בלי תלות באינסולין\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003caside class=\"gnote kind\">\u003cspan class=\"tag\">רצף שכדאי לשנן\u003c/span>\u003cdiv>\u003cp>עלייה בגלוקוז אחרי ארוחה ← עלייה באינסולין ← איתות לתא השריר ← יותר נשאי גלוקוז על פני התא ← כניסת גלוקוז מהדם ← שימוש אנרגטי או אגירה. \u003cstrong>רצף מקביל בעת מאמץ:\u003c/strong> כיווץ שריר ← איתות תוך־תאי אחר ← העברת נשאים לממברנה ← קליטת גלוקוז לתא הפעיל.\u003c/p>\u003c/div>\u003c/aside>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":10}' aria-label=\"הגדלת שקופית 10\">\u003cimg src=\"images/slide_10.webp\" alt=\"שקופית 10: כניסת גלוקוז לתא שריר בתיווך אינסולין\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":10}'>שקופית \u003cbdi>10\u003c/bdi>\u003c/button>: כניסת גלוקוז לתא שריר בתיווך אינסולין\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003caside class=\"gnote q\">\u003cspan class=\"tag\">שאלה נפוצה\u003c/span>\u003cdiv>\u003cp>״אם רמת האינסולין יורדת בזמן מאמץ, איך התא עדיין קולט גלוקוז?״ התשובה היא שלכיווץ השריר יש מסלול שמאפשר להגדיל את פעילות הנשאים גם בלי עלייה מקבילה באינסולין. זה אחד ההסברים לתרומתה של פעילות גופנית לשליטה במאזן הגלוקוז.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-steps beyond\" id=\"N02-A02\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">שלב אחר שלב\u003c/span>\u003cb>מסלול האינסולין: מארוחה לגלוקוז בתוך השריר\u003c/b>\u003c/div>\u003col class=\"steps\">\u003cli>\u003cspan>אחרי ארוחה עם פחמימות, גלוקוז נספג לדם ורמתו בדם עולה.\u003c/span>\u003c/li>\u003cli>\u003cspan>הלבלב מגיב בהפרשת אינסולין לדם.\u003c/span>\u003c/li>\u003cli>\u003cspan>אינסולין נקשר לקולטן על פני תא השריר ומפעיל שרשרת איתות בתוך התא.\u003c/span>\u003c/li>\u003cli>\u003cspan>נשאי \u003cbdi>GLUT4\u003c/bdi>, שממתינים בשלפוחיות בתוך התא, עוברים אל ממברנת התא ומשתלבים בה.\u003c/span>\u003c/li>\u003cli>\u003cspan>יותר נשאים בממברנה: כניסת הגלוקוז לתא מואצת ורמת הסוכר בדם יורדת (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":10}'>שקופית \u003cbdi>10\u003c/bdi>\u003c/button>).\u003c/span>\u003c/li>\u003cli>\u003cspan>בתוך התא הגלוקוז משמש להפקת אנרגיה או נאגר כגליקוגן.\u003c/span>\u003c/li>\u003c/ol>\n    \u003cp class=\"add-src\">\u003cspan class=\"beyond-chip\">הבהרה מדעית מעבר למצגת\u003c/span> המצגת אומרת שאינסולין מעלה את רמות נשאי הגלוקוז בתא השריר; שם הנשא \u003cbdi>GLUT4\u003c/bdi>, הקולטן ותנועת הנשאים משלפוחיות בתוך התא אל הממברנה הם פירוט ממספרי הלימוד. · \u003cspan class=\"small muted\">לפי שקופית \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":10}'>\u003cbdi>10\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-steps beyond\" id=\"N02-A03\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">שלב אחר שלב\u003c/span>\u003cb>מסלול הכיווץ: קליטת גלוקוז בלי תלות באינסולין\u003c/b>\u003c/div>\u003col class=\"steps\">\u003cli>\u003cspan>השריר מתכווץ בזמן ריצה, חתירה או שחייה.\u003c/span>\u003c/li>\u003cli>\u003cspan>הכיווץ משחרר סידן בתוך תא השריר, ובמקביל \u003cbdi>ATP\u003c/bdi> מתפרק מהר והמאזן האנרגטי בתא משתנה.\u003c/span>\u003c/li>\u003cli>\u003cspan>שינויים אלה מפעילים מסלול איתות שאינו עובר דרך קולטן האינסולין.\u003c/span>\u003c/li>\u003cli>\u003cspan>נשאי \u003cbdi>GLUT4\u003c/bdi> עוברים לממברנה, גם כשרמת האינסולין בדם אינה גבוהה.\u003c/span>\u003c/li>\u003cli>\u003cspan>גלוקוז נכנס לשריר הפעיל ומשמש מיד כדלק לכיווץ.\u003c/span>\u003c/li>\u003cli>\u003cspan>השורה למבחן: פעילות גופנית מעלה את נשאי הגלוקוז בשריר באופן שאינו תלוי באינסולין (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":11}'>שקופית \u003cbdi>11\u003c/bdi>\u003c/button>).\u003c/span>\u003c/li>\u003c/ol>\n    \u003cp class=\"add-src\">\u003cspan class=\"beyond-chip\">הבהרה מדעית מעבר למצגת\u003c/span> המצגת קובעת שפעילות גופנית מעלה את נשאי הגלוקוז בשריר בלי תלות באינסולין; האותות שמפעילים זאת (סידן ושינוי במאזן האנרגיה בתא) הם תוספת ממספרי הלימוד. · \u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":10}'>\u003cbdi>10\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":11}'>\u003cbdi>11\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"10,11\" data-title=\"2. אינסולין וקליטת גלוקוז בשריר\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N02-3\">\u003ch2 class=\"part\">3. מהו גליקוגן ואיפה הוא נשמר?\u003c/h2>\n\u003cp>גליקוגן הוא צורת אגירה של פחמימות בגוף. \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":12}'>שקופית \u003cbdi>12\u003c/bdi>\u003c/button> מציגה סדרי גודל לימודיים של כ־400 גרם בשריר וכ־100 גרם בכבד, תוך הסתייגות שיש הבדלים בין אנשים ובין רמות אימון. \u003cstrong>גליקוגן השריר\u003c/strong> משמש בעיקר את אותו שריר; \u003cstrong>גליקוגן הכבד\u003c/strong> יכול לשמש לשמירה על רמת הגלוקוז בדם ולספק גלוקוז לאיברים אחרים. לפיכך שני מאגרים אלה אינם שקולים, אף ששניהם מורכבים מיחידות גלוקוז.\u003c/p>\n\u003cdiv class=\"dg-slot\" data-id=\"03-glycogen-stores\">\u003c/div>\n\u003cp>דמיינו שני סוגי מחסנים: מחסן מקומי שמשמש מפעל מסוים, ומחסן מרכזי המשרת את העיר. השריר אינו ״שולח״ באופן ישיר את מאגר הגליקוגן שלו לשריר אחר כמו שהכבד יכול לשחרר גלוקוז לדם. במאמץ ממושך חלק גדול מהשינוי ביכולת להמשיך בעצימות קשור לזמינות דלק ולמאגרי הגליקוגן, אך זמן הדלדול תלוי בעצימות, במשך, בתזונה וברמת האימון. השקופית מציעה ״כשעתיים״ כדוגמה כללית, לא כחוק פיזיולוגי אוניברסלי.\u003c/p>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":12}' aria-label=\"הגדלת שקופית 12\">\u003cimg src=\"images/slide_12.webp\" alt=\"שקופית 12: פירוט המאגרים\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":12}'>שקופית \u003cbdi>12\u003c/bdi>\u003c/button>: פירוט המאגרים\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-compare deck\" id=\"N02-A04\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">השוואה\u003c/span>\u003cb>גליקוגן בשריר מול גליקוגן בכבד\u003c/b>\u003c/div>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>מאפיין\u003c/th>\u003cth>גליקוגן בשריר\u003c/th>\u003cth>גליקוגן בכבד\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">כמות ממוצעת\u003c/th>\u003ctd>כ־400 גרם\u003c/td>\u003ctd>כ־100 גרם\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">מי משתמש בו?\u003c/th>\u003ctd>השריר עצמו בלבד\u003c/td>\u003ctd>רקמות הגוף, דרך הדם\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">האם יוצא לדם כגלוקוז?\u003c/th>\u003ctd>לא\u003c/td>\u003ctd>כן, מתפרק לגלוקוז שיוצא לדם\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">התרומה במאמץ\u003c/th>\u003ctd>דלק ישיר לשריר שעובד\u003c/td>\u003ctd>שמירה על אספקת גלוקוז בדם לרקמות, כולל המוח\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":9}'>\u003cbdi>9\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":12}'>\u003cbdi>12\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-misconception beyond\" id=\"N02-A05\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">טעות נפוצה\u003c/span>\u003cb>״שרירים מלאים בגליקוגן יזינו את המוח״\u003c/b>\u003c/div>\u003cp>\u003cstrong>התפיסה השגויה:\u003c/strong> ״כששרירי הרגליים מלאים בגליקוגן, הם יכולים לשחרר גלוקוז לדם ולהזין את המוח.״\u003c/p>\u003cp>\u003cstrong>למה זה לא נכון:\u003c/strong> לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":12}'>שקופית \u003cbdi>12\u003c/bdi>\u003c/button>, גליקוגן בשריר הוא לשימוש השריר בלבד. רק גליקוגן הכבד מתפרק לגלוקוז שיוצא לדם. ההסבר הביוכימי: בכבד יש אנזים (גלוקוז־6־פוספטאז) שמאפשר לשחרר גלוקוז חופשי לדם. בשריר אין אותו, ולכן הגלוקוז מגליקוגן השריר נשאר בתא ומשמש לכיווץ.\u003c/p>\u003cp>\u003cstrong>הניסוח הנכון:\u003c/strong> גליקוגן השריר מזין את השריר עצמו. גליקוגן הכבד שומר על הגלוקוז בדם עבור שאר הרקמות.\u003c/p>\n    \u003cp class=\"add-src\">\u003cspan class=\"beyond-chip\">הבהרה מדעית מעבר למצגת\u003c/span> ההסבר האנזימטי (היעדר האנזים גלוקוז־6־פוספטאז בשריר) אינו מופיע במצגת; הוא מסביר מדוע גליקוגן השריר הוא ״לשימוש השריר בלבד״. · \u003cspan class=\"small muted\">לפי שקופית \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":12}'>\u003cbdi>12\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-worked deck\" id=\"N02-A06\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">דוגמת חישוב\u003c/span>\u003cb>כמה אנרגיה אגורה בגליקוגן?\u003c/b>\u003c/div>\u003cdiv class=\"worked\">\u003cp>נתונים (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":9}'>שקופיות \u003cbdi>9\u003c/bdi>\u003c/button> ו־12): כ־400 גרם גליקוגן בשריר, כ־100 גרם בכבד, 4 קק״ל לכל גרם פחמימה.\u003cbr>שלב 1, סך הגליקוגן: 400 גרם + 100 גרם = 500 גרם\u003cbr>שלב 2, אנרגיה בשריר: 400 גרם × 4 קק״ל/גרם = 1,600 קק״ל\u003cbr>שלב 3, אנרגיה בכבד: 100 גרם × 4 קק״ל/גרם = 400 קק״ל\u003cbr>שלב 4, סך הכול: 1,600 קק״ל + 400 קק״ל = 2,000 קק״ל\u003cbr>שלב 5, החלק שבשריר: 1,600 קק״ל ÷ 2,000 קק״ל = 0.8, כלומר 80%\u003cbr>\u003cstrong>תוצאה:\u003c/strong> כ־2,000 קק״ל אגורות כגליקוגן, ו־80% מהן נמצאות בשריר.\u003c/p>\u003cp>\u003cstrong>המשמעות:\u003c/strong> רוב המאגר מקומי לשריר. המצגת מעריכה שבמאמץ מתמשך המאגר מספיק לכשעתיים; זה אומדן כללי, והזמן בפועל תלוי בעצימות ובאדם.\u003c/p>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":9}'>\u003cbdi>9\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":12}'>\u003cbdi>12\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"notebox\" data-notes=\"5\">\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"12\" data-title=\"3. מהו גליקוגן ואיפה הוא נשמר?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N02-4\">\u003ch2 class=\"part\">4. הקשר בין עומס אימונים לבין כמות הפחמימות בתפריט\u003c/h2>\n\u003cp>ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":13}'>שקופית \u003cbdi>13\u003c/bdi>\u003c/button> מוצגת טבלה שמדגימה כיצד ההמלצה היומית משתנה לפי עצימות ותדירות האימון. \u003cstrong>המרכיב המרכזי לזכור הוא הכיוון:\u003c/strong> ככל שעומס האימונים וצריכת האנרגיה מפחמימות גדלים, כך בדרך כלל גדל הצורך להחזיר פחמימות לתפריט. אין צורך לשנן את המספרים בטבלה לפי הוראת המצגת עצמה. עדיין אפשר לתרגל חישוב של גרם לק״ג כדי להבין מה משמעות היחידה: 5 גרם לק״ג אצל אדם ששוקל 60 ק״ג הם 300 גרם פחמימות ליממה. החישוב כאן הוא דוגמה מתמטית, לא המלצה אישית.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-worked deck\" id=\"N02-A07\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">דוגמת חישוב\u003c/span>\u003cb>מה זה ״גרם לק״ג״? אותה ספורטאית, עומסים שונים\u003c/b>\u003c/div>\u003cdiv class=\"worked\">\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":13}'>שקופית \u003cbdi>13\u003c/bdi>\u003c/button> אומרת שאין צורך לזכור את המספרים. התרגיל נועד להבין את היחידה ״גרם פחמימה לק״ג משקל גוף״.\u003cbr>נתון: ספורטאית במשקל 60 ק״ג (דוגמה להמחשה).\u003cbr>שלב 1, מתאמנת לשיפור הכושר (3–5 גרם/ק״ג): 3 גרם/ק״ג × 60 ק״ג = 180 גרם; 5 גרם/ק״ג × 60 ק״ג = 300 גרם ליום\u003cbr>שלב 2, ספורטאית בימים בעצימות בינונית־גבוהה (7–12 גרם/ק״ג): 7 גרם/ק״ג × 60 ק״ג = 420 גרם; 12 גרם/ק״ג × 60 ק״ג = 720 גרם ליום\u003cbr>שלב 3, 24–72 שעות לפני מירוץ (10 גרם/ק״ג): 10 גרם/ק״ג × 60 ק״ג = 600 גרם ליום\u003cbr>\u003cstrong>תוצאה:\u003c/strong> לאותה ספורטאית הכמות היומית נעה בין 180 ל־720 גרם, לפי עומס האימונים.\u003c/p>\u003cp>\u003cstrong>מה לזכור:\u003c/strong> את הכיוון. יותר עצימות, משך ותדירות: יותר פחמימות. זה חישוב לימודי, לא המלצה אישית.\u003c/p>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופית \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":13}'>\u003cbdi>13\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-check deck\" id=\"N02-A08\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">בדיקת הבנה\u003c/span>\u003cb>בדיקת הבנה: עומס עולה\u003c/b>\u003c/div>\u003cdiv class=\"lcheck\" data-id=\"N02-A08\">\u003cp class=\"lc-q\">\u003cb>רוכבת עוברת משעת אימון קלה ביום לשלוש שעות ביום בעצימות בינונית־גבוהה. מה העיקרון של \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":13}'>שקופית \u003cbdi>13\u003c/bdi>\u003c/button> לגבי צריכת הפחמימות שלה?\u003c/b>\u003c/p>\u003cdiv class=\"lc-opts\">\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N02-A08\",\"i\":1}'>\u003cspan class=\"k\">א\u003c/span>\u003cspan>הצריכה נשארת 130 גרם ביום, כי זו כמות הגלוקוז שהמוח צריך\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N02-A08\",\"i\":3}'>\u003cspan class=\"k\">ב\u003c/span>\u003cspan>אין קשר בין עומס האימונים לבין כמות הפחמימות; רק משקל הגוף קובע\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N02-A08\",\"i\":2}'>\u003cspan class=\"k\">ג\u003c/span>\u003cspan>הצריכה צריכה לרדת, כי באימון ארוך הגוף משתמש בשומן ולא בפחמימות\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N02-A08\",\"i\":0}'>\u003cspan class=\"k\">ד\u003c/span>\u003cspan>הצריכה היומית בגרם לק״ג צפויה לעלות, כי ההמלצה נשענת על עצימות, משך ותדירות האימונים\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"lc-exp\" hidden>\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":13}'>שקופית \u003cbdi>13\u003c/bdi>\u003c/button> קובעת שההמלצה מסתמכת על עצימות האימון, משכו ותדירותו, ולכן עלייה בכל אלה מעלה את הצורך בפחמימות. האפשרות של 130 גרם מפתה, אבל זו דרישת המוח לגלוקוז (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":9}'>שקופית \u003cbdi>9\u003c/bdi>\u003c/button>) ולא המלצה שמשתנה לפי אימון.\u003c/p>\u003c/div>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופית \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":13}'>\u003cbdi>13\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"notebox\" data-notes=\"8\">\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"13\" data-title=\"4. הקשר בין עומס אימונים לבין כמות הפחמימות בתפריט\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N02-5\">\u003ch2 class=\"part\">5. העמסת פחמימות: למה, מתי ומה המחיר?\u003c/h2>\n\u003cp>העמסת פחמימות (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":14}'>שקופיות \u003cbdi>14–15\u003c/bdi>\u003c/button>) היא אסטרטגיה לפני פעילות ארוכה ומאתגרת שנועדה להעלות את מאגרי הגליקוגן ולדחות עייפות. היא אינה נדרשת לכל אימון. הצגת המצגת: ניתן באמצעותה להגיע למאגרי גליקוגן גדולים יותר, ונזכרות כמה שיטות. חשוב להבחין בין \u003cstrong>מטרת השיטה\u003c/strong> לבין \u003cstrong>אופן הביצוע\u003c/strong>: המטרה היא שיפור זמינות הדלק לתחרות ארוכה; השיטות הן וריאציות של תזמון תזונה ואימון.\u003c/p>\n\u003cp>גליקוגן נאגר יחד עם מים, ולכן גידול במאגרים עשוי להעלות את משקל הגוף וליצור תחושת כבדות. אם הפעילות קצרה ואינה מרוקנת גליקוגן במידה ניכרת, לא בהכרח מתקבל יתרון. זוהי דוגמה לכך שלא ניתן להעתיק אסטרטגיית תזונה של מרתוניסט לתרגול קצר בחדר כושר בלי לברר מה מטרת המאמץ.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-steps deck\" id=\"N02-A09\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">שלב אחר שלב\u003c/span>\u003cb>העמסת פחמימות: ההיגיון מההחלטה ועד המחיר\u003c/b>\u003c/div>\u003col class=\"steps\">\u003cli>\u003cspan>שאלת פתיחה: האם המאמץ הצפוי ארוך וקשה, כזה שצפוי לרוקן את מאגרי הגליקוגן? אם לא, ההעמסה לא מומלצת (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":15}'>שקופית \u003cbdi>15\u003c/bdi>\u003c/button>).\u003c/span>\u003c/li>\u003cli>\u003cspan>במאמץ מתמשך, מאגר הגליקוגן הרגיל (כ־500 גרם) מספיק לפי המצגת לכשעתיים (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":12}'>שקופית \u003cbdi>12\u003c/bdi>\u003c/button>).\u003c/span>\u003c/li>\u003cli>\u003cspan>בימים שלפני התחרות מבצעים אחת מגישות ההעמסה (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":14}'>שקופית \u003cbdi>14\u003c/bdi>\u003c/button>).\u003c/span>\u003c/li>\u003cli>\u003cspan>מאגרי הגליקוגן גדלים, עד כ־700 גרם.\u003c/span>\u003c/li>\u003cli>\u003cspan>יש יותר דלק זמין לשרירים, והעייפות נדחית.\u003c/span>\u003c/li>\u003cli>\u003cspan>המחיר: עם הגליקוגן נאגרים גם מים, ולכן המשקל עולה ועלולה להופיע תחושת כבדות (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":15}'>שקופית \u003cbdi>15\u003c/bdi>\u003c/button>).\u003c/span>\u003c/li>\u003c/ol>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":12}'>\u003cbdi>12\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":14}'>\u003cbdi>14\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":15}'>\u003cbdi>15\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-misconception beyond\" id=\"N02-A10\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">טעות נפוצה\u003c/span>\u003cb>״אחרי ההעמסה עליתי קילו, כלומר השמנתי״\u003c/b>\u003c/div>\u003cp>\u003cstrong>התפיסה השגויה:\u003c/strong> ״אחרי העמסת פחמימות המשקל עלה, כלומר הוספתי שומן.״\u003c/p>\u003cp>\u003cstrong>למה זה לא נכון:\u003c/strong> לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":15}'>שקופית \u003cbdi>15\u003c/bdi>\u003c/button>, אגירת גליקוגן מביאה גם לאגירת מים. בספרות מקובל שכל גרם גליקוגן נאגר עם כ־3 גרם מים. אם המאגר עולה מכ־500 לכ־700 גרם (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":12}'>שקופיות \u003cbdi>12\u003c/bdi>\u003c/button> ו־14), נוספים 200 גרם גליקוגן, ואיתם כ־200 גרם × 3 = 600 גרם מים. יחד: 200 גרם + 600 גרם = כ־800 גרם, קרוב לקילו, בלי תוספת שומן.\u003c/p>\u003cp>\u003cstrong>הניסוח הנכון:\u003c/strong> העלייה במשקל היא בעיקר גליקוגן ומים. לפני מאמץ ארוך זה מחיר סביר תמורת דלק נוסף. לפני מאמץ שלא צפוי לרוקן את המאגרים זה רק משקל עודף ותחושת כבדות, ולכן ההעמסה לא מומלצת שם.\u003c/p>\n    \u003cp class=\"add-src\">\u003cspan class=\"beyond-chip\">הבהרה מדעית מעבר למצגת\u003c/span> היחס של כ־3 גרם מים לכל גרם גליקוגן הוא ערך מקובל בספרות ואינו מופיע במצגת. · \u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":12}'>\u003cbdi>12\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":14}'>\u003cbdi>14\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":15}'>\u003cbdi>15\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"notebox\" data-notes=\"8\">\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"14,15\" data-title=\"5. העמסת פחמימות: למה, מתי ומה המחיר?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N02-6\">\u003ch2 class=\"part\">6. סיבים תזונתיים: טובים לבריאות, תלויי עיתוי באימון\u003c/h2>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":16}'>שקופית \u003cbdi>16\u003c/bdi>\u003c/button> מסכמת שסיבים תזונתיים יכולים לעזור לתחושת שובע, להשפיע על קצב העיכול ולתרום לתפקוד מערכת העיכול. סיבים סופחים מים, ולחלקם השפעה על תגובת הגלוקוז לאחר ארוחה. עם זאת, מזון עתיר סיבים סמוך מאוד למאמץ עצים עלול להכביד על מערכת העיכול. לכן יש להבחין בין ״מה מומלץ בתפריט שגרתי״ לבין ״מה רצוי לאכול ממש לפני פעילות״.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-misconception deck\" id=\"N02-A11\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">טעות נפוצה\u003c/span>\u003cb>״סיבים בריאים, אז כמה שיותר ובכל ארוחה״\u003c/b>\u003c/div>\u003cp>\u003cstrong>התפיסה השגויה:\u003c/strong> ״סיבים בריאים, אז כדאי לאכול מהם כמה שיותר, גם רגע לפני אימון.״\u003c/p>\u003cp>\u003cstrong>למה זה לא נכון:\u003c/strong> \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":16}'>שקופית \u003cbdi>16\u003c/bdi>\u003c/button> מונה יתרונות אמיתיים: האטת ריקון הקיבה ושובע ארוך, ספיחת מים ותנועתיות מעי, ובלימת עליית הסוכר והאינסולין אחרי ארוחה. אבל היא גם מזהירה שכמויות גדולות מדי עלולות להפריע לספיגת מינרלים וויטמינים ולגרום לאי־נוחות קשה במערכת העיכול ואף לחסימת מעיים. ומכיוון שסיבים שוהים זמן רב בקיבה, מומלץ לצמצם אותם בארוחה שלפני האימון.\u003c/p>\u003cp>\u003cstrong>הניסוח הנכון:\u003c/strong> סיבים חשובים בתפריט השגרתי, במידה. בארוחה שלפני אימון מצמצמים אותם; זו שאלה של עיתוי, לא של ״בריא או לא בריא״.\u003c/p>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופית \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":16}'>\u003cbdi>16\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"16\" data-title=\"6. סיבים תזונתיים: טובים לבריאות, תלויי עיתוי באימון\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N02-7\">\u003ch2 class=\"part\">7. שאלות תרגול עם פתרונות\u003c/h2>\n\u003cp>\u003cstrong>א. מתאמנת אכלה ארוחת פחמימות לפני אימון. מה משותף לאינסולין ולפעילות הגופנית לגבי השריר?\u003c/strong> שניהם יכולים לעודד הימצאות נשאי גלוקוז על קרום התא, אך דרך מנגנוני איתות שונים.\u003c/p>\n\u003cp>\u003cstrong>ב. מדוע גליקוגן בכבד חשוב גם לרקמות שאינן הכבד עצמו?\u003c/strong> משום שהכבד מסוגל לשחרר גלוקוז לדם, וכך לתרום לשמירה על רמת הסוכר בין ארוחות ובמאמץ.\u003c/p>\n\u003cp>\u003cstrong>ג. אימון של 40 דקות: האם בהכרח צריך לבצע העמסת פחמימות מראש?\u003c/strong> לא. יש לבחון את משך המאמץ, עצימותו והאם קיים יתרון אמיתי בהגדלת המאגרים. אין המלצה להעמיס אוטומטית.\u003c/p>\n\u003cp>\u003cstrong>ד. למה לא כדאי להמציא כלל קשיח של ״כל אדם מרוקן גליקוגן אחרי שעתיים״?\u003c/strong> מפני שהמשך תלוי במאגרים ההתחלתיים, עצימות, תזונה, רמת כושר וסוג הפעילות.\u003c/p>\n\u003caside class=\"gnote q\">\u003cspan class=\"tag\">בדיקת הבנה\u003c/span>\u003cdiv>\u003cp>אם צריך לבחור בין ארוחה עתירת סיבים כשעה לפני ריצה עצימה לבין ארוחה דלה בסיבים יותר, כיצד תסבירי את השיקול? התשובה קשורה לנוחות העיכול ולא לכך שסיבים ״אינם בריאים״.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"keywords\">\u003cspan class=\"tag\">מילות מפתח\u003c/span>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;גלוקוז&quot;}'>גלוקוז\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;אינסולין&quot;}'>אינסולין\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;GLUT4&quot;}'>\u003cbdi>GLUT4\u003c/bdi>\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;כיווץ שריר&quot;}'>כיווץ שריר\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;גליקוגן כבד&quot;}'>גליקוגן כבד\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;גליקוגן שריר&quot;}'>גליקוגן שריר\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;העמסת פחמימות&quot;}'>העמסת פחמימות\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;סיבים תזונתיים&quot;}'>סיבים תזונתיים\u003c/button>\u003c/div>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-check deck\" id=\"N02-A12\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">בדיקת הבנה\u003c/span>\u003cb>בדיקת הבנה: מרתוניסטית בדקה ה־90\u003c/b>\u003c/div>\u003cdiv class=\"lcheck\" data-id=\"N02-A12\">\u003cp class=\"lc-q\">\u003cb>מרתוניסטית רצה כבר 90 דקות, ושרירי הרגליים שלה ממשיכים לקלוט גלוקוז מהדם גם כשרמת האינסולין שלה אינה גבוהה. איזה הסבר מתאים למצגת?\u003c/b>\u003c/p>\u003cdiv class=\"lc-opts\">\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N02-A12\",\"i\":2}'>\u003cspan class=\"k\">א\u003c/span>\u003cspan>הגלוקוז בדם מגיע מגליקוגן הכבד, אבל בלי אינסולין השריר לא יכול לקלוט אותו ולכן הוא לא קולט גלוקוז\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N02-A12\",\"i\":3}'>\u003cspan class=\"k\">ב\u003c/span>\u003cspan>הגלוקוז בדם מגיע מהסיבים התזונתיים שבארוחה האחרונה, שמגבירים את הפרשת האינסולין\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N02-A12\",\"i\":1}'>\u003cspan class=\"k\">ג\u003c/span>\u003cspan>הגלוקוז בדם מגיע מגליקוגן הכבד, והכיווץ עצמו מעלה את נשאי הגלוקוז בשריר בלי תלות באינסולין\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N02-A12\",\"i\":0}'>\u003cspan class=\"k\">ד\u003c/span>\u003cspan>הגלוקוז בדם מגיע מגליקוגן השריר, והקליטה מתאפשרת רק בזכות אינסולין\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"lc-exp\" hidden>\u003cp>לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":12}'>שקופית \u003cbdi>12\u003c/bdi>\u003c/button> רק גליקוגן הכבד מתפרק לגלוקוז שיוצא לדם, ולפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":11}'>שקופית \u003cbdi>11\u003c/bdi>\u003c/button> פעילות גופנית מעלה את נשאי הגלוקוז בשריר בלי תלות באינסולין. האפשרות הראשונה מפתה, אבל גליקוגן השריר אינו יוצא לדם, והקליטה במאמץ אינה תלויה באינסולין.\u003c/p>\u003c/div>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":10}'>\u003cbdi>10\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":11}'>\u003cbdi>11\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":12}'>\u003cbdi>12\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"\" data-title=\"7. שאלות תרגול עם פתרונות\">\u003c/div>\u003c/section>","key":"L-N02"},{"topicId":"N03","title":"חלבונים, חומצות אמינו ומבנה החלבון","unit":"יחידה 03","sections":[{"id":"s-N03-1","title":"1. מהו חלבון?","slides":[]},{"id":"s-N03-2","title":"2. חומצת אמינו: מבנה והבחנה בין חיונית ללא חיונית","slides":[18]},{"id":"s-N03-3","title":"3. קשר פפטידי והמבנה של החלבון","slides":[20]},{"id":"s-N03-4","title":"4. דנטורציה אינה בהכרח פירוק של חומצות האמינו","slides":[20]},{"id":"s-N03-5","title":"5. מהי איכות חלבון לפי ההרכב?","slides":[21]},{"id":"s-N03-6","title":"6. חלבון ממזון לעומת אבקת חלבון","slides":[58,59]},{"id":"s-N03-7","title":"7. שאלות עם תשובות","slides":[]}],"html":"\u003cp class=\"lsrc\">\u003cspan class=\"tag\">מקור\u003c/span> \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":17}'>שקופיות \u003cbdi>17–21\u003c/bdi>\u003c/button>; התייחסות נוספת לאבקות חלבון ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":58}'>שקופיות \u003cbdi>58–59\u003c/bdi>\u003c/button>.\u003c/p>\n\u003csection class=\"lsec\" id=\"s-N03-1\">\u003ch2 class=\"part\">1. מהו חלבון?\u003c/h2>\n\u003cp>חלבון אינו חומר יחיד אלא משפחה של מולקולות הבנויות משרשראות חומצות אמינו. רצף חומצות האמינו משפיע על האופן שבו החלבון מתקפל ועל תפקידו. בגוף יש חלבוני מבנה, אנזימים, חלבונים שמעבירים חומרים, חלבוני שריר ורכיבים רבים נוספים. בספורט חשובים חלבונים בין היתר לתחזוקה ולהתחדשות רקמות, לבניית מבנה השריר ולהסתגלות לאימון, אך אין להסיק שתוספת חלבון ללא גבול מבטיחה עלייה ליניארית בכוח.\u003c/p>\n\u003cp>בהעשרה כללית, חלבון מספק כ־4 קק״ל לגרם, אך תפקידו אינו רק אספקת אנרגיה. בעוד פחמימות ושומנים נשמרים במאגרים ייעודיים, אין ״מחסן חלבון״ נפרד באותו מובן. חלבוני הגוף ממלאים תפקידים מבניים ותפקודיים, ופירוק שלהם לצורכי אנרגיה כרוך במחיר פיזיולוגי.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-compare deck\" id=\"N03-A01\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">השוואה\u003c/span>\u003cb>מפת מושגים: מחומצת אמינו עד חלבון פעיל\u003c/b>\u003c/div>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>מושג\u003c/th>\u003cth>מה זה\u003c/th>\u003cth>מה חשוב לזכור לפי המצגת\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">חומצת אמינו\u003c/th>\u003ctd>יחידת הבנייה של החלבון\u003c/td>\u003ctd>20 חומצות אמינו שהגוף מכיר; הן נבדלות זו מזו בקבוצה הפונקציונלית (השייר)\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">קשר פפטידי\u003c/th>\u003ctd>הקשר שמחבר חומצת אמינו לשכנתה\u003c/td>\u003ctd>בעזרתו נוצרות שרשראות של חומצות אמינו\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">פפטיד / מבנה ראשוני\u003c/th>\u003ctd>השרשרת עצמה: רצף חומצות האמינו\u003c/td>\u003ctd>לכל חלבון רצף ייחודי וקבוע, והוא אחד הקובעים את תכונותיו\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">מבנה שלישוני\u003c/th>\u003ctd>השרשרת מקופלת למבנה מרחבי ספציפי\u003c/td>\u003ctd>המבנה המרחבי מכתיב את תכונות החלבון, למשל פעילות אנזימטית\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":18}'>\u003cbdi>18\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":19}'>\u003cbdi>19\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":20}'>\u003cbdi>20\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"\" data-title=\"1. מהו חלבון?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N03-2\">\u003ch2 class=\"part\">2. חומצת אמינו: מבנה והבחנה בין חיונית ללא חיונית\u003c/h2>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":18}'>שקופית \u003cbdi>18\u003c/bdi>\u003c/button> מתארת שלד המשותף לחומצות אמינו וקבוצה צדדית שמבדילה ביניהן. חומצות האמינו מתחברות זו לזו בקשר פפטידי ויוצרות שרשראות. המושג \u003cstrong>חומצת אמינו חיונית\u003c/strong> אינו אומר ״חשובה יותר״, אלא שהגוף אינו יכול לייצר אותה בכמות מספקת ולכן צריך לקבל אותה במזון. חומצת אמינו שאינה חיונית אינה ״מיותרת״: היא נחוצה, אך הגוף מסוגל ליצור אותה בתנאים רגילים.\u003c/p>\n\u003cdiv class=\"dg-slot\" data-id=\"09-protein-structure\">\u003c/div>\n\u003cp>במצגת מופיעים המונחים \u003cstrong>טראנסאמינציה\u003c/strong> (העברת קבוצת אמינו בין תרכובות) ו\u003cstrong>דה־אמינציה\u003c/strong> (הסרת קבוצת אמינו). מדוע זה חשוב? כי כאשר חומצת אמינו אינה מנוצלת לבניית חלבון היא יכולה לעבור פירוק ושימוש בשלד הפחמני שלה. החנקן אינו יכול פשוט להיאגר ללא ויסות; הוא עובר עיבוד, בין השאר לאוריאה, המופרשת בשתן.\u003c/p>\n\u003ch3>תרגיל יישומי\u003c/h3>\n\u003cp>סט
