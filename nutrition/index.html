ופית."},{"id":"SEQ-003","topicId":"N02","title":"קליטת גלוקוז בזמן פעילות","steps":[{"id":"SEQ-003-s1","text":"כיווץ שריר"},{"id":"SEQ-003-s2","text":"הפעלת איתות שאינו תלוי בהכרח באינסולין"},{"id":"SEQ-003-s3","text":"העברת נשאי גלוקוז לממברנה"},{"id":"SEQ-003-s4","text":"קליטת גלוקוז בתא השריר"}],"correctOrder":["SEQ-003-s1","SEQ-003-s2","SEQ-003-s3","SEQ-003-s4"],"note":"לפי שקופיות 10–11, פעילות גופנית מעלה את רמת נשאי הגלוקוז בשריר במנגנון שאינו תלוי באינסולין, והנשאים מאפשרים לגלוקוז להיכנס לתא השריר הפעיל.","sourceSlides":[10,11],"enrichment":"המצגת מדברת על העלאת רמת נשאי הגלוקוז בתא השריר (שקופיות 10–11). העברת הנשאים אל הממברנה, והשם GLUT4, אינם מופיעים בשקופיות."},{"id":"SEQ-004","topicId":"N03","title":"בניית שרשרת חלבון","steps":[{"id":"SEQ-004-s1","text":"נוכחות חומצות אמינו"},{"id":"SEQ-004-s2","text":"חיבור חומצות האמינו בקשרים פפטידיים לשרשרת: המבנה הראשוני"},{"id":"SEQ-004-s3","text":"קיפול המבנה הראשוני למבנה מרחבי (המבנה השלישוני)"},{"id":"SEQ-004-s4","text":"המבנה המרחבי מכתיב את תכונות החלבון, למשל פעילות אנזימטית"}],"correctOrder":["SEQ-004-s1","SEQ-004-s2","SEQ-004-s3","SEQ-004-s4"],"note":"חומצות אמינו (שקופית 18) מתחברות בקשרים פפטידיים לשרשרת, וזה המבנה הראשוני של החלבון (שקופית 19). קיפול המבנה הראשוני יוצר מבנה מרחבי, והוא שמכתיב את תכונות החלבון (שקופית 20).","sourceSlides":[18,19,20],"enrichment":null},{"id":"SEQ-005","topicId":"N04","title":"מעבר שומן מהמזון לרקמות","steps":[{"id":"SEQ-005-s1","text":"אכילת מזון שומני"},{"id":"SEQ-005-s2","text":"עיכול ופירוק במערכת העיכול"},{"id":"SEQ-005-s3","text":"יצירת מבני נשיאה כגון כילומיקרונים"},{"id":"SEQ-005-s4","text":"הובלת השומן להמשך הגוף"}],"correctOrder":["SEQ-005-s1","SEQ-005-s2","SEQ-005-s3","SEQ-005-s4"],"note":"לפי שקופית 23, השומן עובר פירוק במערכת העיכול, בעיקר לטריגליצרידים ולחומצות שומן חופשיות, נארז במבנים הנקראים כילומיקרונים ונספג דרך מערכת הלימפה, ומשם ממשיך לשאר הגוף.","sourceSlides":[23],"enrichment":null},{"id":"SEQ-006","topicId":"N05","title":"אומדן איבוד זיעה","steps":[{"id":"SEQ-006-s1","text":"שקילה לפני המאמץ"},{"id":"SEQ-006-s2","text":"תיעוד השתייה וההפרשות (שתן) במהלך המאמץ"},{"id":"SEQ-006-s3","text":"שקילה לאחר המאמץ"},{"id":"SEQ-006-s4","text":"חישוב הפרש משקל והתאמה לשתייה ולשתן"}],"correctOrder":["SEQ-006-s1","SEQ-006-s2","SEQ-006-s3","SEQ-006-s4"],"note":"לפי שקופית 40, שקילה לפני האימון ואחריו היא מדד לאובדן הנוזלים בזמן הפעילות. כדי לאמוד את הזיעה מוסיפים להפרש המשקל את השתייה ומפחיתים את השתן, ולכן מתעדים אותם במהלך האימון, לפני השקילה השנייה והחישוב.","sourceSlides":[40],"enrichment":"אומדן הזיעה (הפרש המשקל, ועוד השתייה, פחות השתן) הוא הרחבה של שקופית 40: השקופית מציינת רק ששקילה לפני האימון ואחריו היא מדד לאובדן הנוזלים ומאפשרת לחשב כמה לשתות."},{"id":"SEQ-007","topicId":"N06","title":"קריאטין בהקשר ATP–CP","steps":[{"id":"SEQ-007-s1","text":"אספקת קריאטין למאגרים לאורך זמן"},{"id":"SEQ-007-s2","text":"הגדלת זמינות פוספוקריאטין בשריר"},{"id":"SEQ-007-s3","text":"חידוש ATP מהיר במהלך פעילות עצימה"},{"id":"SEQ-007-s4","text":"יכולת לבצע מאמצים קצרים חוזרים"}],"correctOrder":["SEQ-007-s1","SEQ-007-s2","SEQ-007-s3","SEQ-007-s4"],"note":"לפי שקופיות 52–53, הגדלת מאגרי הקריאטין בשריר נמשכת כמה שבועות. היא מאריכה את השימוש במעגל האנרגיה הפוספוגני (ATP–CP), וכך משפרת מאמצים קצרים ועצימים ומזרזת את ההתאוששות ביניהם.","sourceSlides":[52,53],"enrichment":"השלבים ״הגדלת זמינות פוספוקריאטין״ ו״חידוש ATP מהיר״ מפרטים מנגנון שאינו כתוב במצגת; שקופיות 52–53 מציינות שהגדלת מאגרי הקריאטין מאריכה את השימוש במעגל האנרגיה הפוספוגני (ATP–CP)."},{"id":"SEQ-008","topicId":"N07","title":"מחסור ברזל והקשר לביצוע","steps":[{"id":"SEQ-008-s1","text":"מחסור משמעותי בברזל"},{"id":"SEQ-008-s2","text":"פגיעה אפשרית בייצור המוגלובין"},{"id":"SEQ-008-s3","text":"ירידה אפשרית ביכולת הובלת חמצן"},{"id":"SEQ-008-s4","text":"פגיעה אפשרית בסבולת אירובית"}],"correctOrder":["SEQ-008-s1","SEQ-008-s2","SEQ-008-s3","SEQ-008-s4"],"note":"לפי שקופית 65, חסר בברזל המוביל לאנמיה פוגע בעיקר במאמצים אירוביים, הדורשים שימוש בחמצן. השלבים שבאמצע מסבירים את הקשר דרך ההמוגלובין והובלת החמצן.","sourceSlides":[64,65],"enrichment":"הקשר בין ברזל להמוגלובין ולהובלת חמצן אינו כתוב בשקופיות; הוא מוסבר בשיעור 07."},{"id":"SEQ-009","topicId":"N08","title":"תכנון תזונה סביב אימון","steps":[{"id":"SEQ-009-s1","text":"ארוחה משמעותית מספר שעות לפני"},{"id":"SEQ-009-s2","text":"אם צריך נשנוש קטן סמוך לאימון"},{"id":"SEQ-009-s3","text":"תזונה ונוזלים במהלך מאמץ ארוך לפי הצורך"},{"id":"SEQ-009-s4","text":"התאוששות והשלמת מאגרים לאחר האימון"}],"correctOrder":["SEQ-009-s1","SEQ-009-s2","SEQ-009-s3","SEQ-009-s4"],"note":"הסדר לפי הזמן: ארוחה 3–4 שעות לפני האימון (שקופית 79), ארוחה קטנה 15–60 דקות לפני (שקופית 82), אכילה בזמן אימון במאמצים של מעל שעתיים (שקופית 88), וארוחה בסיום האימון לחידוש המאגרים (שקופית 89).","sourceSlides":[79,82,88,89],"enrichment":null},{"id":"SEQ-010","topicId":"N08","title":"חידוש מאגרים בין שני אימונים","steps":[{"id":"SEQ-010-s1","text":"סיום אימון ראשון"},{"id":"SEQ-010-s2","text":"הערכת הזמן עד האימון הבא"},{"id":"SEQ-010-s3","text":"תכנון השלמת פחמימות ונוזלים לפי צורך"},{"id":"SEQ-010-s4","text":"מעקב אחר נוחות ותפקוד באימון הבא"}],"correctOrder":["SEQ-010-s1","SEQ-010-s2","SEQ-010-s3","SEQ-010-s4"],"note":"לפי שקופיות 89–90, התזונה אחרי אימון תלויה בזמן עד האימון הבא: אם הוא בעוד פחות מ־8 שעות, מקפידים לאכול מיד בסיום האימון, 1–1.2 גרם פחמימות לק״ג לשעה ב־4 השעות הראשונות; אם יותר, תזונה רגילה. לכן קודם מעריכים את הזמן עד האימון הבא, ורק אז מתכננים.","sourceSlides":[89,90],"enrichment":"השלב האחרון, מעקב אחר הנוחות והתפקוד באימון הבא, הוא מיומנות יישומית ואינו כתוב בשקופיות. שקופית 90 מציינת 1–1.2 גרם לק״ג לשעה בלי לכתוב באיזה רכיב מדובר; הפירוש כפחמימות נשען על שקופית 89, שעוסקת בחידוש מאגרי הגליקוגן, ועל ההנחיה המקובלת."}],"calculations":[{"id":"CALC-001","topicId":"N01","title":"חלבון מחבילת מזון","inputs":[{"label":"גרם חלבון ל־100 גרם","value":8},{"label":"משקל מנה בגרם","value":250}],"formula":"8*250/100","correctValue":20,"unit":"גרם","workedSolution":"התווית מציגה 8 גרם חלבון ל־100 גרם. מנה של 250 גרם היא 2.5 יחידות של 100 גרם, ולכן 8 × 2.5 = 20 גרם חלבון.","warning":null,"sourceSlides":[5],"enrichment":"מיומנות קריאת תוויות: שקופית 5 מונה את רכיבי התווית, כולל הסימון התזונתי, אבל ההבחנה בין ערכים ל־100 גרם לבין ערכים למנה, והחישוב לפיהם, אינם כתובים בה."},{"id":"CALC-002","topicId":"N01","title":"פחמימות באריזה","inputs":[{"label":"גרם פחמימות ל־100 גרם","value":12},{"label":"משקל בגרם","value":200}],"formula":"12*200/100","correctValue":24,"unit":"גרם","workedSolution":"התווית מציגה 12 גרם פחמימות ל־100 גרם. 200 גרם הם 2 יחידות של 100 גרם, ולכן 12 × 2 = 24 גרם פחמימות.","warning":null,"sourceSlides":[5],"enrichment":"מיומנות קריאת תוויות: שקופית 5 מונה את רכיבי התווית, כולל הסימון התזונתי, אבל ההבחנה בין ערכים ל־100 גרם לבין ערכים למנה, והחישוב לפיהם, אינם כתובים בה."},{"id":"CALC-003","topicId":"N02","title":"אנרגיה מפחמימות","inputs":[{"label":"גרם פחמימה","value":50},{"label":"קק״ל לגרם","value":4}],"formula":"50*4","correctValue":200,"unit":"קק״ל","workedSolution":"כל גרם פחמימה מספק 4 קק״ל (שקופית 9), ולכן 50 × 4 = 200 קק״ל.","warning":null,"sourceSlides":[9],"enrichment":null},{"id":"CALC-004","topicId":"N02","title":"דוגמה לגרם לק״ג","inputs":[{"label":"גרם פחמימה לק״ג","value":5},{"label":"משקל גוף בק״ג","value":60}],"formula":"5*60","correctValue":300,"unit":"גרם","workedSolution":"5 גרם פחמימות לק״ג × 60 ק״ג = 300 גרם פחמימות ביום. המספר 5 ניתן בתרגיל כנתון מתוך הטבלה בשקופית 13.","warning":"תרגיל חישוב לימודי בלבד; לא המלצה אישית. לפי שקופית 13 אין צורך לזכור את מספרי הטבלה: זה תרגיל ביחידות.","sourceSlides":[13],"enrichment":null},{"id":"CALC-005","topicId":"N04","title":"אנרגיה משומן","inputs":[{"label":"גרם שומן","value":12},{"label":"קק״ל לגרם","value":9}],"formula":"12*9","correctValue":108,"unit":"קק״ל","workedSolution":"כל גרם שומן בתזונה מספק 9 קק״ל, ולכן 12 × 9 = 108 קק״ל.","warning":null,"sourceSlides":[24],"enrichment":null},{"id":"CALC-006","topicId":"N05","title":"אומדן איבוד זיעה בלי שתן","inputs":[{"label":"אובדן משקל בק״ג","value":0.6},{"label":"שתייה בליטרים","value":0.5}],"formula":"0.6+0.5","correctValue":1.1,"unit":"ליטר","workedSolution":"אומדן הזיעה = הפרש המשקל + השתייה, כשלא הייתה הפרשת שתן. מניחים שק״ג אחד של הפרש משקל שווה בקירוב לליטר אחד של נוזלים, ולכן 0.6 + 0.5 = 1.1 ליטר בקירוב.","warning":"תרגיל חישוב לימודי בלבד; לא המלצה אישית","sourceSlides":[40],"enrichment":"אומדן הזיעה (הפרש המשקל, ועוד השתייה, פחות השתן) הוא הרחבה של שקופית 40: השקופית מציינת רק ששקילה לפני האימון ואחריו היא מדד לאובדן הנוזלים ומאפשרת לחשב כמה לשתות. גם ההנחה שק״ג אחד של הפרש משקל שווה בקירוב לליטר נוזלים אינה כתובה במצגת."},{"id":"CALC-007","topicId":"N05","title":"אומדן אחוז איבוד משקל","inputs":[{"label":"הפרש משקל בק״ג","value":0.7},{"label":"משקל תחילה בק״ג","value":70}],"formula":"0.7/70*100","correctValue":1,"unit":"אחוז","workedSolution":"אחוז איבוד המשקל = הפרש המשקל ÷ המשקל ההתחלתי × 100 = 0.7 ÷ 70 × 100 = 1%. לפי שקופית 39, איבוד של עד 2% ממשקל הגוף אינו פוגע בביצועים.","warning":"תרגיל חישוב לימודי בלבד; לא המלצה אישית","sourceSlides":[39],"enrichment":null},{"id":"CALC-008","topicId":"N05","title":"פחמימות במשקה 6%","inputs":[{"label":"מיליליטרים משקה","value":500},{"label":"גרם ל־100 מ״ל","value":6}],"formula":"500/100*6","correctValue":30,"unit":"גרם","workedSolution":"500 מ״ל הם 5 יחידות של 100 מ״ל. בכל 100 מ״ל יש 6 גרם פחמימות, ולכן 5 × 6 = 30 גרם.","warning":"תרגיל חישוב לימודי בלבד; לא המלצה אישית","sourceSlides":[43],"enrichment":"ההמרה מאחוזים לגרמים ל־100 מ״ל אינה כתובה בשקופית 43; השקופית מציינת רק משקה ספורט המכיל 4–8% פחמימות."},{"id":"CALC-009","topicId":"N05","title":"פחמימות במשקה 8%","inputs":[{"label":"מיליליטרים משקה","value":750},{"label":"גרם ל־100 מ״ל","value":8}],"formula":"750/100*8","correctValue":60,"unit":"גרם","workedSolution":"750 מ״ל הם 7.5 יחידות של 100 מ״ל. בכל 100 מ״ל יש 8 גרם פחמימות, ולכן 7.5 × 8 = 60 גרם.","warning":"תרגיל חישוב לימודי בלבד; לא המלצה אישית","sourceSlides":[43],"enrichment":"ההמרה מאחוזים לגרמים ל־100 מ״ל אינה כתובה בשקופית 43; השקופית מציינת רק משקה ספורט המכיל 4–8% פחמימות."},{"id":"CALC-010","topicId":"N06","title":"חישוב תאורטי בקפאין","inputs":[{"label":"מ״ג לק״ג","value":3},{"label":"קילוגרם משקל גוף","value":70}],"formula":"3*70","correctValue":210,"unit":"מ״ג","workedSolution":"3 מ״ג לק״ג × 70 ק״ג = 210 מ״ג. לפי שקופית 49, המינון הארגוגני הוא 3–6 מ״ג לק״ג גוף. זה תרגיל ביחידות, לא המלצת נטילה.","warning":"תרגיל חישוב לימודי בלבד; לא המלצה אישית","sourceSlides":[49],"enrichment":null},{"id":"CALC-011","topicId":"N06","title":"תרגיל חלופי לקפאין","inputs":[{"label":"מ״ג לק״ג","value":4},{"label":"קילוגרם משקל גוף","value":60}],"formula":"4*60","correctValue":240,"unit":"מ״ג","workedSolution":"4 מ״ג לק״ג × 60 ק״ג = 240 מ״ג, בתוך הטווח של שקופית 49 (3–6 מ״ג לק״ג). זה תרגיל ביחידות, לא המלצת נטילה.","warning":"תרגיל חישוב לימודי בלבד; לא המלצה אישית","sourceSlides":[49],"enrichment":null},{"id":"CALC-012","topicId":"N08","title":"פחמימות בהתאוששות, כשהאימון הבא בעוד פחות מ־8 שעות","inputs":[{"label":"גרם לק״ג לשעה","value":1},{"label":"קילוגרם משקל","value":60}],"formula":"1*60","correctValue":60,"unit":"גרם לשעה","workedSolution":"לפי שקופית 90, כשהאימון הבא בעוד פחות מ־8 שעות, ההמלצה היא 1–1.2 גרם פחמימות לק״ג לשעה ב־4 השעות הראשונות. בתרגיל: 1 גרם לק״ג × 60 ק״ג = 60 גרם לשעה. כשהאימון הבא בעוד יותר מ־8 שעות, המצגת מציינת תזונה רגילה.","warning":"תרגיל חישוב לימודי בלבד; לא המלצה אישית","sourceSlides":[89,90],"enrichment":"שקופית 90 מציינת 1–1.2 גרם לק״ג לשעה בלי לכתוב באיזה רכיב מדובר; הפירוש כפחמימות נשען על שקופית 89, שעוסקת בחידוש מאגרי הגליקוגן, ועל ההנחיה המקובלת."}],"glossary":[{"id":"N01-GLOSS-01","topicId":"N01","term":"מאקרונוטריאנט","definition":"פחמימה, חלבון או שומן: רכיבי מזון שנצרכים בכמויות יחסית גדולות."},{"id":"N01-GLOSS-02","topicId":"N01","term":"מיקרונוטריאנט","definition":"ויטמין או מינרל הנדרש בכמות קטנה יחסית."},{"id":"N01-GLOSS-03","topicId":"N01","term":"תווית תזונתית","definition":"מידע כמותי על רכיבי המזון, בדרך כלל ביחס למנה או ל־100 גרם."},{"id":"N01-GLOSS-04","topicId X-01","topicId":"N05","lesson":"N05","section":4,"diagram":"11-dehydration-levels","title":"אובדן נוזלים: מהקל אל החמור","prompt":"סדרי את ההשפעות מאובדן הנוזלים הקטן ביותר אל הגדול ביותר.","steps":[{"id":"VX-01-s1","text":"אין פגיעה בביצועים ובתפקוד"},{"id":"VX-01-s2","text":"פגיעה בביצוע האירובי ובתפקוד הקוגניטיבי"},{"id":"VX-01-s3","text":"פגיעה גם ביכולת האנאירובית ובכוח השרירים"},{"id":"VX-01-s4","text":"ירידה בקצב ההזעה, עליית חום הגוף וסיכון לנזקי חום"}],"explanation":"לפי שקופית 39: עד 2% ממשקל הגוף אין פגיעה; 2–4% פוגעים בביצוע האירובי ובתפקוד הקוגניטיבי; 4–6% פוגעים גם ביכולת האנאירובית ובכוח; מעל 6% יורד קצב ההזעה, עולה חום הגוף וגדל הסיכון לנזקי חום.","slides":[39],"sourceSlides":[39],"correctOrder":["VX-01-s1","VX-01-s2","VX-01-s3","VX-01-s4"]},{"id":"VX-02","topicId":"N05","lesson":"N05","section":3,"diagram":"12-sodium-hyponatremia","title":"היפונתרמיה משתייה מרובה","prompt":"סדרי את השלבים מהסיבה ועד המצב החמור ביותר.","steps":[{"id":"VX-02-s1","text":"שתיית מים מרובה מדי במאמץ שנמשך פחות מ־4 שעות"},{"id":"VX-02-s2","text":"ירידה בריכוז הנתרן בדם"},{"id":"VX-02-s3","text":"תסמינים קלים: הקאות, כיווצי שרירים וסחרחורת"},{"id":"VX-02-s4","text":"מצבים מתקדמים: כאבי ראש, בלבול, פרכוסים ואובדן הכרה"}],"explanation":"לפי שקופיות 35–36: במאמצים של פחות מ־4 שעות היפונתרמיה נובעת בדרך כלל משתייה מרובה, שמורידה את ריכוז הנתרן בדם. המצגת מחלקת את התסמינים למצבים קלים (הקאות, כיווצי שרירים, סחרחורת, תשישות) ולמצבים מתקדמים (כאבי ראש, נפיחות בכפות הידיים והרגליים, בלבול, פרכוסים, אובדן הכרה).","slides":[35,36],"sourceSlides":[35,36],"correctOrder":["VX-02-s1","VX-02-s2","VX-02-s3","VX-02-s4"]},{"id":"VX-03","topicId":"N06","lesson":"N06","section":3,"diagram":"13-creatine-atp-pc","title":"איך קריאטין דוחה עייפות","prompt":"סדרי את שרשרת ההשפעה של תוסף קריאטין, לפי שקופית 53.","steps":[{"id":"VX-03-s1","text":"נטילת קריאטין לאורך כמה שבועות"},{"id":"VX-03-s2","text":"הגדלת מאגרי הקריאטין בשריר"},{"id":"VX-03-s3","text":"הארכת השימוש במעגל האנרגיה הפוספוגני"},{"id":"VX-03-s4","text":"דחיית השימוש במסלול האנאירובי־לקטי"},{"id":"VX-03-s5","text":"דחייה ביצירת חומצת חלב ודחיית עייפות"}],"explanation":"לפי שקופית 53, הגדלת מאגרי הקריאטין בשריר היא תהליך של כמה שבועות. בראש ובראשונה היא מאריכה את השימוש במעגל האנרגיה הפוספוגני, וכתוצאה מכך נדחים השימוש במסלול האנאירובי־לקטי, יצירת חומצת החלב והעייפות.","slides":[53],"sourceSlides":[53],"correctOrder":["VX-03-s1","VX-03-s2","VX-03-s3","VX-03-s4","VX-03-s5"]},{"id":"VX-04","topicId":"N06","lesson":"N06","section":4,"diagram":"14-carnosine-buffering","title":"ההיגיון של סותרי החומצה","prompt":"סדרי את השרשרת שסותרי החומצה מנסים לעצור, לפי שקופית 55.","steps":[{"id":"VX-04-s1","text":"הפקת אנרגיה במסלול הגליקוליזה"},{"id":"VX-04-s2","text":"יצירה והצטברות של חומצת חלב"},{"id":"VX-04-s3","text":"עלייה בחומציות בשריר ובדם"},{"id":"VX-04-s4","text":"ירידה ביכולת השריר להפיק כוח"},{"id":"VX-04-s5","text":"ירידה בקצב הפעילות והתעייפות"}],"explanation":"לפי שקופית 55: הגליקוליזה יוצרת חומצת חלב; הצטברותה מעלה את החומציות בשריר ובדם, ויכולת השריר להפיק כוח יורדת עד להתעייפות. סותרי החומצה קושרים יוני מימן חופשיים ומפחיתים את החומציות, וכך מאפשרים המשך תפקוד.","enrichment":"זה המודל הלימודי של המצגת. פיזיולוגיית העייפות מורכבת יותר, ואין לייחס לחומצת החלב לבדה את כל העייפות (הערת דיוק 4).","slides":[55],"sourceSlides":[55],"correctOrder":["VX-04-s1","VX-04-s2","VX-04-s3","VX-04-s4","VX-04-s5"]}],"lessonAdditions":[{"id":"N01-A01","section":1,"kind":"compare","title":"מאקרו לעומת מיקרו: כמות, תפקיד וקלוריות","slides":[3,61],"basis":"deck","table":{"head":["מאפיין","מאקרונוטריאנטים","מיקרונוטריאנטים"],"rows":[["מי הם?","פחמימות, שומנים וחלבונים","ויטמינים ומינרלים"],["תפקיד לפי המצגת","מספקים לגוף חומרי בניין ואנרגיה","מאפשרים את שחרור האנרגיה וניצולה"],["כמות נדרשת","כמויות גדולות יחסית","כמויות קטנות: מ״ג או מק״ג"],["קלוריות","כן, הם מקור האנרגיה במזון","אינם מכילים קלוריות"]]},"topicId":"N01"},{"id":"N01-A02","section":1,"kind":"check","title":"בדיקת הבנה: ויטמינים ואנרגיה","slides":[3,61],"basis":"deck","question":"ויטמינים קשורים למשק האנרגיה בגוף. למה בכל זאת לא נכון לומר שתוסף ויטמינים ״נותן אנרגיה״?","options":["כי ויטמינים אינם מכילים קלוריות; הם מאפשרים לגוף לשחרר ולנצל אנרגיה שמגיעה מהמאקרונוטריאנטים","כי ויטמינים נותנים אנרגיה רק אחרי שהם נאגרים בכבד בצורת גליקוגן","כי ויטמינים הם חומרי בניין בלבד ואין להם שום קשר לאנרגיה","כי הם נדרשים בכמות קטנה, אבל כל מיליגרם שלהם מספק יותר קלוריות מגרם פחמימה"],"correctIndex":0,"explanation":"לפי שקופית 61 מיקרונוטריאנטים אינם מכילים קלוריות, ולפי שקופית 3 תפקידם לאפשר את שחרור האנרגיה וניצולה, כך שהם משתתפים במשק האנרגיה בלי להיות הדלק עצמו. התשובה ״חומרי בניין בלבד״ מפתה, אבל היא מנתקת אותם לגמרי מהאנרגיה, בניגוד לשקופית 3.","topicId":"N01"},{"id":"N01-A03","section":2,"kind":"misconception","title":"הפירמידה היא לא תפריט אחיד לכולם","slides":[4,13],"basis":"deck","body":"**התפיסה השגויה:** ״הפירמידה היא תפריט מדויק, זהה לכל אדם ולכל מדינה.״\n\n**למה זה לא נכון:** שקופית 4 מתארת את הפירמידה ואת הקשת כצורה גרפית שנועדה להעביר מסר של תזונה נבונה ולסייע בבחירת תזונה מאוזנת ומגוונת מכל קבוצות המזון. היא גם מציינת ש״כל מדינה והפירמידה שלה״. כלומר זה כלי הדרכה, לא נוסחה.\n\n**הניסוח הנכון:** הפירמידה והקשת מכוונות לגיוון ולאיזון בין קבוצות המזון. ההתאמה לאדם מסוים, למשל לשחיינית שמתאמנת פעמיים ביום, נעשית לפי הצרכים שלה, כמו שרואים בהמשך הקורס בהמלצות הפחמימות לפי עומס אימונים.","topicId":"N01"},{"id":"N01-A04","section":3,"kind":"worked","title":"מ־100 גרם למה שאוכלים בפועל: חטיף אנרגיה","slides":[5,9,24],"basis":"beyond","beyondNote":"השקופית מונה את רכיבי התווית בלבד; הצגת הערכים ל־100 גרם היא הנוהג המקובל בסימון תזונתי, והמספרים של החטיף הם דוגמה להמחשה.","body":"נתון (דוגמה להמחשה): בתווית של חטיף אנרגיה כתוב ל־100 גרם: 60 גרם פחמימות ו־15 גרם שומן. החטיף שוקל 40 גרם.\nשלב 1, יחס החטיף ל־100 גרם: 40 גרם ÷ 100 גרם = 0.4\nשלב 2, פחמימות בחטיף: 60 גרם × 0.4 = 24 גרם פחמימות\nשלב 3, שומן בחטיף: 15 גרם × 0.4 = 6 גרם שומן\nשלב 4, אנרגיה מפחמימות (4 קק״ל לגרם, שקופית 9): 24 גרם × 4 קק״ל/גרם = 96 קק״ל\nשלב 5, אנרגיה משומן (9 קק״ל לגרם שומן בתזונה, שקופית 24): 6 גרם × 9 קק״ל/גרם = 54 קק״ל\nשלב 6, סכום: 96 קק״ל + 54 קק״ל = 150 קק״ל\n**תוצאה:** בחטיף יש 24 גרם פחמימות, 6 גרם שומן וכ־150 קק״ל מפחמימות ומשומן (החלבון לא נכלל בדוגמה).\n\nשימי לב: הטעות הנפוצה היא לחשוב שבחטיף יש 60 גרם פחמימות. 60 גרם הם ב־100 גרם מוצר, והחטיף שוקל רק 40 גרם.","topicId":"N01"},{"id":"N01-A05","section":3,"kind":"worked","title":"השוואה הוגנת: מנה מול 100 גרם","slides":[5],"basis":"beyond","beyondNote":"השקופית מונה את רכיבי התווית בלבד; הצגת ערכים למנה או ל־100 גרם היא נוהג מקובל בסימון, והמספרים כאן הם דוגמה להמחשה.","body":"נתון (דוגמה להמחשה): דגני בוקר א׳: 18 גרם פחמימות למנה של 30 גרם. דגני בוקר ב׳: 55 גרם פחמימות ל־100 גרם.\nשלב 1, פחמימות בכל גרם של א׳: 18 גרם ÷ 30 גרם = 0.6 גרם פחמימות לגרם מוצר\nשלב 2, המרה של א׳ ל־100 גרם: 0.6 × 100 גרם = 60 גרם פחמימות ל־100 גרם\nשלב 3, השוואה באותה יחידה: א׳ = 60 גרם ל־100 גרם, ב׳ = 55 גרם ל־100 גרם\n**תוצאה:** מוצר א׳ מרוכז יותר בפחמימות, אף שהמספר על האריזה שלו (18) נראה קטן בהרבה מ־55.\n\nהכלל: משווים ריכוז רק אחרי שהבאנו את שני המוצרים לאותה יחידה.","topicId":"N01"},{"id":"N01-A06","section":4,"kind":"compare","title":"תוסף מזון מול תוסף תזונה: חמש שאלות","slides":[6,7],"basis":"deck","table":{"head":["שאלה","תוסף מזון","תוסף תזונה"],"rows":[["למה מוסיפים אותו?","להשגת מטרה טכנולוגית במוצר המזון","לא למטרה טכנולוגית: להשלמת חסרים תזונתיים או למטרות אחרות, כמו שיפור ביצועים בספורט"],["האם צורכים אותו לבד?","לא, אינו מיועד לצריכה כשלעצמו","כן, אפשר לצרוך אותו גם כשלעצמו"],["דוגמאות מהמצגת","חומר משמר, צבע מאכל, אבקת אפייה","ויטמינים ומינרלים"],["את מי הוא משרת?","את המוצר: בטיחות, עיכוב קלקול, איכות, מגוון וזמינות","את האדם שצורך אותו"],["שאלת המפתח לסיווג","מה הוא עושה למזון?","מה הוא אמור לתת לגוף?"]]},"topicId":"N01"},{"id":"N01-A07","section":4,"kind":"misconception","title":"״תוסף תזונה זה רק כדור״","slides":[7],"basis":"deck","body":"**התפיסה השגויה:** ״תוסף תזונה הוא רק כדור או קפסולה, וכל מה שמוסיפים למזון במפעל הוא תוסף מזון.״\n\n**למה זה לא נכון:** לפי שקופית 7, תוסף תזונה הוא רכיב **המוסף למזון** שלא לצורך מטרה טכנולוגית, ושאפשר לצרוך אותו **גם** כשלעצמו. כלומר ויטמין או מינרל יכולים להופיע בתוך מוצר מזון ועדיין להיחשב תוסף תזונה. מה שקובע הוא המטרה, לא הצורה ולא השלב שבו הוסף.\n\n**הניסוח הנכון:** מסווגים לפי השאלה ״למה הוסף?״. מטרה טכנולוגית במוצר: תוסף מזון. השלמה תזונתית או מטרה אחרת עבור הגוף: תוסף תזונה.","topicId":"N01"},{"id":"N01-A08","section":5,"kind":"check","title":"בדיקת הבנה: ברזל ואבקת אפייה","slides":[6,7],"basis":"deck","question":"למאפה דגנים הוסיפו במפעל ברזל כדי להעשיר אותו, ואבקת אפייה כדי שיתפח. איזה משפט מסווג נכון את השניים?","options":["שניהם תוספי מזון, כי שניהם הוכנסו בתהליך הייצור","אבקת האפייה היא תוסף מזון (מטרה טכנולוגית), והברזל הוא תוסף תזונה (השלמה תזונתית)","שניהם תוספי תזונה, כי שניהם נאכלים יחד עם המזון","הברזל הוא תוסף מזון כי הוא מינרל, ואבקת האפייה היא תוסף תזונה כי היא משפרת את המוצר"],"correctIndex":1,"explanation":"אבקת האפייה משנה את המוצר עצמו, וזו מטרה טכנולוגית (שקופית 7), ואילו הברזל נוסף כדי להשלים רכיב תזונתי לגוף, ולכן הוא תוסף תזונה. התשובה ״שניהם הוכנסו בייצור״ מפתה, אבל שלב ההוספה אינו קובע את הסיווג; המטרה קובעת.","topicId":"N01"},{"id":"N02-A01","section":1,"kind":"worked","title":"כמה אנרגיה המוח מקבל מגלוקוז?","slides":[9,13],"basis":"deck","body":"נתונים (שקופית 9): המוח זקוק לכ־130 גרם גלוקוז ביום, ולכל גרם פחמימה ערך אנרגטי של 4 קק״ל.\nחישוב: 130 גרם × 4 קק״ל/גרם = 520 קק״ל ביום\n**תוצאה:** כ־520 קק״ל ביום מגלוקוז משמשות לתפקוד המוח.\n\n**מה החישוב מלמד:** זו דרישה של רקמה אחת, לא המלצת פחמימות יומית לספורטאית. כמות הפחמימות בתפריט נקבעת לפי עצימות, משך ותדירות האימונים (שקופית 13).","topicId":"N02"},{"id":"N02-A02","section":2,"kind":"steps","title":"מסלול האינסולין: מארוחה לגלוקוז בתוך השריר","slides":[10],"basis":"beyond","beyondNote":"המצגת אומרת שאינסולין מעלה את רמות נשאי הגלוקוז בתא השריר; שם הנשא GLUT4, הקולטן ותנועת הנשאים משלפוחיות בתוך התא אל הממברנה הם פירוט ממספרי הלימוד.","steps":["אחרי ארוחה עם פחמימות, גלוקוז נספג לדם ורמתו בדם עולה.","הלבלב מגיב בהפרשת אינסולין לדם.","אינסולין נקשר לקולטן על פני תא השריר ומפעיל שרשרת איתות בתוך התא.","נשאי GLUT4, שממתינים בשלפוחיות בתוך התא, עוברים אל ממברנת התא ומשתלבים בה.","יותר נשאים בממברנה: כניסת הגלוקוז לתא מואצת ורמת הסוכר בדם יורדת (שקופית 10).","בתוך התא הגלוקוז משמש להפקת אנרגיה או נאגר כגליקוגן."],"topicId":"N02"},{"id":"N02-A03","section":2,"kind":"steps","title":"מסלול הכיווץ: קליטת גלוקוז בלי תלות באינסולין","slides":[10,11],"basis":"beyond","beyondNote":"המצגת קובעת שפעילות גופנית מעלה את נשאי הגלוקוז בשריר בלי תלות באינסולין; האותות שמפעילים זאת (סידן ושינוי במאזן האנרגיה בתא) הם תוספת ממספרי הלימוד.","steps":["השריר מתכווץ בזמן ריצה, חתירה או שחייה.","הכיווץ משחרר סידן בתוך תא השריר, ובמקביל ATP מתפרק מהר והמאזן האנרגטי בתא משתנה.","שינויים אלה מפעילים מסלול איתות שאינו עובר דרך קולטן האינסולין.","נשאי GLUT4 עוברים לממברנה, גם כשרמת האינסולין בדם אינה גבוהה.","גלוקוז נכנס לשריר הפעיל ומשמש מיד כדלק לכיווץ.","השורה למבחן: פעילות גופנית מעלה את נשאי הגלוקוז בשריר באופן שאינו תלוי באינסולין (שקופית 11)."],"topicId":"N02"},{"id":"N02-A04","section":3,"kind":"compare","title":"גליקוגן בשריר מול גליקוגן בכבד","slides":[9,12],"basis":"deck","table":{"head":["מאפיין","גליקוגן בשריר","גליקוגן בכבד"],"rows":[["כמות ממוצעת","כ־400 גרם","כ־100 גרם"],["מי משתמש בו?","השריר עצמו בלבד","רקמות הגוף, דרך הדם"],["האם יוצא לדם כגלוקוז?","לא","כן, מתפרק לגלוקוז שיוצא לדם"],["התרומה במאמץ","דלק ישיר לשריר שעובד","שמירה על אספקת גלוקוז בדם לרקמות, כולל המוח"]]},"topicId":"N02"},{"id":"N02-A05","section":3,"kind":"misconception","title":"״שרירים מלאים בגליקוגן יזינו את המוח״","slides":[12],"basis":"beyond","beyondNote":"ההסבר האנזימטי (היעדר האנזים גלוקוז־6־פוספטאז בשריר) אינו מופיע במצגת; הוא מסביר מדוע גליקוגן השריר הוא ״לשימוש השריר בלבד״.","body":"**התפיסה השגויה:** ״כששרירי הרגליים מלאים בגליקוגן, הם יכולים לשחרר גלוקוז לדם ולהזין את המוח.״\n\n**למה זה לא נכון:** לפי שקופית 12, גליקוגן בשריר הוא לשימוש השריר בלבד. רק גליקוגן הכבד מתפרק לגלוקוז שיוצא לדם. ההסבר הביוכימי: בכבד יש אנזים (גלוקוז־6־פוספטאז) שמאפשר לשחרר גלוקוז חופשי לדם. בשריר אין אותו, ולכן הגלוקוז מגליקוגן השריר נשאר בתא ומשמש לכיווץ.\n\n**הניסוח הנכון:** גליקוגן השריר מזין את השריר עצמו. גליקוגן הכבד שומר על הגלוקוז בדם עבור שאר הרקמות.","topicId":"N02"},{"id":"N02-A06","section":3,"kind":"worked","title":"כמה אנרגיה אגורה בגליקוגן?","slides":[9,12],"basis":"deck","body":"נתונים (שקופיות 9 ו־12): כ־400 גרם גליקוגן בשריר, כ־100 גרם בכבד, 4 קק״ל לכל גרם פחמימה.\nשלב 1, סך הגליקוגן: 400 גרם + 100 גרם = 500 גרם\nשלב 2, אנרגיה בשריר: 400 גרם × 4 קק״ל/גרם = 1,600 קק״ל\nשלב 3, אנרגיה בכבד: 100 גרם × 4 קק״ל/גרם = 400 קק״ל\nשלב 4, סך הכול: 1,600 קק״ל + 400 קק״ל = 2,000 קק״ל\nשלב 5, החלק שבשריר: 1,600 קק״ל ÷ 2,000 קק״ל = 0.8, כלומר 80%\n**תוצאה:** כ־2,000 קק״ל אגורות כגליקוגן, ו־80% מהן נמצאות בשריר.\n\n**המשמעות:** רוב המאגר מקומי לשריר. המצגת מעריכה שבמאמץ מתמשך המאגר מספיק לכשעתיים; זה אומדן כללי, והזמן בפועל תלוי בעצימות ובאדם.","topicId":"N02"},{"id":"N02-A07","section":4,"kind":"worked","title":"מה זה ״גרם לק״ג״? אותה ספורטאית, עומסים שונים","slides":[13],"basis":"deck","body":"שקופית 13 אומרת שאין צורך לזכור את המספרים. התרגיל נועד להבין את היחידה ״גרם פחמימה לק״ג משקל גוף״.\nנתון: ספורטאית במשקל 60 ק״ג (דוגמה להמחשה).\nשלב 1, מתאמנת לשיפור הכושר (3–5 גרם/ק״ג): 3 גרם/ק״ג × 60 ק״ג = 180 גרם; 5 גרם/ק״ג × 60 ק״ג = 300 גרם ליום\nשלב 2, ספורטאית בימים בעצימות בינונית־גבוהה (7–12 גרם/ק״ג): 7 גרם/ק״ג × 60 ק״ג = 420 גרם; 12 גרם/ק״ג × 60 ק״ג = 720 גרם ליום\nשלב 3, 24–72 שעות לפני מירוץ (10 גרם/ק״ג): 10 גרם/ק״ג × 60 ק״ג = 600 גרם ליום\n**תוצאה:** לאותה ספורטאית הכמות היומית נעה בין 180 ל־720 גרם, לפי עומס האימונים.\n\n**מה לזכור:** את הכיוון. יותר עצימות, משך ותדירות: יותר פחמימות. זה חישוב לימודי, לא המלצה אישית.","topicId":"N02"},{"id":"N02-A08","section":4,"kind":"check","title":"בדיקת הבנה: עומס עולה","slides":[13],"basis":"deck","question":"רוכבת עוברת משעת אימון קלה ביום לשלוש שעות ביום בעצימות בינונית־גבוהה. מה העיקרון של שקופית 13 לגבי צריכת הפחמימות שלה?","options":["הצריכה היומית בגרם לק״ג צפויה לעלות, כי ההמלצה נשענת על עצימות, משך ותדירות האימונים","הצריכה נשארת 130 גרם ביום, כי זו כמות הגלוקוז שהמוח צריך","הצריכה צריכה לרדת, כי באימון ארוך הגוף משתמש בשומן ולא בפחמימות","אין קשר בין עומס האימונים לבין כמות הפחמימות; רק משקל הגוף קובע"],"correctIndex":0,"explanation":"שקופית 13 קובעת שההמלצה מסתמכת על עצימות האימון, משכו ותדירותו, ולכן עלייה בכל אלה מעלה את הצורך בפחמימות. האפשרות של 130 גרם מפתה, אבל זו דרישת המוח לגלוקוז (שקופית 9) ולא המלצה שמשתנה לפי אימון.","topicId":"N02"},{"id":"N02-A09","section":5,"kind":"steps","title":"העמסת פחמימות: ההיגיון מההחלטה ועד המחיר","slides":[12,14,15],"basis":"deck","steps":["שאלת פתיחה: האם המאמץ הצפוי ארוך וקשה, כזה שצפוי לרוקן את מאגרי הגליקוגן? אם לא, ההעמסה לא מומלצת (שקופית 15).","במאמץ מתמשך, מאגר הגליקוגן הרגיל (כ־500 גרם) מספיק לפי המצגת לכשעתיים (שקופית 12).","בימים שלפני התחרות מבצעים אחת מגישות ההעמסה (שקופית 14).","מאגרי הגליקוגן גדלים, עד כ־700 גרם.","יש יותר דלק זמין לשרירים, והעייפות נדחית.","המחיר: עם הגליקוגן נאגרים גם מים, ולכן המשקל עולה ועלולה להופיע תחושת כבדות (שקופית 15)."],"topicId":"N02"},{"id":"N02-A10","section":5,"kind":"misconception","title":"״אחרי ההעמסה עליתי קילו, כלומר השמנתי״","slides":[12,14,15],"basis":"beyond","beyondNote":"היחס של כ־3 גרם מים לכל גרם גליקוגן הוא ערך מקובל בספרות ואינו מופיע במצגת.","body":"**התפיסה השגויה:** ״אחרי העמסת פחמימות המשקל עלה, כלומר הוספתי שומן.״\n\n**למה זה לא נכון:** לפי שקופית 15, אגירת גליקוגן מביאה גם לאגירת מים. בספרות מקובל שכל גרם גליקוגן נאגר עם כ־3 גרם מים. אם המאגר עולה מכ־500 לכ־700 גרם (שקופיות 12 ו־14), נוספים 200 גרם גליקוגן, ואיתם כ־200 גרם × 3 = 600 גרם מים. יחד: 200 גרם + 600 גרם = כ־800 גרם, קרוב לקילו, בלי תוספת שומן.\n\n**הניסוח הנכון:** העלייה במשקל היא בעיקר גליקוגן ומים. לפני מאמץ ארוך זה מחיר סביר תמורת דלק נוסף. לפני מאמץ שלא צפוי לרוקן את המאגרים זה רק משקל עודף ותחושת כבדות, ולכן ההעמסה לא מומלצת שם.","topicId":"N02"},{"id":"N02-A11","section":6,"kind":"misconception","title":"״סיבים בריאים, אז כמה שיותר ובכל ארוחה״","slides":[16],"basis":"deck","body":"**התפיסה השגויה:** ״סיבים בריאים, אז כדאי לאכול מהם כמה שיותר, גם רגע לפני אימון.״\n\n**למה זה לא נכון:** שקופית 16 מונה יתרונות אמיתיים: האטת ריקון הקיבה ושובע ארוך, ספיחת מים ותנועתיות מעי, ובלימת עליית הסוכר והאינסולין אחרי ארוחה. אבל היא גם מזהירה שכמויות גדולות מדי עלולות להפריע לספיגת מינרלים וויטמינים ולגרום לאי־נוחות קשה במערכת העיכול ואף לחסימת מעיים. ומכיוון שסיבים שוהים זמן רב בקיבה, מומלץ לצמצם אותם בארוחה שלפני האימון.\n\n**הניסוח הנכון:** סיבים חשובים בתפריט השגרתי, במידה. בארוחה שלפני אימון מצמצמים אותם; זו שאלה של עיתוי, לא של ״בריא או לא בריא״.","topicId":"N02"},{"id":"N02-A12","section":7,"kind":"check","title":"בדיקת הבנה: מרתוניסטית בדקה ה־90","slides":[10,11,12],"basis":"deck","question":"מרתוניסטית רצה כבר 90 דקות, ושרירי הרגליים שלה ממשיכים לקלוט גלוקוז מהדם גם כשרמת האינסולין שלה אינה גבוהה. איזה הסבר מתאים למצגת?","options":["הגלוקוז בדם מגיע מגליקוגן השריר, והקליטה מתאפשרת רק בזכות אינסולין","הגלוקוז בדם מגיע מגליקוגן הכבד, והכיווץ עצמו מעלה את נשאי הגלוקוז בשריר בלי תלות באינסולין","הגלוקוז בדם מגיע מגליקוגן הכבד, אבל בלי אינסולין השריר לא יכול לקלוט אותו ולכן הוא לא קולט גלוקוז","הגלוקוז בדם מגיע מהסיבים התזונתיים שבארוחה האחרונה, שמגבירים את הפרשת האינסולין"],"correctIndex":1,"explanation":"לפי שקופית 12 רק גליקוגן הכבד מתפרק לגלוקוז שיוצא לדם, ולפי שקופית 11 פעילות גופנית מעלה את נשאי הגלוקוז בשריר בלי תלות באינסולין. האפשרות הראשונה מפתה, אבל גליקוגן השריר אינו יוצא לדם, והקליטה במאמץ אינה תלויה באינסולין.","topicId":"N02"},{"id":"N03-A01","section":1,"kind":"compare","title":"מפת מושגים: מחומצת אמינו עד חלבון פעיל","slides":[18,19,20],"basis":"deck","table":{"head":["מושג","מה זה","מה חשוב לזכור לפי המצגת"],"rows":[["חומצת אמינו","יחידת הבנייה של החלבון","20 חומצות אמינו שהגוף מכיר; הן נבדלות זו מזו בקבוצה הפונקציונלית (השייר)"],["קשר פפטידי","הקשר שמחבר חומצת אמינו לשכנתה","בעזרתו נוצרות שרשראות של חומצות אמינו"],["פפטיד / מבנה ראשוני","השרשרת עצמה: רצף חומצות האמינו","לכל חלבון רצף ייחודי וקבוע, והוא אחד הקובעים את תכונותיו"],["מבנה שלישוני","השרשרת מקופלת למבנה מרחבי ספציפי","המבנה המרחבי מכתיב את תכונות החלבון, למשל פעילות אנזימטית"]]},"topicId":"N03"},{"id":"N03-A02","section":2,"kind":"compare","title":"מבנה חומצת אמינו: חיונית מול לא חיונית","slides":[18],"basis":"deck","table":{"head":["","חומצת אמינו חיונית","חומצת אמינו לא חיונית"],"rows":[["השלד","חומצה קרבוקסילית וקבוצת אמינו המחוברות לפחמן אלפא","אותו שלד בדיוק"],["מה מבדיל בין חומצות האמינו","השייר (הקבוצה הפונקציונלית)","השייר (הקבוצה הפונקציונלית)"],["סינתזה בגוף","אין בגוף מסלולים ביוכימיים לייצר אותה","הגוף מייצר אותה בתהליך טראנסאמינציה, בהתבסס על שלד פחמני וחנקן מחומצות אמינו חיוניות"],["האם אפשר להשמיט מהתזונה","לא, חייבים לקבל אותה מהמזון","כן, הגוף יכול להשלים אותה בעצמו"],["האם הגוף צריך אותה","כן","כן, ״לא חיונית״ מתאר את המקור, לא את החשיבות"]]},"topicId":"N03"},{"id":"N03-A03","section":2,"kind":"steps","title":"מה קורה לחומצת אמינו שלא נבנה ממנה חלבון","slides":[18],"basis":"deck","steps":["חומצת אמינו שאינה מנוצלת לבניית חלבון מגיעה לפירוק, בעיקר בכבד.","דה־אמינציה: קבוצת האמינו (החלק שמכיל חנקן) מופרדת מהמולקולה.","נשאר שלד פחמני ללא חנקן.","השלד משמש ליצירת אנרגיה דרך מעגל קרבס, או הופך לפחמימה או לשומן.","החנקן מסולק מהגוף: הוא מופרש בשתן בצורת אוריאה."],"topicId":"N03"},{"id":"N03-A04","section":3,"kind":"steps","title":"משרשרת לחלבון פעיל","slides":[19,20],"basis":"beyond","beyondNote":"המצגת מזכירה רק מבנה ראשוני ושלישוני; שחרור מולקולת מים ביצירת הקשר הפפטידי, וכן המבנה השניוני והרביעוני, הם תוספת מספרי הלימוד.","steps":["שתי חומצות אמינו מתחברות בקשר פפטידי. בספרי הלימוד מוסבר שבתהליך משתחררת מולקולת מים.","חיבורים חוזרים יוצרים שרשרת, פפטיד. סדר חומצות האמינו בשרשרת הוא **המבנה הראשוני**.","בספרי הלימוד מתוארים גם קיפולים מקומיים קבועים (סלילים ומשטחים), הנקראים מבנה שניוני. המצגת אינה עוסקת בהם.","השרשרת כולה מתקפלת למבנה מרחבי ספציפי: **המבנה השלישוני**. אופן הקיפול נקבע מהרצף.","בחלק מהחלבונים מתחברות כמה שרשראות יחד (מבנה רביעוני, גם הוא מעבר למצגת).","המבנה המרחבי מכתיב את התפקוד, למשל פעילות אנזימטית. למבחן: רצף = מבנה ראשוני, קיפול מרחבי = מבנה שלישוני."],"topicId":"N03"},{"id":"N03-A05","section":3,"kind":"check","title":"בדיקת הבנה: שינוי ברצף","slides":[19,20],"basis":"deck","question":"במעבדה החליפו חומצת אמינו אחת ברצף של אנזים. מספר חומצות האמינו לא השתנה, אך האנזים הפסיק לפעול. מה ההסבר הסביר ביותר?","options":["הקשרים הפפטידיים נעלמו, ולכן אין עוד שרשרת","פעילות אנזים תלויה רק במספר חומצות האמינו, ולכן השינוי מקרי","שינוי המבנה הראשוני עלול לשנות את הקיפול המרחבי, והמבנה המרחבי מכתיב את הפעילות האנזימטית","האנזים איבד את ערכו התזונתי, ולכן אינו פועל"],"correctIndex":2,"explanation":"לפי שקופיות 19–20 הרצף הייחודי קובע את תכונות החלבון, והמבנה השלישוני נוצר מקיפול הרצף ומכתיב את הפעילות האנזימטית, ולכן שינוי ברצף יכול לשבש את הפעילות. התשובה על ״ערך תזונתי״ מבלבלת בין תפקוד החלבון בגוף לבין ערכו כמזון, ואלה שני דברים נפרדים.","topicId":"N03"},{"id":"N03-A06","section":4,"kind":"misconception","title":"״ביצה מבושלת או חלבון שהתחמם כבר לא שווים כלום״","slides":[20],"basis":"deck","body":"**האמונה השגויה:** כשמבשלים ביצה, מקציפים חלבון או מחממים שייק חלבון, החלבון ״נהרס״ ומאבד את ערכו התזונתי.\n\n**למה זה לא נכון:** דנטורציה הורסת את המבנה המרחבי בלבד. שרשרת חומצות האמינו, המבנה הראשוני, אינה משתנה, ולכן לפי שקופית 20 גם הערך התזונתי אינו משתנה.\n\n**הניסוח הנכון:** דנטורציה עלולה לפגוע בתפקוד של חלבון (למשל אנזים), אך המבנה הראשוני וגם הערך התזונתי אינם משתנים. לפעמים היא אף הפיכה: כשהטמפרטורה יורדת, החלבון יכול לחזור למבנהו ולתפקד.","topicId":"N03"},{"id":"N03-A07","section":5,"kind":"example","title":"שני מקורות, אותה כמות חלבון","slides":[21],"basis":"beyond","beyondNote":"הרעיון שחומצת האמינו החיונית החסרה ביותר (״חומצת אמינו מגבילה״) קובעת את הציון, ושצירוף מקורות חלבון יכול להשלים חסר, הוא ידע מקובל מספרי הלימוד ואינו מופיע בשקופית.","body":"רוכבת אופניים משווה שני מזונות שמספקים כל אחד 20 גרם חלבון. לפי שקופית 21, כמות הגרמים אינה מספיקה כדי לשפוט את הערך התזונתי. Amino acid scoring בודק את כמות כל אחת מחומצות האמינו **החיוניות** בחלבון ומשווה אותה לרפרנס.\n\nנניח שבמזון הראשון כל חומצות האמינו החיוניות קרובות לרפרנס, ובשני אחת מהן נמוכה בהרבה. אז לחלבון השני ציון נמוך יותר, אף שהכמות בגרמים זהה.\n\nבספרי הלימוד מוסבר שחומצת האמינו החיונית החסרה ביותר היא ״המגבילה״, כי בניית חלבון דורשת את כל חומצות האמינו. לכן שילוב של מקורות שונים במהלך היום יכול להשלים חוסר של מקור אחד.","topicId":"N03"},{"id":"N03-A08","section":5,"kind":"check","title":"בדיקת הבנה: למה רק חיוניות?","slides":[18,21],"basis":"deck","question":"מדוע Amino acid scoring מתייחס רק לחומצות אמינו חיוניות?","options":["כי את הלא חיוניות הגוף יכול לייצר בעצמו, ואילו חוסר בחיונית אפשר להשלים רק מהמזון","כי הגוף אינו זקוק כלל לחומצות אמינו לא חיוניות","כי רק חומצות אמינו חיוניות מתחברות בקשר פפטידי","כי חומצות אמינו חיוניות מספקות יותר אנרגיה לגרם"],"correctIndex":0,"explanation":"לפי שקופית 18 חומצות אמינו לא חיוניות מיוצרות בגוף, כך שחוסר שלהן במזון אינו קובע את איכותו, ואילו חיוניות חייבות להגיע מהתזונה, ולכן שקופית 21 בודקת אותן בלבד. התשובה ״הגוף אינו זקוק ללא חיוניות״ מפתה, אך היא שגויה: הגוף צריך אותן, הוא פשוט יודע לייצר אותן.","topicId":"N03"},{"id":"N03-A09","section":6,"kind":"example","title":"מתי אבקה מוצדקת: שני ימים של שחקנית כדורגל","slides":[59],"basis":"deck","body":"**יום רגיל:** השחקנית אוכלת ארוחות מסודרות ומגיעה לכמות החלבון הדרושה מהמזון. לפי שקופית 59 אין הוכחה שחלבון מתוסף ייתן לה תוצאות טובות יותר, ולכן אין סיבה מיוחדת להוסיף אבקה.\n\n**יום טורניר:** יש שני משחקים, נסיעה ארוכה ואין מזון זמין בין המשחקים. כאן מתקיימים שני התנאים שהמצגת מציינת: היעדר מזון זמין, וקושי להגיע לכמות החלבון הנדרשת מהמזון. אבקה היא פתרון נוח.\n\n**המסקנה למבחן:** מה שהוכח כמשפר כוח ומסת שריר הוא **צריכת חלבון נאותה**. התוסף הוא דרך אספקה, לא יתרון ביולוגי.","topicId":"N03"},{"id":"N03-A10","section":7,"kind":"check","title":"שאלת סיכום: מה משפיע על הערך התזונתי?","slides":[20,21],"basis":"deck","question":"שייק חלבון חומם, ולכן החלבון עבר דנטורציה. בנוסף נמצא שהוא דל יחסית בחומצת אמינו חיונית אחת לעומת הרפרנס. מה מהשניים פוגע בערכו התזונתי לפי המצגת?","options":["רק החימום, כי דנטורציה מפרקת את חומצות האמינו","שני הגורמים באותה מידה","רק החוסר בחומצת האמינו החיונית, כי דנטורציה אינה משנה את המבנה הראשוני ואת הערך התזונתי","אף אחד מהם, כי רק כמות החלבון בגרמים קובעת"],"correctIndex":2,"explanation":"שקופית 20 קובעת שבדנטורציה המבנה הראשוני והערך התזונתי אינם משתנים, ואילו שקופית 21 מעריכה את הערך התזונתי לפי כמות חומצות האמינו החיוניות לעומת רפרנס, ולכן רק החוסר פוגע. התשובה ״רק החימום״ מפתה, אך היא מבלבלת בין הרס המבנה המרחבי לבין פירוק השרשרת.","topicId":"N03"},{"id":"N04-A01","section":1,"kind":"worked","title":"כמה גרם שומן הם 20%–35% מהקלוריות?","slides":[23,24],"basis":"deck","body":"נתוני המצגת: שומן מהווה לרוב 20%–35% מסך הקלוריות היומי בתפריט מאוזן, וגרם שומן בתזונה מספק 9 קק״ל.\nדוגמה להמחשה: ספורטאית שצורכת 2,400 קק״ל ביום.\nגבול תחתון באנרגיה: 2,400 קק״ל × 0.20 = 480 קק״ל משומן\nגבול תחתון בגרמים: 480 קק״ל ÷ 9 קק״ל לגרם ≈ 53 גרם שומן\nגבול עליון באנרגיה: 2,400 קק״ל × 0.35 = 840 קק״ל משומן\nגבול עליון בגרמים: 840 קק״ל ÷ 9 קק״ל לגרם ≈ 93 גרם שומן\nתוצאה: בערך 53–93 גרם שומן ביום.\nשימי לב: מחלקים ב־9 כי מדובר בשומן בתזונה. הערך 7 קק״ל לגרם (שקופית 24) שייך לשומן אגור בגוף, ולא משתמשים בו לחישוב מזון.","topicId":"N04"},{"id":"N04-A02","section":1,"kind":"steps","title":"מהצלחת לרקמת השומן","slides":[23],"basis":"beyond","beyondNote":"הפירוט שבתאי המעי חומצות השומן מורכבות מחדש לטריגליצרידים לפני האריזה בכילומיקרונים, ושהכילומיקרונים מגיעים לדם דרך הלימפה, הוא ידע מספרי הלימוד ואינו מופיע בשקופית.","steps":["השומן במזון מגיע ברובו כטריגליצרידים.","במערכת העיכול הוא מפורק לצורות שונות, בעיקר טריגליצרידים וחומצות שומן חופשיות (כך במצגת).","בספרי הלימוד מוסבר שבתאי המעי חומצות השומן מורכבות מחדש לטריגליצרידים.","השומן נארז במבנים הנקראים כילומיקרונים.","הכילומיקרונים נספגים דרך מערכת הלימפה, ורק משם מגיעים לזרם הדם.","השומן נאגר ברקמת השומן בצורת טריגליצרידים, ומשמש מאגר אנרגיה."],"topicId":"N04"},{"id":"N04-A03","section":2,"kind":"compare","title":"רוויה, חד־בלתי רוויה, רב־בלתי רוויה","slides":[25,26],"basis":"beyond","beyondNote":"צורת השרשרת (הכיפוף שיוצר קשר כפול) ומצב הצבירה של שומן רווי וחד־בלתי רווי אינם מופיעים במצגת; המצגת מציינת רק שחומצות שומן רב־בלתי רוויות נוזליות בטמפרטורת החדר.","table":{"head":["","רוויה","חד־בלתי רוויה (mono)","רב־בלתי רוויה (poly)"],"rows":[["קשרים כפולים בשרשרת הפחמן","אין","קשר כפול אחד","יותר מקשר כפול אחד"],["צורת השרשרת (מספרי הלימוד)","ישרה, השרשראות נארזות בצפיפות","כיפוף אחד בקשר הכפול","כמה כיפופים"],["מצב בטמפרטורת החדר","לרוב מוצק (מספרי הלימוד)","לרוב נוזלי (מספרי הלימוד)","נוזלי (שקופית 26)"],["משפחות אומגה במצגת","לא רלוונטי","לא נדונות במצגת","אומגה־3: שמן פשתן, דגי מים קרים, אגוזי מלך. אומגה־6: סויה, חמניות, חריע"]]},"topicId":"N04"},{"id":"N04-A04","section":2,"kind":"misconception","title":"״כל חומצת שומן מאומגה־3 או אומגה־6 היא חיונית״","slides":[26],"basis":"beyond","beyondNote":"זיהוי החומצות החיוניות הספציפיות (חומצה לינולאית וחומצה אלפא־לינולנית) ויכולת הגוף לייצר מהן חומצות ארוכות יותר הם ידע מקובל מספרי הלימוד, ולא מהמצגת.","body":"**האמונה השגויה:** כל מולקולה ממשפחת אומגה־3 או אומגה־6 חיונית, והגוף אינו מייצר אף אחת מהן.\n\n**למה זה פישוט:** בספרי הלימוד ״חיונית״ מתייחסת לחומצות שומן מסוימות: חומצה לינולאית (אומגה־6) וחומצה אלפא־לינולנית (אומגה־3). מהן הגוף יכול לייצר, בכמות מוגבלת, חומצות שומן ארוכות יותר מאותן משפחות.\n\n**מה לכתוב במבחן:** לפי שקופית 26, חומצות השומן אומגה־3 ואומגה־6 חיוניות: אינן מיוצרות בגוף ויש לצרוך אותן מהמזון. כדאי לדעת שהקביעה נכונה במדויק לחומצות מסוימות במשפחות, לא לכל מולקולה בהן.","topicId":"N04"},{"id":"N04-A05","section":3,"kind":"compare","title":"שומן תת־עורי מול שומן ויסצרלי","slides":[27],"basis":"beyond","beyondNote":"השקופית קובעת ששומן תת־עורי אינו מקושר לסיכון; זהו פישוט, ובספרות המדעית הסיכון תלוי בהקשר ובהתפלגות השומן ולא נקבע ״תמיד חסר סיכון״.","table":{"head":["","שומן תת־עורי","שומן ויסצרלי (״שומן בטני״)"],"rows":[["מיקום","מתחת לעור","סביב האיברים הפנימיים בחלל הבטן"],["אזורים שהמצגת מציינת","בעיקר ישבן וזרועות","חלל הבטן"],["קשר לסיכון לפי המצגת","אינו מקושר לעלייה בסיכון למחלות","קשור לעלייה בסיכון למחלות לב וכלי דם"],["דיוק מדעי","פישוט: לא ״תמיד חסר סיכון״, ההקשר וההתפלגות חשובים","מתאים לספרות: הצטברותו מקושרת לסיכון מטבולי וקרדיווסקולרי"]]},"topicId":"N04"},{"id":"N04-A06","section":3,"kind":"misconception","title":"״משמינים מאכילת שומן״","slides":[18,23,27],"basis":"deck","body":"**האמונה השגויה:** שומן בגוף מצטבר בגלל שאוכלים מזון שומני.\n\n**למה זה לא נכון:** לפי שקופית 27 הצטברות שומן ברקמות נובעת מעומס קלורי, ולאו דווקא מצריכת שומן. גם מקורות אחרים יכולים להפוך לשומן: לפי שקופית 18 שלד פחמני של חומצת אמינו יכול להפוך לפחמימה או לשומן. כל עודף נאגר בסוף כטריגליצרידים ברקמת השומן (שקופית 23).\n\n**הניסוח הנכון:** השמנה היא תוצאה של עודף אנרגיה. שומן מספק 9 קק״ל לגרם, ולכן קל להגיע איתו לעודף, אך הקובע הוא המאזן הקלורי הכולל.","topicId":"N04"},{"id":"N04-A07","section":4,"kind":"compare","title":"כולסטרול מול ליפופרוטאין: הנוסע וכלי הרכב","slides":[29,31],"basis":"beyond","beyondNote":"בספרי הלימוד מעטפת הליפופרוטאין היא שכבה אחת של פוספוליפידים וחלבונים סביב ליבת שומן, ולא ״ממברנה כפולה״ כנוסח השקופית.","table":{"head":["","כולסטרול","ליפופרוטאין (HDL, LDL)"],"rows":[["מה זה","סוג שומן מקבוצת הסטרואידים","נשא: שומנים הקשורים לחלבון"],["תפקיד בדם","החומר שמובל","״כלי תחבורה״ לשומנים בזרם הדם"],["מקור","במזון: מן החי בלבד. בגוף: בעיקר ייצור עצמי, בעיקר בכבד","נבנה בגוף"],["מבנה","מולקולה בודדת","לפי המצגת: כדור ״בממברנה כפולה״. בספרי הלימוד: שכבה אחת של פוספוליפידים וחלבונים סביב ליבת שומן"]]},"topicId":"N04"},{"id":"N04-A08","section":4,"kind":"check","title":"בדיקת הבנה: רצה טבעונית וכולסטרול","slides":[29],"basis":"deck","question":"רצה טבעונית אינה אוכלת מזון מן החי, ולכן כמעט אינה צורכת כולסטרול. מה נכון לגבי הכולסטרול בגופה לפי המצגת?","options":["אין בגופה כולסטרול כלל, כי אין לו מקור","הכולסטרול בגופה נע בדם כחומר חופשי, בלי נשאים","יש בגופה כולסטרול, כי עיקר הכולסטרול בגוף מקורו בייצור עצמי, בעיקר בכבד","גופה הופך אומגה־3 מהצומח לכולסטרול כדי לפצות על החוסר"],"correctIndex":2,"explanation":"לפי שקופית 29 המקור העיקרי לכולסטרול בגוף הוא ייצור עצמי, בעיקר בכבד, ולכן היעדר כולסטרול במזון אינו אומר שאין כולסטרול בגוף. התשובה ״אין כולסטרול כלל״ מפתה כי הצומח באמת אינו מכיל כולסטרול, אך היא מתעלמת מהייצור העצמי.","topicId":"N04"},{"id":"N04-A09","section":5,"kind":"steps","title":"מחזור הובלת הכולסטרול: LDL הלוך, HDL חזור","slides":[29,31],"basis":"deck","steps":["הכבד מייצר את עיקר הכולסטרול בגוף.","LDL נושא שומנים, בהם כולסטרול, מהכבד אל התאים.","LDL מקושר לשקיעת כולסטרול בדפנות כלי הדם, ולכן מכונה ״כולסטרול רע״.","HDL אוסף שומנים, בעיקר כולסטרול, מן התאים ומפנה כולסטרול מזרם הדם.","HDL מחזיר את הכולסטרול לכבד, ולכן מכונה ״כולסטרול טוב״.","התוצאה: יחס הפוך בין רמת HDL לסיכון למחלות לב. פעילות גופנית, בעיקר אירובית, יכולה להעלות את רמת ה־HDL."],"topicId":"N04"},{"id":"N04-A10","section":5,"kind":"misconception","title":"״יש כולסטרול טוב וכולסטרול רע״","slides":[29,31],"basis":"beyond","beyondNote":"ההבהרה שמולקולת הכולסטרול זהה ב־HDL וב־LDL, וההבדל הוא בנשא ובכיוון ההובלה, היא ידע מקובל; השקופית משתמשת בכינויים בלי ההבהרה הזאת.","body":"**האמונה השגויה:** HDL ו־LDL הם שני סוגים של כולסטרול, אחד בריא ואחד מזיק.\n\n**למה זה פישוט:** HDL ו־LDL אינם כולסטרול. הם ליפופרוטאינים, נשאים שמובילים שומנים בדם (שקופית 31). מולקולת הכולסטרול שבתוכם זהה. ההבדל הוא בכיוון ההובלה ובקשר לסיכון. גם ל־LDL יש תפקיד נחוץ: הוא מביא שומנים מהכבד אל התאים.\n\n**מה לכתוב במבחן:** HDL נושא כולסטרול מן התאים לכבד, ויש יחס הפוך בין רמתו לסיכון למחלות לב (מכונה ״טוב״). LDL נושא שומנים מהכבד אל התאים, ומקושר לשקיעת כולסטרול בדפנות כלי הדם (מכונה ״רע״).","topicId":"N04"},{"id":"N04-A11","section":6,"kind":"check","title":"שאלת סיכום: לפרש רמת HDL גבוהה","slides":[31],"basis":"deck","question":"בבדיקת דם של ספורטאי נמצאה רמת HDL גבוהה. איזו פרשנות מתאימה למצגת?","options":["הוא אוכל הרבה מזון מן החי, ולכן יש לו הרבה כולסטרול","יותר כולסטרול מובל מהכבד אל דפנות כלי הדם","HDL הוא מולקולת כולסטרול אחרת, ״טובה״ מבחינה כימית","זה מקושר לסיכון נמוך יותר למחלות לב, כי HDL מוביל כולסטרול מן התאים בחזרה לכבד"],"correctIndex":3,"explanation":"לפי שקופית 31 HDL מוביל כולסטרול מן התאים לכבד, ויש יחס הפוך בין רמתו לסיכון למחלות לב. התשובה על הובלה לדפנות כלי הדם מפתה, אך היא מתארת את LDL ואת הכיוון ההפוך.","topicId":"N04"},{"id":"N05-A01","section":1,"kind":"steps","title":"מחום לזיעה: איך הזעה מקררת את הגוף","slides":[33,38],"basis":"beyond","beyondNote":"ההסבר שהתאדות הזיעה לוקחת חום מן העור הוא פיזיולוגיה מקובלת; שקופית 38 אומרת רק שהזיעה היא המנגנון העיקרי לוויסות הטמפרטורה.","steps":["במאמץ השרירים עובדים יותר ומייצרים יותר חום.","טמפרטורת הגוף מתחילה לעלות.","הגוף מגביר את ההזעה, המנגנון העיקרי לוויסות הטמפרטורה ולמניעת התחממות יתר (שקופית 38).","הזיעה מתאדה מן העור, וההתאדות לוקחת איתה חום. כך העור והדם שזורם בו מתקררים.","המחיר: מים ונתרן, האלקטרוליט העיקרי בזיעה (שקופית 33), יוצאים מהגוף. אם לא מחזירים אותם, מאזן הנוזלים נפגע.","כמות הזיעה תלויה בעיקר בעומס החום, וגם במשך ובעצימות המאמץ, באקלים ובסוג הלבוש והציוד."],"topicId":"N05"},{"id":"N05-A02","section":2,"kind":"compare","title":"התייבשות מול היפונתרמיה","slides":[35,39,40],"basis":"deck","table":{"head":["","התייבשות","היפונתרמיה"],"rows":[["מה משתבש","חסרים נוזלים ביחס למשקל הגוף","ריכוז הנתרן בדם יורד (בנוסח המצגת: מתחת ל־130 מילימול/ליטר)"],["הגורם במאמץ","זיעה שאבדה ולא הוחזרה","שתיית מים מרובה מדי ו/או איבוד מלחים רב בזיעה"],["איך מודדים במצגת","אחוז הירידה במשקל הגוף (שקופיות 39–40)","ריכוז הנתרן בדם (שקופית 35)"],["האם עוד מים עוזרים?","החזר נוזלים לפי ההפסד עוזר","שתיית מים נוספת עלולה להחמיר את הדילול"]]},"topicId":"N05"},{"id":"N05-A03","section":3,"kind":"steps","title":"איך מתפתחת היפונתרמיה במאמץ","slides":[33,35,36,41],"basis":"beyond","beyondNote":"מעבר המים אל תוך התאים כשהנתרן בדם מדולל, וההגדרה הקלינית המקובלת (מתחת ל־135 מילימול/ליטר), אינם מופיעים במצגת; למבחן זכרי את נוסח המצגת, 130.","steps":["במאמץ ממושך יוצאים בזיעה גם מים וגם נתרן.","מסלול א׳: המתאמנת שותה מים פשוטים בכמות גדולה מההפסד, והמים מדללים את הנתרן בדם. לפי המצגת זה הגורם השכיח במאמצים של פחות מ־4 שעות.","מסלול ב׳: במאמצים של יותר מ־4 שעות איבוד המלחים בזיעה מצטבר, והיפונתרמיה יכולה להופיע ללא תלות בכמות השתייה.","ריכוז הנתרן בדם יורד. במצגת: מתחת ל־130 מילימול/ליטר. בהגדרה הקלינית המקובלת: מתחת ל־135.","כשהדם מדולל, מים עוברים אל תוך התאים והם מתנפחים. כך אפשר להבין את הנפיחות בכפות הידיים והרגליים.","תסמינים במצבים קלים (שקופית 36): הקאות, כיווצי שרירים, סחרחורות, תשישות.","במצבים מתקדמים: כאבי ראש, נפיחות בכפות הידיים והרגליים, אי שקט ועצבנות, בלבול וחולשה ואובדן התמצאות, פרכוסים, אובדן הכרה ומוות.","לכן ״אין להמתין לתחושת צמא״ (שקופית 41) נועד למנוע התייבשות, ואינו היתר לשתות מעבר להפסד."],"topicId":"N05"},{"id":"N05-A04","section":3,"kind":"check","title":"שאלת הבנה: מאמץ של יותר מ־4 שעות","slides":[33,35],"basis":"deck","question":"לפי המצגת, במאמץ של יותר מ־4 שעות היפונתרמיה יכולה להופיע ללא תלות בכמות השתייה. מה מסביר זאת?","options":["לאורך שעות רבות מצטבר איבוד גדול של נתרן בזיעה, ולכן ריכוזו בדם יכול לרדת גם בלי שתיית יתר","אחרי 4 שעות הכליות מפסיקות להפריש שתן, ולכן כל השתייה נשארת בגוף","אחרי 4 שעות השריר מתחיל לפרק נתרן כמקור אנרגיה","אחרי 4 שעות תחושת הצמא מתחזקת, ולכן כל הספורטאים שותים יותר מדי"],"correctIndex":0,"explanation":"שקופית 35 מונה שני גורמים: איבוד מלחים רב בזיעה ושתיית יתר, ובמאמץ ארוך מאוד הגורם הראשון לבדו יכול להספיק, כי נתרן הוא האלקטרוליט העיקרי בזיעה. האפשרות על הצמא מפתה, אבל היא מחזירה את ההסבר לשתייה, בעוד שהמצגת אומרת במפורש ׳ללא תלות בכמות השתייה׳.","topicId":"N05"},{"id":"N05-A05","section":4,"kind":"steps","title":"שרשרת ההשפעות של התייבשות","slides":[38,39,41],"basis":"deck","steps":["במאמץ יוצאים נוזלים בעיקר בזיעה וגם בנשימה. אם השתייה לא מחזירה אותם, משקל הגוף יורד.","עד 2% ממשקל הגוף: לפי המצגת אין פגיעה בביצועים ובתפקוד.","סביב 2%: רק עכשיו מופיעה תחושת הצמא (שקופית 41). מכאן ״מתאמן צמא הוא מתאמן מיובש״.","2–4% ויותר: נפגעים הביצוע האירובי והתפקוד הקוגניטיבי, למשל קצב הריצה והריכוז במשחק.","4–6% ויותר: נפגעים גם היכולת האנאירובית וכוח השרירים.","מעל 6%: קצב ההזעה יורד וזרימת הדם לעור פוחתת, ולכן הגוף מפנה פחות חום.","התוצאה: טמפרטורת הגוף עולה, הביצוע נפגע משמעותית והסיכון לנזקי חום עולה. זה מעגל מסוכן: פחות נוזלים, פחות קירור, יותר חום."],"topicId":"N05"},{"id":"N05-A06","section":5,"kind":"worked","title":"אומדן איבוד זיעה, צעד אחר צעד","slides":[39,40,42],"basis":"beyond","beyondNote":"ההנחה ש־1 ק״ג ≈ 1 ליטר והתיקון לשתייה ולשתן הם כללי חישוב מקובלים; שקופית 40 אומרת רק שהשקילה לפני ואחרי מאפשרת לחשב את אובדן הנוזלים.","body":"**הנתונים (מתאמנת לדוגמה):** רצה שקלה 68.4 ק״ג לפני ריצה של 75 דקות ו־67.5 ק״ג אחריה. במהלך הריצה שתתה 0.75 ליטר ונתנה שתן של 0.15 ליטר.\n\nשלב 1, שינוי המשקל: 68.4 ק״ג − 67.5 ק״ג = 0.9 ק״ג\nשלב 2, המרה לנפח (הנחה: 1 ק״ג ≈ 1 ליטר): 0.9 ק״ג ≈ 0.9 ליטר\nשלב 3, מוסיפים את מה ששתתה, כי המשקל ירד למרות השתייה, כלומר גם הנוזל הזה יצא: 0.9 ליטר + 0.75 ליטר = 1.65 ליטר\nשלב 4, מורידים את השתן, כי הוא נכלל בירידת המשקל אבל אינו זיעה: 1.65 ליטר − 0.15 ליטר = 1.5 ליטר זיעה\nשלב 5, משך בשעות: 75 דקות ÷ 60 = 1.25 שעות\nשלב 6, קצב הזעה: 1.5 ליטר ÷ 1.25 שעות = 1.2 ליטר לשעה\nשלב 7, אחוז הירידה ממשקל הגוף: 0.9 ק״ג ÷ 68.4 ק״ג × 100 ≈ 1.3%\nשלב 8, השוואה לשקופית 39: 1.3% הוא מתחת ל־2%, כלומר לפי המדרג עוד אין פגיעה בביצועים.\nשלב 9, החזר אחרי האימון לפי שקופית 42 (אם צריך התאוששות מהירה): 0.9 ק״ג × 1.5 ליטר/ק״ג = 1.35 ליטר\n\n**התוצאה:** איבוד זיעה של כ־1.5 ליטר, בקצב של כ־1.2 ליטר לשעה. שימי לב: לפי שקופית 40 המספר נכון רק למאמץ ולתנאי סביבה דומים.","topicId":"N05"},{"id":"N05-A07","section":6,"kind":"worked","title":"כללי האצבע במספרים: לפני, במהלך ואחרי","slides":[42,43],"basis":"deck","body":"**הנתונים (מתאמנת לדוגמה):** רוכבת אופניים יוצאת לרכיבה של שעתיים. אחרי הרכיבה ירדה במשקל 1.2 ק״ג.\n\nלפני הפעילות (כוס מים כל 30 דקות בשעתיים שלפני):\n120 דקות ÷ 30 דקות = 4, כלומר 4 כוסות\n\nבמהלך הפעילות (0.5–1 כוס כל 20 דקות):\n120 דקות ÷ 20 דקות = 6 פעמים\n6 × 0.5 כוס = 3 כוסות; 6 × 1 כוס = 6 כוסות, כלומר בין 3 ל־6 כוסות\n\nלאחר הפעילות (1.5 ליטר לכל 1 ק״ג ירידה במשקל, כשצריך התאוששות מהירה):\n1.2 ק״ג × 1.5 ליטר/ק״ג = 1.8 ליטר\n\nסוג המשקה: הרכיבה נמשכת יותר משעה, ולכן לפי שקופיות 42–43 מתאים משקה ספורט קריר עם 4–8% פחמימות ומעט מלח.\n\n**התוצאה:** 4 כוסות לפני, 3–6 כוסות במהלך ו־1.8 ליטר אחרי. אלה כללי אצבע לתרגול יחידות, לא ייעוץ אישי. לפי שקופית 42 מתאימים אותם לצבע השתן ולשינויי המשקל.","topicId":"N05"},{"id":"N05-A08","section":7,"kind":"check","title":"שאלת יישום: משקל שעלה במרוץ","slides":[35,40],"basis":"deck","question":"רצה סיימה מרוץ של 3 שעות כשמשקלה גבוה במעט ממשקלה לפני הזינוק. היא שתתה מים בלבד. מה הדאגה הסבירה ביותר לפי עקרונות הפרק?","options":["היפונתרמיה, כי עליית המשקל מרמזת שהיא שתתה יותר ממה שאיבדה והנתרן בדמה דולל","התייבשות של 2–4%, כי בכל מרוץ ארוך מאבדים נוזלים","אין סיבה לדאגה, כי עליית משקל מוכיחה מאזן נוזלים מצוין","חוסר בפחמימות בלבד, כי שתיית מים אינה משפיעה על ריכוז הנתרן"],"correctIndex":0,"explanation":"לפי היגיון השקילה בשקופית 40, עליית משקל במהלך מאמץ אומרת שנכנס יותר נוזל ממה שיצא, ולפי שקופית 35 שתיית מים מרובה במאמץ של פחות מ־4 שעות היא הגורם השכיח להיפונתרמיה. ההתייבשות מפתה כי המרוץ ארוך, אבל התייבשות של 2–4% הייתה מתבטאת בירידה במשקל, לא בעלייה.","topicId":"N05"},{"id":"N06-A01","section":1,"kind":"compare","title":"חמש דרגות ההוכחה במצגת","slides":[45,46],"basis":"deck","table":{"head":["דרגת ההוכחה","דוגמאות במצגת","מה זה אומר"],"rows":[["יעילותם הוכחה","קריאטין, קפאין, סותרי חומצה: בטא־אלנין וסודיום ביקרבונאט","יעילות ובטיחות הוכחו במחקרים איכותיים (שקופית 46)"],["יעילותם עדיין נבדקת","גלוטמין, HMB","אין עדיין מסקנה; לא מציגים אותם כ״עובדים״"],["אין כלל הוכחה ליעילותם","חומצות אמינו, ג׳ינסנג, קרניטין","אין בסיס להציג אותם כמשפרי ביצוע"],["אסורים לפי WADA","אפדרין, סטרואידים אנאבוליים","אסורים בספורט, בלי קשר להשפעתם"],["השלמת חסרים תזונתיים","ברזל, סידן, ויטמין D, מגנזיום, ויטמין B12, חומצה פולית","המטרה היא לתקן חסר, לא לשפר ביצוע"]]},"topicId":"N06"},{"id":"N06-A02","section":1,"kind":"misconception","title":"״תוסף מוכח עובד לכולן ובכל ענף״","slides":[45,46,49,52,53],"basis":"deck","body":"**האמונה השגויה:** אם תוסף נמצא בקבוצה ״שיעילותם הוכחה״, הוא ישפר את הביצוע של כל ספורטאית בכל סוג מאמץ.\n\n**למה זה שגוי:** ההוכחה נוגעת לסוג מאמץ מסוים ולתגובה של אנשים. קריאטין מתאים למאמצים קצרים ועצימים, כמו ריצת 100 מטר או שחייה של 50 מטר (שקופיות 52–53), ולא בהכרח לרצת מרתון. בקפאין יש שונות גנטית: יש אנשים שלא מושפעים כלל, ויש רגישים שיסבלו מתופעות לוואי כבר במינון נמוך (שקופית 49).\n\n**הניסוח הנכון:** ״מוכח״ פירושו שיש ראיות איכותיות ליעילות ולבטיחות במצבים מסוימים. תמיד שואלים: לאיזה מאמץ ולמי.","topicId":"N06"},{"id":"N06-A03","section":2,"kind":"steps","title":"מה קפאין עושה במאמץ סבולת","slides":[48,50],"basis":"deck","steps":["הקפאין נספג, ופעילותו מגיעה לשיא כעבור כשעה (שקופית 50).","הוא מגביר הפרשת קטכולאמינים, כלומר יותר אדרנלין.","הוא מגביר הפרשת בטא־אנדורפינים, ולכן תחושת הכאב פוחתת.","הוא מגביר ליפוליזה בתאי השומן: יותר חומצות שומן יוצאות מתאי השומן אל הדם.","התוצאה לפי שקופית 48: המאמץ נמשך זמן רב יותר, תחושת העייפות נדחית, והספורטאית שומרת על מהירות ועצימות עד התשישות.","אצל מי שצורכת קפאין באופן קבוע מופיעה הסתגלות, והאפקט מתפוגג מהר (שקופית 50)."],"topicId":"N06"},{"id":"N06-A04","section":2,"kind":"worked","title":"קפאין לפי משקל גוף: תרגיל יחידות","slides":[49,50],"basis":"deck","body":"**הנתונים (מתאמנת לדוגמה):** רצה במשקל 60 ק״ג לפני מרוץ אירובי שמתחיל ב־08:00. זה תרגיל יחידות בלבד, לא המלצת מינון.\n\nשלב 1, הקצה התחתון של הטווח הארגוגני: 3 מ״ג/ק״ג × 60 ק״ג = 180 מ״ג\nשלב 2, הקצה העליון: 6 מ״ג/ק״ג × 60 ק״ג = 360 מ״ג\nשלב 3, הטווח לפי שקופית 49: 180–360 מ״ג\nשלב 4, השוואה לסף תופעות הלוואי בשקופית 49 (מעל 600 מ״ג ביום): 360 מ״ג \u003c 600 מ״ג. גם הקצה העליון מתחת לסף, אבל אנשים רגישים עלולים לסבול מתופעות לוואי כבר במינון נמוך יותר.\nשלב 5, עיתוי לפני מאמץ אירובי, כשעה וחצי לפני (שקופית 50): 08:00 − 1:30 = 06:30\nשלב 6, מחצית חיים של 3–6 שעות: מתוך 180 מ״ג יישארו אחרי מחצית חיים אחת 180 ÷ 2 = 90 מ״ג, כלומר בין 09:30 ל־12:30.\n\n**התוצאה:** בתרגיל הטווח הוא 180–360 מ״ג, כשעה וחצי לפני הזינוק.","topicId":"N06"},{"id":"N06-A05","section":3,"kind":"steps","title":"מערכת הפוספאגן (ATP–CP) והקריאטין","slides":[52,53],"basis":"beyond","beyondNote":"העברת הפוספט מפוספוקריאטין ל־ADP, משך הפעולה של שניות ספורות ובנייה מחדש של CP במנוחה הם ידע מקובל בפיזיולוגיה שאינו כתוב בשקופיות 52–53, והקשר הישיר בין חומצת חלב לעייפות הוא מודל מפושט.","steps":["בזינוק של ספרינט הביקוש ל־ATP בשריר קופץ מיד, ומאגר ה־ATP המוכן בשריר קטן.","פוספוקריאטין (CP) מוסר קבוצת פוספט ל־ADP, וכך נוצר ATP חדש כמעט מיד, בלי צורך בחמצן.","זו המערכת המהירה ביותר, אבל מאגר ה־CP מספיק לשניות ספורות בלבד של מאמץ מרבי.","כשה־CP אוזל, השריר נשען יותר על המסלול האנאירובי הלקטי ונוצרת חומצת חלב. בשקופית 53 זה מוביל לעייפות.","תוסף קריאטין מגדיל את מאגרי הקריאטין בשריר, בתהליך של מספר שבועות.","מאגר גדול יותר מאריך את השימוש במעגל הפוספוגני, ולכן נדחים השימוש במסלול הלקטי, יצירת חומצת החלב והעייפות.","בהפסקה בין מאמצים ה־CP נבנה מחדש, ומאגר גדול יותר תורם להתאוששות מהירה יותר בין מאמצים.","בנוסף, ספיחת מים אל השריר מגרה סינתזת חלבוני שריר, וכך הקריאטין תורם גם לכוח ולמסת השריר."],"topicId":"N06"},{"id":"N06-A06","section":4,"kind":"steps","title":"מחומציות לבופר: קרנוזין ובטא־אלנין","slides":[55,56,57],"basis":"beyond","beyondNote":"שקופית 55 מציגה את חומצת החלב כגורם העייפות; במחקר המודרני יוני המימן אינם מיוחסים ללקטט בלבד, ועייפות השריר נובעת מכמה תהליכים חופפים.","steps":["במאמץ עצים השריר מפיק אנרגיה מהר במסלול הגליקוליזה.","לפי המודל במצגת נוצרת חומצת חלב, ויוני מימן חופשיים מצטברים: החומציות בשריר ובדם עולה.","החומציות פוגעת ביכולת השריר להפיק כוח, הקצב יורד ומופיעה התעייפות.","קרנוזין בשריר קושר חלק מיוני המימן החופשיים ומפחית את החומציות. זו פעולת בופר, והיא מאפשרת המשך תפקוד.","קרנוזין נוצר מצימוד של חומצת האמינו היסטידין עם בטא־אלנין.","ריכוז בטא־אלנין בדם נמוך יחסית להיסטידין, ולכן הוא הגורם המגביל ביצירת קרנוזין.","תוסף בטא־אלנין מעלה את רמת הקרנוזין בשריר, וכך גדלה יכולת הבופר.","דיוק: במחקר המודרני לקטט עצמו אינו ״הרעלן״ שגורם לעייפות. יוני המימן נוצרים מכמה תהליכים, ולעייפות יש כמה סיבות. למבחן זכרי את רעיון הבופר: קשירת יוני מימן."],"topicId":"N06"},{"id":"N06-A07","section":4,"kind":"check","title":"שאלת הבנה: למה דווקא בטא־אלנין?","slides":[56,57],"basis":"deck","question":"קרנוזין נבנה מהיסטידין ומבטא־אלנין. למה התוסף שמעלה קרנוזין בשריר הוא דווקא בטא־אלנין?","options":["כי ריכוז בטא־אלנין בדם נמוך יחסית להיסטידין, ולכן הוא הגורם המגביל ביצירת קרנוזין","כי היסטידין אסור לשימוש לפי WADA","כי בטא־אלנין עצמו קושר את יוני המימן במקום הקרנוזין","כי היסטידין אינו מצוי בגוף כלל"],"correctIndex":0,"explanation":"לפי שקופית 56 יצירת הקרנוזין מוגבלת על ידי הרכיב הזמין פחות, ובדם זה בטא־אלנין, ולכן הוספתו מעלה את הקרנוזין. האפשרות שבטא־אלנין עצמו קושר יוני מימן מפתה, אבל לפי המצגת את הבופרינג עושה הקרנוזין, ובטא־אלנין הוא רק אבן הבניין המגבילה שלו.","topicId":"N06"},{"id":"N06-A08","section":5,"kind":"example","title":"מתי אבקה מוצדקת: שתי שחקניות","slides":[59],"basis":"deck","body":"**שחקנית א׳** בקבוצת כדורסל אוכלת ארוחות מסודרות עם מקורות חלבון ומגיעה לכמות החלבון הנדרשת לה. לפי שקופית 59 צריכת חלבון נאותה היא שמשפרת כוח ומסת שריר, ואין הוכחה שחלבון מתוסף מביא תוצאות טובות יותר. אבקה לא תיתן לה יתרון.\n\n**שחקנית ב׳** באותה קבוצה נמצאת בטורניר עם ימי משחקים ארוכים ונסיעות. לעתים אין לה מזון זמין, וקשה לה להגיע לכמות החלבון הנדרשת מהמזון. אלה בדיוק שני המצבים שבהם המצגת אומרת שתוסף מוצדק.\n\n**העיקרון:** השאלה איננה ״אבקה או לא״, אלא האם מגיעים לכמות חלבון מספקת. האבקה היא כלי להשלמה.","topicId":"N06"},{"id":"N06-A09","section":6,"kind":"check","title":"שאלת יישום: איזה תוסף לאיזה מאמץ?","slides":[45,48,52,53],"basis":"deck","question":"אצנית 100 מטר ורצת מרתון בוחרות כל אחת תוסף אחד מקבוצת ״יעילותם הוכחה״. איזה שילוב מתאים לעקרונות המצגת?","options":["קריאטין לאצנית ה־100 מטר, וקפאין לרצת המרתון","קריאטין לרצת המרתון, כי הוא מאריך את משך המאמץ","קפאין לאצנית בלבד, כי השפעתו נבנית לאורך שבועות","גלוטמין לשתיהן, כי יעילותו הוכחה"],"correctIndex":0,"explanation":"קריאטין מאריך את השימוש במערכת הפוספוגנית ולכן מתאים למאמץ קצר ועצים (שקופיות 52–53), ואילו קפאין מתואר בשקופית 48 כמאריך את משך המאמץ בסבולת לב־ריאה. קריאטין לרצת המרתון מפתה כי ׳הארכת משך המאמץ׳ נשמע מתאים, אבל זו השפעת הקפאין בסבולת; וגלוטמין נמצא בכלל בקבוצה שיעילותה עדיין נבדקת.","topicId":"N06"},{"id":"N07-A01","section":1,"kind":"misconception","title":"״ויטמינים נותנים אנרגיה״","slides":[61,69],"basis":"deck","body":"**האמונה השגויה:** ויטמיני B ״נותנים אנרגיה״, ולכן כדור ויטמינים לפני תחרות יוסיף כוח.\n\n**למה זה שגוי:** מיקרונוטריאנטים אינם מכילים קלוריות (שקופית 61). ויטמיני B **מעורבים בייצור** אנרגיה (שקופית 69). כלומר הם חלק מהכלים של ״המפעל״, לא הדלק שנכנס אליו. הדלק מגיע מפחמימות, משומנים ומחלבונים.\n\n**הניסוח הנכון:** ויטמינים ומינרלים מאפשרים לגוף להפיק אנרגיה מהמזון, אך אינם מקור אנרגיה בעצמם. כשצריכת האנרגיה גבוהה, הצרכים בדרך כלל נענים דרך התזונה (שקופית 69).","topicId":"N07"},{"id":"N07-A02","section":2,"kind":"compare","title":"ויטמינים מסיסי שומן מול מסיסי מים","slides":[62],"basis":"beyond","beyondNote":"המצגת מתארת רק את הקבוצה מסיסת השומן; עמודת מסיסי המים (ויטמיני B ו־C, אגירה מוגבלת והפרשה בשתן) היא ידע מקובל מספרי הלימוד.","table":{"head":["","מסיסי שומן","מסיסי מים"],"rows":[["מי בקבוצה","A, D, E, K","ויטמיני B, וגם ויטמין C"],["ספיגה","מזון שומני מסייע בספיגתם (שקופית 62)","מתמוססים במים ואינם תלויים בשומן שבארוחה"],["אגירה","נאגרים בגוף (שקופית 62)","אגירה מוגבלת יחסית ועודף מופרש ברובו בשתן (B12 יוצא דופן ונאגר בכבד)"],["עודף","צריכה עודפת עלולה להזיק (שקופית 62)","סיכון נמוך יותר, אבל עודף ממושך מתוספים אינו בהכרח בטוח"],["משמעות מעשית","המאגר בגוף מאפשר גמישות בין ימים","צריך אספקה סדירה יותר מהתזונה"]]},"topicId":"N07"},{"id":"N07-A03","section":2,"kind":"check","title":"בדיקת הבנה: ספיגה עם ארוחה","slides":[62],"basis":"deck","question":"מתאמנת נוטלת כמוסת ויטמין D (לפי המלצת רופא). מדוע הספיגה עשויה להיות טובה יותר כשהיא נוטלת אותה עם ארוחה שיש בה מעט שומן?","options":["כי ויטמין D מסיס במים, ולכן הארוחה מוסיפה לו נוזלים","כי ויטמין D מסיס שומן, ומזון שומני מסייע בספיגתו","כי השומן בארוחה הופך את ויטמין D לסידן","כי הסיבים התזונתיים בארוחה מגבירים את ספיגתו"],"correctIndex":1,"explanation":"ויטמין D שייך לקבוצת A, D, E, K, ושקופית 62 קובעת שמזון שומני מסייע בספיגת הוויטמינים האלה. התשובה על הסיבים מפתה כי מדובר ב״ארוחה בריאה״, אבל לפי אותה שקופית סיבים דווקא מעכבים ספיגה של ויטמינים ומינרלים.","topicId":"N07"},{"id":"N07-A04","section":3,"kind":"example","title":"שתי שחקניות, אותו בקבוק תוסף","slides":[62,63],"basis":"deck","body":"נועה ומאיה משחקות כדורסל באותה קבוצה.\n\n- **נועה** אוכלת תזונה מאוזנת ולוקחת מולטי־ויטמין כדי לקפוץ גבוה יותר. לפי שקופית 63 אין לצפות לשיפור. עודף של ויטמין מסיס שומן אף עלול להזיק (שקופית 62).\n- **מאיה** עייפה כל הזמן. אנשי מקצוע בודקים אותה ומוצאים חסר. אצלה התיסוף צפוי להועיל (שקופית 63).\n\n**השורה התחתונה:** אצל מאיה התוסף **מתקן חסר**, אצל נועה הוא **מוסיף עודף**.","topicId":"N07"},{"id":"N07-A05","section":4,"kind":"steps","title":"מהברזל שבצלחת ועד החמצן בשריר","slides":[62,64,65],"basis":"beyond","beyondNote":"המצגת מפרטת את השפעות חסר הברזל; המנגנון דרך המוגלובין בתאי הדם האדומים שקושר חמצן בריאות הוא פיזיולוגיה מקובלת מספרי הלימוד.","steps":["ברזל מגיע מהמזון ונספג במעי. כמות גבוהה של סיבים עלולה לעכב את ספיגתו (שקופית 62).","בגוף הברזל נכלל בהמוגלובין, החלבון שבתוך תאי הדם האדומים.","בריאות ההמוגלובין קושר חמצן, והדם מוביל אותו לשרירים העובדים.","בשריר החמצן משמש להפקת אנרגיה במאמץ אירובי, למשל ריצה של 30 דקות (שקופית 65).","בחסר שמוביל לאנמיה יש פחות המוגלובין, ולכן פחות חמצן מגיע לשריר.","התוצאה לפי שקופית 65: פגיעה משמעותית בצח״מ, ירידה בסף האנאירובי וירידה ביכולת העבודה לטווח ארוך. לכן הפגיעה הגדולה ביותר היא במאמצים אירוביים."],"topicId":"N07"},{"id":"N07-A06","section":4,"kind":"check","title":"בדיקת הבנה: מי נפגע יותר מאנמיה?","slides":[65],"basis":"deck","question":"לשני ספורטאים יש אנמיה מחסר ברזל באותה מידה: רץ 10 ק״מ ומטיל כדור ברזל. לפי המצגת, אצל מי צפויה פגיעה גדולה יותר בביצוע, ולמה?","options":["אצל מטיל הכדור, כי ברזל הוא שבונה את כוח השריר","אצל הרץ, כי מאמץ ארוך תלוי באספקת חמצן רציפה לשריר","אצל שניהם באותה מידה, כי אנמיה פוגעת רק בריכוז","אצל אף אחד, כי ברזל קשור רק לבניית העצם"],"correctIndex":1,"explanation":"שקופית 65 קובעת שהפגיעה המשמעותית ביותר היא במאמצים אירוביים, הדורשים שימוש בחמצן לאורך זמן, ולכן הרץ נפגע יותר. התשובה ״שניהם באותה מידה״ מפתה כי באמת יש לאנמיה השפעות מנטליות כמו ירידה בריכוז, אבל יש לה גם השפעות פיזיולוגיות על הצח״מ ועל הסף האנאירובי, והן פוגעות בעיקר במאמץ הארוך.","topicId":"N07"},{"id":"N07-A07","section":5,"kind":"example","title":"סידן בריצה אחת","slides":[66,67,68],"basis":"beyond","beyondNote":"העובדה שהבקרה ההורמונלית יכולה לשחרר סידן מהעצם כדי לשמור על רמתו בדם אינה מופיעה בשקופיות; זו פיזיולוגיה מקובלת.","body":"רצה יוצאת לריצת שטח. סידן עובד אצלה בכמה מקומות בבת אחת:\n\n- **מבנה:** השלד סופג את העומס בכל צעד. סידן הוא יותר מ־98% מהחומר הקשה בעצמות ובשיניים (שקופית 66).\n- **כיווץ:** כל כיווץ של שרירי הרגליים תלוי בסידן (שקופית 68).\n- **קרישה:** אם היא נשרטת בנפילה, סידן משתתף בקרישה (שקופית 68).\n- **בקרה:** רמת הסידן בדם נשמרת קבועה בבקרה הורמונלית, וויטמין D משפר את ספיגתו (שקופיות 66–67).\n\n**למה הבקרה חשובה?** כיווץ וקרישה דורשים רמת סידן יציבה בדם בכל רגע. כשהצריכה מהמזון נמוכה, הבקרה יכולה לשחרר סידן מהעצם כדי לשמור על הרמה בדם. העצם משמשת גם כ״מחסן״.","topicId":"N07"},{"id":"N07-A08","section":6,"kind":"compare","title":"B12 וחומצה פולית: מתפקיד לסימן מחסור","slides":[71],"basis":"deck","table":{"head":["תפקיד (שקופית 71)","סימני מחסור שקשורים אליו","מה זה עלול לעשות למתאמנת"],"rows":[["ייצור תאי דם אדומים","אנמיה, עייפות ותשישות","פחות יכולת להחזיק מאמץ ממושך, בדומה לחסר ברזל"],["תחזוקת מערכת העצבים המרכזית","בלבול, פגיעה בזיכרון, בעיות בשיווי משקל, דיכאון","פגיעה בשיווי המשקל, בריכוז ובקבלת החלטות במשחק"]]},"topicId":"N07"},{"id":"N07-A09","section":6,"kind":"misconception","title":"״אין שום דרך לקבל B12 בלי מזון מהחי״","slides":[63,70],"basis":"beyond","beyondNote":"שקופית 70 מציינת את החי כמקור היחידי; קיומם של מזונות מהצומח המועשרים ב־B12 ושל תוספי B12 הוא תוספת מעבר למצגת.","body":"**האמונה השגויה:** מי שאינה אוכלת מזון מהחי לא יכולה לקבל B12 בשום דרך.\n\n**למה זה לא מדויק:** שקופית 70 קובעת שהמקור היחידי לוויטמין הוא מהחי. זה נכון לגבי המקורות **הטבעיים** במזון. אבל יש מזונות מהצומח **שהועשרו** ב־B12, ויש תוספי B12.\n\n**הניסוח הנכון:** במבחן כתבי כמו המצגת: המקור הטבעי של B12 הוא מזון מהחי. בהבהרה: מזון מועשר ותוספים מספקים אותו גם לטבעונים. כמו כל תיסוף, ההחלטה נעשית אחרי בדיקה וייעוץ של איש מקצוע (שקופית 63).","topicId":"N07"},{"id":"N07-A10","section":7,"kind":"steps","title":"איך נוצר סטרס חמצוני במאמץ","slides":[72,73],"basis":"deck","steps":["בגוף מתרחשים כל הזמן תהליכי חמצון, למשל בתהליך הפקת האנרגיה.","בתהליכים האלה נוצרים רדיקלים חופשיים.","בפעילות גופנית קצב ייצור הרדיקלים עולה משמעותית, וככל שהעצימות גבוהה יותר, הקצב עולה יותר.","נוגדי חמצון מגינים על התאים מפני הנזק שהרדיקלים גורמים.","כשריכוז הרדיקלים עולה (יותר ממה שההגנה מנטרלת), זהו סטרס חמצוני: הרדיקלים פוגעים בתאים ועלולים להביא להרס שלהם."],"topicId":"N07"},{"id":"N07-A11","section":7,"kind":"misconception","title":"״עוד נוגדי חמצון = יותר ביצועים״","slides":[63,72,73],"basis":"beyond","beyondNote":"המידע שרדיקלים שנוצרים באימון משמשים גם כאותות להסתגלות, ושמינונים גבוהים של תוספי נוגדי חמצון עשויים להחליש חלק מההסתגלויות, אינו מופיע במצגת.","body":"**האמונה השגויה:** אימון עצים מייצר רדיקלים חופשיים, ולכן כדאי לקחת מינון גבוה של תוספי נוגדי חמצון אחרי כל אימון כדי לשפר ביצועים.\n\n**למה זה שגוי:** לפי שקופית 63, תוספים אינם משפרים ביצועים אצל מי שצורכת תזונה מאוזנת, ואין המלצה גורפת לתיסוף. בנוסף, הרדיקלים שנוצרים באימון הם גם אותות שעוזרים לגוף להסתגל לאימון. יש מחקרים שמצאו שמינונים גבוהים מאוד של נוגדי חמצון עלולים להחליש חלק מההסתגלויות.\n\n**הניסוח הנכון:** נוגדי חמצון מגינים על התאים מפני נזק הרדיקלים (שקופית 73). מקורם הטבעי הוא תזונה מגוונת, ותיסוף נעשה רק אחרי בדיקה וייעוץ מקצועי.","topicId":"N07"},{"id":"N07-A12","section":8,"kind":"check","title":"בדיקת הבנה: שני מסלולים לאנמיה","slides":[65,71],"basis":"deck","question":"לפי המצגת, חסר באילו רכיבים יכול להוביל לאנמיה ולכן לפגוע ביכולת לבצע מאמץ ממושך?","options":["ברזל, וגם B12 וחומצה פולית","סידן וויטמין D","ויטמין K ונוגדי חמצון","נתרן ואשלגן"],"correctIndex":0,"explanation":"שקופית 65 מתארת חסר ברזל המוביל לאנמיה, ושקופית 71 מציינת אנמיה כסימן מחסור ב־B12 ובחומצה פולית, שמשתתפים בייצור תאי דם אדומים. האפשרות ״סידן וויטמין D״ מפתה כי גם הם מינרל וויטמין שעובדים יחד, אבל המצגת קושרת אותם לעצם, לכיווץ שריר ולקרישה, לא לייצור תאי דם ולאנמיה.","topicId":"N07"},{"id":"N08-A01","section":1,"kind":"compare","title":"ההשפעה המיידית של כל רכיב","slides":[76,77,78],"basis":"deck","table":{"head":["רכיב","השפעה מיידית (שקופיות 76–78)","מה זה אומר סמוך לאימון"],"rows":[["פחמימות פשוטות או מורכבות","מעלות את רמת הסוכר בדם","מקור לאנרגיה זמינה"],["פחמימות מלאות, סיבים תזונתיים","מאטים את ריקון הקיבה, את העיכול ואת מעבר הסוכר לדם","האנרגיה מגיעה לאט יותר, והקיבה מלאה יותר זמן"],["שומנים","מאטים את ריקון הקיבה ומתעכלים לאט","עלולים לגרום אי־נוחות בעיכול במהלך הפעילות"],["חלבונים","אין השפעה מיידית","אינם מקור לתגבור אנרגיה מהיר"]]},"topicId":"N08"},{"id":"N08-A02","section":2,"kind":"example","title":"שחיינית לפני תחרות אחר הצהריים","slides":[79,80,81],"basis":"deck","body":"שחיינית מתחרה ב־16:00. ב־12:30, כ־3.5 שעות לפני, היא אוכלת את ארוחת הצהריים מדוגמת המצגת: פסטה, חזה עוף בתנור וירקות מבושלים (שקופית 81).\n\n- **פסטה:** בעיקר פחמימות מורכבות, לגלוקוז בדם ולמילוי גליקוגן בשרירים ובכבד (שקופיות 79–80).\n- **חזה עוף בתנור:** חלבון בינוני ומעט שומן (שקופית 80).\n- **ירקות בכמות מתונה:** מעט סיבים, לנוחות העיכול.\n- **מים:** למניעת התייבשות (שקופית 79).\n\nחברה מציעה לה מנה חדשה. היא מסרבת: לא מנסים מאכלים חדשים לפני תחרויות (שקופית 80).","topicId":"N08"},{"id":"N08-A03","section":3,"kind":"compare","title":"שלוש ארוחות לפני אימון: מה ההבדל?","slides":[79,80,82,83,84],"basis":"deck","table":{"head":["","3–4 שעות לפני","בין שעה ל־3–4 שעות לפני (שקופית 84)","15–60 דקות לפני"],"rows":[["מטרה","גלוקוז תקין, מילוי גליקוגן, דחיית עייפות","שילוב של שתי המטרות","תגבור בפחמימות זמינות"],["הרכב","בעיקר פחמימות מורכבות, מעט שומן וסיבים, חלבון בינוני","כמו הארוחה המקדימה","פחמימות ומים, לא מזון עשיר בחלבון, בשומן ובסיבים"],["כמות","ארוחה מלאה","קטנה יותר, כמו הארוחה הסמוכה","קטנה: ארוחת ביניים"],["דוגמה","פסטה, חזה עוף בתנור וירקות מבושלים","כריך כן, צלחת פסטה לא","2–4 תמרים, או פרוסת לחם וריבה, עם מים"]]},"topicId":"N08"},{"id":"N08-A04","section":3,"kind":"check","title":"בדיקת הבנה: ריצה ארוכה אחרי ארוחה","slides":[84],"basis":"deck","question":"רצה יוצאת לריצה של 15 ק״מ ב־18:00 ואוכלת ב־16:00 ארוחה אחת לפני הריצה. מדוע המצגת ממליצה שתאכל כמות קטנה יחסית?","options":["כי פחמימות שנאכלות שעתיים לפני הריצה אינן נספגות כלל","כי עדיף להגיע לריצה ארוכה כשמערכת העיכול העליונה מרוקנת, כדי להפחית תסמיני עיכול","כי לפני ריצה ארוכה צריך להימנע מכל פחמימה","כי ארוחה גדולה מעלה מיד את רמת החלבון בדם"],"correctIndex":1,"explanation":"שקופית 84 ממליצה להגיע לאימון ארוך כשמערכת העיכול העליונה מרוקנת, ולכן להימנע מכמות גדולה, משומן ומסיבים כשעתיים לפני; ההרכב נשאר בעיקר פחמימות. האפשרות ״להימנע מכל פחמימה״ מפתה כי מדובר בהקטנת הארוחה, אבל המצגת מקטינה את הכמות ולא מוציאה את הפחמימות, שהן עיקר הארוחה.","topicId":"N08"},{"id":"N08-A05","section":4,"kind":"compare","title":"תיסוף פחמימות לפי משך הפעילות","slides":[85,86,87],"basis":"deck","table":{"head":["משך ואופי הפעילות","מה ראו (שקופיות 85–86)","המסקנה במצגת"],"rows":[["עד שעה","רמת הסוכר דומה בין מי שאוכלת לבין מי שלא, ואין הבדל ביכולת","תיסוף לא רלוונטי, בהנחה שהיו ארוחות מסודרות"],["שעה עד שעתיים, מאמץ מחזורי","לרוב אין שיפור בביצועים","תיסוף לפי הניסיון של המתאמנת"],["עד שעתיים, מאמץ לא מחזורי (כדורגל)","שינויי עצימות רבים, ריכוז ותגובה: התיסוף כן עוזר","תיסוף מועיל"],["שעתיים וחצי עד שלוש שעות ויותר","בלי תיסוף, ירידה חדה בסוכר אחרי שעתיים־שלוש","לתסף מהשעה הראשונה, עדיף חד־סוכרים וגלוקוז עם פרוקטוז"]]},"topicId":"N08"},{"id":"N08-A06","section":4,"kind":"steps","title":"למה הסוכר צונח אחרי שעתיים־שלוש בלי תיסוף","slides":[12,85,88],"basis":"deck","steps":["בתחילת מאמץ ממושך השריר משתמש בגליקוגן שלו. גליקוגן השריר משמש את השריר בלבד (שקופית 12).","גליקוגן הכבד מתפרק לגלוקוז שיוצא לדם ומשם לרקמות. כך נשמרת רמת הסוכר בדם (שקופית 12).","במאמץ מתמשך הגליקוגן מספיק לכשעתיים (שקופית 12). זה אומדן לימודי, והקצב תלוי בעצימות ובאדם.","בלי תיסוף, כשהמאגרים מתרוקנים, אחרי שעתיים־שלוש יש ירידה חדה בסוכר (היפוגליקמיה) ואי אפשר להמשיך באותה עצימות. בניסוי, אחרי 120 דקות הקבוצה שלא תיספה כמעט לא הצליחה להמשיך לרכב (שקופית 85).","פחמימות שנאכלות במהלך המאמץ מוסיפות גלוקוז לדם, שומרות על רמת סוכר יציבה יחסית וחוסכות בגליקוגן (שקופית 88).","שימי לב: הגרף מראה מגמה בניסוי מסוים. הוא אינו קובע שכל אדם יגיע להיפוגליקמיה בדקה מסוימת."],"topicId":"N08"},{"id":"N08-A07","section":5,"kind":"worked","title":"חישוב: כמה פחמימות במשקה ברכיבה של 3 שעות","slides":[42,43,87],"basis":"beyond","body":"**הנתונים:** רוכבת יוצאת לרכיבה של 3 שעות. היא שותה משקה ספורט בריכוז 6% (בתוך הטווח 4–8% שבשקופית 43), כוס אחת בכל 20 דקות (הקצה העליון של 0.5–1 כוס בשקופית 42). **הנחה להמחשה בלבד:** כוס = 200 מ״ל.\n\nשלב 1: משך של 3 שעות נמצא בקטגוריה ״שעתיים וחצי עד שלוש שעות ויותר״, ולכן מתספים מהשעה הראשונה (שקופית 87).\nשלב 2: מספר כוסות בשעה: 60 דקות ÷ 20 דקות = 3 כוסות לשעה.\nשלב 3: נפח בשעה: 3 כוסות × 200 מ״ל = 600 מ״ל לשעה.\nשלב 4: 6% פירושו 6 גרם פחמימות בכל 100 מ״ל.\nשלב 5: 600 מ״ל ÷ 100 מ״ל = 6 מנות של 100 מ״ל.\nשלב 6: 6 × 6 גרם = 36 גרם פחמימות לשעה.\nשלב 7: לכל הרכיבה: 36 גרם לשעה × 3 שעות = 108 גרם פחמימות.\nבדיקת טווח: באותו נפח, משקה 4% נותן 6 × 4 = 24 גרם לשעה, ומשקה 8% נותן 6 × 8 = 48 גרם לשעה.\n\n**התוצאה:** כ־36 גרם פחמימות לשעה, 108 גרם בכל הרכיבה.\n\nשימי לב: זה תרגיל יחידות. המצגת אינה נותנת יעד של גרמים לשעה במהלך המאמץ, וגרף שקופית 85 מתאר מגמה, לא שעה קבועה שבה כל אדם ״נגמר״.","beyondNote":"המצגת לא מגדירה נפח של כוס ולא מחשבת גרמי פחמימות במשקה; הכוס של 200 מ״ל והשילוב בין שקופית 42 לשקופית 43 הם הנחות לתרגול יחידות בלבד.","topicId":"N08"},{"id":"N08-A08","section":6,"kind":"compare","title":"התאוששות: פחות מ־8 שעות מול יותר מ־8 שעות","slides":[89,90],"basis":"deck","table":{"head":["","האימון הבא בעוד פחות מ־8 שעות","האימון הבא בעוד יותר מ־8 שעות"],"rows":[["עיתוי","חשוב להקפיד לאכול מיד בסיום האימון","קו מנחה: סמוך לסיום ולא יאוחר מ־90 דקות, אך אין חשיבות גדולה להקפדה על אכילה מיידית"],["פחמימות","1–1.2 גרם לק״ג לשעה ב־4 השעות הראשונות","צריכה רגילה"],["הרכב הארוחה","מגוונת: פחמימות, חלבונים, שומן מהצומח וירקות","אותו הרכב מגוון"],["מטרות","חידוש גליקוגן בשרירים ובכבד ותיקון נזקים ברקמות","אותן מטרות, עם יותר זמן להשיג אותן"]]},"topicId":"N08"},{"id":"N08-A09","section":6,"kind":"worked","title":"חישוב: שני אימונים ביום, הפרש של 6 שעות","slides":[89,90],"basis":"beyond","body":"**הנתונים (להמחשה בלבד):** ספורטאית במשקל 55 ק״ג מסיימת אימון ב־12:00, והאימון הבא ב־18:00.\n\nשלב 1: הפער בין האימונים: 18:00 − 12:00 = 6 שעות. זה פחות מ־8 שעות, ולכן לפי שקופית 90 משתמשים בקצב 1–1.2 גרם לק״ג לשעה ב־4 השעות הראשונות.\nשלב 2: הקצה התחתון: 1 גרם/ק״ג/שעה × 55 ק״ג = 55 גרם לשעה.\nשלב 3: הקצה העליון: 1.2 גרם/ק״ג/שעה × 55 ק״ג = 66 גרם לשעה.\nשלב 4: סך הכול ב־4 השעות הראשונות: 55 גרם/שעה × 4 שעות = 220 גרם, ו־66 גרם/שעה × 4 שעות = 264 גרם.\n\n**התוצאה:** 220–264 גרם פחמימות בין 12:00 ל־16:00, החל מאכילה מיד בסיום האימון.\n\nואם האימון הבא היה רק למחרת בבוקר (יותר מ־8 שעות)? לפי שקופית 90 הצריכה ״רגילה״, ואין צורך במספר מיוחד. זה תרגיל חישוב, לא הנחיה אישית.","beyondNote":"שקופית 90 כותבת ״1–1.2 גרם לק״ג לשעה״ בלי לציין באיזה רכיב מדובר; הפירוש כפחמימות נשען על שקופית 89, שמטרתה חידוש מאגרי הגליקוגן.","topicId":"N08"},{"id":"N08-A10","section":6,"kind":"check","title":"בדיקת הבנה: אימון ערב ואימון בוקר","slides":[89,90],"basis":"deck","question":"מתאמנת מסיימת אימון ב־20:00, והאימון הבא שלה ב־08:00 למחרת. לפי שקופיות 89–90, מה נכון לגבי הארוחה אחרי האימון?","options":["אם לא תאכל בתוך 15 דקות, הגליקוגן לא יתחדש עד הבוקר","עליה לצרוך 1–1.2 גרם פחמימות לק״ג לשעה במשך 4 שעות","ארוחה מגוונת ורגילה מתאימה, ואין חשיבות גדולה לאכילה מיד בסיום","עדיף להימנע מפחמימות עד הבוקר"],"correctIndex":2,"explanation":"הפער הוא 12 שעות, יותר מ־8, ולכן לפי שקופית 89 אין חשיבות גדולה להקפדה על אכילה מיד בתום האימון, ולפי שקופית 90 הצריכה רגילה. האפשרות של 1–1.2 גרם לק״ג לשעה מפתה כי זה המספר שמופיע בשקופית, אבל הוא שייך רק למצב שבו האימון הבא בעוד פחות מ־8 שעות.","topicId":"N08"},{"id":"N08-A11","section":7,"kind":"example","title":"יום שלם של רוכבת: לפני, במהלך ואחרי","slides":[79,82,83,87,88,89,90],"basis":"deck","body":"רוכבת מתכננת רכיבה של 3 שעות ב־10:00 ואימון נוסף ב־19:00.\n\n- **06:30, ארוחה מקדימה (3.5 שעות לפני):** בעיקר פחמימות מורכבות, מעט שומן וסיבים, חלבון בינוני (שקופיות 79–80).\n- **09:30, ארוחה סמוכה:** 2–4 תמרים ומים, לתגבור פחמימות זמינות (שקופיות 82–83).\n- **10:00–13:00, במהלך:** 3 שעות, ולכן מתספים מהשעה הראשונה: משקה ספורט, ג׳ל או תמרים, עדיף גלוקוז עם פרוקטוז (שקופיות 87–88).\n- **13:00, מיד בסיום:** האימון הבא בעוד 6 שעות, פחות מ־8, ולכן אוכלים מיד: ארוחה מגוונת ו־1–1.2 גרם פחמימות לק״ג לשעה ב־4 השעות הראשונות (שקופיות 89–90).\n\nאם האימון הנוסף היה מחר בבוקר, השלב האחרון היה פחות דחוף.","topicId":"N08"}],"slideImages":[4,10,11,12,19,20,25,26,31,35,39,43,45,85,89,90],"slides":[{"n":1,"title":"סיכום והכנה לבחינה","text":"סיכום והכנה לבחינה"},{"n":2,"title":"מבוא","text":"מבוא"},{"n":3,"title":"מזון","text":"מזון מאקרונוטריאנטים-חלבונים , שומנים ופחמימות מספקים לגוף חומרי בניין ואנרגיה מיקרונוטריאנטים- ויטמינים ומינרלים מאפשרים את שחרור האנרגיה וניצולה"},{"n":4,"title":"פירמידת/קשת","text":"פירמידת/קשת המזון צור ה גרפית ברורה להעבר ת מסר של תזונה נבונה לסייע בבחירת תזונה מאוזנת ומגוונת מכל קבוצות המזון כל מדינה והפירמידה שלה"},{"n":5,"title":"תווית מזון על גבי מזון ארוז","text":"תווית מזון על גבי מזון ארוז שם המוצר תכולתו מרכיביו סימון תזונתי(ערכים תזונתיים) שם היצרן ,כתובתו/ ארץ היצור(למוצר מיובא) מועד ייצור/תפוגה ."},{"n":6,"title":"תוספי מזון","text":"תוספי מזון חומרים המוספים בתהליך הייצור לצורך מטרה טכנולוגית אינם מיועדים לצריכה כשלעצמם. למה צריך תוספי מזון? שמירת בטיחות המזון. עיכוב תהליכי קלקול. שיפור ושמירת איכות המזון. הגדלת מגוון וזמינות. ייצור מזון לאוכלוסיות מיוחדות."},{"n":7,"title":"תוסף תזונהVS","text":"תוסף תזונהVS תוסף מזון תוסף מזון = כל חומר(שאינו מזון כשלעצמו ) שמוסף למזון בתהליך הייצור להשגת מטרה טכנולוגית במוצר המזון ,כגון חומר משמר , צבע מאכל או אבקת אפייה. תוסף תזונה = רכיב המוסף למזון שלא לצורך השגת מטרה טכנולוגית ושניתן לצרוך אותו גם כשלעצמו לצורך השלמת חסרים תזונתיים או למטרות שונות(כמו שיפור ביצועים בספורט) כמו ויטמינים ומינרלים ."},{"n":8,"title":"פחמימות","text":"פחמימות"},{"n":9,"title":"תעודת זהות","text":"תעודת זהות אגירה-נארזת במבנה דחוס שנקרא גליקוגן. ממלאות תפקידים חשובים בתפקוד המוח , אספקת אנרגיה למערכת העצבים המרכזית ולתאי הגוף ,מהוות חלק מהחומר התורשתי , הכבד ועוד(לשם תפקוד תקין ,המוח זקוק ל- 130גרם גלוקוז ביום.) ערך אנרגטי– 4קק\"ל ל- 1גרם."},{"n":10,"title":"אינסולין","text":"אינסולין כאשר רמות נשאי הגלוקוז בתא שריר עולות– כניסת הסוכר לתאים מואצת ורמות הסוכר בדם יורדות. מה גורם לתא השריר להעלות את רמות הנשאים לגלוקוז?: .1אינסולין .2פעילות גופנית"},{"n":11,"title":"אינסולין","text":"אינסולין ==פעילות גופנית תגובה לפעילות גופנית פעילות גופנית מעלה רמות נשאי גלוקוז בשרירים שאינם תלויים באינסולין"},{"n":12,"title":"גליקוגן","text":"גליקוגן -מאגר הפחמימות בגוף. -במאמץ מתמשך מספיק לכשעתיים. -בממוצע , גוף האדם יכול לאחסן כ500 גרם גליקוגן ( ספורטאים יותר ≈ 600 :) 400 גרם בשרירים 100 גרם בכבד -גליקוגן בכבד– מתפרק לגלוקוז שיוצא לדם ומשם לרקמות. -גליקוגן בשריר– לשימוש השריר בלבד."},{"n":13,"title":"כמה? (אין צורך לזכור מספרים)","text":"כמה? (אין צורך לזכור מספרים) ההמלצות לצריכת פחמימות בתזונה היומית מסתמכות על עצימות האימון/ מאמץ גופני ומשכו , על תדירות האימונים והיעדים בתוכנית האימון. רמת אימון גרם פחמימה לק\"ג משקל גוף למתאמנים לשיפור הכושר הגופני3-5 לספורטאים– 2-3 שעות אימון ביום בתדירות של5-7 ימים בשבוע בימים בהם עצימות המאמץ נמוכה- בינונית 5-7 בימים בהם עצימות המאמץ בינונית-גבוהה 7-12 לקראת מירוצים/ משחים( 24-72 שעות לפני ה"},{"n":14,"title":"העמסת פחמימות","text":"העמסת פחמימות לפני מאמץ ארוך וקשה– על מנת להגדיל כמה שניתן את מאגרי הגליקוגן ולהביא לדחיית עייפות. יכולה להביא להגדלת כמות הגליקוגן 700 גרם. -מספר גישות לביצוע העמסה: דלדול מקדים( ו- ימים.) לסירוגין– יום עמוס ויום מדולל( ימים.) 10 גר 'לק\" ג למשך24-72 שעות."},{"n":15,"title":"חסרונות בהעמסת פחמימות","text":"חסרונות בהעמסת פחמימות אגירת גליקוגן תביא גם לאגירת מים , לכן ביצוע העמסת פחמימות לפני מאמצים שלא צפויים להביא לריקון מאגרי הגליקוגן לא מומלצת מהסיבה שהיא לא תביא ליתרון מטאבולי , אלא להיפך , עלולה להביא לפגיעה עקב עליה במשקל והרגשת הכבדות."},{"n":16,"title":"סיבים תזונתיים","text":"סיבים תזונתיים מאטים את קצב ריקון הקיבה ומאריכים תחושת שובע. מצטיינים בכושר ספיחת מים ומגבירים את תנועתיות המעי , וכך הם מגדילים את נפח הצואה ומחישים את יציאתה. סיבים חשובים בהקשר של תזונה בעיקר בזכות השפעתם המעכבת על עליית רמות הסוכר והאינסולין בדם לאחר ארוחה , ובנוסף בזכות תרומתם לתחושת השובע ולתהליך עיכול תקין. יש לציין כי חרף יתרונותיהם הרבים של הסיבים ,אין להגזים בצריכתם , כיוון שכמויות גדולו"},{"n":17,"title":"חלבונים","text":"חלבונים"},{"n":18,"title":"חומצות אמינו","text":"חומצות אמינו תרכובת אורגנית בעלת מבנה קבוע : שלד– מורכב מחומצה קרבוקסילית וקבוצת אמינו מחוברות בפחמן(פחמן אלפא) ושייר(קבוצה פונקציונלית .) ישנן20 ח\" שהגוף מכיר ויכולות לשמש לסינטזת חלבון אנדוגני , אשר נבדלות ביניהן בקבוצה הפונקציונלית. ח\" א חיוניות– אין מסלולים ביוכימייים בגוף לסינטוז שלהם , ולכן לא יכולות להיות מופחתות מהדיאטה. חומצות אמיניות לא חיוניות– יכולות להיות מסונטזות בגוף( תוך התבססות על"},{"n":19,"title":"קשר","text":"קשר פפטידי ח\" א מחוברות ביניהן בקשר שנקרא קשר פפטידי .ע\" י קשרים אלו נוצרות שרשראות של ח\" א שנקראות פפטידים ,זהו מבנה ראשוני של חלבון . כל חלבון מאופיין ברצף ייחודי וקבוע של ח\"א , רצף זה הוא אחד המרכיבים הקובעים את תכונות החלבון."},{"n":20,"title":"שרשראות של ח\"א יוצרות חלבון","text":"שרשראות של ח\"א יוצרות חלבון מבנה שלישוני של חלבון– חיבור וקיפול המבנה הראשוני ליצירת מבנה מרחבי ספציפי . מכתיב את תכונות החלבון למשל– פעילות אנזימטית) דנטורציה– הרס המבנה המרחבי של החלבון באמצעות חימום ,חומצה או הקצפה שעלול לפגוע בתפקוד . המבנה הראשוני (שרשרת חומצות האמינו) של החלבון אינו משתנה וכך גם ערכו התזונתי .דנטורציה יכולה להיות מצב הפיך– למשל ,כשהטמפ 'יורדת חזרה , החלבון מסתדר מחדש במבנה ה"},{"n":21,"title":"ערך תזונתי של חלבון(","text":"ערך תזונתי של חלבון( Amino acid scoring הרכב ח\"א בחלבון מדוב
