ודנטית טוענת: ״אם חומצת אמינו אינה חיונית, אין צורך בגוף בחומצה הזאת״. זוהי טעות מושגית. המילה ״לא חיונית״ מתארת את הצורך לקבלה ממקור חיצוני, לא את הצורך הביולוגי בה.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-compare deck\" id=\"N03-A02\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">השוואה\u003c/span>\u003cb>מבנה חומצת אמינו: חיונית מול לא חיונית\u003c/b>\u003c/div>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>חומצת אמינו חיונית\u003c/th>\u003cth>חומצת אמינו לא חיונית\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">השלד\u003c/th>\u003ctd>חומצה קרבוקסילית וקבוצת אמינו המחוברות לפחמן אלפא\u003c/td>\u003ctd>אותו שלד בדיוק\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">מה מבדיל בין חומצות האמינו\u003c/th>\u003ctd>השייר (הקבוצה הפונקציונלית)\u003c/td>\u003ctd>השייר (הקבוצה הפונקציונלית)\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">סינתזה בגוף\u003c/th>\u003ctd>אין בגוף מסלולים ביוכימיים לייצר אותה\u003c/td>\u003ctd>הגוף מייצר אותה בתהליך טראנסאמינציה, בהתבסס על שלד פחמני וחנקן מחומצות אמינו חיוניות\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">האם אפשר להשמיט מהתזונה\u003c/th>\u003ctd>לא, חייבים לקבל אותה מהמזון\u003c/td>\u003ctd>כן, הגוף יכול להשלים אותה בעצמו\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">האם הגוף צריך אותה\u003c/th>\u003ctd>כן\u003c/td>\u003ctd>כן, ״לא חיונית״ מתאר את המקור, לא את החשיבות\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופית \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":18}'>\u003cbdi>18\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-steps deck\" id=\"N03-A03\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">שלב אחר שלב\u003c/span>\u003cb>מה קורה לחומצת אמינו שלא נבנה ממנה חלבון\u003c/b>\u003c/div>\u003col class=\"steps\">\u003cli>\u003cspan>חומצת אמינו שאינה מנוצלת לבניית חלבון מגיעה לפירוק, בעיקר בכבד.\u003c/span>\u003c/li>\u003cli>\u003cspan>דה־אמינציה: קבוצת האמינו (החלק שמכיל חנקן) מופרדת מהמולקולה.\u003c/span>\u003c/li>\u003cli>\u003cspan>נשאר שלד פחמני ללא חנקן.\u003c/span>\u003c/li>\u003cli>\u003cspan>השלד משמש ליצירת אנרגיה דרך מעגל קרבס, או הופך לפחמימה או לשומן.\u003c/span>\u003c/li>\u003cli>\u003cspan>החנקן מסולק מהגוף: הוא מופרש בשתן בצורת אוריאה.\u003c/span>\u003c/li>\u003c/ol>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופית \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":18}'>\u003cbdi>18\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"18\" data-title=\"2. חומצת אמינו: מבנה והבחנה בין חיונית ללא חיונית\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N03-3\">\u003ch2 class=\"part\">3. קשר פפטידי והמבנה של החלבון\u003c/h2>\n\u003cp>קשר פפטידי מחבר חומצות אמינו בשרשרת. \u003cstrong>מבנה ראשוני\u003c/strong> הוא רצף חומצות האמינו. הקיפול במרחב יוצר מבנים גבוהים יותר, והוא קריטי לפעילות חלבונים רבים. אפשר לדמיין שרשרת חרוזים: זהות החרוזים וסדרם חשובים, אך גם האופן שבו השרשרת מתקפלת למבנה תלת־ממדי. שני חלבונים עם אותם מרכיבים בכמויות דומות לא בהכרח יפעלו באותו אופן, אם הרצף או המבנה שלהם שונים.\u003c/p>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":19}' aria-label=\"הגדלת שקופית 19\">\u003cimg src=\"images/slide_19.webp\" alt=\"שקופית 19: קשר פפטידי ושרשראות חומצות אמינו, המבנה הראשוני של החלבון\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":19}'>שקופית \u003cbdi>19\u003c/bdi>\u003c/button>: קשר פפטידי ושרשראות חומצות אמינו, המבנה הראשוני של החלבון\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":20}' aria-label=\"הגדלת שקופית 20\">\u003cimg src=\"images/slide_20.webp\" alt=\"שקופית 20: המחשה של מבנים ברמות שונות\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":20}'>שקופית \u003cbdi>20\u003c/bdi>\u003c/button>: המחשה של מבנים ברמות שונות\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-steps beyond\" id=\"N03-A04\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">שלב אחר שלב\u003c/span>\u003cb>משרשרת לחלבון פעיל\u003c/b>\u003c/div>\u003col class=\"steps\">\u003cli>\u003cspan>שתי חומצות אמינו מתחברות בקשר פפטידי. בספרי הלימוד מוסבר שבתהליך משתחררת מולקולת מים.\u003c/span>\u003c/li>\u003cli>\u003cspan>חיבורים חוזרים יוצרים שרשרת, פפטיד. סדר חומצות האמינו בשרשרת הוא \u003cstrong>המבנה הראשוני\u003c/strong>.\u003c/span>\u003c/li>\u003cli>\u003cspan>בספרי הלימוד מתוארים גם קיפולים מקומיים קבועים (סלילים ומשטחים), הנקראים מבנה שניוני. המצגת אינה עוסקת בהם.\u003c/span>\u003c/li>\u003cli>\u003cspan>השרשרת כולה מתקפלת למבנה מרחבי ספציפי: \u003cstrong>המבנה השלישוני\u003c/strong>. אופן הקיפול נקבע מהרצף.\u003c/span>\u003c/li>\u003cli>\u003cspan>בחלק מהחלבונים מתחברות כמה שרשראות יחד (מבנה רביעוני, גם הוא מעבר למצגת).\u003c/span>\u003c/li>\u003cli>\u003cspan>המבנה המרחבי מכתיב את התפקוד, למשל פעילות אנזימטית. למבחן: רצף = מבנה ראשוני, קיפול מרחבי = מבנה שלישוני.\u003c/span>\u003c/li>\u003c/ol>\n    \u003cp class=\"add-src\">\u003cspan class=\"beyond-chip\">הבהרה מדעית מעבר למצגת\u003c/span> המצגת מזכירה רק מבנה ראשוני ושלישוני; שחרור מולקולת מים ביצירת הקשר הפפטידי, וכן המבנה השניוני והרביעוני, הם תוספת מספרי הלימוד. · \u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":19}'>\u003cbdi>19\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":20}'>\u003cbdi>20\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-check deck\" id=\"N03-A05\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">בדיקת הבנה\u003c/span>\u003cb>בדיקת הבנה: שינוי ברצף\u003c/b>\u003c/div>\u003cdiv class=\"lcheck\" data-id=\"N03-A05\">\u003cp class=\"lc-q\">\u003cb>במעבדה החליפו חומצת אמינו אחת ברצף של אנזים. מספר חומצות האמינו לא השתנה, אך האנזים הפסיק לפעול. מה ההסבר הסביר ביותר?\u003c/b>\u003c/p>\u003cdiv class=\"lc-opts\">\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N03-A05\",\"i\":2}'>\u003cspan class=\"k\">א\u003c/span>\u003cspan>שינוי המבנה הראשוני עלול לשנות את הקיפול המרחבי, והמבנה המרחבי מכתיב את הפעילות האנזימטית\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N03-A05\",\"i\":3}'>\u003cspan class=\"k\">ב\u003c/span>\u003cspan>האנזים איבד את ערכו התזונתי, ולכן אינו פועל\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N03-A05\",\"i\":1}'>\u003cspan class=\"k\">ג\u003c/span>\u003cspan>פעילות אנזים תלויה רק במספר חומצות האמינו, ולכן השינוי מקרי\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N03-A05\",\"i\":0}'>\u003cspan class=\"k\">ד\u003c/span>\u003cspan>הקשרים הפפטידיים נעלמו, ולכן אין עוד שרשרת\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"lc-exp\" hidden>\u003cp>לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":19}'>שקופיות \u003cbdi>19–20\u003c/bdi>\u003c/button> הרצף הייחודי קובע את תכונות החלבון, והמבנה השלישוני נוצר מקיפול הרצף ומכתיב את הפעילות האנזימטית, ולכן שינוי ברצף יכול לשבש את הפעילות. התשובה על ״ערך תזונתי״ מבלבלת בין תפקוד החלבון בגוף לבין ערכו כמזון, ואלה שני דברים נפרדים.\u003c/p>\u003c/div>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":19}'>\u003cbdi>19\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":20}'>\u003cbdi>20\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"20\" data-title=\"3. קשר פפטידי והמבנה של החלבון\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N03-4\">\u003ch2 class=\"part\">4. דנטורציה אינה בהכרח פירוק של חומצות האמינו\u003c/h2>\n\u003cp>מצגת \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":20}'>שקופית \u003cbdi>20\u003c/bdi>\u003c/button> מסבירה ש\u003cstrong>דנטורציה\u003c/strong> היא שינוי במבנה המרחבי של החלבון, למשל מחום, חומצה או הקצפה. שינוי המבנה עשוי לשנות פעילות של אנזים או מבנה של חלבון, אבל אינו מחייב שבירת קשרי הפפטיד של המבנה הראשוני. לכן בעת חימום ביצה החלבון משנה את המרקם, אך חומצות האמינו לא נעלמו. צריך להפריד בין ״החלבון איבד את המבנה הפעיל שלו״ לבין ״החלבון חדל להיות רכיב תזונתי״.\u003c/p>\n\u003cp>יש דנטורציה הפיכה בחלק מהמקרים ויש שינוי בלתי הפיך במקרים אחרים. אין להכליל שכל חלבון תמיד חוזר למצבו הקודם עם קירור.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-misconception deck\" id=\"N03-A06\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">טעות נפוצה\u003c/span>\u003cb>״ביצה מבושלת או חלבון שהתחמם כבר לא שווים כלום״\u003c/b>\u003c/div>\u003cp>\u003cstrong>האמונה השגויה:\u003c/strong> כשמבשלים ביצה, מקציפים חלבון או מחממים שייק חלבון, החלבון ״נהרס״ ומאבד את ערכו התזונתי.\u003c/p>\u003cp>\u003cstrong>למה זה לא נכון:\u003c/strong> דנטורציה הורסת את המבנה המרחבי בלבד. שרשרת חומצות האמינו, המבנה הראשוני, אינה משתנה, ולכן לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":20}'>שקופית \u003cbdi>20\u003c/bdi>\u003c/button> גם הערך התזונתי אינו משתנה.\u003c/p>\u003cp>\u003cstrong>הניסוח הנכון:\u003c/strong> דנטורציה עלולה לפגוע בתפקוד של חלבון (למשל אנזים), אך המבנה הראשוני וגם הערך התזונתי אינם משתנים. לפעמים היא אף הפיכה: כשהטמפרטורה יורדת, החלבון יכול לחזור למבנהו ולתפקד.\u003c/p>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופית \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":20}'>\u003cbdi>20\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"20\" data-title=\"4. דנטורציה אינה בהכרח פירוק של חומצות האמינו\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N03-5\">\u003ch2 class=\"part\">5. מהי איכות חלבון לפי ההרכב?\u003c/h2>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":21}'>שקופית \u003cbdi>21\u003c/bdi>\u003c/button> מתייחסת ל־\u003cstrong>\u003cbdi>Amino acid scoring\u003c/bdi>\u003c/strong>, כלומר להשוואת הרכב חומצות האמינו החיוניות בחלבון לתבנית ייחוס. המסר למבחן: בודקים את \u003cstrong>היחס של חומצות האמינו החיוניות\u003c/strong> לצורך, ולא מסתפקים בשאלה ״כמה גרם חלבון יש במוצר״. דוגמה: מוצר יכול להכיל כמות גבוהה של חלבון אך להיות מוגבל יחסית בחומצת אמינו חיונית מסוימת. אין צורך, על בסיס השקופית לבדה, לשנן נוסחאות מתקדמות למדדי איכות אחרים.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-example beyond\" id=\"N03-A07\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">דוגמה מהאימון\u003c/span>\u003cb>שני מקורות, אותה כמות חלבון\u003c/b>\u003c/div>\u003cp>רוכבת אופניים משווה שני מזונות שמספקים כל אחד 20 גרם חלבון. לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":21}'>שקופית \u003cbdi>21\u003c/bdi>\u003c/button>, כמות הגרמים אינה מספיקה כדי לשפוט את הערך התזונתי. \u003cbdi>Amino acid scoring\u003c/bdi> בודק את כמות כל אחת מחומצות האמינו \u003cstrong>החיוניות\u003c/strong> בחלבון ומשווה אותה לרפרנס.\u003c/p>\u003cp>נניח שבמזון הראשון כל חומצות האמינו החיוניות קרובות לרפרנס, ובשני אחת מהן נמוכה בהרבה. אז לחלבון השני ציון נמוך יותר, אף שהכמות בגרמים זהה.\u003c/p>\u003cp>בספרי הלימוד מוסבר שחומצת האמינו החיונית החסרה ביותר היא ״המגבילה״, כי בניית חלבון דורשת את כל חומצות האמינו. לכן שילוב של מקורות שונים במהלך היום יכול להשלים חוסר של מקור אחד.\u003c/p>\n    \u003cp class=\"add-src\">\u003cspan class=\"beyond-chip\">הבהרה מדעית מעבר למצגת\u003c/span> הרעיון שחומצת האמינו החיונית החסרה ביותר (״חומצת אמינו מגבילה״) קובעת את הציון, ושצירוף מקורות חלבון יכול להשלים חסר, הוא ידע מקובל מספרי הלימוד ואינו מופיע בשקופית. · \u003cspan class=\"small muted\">לפי שקופית \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":21}'>\u003cbdi>21\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-check deck\" id=\"N03-A08\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">בדיקת הבנה\u003c/span>\u003cb>בדיקת הבנה: למה רק חיוניות?\u003c/b>\u003c/div>\u003cdiv class=\"lcheck\" data-id=\"N03-A08\">\u003cp class=\"lc-q\">\u003cb>מדוע \u003cbdi>Amino acid scoring\u003c/bdi> מתייחס רק לחומצות אמינו חיוניות?\u003c/b>\u003c/p>\u003cdiv class=\"lc-opts\">\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N03-A08\",\"i\":1}'>\u003cspan class=\"k\">א\u003c/span>\u003cspan>כי הגוף אינו זקוק כלל לחומצות אמינו לא חיוניות\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N03-A08\",\"i\":3}'>\u003cspan class=\"k\">ב\u003c/span>\u003cspan>כי חומצות אמינו חיוניות מספקות יותר אנרגיה לגרם\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N03-A08\",\"i\":2}'>\u003cspan class=\"k\">ג\u003c/span>\u003cspan>כי רק חומצות אמינו חיוניות מתחברות בקשר פפטידי\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N03-A08\",\"i\":0}'>\u003cspan class=\"k\">ד\u003c/span>\u003cspan>כי את הלא חיוניות הגוף יכול לייצר בעצמו, ואילו חוסר בחיונית אפשר להשלים רק מהמזון\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"lc-exp\" hidden>\u003cp>לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":18}'>שקופית \u003cbdi>18\u003c/bdi>\u003c/button> חומצות אמינו לא חיוניות מיוצרות בגוף, כך שחוסר שלהן במזון אינו קובע את איכותו, ואילו חיוניות חייבות להגיע מהתזונה, ולכן \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":21}'>שקופית \u003cbdi>21\u003c/bdi>\u003c/button> בודקת אותן בלבד. התשובה ״הגוף אינו זקוק ללא חיוניות״ מפתה, אך היא שגויה: הגוף צריך אותן, הוא פשוט יודע לייצר אותן.\u003c/p>\u003c/div>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":18}'>\u003cbdi>18\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":21}'>\u003cbdi>21\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"21\" data-title=\"5. מהי איכות חלבון לפי ההרכב?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N03-6\">\u003ch2 class=\"part\">6. חלבון ממזון לעומת אבקת חלבון\u003c/h2>\n\u003cp>ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":58}'>שקופיות \u003cbdi>58–59\u003c/bdi>\u003c/button> נשאלת שאלה שימושית: האם אבקת חלבון מעניקה יתרון אוטומטי לעומת חלבון שמגיע ממזון? המצגת מדגישה שעמידה בצריכת חלבון מספקת היא העיקר, ושאין הוכחה כללית לתוצאות טובות יותר מעצם היות החלבון ״בתוסף״. לעתים תוסף נוח כאשר אין מזון זמין או קשה להגיע לכמות הדרושה. לכן במבחן חשוב להבדיל בין \u003cstrong>נוחות שימוש\u003c/strong> לבין \u003cstrong>יעילות ביולוגית ייחודית\u003c/strong>.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-example deck\" id=\"N03-A09\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">דוגמה מהאימון\u003c/span>\u003cb>מתי אבקה מוצדקת: שני ימים של שחקנית כדורגל\u003c/b>\u003c/div>\u003cp>\u003cstrong>יום רגיל:\u003c/strong> השחקנית אוכלת ארוחות מסודרות ומגיעה לכמות החלבון הדרושה מהמזון. לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":59}'>שקופית \u003cbdi>59\u003c/bdi>\u003c/button> אין הוכחה שחלבון מתוסף ייתן לה תוצאות טובות יותר, ולכן אין סיבה מיוחדת להוסיף אבקה.\u003c/p>\u003cp>\u003cstrong>יום טורניר:\u003c/strong> יש שני משחקים, נסיעה ארוכה ואין מזון זמין בין המשחקים. כאן מתקיימים שני התנאים שהמצגת מציינת: היעדר מזון זמין, וקושי להגיע לכמות החלבון הנדרשת מהמזון. אבקה היא פתרון נוח.\u003c/p>\u003cp>\u003cstrong>המסקנה למבחן:\u003c/strong> מה שהוכח כמשפר כוח ומסת שריר הוא \u003cstrong>צריכת חלבון נאותה\u003c/strong>. התוסף הוא דרך אספקה, לא יתרון ביולוגי.\u003c/p>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופית \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":59}'>\u003cbdi>59\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"58,59\" data-title=\"6. חלבון ממזון לעומת אבקת חלבון\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N03-7\">\u003ch2 class=\"part\">7. שאלות עם תשובות\u003c/h2>\n\u003col>\u003cli>\u003cdetails class=\"solve\">\u003csummary>מהו קשר פפטידי?\u003c/summary>\u003cp>קשר כימי המחבר שתי חומצות אמינו בשרשרת חלבון.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>מה ההבדל בין חיונית ללא חיונית?\u003c/summary>\u003cp>הצורך לקבל אותה מהתזונה לעומת יכולת סינתזה עצמית, לא דרגת חשיבות.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>למה חימום אינו בהכרח מבטל את ערכו התזונתי של חלבון?\u003c/summary>\u003cp>כי לרוב מדובר בשינוי קיפול ולא בהיעלמות חומצות האמינו.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>למה 20 גרם חלבון אינם מספרים לבד את כל הסיפור?\u003c/summary>\u003cp>משום שגם הרכב חומצות האמינו החיוניות וההקשר התזונתי חשובים.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>מתי יש טעם לשקול אבקת חלבון?\u003c/summary>\u003cp>כשיש קושי מעשי להשיג כמות מספקת ממזון, ולא כי אבקה עדיפה בהכרח.\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\n\u003cdiv class=\"keywords\">\u003cspan class=\"tag\">מילות מפתח\u003c/span>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;חומצת אמינו&quot;}'>חומצת אמינו\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;חומצת אמינו חיונית&quot;}'>חומצת אמינו חיונית\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;קשר פפטידי&quot;}'>קשר פפטידי\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;מבנה ראשוני&quot;}'>מבנה ראשוני\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;מבנה שלישוני&quot;}'>מבנה שלישוני\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;דנטורציה&quot;}'>דנטורציה\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;טראנסאמינציה&quot;}'>טראנסאמינציה\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;אוריאה&quot;}'>אוריאה\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;איכות חלבון&quot;}'>איכות חלבון\u003c/button>\u003c/div>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-check deck\" id=\"N03-A10\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">בדיקת הבנה\u003c/span>\u003cb>שאלת סיכום: מה משפיע על הערך התזונתי?\u003c/b>\u003c/div>\u003cdiv class=\"lcheck\" data-id=\"N03-A10\">\u003cp class=\"lc-q\">\u003cb>שייק חלבון חומם, ולכן החלבון עבר דנטורציה. בנוסף נמצא שהוא דל יחסית בחומצת אמינו חיונית אחת לעומת הרפרנס. מה מהשניים פוגע בערכו התזונתי לפי המצגת?\u003c/b>\u003c/p>\u003cdiv class=\"lc-opts\">\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N03-A10\",\"i\":1}'>\u003cspan class=\"k\">א\u003c/span>\u003cspan>שני הגורמים באותה מידה\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N03-A10\",\"i\":3}'>\u003cspan class=\"k\">ב\u003c/span>\u003cspan>אף אחד מהם, כי רק כמות החלבון בגרמים קובעת\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N03-A10\",\"i\":2}'>\u003cspan class=\"k\">ג\u003c/span>\u003cspan>רק החוסר בחומצת האמינו החיונית, כי דנטורציה אינה משנה את המבנה הראשוני ואת הערך התזונתי\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N03-A10\",\"i\":0}'>\u003cspan class=\"k\">ד\u003c/span>\u003cspan>רק החימום, כי דנטורציה מפרקת את חומצות האמינו\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"lc-exp\" hidden>\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":20}'>שקופית \u003cbdi>20\u003c/bdi>\u003c/button> קובעת שבדנטורציה המבנה הראשוני והערך התזונתי אינם משתנים, ואילו \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":21}'>שקופית \u003cbdi>21\u003c/bdi>\u003c/button> מעריכה את הערך התזונתי לפי כמות חומצות האמינו החיוניות לעומת רפרנס, ולכן רק החוסר פוגע. התשובה ״רק החימום״ מפתה, אך היא מבלבלת בין הרס המבנה המרחבי לבין פירוק השרשרת.\u003c/p>\u003c/div>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":20}'>\u003cbdi>20\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":21}'>\u003cbdi>21\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"\" data-title=\"7. שאלות עם תשובות\">\u003c/div>\u003c/section>","key":"L-N03"},{"topicId":"N04","title":"שומנים, חומצות שומן, כולסטרול וליפופרוטאינים","unit":"יחידה 04","sections":[{"id":"s-N04-1","title":"1. שומן: חומר בנייה, חומר מוצא ודלק","slides":[23,24]},{"id":"s-N04-2","title":"2. חומצות שומן רוויות ובלתי רוויות","slides":[25,26]},{"id":"s-N04-3","title":"3. אגירת שומן והשפעת מקום האגירה","slides":[27]},{"id":"s-N04-4","title":"4. כולסטרול: רכיב חיוני שיש להעביר בדם","slides":[29]},{"id":"s-N04-5","title":"5. HDL לעומת LDL","slides":[31]},{"id":"s-N04-6","title":"6. יישום ושאלות","slides":[]}],"html":"\u003cp class=\"lsrc\">\u003cspan class=\"tag\">מקור\u003c/span> \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":22}'>שקופיות \u003cbdi>22–31\u003c/bdi>\u003c/button>. \u003cstrong>מטרת הפרק:\u003c/strong> להבין מדוע שומן הוא רכיב חיוני ולא רק מאגר קלוריות, להבחין בין סוגי חומצות השומן ולדעת להסביר את תפקידם של \u003cbdi>HDL\u003c/bdi> ו־\u003cbdi>LDL\u003c/bdi>.\u003c/p>\n\u003csection class=\"lsec\" id=\"s-N04-1\">\u003ch2 class=\"part\">1. שומן: חומר בנייה, חומר מוצא ודלק\u003c/h2>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":23}'>שקופית \u003cbdi>23\u003c/bdi>\u003c/button> מתארת שומנים כמולקולות בעלות תפקידים שונים. הם משמשים מקור אנרגיה מרוכז, רכיב בממברנות התאים, חומר מוצא לתרכובות חיוניות, חלק ממערך הבידוד וההגנה בגוף ואמצעי חיוני לספיגה של ויטמינים מסיסי שומן. בצריכה תזונתית שומן מספק כ־9 קק״ל לגרם. \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":24}'>שקופית \u003cbdi>24\u003c/bdi>\u003c/button> מתייחסת גם לערך נמוך יותר לגרם רקמת שומן אגורה בשל הרכב הרקמה, ולכן אין לערבב בין ״גרם שומן בתזונה״ ל״גרם רקמת שומן בגוף״.\u003c/p>\n\u003cp>השומן מתעכל במערכת העיכול ומועבר בצורות שונות. \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":23}'>שקופית \u003cbdi>23\u003c/bdi>\u003c/button> מזכירה ספיגה ומעבר דרך מערכת הלימפה במבנים הקרויים \u003cstrong>כילומיקרונים\u003c/strong>. כדאי להבחין בין טריגליצרידים שנצרכים במזון ובין חומצות שומן שמתקבלות בתהליך עיכול וספיגה, ולא לחשוב שכל השומן נע כחומר חופשי בדם ללא נשאים.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-worked deck\" id=\"N04-A01\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">דוגמת חישוב\u003c/span>\u003cb>כמה גרם שומן הם 20%–35% מהקלוריות?\u003c/b>\u003c/div>\u003cdiv class=\"worked\">\u003cp>נתוני המצגת: שומן מהווה לרוב 20%–35% מסך הקלוריות היומי בתפריט מאוזן, וגרם שומן בתזונה מספק 9 קק״ל.\u003cbr>דוגמה להמחשה: ספורטאית שצורכת 2,400 קק״ל ביום.\u003cbr>גבול תחתון באנרגיה: 2,400 קק״ל × 0.20 = 480 קק״ל משומן\u003cbr>גבול תחתון בגרמים: 480 קק״ל ÷ 9 קק״ל לגרם ≈ 53 גרם שומן\u003cbr>גבול עליון באנרגיה: 2,400 קק״ל × 0.35 = 840 קק״ל משומן\u003cbr>גבול עליון בגרמים: 840 קק״ל ÷ 9 קק״ל לגרם ≈ 93 גרם שומן\u003cbr>תוצאה: בערך 53–93 גרם שומן ביום.\u003cbr>שימי לב: מחלקים ב־9 כי מדובר בשומן בתזונה. הערך 7 קק״ל לגרם (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":24}'>שקופית \u003cbdi>24\u003c/bdi>\u003c/button>) שייך לשומן אגור בגוף, ולא משתמשים בו לחישוב מזון.\u003c/p>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":23}'>\u003cbdi>23\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":24}'>\u003cbdi>24\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-steps beyond\" id=\"N04-A02\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">שלב אחר שלב\u003c/span>\u003cb>מהצלחת לרקמת השומן\u003c/b>\u003c/div>\u003col class=\"steps\">\u003cli>\u003cspan>השומן במזון מגיע ברובו כטריגליצרידים.\u003c/span>\u003c/li>\u003cli>\u003cspan>במערכת העיכול הוא מפורק לצורות שונות, בעיקר טריגליצרידים וחומצות שומן חופשיות (כך במצגת).\u003c/span>\u003c/li>\u003cli>\u003cspan>בספרי הלימוד מוסבר שבתאי המעי חומצות השומן מורכבות מחדש לטריגליצרידים.\u003c/span>\u003c/li>\u003cli>\u003cspan>השומן נארז במבנים הנקראים כילומיקרונים.\u003c/span>\u003c/li>\u003cli>\u003cspan>הכילומיקרונים נספגים דרך מערכת הלימפה, ורק משם מגיעים לזרם הדם.\u003c/span>\u003c/li>\u003cli>\u003cspan>השומן נאגר ברקמת השומן בצורת טריגליצרידים, ומשמש מאגר אנרגיה.\u003c/span>\u003c/li>\u003c/ol>\n    \u003cp class=\"add-src\">\u003cspan class=\"beyond-chip\">הבהרה מדעית מעבר למצגת\u003c/span> הפירוט שבתאי המעי חומצות השומן מורכבות מחדש לטריגליצרידים לפני האריזה בכילומיקרונים, ושהכילומיקרונים מגיעים לדם דרך הלימפה, הוא ידע מספרי הלימוד ואינו מופיע בשקופית. · \u003cspan class=\"small muted\">לפי שקופית \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":23}'>\u003cbdi>23\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"23,24\" data-title=\"1. שומן: חומר בנייה, חומר מוצא ודלק\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N04-2\">\u003ch2 class=\"part\">2. חומצות שומן רוויות ובלתי רוויות\u003c/h2>\n\u003cp>ההבחנה הבסיסית ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":25}'>שקופיות \u003cbdi>25–26\u003c/bdi>\u003c/button> היא כימית: בחומצת שומן \u003cstrong>רוויה\u003c/strong> אין קשרים כפולים בין אטומי הפחמן בשרשרת, ואילו בחומצת שומן \u003cstrong>בלתי רוויה\u003c/strong> יש לפחות קשר כפול אחד. אם יש קשר כפול אחד, היא \u003cem>חד־בלתי רוויה\u003c/em>; אם יש יותר מאחד, היא \u003cem>רב־בלתי רוויה\u003c/em>. זהו בסיס סיווג, ולא תווית אוטומטית של ״בריא״ ו״לא בריא״ ללא קשר למזון הכולל.\u003c/p>\n\u003cdiv class=\"dg-slot\" data-id=\"04-fat-types\">\u003c/div>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":26}' aria-label=\"הגדלת שקופית 26\">\u003cimg src=\"images/slide_26.webp\" alt=\"שקופית 26: חומצות שומן רב־בלתי רוויות, אומגה־3 ואומגה־6, ומקורותיהן\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":26}'>שקופית \u003cbdi>26\u003c/bdi>\u003c/button>: חומצות שומן רב־בלתי רוויות, אומגה־3 ואומגה־6, ומקורותיהן\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003cp>\u003cstrong>אומגה־3 ואומגה־6\u003c/strong> הן משפחות של חומצות שומן רב־בלתי רוויות המובחנות לפי מיקום הקשר הכפול הראשון מן הקצה המתילִי של השרשרת. המצגת נותנת דוגמאות למקורות: דגים שמנים, פשתן ואגוזי מלך לאומגה־3; סויה, חמניות וחריע לאומגה־6. יש חומצות שומן חיוניות מסוימות ממשפחות אלה שצריך לקבל בתזונה.\u003c/p>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":25}' aria-label=\"הגדלת שקופית 25\">\u003cimg src=\"images/slide_25.webp\" alt=\"שקופית 25: מבנה כימי והבדל בין רווי לבלתי רווי\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":25}'>שקופית \u003cbdi>25\u003c/bdi>\u003c/button>: מבנה כימי והבדל בין רווי לבלתי רווי\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003caside class=\"gnote kind\">\u003cspan class=\"tag\">טעות שמוכרחים להימנע ממנה\u003c/span>\u003cdiv>\u003cp>לקרוא לכל חומצת שומן בלתי רוויה ״אומגה־3״. אומגה־3 היא משפחה מסוימת בתוך הקבוצה הגדולה של חומצות שומן בלתי רוויות.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-compare beyond\" id=\"N04-A03\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">השוואה\u003c/span>\u003cb>רוויה, חד־בלתי רוויה, רב־בלתי רוויה\u003c/b>\u003c/div>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>רוויה\u003c/th>\u003cth>חד־בלתי רוויה (\u003cbdi>mono\u003c/bdi>)\u003c/th>\u003cth>רב־בלתי רוויה (\u003cbdi>poly\u003c/bdi>)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">קשרים כפולים בשרשרת הפחמן\u003c/th>\u003ctd>אין\u003c/td>\u003ctd>קשר כפול אחד\u003c/td>\u003ctd>יותר מקשר כפול אחד\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">צורת השרשרת (מספרי הלימוד)\u003c/th>\u003ctd>ישרה, השרשראות נארזות בצפיפות\u003c/td>\u003ctd>כיפוף אחד בקשר הכפול\u003c/td>\u003ctd>כמה כיפופים\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">מצב בטמפרטורת החדר\u003c/th>\u003ctd>לרוב מוצק (מספרי הלימוד)\u003c/td>\u003ctd>לרוב נוזלי (מספרי הלימוד)\u003c/td>\u003ctd>נוזלי (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":26}'>שקופית \u003cbdi>26\u003c/bdi>\u003c/button>)\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">משפחות אומגה במצגת\u003c/th>\u003ctd>לא רלוונטי\u003c/td>\u003ctd>לא נדונות במצגת\u003c/td>\u003ctd>אומגה־3: שמן פשתן, דגי מים קרים, אגוזי מלך. אומגה־6: סויה, חמניות, חריע\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"beyond-chip\">הבהרה מדעית מעבר למצגת\u003c/span> צורת השרשרת (הכיפוף שיוצר קשר כפול) ומצב הצבירה של שומן רווי וחד־בלתי רווי אינם מופיעים במצגת; המצגת מציינת רק שחומצות שומן רב־בלתי רוויות נוזליות בטמפרטורת החדר. · \u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":25}'>\u003cbdi>25\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":26}'>\u003cbdi>26\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-misconception beyond\" id=\"N04-A04\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">טעות נפוצה\u003c/span>\u003cb>״כל חומצת שומן מאומגה־3 או אומגה־6 היא חיונית״\u003c/b>\u003c/div>\u003cp>\u003cstrong>האמונה השגויה:\u003c/strong> כל מולקולה ממשפחת אומגה־3 או אומגה־6 חיונית, והגוף אינו מייצר אף אחת מהן.\u003c/p>\u003cp>\u003cstrong>למה זה פישוט:\u003c/strong> בספרי הלימוד ״חיונית״ מתייחסת לחומצות שומן מסוימות: חומצה לינולאית (אומגה־6) וחומצה אלפא־לינולנית (אומגה־3). מהן הגוף יכול לייצר, בכמות מוגבלת, חומצות שומן ארוכות יותר מאותן משפחות.\u003c/p>\u003cp>\u003cstrong>מה לכתוב במבחן:\u003c/strong> לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":26}'>שקופית \u003cbdi>26\u003c/bdi>\u003c/button>, חומצות השומן אומגה־3 ואומגה־6 חיוניות: אינן מיוצרות בגוף ויש לצרוך אותן מהמזון. כדאי לדעת שהקביעה נכונה במדויק לחומצות מסוימות במשפחות, לא לכל מולקולה בהן.\u003c/p>\n    \u003cp class=\"add-src\">\u003cspan class=\"beyond-chip\">הבהרה מדעית מעבר למצגת\u003c/span> זיהוי החומצות החיוניות הספציפיות (חומצה לינולאית וחומצה אלפא־לינולנית) ויכולת הגוף לייצר מהן חומצות ארוכות יותר הם ידע מקובל מספרי הלימוד, ולא מהמצגת. · \u003cspan class=\"small muted\">לפי שקופית \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":26}'>\u003cbdi>26\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"notebox\" data-notes=\"6\">\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"25,26\" data-title=\"2. חומצות שומן רוויות ובלתי רוויות\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N04-3\">\u003ch2 class=\"part\">3. אגירת שומן והשפעת מקום האגירה\u003c/h2>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":27}'>שקופית \u003cbdi>27\u003c/bdi>\u003c/button> מבדילה בין \u003cstrong>שומן תת־עורי\u003c/strong> הנמצא מתחת לעור לבין \u003cstrong>שומן ויסצרלי\u003c/strong> סביב איברים פנימיים בחלל הבטן. האחרונה מקושרת לסיכון מטבולי וקרדיווסקולרי מוגבר. חשוב להבין שהצטברות שומן בגוף קשורה למאזן אנרגטי ולהקשר ביולוגי רחב, לא רק לכך שהאדם אכל מזון שומני. כמו כן, כשמדברים על סיכון בריאותי חשוב להימנע מקביעה גורפת שכל שומן תת־עורי ״אינו קשור לעולם לסיכון״.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-compare beyond\" id=\"N04-A05\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">השוואה\u003c/span>\u003cb>שומן תת־עורי מול שומן ויסצרלי\u003c/b>\u003c/div>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>שומן תת־עורי\u003c/th>\u003cth>שומן ויסצרלי (״שומן בטני״)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">מיקום\u003c/th>\u003ctd>מתחת לעור\u003c/td>\u003ctd>סביב האיברים הפנימיים בחלל הבטן\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">אזורים שהמצגת מציינת\u003c/th>\u003ctd>בעיקר ישבן וזרועות\u003c/td>\u003ctd>חלל הבטן\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">קשר לסיכון לפי המצגת\u003c/th>\u003ctd>אינו מקושר לעלייה בסיכון למחלות\u003c/td>\u003ctd>קשור לעלייה בסיכון למחלות לב וכלי דם\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">דיוק מדעי\u003c/th>\u003ctd>פישוט: לא ״תמיד חסר סיכון״, ההקשר וההתפלגות חשובים\u003c/td>\u003ctd>מתאים לספרות: הצטברותו מקושרת לסיכון מטבולי וקרדיווסקולרי\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"beyond-chip\">הבהרה מדעית מעבר למצגת\u003c/span> השקופית קובעת ששומן תת־עורי אינו מקושר לסיכון; זהו פישוט, ובספרות המדעית הסיכון תלוי בהקשר ובהתפלגות השומן ולא נקבע ״תמיד חסר סיכון״. · \u003cspan class=\"small muted\">לפי שקופית \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":27}'>\u003cbdi>27\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-misconception deck\" id=\"N04-A06\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">טעות נפוצה\u003c/span>\u003cb>״משמינים מאכילת שומן״\u003c/b>\u003c/div>\u003cp>\u003cstrong>האמונה השגויה:\u003c/strong> שומן בגוף מצטבר בגלל שאוכלים מזון שומני.\u003c/p>\u003cp>\u003cstrong>למה זה לא נכון:\u003c/strong> לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":27}'>שקופית \u003cbdi>27\u003c/bdi>\u003c/button> הצטברות שומן ברקמות נובעת מעומס קלורי, ולאו דווקא מצריכת שומן. גם מקורות אחרים יכולים להפוך לשומן: לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":18}'>שקופית \u003cbdi>18\u003c/bdi>\u003c/button> שלד פחמני של חומצת אמינו יכול להפוך לפחמימה או לשומן. כל עודף נאגר בסוף כטריגליצרידים ברקמת השומן (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":23}'>שקופית \u003cbdi>23\u003c/bdi>\u003c/button>).\u003c/p>\u003cp>\u003cstrong>הניסוח הנכון:\u003c/strong> השמנה היא תוצאה של עודף אנרגיה. שומן מספק 9 קק״ל לגרם, ולכן קל להגיע איתו לעודף, אך הקובע הוא המאזן הקלורי הכולל.\u003c/p>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":18}'>\u003cbdi>18\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":23}'>\u003cbdi>23\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":27}'>\u003cbdi>27\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"notebox\" data-notes=\"7\">\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"27\" data-title=\"3. אגירת שומן והשפעת מקום האגירה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N04-4\">\u003ch2 class=\"part\">4. כולסטרול: רכיב חיוני שיש להעביר בדם\u003c/h2>\n\u003cp>כולסטרול הוא מולקולה ממשפחת הסטרולים, והגוף משתמש בו בין השאר בממברנות תאים ולייצור חומרים חיוניים. ה\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":29}'>שקופית \u003cbdi>29\u003c/bdi>\u003c/button> מציינת גם ייצור עצמי של כולסטרול בגוף. לכן העובדה שבמזון צמחי אין כולסטרול במובן הרגיל אינה אומרת שהאדם חייב לקבל כולסטרול מן המזון כדי לייצרו בתאים.\u003c/p>\n\u003cp>כיוון שכולסטרול ושומנים רבים אינם מתערבבים בקלות עם המדיום המימי של פלזמת הדם, הגוף משתמש במבני הובלה מיוחדים הקרויים \u003cstrong>ליפופרוטאינים\u003c/strong>. אל תתבלבלו בין המולקולה ״כולסטרול״ לבין כלי הנשיאה שלה.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-compare beyond\" id=\"N04-A07\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">השוואה\u003c/span>\u003cb>כולסטרול מול ליפופרוטאין: הנוסע וכלי הרכב\u003c/b>\u003c/div>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>כולסטרול\u003c/th>\u003cth>ליפופרוטאין (\u003cbdi>HDL\u003c/bdi>, \u003cbdi>LDL\u003c/bdi>)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">מה זה\u003c/th>\u003ctd>סוג שומן מקבוצת הסטרואידים\u003c/td>\u003ctd>נשא: שומנים הקשורים לחלבון\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">תפקיד בדם\u003c/th>\u003ctd>החומר שמובל\u003c/td>\u003ctd>״כלי תחבורה״ לשומנים בזרם הדם\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">מקור\u003c/th>\u003ctd>במזון: מן החי בלבד. בגוף: בעיקר ייצור עצמי, בעיקר בכבד\u003c/td>\u003ctd>נבנה בגוף\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">מבנה\u003c/th>\u003ctd>מולקולה בודדת\u003c/td>\u003ctd>לפי המצגת: כדור ״בממברנה כפולה״. בספרי הלימוד: שכבה אחת של פוספוליפידים וחלבונים סביב ליבת שומן\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"beyond-chip\">הבהרה מדעית מעבר למצגת\u003c/span> בספרי הלימוד מעטפת הליפופרוטאין היא שכבה אחת של פוספוליפידים וחלבונים סביב ליבת שומן, ולא ״ממברנה כפולה״ כנוסח השקופית. · \u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":29}'>\u003cbdi>29\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":31}'>\u003cbdi>31\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-check deck\" id=\"N04-A08\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">בדיקת הבנה\u003c/span>\u003cb>בדיקת הבנה: רצה טבעונית וכולסטרול\u003c/b>\u003c/div>\u003cdiv class=\"lcheck\" data-id=\"N04-A08\">\u003cp class=\"lc-q\">\u003cb>רצה טבעונית אינה אוכלת מזון מן החי, ולכן כמעט אינה צורכת כולסטרול. מה נכון לגבי הכולסטרול בגופה לפי המצגת?\u003c/b>\u003c/p>\u003cdiv class=\"lc-opts\">\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N04-A08\",\"i\":2}'>\u003cspan class=\"k\">א\u003c/span>\u003cspan>יש בגופה כולסטרול, כי עיקר הכולסטרול בגוף מקורו בייצור עצמי, בעיקר בכבד\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N04-A08\",\"i\":3}'>\u003cspan class=\"k\">ב\u003c/span>\u003cspan>גופה הופך אומגה־3 מהצומח לכולסטרול כדי לפצות על החוסר\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N04-A08\",\"i\":1}'>\u003cspan class=\"k\">ג\u003c/span>\u003cspan>הכולסטרול בגופה נע בדם כחומר חופשי, בלי נשאים\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N04-A08\",\"i\":0}'>\u003cspan class=\"k\">ד\u003c/span>\u003cspan>אין בגופה כולסטרול כלל, כי אין לו מקור\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"lc-exp\" hidden>\u003cp>לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":29}'>שקופית \u003cbdi>29\u003c/bdi>\u003c/button> המקור העיקרי לכולסטרול בגוף הוא ייצור עצמי, בעיקר בכבד, ולכן היעדר כולסטרול במזון אינו אומר שאין כולסטרול בגוף. התשובה ״אין כולסטרול כלל״ מפתה כי הצומח באמת אינו מכיל כולסטרול, אך היא מתעלמת מהייצור העצמי.\u003c/p>\u003c/div>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופית \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":29}'>\u003cbdi>29\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"29\" data-title=\"4. כולסטרול: רכיב חיוני שיש להעביר בדם\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N04-5\">\u003ch2 class=\"part\">5. \u003cbdi>HDL\u003c/bdi> לעומת \u003cbdi>LDL\u003c/bdi>\u003c/h2>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":31}'>שקופית \u003cbdi>31\u003c/bdi>\u003c/button> מציגה את \u003cstrong>\u003cbdi>LDL\u003c/bdi>\u003c/strong> כמוביל כולסטרול מן הכבד לכיוון הרקמות, ואת \u003cstrong>\u003cbdi>HDL\u003c/bdi>\u003c/strong> כקשור להובלת כולסטרול בחזרה לכבד. המונחים ״טוב״ ו״רע״ משמשים דימוי פשטני. הבנה טובה יותר: שני הסוגים הם חלק ממערך הובלת שומנים; רמותיהם והקשרים לסיכון למחלות לב אינם תכונה מוסרית של ״מולקולה טובה״ או ״מולקולה רעה״. בשאלות המבחן חשוב לקשר כיוון הובלה לסוג הנשאי.\u003c/p>\n\u003cdiv class=\"dg-slot\" data-id=\"10-lipoproteins\">\u003c/div>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":31}' aria-label=\"הגדלת שקופית 31\">\u003cimg src=\"images/slide_31.webp\" alt=\"שקופית 31: תיאור HDL ו-LDL\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":31}'>שקופית \u003cbdi>31\u003c/bdi>\u003c/button>: תיאור \u003cbdi>HDL\u003c/bdi> ו-\u003cbdi>LDL\u003c/bdi>\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>מושג\u003c/th>\u003cth>עיקרון\u003c/th>\u003cth>שאלה לבדיקה\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">שומן בתזונה\u003c/th>\u003ctd>מקור אנרגיה מרוכז\u003c/td>\u003ctd>כמה קק״ל ב־1 גרם?\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">רוויה\u003c/th>\u003ctd>היעדר קשר כפול\u003c/td>\u003ctd>איך מסווגים לפי קשרים?\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">חד־בלתי רוויה\u003c/th>\u003ctd>קשר כפול אחד\u003c/td>\u003ctd>במה היא שונה מרב־בלתי רוויה?\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">אומגה־3\u003c/th>\u003ctd>מיקום הקשר הכפול הראשון\u003c/td>\u003ctd>האם זו משפחת שומן או סוג של חלבון?\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>HDL\u003c/bdi>\u003c/th>\u003ctd>קשור להובלת כולסטרול לכבד\u003c/td>\u003ctd>מה כיוון ההובלה?\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>LDL\u003c/bdi>\u003c/th>\u003ctd>קשור להובלת כולסטרול לרקמות\u003c/td>\u003ctd>מה כיוון ההובלה?\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-steps deck\" id=\"N04-A09\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">שלב אחר שלב\u003c/span>\u003cb>מחזור הובלת הכולסטרול: \u003cbdi>LDL\u003c/bdi> הלוך, \u003cbdi>HDL\u003c/bdi> חזור\u003c/b>\u003c/div>\u003col class=\"steps\">\u003cli>\u003cspan>הכבד מייצר את עיקר הכולסטרול בגוף.\u003c/span>\u003c/li>\u003cli>\u003cspan>\u003cbdi>LDL\u003c/bdi> נושא שומנים, בהם כולסטרול, מהכבד אל התאים.\u003c/span>\u003c/li>\u003cli>\u003cspan>\u003cbdi>LDL\u003c/bdi> מקושר לשקיעת כולסטרול בדפנות כלי הדם, ולכן מכונה ״כולסטרול רע״.\u003c/span>\u003c/li>\u003cli>\u003cspan>\u003cbdi>HDL\u003c/bdi> אוסף שומנים, בעיקר כולסטרול, מן התאים ומפנה כולסטרול מזרם הדם.\u003c/span>\u003c/li>\u003cli>\u003cspan>\u003cbdi>HDL\u003c/bdi> מחזיר את הכולסטרול לכבד, ולכן מכונה ״כולסטרול טוב״.\u003c/span>\u003c/li>\u003cli>\u003cspan>התוצאה: יחס הפוך בין רמת \u003cbdi>HDL\u003c/bdi> לסיכון למחלות לב. פעילות גופנית, בעיקר אירובית, יכולה להעלות את רמת ה־\u003cbdi>HDL\u003c/bdi>.\u003c/span>\u003c/li>\u003c/ol>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":29}'>\u003cbdi>29\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":31}'>\u003cbdi>31\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-misconception beyond\" id=\"N04-A10\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">טעות נפוצה\u003c/span>\u003cb>״יש כולסטרול טוב וכולסטרול רע״\u003c/b>\u003c/div>\u003cp>\u003cstrong>האמונה השגויה:\u003c/strong> \u003cbdi>HDL\u003c/bdi> ו־\u003cbdi>LDL\u003c/bdi> הם שני סוגים של כולסטרול, אחד בריא ואחד מזיק.\u003c/p>\u003cp>\u003cstrong>למה זה פישוט:\u003c/strong> \u003cbdi>HDL\u003c/bdi> ו־\u003cbdi>LDL\u003c/bdi> אינם כולסטרול. הם ליפופרוטאינים, נשאים שמובילים שומנים בדם (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":31}'>שקופית \u003cbdi>31\u003c/bdi>\u003c/button>). מולקולת הכולסטרול שבתוכם זהה. ההבדל הוא בכיוון ההובלה ובקשר לסיכון. גם ל־\u003cbdi>LDL\u003c/bdi> יש תפקיד נחוץ: הוא מביא שומנים מהכבד אל התאים.\u003c/p>\u003cp>\u003cstrong>מה לכתוב במבחן:\u003c/strong> \u003cbdi>HDL\u003c/bdi> נושא כולסטרול מן התאים לכבד, ויש יחס הפוך בין רמתו לסיכון למחלות לב (מכונה ״טוב״). \u003cbdi>LDL\u003c/bdi> נושא שומנים מהכבד אל התאים, ומקושר לשקיעת כולסטרול בדפנות כלי הדם (מכונה ״רע״).\u003c/p>\n    \u003cp class=\"add-src\">\u003cspan class=\"beyond-chip\">הבהרה מדעית מעבר למצגת\u003c/span> ההבהרה שמולקולת הכולסטרול זהה ב־\u003cbdi>HDL\u003c/bdi> וב־\u003cbdi>LDL\u003c/bdi>, וההבדל הוא בנשא ובכיוון ההובלה, היא ידע מקובל; השקופית משתמשת בכינויים בלי ההבהרה הזאת. · \u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":29}'>\u003cbdi>29\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":31}'>\u003cbdi>31\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"notebox\" data-notes=\"12\">\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"31\" data-title=\"5. HDL לעומת LDL\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N04-6\">\u003ch2 class=\"part\">6. יישום ושאלות\u003c/h2>\n\u003cp>\u003cstrong>א. מוצר מכיל 12 גרם שומן. כמה אנרגיה נובעת מחלק זה?\u003c/strong> 108 קק״ל, לפי 12×9. זה אינו בהכרח כל הערך הקלורי של המוצר.\u003c/p>\n\u003cp>\u003cstrong>ב. למה זקוקים לנשאי שומן בדם?\u003c/strong> כי שומנים רבים אינם מסיסים היטב בפלזמה, ונדרשת הובלה מסודרת של המולקולות.\u003c/p>\n\u003cp>\u003cstrong>ג. למה חומצת שומן חיונית אינה בהכרח ״חומצת שומן שמספקת את רוב הקלוריות״?\u003c/strong> המונח חיונית מתייחס ליכולת הגוף לסנתז אותה, לא לכמות הקלוריות שהיא תורמת.\u003c/p>\n\u003cp>\u003cstrong>ד. למה שומן ויסצרלי חשוב בהקשר בריאותי?\u003c/strong> מפני שהצטברותו קשורה לעלייה בסיכון למחלות מטבוליות וכלי דם.\u003c/p>\n\u003cdiv class=\"keywords\">\u003cspan class=\"tag\">מילות מפתח\u003c/span>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;טריגליצריד&quot;}'>טריגליצריד\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;כילומיקרון&quot;}'>כילומיקרון\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;שומן רווי&quot;}'>שומן רווי\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;שומן בלתי רווי&quot;}'>שומן בלתי רווי\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;אומגה־3&quot;}'>אומגה־3\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;אומגה־6&quot;}'>אומגה־6\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;כולסטרול&quot;}'>כולסטרול\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;HDL&quot;}'>\u003cbdi>HDL\u003c/bdi>\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;LDL&quot;}'>\u003cbdi>LDL\u003c/bdi>\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;שומן ויסצרלי&quot;}'>שומן ויסצרלי\u003c/button>\u003c/div>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-check deck\" id=\"N04-A11\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">בדיקת הבנה\u003c/span>\u003cb>שאלת סיכום: לפרש רמת \u003cbdi>HDL\u003c/bdi> גבוהה\u003c/b>\u003c/div>\u003cdiv class=\"lcheck\" data-id=\"N04-A11\">\u003cp class=\"lc-q\">\u003cb>בבדיקת דם של ספורטאי נמצאה רמת \u003cbdi>HDL\u003c/bdi> גבוהה. איזו פרשנות מתאימה למצגת?\u003c/b>\u003c/p>\u003cdiv class=\"lc-opts\">\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N04-A11\",\"i\":2}'>\u003cspan class=\"k\">א\u003c/span>\u003cspan>\u003cbdi>HDL\u003c/bdi> הוא מולקולת כולסטרול אחרת, ״טובה״ מבחינה כימית\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N04-A11\",\"i\":3}'>\u003cspan class=\"k\">ב\u003c/span>\u003cspan>זה מקושר לסיכון נמוך יותר למחלות לב, כי \u003cbdi>HDL\u003c/bdi> מוביל כולסטרול מן התאים בחזרה לכבד\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N04-A11\",\"i\":1}'>\u003cspan class=\"k\">ג\u003c/span>\u003cspan>יותר כולסטרול מובל מהכבד אל דפנות כלי הדם\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N04-A11\",\"i\":0}'>\u003cspan class=\"k\">ד\u003c/span>\u003cspan>הוא אוכל הרבה מזון מן החי, ולכן יש לו הרבה כולסטרול\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"lc-exp\" hidden>\u003cp>לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":31}'>שקופית \u003cbdi>31\u003c/bdi>\u003c/button> \u003cbdi>HDL\u003c/bdi> מוביל כולסטרול מן התאים לכבד, ויש יחס הפוך בין רמתו לסיכון למחלות לב. התשובה על הובלה לדפנות כלי הדם מפתה, אך היא מתארת את \u003cbdi>LDL\u003c/bdi> ואת הכיוון ההפוך.\u003c/p>\u003c/div>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופית \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":31}'>\u003cbdi>31\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"\" data-title=\"6. יישום ושאלות\">\u003c/div>\u003c/section>","key":"L-N04"},{"topicId":"N05","title":"משק נוזלים, נתרן, התייבשות והיפונתרמיה","unit":"יחידה 05","sections":[{"id":"s-N05-1","title":"1. למה נוזלים חשובים למתאמן?","slides":[37,38]},{"id":"s-N05-2","title":"2. נתרן וחשיבותו","slides":[]},{"id":"s-N05-3","title":"3. היפונתרמיה בזמן מאמץ","slides":[35,36]},{"id":"s-N05-4","title":"4. מה קורה כשאובדים נוזלים?","slides":[39]},{"id":"s-N05-5","title":"5. איך מעריכים איבוד נוזלים במאמץ?","slides":[40]},{"id":"s-N05-6","title":"6. שתייה לפני, במהלך ואחרי הפעילות","slides":[41,42,43]},{"id":"s-N05-7","title":"7. שאלות הבנה","slides":[39]}],"html":"\u003cp class=\"lsrc\">\u003cspan class=\"tag\">מקור\u003c/span> מצגת \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":32}'>שקופיות \u003cbdi>32–43\u003c/bdi>\u003c/button>. \u003cstrong>העמקה חיצונית לצורכי דיוק:\u003c/strong> האבחנה הקלינית של היפונתרמיה במאמץ והזהירות משתיית יתר מוסברות גם בקובץ \u003cbutton class=\"linkbtn\" data-act=\"go\" data-route=\"sources\" data-anchor=\"notes\">הערות הדיוק\u003c/button>.\u003c/p>\n\u003csection class=\"lsec\" id=\"s-N05-1\">\u003ch2 class=\"part\">1. למה נוזלים חשובים למתאמן?\u003c/h2>\n\u003cp>מים אינם רק רכיב שמונע תחושת צמא. הם חלק גדול מנפח הדם והנוזלים הבין־תאיים, ומשמשים סביבה להובלת מומסים, חום וחומרי תזונה. בזמן מאמץ עולה ייצור החום, והגוף משתמש בין היתר בהפרשת זיעה ובהתאדותה כדי להעביר חום אל הסביבה. לכן הצרכים משתנים עם העומס, משך הפעילות, הטמפרטורה, הלחות, סוג הלבוש והבדלים אישיים בין מתאמנים.\u003c/p>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":37}'>שקופיות \u003cbdi>37–38\u003c/bdi>\u003c/button> מתארות דרכי איבוד נוזלים: בשתן, בהזעה, בנשימה ובמקרים מסוימים בשלשול. בזמן מאמץ בחום, ההזעה יכולה להיות גורם משמעותי במיוחד. עם זאת, כמות הזיעה לבדה אינה מלמדת כמה מים יש לשתות בלי לקחת בחשבון משך, קליטה ויציאה של נוזלים נוספים. כמו כן, הזעה כשלעצמה אינה פינוי חום יעיל אלא אם המים מתאדים מן העור.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-steps beyond\" id=\"N05-A01\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">שלב אחר שלב\u003c/span>\u003cb>מחום לזיעה: איך הזעה מקררת את הגוף\u003c/b>\u003c/div>\u003col class=\"steps\">\u003cli>\u003cspan>במאמץ השרירים עובדים יותר ומייצרים יותר חום.\u003c/span>\u003c/li>\u003cli>\u003cspan>טמפרטורת הגוף מתחילה לעלות.\u003c/span>\u003c/li>\u003cli>\u003cspan>הגוף מגביר את ההזעה, המנגנון העיקרי לוויסות הטמפרטורה ולמניעת התחממות יתר (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":38}'>שקופית \u003cbdi>38\u003c/bdi>\u003c/button>).\u003c/span>\u003c/li>\u003cli>\u003cspan>הזיעה מתאדה מן העור, וההתאדות לוקחת איתה חום. כך העור והדם שזורם בו מתקררים.\u003c/span>\u003c/li>\u003cli>\u003cspan>המחיר: מים ונתרן, האלקטרוליט העיקרי בזיעה (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":33}'>שקופית \u003cbdi>33\u003c/bdi>\u003c/button>), יוצאים מהגוף. אם לא מחזירים אותם, מאזן הנוזלים נפגע.\u003c/span>\u003c/li>\u003cli>\u003cspan>כמות הזיעה תלויה בעיקר בעומס החום, וגם במשך ובעצימות המאמץ, באקלים ובסוג הלבוש והציוד.\u003c/span>\u003c/li>\u003c/ol>\n    \u003cp class=\"add-src\">\u003cspan class=\"beyond-chip\">הבהרה מדעית מעבר למצגת\u003c/span> ההסבר שהתאדות הזיעה לוקחת חום מן העור הוא פיזיולוגיה מקובלת; \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":38}'>שקופית \u003cbdi>38\u003c/bdi>\u003c/button> אומרת רק שהזיעה היא המנגנון העיקרי לוויסות הטמפרטורה. · \u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":33}'>\u003cbdi>33\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":38}'>\u003cbdi>38\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"37,38\" data-title=\"1. למה נוזלים חשובים למתאמן?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N05-2\">\u003ch2 class=\"part\">2. נתרן וחשיבותו\u003c/h2>\n\u003cp>נתרן הוא אלקטרוליט מרכזי בנוזל החוץ־תאי, המשתתף בוויסות מאזן הנוזלים, בהעברת אותות חשמליים במערכת העצבים ובתפקוד שריר. הוא מופרש גם בזיעה וגם בשתן. המצגת מזכירה כי צריכה גבוהה עשויה לתרום לעלייה בלחץ הדם אצל חלק מהאנשים, ושמזונות מעובדים מסוימים עשירים בנתרן. אין להסיק מכאן שצריך להימנע מנתרן לחלוטין: השאלה היא מהו המאזן המתאים להקשר האישי.\u003c/p>\n\u003ch3>השוואה חשובה\u003c/h3>\n\u003cp>\u003cstrong>התייבשות\u003c/strong> מתארת אובדן נוזלים ביחס למצב הגוף. \u003cstrong>היפונתרמיה\u003c/strong> מתארת ריכוז נתרן נמוך בדם, מצב שיכול להיווצר בשל עודף מים יחסי, איבוד מלחים או שילוב של גורמים. לא כל מי שחש עייף או מסוחרר במאמץ מיובש, ויש מצבים שבהם שתיית עוד מים דווקא עלולה להזיק.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-compare deck\" id=\"N05-A02\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">השוואה\u003c/span>\u003cb>התייבשות מול היפונתרמיה\u003c/b>\u003c/div>\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>התייבשות\u003c/th>\u003cth>היפונתרמיה\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">מה משתבש\u003c/th>\u003ctd>חסרים נוזלים ביחס למשקל הגוף\u003c/td>\u003ctd>ריכוז הנתרן בדם יורד (בנוסח המצגת: מתחת ל־130 מילימול/ליטר)\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">הגורם במאמץ\u003c/th>\u003ctd>זיעה שאבדה ולא הוחזרה\u003c/td>\u003ctd>שתיית מים מרובה מדי ו/או איבוד מלחים רב בזיעה\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">איך מודדים במצגת\u003c/th>\u003ctd>אחוז הירידה במשקל הגוף (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":39}'>שקופיות \u003cbdi>39–40\u003c/bdi>\u003c/button>)\u003c/td>\u003ctd>ריכוז הנתרן בדם (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":35}'>שקופית \u003cbdi>35\u003c/bdi>\u003c/button>)\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">האם עוד מים עוזרים?\u003c/th>\u003ctd>החזר נוזלים לפי ההפסד עוזר\u003c/td>\u003ctd>שתיית מים נוספת עלולה להחמיר את הדילול\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":35}'>\u003cbdi>35\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":39}'>\u003cbdi>39\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":40}'>\u003cbdi>40\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"\" data-title=\"2. נתרן וחשיבותו\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N05-3\">\u003ch2 class=\"part\">3. היפונתרמיה בזמן מאמץ\u003c/h2>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":35}'>שקופיות \u003cbdi>35–36\u003c/bdi>\u003c/button> מתארות היפונתרמיה בהקשר של שתיית מים רבה או איבוד נתרן. בתיאור הקורס מופיע סף של \u003cstrong>130 מילימול לליטר\u003c/strong>, אך המקורות הקליניים המקובלים מגדירים בדרך כלל היפונתרמיה בריכוז נתרן \u003cstrong>נמוך מ־135 מילימול/ליטר\u003c/strong>. לכן בחבילת הלימוד ההבדל מסומן כ״ניסוח המצגת לעומת הגדרה קלינית״, ואינו מוסתר או מוחלף בשקט.\u003c/p>\n\u003cdiv class=\"dg-slot\" data-id=\"12-sodium-hyponatremia\">\u003c/div>\n\u003cp>התסמינים האפשריים יכולים לכלול בחילה, כאב ראש, עייפות ובלבול, ובמצבים קשים גם פרכוסים או ירידה בהכרה. מדובר במצב רפואי שדורש אבחון וטיפול מקצועי. באתר הלימוד יש להציג אותו כידע פיזיולוגי, לא ככלי לאבחון עצמי או הנחיית טיפול. במיוחד חשוב להימנע מהנחה ששתייה מוגברת היא תמיד פתרון לכל חולשה במהלך פעילות.\u003c/p>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":35}' aria-label=\"הגדלת שקופית 35\">\u003cimg src=\"images/slide_35.webp\" alt=\"שקופית 35: הצגת היפונתרמיה במצגת הקורס\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":35}'>שקופית \u003cbdi>35\u003c/bdi>\u003c/button>: הצגת היפונתרמיה במצגת הקורס\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-steps beyond\" id=\"N05-A03\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">שלב אחר שלב\u003c/span>\u003cb>איך מתפתחת היפונתרמיה במאמץ\u003c/b>\u003c/div>\u003col class=\"steps\">\u003cli>\u003cspan>במאמץ ממושך יוצאים בזיעה גם מים וגם נתרן.\u003c/span>\u003c/li>\u003cli>\u003cspan>מסלול א׳: המתאמנת שותה מים פשוטים בכמות גדולה מההפסד, והמים מדללים את הנתרן בדם. לפי המצגת זה הגורם השכיח במאמצים של פחות מ־4 שעות.\u003c/span>\u003c/li>\u003cli>\u003cspan>מסלול ב׳: במאמצים של יותר מ־4 שעות איבוד המלחים בזיעה מצטבר, והיפונתרמיה יכולה להופיע ללא תלות בכמות השתייה.\u003c/span>\u003c/li>\u003cli>\u003cspan>ריכוז הנתרן בדם יורד. במצגת: מתחת ל־130 מילימול/ליטר. בהגדרה הקלינית המקובלת: מתחת ל־135.\u003c/span>\u003c/li>\u003cli>\u003cspan>כשהדם מדולל, מים עוברים אל תוך התאים והם מתנפחים. כך אפשר להבין את הנפיחות בכפות הידיים והרגליים.\u003c/span>\u003c/li>\u003cli>\u003cspan>תסמינים במצבים קלים (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":36}'>שקופית \u003cbdi>36\u003c/bdi>\u003c/button>): הקאות, כיווצי שרירים, סחרחורות, תשישות.\u003c/span>\u003c/li>\u003cli>\u003cspan>במצבים מתקדמים: כאבי ראש, נפיחות בכפות הידיים והרגליים, אי שקט ועצבנות, בלבול וחולשה ואובדן התמצאות, פרכוסים, אובדן הכרה ומוות.\u003c/span>\u003c/li>\u003cli>\u003cspan>לכן ״אין להמתין לתחושת צמא״ (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":41}'>שקופית \u003cbdi>41\u003c/bdi>\u003c/button>) נועד למנוע התייבשות, ואינו היתר לשתות מעבר להפסד.\u003c/span>\u003c/li>\u003c/ol>\n    \u003cp class=\"add-src\">\u003cspan class=\"beyond-chip\">הבהרה מדעית מעבר למצגת\u003c/span> מעבר המים אל תוך התאים כשהנתרן בדם מדולל, וההגדרה הקלינית המקובלת (מתחת ל־135 מילימול/ליטר), אינם מופיעים במצגת; למבחן זכרי את נוסח המצגת, 130. · \u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":33}'>\u003cbdi>33\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":35}'>\u003cbdi>35\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":36}'>\u003cbdi>36\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":41}'>\u003cbdi>41\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003caside class=\"addblock k-check deck\" id=\"N05-A04\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">בדיקת הבנה\u003c/span>\u003cb>שאלת הבנה: מאמץ של יותר מ־4 שעות\u003c/b>\u003c/div>\u003cdiv class=\"lcheck\" data-id=\"N05-A04\">\u003cp class=\"lc-q\">\u003cb>לפי המצגת, במאמץ של יותר מ־4 שעות היפונתרמיה יכולה להופיע ללא תלות בכמות השתייה. מה מסביר זאת?\u003c/b>\u003c/p>\u003cdiv class=\"lc-opts\">\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N05-A04\",\"i\":2}'>\u003cspan class=\"k\">א\u003c/span>\u003cspan>אחרי 4 שעות השריר מתחיל לפרק נתרן כמקור אנרגיה\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N05-A04\",\"i\":3}'>\u003cspan class=\"k\">ב\u003c/span>\u003cspan>אחרי 4 שעות תחושת הצמא מתחזקת, ולכן כל הספורטאים שותים יותר מדי\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N05-A04\",\"i\":1}'>\u003cspan class=\"k\">ג\u003c/span>\u003cspan>אחרי 4 שעות הכליות מפסיקות להפריש שתן, ולכן כל השתייה נשארת בגוף\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N05-A04\",\"i\":0}'>\u003cspan class=\"k\">ד\u003c/span>\u003cspan>לאורך שעות רבות מצטבר איבוד גדול של נתרן בזיעה, ולכן ריכוזו בדם יכול לרדת גם בלי שתיית יתר\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"lc-exp\" hidden>\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":35}'>שקופית \u003cbdi>35\u003c/bdi>\u003c/button> מונה שני גורמים: איבוד מלחים רב בזיעה ושתיית יתר, ובמאמץ ארוך מאוד הגורם הראשון לבדו יכול להספיק, כי נתרן הוא האלקטרוליט העיקרי בזיעה. האפשרות על הצמא מפתה, אבל היא מחזירה את ההסבר לשתייה, בעוד שהמצגת אומרת במפורש ׳ללא תלות בכמות השתייה׳.\u003c/p>\u003c/div>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":33}'>\u003cbdi>33\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":35}'>\u003cbdi>35\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"vx-slot\" data-id=\"VX-02\">\u003c/div>\n\u003cdiv class=\"notebox\" data-notes=\"1\">\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"35,36\" data-title=\"3. היפונתרמיה בזמן מאמץ\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N05-4\">\u003ch2 class=\"part\">4. מה קורה כשאובדים נוזלים?\u003c/h2>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":39}'>שקופית \u003cbdi>39\u003c/bdi>\u003c/button> מציגה מדרג סכמטי של שיעורי איבוד משקל גוף בנוזלים והשלכות אפשריות על ביצועים. המסר העקרוני חשוב: כאשר מאזן הנוזלים נפגע, עלולים להשתנות וויסות החום, זרימת הדם, מאמץ נתפס ותפקוד פיזי וקוגניטיבי. עם זאת, אי אפשר להסיק מן הטבלה שכל אדם יגיב באופן זהה לסף מסוים של אחוז אובדן משקל. לצורך הלימוד יש להבין \u003cstrong>מגמה ומנגנון\u003c/strong> ולא לשנן את הטבלה כחוק אבחוני מדויק.\u003c/p>\n\u003cdiv class=\"dg-slot\" data-id=\"11-dehydration-levels\">\u003c/div>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":39}' aria-label=\"הגדלת שקופית 39\">\u003cimg src=\"images/slide_39.webp\" alt=\"שקופית 39: קשר בין איבוד נוזלים לביצוע\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":39}'>שקופית \u003cbdi>39\u003c/bdi>\u003c/button>: קשר בין איבוד נוזלים לביצוע\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-steps deck\" id=\"N05-A05\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">שלב אחר שלב\u003c/span>\u003cb>שרשרת ההשפעות של התייבשות\u003c/b>\u003c/div>\u003col class=\"steps\">\u003cli>\u003cspan>במאמץ יוצאים נוזלים בעיקר בזיעה וגם בנשימה. אם השתייה לא מחזירה אותם, משקל הגוף יורד.\u003c/span>\u003c/li>\u003cli>\u003cspan>עד 2% ממשקל הגוף: לפי המצגת אין פגיעה בביצועים ובתפקוד.\u003c/span>\u003c/li>\u003cli>\u003cspan>סביב 2%: רק עכשיו מופיעה תחושת הצמא (\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":41}'>שקופית \u003cbdi>41\u003c/bdi>\u003c/button>). מכאן ״מתאמן צמא הוא מתאמן מיובש״.\u003c/span>\u003c/li>\u003cli>\u003cspan>2–4% ויותר: נפגעים הביצוע האירובי והתפקוד הקוגניטיבי, למשל קצב הריצה והריכוז במשחק.\u003c/span>\u003c/li>\u003cli>\u003cspan>4–6% ויותר: נפגעים גם היכולת האנאירובית וכוח השרירים.\u003c/span>\u003c/li>\u003cli>\u003cspan>מעל 6%: קצב ההזעה יורד וזרימת הדם לעור פוחתת, ולכן הגוף מפנה פחות חום.\u003c/span>\u003c/li>\u003cli>\u003cspan>התוצאה: טמפרטורת הגוף עולה, הביצוע נפגע משמעותית והסיכון לנזקי חום עולה. זה מעגל מסוכן: פחות נוזלים, פחות קירור, יותר חום.\u003c/span>\u003c/li>\u003c/ol>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":38}'>\u003cbdi>38\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":39}'>\u003cbdi>39\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":41}'>\u003cbdi>41\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"vx-slot\" data-id=\"VX-01\">\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"39\" data-title=\"4. מה קורה כשאובדים נוזלים?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N05-5\">\u003ch2 class=\"part\">5. איך מעריכים איבוד נוזלים במאמץ?\u003c/h2>\n\u003cp>ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":40}'>שקופית \u003cbdi>40\u003c/bdi>\u003c/button> מוצגת השוואה בין משקל לפני אימון ולאחריו כשיטה לימודית להערכת שינוי נוזלים. אם מתאמן שקל לפני 65.0 ק״ג ואחרי 64.3 ק״ג, הפרש המשקל הוא 0.7 ק״ג. בתרגיל פשוט מניחים שכ־1 ק״ג הפרש משקף בקירוב ליטר מים, ולכן 0.7 ק״ג הם כ־700 מ״ל. אבל אם שתה 500 מ״ל במהלך האימון, האומדן הגס של איבוד הזיעה יהיה 1.2 ליטר, בהנחה שלא נתן שתן ולא היו שינויים נוספים. צריך להבחין בין \u003cstrong>שינוי במשקל\u003c/strong> לבין \u003cstrong>איבוד הזיעה הכולל\u003c/strong>.\u003c/p>\n\u003cdiv class=\"dg-slot\" data-id=\"05-sweat-estimation\">\u003c/div>\n\u003cp>נוסחה חינוכית:\u003c/p>\u003cdiv class=\"eqn\" dir=\"ltr\">Estimated sweat loss (L) ≈ pre_weight(kg) - post_weight(kg) + fluid_intake(L) - urine_output(L)\u003c/div>\u003cp>הנוסחה היא אומדן פשוט בלבד; היא אינה מחליפה התאמה מקצועית למתאמן, ודורשת יחידות עקביות ומדידה סבירה.\u003c/p>\n\u003ch3>תרגיל נוסף\u003c/h3>\n\u003cp>לפני האימון: 70.2 ק״ג. לאחר האימון: 69.5 ק״ג. נשתו 0.4 ליטר, לא הייתה הפרשת שתן. שינוי המשקל: 0.7 ק״ג. אומדן זיעה: 0.7 + 0.4 = 1.1 ליטר. אם האימון נמשך 90 דקות, שיעור איבוד משוער הוא כ־0.73 ליטר בשעה.\u003c/p>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-worked beyond\" id=\"N05-A06\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">דוגמת חישוב\u003c/span>\u003cb>אומדן איבוד זיעה, צעד אחר צעד\u003c/b>\u003c/div>\u003cdiv class=\"worked\">\u003cp>\u003cstrong>הנתונים (מתאמנת לדוגמה):\u003c/strong> רצה שקלה 68.4 ק״ג לפני ריצה של 75 דקות ו־67.5 ק״ג אחריה. במהלך הריצה שתתה 0.75 ליטר ונתנה שתן של 0.15 ליטר.\u003c/p>\u003cp>שלב 1, שינוי המשקל: 68.4 ק״ג − 67.5 ק״ג = 0.9 ק״ג\u003cbr>שלב 2, המרה לנפח (הנחה: 1 ק״ג ≈ 1 ליטר): 0.9 ק״ג ≈ 0.9 ליטר\u003cbr>שלב 3, מוסיפים את מה ששתתה, כי המשקל ירד למרות השתייה, כלומר גם הנוזל הזה יצא: 0.9 ליטר + 0.75 ליטר = 1.65 ליטר\u003cbr>שלב 4, מורידים את השתן, כי הוא נכלל בירידת המשקל אבל אינו זיעה: 1.65 ליטר − 0.15 ליטר = 1.5 ליטר זיעה\u003cbr>שלב 5, משך בשעות: 75 דקות ÷ 60 = 1.25 שעות\u003cbr>שלב 6, קצב הזעה: 1.5 ליטר ÷ 1.25 שעות = 1.2 ליטר לשעה\u003cbr>שלב 7, אחוז הירידה ממשקל הגוף: 0.9 ק״ג ÷ 68.4 ק״ג × 100 ≈ 1.3%\u003cbr>שלב 8, השוואה ל\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":39}'>שקופית \u003cbdi>39\u003c/bdi>\u003c/button>: 1.3% הוא מתחת ל־2%, כלומר לפי המדרג עוד אין פגיעה בביצועים.\u003cbr>שלב 9, החזר אחרי האימון לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":42}'>שקופית \u003cbdi>42\u003c/bdi>\u003c/button> (אם צריך התאוששות מהירה): 0.9 ק״ג × 1.5 ליטר/ק״ג = 1.35 ליטר\u003c/p>\u003cp>\u003cstrong>התוצאה:\u003c/strong> איבוד זיעה של כ־1.5 ליטר, בקצב של כ־1.2 ליטר לשעה. שימי לב: לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":40}'>שקופית \u003cbdi>40\u003c/bdi>\u003c/button> המספר נכון רק למאמץ ולתנאי סביבה דומים.\u003c/p>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"beyond-chip\">הבהרה מדעית מעבר למצגת\u003c/span> ההנחה ש־1 ק״ג ≈ 1 ליטר והתיקון לשתייה ולשתן הם כללי חישוב מקובלים; \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":40}'>שקופית \u003cbdi>40\u003c/bdi>\u003c/button> אומרת רק שהשקילה לפני ואחרי מאפשרת לחשב את אובדן הנוזלים. · \u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":39}'>\u003cbdi>39\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":40}'>\u003cbdi>40\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":42}'>\u003cbdi>42\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"40\" data-title=\"5. איך מעריכים איבוד נוזלים במאמץ?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N05-6\">\u003ch2 class=\"part\">6. שתייה לפני, במהלך ואחרי הפעילות\u003c/h2>\n\u003cp>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":41}'>שקופיות \u003cbdi>41–43\u003c/bdi>\u003c/button> מציגות כללי אצבע לעיתוי שתייה ולסוג המשקה. ההנחיות שם נועדו להמחיש שהצרכים משתנים לפי עומס, סביבה ומאפיינים אישיים. חשוב במיוחד לזכור שבמאמץ ממושך יש צורך לחשוב גם על אלקטרוליטים ופחמימות, ולא רק על מים. המצגת מזכירה משקה ספורט בריכוז 4%–8% פחמימות במאמצים ארוכים. פירוש הריכוז הוא \u003cstrong>4–8 גרם פחמימות לכל 100 מ״ל משקה\u003c/strong>, כלומר 20–40 גרם ב־500 מ״ל.\u003c/p>\n\u003caside class=\"gnote warn\">\u003cspan class=\"tag\">אזהרה בהקשר לימודי\u003c/span>\u003cdiv>\u003cp>המטרה איננה ״לשתות כמה שיותר״. יש הבדל בין התאמה להפסדים לבין שתיית יתר מסוכנת. הימנעו מהצגת כלל שתייה גורף כהוראה רפואית.\u003c/p>\u003c/div>\u003c/aside>\n\u003cfigure class=\"slidefig\">\u003cbutton class=\"zoom\" data-act=\"zoomSlide\" data-args='{\"n\":43}' aria-label=\"הגדלת שקופית 43\">\u003cimg src=\"images/slide_43.webp\" alt=\"שקופית 43: סוגי משקאות במהלך מאמץ\" loading=\"lazy\" width=\"1440\" height=\"810\">\u003c/button>\n    \u003cfigcaption>\u003cspan>\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":43}'>שקופית \u003cbdi>43\u003c/bdi>\u003c/button>: סוגי משקאות במהלך מאמץ\u003c/span>\u003cspan class=\"credit\">מתוך מצגת הקורס ״תזונת האדם במנוחה ובמאמץ״ · לשימוש לימודי אישי\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-worked deck\" id=\"N05-A07\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">דוגמת חישוב\u003c/span>\u003cb>כללי האצבע במספרים: לפני, במהלך ואחרי\u003c/b>\u003c/div>\u003cdiv class=\"worked\">\u003cp>\u003cstrong>הנתונים (מתאמנת לדוגמה):\u003c/strong> רוכבת אופניים יוצאת לרכיבה של שעתיים. אחרי הרכיבה ירדה במשקל 1.2 ק״ג.\u003c/p>\u003cp>לפני הפעילות (כוס מים כל 30 דקות בשעתיים שלפני):\u003cbr>120 דקות ÷ 30 דקות = 4, כלומר 4 כוסות\u003c/p>\u003cp>במהלך הפעילות (0.5–1 כוס כל 20 דקות):\u003cbr>120 דקות ÷ 20 דקות = 6 פעמים\u003cbr>6 × 0.5 כוס = 3 כוסות; 6 × 1 כוס = 6 כוסות, כלומר בין 3 ל־6 כוסות\u003c/p>\u003cp>לאחר הפעילות (1.5 ליטר לכל 1 ק״ג ירידה במשקל, כשצריך התאוששות מהירה):\u003cbr>1.2 ק״ג × 1.5 ליטר/ק״ג = 1.8 ליטר\u003c/p>\u003cp>סוג המשקה: הרכיבה נמשכת יותר משעה, ולכן לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":42}'>שקופיות \u003cbdi>42–43\u003c/bdi>\u003c/button> מתאים משקה ספורט קריר עם 4–8% פחמימות ומעט מלח.\u003c/p>\u003cp>\u003cstrong>התוצאה:\u003c/strong> 4 כוסות לפני, 3–6 כוסות במהלך ו־1.8 ליטר אחרי. אלה כללי אצבע לתרגול יחידות, לא ייעוץ אישי. לפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":42}'>שקופית \u003cbdi>42\u003c/bdi>\u003c/button> מתאימים אותם לצבע השתן ולשינויי המשקל.\u003c/p>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":42}'>\u003cbdi>42\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":43}'>\u003cbdi>43\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"notebox\" data-notes=\"2\">\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"41,42,43\" data-title=\"6. שתייה לפני, במהלך ואחרי הפעילות\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\" id=\"s-N05-7\">\u003ch2 class=\"part\">7. שאלות הבנה\u003c/h2>\n\u003col>\u003cli>\u003cdetails class=\"solve\">\u003csummary>למה הזעה מסייעת בקירור?\u003c/summary>\u003cp>מפני שהתאדותה דורשת אנרגיה ומסייעת לפינוי חום מן הגוף.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>מה ההבדל בין אובדן 0.7 ק״ג ממשקל הגוף לבין אובדן זיעה של 0.7 ליטר?\u003c/summary>\u003cp>הם אינם בהכרח אותו הדבר אם הייתה שתייה או יציאה של נוזלים במהלך האימון.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>האם כאב ראש במאמץ מוכיח התייבשות?\u003c/summary>\u003cp>לא. הוא תסמין לא ספציפי ויש צורך בהקשר ובבירור מקצועי כשנדרש.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>איזו טעות יש בניסיון לפתור כל בעיית עייפות במאמץ בשתיית מים מרובה?\u003c/summary>\u003cp>הוא מתעלם מאפשרות של היפונתרמיה וגורמים רפואיים אחרים.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>איזה ידע חשוב מהטבלה ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":39}'>שקופית \u003cbdi>39\u003c/bdi>\u003c/button>?\u003c/summary>\u003cp>ההשפעה האפשרית של איבוד נוזלים על מערכת החום, הדם והביצוע, ולא הנחה שסף מדויק תקף לכולם.\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\n\u003cdiv class=\"keywords\">\u003cspan class=\"tag\">מילות מפתח\u003c/span>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;הזעה&quot;}'>הזעה\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;התאדות&quot;}'>התאדות\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;אלקטרוליט&quot;}'>אלקטרוליט\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;נתרן&quot;}'>נתרן\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;היפונתרמיה&quot;}'>היפונתרמיה\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;התייבשות&quot;}'>התייבשות\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;ריכוז פחמימות במשקה&quot;}'>ריכוז פחמימות במשקה\u003c/button>\u003cbutton class=\"kw\" data-act=\"glossSearch\" data-args='{&quot;q&quot;:&quot;אומדן איבוד זיעה&quot;}'>אומדן איבוד זיעה\u003c/button>\u003c/div>\n\u003cdiv class=\"adds\">\u003ch3 class=\"adds-h\">להעמקה\u003c/h3>\u003caside class=\"addblock k-check deck\" id=\"N05-A08\">\u003cdiv class=\"add-head\">\u003cspan class=\"tag\">בדיקת הבנה\u003c/span>\u003cb>שאלת יישום: משקל שעלה במרוץ\u003c/b>\u003c/div>\u003cdiv class=\"lcheck\" data-id=\"N05-A08\">\u003cp class=\"lc-q\">\u003cb>רצה סיימה מרוץ של 3 שעות כשמשקלה גבוה במעט ממשקלה לפני הזינוק. היא שתתה מים בלבד. מה הדאגה הסבירה ביותר לפי עקרונות הפרק?\u003c/b>\u003c/p>\u003cdiv class=\"lc-opts\">\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N05-A08\",\"i\":1}'>\u003cspan class=\"k\">א\u003c/span>\u003cspan>התייבשות של 2–4%, כי בכל מרוץ ארוך מאבדים נוזלים\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N05-A08\",\"i\":3}'>\u003cspan class=\"k\">ב\u003c/span>\u003cspan>חוסר בפחמימות בלבד, כי שתיית מים אינה משפיעה על ריכוז הנתרן\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N05-A08\",\"i\":2}'>\u003cspan class=\"k\">ג\u003c/span>\u003cspan>אין סיבה לדאגה, כי עליית משקל מוכיחה מאזן נוזלים מצוין\u003c/span>\u003c/button>\u003cbutton class=\"opt\" data-act=\"lessonCheck\" data-args='{\"id\":\"N05-A08\",\"i\":0}'>\u003cspan class=\"k\">ד\u003c/span>\u003cspan>היפונתרמיה, כי עליית המשקל מרמזת שהיא שתתה יותר ממה שאיבדה והנתרן בדמה דולל\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"lc-exp\" hidden>\u003cp>לפי היגיון השקילה ב\u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":40}'>שקופית \u003cbdi>40\u003c/bdi>\u003c/button>, עליית משקל במהלך מאמץ אומרת שנכנס יותר נוזל ממה שיצא, ולפי \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":35}'>שקופית \u003cbdi>35\u003c/bdi>\u003c/button> שתיית מים מרובה במאמץ של פחות מ־4 שעות היא הגורם השכיח להיפונתרמיה. ההתייבשות מפתה כי המרוץ ארוך, אבל התייבשות של 2–4% הייתה מתבטאת בירידה במשקל, לא בעלייה.\u003c/p>\u003c/div>\u003c/div>\n    \u003cp class=\"add-src\">\u003cspan class=\"small muted\">לפי שקופיות \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":35}'>\u003cbdi>35\u003c/bdi>\u003c/button>, \u003cbutton class=\"slref\" data-act=\"openSlide\" data-args='{\"n\":40}'>\u003cbdi>40\u003c/bdi>\u003c/button>\u003c/span>\u003c/p>\u003c/aside>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-slides=\"39\" data-title=\"7. שאלות הבנה\">\u003c/div>\u003c/section>","key":"L-N05"},{"topicId":"N06","title":"תוספי תזונה ומסייעים ארגוגניים בספורט","unit":"יחידה 06","sections":[{"id":"s-N06-1","title":"1. לפני
