// HTML5 drag-and-drop for desktop; taps and the arrow buttons cover touch and keyboard.
function wireDnD() {
  document.querySelectorAll('.term[draggable="true"]').forEach(el => {
    el.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', el.dataset.term); e.dataTransfer.effectAllowed = 'move'; });
  });
  document.querySelectorAll('.def').forEach(el => {
    el.addEventListener('dragover', e => { if (view.match && !view.match.checked) { e.preventDefault(); el.classList.add('drop'); } });
    el.addEventListener('dragleave', () => el.classList.remove('drop'));
    el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('drop'); const t = e.dataTransfer.getData('text/plain'); if (t) assignTerm(t, el.dataset.def); });
  });
  const list = $('#seqList');
  if (list && view.seq && !view.seq.checked) {
    let dragId = null;
    list.querySelectorAll('li[draggable="true"]').forEach(li => {
      li.addEventListener('dragstart', e => { dragId = li.dataset.step; li.classList.add('dragging'); e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; });
      li.addEventListener('dragend', () => li.classList.remove('dragging'));
      li.addEventListener('dragover', e => { e.preventDefault(); li.classList.add('over'); });
      li.addEventListener('dragleave', () => li.classList.remove('over'));
      li.addEventListener('drop', e => {
        e.preventDefault(); li.classList.remove('over');
        const o = view.seq.order, from = o.indexOf(dragId), to = o.indexOf(li.dataset.step);
        if (from < 0 || to < 0 || from === to) return;
        o.splice(to, 0, o.splice(from, 1)[0]);
        render();
      });
    });
  }
}
function assignTerm(t, d) {
  const ms = view.match;
  for (const k of Object.keys(ms.assign)) if (ms.assign[k] === t) delete ms.assign[k];
  ms.assign[d] = t; ms.picked = null;
  render();
}

// Four options: the target plus three distractors, preferring structures from the same figure, then the same topic.
function idOptions(t, items) {
  const bad = new Set([t.correctLabel, ...(t.excludeOptions || [])]);
  const pick = list => shuffle([...new Set(list.map(x => x.correctLabel))].filter(l => !bad.has(l)));
  const same = pick(items.filter(x => x.assetId === t.assetId));
  const topic = pick(items.filter(x => x.topicId === t.topicId));
  const rest = pick(items);
  const out = [];
  for (const l of [...same, ...topic, ...rest]) { if (out.length < 3 && !out.includes(l)) out.push(l); }
  return shuffle([t.correctLabel, ...out]);
}

    ${figureHTML(t, { markers: [{ hotspot: t.hotspot, cls: answered ? (ok ? 'ok' : 'bad') : 'pulse' }], alt: `איור: ${t.diagramCategory}. טבעת מסמנת מבנה אחד באיור.` })}
    <div class="qtext">איזה מבנה מסומן בטבעת?</div>
    <ul class="opts">${it.options.map((l, d) => {
      let cls = '', mark = '';
      if (answered) { if (l === t.correctLabel) { cls = 'correct'; mark = 'התשובה הנכונה'; } else if (l === it.sel) { cls = 'wrong'; mark = 'הבחירה שלך'; } }
      return `<li><button class="opt ${cls}" ${answered ? 'disabled' : ''} data-act="idPick" data-args='${esc(JSON.stringify({ l }))}'><span class="k">${LETTERS[d]}</span><span dir="ltr" style="text-align:right">${esc(l)}</span><span class="mark">${mark}</span></button></li>`;
    }).join('')}</ul>
    ${answered ? `<div class="feedback ${ok ? 'ok' : 'bad'}" role="status"><b class="h">${ok ? 'נכון' : 'לא נכון'}</b><span><bdi>${esc(t.correctLabel)}</bdi>${heName(t.correctLabel) ? ` (${esc(heName(t.correctLabel))})` : ''}: ${tx(t.visualHint)}</span>${srcRef(t.sourcePages)}</div>` : ''}
  </article>
  <div class="qnav">
    <button class="btn" data-act="idNav" data-args='{"d":-1}' ${q.pos === 0 ? 'disabled' : ''}>→ הקודמת</button>

  </div>`;
}

function idStudy(items) {
  const visible = items.filter(studyVisible);
  const assetIds = [...new Set(visible.map(t => t.assetId))];
  const cur = assetIds.includes(view.idAsset) ? view.idAsset : assetIds[0];
  if (!cur) return '<div class="empty">אין עדיין איורים מאושרים ללימוד.</div>';
  const here = visible.filter(t => t.assetId === cur);
  view.idRevealed = view.idRevealed || {};
  const showAll = !!view.idShowNames;
  return `<div class="asset-pick" role="group" aria-label="בחירת איור">${assetIds.map(id => `<button class="chip-btn" aria-pressed="${id === cur}" data-act="idAsset" data-args='{"id":"${id}"}'>${esc(ASSET[id].name)} (${visible.filter(t => t.assetId === id).length})</button>`).join('')}</div>
  ${figureHTML({ assetId: cur }, { view: [0, 0, 1, 1], markers: here.map((t, i) => ({ hotspot: t.hotspot, num: i + 1 })), alt: `איור: ${ASSET[cur].name}, עם ${here.length} מבנים ממוספרים.` })}
  <div class="row between"><b>המבנים המסומנים</b><button class="btn small" data-act="idShowNames" aria-pressed="${showAll}">${showAll ? 'הסתרת השמות' : 'הצגת כל השמות'}</button></div>
  <ol class="study-list">${here.map((t, i) => {
    const open = showAll || view.idRevealed[t.id];
    return `<li><span class="num">${i + 1}</span><span class="txt">${open ? `<b dir="ltr">${esc(t.correctLabel)}</b>${heName(t.correctLabel) ? ` · ${esc(heName(t.correctLabel))}` : ''}<span class="small">${tx(t.visualHint)} · ${srcRef(t.sourcePages)}</span>${t.studyOnly ? '<span class="chip bad">לימוד בלבד</span>' : ''}` : `<button class="linkbtn" data-act="idReveal" data-args='{"id":"${t.id}"}'>מה זה? הצגת השם</button>`}</span></li>`;
  }).join('')}</ol>`;
}

function idQA(items) {
  const filter = view.idQaFilter || 'all';
  const list = items.filter(t => filter === 'all' || t.status === filter);
  const sel = view.idQaSel && items.find(t => t.id === view.idQaSel);
  const where = QA.ref ? (QA.canEdit ? 'השינויים נשמרים לכל מי שפותח את הדף.' : 'אין לך הרשאת עריכה לבקרת האיכות בדף הזה; התצוגה לקריאה בלבד.') : 'השינויים נשמרים רק בדפדפן הזה. כדי שייכנסו לאתר לכולם, ייצאי את קובץ ה-QA ושלחי אותו.';
  const editable = !QA.ref || QA.canEdit;
  return `<div class="panel"><p style="margin:0">כל משימה נכנסת לתרגול רק כשהיא ״מאושר״. כאן אפשר לבדוק את מיקום הטבעת, להזיז אותה בהקשה על האיור, לשנות גודל ומצב ולהוסיף הערה.</p><p class="small muted" style="margin:0">${where}</p>
    ${!QA.ref && Object.keys(QA.local).length ? `<div class="row"><button class="btn small" data-act="qaExport">ייצוא קובץ QA (${Object.keys(QA.local).length} שינויים)</button><button class="btn small ghost" data-act="qaClearLocal">מחיקת השינויים המקומיים</button></div>` : ''}</div>
  ${sel ? qaEditor(sel, editable) : ''}
  <div class="tabs" role="tablist" aria-label="סינון לפי מצב">${[['all', 'הכול'], ...Object.entries(ID_STATUS)].map(([v, l]) => `<button role="tab" aria-selected="${filter === v}" data-act="qaFilter" data-args='{"f":"${v}"}'>${l} (${v === 'all' ? items.length : items.filter(t => t.status === v).length})</button>`).join('')}</div>
  <div class="qa-list">${list.map(t => `<button class="qa-row ${sel && sel.id === t.id ? 'on' : ''}" data-act="qaSelect" data-args='{"id":"${t.id}"}'>
    <span class="tid muted">${t.id.slice(-3)}</span><span class="txt"><b dir="ltr">${esc(t.correctLabel)}</b><span class="small muted">${t.assetId ? esc(ASSET[t.assetId]?.name || t.assetId) : 'אין איור'}</span></span>
    <span class="chip ${ID_CHIP[t.status]}">${ID_STATUS[t.status]}${t.studyOnly ? ' · לימוד' : ''}</span></button>`).join('')}</div>`;
}
function qaEditor(t, editable) {
  const d = view.qaDraft && view.qaDraft.id === t.id ? view.qaDraft : (view.qaDraft = { id: t.id, hotspot: { ...t.hotspot }, status: t.status, notes: t.reviewNotes || '' });
  const statuses = t.studyOnly ? ['blocked', 'needs_review'] : ['approved', 'needs_review', 'blocked', 'pending'];
  return `<section class="panel qa-ed" aria-labelledby="qaT">
    <div class="row between"><h2 id="qaT"><span dir="ltr">${esc(t.correctLabel)}</span> <span class="tid muted">${t.id}</span></h2><button class="btn ghost small" data-act="qaClose">סגירה</button></div>
    <p class="small" style="margin:0">רמז: ${tx(t.visualHint)} · ${srcRef(t.sourcePages)}${heName(t.correctLabel) ? ` · ${esc(heName(t.correctLabel))}` : ''}</p>
    ${t.blockedReason ? `<p class="small" style="margin:0;color:var(--bad)">${tx(t.blockedReason)}</p>` : ''}
    ${t.assetId ? figureHTML({ ...t, hotspot: d.hotspot }, { qa: editable, markers: [{ hotspot: d.hotspot, cls: 'qa' }], alt: `איור לבדיקה: ${t.correctLabel}` }) : '<div class="empty">אין איור למשימה הזו.</div>'}
    ${editable && t.assetId ? `<p class="small muted" style="margin:0">הקישי על האיור כדי להזיז את מרכז הטבעת. התצוגה כאן חתוכה בדיוק כמו בתרגול.</p>
    <label class="field"><span>גודל הטבעת</span><input type="range" id="qaR" min="0.008" max="0.1" step="0.002" value="${d.hotspot.r}"></label>` : ''}
    <label class="field"><span>מצב</span><select id="qaStatus" ${editable ? '' : 'disabled'}>${statuses.map(s => `<option value="${s}" ${d.status === s ? 'selected' : ''}>${ID_STATUS[s]}</option>`).join('')}</select></label>
    <label class="field"><span>הערת בדיקה</span><textarea id="qaNotes" style="direction:rtl;font-family:var(--f-body);min-height:70px" ${editable ? '' : 'disabled'}>${esc(d.notes)}</textarea></label>
    <p class="small muted" style="margin:0">נבדק לאחרונה: ${esc(t.reviewedBy || '—')}${t.reviewedAt ? ` · ${esc(String(t.reviewedAt).slice(0, 10))}` : ''}</p>
    ${editable ? `<div class="row"><button class="btn primary" data-act="qaSave">שמירה</button><button class="btn" data-act="qaReset">ביטול השינויים</button></div>` : ''}
  </section>`;
}
function idCredits() {
  return `<p class="small" style="margin:0">כל האיורים מ-Wikimedia Commons. הרישיון והמחבר נבדקו בדף המקור בזמן ההורדה. השינויים היחידים: הקטנה והמרה ל-WebP; בתרגול מוצג חלק מהאיור בחיתוך, בלי לערוך את הקובץ. קבצים ברישיון CC BY-SA מופצים כאן באותו רישיון.</p>
  <div class="credits">${(D.assets || []).map(a => `<article class="credit-card"><img src="${esc(a.path)}" alt="${esc(a.name)}" loading="lazy">
    <div class="txt"><b>${esc(a.name)}</b><span class="small" dir="ltr">${esc(a.file)}</span><span class="small">מחבר: ${esc(a.author)}</span>
    <span class="small">רישיון: ${a.licenseUrl ? `<a href="${esc(a.licenseUrl)}" target="_blank" rel="noopener">${esc(a.license)}</a>` : esc(a.license)} · <a href="${esc(a.sourcePage)}" target="_blank" rel="noopener">דף המקור</a></span>
    <span class="small muted">גרסה בקובץ: ${esc(String(a.modified).slice(0, 10))} · נבדק: ${esc(String(a.verifiedAt).slice(0, 10))}</span></div></article>`).join('')}</div>`;
}
async function initQA(db, user) {
  try {
    QA.ref = db.doc('qa/identification');
    QA.canEdit = !!(await user.canEdit());
    QA.ref.onSnapshot(snap => { QA.remote = snap.exists ? (snap.data().items || {}) : {}; if (route === 'identify' && !view.qaDraft) render(); }, () => { QA.ref = null; });
  } catch { QA.ref = null; }
}
async function saveQA(id, override) {
  if (QA.ref && QA.canEdit) {
    const items = { ...(QA.remote || {}), [id]: override };
    QA.remote = items;
    try { await QA.ref.set({ items: JSON.parse(JSON.stringify(items)), updatedAt: nowISO() }); toast('נשמר'); }
    catch { toast('השמירה נכשלה. נסי שוב.'); }
  } else {
    QA.local[id] = override;
    try { localStorage.setItem(QA_LS, JSON.stringify(QA.local)); } catch { }
    toast('נשמר בדפדפן הזה');
  }
}

VIEWS.listen = () => {
  const ready = D.episodes.filter(e => e.src || S.listenLinks[e.id]).length;
  const withAudio = D.episodes.filter(e => e.src).length;
  const total = D.episodes.reduce((a, e) => a + (e.durationSec || 0), 0);
  const heard = D.episodes.filter(e => S.listened[e.id]).length;
  return `<div class="page-head"><span class="eyebrow">פודקאסט NotebookLM · ${D.episodes.length} פרקים${total ? ` · כ-${Math.round(total / 60)} דקות` : ''}</span><h1>להאזין</h1>
  <p class="lede">${withAudio === D.episodes.length ? `פרקי שמע שהופקו מחומר הקורס. אפשר להאזין כאן ישירות, גם בטלפון. סומנו ${heard} מתוך ${D.episodes.length} כפרקים שהואזנו.` : 'חלק מקובצי השמע עוד לא צורפו לאתר. לפרק בלי קובץ אפשר להדביק קישור (למשל מ-Google Drive), והקישור יישמר אצלך.'}</p></div>
  ${withAudio < D.episodes.length ? `<div class="panel ${ready ? 'tint' : 'warmtint'}"><b>${ready} מתוך ${D.episodes.length} פרקים מוכנים</b></div>` : ''}
  ${D.episodes.map(e => {
    const link = S.listenLinks[e.id];
    const editing = view.listenEdit === e.id;
    return `<article class="ep">
      <div class="row between"><span class="n">פרק ${String(e.n).padStart(2, '0')}</span>${e.src && e.durationSec ? `<span class="counter">${fmtDur(e.durationSec)}</span>` : `<span class="chip ${link ? 'ok' : ''}">${link ? 'מוכן' : 'לא נוסף'}</span>`}</div>
      <h3>${e.title ? tx(e.title) : `פרק ${e.n} מתוך ${D.episodes.length}`}</h3>
      ${e.topicId ? `<div class="row">${topicChip(e.topicId)}</div>` : ''}
      ${e.src ? `<audio controls preload="none" src="${esc(e.src)}" data-ep="${e.id}" aria-label="נגן: ${esc(e.title || 'פרק ' + e.n)}"></audio><p class="small" data-ep-err="${e.id}" hidden style="margin:0;color:var(--bad)">הקובץ לא נטען כאן.</p>` : ''}
      ${!e.src && link && !editing ? `<div class="row"><a class="btn small primary" href="${esc(link)}" target="_blank" rel="noopener">פתיחת הפרק ↗</a><button class="btn small ghost" data-act="listenEdit" data-args='{"id":"${e.id}"}'>עריכת הקישור</button><button class="btn small ghost" data-act="listenRemove" data-args='{"id":"${e.id}"}'>הסרה</button></div>` : ''}
      ${!e.src && (!link || editing) ? `<form class="row" data-listen-form="${e.id}" onsubmit="return false"><input type="text" id="link-${e.id}" inputmode="url" placeholder="https://…" value="${esc(link || '')}" aria-label="קישור לפרק ${e.n}" style="flex:1;min-width:0"><button class="btn small" data-act="listenSave" data-args='{"id":"${e.id}"}'>שמירה</button></form>` : ''}
      ${e.src || link ? `<div class="checks"><label><input type="checkbox" id="heard-${e.id}" data-act-change="listened" data-ep="${e.id}" ${S.listened[e.id] ? 'checked' : ''}> הואזן</label></div>` : ''}
    </article>`;
  }).join('')}`;
};

    if (a.r === 'unknown' && (cs.requeued[id] || 0) < 2) { cs.requeued[id] = (cs.requeued[id] || 0) + 1; cs.queue.splice(Math.min(cs.pos + 4, cs.queue.length), 0, id); }

    if (!s) { msg.innerHTML = '<p class="small" style="color:var(--bad);margin:0">זה לא נראה כמו קובץ גיבוי של אתר האנטומיה (חסר schemaVersion 1, או שזה גיבוי של אתר אחר).</p>'; return; }
    view.pendingImport = s;
    msg.innerHTML = `<div class="panel warmtint"><p style="margin:0">בגיבוי: ${s.mcqAttempts.length} תשובות אמריקאיות, ${s.motionAttempts.length} תשובות תנועה, ${Object.keys(s.flashcards).length} כרטיסיות מדורגות, ${s.examResults.length} מבחנים, ${s.completedLessons.length} פרקים שנלמדו${s.updatedAt ? ` · עדכון אחרון ${fmtDateTime(s.updatedAt)}` : ''}.</p>
      <p class="small" style="margin:0">הייבוא יחליף את ההתקדמות הנוכחית.</p><div class="row"><button class="btn primary" data-act="importApply">החלפה בגיבוי</button><button class="btn" data-act="importCancel">ביטול</button></div></div>`;
  },
  importApply: () => { S = view.pendingImport; view.pendingImport = null; resetViews(); commit(); render(); toast('הגיבוי שוחזר'); },
  importCancel: () => { view.pendingImport = null; $('#backupArea').innerHTML = ''; },
  resetAsk: () => openSheet(`<h2 id="sheetTitle">לאפס את כל ההתקדמות?</h2><p>כל התשובות, דירוגי הכרטיסיות, המבחנים, הסימונים וקישורי הפודקאסט יימחקו${store.remote === 'on' ? ', גם מהשמירה בחשבון' : ''}. מומלץ לייצא גיבוי לפני כן.</p>
    <div class="row"><button class="btn danger" data-act="resetYes">איפוס</button><button class="btn" data-act="closeSheet">ביטול</button></div>`, '.btn:not(.danger)'),
  resetYes: () => { S = blankState(); resetViews(); commit(); closeSheet(); go('home'); toast('ההתקדמות אופסה'); },
};
function resetViews() { for (const k of Object.keys(view)) delete view[k]; }

// Delegated events: clicks carry data-act + JSON data-args; form controls update the current screen's form state.
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault();
  let args = {};
  try { args = el.dataset.args ? JSON.parse(el.dataset.args) : {}; } catch { }
  fn(args, el, e);
});
document.addEventListener('click', e => {
  const fig = e.target.closest('[data-qa-fig]'); if (!fig || !view.qaDraft) return;
  const t = D.identification.find(x => x.id === fig.dataset.qaFig); const [x0, y0, x1, y1] = t.view;
  const b = fig.getBoundingClientRect();
  view.qaDraft.hotspot.x = x0 + (e.clientX - b.left) / b.width * (x1 - x0);
  view.qaDraft.hotspot.y = y0 + (e.clientY - b.top) / b.height * (y1 - y0);
  view.qaDraft.notes = $('#qaNotes')?.value ?? view.qaDraft.notes; view.qaDraft.status = $('#qaStatus')?.value || view.qaDraft.status;
  render();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.actChange === 'listened') { S.listened[el.dataset.ep] = el.checked; commit(); return; }
  if (el.dataset.actChange === 'identifySeen') { S.identifySeen[el.dataset.id] = el.checked; commit(); return; }
  if (el.id === 'glossTopic') { view.glossTopic = el.value; $('#glossList').innerHTML = glossListHTML(); return; }
  if (el.id === 'qaStatus' || el.id === 'qaNotes') { if (view.qaDraft) view.qaDraft[el.id === 'qaStatus' ? 'status' : 'notes'] = el.value; return; }
  const form = el.closest('[data-form]'); if (!form) return;
  const fd = new FormData(form);
  const kind = form.dataset.form;
  if (kind === 'cards') view.cardForm = { topic: fd.get('cardTopic'), mode: fd.get('cardMode'), size: fd.get('cardSize'), mix: fd.get('cardMix') === 'on' };
  if (kind === 'practice' || kind === 'motion') view[kind + 'Form'] = { topic: fd.get(kind + 'Topic'), diff: fd.get(kind + 'Diff'), size: fd.get(kind + 'Size'), pool: fd.get(kind + 'Pool') };
  if (kind === 'exam') view.examForm = { size: fd.get('exSize'), time: fd.get('exTime'), topics: fd.getAll('exTopic') };
  if (kind === 'idq') view.idForm = { topic: fd.get('idTopic'), size: fd.get('idSize'), pool: fd.get('idPool') };
  if (kind === 'atlas') { view.atlasForm = { topic: fd.get('atTopic'), mode: fd.get('atMode'), hide: fd.get('atHide') || view.atlasForm.hide }; view.atlasShown = {}; }
  const id = el.id || el.name, val = el.value;
  render();
  const again = document.getElementById(id) || document.querySelector(`[name="${el.name}"][value="${CSS.escape(val)}"]`);
  if (again) again.focus({ preventScroll: true });
});
// Glossary search updates only the result list, so the field keeps focus while typing.
document.addEventListener('input', e => {
  if (e.target.id === 'glossQ') { view.glossQ = e.target.value; $('#glossList').innerHTML = glossListHTML(); }
  if (e.target.id === 'qaR' && view.qaDraft) { view.qaDraft.hotspot.r = +e.target.value; const m = document.querySelector('.idfig.qa .hs'); const t = D.identification.find(x => x.id === view.qaDraft.id); if (m && t) { const [x0, , x1] = t.view; m.style.width = (2 * view.qaDraft.hotspot.r / (x1 - x0) * 100) + '%'; } }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.closest('[data-listen-form]')) { e.preventDefault(); ACT.listenSave({ id: e.target.closest('[data-listen-form]').dataset.listenForm }); }
});
document.addEventListener('toggle', e => { if (e.target.dataset?.actToggle === 'examMap') view.examMapOpen = e.target.open; }, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  if (route === 'cards' && view.cards && !view.cards.done && !e.target.closest('input,select,textarea,button,a')) {
    if (e.key === ' ' && !view.cards.flipped) { e.preventDefault(); ACT.flipCard(); }
    else if (view.cards.flipped && ['1', '2', '3'].includes(e.key)) ACT.rateCard({ r: ['unknown', 'almost', 'known'][+e.key - 1] });
  }
});
window.addEventListener('hashchange', () => { const r = location.hash.slice(1); if (r && r !== route && ROUTES[r]) go(r); });

// ---------- boot ----------
(function boot() {
  const h = location.hash.slice(1);
  route = ROUTES[h] ? h : 'home';
  renderStatus();
  render();
  initRemote();
})();

</script>
</body></html>
