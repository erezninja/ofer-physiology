<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>לומדים אנטומיה שלד השריר עם עפר</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="מרכז לימוד אינטראקטיבי לאנטומיה של מערכת השלד והשריר">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app shell — sticky top bar, side nav from 960px, bottom tab bar on phones; one reading column up to 780px. */
:root {
  --bg: #f3f6f5;
  --surface: #ffffff;
  --surface-2: #eaf1ee;
  --ink: #12302a;
  --ink-2: #4a605b;
  --ink-3: #6f827d;
  --line: #d6e1dd;
  --accent: #0f6b5c;
  --accent-ink: #0b5649;
  --accent-soft: #dcefe9;
  --on-accent: #ffffff;
  --warm: #b85c1e;
  --warm-soft: #fbece0;
  --reco-eyebrow: #f4a873;
  --ok: #1d7446;
  --ok-soft: #e1f3e8;
  --bad: #b1352c;
  --bad-soft: #fbe6e3;
  --flag: #8a5a00;
  --flag-soft: #fbf0d6;
  --sys-p: #c7621d;
  --sys-g: #a33a6f;
  --sys-a: #1f6aa5;
  --sys-t: #0f6b5c;
  --shadow: 0 1px 2px rgb(18 48 42 / .06), 0 4px 14px rgb(18 48 42 / .06);
  --f-display: "Frank Ruhl Libre", "David", "Times New Roman", serif;
  --f-body: "IBM Plex Sans Hebrew", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  --r: 14px;
  --r-s: 10px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1715; --surface: #15211e; --surface-2: #1b2b27; --ink: #e2ede9; --ink-2: #a3b8b2; --ink-3: #82978f; --line: #2a3d38;
    --accent: #4dbfa5; --accent-ink: #7fd6c1; --accent-soft: #163a32; --on-accent: #062621;
    --warm: #f0a064; --warm-soft: #3a2618; --reco-eyebrow: #9a4a12; --ok: #67d095; --ok-soft: #133524; --bad: #f2877d; --bad-soft: #3d1b18;
    --flag: #f0c35a; --flag-soft: #3a2e10; --sys-p: #f0995a; --sys-g: #e277ad; --sys-a: #6fb1e8; --sys-t: #4dbfa5;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1715; --surface: #15211e; --surface-2: #1b2b27; --ink: #e2ede9; --ink-2: #a3b8b2; --ink-3: #82978f; --line: #2a3d38;
  --accent: #4dbfa5; --accent-ink: #7fd6c1; --accent-soft: #163a32; --on-accent: #062621;
  --warm: #f0a064; --warm-soft: #3a2618; --reco-eyebrow: #9a4a12; --ok: #67d095; --ok-soft: #133524; --bad: #f2877d; --bad-soft: #3d1b18;
  --flag: #f0c35a; --flag-soft: #3a2e10; --sys-p: #f0995a; --sys-g: #e277ad; --sys-a: #6fb1e8; --sys-t: #4dbfa5;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-ink); }
bdi { unicode-bidi: isolate; }
:focus-visible { outline: 3px solid var(--warm); outline-offset: 2px; border-radius: 6px; }
.skip { position: absolute; inset-inline-start: 8px; top: -60px; background: var(--accent); color: var(--on-accent); padding: 8px 12px; border-radius: 8px; z-index: 50; }
.skip:focus { top: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1200px; margin-inline: auto; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; text-align: start; min-width: 0; }
.brand-txt { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.brand-txt b { font-family: var(--f-display); font-size: clamp(1rem, 4.4vw, 1.2rem); font-weight: 900; letter-spacing: .01em; }
.brand-txt small { color: var(--ink-3); font-size: .75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.store-chip { flex: none; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); border-radius: 999px; padding: 4px 10px; font-size: .75rem; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; }
.store-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.store-chip[data-s="account"] .dot { background: var(--ok); }
.store-chip[data-s="local"] .dot { background: var(--flag); }
.store-chip[data-s="none"] .dot { background: var(--bad); }

.shell { max-width: 1200px; margin-inline: auto; display: grid; grid-template-columns: 1fr; }
main { min-width: 0; padding-block: 20px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main:focus { outline: none; }
.view { max-width: 780px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
.side { display: none; }
.bottom { position: fixed; inset: auto 0 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.bottom button { background: none; border: 0; min-height: var(--nav-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .72rem; color: var(--ink-3); padding: 6px 2px; }
.bottom button svg, .side button svg { width: 22px; height: 22px; }
.bottom button[aria-current="page"] { color: var(--accent-ink); font-weight: 600; }
.bottom button[aria-current="page"] svg { stroke: var(--accent); }
@media (min-width: 960px) {
  .shell { grid-template-columns: 220px 1fr; gap: 8px; }
  .side { display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); align-self: start; padding: 20px 12px; padding-right: max(12px, env(safe-area-inset-right, 0px)); }
  .side button { display: flex; align-items: center; gap: 10px; background: none; border: 0; border-radius: var(--r-s); padding: 9px 12px; text-align: start; color: var(--ink-2); font-size: .95rem; }
  .side button:hover { background: var(--surface-2); }
  .side button[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  .side hr { border: 0; border-top: 1px solid var(--line); margin: 8px 6px; }
  .bottom { display: none; }
  main { padding-bottom: 48px; }
}
.ico { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* sheet (more menu, confirmations) */
.sheet-back { position: fixed; inset: 0; background: rgb(8 20 17 / .45); z-index: 40; }
.sheet { position: fixed; z-index: 41; inset: auto 0 0; background: var(--surface); border-radius: 18px 18px 0 0; padding: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 85vh; overflow: auto; box-shadow: var(--shadow); }
@media (min-width: 700px) { .sheet { inset: 50% auto auto 50%; transform: translate(-50%, -50%); border-radius: 18px; width: min(520px, 92vw); } }
.sheet h2 { margin: 0 0 12px; font-size: 1.15rem; }
.menu-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.menu-grid button { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r-s); padding: 14px 12px; text-align: start; min-height: 56px; }
.menu-grid button svg { width: 22px; height: 22px; color: var(--accent); flex: none; }
.toast { position: fixed; z-index: 45; inset-inline: 0; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); margin-inline: auto; width: fit-content; max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: .9rem; box-shadow: var(--shadow); }
@media (min-width: 960px) { .toast { bottom: 24px; } }

/* ---------- type & generic ---------- */
h1, h2, h3, h4 { text-wrap: balance; line-height: 1.25; margin: 0; }
.page-head { display: flex; flex-direction: column; gap: 6px; }
.page-head h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(1.7rem, 5.5vw, 2.3rem); letter-spacing: -.005em; }
.page-head h1:focus { outline: none; }
.eyebrow { font-size: .78rem; font-weight: 600; color: var(--warm); letter-spacing: .04em; }
.lede { color: var(--ink-2); margin: 0; max-width: 62ch; }
.muted { color: var(--ink-3); }
.small { font-size: .85rem; }
.mono { font-family: var(--f-mono); font-size: .82em; letter-spacing: .01em; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel h2 { font-size: 1.1rem; }
.panel.tint { background: var(--accent-soft); border-color: transparent; }
.panel.warmtint { background: var(--warm-soft); border-color: transparent; }
.section-title { font-size: .8rem; font-weight: 700; color: var(--ink-3); letter-spacing: .05em; margin: 4px 0 -6px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; text-decoration: none; text-align: center; }
.btn:hover { border-color: var(--accent); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent-ink); padding-inline: 10px; }
.btn.small { min-height: 38px; padding: 6px 12px; font-size: .88rem; border-radius: 10px; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent-ink); text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }

.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: .78rem; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.t { background: var(--accent-soft); color: var(--accent-ink); }
.chip.warm { background: var(--warm-soft); color: var(--warm); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.flag { background: var(--flag-soft); color: var(--flag); }
.tid { font-family: var(--f-mono); font-size: .75rem; }

/* form controls */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span, .field legend { font-size: .85rem; font-weight: 600; color: var(--ink-2); padding: 0; }
fieldset.field { border: 0; margin: 0; padding: 0; }
select, input[type="text"], textarea { width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 8px 12px; }
textarea { min-height: 120px; font-family: var(--f-mono); font-size: .8rem; direction: ltr; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; min-width: 52px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: .92rem; }
.seg input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.seg input:focus-visible + span { outline: 3px solid var(--warm); outline-offset: 2px; }
.seg input:disabled + span { opacity: .4; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checks label { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-height: 42px; background: var(--surface); font-size: .9rem; }
.checks input { width: 18px; height: 18px; accent-color: var(--accent); }
details.explain { border: 1px dashed var(--line); border-radius: var(--r-s); padding: 10px 14px; font-size: .9rem; color: var(--ink-2); }
details.explain summary { cursor: pointer; font-weight: 600; color: var(--ink); }
details.explain p, details.explain ul { margin: 8px 0 0; }

.progressbar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progressbar > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.progressbar.warm > i { background: var(--warm); }
.counter { font-variant-numeric: tabular-nums; font-family: var(--f-mono); font-size: .85rem; color: var(--ink-2); }

/* ---------- home ---------- */
.hello { display: flex; flex-direction: column; gap: 6px; }
.hello h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(2rem, 7vw, 2.8rem); }
.reco { display: grid; gap: 12px; background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 20px; }
.reco .eyebrow { color: var(--reco-eyebrow); }
.reco h2 { font-size: 1.25rem; font-family: var(--f-display); font-weight: 700; }
.reco p { margin: 0; opacity: .85; }
.reco .btn.primary { background: var(--bg); color: var(--ink); border-color: var(--bg); justify-self: start; }
.quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.quick button { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); text-align: start; min-height: 96px; min-width: 0; }
.quick button b { font-size: 1.5rem; font-variant-numeric: tabular-nums; font-family: var(--f-display); line-height: 1; }
.quick button span { font-size: .82rem; color: var(--ink-2); line-height: 1.3; }
.quick button:hover { border-color: var(--accent); }
.topic-list { display: flex; flex-direction: column; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.topic-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 14px 16px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: start; width: 100%; }
.topic-row:last-child { border-bottom: 0; }
.topic-row:hover { background: var(--surface-2); }
.topic-row .num { font-family: var(--f-mono); font-size: .8rem; color: var(--accent-ink); background: var(--accent-soft); border-radius: 8px; padding: 4px 6px; }
.topic-row .nm { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.topic-row .nm b { font-weight: 600; font-size: .98rem; }
.topic-row .meta { font-size: .78rem; color: var(--ink-3); }
.topic-row .score { text-align: end; font-size: .8rem; color: var(--ink-2); min-width: 64px; }
.topic-row .score b { display: block; font-size: 1.05rem; color: var(--ink); font-variant-numeric: tabular-nums; }
@media (max-width: 560px) {
  .topic-row { grid-template-columns: auto 1fr; align-items: start; }
  .topic-row .score { grid-column: 2; text-align: start; min-width: 0; display: flex; gap: 6px; align-items: baseline; }
  .topic-row .score b { display: inline; }
}

/* ---------- learn ---------- */
.lesson-list { display: flex; flex-direction: column; gap: 10px; }
.lesson-item { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); text-align: start; width: 100%; }
.lesson-item:hover { border-color: var(--accent); }
.lesson-item .lbl { font-size: .78rem; font-weight: 700; color: var(--warm); }
.lesson-item h3 { font-size: 1.02rem; font-weight: 600; }
.lesson-item .meta { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .8rem; color: var(--ink-3); }
.done-mark { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; }
.done-mark.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.prose { display: flex; flex-direction: column; gap: 14px; font-size: 1.02rem; line-height: 1.75; }
.prose p, .prose ul, .prose ol { margin: 0; max-width: 66ch; }
.prose ul, .prose ol { padding-inline-start: 22px; display: flex; flex-direction: column; gap: 6px; }
.prose li .sub { color: var(--ink-3); font-size: .9rem; }
.prose h2.part { font-family: var(--f-display); font-size: 1.45rem; font-weight: 700; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
.prose h3 { font-size: 1.18rem; color: var(--accent-ink); margin-top: 6px; }
.prose h4 { font-size: 1rem; }
.prose .src { font-size: .82rem; color: var(--ink-3); margin-top: -8px; }
.gcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.gcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-s); padding: 14px; display: flex; flex-direction: column; gap: 6px; font-size: .95rem; line-height: 1.6; min-width: 0; }
.gcard h4 { color: var(--accent-ink); }
.gcard p, .gcard ul { margin: 0; }
.gstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 10px; }
.gstat { background: var(--accent-soft); border-radius: var(--r-s); padding: 14px; display: flex; flex-direction: column; gap: 2px; text-align: center; }
.gstat .v { font-family: var(--f-display); font-weight: 900; font-size: 2rem; color: var(--accent-ink); line-height: 1.1; }
.gstat .l { font-weight: 600; font-size: .9rem; }
.gstat .c { font-size: .78rem; color: var(--ink-3); }
.gnote { background: var(--warm-soft); border-radius: var(--r-s); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; font-size: .95rem; }
.gnote .tag, .gcheck .tag { font-size: .78rem; font-weight: 700; color: var(--warm); letter-spacing: .03em; }
.gnote > div { display: flex; flex-direction: column; gap: 8px; }
.gcheck { border: 1px dashed var(--warm); border-radius: var(--r-s); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.gcheck p { font-weight: 600; }
.gfig { margin: 0; background: var(--surface-2); border-radius: var(--r-s); padding: 14px; display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.gfig figcaption { font-size: .85rem; color: var(--ink-2); }
.gfig.flow ol { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; max-width: none; }
.gfig.flow li { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-weight: 600; font-size: .92rem; }
.gfig.flow li + li::before { content: "←"; color: var(--warm); margin-inline-end: 8px; font-weight: 700; }
.gfig.eq .eqn { font-family: var(--f-mono); font-size: 1.05rem; font-weight: 500; text-align: center; background: var(--surface); border-radius: 8px; padding: 10px; overflow-x: auto; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: start; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }

es.jpg","file":"1123 Muscles of the Leg that Move the Foot and Toes.jpg","author":"OpenStax","license":"CC BY 4.0","licenseUrl":"https://creativecommons.org/licenses/by/4.0","modified":"2016-07-03T17:16:02Z","verifiedAt":"2026-11-01T19:32:55.854Z"}],"lessons":[{"key":"L01","topicIds":["A01"],"label":"פרק 01","title":"מהקטן לגדול: תאים ורקמות","source":"מקור: עמ׳ 5–14","html":"\u003cp>הגוף בנוי מדרגות ארגון. כדי להבין שריר או עצם, צריך לזהות קודם מהו תא, מהי רקמה ומהו איבר.\u003c/p>\n\u003col class=\"gsteps\">\u003cli>\u003cspan class=\"sn\">01\u003c/span>\u003cspan>אטומים ומולקולות\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"sn\">02\u003c/span>\u003cspan>אברונים\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"sn\">03\u003c/span>\u003cspan>תאים\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"sn\">04\u003c/span>\u003cspan>רקמות\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"sn\">05\u003c/span>\u003cspan>איברים\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"sn\">06\u003c/span>\u003cspan>מערכות\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"sn\">07\u003c/span>\u003cspan>אורגניזם\u003c/span>\u003c/li>\u003c/ol>\n\u003cdiv class=\"gcards\">\u003cdiv class=\"gcard\">\u003ch4>שלוש הגדרות שחייבים לזכור\u003c/h4>\u003cul>\u003cli>\u003cstrong>תא:\u003c/strong> יחידת החיים הבסיסית, מכילה אברונים.\u003c/li>\u003cli>\u003cstrong>רקמה:\u003c/strong> קבוצת תאים בעלי מבנה ותפקוד משותפים.\u003c/li>\u003cli>\u003cstrong>איבר:\u003c/strong> כמה סוגי רקמות הפועלות יחד.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>אברונים מרכזיים\u003c/h4>\u003cul>\u003cli>\u003cstrong>מיטוכונדריון:\u003c/strong> אברון המשתתף ביצירת \u003cbdi>ATP\u003c/bdi>.\u003c/li>\u003cli>\u003cstrong>גרעין:\u003c/strong> מכיל \u003cbdi>DNA\u003c/bdi> ומידע גנטי.\u003c/li>\u003cli>\u003cstrong>קרום התא:\u003c/strong> מווסת מעבר חומרים.\u003c/li>\u003cli>\u003cstrong>ציטופלזמה:\u003c/strong> הנוזל והסביבה הפנימית של התא.\u003c/li>\u003cli>\u003cstrong>סיליה:\u003c/strong> מבנה דמוי ריס המסייע בהנעת חומר על פני התא.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\n\u003ch3>ארבע משפחות הרקמה\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>רקמה\u003c/th>\u003cth>התפקיד העיקרי\u003c/th>\u003cth>דוגמה\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">חיבור\u003c/th>\u003ctd>תמיכה, חיבור ועמידה בעומס\u003c/td>\u003ctd>גיד, עצם, סחוס\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">שריר\u003c/th>\u003ctd>התכווצות ויצירת כוח\u003c/td>\u003ctd>שרירי השלד\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">עצבים\u003c/th>\u003ctd>קליטת מידע והולכת אותות\u003c/td>\u003ctd>מוח, עצבים\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">חיפוי\u003c/th>\u003ctd>ציפוי, הפרשה וספיגה\u003c/td>\u003ctd>עור ובלוטות\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">לזכור\u003c/span>\u003cdiv>\u003cp>תאי גזע עובריים מתמיינים לסוגי תאים שונים; רקמת שומן שייכת למשפחת רקמות החיבור.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">בדקי את עצמך\u003c/span>\u003cp>מה ההבדל בין תא, רקמה ואיבר? למה הלב נחשב איבר ולא רקמת שריר בלבד?\u003c/p>\u003c/div>"},{"key":"L02","topicIds":["A02"],"label":"פרק 02","title":"רקמות חיבור: להבין את החומר","source":"מקור: עמ׳ 15–20","html":"\u003cp>לרקמות החיבור מאפיין משותף: תאים בתוך חומר חוץ־תאי. הרכבו קובע אם הרקמה תהיה חזקה במתיחה, גמישה או עמידה בדחיסה.\u003c/p>\n\u003cdiv class=\"gcards\">\u003cdiv class=\"gcard\">\u003ch4>ממה מורכבת רקמת חיבור?\u003c/h4>\u003cul>\u003cli>תאים היוצרים ומתחזקים את הרקמה.\u003c/li>\u003cli>סיבי \u003cstrong>קולגן\u003c/strong> המספקים עמידות במתיחה.\u003c/li>\u003cli>סיבי \u003cstrong>אלסטין\u003c/strong> התורמים לחזרה לצורה לאחר מתיחה.\u003c/li>\u003cli>\u003cstrong>\u003cbdi>Ground substance\u003c/bdi>:\u003c/strong> חומר יסוד עשיר במים ובמולקולות כמו פרוטאוגליקנים.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>שני ארגונים של רקמת חיבור\u003c/h4>\u003cul>\u003cli>\u003cstrong>אוורירית / רפה:\u003c/strong> סיבים מפוזרים והרבה חומר יסוד; מאפשרת מעבר חומרים.\u003c/li>\u003cli>\u003cstrong>צפופה:\u003c/strong> סיבים מרוכזים וצפופים, בעיקר קולגן; מיועדת לעמוד בכוחות מתיחה.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>מבנה\u003c/th>\u003cth>איזה חיבור הוא יוצר?\u003c/th>\u003cth>מה חשוב בתפקודו?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">גיד (\u003cbdi>Tendon\u003c/bdi>)\u003c/th>\u003ctd>שריר אל עצם\u003c/td>\u003ctd>העברת כוח השריר\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">רצועה (\u003cbdi>Ligament\u003c/bdi>)\u003c/th>\u003ctd>עצם אל עצם\u003c/td>\u003ctd>ייצוב והגבלת תנועה במפרק\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">קפסולה מפרקית\u003c/th>\u003ctd>מעטפת סביב מפגש העצמות\u003c/td>\u003ctd>יציבות ותיחום המפרק\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">ממברנה סינוביאלית\u003c/th>\u003ctd>השכבה הפנימית של הקפסולה\u003c/td>\u003ctd>ייצור נוזל סינוביאלי\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">טעות נפוצה\u003c/span>\u003cdiv>\u003cp>גיד ורצועה אינם אותו מבנה. הגיד מעביר כוח מהשריר; הרצועה מחברת עצמות זו לזו.\u003c/p>\u003c/div>\u003c/aside>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">שני סוגי קולגן המודגשים בחוברת\u003c/span>\u003cdiv>\u003cp>\u003cbdi>Type I\u003c/bdi> בולט בגידים, ברצועות ובעצם. \u003cbdi>Type II\u003c/bdi> מרכזי בסחוס היאליני.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">בדקי את עצמך\u003c/span>\u003cp>מה ההבדל בתפקיד בין קולגן לאלסטין? מדוע לגידים אספקת דם מוגבלת יחסית?\u003c/p>\u003c/div>"},{"key":"L03","topicIds":["A03"],"label":"פרק 03","title":"סחוס, מפרק סינוביאלי ודיסק","source":"מקור: עמ׳ 18–25","html":"\u003cp>סחוס בנוי כך שיוכל להתמודד עם עומס, לעיתים תוך חיכוך מזערי. ההבדל בין סוגי הסחוס הוא קריטי לשאלות השוואה.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>סוג\u003c/th>\u003cth>מאפיין בולט\u003c/th>\u003cth>היכן נמצא?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">היאליני (\u003cbdi>Hyaline\u003c/bdi>)\u003c/th>\u003ctd>חלק; עמיד בדחיסה; עשיר במים\u003c/td>\u003ctd>קצות עצמות, צלעות, קנה הנשימה\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">סיבי (\u003cbdi>Fibrocartilage\u003c/bdi>)\u003c/th>\u003ctd>חזק בעומסים משולבים\u003c/td>\u003ctd>מניסקוסים ודיסקים בין־חולייתיים\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">אלסטי (\u003cbdi>Elastic\u003c/bdi>)\u003c/th>\u003ctd>גמישות גבוהה יחסית\u003c/td>\u003ctd>אוזן ומבנים באזור האף\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"gcards\">\u003cdiv class=\"gcard\">\u003ch4>מהו מפרק סינוביאלי?\u003c/h4>\u003cul>\u003cli>קצות העצמות מצופים בסחוס מפרקי.\u003c/li>\u003cli>קפסולה מקיפה את חלל המפרק.\u003c/li>\u003cli>הממברנה הפנימית יוצרת נוזל סינוביאלי.\u003c/li>\u003cli>הנוזל מפחית חיכוך ומסייע בהזנת הסחוס.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>מהו דיסק בין־חולייתי?\u003c/h4>\u003cul>\u003cli>\u003cstrong>\u003cbdi>Annulus fibrosus\u003c/bdi>:\u003c/strong> טבעות סיביות חיצוניות.\u003c/li>\u003cli>\u003cstrong>\u003cbdi>Nucleus pulposus\u003c/bdi>:\u003c/strong> מרכז ג׳לטיני עשיר במים.\u003c/li>\u003cli>יחד הם מאפשרים תנועה ומסייעים בפיזור עומסים.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\n\u003ch3>עומס והסחוס המפרקי\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>מצב\u003c/th>\u003cth>משמעות\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">עומס מכני מתאים\u003c/th>\u003ctd>תורם לתחזוקת הרקמה ולחילוף החומרים\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">עומס יתר או טראומה\u003c/th>\u003ctd>עלולים לפגוע בסחוס ובמבנהו\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">היעדר תנועה ממושך\u003c/th>\u003ctd>קשור לירידה באיכות הסחוס ובעוביו\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">חשוב\u003c/span>\u003cdiv>\u003cp>לסחוס אין אספקת דם ישירה כשל עצם. מעבר חומרים בנוזל סביבו חשוב להזנתו.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">בדקי את עצמך\u003c/span>\u003cp>מהם שני החלקים של דיסק בין־חולייתי? למה מניסקוס אינו סחוס היאליני?\u003c/p>\u003c/div>"},{"key":"L04","topicIds":["A03"],"label":"פרק 04","title":"עצם: תאים, מבנה והתגרמות","source":"מקור: עמ׳ 26–36","html":"\u003cp>העצם היא רקמת חיבור חיה, עשירה במינרלים ובכלי דם. היא מגיבה לעומסים, מתחדשת ומאפשרת תנועה והגנה.\u003c/p>\n\u003cdiv class=\"gcards\">\u003cdiv class=\"gcard\">\u003ch4>שלושת תאי העצם\u003c/h4>\u003cul>\u003cli>\u003cstrong>\u003cbdi>Osteoblast\u003c/bdi>:\u003c/strong> בונה חומר עצם חדש.\u003c/li>\u003cli>\u003cstrong>\u003cbdi>Osteocyte\u003c/bdi>:\u003c/strong> תא עצם בשל שמתחזק את הרקמה.\u003c/li>\u003cli>\u003cstrong>\u003cbdi>Osteoclast\u003c/bdi>:\u003c/strong> מפרק וסופג חומר עצם במסגרת עיצוב מחדש.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>מבנה העצם\u003c/h4>\u003cul>\u003cli>\u003cstrong>\u003cbdi>Compact bone\u003c/bdi>:\u003c/strong> עצם צפופה במעטפת.\u003c/li>\u003cli>\u003cstrong>\u003cbdi>Spongy bone\u003c/bdi>:\u003c/strong> עצם ספוגית בעלת טרבקולות (\u003cbdi>Trabeculae\u003c/bdi>).\u003c/li>\u003cli>\u003cstrong>\u003cbdi>Osteon\u003c/bdi> / \u003cbdi>Haversian system\u003c/bdi>:\u003c/strong> יחידת ארגון בעצם צפופה, סביב תעלה של כלי דם ועצבים.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\n\u003ch3>חלוקת העצמות\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>צורה\u003c/th>\u003cth>דוגמה\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">ארוכות\u003c/th>\u003ctd>עצם הירך, עצם הזרוע\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">שטוחות\u003c/th>\u003ctd>שכמה, צלעות, עצמות גולגולת\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">קצרות\u003c/th>\u003ctd>חלק מעצמות שורש כף היד\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">ססמואידיות\u003c/th>\u003ctd>פיקה (\u003cbdi>Patella\u003c/bdi>)\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">בלתי סדירות\u003c/th>\u003ctd>חוליות עמוד השדרה\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>סדר ההתגרמות התוך־סחוסית בעצם ארוכה\u003c/h3>\n\u003col class=\"gsteps\">\u003cli>\u003cspan class=\"sn\">1\u003c/span>\u003cspan>מודל סחוסי\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"sn\">2\u003c/span>\u003cspan>מרכז התגרמות בדיאפיזה\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"sn\">3\u003c/span>\u003cspan>מרכזים באפיפיזות\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"sn\">4\u003c/span>\u003cspan>לוחית גדילה\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"sn\">5\u003c/span>\u003cspan>קו אפיפיזיאלי\u003c/span>\u003c/li>\u003c/ol>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">למבחן\u003c/span>\u003cdiv>\u003cp>דיאפיזה היא גוף העצם הארוכה. אפיפיזות הן קצותיה. פלטת האפיפיזה מאפשרת התארכות; קו האפיפיזה מעיד על סיום הגדילה.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">בדקי את עצמך\u003c/span>\u003cp>איזה תא מפרק עצם? מדוע טרבקולות מסודרות בהתאם לכיווני העומס?\u003c/p>\u003c/div>"},{"key":"L05","topicIds":["A04"],"label":"פרק 05","title":"רקמת שריר והסרקומר","source":"מקור: עמ׳ 37–40","html":"\u003cp>השריר מייצר כוח באמצעות מנגנונים חלבוניים. צריך לשלוט בשרשרת מהשריר השלם עד לרמת חלבוני הכיווץ.\u003c/p>\n\u003col class=\"gsteps\">\u003cli>\u003cspan class=\"sn\">01\u003c/span>\u003cspan>שריר שלם\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"sn\">02\u003c/span>\u003cspan>צרור (\u003cbdi>Fascicle\u003c/bdi>)\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"sn\">03\u003c/span>\u003cspan>סיב שריר (\u003cbdi>Muscle fiber\u003c/bdi>)\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"sn\">04\u003c/span>\u003cspan>מיופיבריל (\u003cbdi>Myofibril\u003c/bdi>)\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"sn\">05\u003c/span>\u003cspan>סרקומר\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"sn\">06\u003c/span>\u003cspan>חלבוני הכיווץ\u003c/span>\u003c/li>\u003c/ol>\n\u003cdiv class=\"gcards\">\u003cdiv class=\"gcard\">\u003ch4>מרכיבי הסרקומר\u003c/h4>\u003cul>\u003cli>\u003cstrong>\u003cbdi>Z-line\u003c/bdi>:\u003c/strong> גבול הסרקומר.\u003c/li>\u003cli>\u003cstrong>חוט דק:\u003c/strong> \u003cbdi>Actin\u003c/bdi> יחד עם \u003cbdi>Tropomyosin\u003c/bdi> ו-\u003cbdi>Troponin\u003c/bdi>.\u003c/li>\u003cli>\u003cstrong>חוט עבה:\u003c/strong> \u003cbdi>Myosin\u003c/bdi> וראשי המיוסין.\u003c/li>\u003cli>\u003cstrong>\u003cbdi>Cross-bridge\u003c/bdi>:\u003c/strong> גשר הרוחב שיוצר ראש המיוסין עם אקטין.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>עוד שני מרכיבים\u003c/h4>\u003cul>\u003cli>\u003cstrong>\u003cbdi>Sarcoplasmic reticulum\u003c/bdi>:\u003c/strong> רשת המאחסנת יוני סידן בתא השריר.\u003c/li>\u003cli>\u003cstrong>\u003cbdi>ATP\u003c/bdi>:\u003c/strong> מקור אנרגיה ישיר לפעילות מחזור הגשרים ולהרפיית השריר.\u003c/li>\u003cli>\u003cstrong>מיטוכונדריות ומאגרי גליקוגן:\u003c/strong> מקורות ותהליכים לתמיכה באספקת האנרגיה.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\n\u003cfigure class=\"gfig labels\">\u003cdiv class=\"lbl-row\" dir=\"ltr\">\u003cspan>Z\u003c/span>\u003cspan>ACTIN\u003c/span>\u003cspan>MYOSIN\u003c/span>\u003cspan>ACTIN\u003c/span>\u003cspan>Z\u003c/span>\u003c/div>\u003cfigcaption>תרשים סכמטי מקורי של גבולות הסרקומר וחלבוני הכיווץ. לא בקנה מידה.\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">בדקי את עצמך\u003c/span>\u003cp>מה ההבדל בין סיב שריר למיופיבריל? איזה חלבון קשור ל-\u003cbdi>Z-line\u003c/bdi>?\u003c/p>\u003c/div>"},{"key":"L06","topicIds":["A04"],"label":"פרק 06","title":"איך מתרחש כיווץ השריר?","source":"מקור: עמ׳ 41–43, 92","html":"\u003cp>למבחן צריך לדעת את סדר האירועים וגם את ההבדל בין סוגי כיווץ בשריר בעת אימון.\u003c/p>\n\u003col class=\"gsteps\">\u003cli>\u003cspan class=\"sn\">1\u003c/span>\u003cspan>אות חשמלי מגיע לשריר דרך העצב.\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"sn\">2\u003c/span>\u003cspan>מתרחש שחרור סידן בתוך סיב השריר.\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"sn\">3\u003c/span>\u003cspan>סידן נקשר ל-\u003cbdi>Troponin\u003c/bdi>; \u003cbdi>Tropomyosin\u003c/bdi> משנה מיקום.\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"sn\">4\u003c/span>\u003cspan>אתרי הקשירה על \u003cbdi>Actin\u003c/bdi> נחשפים.\u003c/span>\u003c/li>\u003cli>\u003cspan class=\"sn\">5\u003c/span>\u003cspan>\u003cbdi>Myosin\u003c/bdi> מתחבר, מבצע \u003cbdi>Power stroke\u003c/bdi> ומתנתק במחזור תלוי \u003cbdi>ATP\u003c/bdi>.\u003c/span>\u003c/li>\u003c/ol>\n\u003ch3>שלושה סוגי כיווץ\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>סוג\u003c/th>\u003cth>מה קורה לאורך השריר?\u003c/th>\u003cth>דוגמה מכפיפת מרפק\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">קונצנטרי\u003c/th>\u003ctd>השריר מפיק כוח ומתקצר\u003c/td>\u003ctd>הרמת משקולת לכיוון הכתף\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">אקסצנטרי\u003c/th>\u003ctd>השריר מפיק כוח ומתארך\u003c/td>\u003ctd>הורדה מבוקרת של המשקולת\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">איזומטרי\u003c/th>\u003ctd>השריר מפיק כוח ללא שינוי משמעותי באורך\u003c/td>\u003ctd>החזקת המשקולת ללא תנועה\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">הבחנה חשובה\u003c/span>\u003cdiv>\u003cp>התקצרות הסרקומר נוצרת מהחלקה של חוטי האקטין והמיוסין זה על פני זה, לא מהתקצרות של החלבונים עצמם.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">בדקי את עצמך\u003c/span>\u003cp>לאיזה חלבון נקשר סידן? מה משמעות \u003cbdi>Power stroke\u003c/bdi>? באיזה כיווץ השריר מתארך למרות שהוא פעיל?\u003c/p>\u003c/div>"},{"key":"L07","topicIds":["A05"],"label":"פרק 07","title":"השפה האנטומית ומישורי הגוף","source":"מקור: עמ׳ 44–45","html":"\u003cp>כל מיקום ותנועה מתוארים מנקודת ייחוס אחת: תנוחה אנטומית. עומדים זקוף, הפנים קדימה, הזרועות בצדי הגוף וכפות הידיים לפנים.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>מונח\u003c/th>\u003cth>פירוש\u003c/th>\u003cth>דוגמה\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Superior\u003c/bdi> / \u003cbdi>Inferior\u003c/bdi>\u003c/th>\u003ctd>עליון / תחתון\u003c/td>\u003ctd>העיניים מעל הסנטר\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Anterior\u003c/bdi> / \u003cbdi>Posterior\u003c/bdi>\u003c/th>\u003ctd>קדמי / אחורי\u003c/td>\u003ctd>עצם החזה קדמית לשכמות\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Medial\u003c/bdi> / \u003cbdi>Lateral\u003c/bdi>\u003c/th>\u003ctd>קרוב לקו האמצע / רחוק ממנו\u003c/td>\u003ctd>עמוד השדרה מדיאלי לכתף\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Proximal\u003c/bdi> / \u003cbdi>Distal\u003c/bdi>\u003c/th>\u003ctd>קרוב לגו / רחוק מהגו\u003c/td>\u003ctd>המרפק פרוקסימלי לשורש כף היד\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Superficial\u003c/bdi> / \u003cbdi>Deep\u003c/bdi>\u003c/th>\u003ctd>שטחי / עמוק\u003c/td>\u003ctd>העור שטחי לשרירי הבטן\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"gcards\">\u003cdiv class=\"gcard\">\u003ch4>\u003cbdi>Sagittal\u003c/bdi> / \u003cbdi>Median\u003c/bdi>\u003c/h4>\u003cp>חלוקה לימין ולשמאל. המישור המרכזי מחלק לשני חצאים.\u003c/p>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>\u003cbdi>Frontal\u003c/bdi> / \u003cbdi>Coronal\u003c/bdi>\u003c/h4>\u003cp>חלוקה לקדמי ואחורי.\u003c/p>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>\u003cbdi>Transverse\u003c/bdi>\u003c/h4>\u003cp>חלוקה לעליון ותחתון.\u003c/p>\u003c/div>\u003c/div>\n\u003ch3>מילון תנועות מהיר\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>בעברית\u003c/th>\u003cth>באנגלית\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">כפיפה / פשיטה\u003c/th>\u003ctd>\u003cbdi>Flexion\u003c/bdi> / \u003cbdi>Extension\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">הרחקה / קירוב\u003c/th>\u003ctd>\u003cbdi>Abduction\u003c/bdi> / \u003cbdi>Adduction\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">סיבוב פנימי / חיצוני\u003c/th>\u003ctd>\u003cbdi>Internal\u003c/bdi> / \u003cbdi>External rotation\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">הרמה / הורדה\u003c/th>\u003ctd>\u003cbdi>Elevation\u003c/bdi> / \u003cbdi>Depression\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">גב כף הרגל מעלה / עמידה על בהונות\u003c/th>\u003ctd>\u003cbdi>Dorsiflexion\u003c/bdi> / \u003cbdi>Plantarflexion\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">פרונציה / סופינציה\u003c/th>\u003ctd>\u003cbdi>Pronation\u003c/bdi> / \u003cbdi>Supination\u003c/bdi>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">בדקי את עצמך\u003c/span>\u003cp>באיזה מישור תתואר כפיפת מרפק? איזו תנועה מבצעים כשעולים על קצות האצבעות?\u003c/p>\u003c/div>"},{"key":"L08","topicIds":["A06"],"label":"פרק 08","title":"שלד הציר ועמוד השדרה","source":"מקור: עמ׳ 46–66","html":"\u003cp>השלד מתחלק לשלד הציר ולשלד התוספת. עמוד השדרה משלב נשיאת עומס, הגנה על חוט השדרה ותנועתיות מבוקרת.\u003c/p>\n\u003cdiv class=\"gcards\">\u003cdiv class=\"gcard\">\u003ch4>\u003cbdi>Axial skeleton\u003c/bdi>\u003c/h4>\u003cul>\u003cli>גולגולת (\u003cbdi>Skull\u003c/bdi>).\u003c/li>\u003cli>עמוד השדרה (\u003cbdi>Vertebral column\u003c/bdi>).\u003c/li>\u003cli>כלוב בית החזה והצלעות.\u003c/li>\u003cli>עצם הלשון (\u003cbdi>Hyoid\u003c/bdi>).\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>\u003cbdi>Appendicular skeleton\u003c/bdi>\u003c/h4>\u003cul>\u003cli>חגורת הכתפיים והגפיים העליונות.\u003c/li>\u003cli>חגורת האגן והגפיים התחתונות.\u003c/li>\u003cli>המפרקים שבין החלקים מאפשרים תנועות רחבות.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\n\u003cdiv class=\"gstats\">\u003cdiv class=\"gstat\">\u003cspan class=\"v\" dir=\"ltr\">7\u003c/span>\u003cspan class=\"l\">צוואריות\u003c/span>\u003cspan class=\"c\">\u003cbdi>Cervical\u003c/bdi>\u003c/span>\u003c/div>\u003cdiv class=\"gstat\">\u003cspan class=\"v\" dir=\"ltr\">12\u003c/span>\u003cspan class=\"l\">חזיות\u003c/span>\u003cspan class=\"c\">\u003cbdi>Thoracic\u003c/bdi>\u003c/span>\u003c/div>\u003cdiv class=\"gstat\">\u003cspan class=\"v\" dir=\"ltr\">5\u003c/span>\u003cspan class=\"l\">מותניות\u003c/span>\u003cspan class=\"c\">\u003cbdi>Lumbar\u003c/bdi>\u003c/span>\u003c/div>\u003cdiv class=\"gstat\">\u003cspan class=\"v\" dir=\"ltr\">5\u003c/span>\u003cspan class=\"l\">סקרליות\u003c/span>\u003cspan class=\"c\">\u003cbdi>Sacrum\u003c/bdi>, מאוחות\u003c/span>\u003c/div>\u003cdiv class=\"gstat\">\u003cspan class=\"v\" dir=\"ltr\">4\u003c/span>\u003cspan class=\"l\">עצם הזנב\u003c/span>\u003cspan class=\"c\">\u003cbdi>Coccyx\u003c/bdi>, לרוב מאוחות\u003c/span>\u003c/div>\u003c/div>\n\u003ch3>מה צריך לזהות בחוליה?\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>מבנה\u003c/th>\u003cth>תפקיד / זיהוי\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Vertebral body\u003c/bdi>\u003c/th>\u003ctd>חלק קדמי נושא משקל\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Vertebral foramen\u003c/bdi>\u003c/th>\u003ctd>הנקב שבו עובר חוט השדרה\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Spinous process\u003c/bdi>\u003c/th>\u003ctd>זיז אחורי המשמש אחיזה\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Transverse processes\u003c/bdi>\u003c/th>\u003ctd>זיזים צידיים\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Articular processes\u003c/bdi>\u003c/th>\u003ctd>משטחים היוצרים מפרקים עם חוליות סמוכות\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">זוג שחייבים להבדיל\u003c/span>\u003cdiv>\u003cp>\u003cbdi>Atlas\u003c/bdi> = \u003cbdi>C1\u003c/bdi>, תורמת לנשיאת הגולגולת; \u003cbdi>Axis\u003c/bdi> = \u003cbdi>C2\u003c/bdi> ובה זיז \u003cbdi>Dens\u003c/bdi> המעורב בתנועת סיבוב הראש.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">בדקי את עצמך\u003c/span>\u003cp>מה ההבדל בין לורדוזה לקיפוזה? מדוע גופי החוליות המותניות גדולים?\u003c/p>\u003c/div>"},{"key":"L09","topicIds":["A07","A06"],"label":"פרק 09","title":"בית החזה וחגורת הכתפיים","source":"מקור: עמ׳ 63–75","html":"\u003cp>זהו אזור שבו חשוב להבין גם עצמות וגם מפרקים, ולא רק לשנן שמות.\u003c/p>\n\u003cdiv class=\"gcards\">\u003cdiv class=\"gcard\">\u003ch4>כלוב בית החזה\u003c/h4>\u003cul>\u003cli>12 זוגות צלעות (24 צלעות).\u003c/li>\u003cli>\u003cbdi>Sternum\u003c/bdi>: \u003cbdi>Manubrium\u003c/bdi>, גוף עצם החזה ו-\u003cbdi>Xiphoid process\u003c/bdi>.\u003c/li>\u003cli>החיבור הקדמי הסחוסי של הצלעות תורם לגמישות בית החזה.\u003c/li>\u003cli>הסרעפת היא שריר מרכזי בשאיפה.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>חגורת הכתפיים\u003c/h4>\u003cul>\u003cli>\u003cstrong>\u003cbdi>Scapula\u003c/bdi>:\u003c/strong> השכמה, כולל \u003cbdi>Acromion\u003c/bdi>, \u003cbdi>Spine\u003c/bdi> ו-\u003cbdi>Coracoid process\u003c/bdi>.\u003c/li>\u003cli>\u003cstrong>\u003cbdi>Clavicle\u003c/bdi>:\u003c/strong> עצם הבריח, המקשרת את השכמה לשלד הציר.\u003c/li>\u003cli>\u003cstrong>\u003cbdi>Glenoid fossa\u003c/bdi>:\u003c/strong> שקע השכמה למפרק הכתף.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>מפרק\u003c/th>\u003cth>מבנים משתתפים\u003c/th>\u003cth>מאפיין\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Glenohumeral\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Scapula\u003c/bdi> + \u003cbdi>Humerus\u003c/bdi>\u003c/td>\u003ctd>תנועה רחבה של הכתף\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Acromioclavicular\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Acromion\u003c/bdi> + \u003cbdi>Clavicle\u003c/bdi>\u003c/td>\u003ctd>חיבור בקצה הכתף\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Sternoclavicular\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Sternum\u003c/bdi> + \u003cbdi>Clavicle\u003c/bdi>\u003c/td>\u003ctd>חיבור חגורת הכתפיים לשלד הציר\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Scapulothoracic\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Scapula\u003c/bdi> על בית החזה\u003c/td>\u003ctd>ממשק תפקודי, אינו מפרק סינוביאלי\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">זיהוי חזותי\u003c/span>\u003cdiv>\u003cp>בחוברת המקורית בעמודים 67–75 מופיעים מבטים שונים של השכמה, הבריח, עצם הזרוע ועצמות האמה. חזרי לזהות את אותן עצמות גם בלי הכיתובים.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">בדקי את עצמך\u003c/span>\u003cp>מה ההבדל בין \u003cbdi>Acromion\u003c/bdi> לבין \u003cbdi>Glenoid fossa\u003c/bdi>? איזו עצם יוצרת מפרק עם עצם החזה?\u003c/p>\u003c/div>"},{"key":"L10","topicIds":["A07"],"label":"פרק 10","title":"הגף העליון: עצמות ונקודות אחיזה","source":"מקור: עמ׳ 72–75","html":"\u003cp>במבחן משלבים לעיתים שאלות שריר עם נקודת האחז שלו, לכן חשוב ללמוד יחד את העצם והשריר המתחבר אליה.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>מבנה בעצם\u003c/th>\u003cth>באיזו עצם?\u003c/th>\u003cth>מה מתחבר אליו / חשיבותו\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Greater tubercle\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Humerus\u003c/bdi>\u003c/td>\u003ctd>\u003cbdi>Infraspinatus\u003c/bdi>, \u003cbdi>Teres minor\u003c/bdi>, \u003cbdi>Supraspinatus\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Lesser tubercle\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Humerus\u003c/bdi>\u003c/td>\u003ctd>\u003cbdi>Subscapularis\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Deltoid tuberosity\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Humerus\u003c/bdi>\u003c/td>\u003ctd>\u003cbdi>Deltoid\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Radial tuberosity\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Radius\u003c/bdi>\u003c/td>\u003ctd>\u003cbdi>Biceps brachii\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Ulnar tuberosity\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Ulna\u003c/bdi>\u003c/td>\u003ctd>\u003cbdi>Brachialis\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Olecranon\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Ulna\u003c/bdi>\u003c/td>\u003ctd>\u003cbdi>Triceps brachii\u003c/bdi>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"gcards\">\u003cdiv class=\"gcard\">\u003ch4>עצמות האמה\u003c/h4>\u003cul>\u003cli>\u003cstrong>\u003cbdi>Radius\u003c/bdi>:\u003c/strong> לטרלית בתנוחה אנטומית, בצד האגודל.\u003c/li>\u003cli>\u003cstrong>\u003cbdi>Ulna\u003c/bdi>:\u003c/strong> מדיאלית, בצד הזרת.\u003c/li>\u003cli>תנועות \u003cbdi>Pronation\u003c/bdi> ו-\u003cbdi>Supination\u003c/bdi> נעשות במפרקים בין שתי העצמות.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>מפרק המרפק\u003c/h4>\u003cul>\u003cli>\u003cbdi>Humerus\u003c/bdi> + \u003cbdi>Radius\u003c/bdi> + \u003cbdi>Ulna\u003c/bdi>.\u003c/li>\u003cli>כולל תת־מפרקים ויחד איתם מפרק \u003cbdi>Radioulnar\u003c/bdi> פרוקסימלי.\u003c/li>\u003cli>מאפשר כפיפה, פשיטה, פרונציה וסופינציה של האמה.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">זיכרון קצר\u003c/span>\u003cdiv>\u003cp>ה־\u003cbdi>Biceps\u003c/bdi> נאחז ברדיוס; ה־\u003cbdi>Brachialis\u003c/bdi> באולנה; ה־\u003cbdi>Triceps\u003c/bdi> באולקרנון של האולנה.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">בדקי את עצמך\u003c/span>\u003cp>על איזו עצם נמצא \u003cbdi>Olecranon\u003c/bdi>? מה מבדיל בין \u003cbdi>Radius\u003c/bdi> ל-\u003cbdi>Ulna\u003c/bdi> במנח אנטומי?\u003c/p>\u003c/div>"},{"key":"L11","topicIds":["A08"],"label":"פרק 11","title":"שרירי הכתף והשכמה","source":"מקור: עמ׳ 77–87","html":"\u003cp>לכל שריר למדי: שם באנגלית, אזור מוצא, נקודת אחז ופעולה. להלן טבלת פעולות מסכמת, עם נקודות אחיזה נבחרות.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>שריר\u003c/th>\u003cth>מוצא ← אחז (בקיצור)\u003c/th>\u003cth>פעולות מרכזיות\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Trapezius\u003c/bdi>\u003c/th>\u003ctd>גולגולת/חוליות ← \u003cbdi>Clavicle\u003c/bdi> ו-\u003cbdi>Scapula\u003c/bdi>\u003c/td>\u003ctd>קירוב שכמות; עליון מרים, תחתון מוריד; סיבוב מעלה\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Rhomboids\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>C7–T5\u003c/bdi> ← גבול מדיאלי \u003cbdi>Scapula\u003c/bdi>\u003c/td>\u003ctd>קירוב שכמות וסיבוב מטה\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Serratus anterior\u003c/bdi>\u003c/th>\u003ctd>צלעות 1–8 ← גבול מדיאלי \u003cbdi>Scapula\u003c/bdi>\u003c/td>\u003ctd>הרחקת שכמות, סיבוב מעלה והצמדת שכמה\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Latissimus dorsi\u003c/bdi>\u003c/th>\u003ctd>גב תחתון/אגן/צלעות ← \u003cbdi>Humerus\u003c/bdi>\u003c/td>\u003ctd>פשיטת כתף, קירוב ורוטציה פנימית\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Deltoid\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Clavicle/Acromion/Spine\u003c/bdi> ← \u003cbdi>Humerus\u003c/bdi>\u003c/td>\u003ctd>הרחקת כתף; חלק קדמי כפיפה, אחורי פשיטה\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Pectoralis major\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Clavicle/Sternum\u003c/bdi>/צלעות ← \u003cbdi>Humerus\u003c/bdi>\u003c/td>\u003ctd>קירוב אופקי; עליון כפיפה, תחתון פשיטה/קירוב\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>\u003cbdi>Rotator cuff\u003c/bdi>: ארבעה מייצבים\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>שריר\u003c/th>\u003cth>פעולה עיקרית לפי החוברת\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Supraspinatus\u003c/bdi>\u003c/th>\u003ctd>הרחקת כתף וייצוב\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Infraspinatus\u003c/bdi>\u003c/th>\u003ctd>רוטציה חיצונית וייצוב\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Teres minor\u003c/bdi>\u003c/th>\u003ctd>רוטציה חיצונית וייצוב\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Subscapularis\u003c/bdi>\u003c/th>\u003ctd>רוטציה פנימית וייצוב\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">מלכודת מבחן\u003c/span>\u003cdiv>\u003cp>\u003cbdi>Teres major\u003c/bdi> אינו חלק מה-\u003cbdi>Rotator cuff\u003c/bdi>. הוא מבצע פשיטה, קירוב ורוטציה פנימית של הכתף.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">בדקי את עצמך\u003c/span>\u003cp>איזה שריר ב-\u003cbdi>Rotator cuff\u003c/bdi> מבצע רוטציה פנימית? מי מרחיק את השכמות?\u003c/p>\u003c/div>"},{"key":"L12","topicIds":["A08","A09"],"label":"פרק 12","title":"זרוע, אמה, בטן וגב","source":"מקור: עמ׳ 88–100","html":"\u003cp>הסוד הוא לקשר בין המיקום לבין הפעולה: קדמת הזרוע מכופפת לרוב את המרפק; אחורית הזרוע פושטת אותו. בגו, כיוון הסיבים משפיע על סיבוב.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>שריר\u003c/th>\u003cth>אחז / פעולה שכדאי לזכור\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Biceps brachii\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Radial tuberosity\u003c/bdi>; כפיפת מרפק וסופינציה\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Brachialis\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Ulnar tuberosity\u003c/bdi>; כפיפת מרפק\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Triceps brachii\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Olecranon\u003c/bdi>; פשיטת מרפק, ראש ארוך מסייע לפשיטת כתף\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Brachioradialis\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Radius\u003c/bdi> דיסטלי; כפיפת מרפק בעיקר במנח ביניים\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Coracobrachialis\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Humerus\u003c/bdi>; כפיפה וקירוב כתף\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>ארבעת שרירי הבטן\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>שם\u003c/th>\u003cth>פעולה חשובה\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">\u003cbdi>External oblique\u003c/bdi>\u003c/th>\u003ctd>רוטציית גו לצד הנגדי, כפיפת גו\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Internal oblique\u003c/bdi>\u003c/th>\u003ctd>רוטציית גו לאותו צד, כפיפת גו\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Transversus abdominis\u003c/bdi>\u003c/th>\u003ctd>יצירת לחץ תוך־בטני וייצוב\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Rectus abdominis\u003c/bdi>\u003c/th>\u003ctd>כפיפת גו וסיבוב אגן לאחור\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"gcards\">\u003cdiv class=\"gcard\">\u003ch4>שרירי הגב העמוקים\u003c/h4>\u003cp>ממוקמים לאורך עמוד השדרה; מסייעים לייצוב, פשיטה ובקרה על תנועות בין חוליות.\u003c/p>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>\u003cbdi>Quadratus lumborum\u003c/bdi>\u003c/h4>\u003cp>מחבר אגן אל הצלע ה-12 והזיזים הרוחביים באזור המותני; תורם לכפיפה צידית, הרמת אגן וייצוב.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">בדקי את עצמך\u003c/span>\u003cp>באיזה צד מתרחשת הרוטציה בפעולה חד־צדדית של \u003cbdi>External oblique\u003c/bdi>? איזה שריר אינו יוצר בעיקר תנועה של הגו אלא לחץ תוך־בטני?\u003c/p>\u003c/div>"},{"key":"L13","topicIds":["A10"],"label":"פרק 13","title":"חגורת האגן והגף התחתון","source":"מקור: עמ׳ 101–106, 110","html":"\u003cp>האגן מעביר את משקל הגוף אל הרגליים. נקודות האחיזה שלו הן מפתח להבנת פעולות שרירי הירך והעכוז.\u003c/p>\n\u003cdiv class=\"gcards\">\u003cdiv class=\"gcard\">\u003ch4>שלוש עצמות שמרכיבות \u003cbdi>Os coxa\u003c/bdi>\u003c/h4>\u003cul>\u003cli>\u003cstrong>\u003cbdi>Ilium\u003c/bdi>:\u003c/strong> החלק העליון הגדול.\u003c/li>\u003cli>\u003cstrong>\u003cbdi>Ischium\u003c/bdi>:\u003c/strong> עצם הישיבה.\u003c/li>\u003cli>\u003cstrong>\u003cbdi>Pubis\u003c/bdi>:\u003c/strong> החלק הקדמי.\u003c/li>\u003cli>שלושתן משתתפות ביצירת ה-\u003cbdi>Acetabulum\u003c/bdi>, השקע של מפרק הירך.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>עצמות הגף התחתון\u003c/h4>\u003cul>\u003cli>\u003cstrong>\u003cbdi>Femur\u003c/bdi>:\u003c/strong> עצם הירך.\u003c/li>\u003cli>\u003cstrong>\u003cbdi>Patella\u003c/bdi>:\u003c/strong> פיקה ססמואידית.\u003c/li>\u003cli>\u003cstrong>\u003cbdi>Tibia\u003c/bdi>:\u003c/strong> עצם שוק מדיאלית ונושאת משקל.\u003c/li>\u003cli>\u003cstrong>\u003cbdi>Fibula\u003c/bdi>:\u003c/strong> עצם שוק לטרלית.\u003c/li>\u003cli>\u003cstrong>\u003cbdi>Talus\u003c/bdi> / \u003cbdi>Calcaneus\u003c/bdi>:\u003c/strong> עצמות מפתח בכף הרגל.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>נקודת אחיזה / מבנה\u003c/th>\u003cth>משמעות\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">\u003cbdi>ASIS\u003c/bdi> / \u003cbdi>AIIS\u003c/bdi>\u003c/th>\u003ctd>בליטות קדמיות של עצם הכסל\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Iliac crest\u003c/bdi>\u003c/th>\u003ctd>רכס הכסל, מוצא לשרירים רבים\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Ischial tuberosity\u003c/bdi>\u003c/th>\u003ctd>מוצא מרכזי לשרירי \u003cbdi>Hamstrings\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Greater trochanter\u003c/bdi>\u003c/th>\u003ctd>נקודת אחז של שרירי עכוז, כולל \u003cbdi>Gluteus medius\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Lesser trochanter\u003c/bdi>\u003c/th>\u003ctd>אחז של \u003cbdi>Iliopsoas\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Tibial tuberosity\u003c/bdi>\u003c/th>\u003ctd>מקום האחז של מנגנון \u003cbdi>Quadriceps\u003c/bdi> דרך הפיקה\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">הברך\u003c/span>\u003cdiv>\u003cp>מפרק הברך כולל \u003cbdi>Femur\u003c/bdi>, \u003cbdi>Tibia\u003c/bdi>, \u003cbdi>Patella\u003c/bdi>; רצועות \u003cbdi>ACL/PCL\u003c/bdi> ורצועות צדיות \u003cbdi>MCL/LCL\u003c/bdi> תורמות ליציבות.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">בדקי את עצמך\u003c/span>\u003cp>איזה מבנה קולט את ראש עצם הירך? איזו עצם נמצאת בצד הלטרלי של השוק?\u003c/p>\u003c/div>"},{"key":"L14","topicIds":["A11"],"label":"פרק 14","title":"שרירי הירך והברך","source":"מקור: עמ׳ 107–114","html":"\u003cp>השוואת שתי קבוצות שריר מרכזיות: קדמת הירך לעומת אחוריה. בהמשך בודקים מי חוצה גם את מפרק הירך.\u003c/p>\n\u003ch3>\u003cbdi>Quadriceps\u003c/bdi>: פושטי הברך\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>חלק\u003c/th>\u003cth>הבדל חשוב\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Rectus femoris\u003c/bdi>\u003c/th>\u003ctd>מתחיל באגן; פושט ברך ומסייע לכפיפת ירך\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Vastus medialis\u003c/bdi>\u003c/th>\u003ctd>פושט ברך; חלקו מתחיל בעצם הירך\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Vastus lateralis\u003c/bdi>\u003c/th>\u003ctd>פושט ברך; חלקו מתחיל בעצם הירך\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Vastus intermedius\u003c/bdi>\u003c/th>\u003ctd>פושט ברך; מתחיל בחלק הקדמי של עצם הירך\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>\u003cbdi>Hamstrings\u003c/bdi>: השרירים האחוריים\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>שריר\u003c/th>\u003cth>אחז דיסטלי\u003c/th>\u003cth>פעולה עיקרית\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Biceps femoris\u003c/bdi> (ראש ארוך)\u003c/th>\u003ctd>ראש \u003cbdi>Fibula\u003c/bdi>\u003c/td>\u003ctd>כפיפת ברך, סיוע לפשיטת ירך\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Semitendinosus\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Tibia\u003c/bdi> מדיאלית\u003c/td>\u003ctd>כפיפת ברך, סיוע לפשיטת ירך\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Semimembranosus\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Tibia\u003c/bdi> מדיאלית\u003c/td>\u003ctd>כפיפת ברך, סיוע לפשיטת ירך\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">יוצא דופן\u003c/span>\u003cdiv>\u003cp>הראש הקצר של \u003cbdi>Biceps femoris\u003c/bdi> מתחיל בעצם הירך ולא באגן ולכן אינו פושט את מפרק הירך.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"gcards\">\u003cdiv class=\"gcard\">\u003ch4>מקרבי הירך\u003c/h4>\u003cp>\u003cbdi>Pectineus\u003c/bdi>, \u003cbdi>Adductor longus\u003c/bdi>, \u003cbdi>Adductor brevis\u003c/bdi>, \u003cbdi>Adductor magnus\u003c/bdi> ו-\u003cbdi>Gracilis\u003c/bdi>. חלקם גם מסייעים בכפיפה וברוטציה. \u003cbdi>Gracilis\u003c/bdi> חוצה את הברך ומתחבר ל-\u003cbdi>Tibia\u003c/bdi>; לחלק האחורי של \u003cbdi>Adductor magnus\u003c/bdi> גם תפקיד בפשיטת ירך.\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">בדקי את עצמך\u003c/span>\u003cp>איזה ראש של \u003cbdi>Quadriceps\u003c/bdi> חוצה את מפרק הירך? איזה \u003cbdi>Hamstring\u003c/bdi> נאחז ב-\u003cbdi>Fibula\u003c/bdi>?\u003c/p>\u003c/div>"},{"key":"L15","topicIds":["A11"],"label":"פרק 15","title":"שרירי הירך הצדיים, הישבן והשוק","source":"מקור: עמ׳ 115–122","html":"\u003cp>בפעילות כמו הליכה וריצה, שרירי הירך חשובים גם להנעה וגם לייצוב האגן. שרירי השוק מעלים ומורידים את כף הרגל.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>שריר\u003c/th>\u003cth>אחז עיקרי\u003c/th>\u003cth>פעולה / דגש\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Iliopsoas\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Lesser trochanter\u003c/bdi>\u003c/td>\u003ctd>כפיפת ירך, רוטציה חיצונית, הטיית אגן קדמית\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Gluteus maximus\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Femur\u003c/bdi> אחורי ו-\u003cbdi>ITB\u003c/bdi>\u003c/td>\u003ctd>פשיטת ירך ורוטציה חיצונית\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Gluteus medius\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Greater trochanter\u003c/bdi>\u003c/td>\u003ctd>ייצוב אגן בהליכה והרחקת ירך\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Gluteus minimus\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Greater trochanter\u003c/bdi>\u003c/td>\u003ctd>הרחקת ירך וייצוב אגן\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Gastrocnemius\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Calcaneus\u003c/bdi>, דרך גיד אכילס\u003c/td>\u003ctd>\u003cbdi>Plantarflexion\u003c/bdi> וסיוע בכפיפת ברך\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Soleus\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Calcaneus\u003c/bdi>\u003c/td>\u003ctd>\u003cbdi>Plantarflexion\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Tibialis anterior\u003c/bdi>\u003c/th>\u003ctd>עצמות כף הרגל\u003c/td>\u003ctd>\u003cbdi>Dorsiflexion\u003c/bdi> ושמירה על קשת כף הרגל\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"gcards\">\u003cdiv class=\"gcard\">\u003ch4>למה \u003cbdi>Gluteus medius\u003c/bdi> חשוב?\u003c/h4>\u003cp>הוא מייצב את האגן בזמן העברת משקל מרגל לרגל. חולשה יכולה להתבטא בנפילת אגן ובדפוס הליכה לא תקין.\u003c/p>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>מי חוצה שני מפרקים?\u003c/h4>\u003cul>\u003cli>\u003cbdi>Rectus femoris\u003c/bdi>: ירך וברך.\u003c/li>\u003cli>\u003cbdi>Gastrocnemius\u003c/bdi>: ברך וקרסול.\u003c/li>\u003cli>\u003cbdi>Gracilis\u003c/bdi>: ירך וברך.\u003c/li>\u003cli>\u003cbdi>Iliopsoas\u003c/bdi>: עיקר פעולתו במפרק הירך.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">בדקי את עצמך\u003c/span>\u003cp>מה ההבדל בין \u003cbdi>Gastrocnemius\u003c/bdi> ל-\u003cbdi>Soleus\u003c/bdi>? מה פעולת \u003cbdi>Tibialis anterior\u003c/bdi>?\u003c/p>\u003c/div>"},{"key":"L00","topicIds":[],"label":"איך להשתמש בחוברת","title":"מפת הלמידה של עפר","source":"","html":"\u003cp>איך להשתמש בחוברת\u003c/p>\n\u003cp>בכל נושא: להבין את הרעיון, להכיר את השם באנגלית, ולבדוק יכולת זיהוי ויישום. החוברת מסכמת ומתעדפת. היא אינה מחליפה את איורי הזיהוי של חומר הקורס.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>מס׳\u003c/th>\u003cth>פרק\u003c/th>\u003cth>עמודי מקור\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">01\u003c/th>\u003ctd>מהקטן לגדול: תאים ורקמות\u003c/td>\u003ctd>עמודי מקור 5–14\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">02\u003c/th>\u003ctd>רקמות חיבור: להבין את החומר\u003c/td>\u003ctd>עמודי מקור 15–20\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">03\u003c/th>\u003ctd>סחוס, מפרק סינוביאלי ודיסק\u003c/td>\u003ctd>עמודי מקור 18–25\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">04\u003c/th>\u003ctd>עצם: תאים, מבנה והתגרמות\u003c/td>\u003ctd>עמודי מקור 26–36\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">05\u003c/th>\u003ctd>רקמת שריר והסרקומר\u003c/td>\u003ctd>עמודי מקור 37–40\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">06\u003c/th>\u003ctd>איך מתרחש כיווץ השריר?\u003c/td>\u003ctd>עמודי מקור 41–43, 92\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">07\u003c/th>\u003ctd>השפה האנטומית ומישורי הגוף\u003c/td>\u003ctd>עמודי מקור 44–45\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">08\u003c/th>\u003ctd>שלד הציר ועמוד השדרה\u003c/td>\u003ctd>עמודי מקור 46–66\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">09\u003c/th>\u003ctd>בית החזה וחגורת הכתפיים\u003c/td>\u003ctd>עמודי מקור 63–75\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">10\u003c/th>\u003ctd>הגף העליון: עצמות ונקודות אחיזה\u003c/td>\u003ctd>עמודי מקור 72–75\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">11\u003c/th>\u003ctd>שרירי הכתף והשכמה\u003c/td>\u003ctd>עמודי מקור 77–87\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">12\u003c/th>\u003ctd>זרוע, אמה, בטן וגב\u003c/td>\u003ctd>עמודי מקור 88–100\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">13\u003c/th>\u003ctd>חגורת האגן והגף התחתון\u003c/td>\u003ctd>עמודי מקור 101–106, 110\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">14\u003c/th>\u003ctd>שרירי הירך והברך\u003c/td>\u003ctd>עמודי מקור 107–114\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">15\u003c/th>\u003ctd>שרירי הירך הצדיים, הישבן והשוק\u003c/td>\u003ctd>עמודי מקור 115–122\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">16\u003c/th>\u003ctd>טבלאות על: לתרגל לפי תנועה\u003c/td>\u003ctd>עמודי מקור 77–122\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">17\u003c/th>\u003ctd>טעויות נפוצות + מילון קצר\u003c/td>\u003ctd>עמודי מקור כל החוברת\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">18\u003c/th>\u003ctd>מבחן עצמי: 15 שאלות אמריקאיות\u003c/td>\u003ctd>עמודי מקור מבוסס על עמודים 8–121\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">19\u003c/th>\u003ctd>פתרונות, חזרה ותוכנית אימון\u003c/td>\u003ctd>עמודי מקור 8–129\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">סדר חזרה מומלץ\u003c/span>\u003cdiv>\u003cp>קודם פרקים 1–7 להבנת הרקמות והשפה, אחר כך 8–16 לזיהוי שלד ושרירים, ולבסוף מבחן עצמי ופתרונות. חזרי אל התמונות בחוברת האמיתית כשמופיעים שמות עצמות ושרירים.\u003c/p>\u003c/div>\u003c/aside>"},{"key":"L16","topicIds":[],"label":"פרק 16","title":"טבלאות על: לתרגל לפי תנועה","source":"מקור: עמ׳ 77–122","html":"\u003cp>הדרך היעילה לשינון אינה רק לשאול ״מה עושה השריר?״ אלא גם ״אילו שרירים עושים את התנועה?״\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>תנועה\u003c/th>\u003cth>שרירים שכדאי לשלוף מיד\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">קירוב שכמות\u003c/th>\u003ctd>\u003cbdi>Trapezius\u003c/bdi>, \u003cbdi>Rhomboids\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">הרחקת שכמות וסיבוב מעלה\u003c/th>\u003ctd>\u003cbdi>Serratus anterior\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">הרחקת כתף\u003c/th>\u003ctd>\u003cbdi>Deltoid\u003c/bdi>, \u003cbdi>Supraspinatus\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">רוטציה חיצונית בכתף\u003c/th>\u003ctd>\u003cbdi>Infraspinatus\u003c/bdi>, \u003cbdi>Teres minor\u003c/bdi>, \u003cbdi>Posterior deltoid\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">רוטציה פנימית בכתף\u003c/th>\u003ctd>\u003cbdi>Subscapularis\u003c/bdi>, \u003cbdi>Latissimus dorsi\u003c/bdi>, \u003cbdi>Teres major\u003c/bdi>, \u003cbdi>Anterior deltoid\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">כפיפת מרפק\u003c/th>\u003ctd>\u003cbdi>Biceps brachii\u003c/bdi>, \u003cbdi>Brachialis\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">פשיטת מרפק\u003c/th>\u003ctd>\u003cbdi>Triceps brachii\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">כפיפת גו\u003c/th>\u003ctd>\u003cbdi>Rectus abdominis\u003c/bdi> ושרירים אלכסוניים\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">כפיפת ירך\u003c/th>\u003ctd>\u003cbdi>Iliopsoas\u003c/bdi>, \u003cbdi>Rectus femoris\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">פשיטת ירך\u003c/th>\u003ctd>\u003cbdi>Gluteus maximus\u003c/bdi>, \u003cbdi>Hamstrings\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">הרחקת ירך וייצוב אגן\u003c/th>\u003ctd>\u003cbdi>Gluteus medius\u003c/bdi>, \u003cbdi>Gluteus minimus\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">פשיטת ברך\u003c/th>\u003ctd>\u003cbdi>Quadriceps\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">כפיפת ברך\u003c/th>\u003ctd>\u003cbdi>Hamstrings\u003c/bdi>, \u003cbdi>Gastrocnemius\u003c/bdi> מסייע\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Plantarflexion\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Gastrocnemius\u003c/bdi>, \u003cbdi>Soleus\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Dorsiflexion\u003c/bdi>\u003c/th>\u003ctd>\u003cbdi>Tibialis anterior\u003c/bdi>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">כלל לימודי\u003c/span>\u003cdiv>\u003cp>פעולה יכולה להתבצע על ידי כמה שרירים. השריר העיקרי אינו בהכרח השריר היחיד. ההבחנות כאן מותאמות לנושאים המרכזיים בחוברת.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">בדקי את עצמך\u003c/span>\u003cp>בצעי היפוך: הסתירי את העמודה הימנית ונסי לשלוף לפחות שני שרירים לכל תנועה.\u003c/p>\u003c/div>"},{"key":"L17","topicIds":[],"label":"פרק 17","title":"טעויות נפוצות + מילון קצר","source":"מקור: עמ׳ כל החוברת","html":"\u003cp>לפני המבחן כדאי לחפש את המשפטים שנראים כמעט נכונים. לעיתים ההבדל בין שתי מילים הוא כל השאלה.\u003c/p>\n\u003ch3>זוגות שקל לבלבל\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>לא להתבלבל בין...\u003c/th>\u003cth>ההבחנה הקצרה\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Tendon\u003c/bdi> / \u003cbdi>Ligament\u003c/bdi>\u003c/th>\u003ctd>גיד: שריר־עצם. רצועה: עצם־עצם\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Osteoblast\u003c/bdi> / \u003cbdi>Osteoclast\u003c/bdi>\u003c/th>\u003ctd>בנייה לעומת פירוק\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Hyaline\u003c/bdi> / \u003cbdi>Fibrocartilage\u003c/bdi>\u003c/th>\u003ctd>סחוס מפרקי חלק לעומת דיסק/מניסקוס\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Origin\u003c/bdi> / \u003cbdi>Insertion\u003c/bdi>\u003c/th>\u003ctd>נקודת מוצא לעומת נקודת אחז\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Radius\u003c/bdi> / \u003cbdi>Ulna\u003c/bdi>\u003c/th>\u003ctd>רדיוס לטרלי ואולנה מדיאלית במנח אנטומי\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Supraspinatus\u003c/bdi> / \u003cbdi>Subscap const store = { local: false, remote: 'pending', ref: null, writing: false, dirty: false, timer: null, lastSync: null, error: null };

}

function scheduleRemote() {

}
async function flushRemote() {
  if (!store.ref) return;

  store.writing = true;
  try {
    await store.ref.set(JSON.parse(JSON.stringify(S)));

  } catch (e) {

  try {
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user) { store.remote = 'off'; renderStatus(); return; }
    const uid = await user.id();
    if (!uid) { store.remote = 'off'; renderStatus(); return; }
    const ref = db.doc(`data/users/${uid}/progress`);
    const snap = await ref.get();
    store.ref = ref;
    store.remote = 'on';
    initQA(db, user);
    const remote = snap.exists ? normalize(JSON.parse(JSON.stringify(snap.data()))) : null;
    if (remote && (!S.updatedAt || (remote.updatedAt && remote.updatedAt > S.updatedAt))) {

}

// ---------- derived stats ----------
function latestBy(attKey) { const m = {}; for (const a of S[attKey]) m[a.questionId] = a; return m; }
function topicStats(tid) {
  const qs = D.mcq.filter(q => q.topicId === tid);
  const ids = new Set(qs.map(q => q.id));
  const att = S.mcqAttempts.filter(a => ids.has(a.questionId));
  const latest = {};
  for (const a of att) latest[a.questionId] = a;
  const uniq = Object.values(latest);
  const cards = D.flashcards.filter(c => c.topicId === tid);
  const recent = att.slice(-5);
  const lessons = D.lessons.filter(l => l.topicIds.includes(tid));
  return {
    bank: qs.length, attempts: att.length, correct: att.filter(a => a.correct).length,
    unique: uniq.length, mastery: uniq.length >= 5 ? pct(uniq.filter(a => a.correct).length, uniq.length) : null,
    coverage: pct(uniq.length, qs.length),
    recentWrong: recent.filter(a => !a.correct).length, recentN: recent.length,
    cards: cards.length, cardsKnown: cards.filter(c => S.flashcards[c.id]?.rating === 'known').length,
    lessons, lessonsDone: lessons.filter(l => S.completedLessons.includes(l.key)).length,
  };
}
function cardIsDue(id, now = Date.now()) {
  const c = S.flashcards[id];
  return !c || !c.nextDueAt || Date.parse(c.nextDueAt) <= now;
}
const dueCards = tid => { const now = Date.now(); return D.flashcards.filter(c => (!tid || c.topicId === tid) && S.flashcards[c.id] && cardIsDue(c.id, now)); };
const newCards = tid => D.flashcards.filter(c => (!tid || c.topicId === tid) && !S.flashcards[c.id]);
const hardCards = tid => D.flashcards.filter(c => (!tid || c.topicId === tid) && ['unknown', 'almost'].includes(S.flashcards[c.id]?.rating));
function mistakeIds(bank = 'practice', filterTid) {
  const B = BANKS[bank];
  return Object.values(latestBy(B.attempts)).filter(a => !a.correct && (!filterTid || B.map[a.questionId]?.topicId === filterTid)).map(a => a.questionId);
}
function recentMistakes(n = 10) {
  const latestQ = latestBy('mcqAttempts'), latestM = latestBy('motionAttempts');
  const all = [...Object.values(latestQ).map(a => ({ ...a, bank: 'practice' })), ...Object.values(latestM).map(a => ({ ...a, bank: 'motion' }))];
  return all.filter(a => !a.correct).sort((a, b) => b.answeredAt.localeCompare(a.answeredAt)).slice(0, n);
}

// The study plan: fixed rules checked in order, so the reason shown is always the rule that fired.
function plan() {
  const out = [];
  if (S.activeExam) out.push({ title: 'יש מבחן פתוח', text: `ענית על ${Object.keys(S.activeExam.answers).length} מתוך ${S.activeExam.qids.length} שאלות. אפשר להמשיך מאותה נקודה.`, cta: 'המשך למבחן', act: 'go', args: { route: 'exam' } });
  const due = dueCards().length;
  if (due >= 8) out.push({ title: `${due} כרטיסיות מחכות לחזרה`, text: 'הגיע מועד החזרה שלהן לפי הדירוג הקודם שלך.', cta: 'לחזרה על כרטיסיות', act: 'startCardsQuick', args: { mode: 'due' } });
  let worst = null;
  for (const t of TOPICS) {
    const st = topicStats(t.id);
    if (st.recentN >= 3 && st.recentWrong >= 2 && (!worst || st.recentWrong > worst.st.recentWrong)) worst = { t, st };
  }
  if (worst) out.push({ title: `לחזור על ${worst.t.id}: ${worst.t.short}`, text: `${worst.st.recentWrong} טעויות ב-${worst.st.recentN} התשובות האחרונות בנושא.`, cta: 'תרגול הטעויות בנושא', act: 'startPracticeQuick', args: { topic: worst.t.id, pool: 'mistakes' } });
  const next = D.lessons.find(l => l.topicIds.length && !S.completedLessons.includes(l.key) && l.kind !== 'quiz');
  if (next) out.push({ title: `ללמוד את ${next.label}: ${next.title}`, text: `הפרק הבא ברצף הלמידה${next.source ? ` (${next.source.replace(/^מקור:\s*/, '')})` : ''}. בסוף הפרק יש שאלות בדיקה קצרות.`, cta: 'לפתיחת הפרק', act: 'openLesson', args: { key: next.key } });
  let low = null;
  for (const t of TOPICS) { const st = topicStats(t.id); if (!low || st.coverage < low.st.coverage) low = { t, st }; }
  if (low && low.st.coverage < 60) out.push({ title: `לתרגל ${low.t.id}: ${low.t.short}`, text: `ענית על ${low.st.unique} מתוך ${low.st.bank} השאלות בנושא, הכיסוי הנמוך ביותר.`, cta: 'תרגול 10 שאלות', act: 'startPracticeQuick', args: { topic: low.t.id, pool: 'unseen' } });
  if (out.length < 3) out.push({ title: 'מבחן תרגול מלא', text: '30 שאלות מכל 11 הנושאים, עם טיימר. ההסברים מוצגים בסוף.', cta: 'למבחן 30 שאלות', act: 'go', args: { route: 'exam' } });
  return out.slice(0, 3);
}

const INTERVAL_DAYS = [0, 1, 3, 7, 14, 30];
function rateCard(id, rating) {
  const c = S.flashcards[id] || { rating: null, reviews: 0, known: 0, almost: 0, unknown: 0, box: 0, lastAt: null, nextDueAt: null };
  c.reviews++; c[rating]++; c.rating = rating; c.lastAt = nowISO();
  const now = Date.now();
  if (rating === 'unknown') { c.box = 0; c.nextDueAt = new Date(now + 10 * 60000).toISOString(); }
  else if (rating === 'almost') { c.box = 1; c.nextDueAt = new Date(now + DAY).toISOString(); }
  else { c.box = Math.min((c.box || 0) + 1, 5); c.nextDueAt = new Date(now + INTERVAL_DAYS[c.box] * DAY).toISOString(); }
  S.flashcards[id] = c;
}

  else {
    const due = dueCards(tid).sort((a, b) => Date.parse(S.flashcards[a.id].nextDueAt || 0) - Date.parse(S.flashcards[b.id].nextDueAt || 0));
    list = due.concat(mix ? shuffle(newCards(tid)) : newCards(tid));

function bankPool(bank, f) {
  const B = BANKS[bank];
  let pool = B.items.filter(q => (f.topic === 'all' || q.topicId === f.topic) && (f.diff === 'all' || q.difficulty === f.diff));
  if (f.pool === 'mistakes') { const m = new Set(mistakeIds(bank)); pool = pool.filter(q => m.has(q.id)); }
  if (f.pool === 'unseen') { const seen = latestBy(B.attempts); pool = pool.filter(q => !seen[q.id]); }
  if (f.pool === 'marked') { const m = new Set(S.markedQuestions); pool = pool.filter(q => m.has(q.id)); }
  return pool;
}

// ---------- EXAM ----------
// Proportional quota per topic (largest remainder); inside each topic the difficulties are interleaved
// medium → hard → easy so every topic contributes a mix rather than a run of one level.
function buildExam(n, topicIds) {
  const pool = D.mcq.filter(q => topicIds.includes(q.topicId));
  n = Math.min(n, pool.length);
  const groups = topicIds.map(t => ({ t, qs: pool.filter(q => q.topicId === t) })).filter(g => g.qs.length);
  const exact = groups.map(g => n * g.qs.length / pool.length);
  const quota = exact.map(Math.floor);
  let left = n - quota.reduce((a, b) => a + b, 0);
  exact.map((e, i) => [e - Math.floor(e), i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (left > 0 && quota[i] < groups[i].qs.length) { quota[i]++; left--; } });
  const picked = [];
  groups.forEach((g, gi) => {
    const buckets = ['medium', 'hard', 'easy'].map(d => shuffle(g.qs.filter(q => q.difficulty === d)));
    const order = [];
    while (buckets.some(b => b.length)) for (const b of buckets) if (b.length) order.push(b.shift());
    picked.push(...order.slice(0, quota[gi]));
  });
  return shuffle(picked).map(q => q.id);
}
function startExam(size, topics, perQ) {

  view.examResult = null; commit();
}

function newSeq(id) {

  let order = shuffle(s.steps.map(x => x.id));
  let guard = 0;
  while (order.join() === s.correctOrder.join() && guard++ < 10) order = shuffle(order);
  view.seq = { id, order, checked: false };
}
// Scoring: exact order = 5 points; otherwise one point per adjacent pair that appears in the correct relative order.
function seqScore(s, order) {
  const pos = Object.fromEntries(s.correctOrder.map((id, i) => [id, i]));
  const exact = order.join() === s.correctOrder.join();
  let adj = 0;
  for (let i = 0; i < order.length - 1; i++) if (pos[order[i + 1]] === pos[order[i]] + 1) adj++;
  return { exact, adj, max: order.length - 1, score: exact ? 5 : adj };
}
function seqBoard(ss) {
  const s = D.sequences.find(x => x.id === ss.id);
