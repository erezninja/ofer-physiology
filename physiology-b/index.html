icId":"B05","objective":"לזהות סוגי לימפוציטים ותאים בולעניים","sourcePages":[122]},{"id":"PB-O-19","topicId":"B05","objective":"להבין נוגדנים ומשלים","sourcePages":[123]},{"id":"PB-O-20","topicId":"B05","objective":"לתאר דלקת ופגוציטוזה","sourcePages":[121]}],"lessons":[{"topicId":"B01","title":"מערכת הלב וכלי הדם","unit":"יחידה 01 · עמודי מקור 52–74","howTo":"ללמוד לפי סדר היחידות; לאחר כל תת-נושא לפתוח תרגול ולהמשיך רק אחרי הבנה. נוסחאות יש לקרוא עם יחידות מדידה, ולתרשימים יש לתת פירוש מילולי.","sections":[{"title":"התפקידים העיקריים","pages":"52–53"},{"title":"שני מחזורי הדם","pages":"53–54"},{"title":"מבנה הלב ומחזור פעימה","pages":"54–55"},{"title":"כלי הדם: מבנה ולחץ","pages":"56–59"},{"title":"ממה מורכב הדם?","pages":"58–59"},{"title":"שלוש נוסחאות יסוד","pages":"60–65"},{"title":"מה קורה בזמן מאמץ?","pages":"61–69"},{"title":"דופק מטרה ונוסחת קרבונן","pages":"63, 70–71"},{"title":"בדיקת הבנה בעל פה","pages":""},{"title":"בלבולים שכדאי להימנע מהם","pages":""}],"html":"\u003cp>מערכת ההובלה של הגוף: הלב מזרים דם, כלי הדם מוליכים אותו, והדם נושא חמצן וחומרים חיוניים אל התאים.\u003c/p>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">התפקידים העיקריים \u003cspan class=\"pchip\">עמ׳ \u003cbdi>52–53\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>הובלת חמצן\u003c/strong> מהריאות לרקמות והחזרת פחמן דו-חמצני לריאות.\u003c/li>\u003cli>\u003cstrong>הובלת חומרי מזון והורמונים\u003c/strong> לתאי הגוף.\u003c/li>\u003cli>\u003cstrong>פינוי תוצרי פסולת\u003c/strong> מן הרקמות.\u003c/li>\u003cli>\u003cstrong>ויסות\u003c/strong> טמפרטורת הגוף וסיוע בהגנה החיסונית.\u003c/li>\u003c/ul>\n\u003cdiv class=\"sec-practice\" data-pages=\"52,53\" data-title=\"התפקידים העיקריים\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">שני מחזורי הדם \u003cspan class=\"pchip\">עמ׳ \u003cbdi>53–54\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>מחזור\u003c/th>\u003cth>מסלול בסיסי\u003c/th>\u003cth>מטרה\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">\u003cstrong>מחזור קטן / ריאתי\u003c/strong>\u003c/th>\u003ctd>חדר ימין ← עורק הריאה ← ריאות ← ורידי הריאה ← עלייה שמאל\u003c/td>\u003ctd>חמצון הדם בריאות\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cstrong>מחזור גדול / מערכתי\u003c/strong>\u003c/th>\u003ctd>חדר שמאל ← אבי העורקים ← רקמות הגוף ← ורידים נבובים ← עלייה ימין\u003c/td>\u003ctd>אספקת חמצן וחומרי מזון לרקמות\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">סדר זרימת הדם שכדאי לדעת בעל פה\u003c/span>\u003cdiv>\u003cfigure class=\"gfig flow\" aria-label=\"רצף\">\u003col>\u003cli>ורידים נבובים\u003c/li>\u003cli>עלייה ימין\u003c/li>\u003cli>חדר ימין\u003c/li>\u003cli>עורק הריאה\u003c/li>\u003cli>ריאות\u003c/li>\u003cli>ורידי הריאה\u003c/li>\u003cli>עלייה שמאל\u003c/li>\u003cli>חדר שמאל\u003c/li>\u003cli>אבי העורקים\u003c/li>\u003cli>רקמות הגוף\u003c/li>\u003c/ol>\u003c/figure>\u003c/div>\u003c/aside>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">נקודת בלבול נפוצה\u003c/span>\u003cdiv>\u003cp>עורק מוגדר לפי כיוון הזרימה \u003cstrong>מן הלב והלאה\u003c/strong>, ווריד לפי הזרימה \u003cstrong>אל הלב\u003c/strong>. לכן עורק הריאה מוביל דם דל בחמצן, ואילו ורידי הריאה מובילים דם עשיר בחמצן.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"53,54\" data-title=\"שני מחזורי הדם\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">מבנה הלב ומחזור פעימה \u003cspan class=\"pchip\">עמ׳ \u003cbdi>54–55\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>חלק\u003c/th>\u003cth>תפקיד\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">עלייה ימין\u003c/th>\u003ctd>קולטת דם מהמחזור הגדול.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">חדר ימין\u003c/th>\u003ctd>מזרים את הדם אל הריאות.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">עלייה שמאל\u003c/th>\u003ctd>קולטת דם מחומצן מהריאות.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">חדר שמאל\u003c/th>\u003ctd>מזרים את הדם למחזור הגדול.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">מסתמים\u003c/th>\u003ctd>מכוונים זרימת דם בכיוון אחד ומונעים זרימה לאחור.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>סיסטולה, דיאסטולה ותיאום עצבי\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>סיסטולה\u003c/strong>: שלב ההתכווצות והזרקת הדם.\u003c/li>\u003cli>\u003cstrong>דיאסטולה\u003c/strong>: שלב ההרפיה ומילוי חללי הלב.\u003c/li>\u003cli>קוצב הלב ומערכת ההולכה החשמלית מייצרים ומתאמים את סדר ההתכווצות.\u003c/li>\u003cli>המערכת הסימפתטית מגבירה את פעילות הלב במאמץ; הפאראסימפתטית מעורבת בהאטת הדופק.\u003c/li>\u003c/ul>\n\u003cdiv class=\"sec-practice\" data-pages=\"54,55\" data-title=\"מבנה הלב ומחזור פעימה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">כלי הדם: מבנה ולחץ \u003cspan class=\"pchip\">עמ׳ \u003cbdi>56–59\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>כלי דם\u003c/th>\u003cth>מאפיין מבני\u003c/th>\u003cth>תפקיד עיקרי\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">עורקים\u003c/th>\u003ctd>דופן שרירית ואלסטית עבה יחסית\u003c/td>\u003ctd>הובלת דם מן הלב בלחץ גבוה.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">עורקיקים\u003c/th>\u003ctd>שריר חלק המאפשר שינוי בקוטר\u003c/td>\u003ctd>בקרה על התנגדות וזרימה מקומית.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">נימים\u003c/th>\u003ctd>דופן דקה מאוד\u003c/td>\u003ctd>חילוף חמצן, מזון ותוצרי פסולת עם הרקמות.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">ורידים\u003c/th>\u003ctd>לחץ נמוך יחסית; שסתומים בחלק מהם\u003c/td>\u003ctd>החזרת דם אל הלב; מאגר דם משמעותי.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>לחץ דם:\u003c/strong> לחץ הדם כנגד דופן כלי הדם, נמדד במ״מ כספית. בלחץ דם 120/80 הערך הראשון הוא סיסטולי והשני דיאסטולי (עמ׳ 57).\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"56,57,58,59\" data-title=\"כלי הדם: מבנה ולחץ\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">ממה מורכב הדם? \u003cspan class=\"pchip\">עמ׳ \u003cbdi>58–59\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>מרכיב\u003c/th>\u003cth>חלק יחסי בחוברת\u003c/th>\u003cth>תפקיד\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">פלזמה\u003c/th>\u003ctd>כ-55%\u003c/td>\u003ctd>נוזל שבו מומסים חומרים ומועברים מרכיבים.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">תאי דם ותוצרים תאיים\u003c/th>\u003ctd>כ-45%\u003c/td>\u003ctd>תאי דם אדומים, לבנים וטסיות.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">תאי דם אדומים\u003c/th>\u003ctd>מרבית התאים\u003c/td>\u003ctd>הובלת חמצן בעזרת המוגלובין.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">תאי דם לבנים\u003c/th>\u003ctd>חלק קטן\u003c/td>\u003ctd>הגנה מפני גורמים זרים.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">טסיות\u003c/th>\u003ctd>חלק קטן\u003c/td>\u003ctd>תהליך הקרישה ומניעת דימום.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-pages=\"58,59\" data-title=\"ממה מורכב הדם?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">שלוש נוסחאות יסוד \u003cspan class=\"pchip\">עמ׳ \u003cbdi>60–65\u003c/bdi>\u003c/span>\u003c/h2>\n\u003caside class=\"gnote fbox\">\u003cspan class=\"tag\">תפוקת הלב\u003c/span>\u003cdiv>\u003cdiv class=\"eqn\" dir=\"ltr\">CO = HR × SV\u003c/div>\u003cp class=\"legend\">\u003cbdi>CO\u003c/bdi>: תפוקת לב; \u003cbdi>HR\u003c/bdi>: קצב לב לדקה; \u003cbdi>SV\u003c/bdi>: נפח פעימה.\u003c/p>\u003c/div>\u003c/aside>\n\u003caside class=\"gnote fbox\">\u003cspan class=\"tag\">נפח פעימה\u003c/span>\u003cdiv>\u003cdiv class=\"eqn\" dir=\"ltr\">SV = EDV − ESV\u003c/div>\u003cp class=\"legend\">\u003cbdi>EDV\u003c/bdi>: נפח סוף דיאסטולי; \u003cbdi>ESV\u003c/bdi>: נפח סוף סיסטולי.\u003c/p>\u003c/div>\u003c/aside>\n\u003caside class=\"gnote fbox\">\u003cspan class=\"tag\">צריכת החמצן (עיקרון פיק)\u003c/span>\u003cdiv>\u003cdiv class=\"eqn\" dir=\"ltr\">VO₂ = CO × (a−v O₂ difference)\u003c/div>\u003cp class=\"legend\">הצריכה תלויה בזרימת הדם ובהפרש תכולת החמצן בין הדם העורקי לוורידי.\u003c/p>\u003c/div>\u003c/aside>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">דוגמה לחישוב תפוקת לב\u003c/span>\u003cdiv>\u003cp>דופק 70 פעימות בדקה × נפח פעימה 70 מ״ל = 4,900 מ״ל לדקה, כלומר כ-4.9 ליטר לדקה. זו דוגמת המנוחה בחוברת (עמ׳ 60).\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"60,61,62,63,64,65\" data-title=\"שלוש נוסחאות יסוד\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">מה קורה בזמן מאמץ? \u003cspan class=\"pchip\">עמ׳ \u003cbdi>61–69\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>קצב הלב עולה\u003c/strong> עם עליית עצימות המאמץ, עד קצב מרבי בקירוב.\u003c/li>\u003cli>\u003cstrong>נפח הפעימה עולה\u003c/strong> לעומת מנוחה; דפוס העלייה עשוי להשתנות לפי רמת האימון.\u003c/li>\u003cli>\u003cstrong>תפוקת הלב עולה\u003c/strong> כדי להגדיל את אספקת הדם.\u003c/li>\u003cli>\u003cstrong>זרימת הדם מתחלקת מחדש\u003c/strong>: יותר דם לשרירים הפעילים ופחות למערכות שאינן חיוניות למאמץ.\u003c/li>\u003cli>\u003cstrong>הפרש החמצן העורקי-ורידי גדל\u003c/strong> ככל שהשרירים מנצלים יותר חמצן.\u003c/li>\u003c/ul>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>נתון\u003c/th>\u003cth>לא מאומן (כמתואר בחוברת)\u003c/th>\u003cth>מאומן (כמתואר בחוברת)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">דופק במנוחה\u003c/th>\u003ctd>כ-60–80 לדקה\u003c/td>\u003ctd>כ-35–50 לדקה\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">נפח פעימה במנוחה\u003c/th>\u003ctd>כ-70 מ״ל\u003c/td>\u003ctd>כ-110 מ״ל\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">תפוקת לב במנוחה\u003c/th>\u003ctd>כ-5 ליטר לדקה\u003c/td>\u003ctd>כ-5 ליטר לדקה\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">תפוקת לב מרבית\u003c/th>\u003ctd>כ-18–21 ליטר לדקה\u003c/td>\u003ctd>כ-30–40 ליטר לדקה\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>הערכים בטבלה הם דוגמאות והשוואות מתוך עמ׳ 66 של החוברת, ולא טווחים אבחנתיים לאדם מסוים.\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"61,62,63,64,65,66,67,68,69\" data-title=\"מה קורה בזמן מאמץ?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">דופק מטרה ונוסחת קרבונן \u003cspan class=\"pchip\">עמ׳ \u003cbdi>63, 70–71\u003c/bdi>\u003c/span>\u003c/h2>\n\u003caside class=\"gnote fbox\">\u003cspan class=\"tag\">דופק מרבי משוער לפי החוברת\u003c/span>\u003cdiv>\u003cdiv class=\"eqn\" dir=\"ltr\">HRmax ≈ 220 − age\u003c/div>\u003c/div>\u003c/aside>\n\u003caside class=\"gnote fbox\">\u003cspan class=\"tag\">דופק מטרה בשיטת קרבונן\u003c/span>\u003cdiv>\u003cdiv class=\"eqn\" dir=\"ltr\">Target HR = HRrest + intensity × (HRmax − HRrest)\u003c/div>\u003c/div>\u003c/aside>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">דוגמת החוברת\u003c/span>\u003cdiv>\u003cp>גיל 20: דופק מרבי משוער 200; דופק מנוחה 70. ב-50% רזרבה: 70 + 0.50 × (200 − 70) = 135 פעימות לדקה. בחוברת יש גם דוגמאות עם דופק מרבי 190 (עמ׳ 71).\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"selfcheck\">\u003ch3>בדיקת ידע עצמית\u003c/h3>\u003col>\u003cli>\u003cdetails>\u003csummary>מה ההבדל בין המחזור הקטן למחזור הגדול?\u003c/summary>\u003cp>המחזור הקטן מזרים דם דרך הריאות לצורך חילוף גזים; הגדול מזרים דם בין הלב לשאר רקמות הגוף.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מדוע עורק הריאה נחשב עורק אף שהוא מוליך דם דל חמצן?\u003c/summary>\u003cp>מפני שהוא מוציא דם מן הלב, ועורק מוגדר על פי כיוון הזרימה.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מהי תפוקת הלב בדופק 80 ובנפח פעימה 75 מ״ל?\u003c/summary>\u003cp>6,000 מ״ל בדקה, כלומר 6 ליטר לדקה.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מה פירוש לחץ דם 120/80?\u003c/summary>\u003cp>120 הוא לחץ סיסטולי ו-80 הוא לחץ דיאסטולי.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מה ההבדל הכללי בין לב מאומן ללב לא מאומן במנוחה?\u003c/summary>\u003cp>המאומן עשוי לפעום לאט יותר אך להזרים יותר דם בכל פעימה, כך שתפוקת הלב במנוחה דומה.\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-pages=\"63,70,71\" data-title=\"דופק מטרה ונוסחת קרבונן\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">בדיקת הבנה בעל פה\u003c/h2>\n\u003col>\u003cli>התחילו מהוורידים הנבובים: תארו את המסלול שעוברת טיפת דם עד שהיא שבה אל הלב.\u003c/li>\u003cli>מדוע עורק הריאה אינו דומה לעורקים אחרים מבחינת תכולת החמצן?\u003c/li>\u003cli>מהי תפוקת הלב כשקצב הלב 80 לדקה ונפח הפעימה 75 מיליליטר?\u003c/li>\u003cli>מה ההבדל בין דופק במנוחה לבין תפוקת לב במנוחה אצל מאומן ולא מאומן?\u003c/li>\u003cli>כיצד מחשבים דופק מטרה בשיטת קרבונן כאשר ידועים גיל, דופק מנוחה ואחוז רזרבה?\u003c/li>\u003c/ol>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-title=\"בדיקת הבנה בעל פה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">בלבולים שכדאי להימנע מהם\u003c/h2>\n\u003cul>\u003cli>לא להתבלבל בין עורק/וריד לבין דם עשיר/דל בחמצן; ההגדרה היא לפי הכיוון ביחס ללב.\u003c/li>\u003cli>לא להחליף בין \u003cbdi>SV\u003c/bdi>, \u003cbdi>HR\u003c/bdi> ו-\u003cbdi>CO\u003c/bdi>; להקריא יחידות בכל חישוב.\u003c/li>\u003cli>דופק מרבי 220 פחות הגיל הוא אומדן בקורס, לא מדידה אישית.\u003c/li>\u003c/ul>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-title=\"בלבולים שכדאי להימנע מהם\">\u003c/div>\u003c/section>","key":"L-B01","sourcePages":[52,74]},{"topicId":"B02","title":"פיזיולוגיה של השרירים ומערכת העצבים","unit":"יחידה 02 · עמודי מקור 75–91","howTo":"ללמוד לפי סדר היחידות; לאחר כל תת-נושא לפתוח תרגול ולהמשיך רק אחרי הבנה. נוסחאות יש לקרוא עם יחידות מדידה, ולתרשימים יש לתת פירוש מילולי.","sections":[{"title":"ארגון השריר מהגדול לקטן","pages":"75–76"},{"title":"איך מתחיל כיווץ שריר?","pages":"77–78"},{"title":"יחידה מוטורית וגיוס יחידות","pages":"78–79, 83"},{"title":"השוואה בין סוגי סיבי השריר","pages":"79–82"},{"title":"תגובה לאימון והתאוששות","pages":"83–85"},{"title":"בקרה על התנועה: רפלקסים וקולטנים","pages":"86–88"},{"title":"בדיקת הבנה בעל פה","pages":""},{"title":"בלבולים שכדאי להימנע מהם","pages":""}],"html":"\u003cp>מהרמה של שריר שלם ועד סיבי אקטין ומיוזין: כיצד נוצרת התכווצות, כיצד מגויסים סיבים ואיך הגוף מסתגל לאימון.\u003c/p>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">ארגון השריר מהגדול לקטן \u003cspan class=\"pchip\">עמ׳ \u003cbdi>75–76\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cfigure class=\"gfig flow\" aria-label=\"רצף\">\u003col>\u003cli>שריר שלם\u003c/li>\u003cli>צרורות\u003c/li>\u003cli>סיבי שריר / תאים\u003c/li>\u003cli>מיופיברילות\u003c/li>\u003cli>סרקומרים\u003c/li>\u003cli>אקטין ומיוזין\u003c/li>\u003c/ol>\u003c/figure>\n\u003cp>סיב שריר הוא תא גדול המכיל מיופיברילות רבות. \u003cstrong>סרקומר\u003c/strong> הוא יחידת הכיווץ התפקודית. בחוברת מתוארים גם קרום התא ומערכת הצינורות המשמשת להעברת אותות ולבקרת סידן.\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"75,76\" data-title=\"ארגון השריר מהגדול לקטן\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">איך מתחיל כיווץ שריר? \u003cspan class=\"pchip\">עמ׳ \u003cbdi>77–78\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cfigure class=\"gfig flow\" aria-label=\"רצף\">\u003col>\u003cli>פקודה עצבית\u003c/li>\u003cli>שחרור אצטילכולין\u003c/li>\u003cli>אות חשמלי בסיב השריר\u003c/li>\u003cli>שחרור סידן\u003c/li>\u003cli>קישור סידן לטרופונין\u003c/li>\u003cli>פעולת גשרי רוחב\u003c/li>\u003c/ol>\u003c/figure>\n\u003cul>\u003cli>האות העצבי מגיע לקצה האקסון במפגש עצב-שריר.\u003c/li>\u003cli>אצטילכולין מועבר במרווח הסינפטי ומפעיל את סיב השריר.\u003c/li>\u003cli>שחרור יוני סידן מאפשר אינטראקציה בין אקטין ומיוזין.\u003c/li>\u003cli>ראשי המיוזין נקשרים לאקטין, מבצעים \u003cbdi>Power Stroke\u003c/bdi> ומשתחררים בעזרת \u003cbdi>ATP\u003c/bdi>.\u003c/li>\u003cli>החזרת הסידן למאגרים מסייעת להפסקת הכיווץ ולהרפיה.\u003c/li>\u003c/ul>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">מה באמת מתקצר?\u003c/span>\u003cdiv>\u003cp>במודל הסיבים המחליקים, סיבי האקטין והמיוזין \u003cstrong>מחליקים זה ביחס לזה\u003c/strong>; הסרקומר מתקצר. אין מדובר בקיצור של חלבוני האקטין והמיוזין עצמם.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"77,78\" data-title=\"איך מתחיל כיווץ שריר?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">יחידה מוטורית וגיוס יחידות \u003cspan class=\"pchip\">עמ׳ \u003cbdi>78–79, 83\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cp>\u003cstrong>יחידה מוטורית\u003c/strong> כוללת נוירון מוטורי ואת סיבי השריר שאותם הוא מעצבב. כשצריך יותר כוח, מערכת העצבים מגייסת יותר יחידות מוטוריות ומעלה את קצב פעולתן.\u003c/p>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">עיקרון הגיוס\u003c/span>\u003cdiv>\u003cp>בחוברת: בגיוס מדורג, יחידות קטנות ואיטיות משתתפות לפני גיוס יחידות מהירות יותר ככל שהדרישה לכוח גדלה.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"78,79,83\" data-title=\"יחידה מוטורית וגיוס יחידות\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">השוואה בין סוגי סיבי השריר \u003cspan class=\"pchip\">עמ׳ \u003cbdi>79–82\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>מאפיין\u003c/th>\u003cth>\u003cbdi>Type I\u003c/bdi> / \u003cbdi>ST\u003c/bdi>\u003c/th>\u003cth>\u003cbdi>Type II\u003c/bdi> / \u003cbdi>FT\u003c/bdi>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">כינוי\u003c/th>\u003ctd>סיבים איטיים\u003c/td>\u003ctd>סיבים מהירים\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">מהירות כיווץ\u003c/th>\u003ctd>איטית\u003c/td>\u003ctd>מהירה\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">יכולת עמידות לאורך זמן\u003c/th>\u003ctd>גבוהה יחסית\u003c/td>\u003ctd>נמוכה יחסית\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">כוח / הספק מהיר\u003c/th>\u003ctd>נמוך יותר\u003c/td>\u003ctd>גבוה יותר\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">מסלול אנרגיה מאפיין\u003c/th>\u003ctd>אירובי\u003c/td>\u003ctd>השתתפות גדולה יותר במסלולים אנאירוביים\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">מיוגלובין ומיטוכונדריות\u003c/th>\u003ctd>רבים יחסית\u003c/td>\u003ctd>פחות בסיבים המהירים ביותר\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">תפקיד אופייני\u003c/th>\u003ctd>פעילות ממושכת\u003c/td>\u003ctd>מאמץ מהיר ועצים\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>בתוך קבוצת הסיבים המהירים החוברת מבחינה בין \u003cstrong>\u003cbdi>Type IIa\u003c/bdi>\u003c/strong> לבין \u003cstrong>\u003cbdi>Type IIb\u003c/bdi>\u003c/strong>, לפי מאפייני עייפות והפקת אנרגיה (עמ׳ 79–82).\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"79,80,81,82\" data-title=\"השוואה בין סוגי סיבי השריר\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">תגובה לאימון והתאוששות \u003cspan class=\"pchip\">עמ׳ \u003cbdi>83–85\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>אימון\u003c/th>\u003cth>התאמה בולטת בחוברת\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">אימון סבולת / אירובי\u003c/th>\u003ctd>שיפור בתפקוד החמצוני, מספר או פעילות המיטוכונדריות, ויכולת לעבוד לאורך זמן.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">אימון כוח / התנגדות\u003c/th>\u003ctd>שיפור בתיאום העצבי וביכולת הפקת כוח; התפתחות היפרטרופיה של סיבי השריר לאורך זמן.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">בתחילת תהליך האימון\u003c/th>\u003ctd>חלק מהשיפור בכוח קשור להתאמות עצביות, עוד לפני שינוי ניכר בגודל השריר.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>מהי היפרטרופיה? ומהו \u003cbdi>DOMS\u003c/bdi>?\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>היפרטרופיה\u003c/strong>: גדילה בגודל סיבי השריר, ולא בהכרח יצירת מספר רב של סיבים חדשים.\u003c/li>\u003cli>\u003cstrong>\u003cbdi>DOMS\u003c/bdi>\u003c/strong>: כאבי שרירים מאוחרים בעקבות מאמץ לא שגרתי, במיוחד עם מרכיב אקסצנטרי.\u003c/li>\u003cli>בחוברת מוסבר שמקור הכאב קשור לנזק זעיר ולתהליך דלקתי מקומי, ולא להצטברות חומצת חלב שנשארת בשריר במשך ימים.\u003c/li>\u003c/ul>\n\u003cdiv class=\"sec-practice\" data-pages=\"83,84,85\" data-title=\"תגובה לאימון והתאוששות\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">בקרה על התנועה: רפלקסים וקולטנים \u003cspan class=\"pchip\">עמ׳ \u003cbdi>86–88\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>מנגנון\u003c/th>\u003cth>מה הוא חש?\u003c/th>\u003cth>תגובה תפקודית מרכזית\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">כישור שריר (\u003cbdi>Muscle Spindle\u003c/bdi>)\u003c/th>\u003ctd>שינוי באורך השריר וקצב המתיחה\u003c/td>\u003ctd>מסייע בתגובה למתיחה ובשמירת תנוחה.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">איבר גולג׳י בגיד (\u003cbdi>Golgi Tendon Organ\u003c/bdi>)\u003c/th>\u003ctd>מתח בגיד\u003c/td>\u003ctd>משפיע על הפעלת שריר בהתאם למתח.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">רפלקס המתיחה\u003c/th>\u003ctd>מתיחה מהירה של שריר\u003c/td>\u003ctd>תגובה עצבית מהירה של השריר הנמתח.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"selfcheck\">\u003ch3>בדיקת ידע עצמית\u003c/h3>\u003col>\u003cli>\u003cdetails>\u003csummary>מהי יחידה מוטורית?\u003c/summary>\u003cp>נוירון מוטורי וסיבי השריר שהוא מפעיל.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מה תפקיד הסידן בכיווץ?\u003c/summary>\u003cp>לאפשר את הקישור בין אקטין למיוזין דרך מערכת חלבוני הבקרה.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מה ההבדל העיקרי בין \u003cbdi>ST\u003c/bdi> לבין \u003cbdi>FT\u003c/bdi>?\u003c/summary>\u003cp>\u003cbdi>ST\u003c/bdi> איטיים ועמידים יחסית; \u003cbdi>FT\u003c/bdi> מהירים ומותאמים להפקת כוח/הספק מהיר.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מהו \u003cbdi>Power Stroke\u003c/bdi>?\u003c/summary>\u003cp>תנועת ראש המיוזין שמושכת את סיב האקטין במהלך מחזור גשרי הרוחב.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מדוע כאבי שרירים מאוחרים אינם פשוט תוצאה של ״חומצת חלב שנתקעה״?\u003c/summary>\u003cp>לפי החוברת הם קשורים לנזק מיקרוסקופי ולתגובה דלקתית לאחר מאמץ לא שגרתי.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מה ההבדל בין כישור השריר לאיבר גולג׳י?\u003c/summary>\u003cp>כישור השריר עוקב אחר מתיחה; איבר גולג׳י רגיש למתח בגיד.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מהו עיקרון הגיוס לפי החוברת?\u003c/summary>\u003cp>עם עליית דרישת הכוח מגויסות יחידות מוטוריות נוספות, כולל מהירות יותר.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מהי היפרטרופיה?\u003c/summary>\u003cp>גדילה של סיבי השריר.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>איזה תפקיד יש ל-\u003cbdi>ATP\u003c/bdi> במעגל גשרי הרוחב?\u003c/summary>\u003cp>הוא מאפשר בין היתר שחרור של ראש המיוזין מן האקטין והמשך מחזור הכיווץ.\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-pages=\"86,87,88\" data-title=\"בקרה על התנועה: רפלקסים וקולטנים\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">בדיקת הבנה בעל פה\u003c/h2>\n\u003col>\u003cli>איזה מבנה נחשב ליחידת הכיווץ התפקודית של השריר?\u003c/li>\u003cli>הקריאו את שרשרת האירועים מפקודה עצבית עד לתנועת ראשי המיוזין.\u003c/li>\u003cli>מה המשמעות של הצמדת \u003cbdi>ATP\u003c/bdi> לראש המיוזין במחזור הכיווץ?\u003c/li>\u003cli>איזו יחידה מוטורית מגויסת קודם ככלל כשעולים בדרישת הכוח?\u003c/li>\u003cli>מה ההבדל בין \u003cbdi>Type I\u003c/bdi> / \u003cbdi>ST\u003c/bdi> ל-\u003cbdi>Type II\u003c/bdi> / \u003cbdi>FT\u003c/bdi>?\u003c/li>\u003cli>מדוע \u003cbdi>DOMS\u003c/bdi> אינו נובע מחומצת חלב שנשארה בשריר ימים?\u003c/li>\u003cli>מה ההבדל בין כישור שריר לבין איבר גולג׳י בגיד?\u003c/li>\u003c/ol>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-title=\"בדיקת הבנה בעל פה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">בלבולים שכדאי להימנע מהם\u003c/h2>\n\u003cul>\u003cli>חלבוני האקטין והמיוזין אינם מתקצרים: הם מחליקים זה ביחס לזה והסרקומר מתקצר.\u003c/li>\u003cli>\u003cbdi>DOMS\u003c/bdi> אינו ״לקטט תקוע״.\u003c/li>\u003cli>לא לערבב בין גיוס יחידות מוטוריות ובין היפרטרופיה.\u003c/li>\u003c/ul>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-title=\"בלבולים שכדאי להימנע מהם\">\u003c/div>\u003c/section>","key":"L-B02","sourcePages":[75,91]},{"topicId":"B03","title":"מערכת הנשימה","unit":"יחידה 03 · עמודי מקור 92–103","howTo":"ללמוד לפי סדר היחידות; לאחר כל תת-נושא לפתוח תרגול ולהמשיך רק אחרי הבנה. נוסחאות יש לקרוא עם יחידות מדידה, ולתרשימים יש לתת פירוש מילולי.","sections":[{"title":"מהם תפקידי מערכת הנשימה?","pages":"92–94"},{"title":"מסלול האוויר","pages":"92–94"},{"title":"שאיפה ונשיפה: קשר בין נפח ללחץ","pages":"95–96"},{"title":"מדדים ונוסחאות נשימה","pages":"97–98"},{"title":"מה משתנה במאמץ?","pages":"98–101"},{"title":"בדיקת הבנה בעל פה","pages":""},{"title":"בלבולים שכדאי להימנע מהם","pages":""}],"html":"\u003cp>האוויר נכנס לריאות, חמצן עובר לדם ופחמן דו-חמצני נפלט. במאמץ יש צורך להגדיל את קצב האוורור ואת חילוף הגזים.\u003c/p>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">מהם תפקידי מערכת הנשימה? \u003cspan class=\"pchip\">עמ׳ \u003cbdi>92–94\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>הכנסת חמצן\u003c/strong> לסביבה שבה הוא יכול לעבור אל זרם הדם.\u003c/li>\u003cli>\u003cstrong>הוצאת פחמן דו-חמצני\u003c/strong> שנוצר בתהליכים מטבוליים.\u003c/li>\u003cli>\u003cstrong>סיוע בוויסות חומציות הדם\u003c/strong> דרך פינוי \u003cbdi>CO₂\u003c/bdi>.\u003c/li>\u003cli>תפקידי סינון, חימום ולחלוח של האוויר בדרכי הנשימה.\u003c/li>\u003c/ul>\n\u003cdiv class=\"sec-practice\" data-pages=\"92,93,94\" data-title=\"מהם תפקידי מערכת הנשימה?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">מסלול האוויר \u003cspan class=\"pchip\">עמ׳ \u003cbdi>92–94\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cfigure class=\"gfig flow\" aria-label=\"רצף\">\u003col>\u003cli>אף / פה\u003c/li>\u003cli>קנה הנשימה\u003c/li>\u003cli>סמפונות\u003c/li>\u003cli>סמפונונות\u003c/li>\u003cli>נאדיות ריאה\u003c/li>\u003c/ol>\u003c/figure>\n\u003cp>ב\u003cstrong>נאדיות הריאה (\u003cbdi>Alveoli\u003c/bdi>)\u003c/strong> מתרחש חילוף הגזים: חמצן עובר מן האוויר הנאדיתי אל הדם; פחמן דו-חמצני נע בכיוון ההפוך. התהליך מתרחש בדיפוזיה בהתאם להבדלי לחצים חלקיים.\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"92,93,94\" data-title=\"מסלול האוויר\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">שאיפה ונשיפה: קשר בין נפח ללחץ \u003cspan class=\"pchip\">עמ׳ \u003cbdi>95–96\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>שלב\u003c/th>\u003cth>מה קורה בנפח בית החזה?\u003c/th>\u003cth>מה קורה ללחץ בריאות?\u003c/th>\u003cth>כיוון האוויר\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">שאיפה במנוחה\u003c/th>\u003ctd>הנפח גדל\u003c/td>\u003ctd>הלחץ יורד יחסית לאטמוספרה\u003c/td>\u003ctd>אוויר נכנס\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">נשיפה רגילה\u003c/th>\u003ctd>הנפח קטן\u003c/td>\u003ctd>הלחץ עולה יחסית לאטמוספרה\u003c/td>\u003ctd>אוויר יוצא\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">היגיון לזכירה\u003c/span>\u003cdiv>\u003cp>כשהנפח גדל, הלחץ יורד והאוויר נכנס; כשהנפח קטן, הלחץ עולה והאוויר יוצא. זהו העיקרון שממחיש חוק בויל בחוברת.\u003c/p>\u003c/div>\u003c/aside>\n\u003cp>בשאיפה רגילה הסרעפת מתכווצת ויורדת; בשאיפה עמוקה או במאמץ מגויסים גם שרירי עזר. נשיפה רגילה במנוחה היא בעיקרה פסיבית, בעוד נשיפה מאומצת מסתייעת בשרירים נוספים (עמ׳ 96).\u003c/p>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">שתי שאלות לפני שממשיכים\u003c/span>\u003cdiv>\u003cp>\u003cstrong>מתי האוויר נכנס?\u003c/strong> כשהלחץ בריאות יורד מתחת ללחץ האטמוספרי. \u003cstrong>היכן עובר החמצן לדם?\u003c/strong> מדופן נאדיות הריאה אל הנימים.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"95,96\" data-title=\"שאיפה ונשיפה: קשר בין נפח ללחץ\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">מדדים ונוסחאות נשימה \u003cspan class=\"pchip\">עמ׳ \u003cbdi>97–98\u003c/bdi>\u003c/span>\u003c/h2>\n\u003caside class=\"gnote fbox\">\u003cspan class=\"tag\">אוורור ריאתי בדקה (\u003cbdi>Minute Ventilation\u003c/bdi>)\u003c/span>\u003cdiv>\u003cdiv class=\"eqn\" dir=\"ltr\">VE = breathing frequency × tidal volume\u003c/div>\u003c/div>\u003c/aside>\n\u003caside class=\"gnote fbox\">\u003cspan class=\"tag\">אוורור נאדיתי בדקה\u003c/span>\u003cdiv>\u003cdiv class=\"eqn\" dir=\"ltr\">VA = breathing frequency × (tidal volume − dead space)\u003c/div>\u003c/div>\u003c/aside>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">דוגמת החוברת במנוחה\u003c/span>\u003cdiv>\u003cp>12 נשימות לדקה × 0.5 ליטר לנשימה = \u003cstrong>6 ליטר אוויר לדקה\u003c/strong>. אם הנפח המת 150 מ״ל: 12 × (500 − 150) = 4,200 \u003cbdi>mL/min\u003c/bdi>, כלומר \u003cstrong>4.2 ליטר לדקה\u003c/strong> של אוורור נאדיתי.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>מושג\u003c/th>\u003cth>מה הוא אומר?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Tidal Volume\u003c/bdi> / \u003cbdi>TV\u003c/bdi>\u003c/th>\u003ctd>נפח האוויר המתחלף בנשימה רגילה.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Respiratory Rate\u003c/bdi> / \u003cbdi>F\u003c/bdi>\u003c/th>\u003ctd>מספר הנשימות בדקה.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Dead Space\u003c/bdi>\u003c/th>\u003ctd>נפח אוויר שאינו משתתף בחילוף הגזים בנאדיות.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Minute Ventilation\u003c/bdi> / \u003cbdi>VE\u003c/bdi>\u003c/th>\u003ctd>סך נפח האוויר שמתחלף בדקה.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Alveolar Ventilation\u003c/bdi> / \u003cbdi>VA\u003c/bdi>\u003c/th>\u003ctd>האוויר שמגיע לנאדיות לצורכי חילוף גזים.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-pages=\"97,98\" data-title=\"מדדים ונוסחאות נשימה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">מה משתנה במאמץ? \u003cspan class=\"pchip\">עמ׳ \u003cbdi>98–101\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cul>\u003cli>עולה \u003cstrong>תדירות הנשימה\u003c/strong> (\u003cbdi>F\u003c/bdi>).\u003c/li>\u003cli>עולה \u003cstrong>הנפח המתחלף בכל נשימה\u003c/strong> (\u003cbdi>TV\u003c/bdi>), עד שלב מסוים.\u003c/li>\u003cli>כתוצאה מכך עולה \u003cstrong>האוורור לדקה\u003c/strong> (\u003cbdi>VE\u003c/bdi>).\u003c/li>\u003cli>קצב האוורור גובר עם עליית עצימות המאמץ, ומתאים את פינוי \u003cbdi>CO₂\u003c/bdi> וקליטת \u003cbdi>O₂\u003c/bdi> לצורכי הגוף.\u003c/li>\u003cli>בחוברת מודגש כי המגבלה בפעילות של אדם בריא אינה בהכרח יכולת מכנית של מערכת הנשימה בלבד.\u003c/li>\u003c/ul>\n\u003cdiv class=\"selfcheck\">\u003ch3>בדיקת ידע עצמית\u003c/h3>\u003col>\u003cli>\u003cdetails>\u003csummary>מה ההבדל בין אוורור ריאתי לבין אוורור נאדיתי?\u003c/summary>\u003cp>האוורור הריאתי כולל את כלל האוויר הנכנס והיוצא; האוורור הנאדיתי מחסיר את הנפח המת.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מהו \u003cbdi>VE\u003c/bdi> בנשימה של 15 פעמים בדקה ונפח 0.6 ליטר?\u003c/summary>\u003cp>9 ליטר לדקה.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>למה חשוב לפנות \u003cbdi>CO₂\u003c/bdi>?\u003c/summary>\u003cp>לצמצם את הצטברותו ולסייע בוויסות מאזן החומצה-בסיס.\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-pages=\"98,99,100,101\" data-title=\"מה משתנה במאמץ?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">בדיקת הבנה בעל פה\u003c/h2>\n\u003col>\u003cli>איך מגיע האוויר מן האף עד לנאדיות?\u003c/li>\u003cli>במהלך שאיפה, מה קורה לנפח בית החזה וללחץ בריאות?\u003c/li>\u003cli>היכן מתרחש מעבר החמצן לדם ובאיזה מנגנון?\u003c/li>\u003cli>חשב \u003cbdi>VE\u003c/bdi> עבור 12 נשימות בדקה ו-500 מ״ל לנשימה.\u003c/li>\u003cli>חשב אוורור נאדיתי כשנפח מת הוא 150 מ״ל.\u003c/li>\u003cli>מדוע האוורור עולה בזמן מאמץ?\u003c/li>\u003c/ol>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-title=\"בדיקת הבנה בעל פה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">בלבולים שכדאי להימנע מהם\u003c/h2>\n\u003cul>\u003cli>\u003cbdi>VE\u003c/bdi> כולל את הנפח המת, ואילו \u003cbdi>VA\u003c/bdi> מחסיר אותו.\u003c/li>\u003cli>הסרעפת מתכווצת בשאיפה רגילה; נשיפה רגילה במנוחה היא בעיקרה פסיבית.\u003c/li>\u003cli>להבחין בין נפח אוויר בנשימה אחת לבין נפח בדקה.\u003c/li>\u003c/ul>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-title=\"בלבולים שכדאי להימנע מהם\">\u003c/div>\u003c/section>","key":"L-B03","sourcePages":[92,103]},{"topicId":"B04","title":"המערכת האנדוקרינית","unit":"יחידה 04 · עמודי מקור 104–118","howTo":"ללמוד לפי סדר היחידות; לאחר כל תת-נושא לפתוח תרגול ולהמשיך רק אחרי הבנה. נוסחאות יש לקרוא עם יחידות מדידה, ולתרשימים יש לתת פירוש מילולי.","sections":[{"title":"עקרונות יסוד","pages":"104–106"},{"title":"מפת בלוטות והורמונים","pages":"104, 107–115"},{"title":"אינסולין מול גלוקגון","pages":"111–112"},{"title":"יותרת הכליה: קליפה מול ליבה","pages":"108–110"},{"title":"היפופיזה: קדמית ואחורית","pages":"113–116"},{"title":"שלושה קשרים חשובים שכדאי לשנן","pages":"111–116"},{"title":"בדיקת הבנה בעל פה","pages":""},{"title":"בלבולים שכדאי להימנע מהם","pages":""}],"html":"\u003cp>מערכת בקרה כימית: בלוטות מפרישות הורמונים לדם, ההורמונים נקשרים לקולטנים ייעודיים ומשנים פעילות של תאי מטרה.\u003c/p>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">עקרונות יסוד \u003cspan class=\"pchip\">עמ׳ \u003cbdi>104–106\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>בלוטה אנדוקרינית\u003c/strong> מפרישה הורמונים אל הדם; \u003cstrong>בלוטה אקסוקרינית\u003c/strong> מפרישה דרך צינור אל משטח או חלל בגוף.\u003c/li>\u003cli>הורמון יכול להשפיע רק על תאים בעלי \u003cstrong>קולטן מתאים\u003c/strong>.\u003c/li>\u003cli>התגובה תלויה בסוג ההורמון, סוג הקולטן ומצב התא.\u003c/li>\u003cli>\u003cstrong>משוב שלילי\u003c/strong> הוא מנגנון בקרה מרכזי: כאשר רמת הגורם או התוצאה עולה, האות להמשך הייצור קטן.\u003c/li>\u003c/ul>\n\u003cfigure class=\"gfig flow\" aria-label=\"רצף\">\u003col>\u003cli>שינוי במצב הגוף\u003c/li>\u003cli>הפעלת בלוטה\u003c/li>\u003cli>הפרשת הורמון\u003c/li>\u003cli>תגובה בתא מטרה\u003c/li>\u003cli>משוב שלילי\u003c/li>\u003c/ol>\u003c/figure>\n\u003cdiv class=\"sec-practice\" data-pages=\"104,105,106\" data-title=\"עקרונות יסוד\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">מפת בלוטות והורמונים \u003cspan class=\"pchip\">עמ׳ \u003cbdi>104, 107–115\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>בלוטה / מקור\u003c/th>\u003cth>הורמון מרכזי\u003c/th>\u003cth>פעולה עיקרית לפי החוברת\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">בלוטת התריס\u003c/th>\u003ctd>\u003cbdi>T3\u003c/bdi>, \u003cbdi>T4\u003c/bdi> (\u003cbdi>Thyroxine\u003c/bdi>)\u003c/td>\u003ctd>השפעה על קצב חילוף החומרים והפעילות התאית.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">קליפת יותרת הכליה\u003c/th>\u003ctd>\u003cbdi>Aldosterone\u003c/bdi>\u003c/td>\u003ctd>ויסות מלחים ומים, השפעה על נפח הדם ולחץ הדם.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">קליפת יותרת הכליה\u003c/th>\u003ctd>\u003cbdi>Cortisol\u003c/bdi>\u003c/td>\u003ctd>תגובה לעקה, השפעות על זמינות מקורות אנרגיה ועל מטבוליזם.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">ליבת יותרת הכליה\u003c/th>\u003ctd>\u003cbdi>Adrenaline\u003c/bdi> / \u003cbdi>Noradrenaline\u003c/bdi>\u003c/td>\u003ctd>תגובה מהירה של ״הילחם או ברח״.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">לבלב, תאי בטא\u003c/th>\u003ctd>\u003cbdi>Insulin\u003c/bdi>\u003c/td>\u003ctd>מסייע לכניסת גלוקוז לתאים ומפחית רמת סוכר בדם.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">לבלב, תאי אלפא\u003c/th>\u003ctd>\u003cbdi>Glucagon\u003c/bdi>\u003c/td>\u003ctd>מעלה את זמינות הגלוקוז בדם.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">היפופיזה קדמית\u003c/th>\u003ctd>\u003cbdi>GH\u003c/bdi>\u003c/td>\u003ctd>הורמון גדילה; מקושר גם לפעולות דרך \u003cbdi>IGF-1\u003c/bdi>.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">היפופיזה אחורית\u003c/th>\u003ctd>\u003cbdi>ADH\u003c/bdi>\u003c/td>\u003ctd>וויסות החזרת מים בכליות; פחות מים בשתן.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">היפופיזה אחורית\u003c/th>\u003ctd>\u003cbdi>Oxytocin\u003c/bdi>\u003c/td>\u003ctd>מעורב בהתכווצות הרחם ובהפרשת חלב.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">בלוטות המין\u003c/th>\u003ctd>\u003cbdi>Testosterone\u003c/bdi> / \u003cbdi>Estrogen\u003c/bdi>\u003c/td>\u003ctd>מאפייני מין, רבייה והשפעות על רקמות הגוף.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">בדיקת ידע: מהו משוב שלילי?\u003c/span>\u003cdiv>\u003cp>מנגנון שבו התוצאה או השינוי שנוצר גורמים להחלשת האות להמשך הפעילות. לדוגמה, כשהערך שבבקרה חוזר לאיזון, פוחת הצורך בהפרשה נוספת.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"104,107,108,109,110,111,112,113,114,115\" data-title=\"מפת בלוטות והורמונים\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">אינסולין מול גלוקגון \u003cspan class=\"pchip\">עמ׳ \u003cbdi>111–112\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>אינסולין\u003c/th>\u003cth>גלוקגון\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">מופרש כאשר רמת הגלוקוז בדם עולה.\u003c/th>\u003ctd>מופרש כאשר רמת הגלוקוז בדם יורדת.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">מעודד ניצול ואגירה של גלוקוז.\u003c/th>\u003ctd>מעודד גיוס מאגרי גלוקוז.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">תורם לירידה ברמת הגלוקוז בדם.\u003c/th>\u003ctd>תורם לעלייה ברמת הגלוקוז בדם.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">סיפור קצר לזכירה\u003c/span>\u003cdiv>\u003cfigure class=\"gfig flow\" aria-label=\"רצף\">\u003col>\u003cli>אחרי ארוחה: סוכר עולה\u003c/li>\u003cli>אינסולין עולה\u003c/li>\u003cli>התא קולט/אוגר גלוקוז. בעת מחסור בסוכר: גלוקגון מסייע להעלות את זמינותו\u003c/li>\u003c/ol>\u003c/figure>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"111,112\" data-title=\"אינסולין מול גלוקגון\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">יותרת הכליה: קליפה מול ליבה \u003cspan class=\"pchip\">עמ׳ \u003cbdi>108–110\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>קליפה (\u003cbdi>Cortex\u003c/bdi>)\u003c/th>\u003cth>ליבה (\u003cbdi>Medulla\u003c/bdi>)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">מפרישה הורמונים סטרואידיים כגון קורטיזול ואלדוסטרון.\u003c/th>\u003ctd>מפרישה קטכולאמינים, בעיקר אדרנלין ונוראדרנלין.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">ויסות מטבולי, מאזן מלחים ומים והתמודדות עם עקה.\u003c/th>\u003ctd>תגובה מהירה באמצעות מערכת העצבים הסימפתטית.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-pages=\"108,109,110\" data-title=\"יותרת הכליה: קליפה מול ליבה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">היפופיזה: קדמית ואחורית \u003cspan class=\"pchip\">עמ׳ \u003cbdi>113–116\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>היפופיזה קדמית:\u003c/strong> החוברת מפרטת את תפקידי \u003cbdi>GH\u003c/bdi> ואת הקשר בינו לבין \u003cbdi>IGF-1\u003c/bdi> בתהליכי גדילה.\u003c/li>\u003cli>\u003cstrong>היפופיזה אחורית:\u003c/strong> משחררת \u003cbdi>ADH\u003c/bdi> ואוקסיטוצין, שמיוצרים בהיפותלמוס ומועברים לאחסון ולשחרור.\u003c/li>\u003cli>\u003cstrong>\u003cbdi>ADH\u003c/bdi>:\u003c/strong> משמש לוויסות מאזן הנוזלים. כאשר צריך לחסוך מים, ההפרשה מגבירה החזרת מים בכליות.\u003c/li>\u003c/ul>\n\u003cdiv class=\"sec-practice\" data-pages=\"113,114,115,116\" data-title=\"היפופיזה: קדמית ואחורית\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">שלושה קשרים חשובים שכדאי לשנן \u003cspan class=\"pchip\">עמ׳ \u003cbdi>111–116\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>מצב או גירוי\u003c/th>\u003cth>התגובה ההורמונלית\u003c/th>\u003cth>מה התוצאה שמבקשים להשיג?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">ריכוז גלוקוז גבוה בדם\u003c/th>\u003ctd>עלייה בהפרשת אינסולין\u003c/td>\u003ctd>הכנסת גלוקוז לתאים וירידה ברמתו בדם.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">ריכוז גלוקוז נמוך בדם\u003c/th>\u003ctd>עלייה בהפרשת גלוקגון\u003c/td>\u003ctd>הגדלת זמינות הגלוקוז בדם.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">מחסור במים / צורך בשימור נוזלים\u003c/th>\u003ctd>הפרשת \u003cbdi>ADH\u003c/bdi>\u003c/td>\u003ctd>הגדלת ספיגה חוזרת של מים בכליות.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">הפרשת \u003cbdi>GH\u003c/bdi>\u003c/th>\u003ctd>פעולה ישירה וגם באמצעות \u003cbdi>IGF-1\u003c/bdi>\u003c/td>\u003ctd>השפעות על גדילה והתפתחות רקמות.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">מסלול \u003cbdi>GH\u003c/bdi> ו-\u003cbdi>IGF-1\u003c/bdi>\u003c/span>\u003cdiv>\u003cp>\u003cbdi>GH\u003c/bdi> מופרש מן ההיפופיזה הקדמית. החוברת מתארת השפעות גדילה הקשורות גם ל-\u003cbdi>IGF-1\u003c/bdi>, המיוצר בתגובה ל-\u003cbdi>GH\u003c/bdi> (עמ׳ 114–115). אין לבלבל בין שם הבלוטה לשם ההורמון.\u003c/p>\u003c/div>\u003c/aside>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">דוגמה בתנאי מאמץ\u003c/span>\u003cdiv>\u003cp>באיבוד נוזלים עקב הזעה, מנגנוני הבקרה עשויים להגביר את הפרשת \u003cbdi>ADH\u003c/bdi>, וכך הכליות מחזירות יותר מים לגוף (עמ׳ 115–116).\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"selfcheck\">\u003ch3>בדיקת ידע עצמית\u003c/h3>\u003col>\u003cli>\u003cdetails>\u003csummary>מה ההבדל בין בלוטה אנדוקרינית לאקסוקרינית?\u003c/summary>\u003cp>אנדוקרינית מפרישה הורמונים לדם; אקסוקרינית מפרישה דרך צינור.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>אילו תאים בלבלב מפרישים אינסולין?\u003c/summary>\u003cp>תאי בטא.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מה עושה גלוקגון?\u003c/summary>\u003cp>מסייע בהעלאת רמת הגלוקוז בדם.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מה ההבדל בין קליפת יותרת הכליה לליבה?\u003c/summary>\u003cp>הקליפה קשורה להורמונים כגון קורטיזול ואלדוסטרון; הליבה לאדרנלין ונוראדרנלין.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מהי פעולתו המרכזית של \u003cbdi>ADH\u003c/bdi>?\u003c/summary>\u003cp>סיוע בשמירת מים באמצעות הגברת החזרה שלהם בכליות.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>איפה מיוצר \u003cbdi>ADH\u003c/bdi>, ומאיפה הוא משתחרר לדם?\u003c/summary>\u003cp>מיוצר בהיפותלמוס ומשתחרר מההיפופיזה האחורית.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>איזה הורמון מן ההיפופיזה הקדמית קשור ל-\u003cbdi>IGF-1\u003c/bdi>?\u003c/summary>\u003cp>\u003cbdi>GH\u003c/bdi>, הורמון הגדילה.\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-pages=\"111,112,113,114,115,116\" data-title=\"שלושה קשרים חשובים שכדאי לשנן\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">בדיקת הבנה בעל פה\u003c/h2>\n\u003col>\u003cli>כיצד הורמון שמופרש לדם משפיע רק על תאי מטרה מסוימים?\u003c/li>\u003cli>כיצד משוב שלילי שומר על יציבות בגוף?\u003c/li>\u003cli>מה עושה אינסולין כאשר רמת הסוכר בדם עולה? ומה עושה גלוקגון כשהיא יורדת?\u003c/li>\u003cli>אילו הורמונים קשורים לקליפת יותרת הכליה, ואילו לליבה?\u003c/li>\u003cli>מה ההבדל בין \u003cbdi>GH\u003c/bdi> לבין \u003cbdi>IGF-1\u003c/bdi>?\u003c/li>\u003cli>כיצד \u003cbdi>ADH\u003c/bdi> מפחית אובדן נוזלים דרך הכליה?\u003c/li>\u003c/ol>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-title=\"בדיקת הבנה בעל פה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">בלבולים שכדאי להימנע מהם\u003c/h2>\n\u003cul>\u003cli>לא לערבב בין מקור ההורמון לתפקידו: בייחוד תאי בטא/אלפא בלבלב.\u003c/li>\u003cli>להבחין בין קליפה (\u003cbdi>Cortex\u003c/bdi>) לבין ליבה (\u003cbdi>Medulla\u003c/bdi>) ביותרת הכליה.\u003c/li>\u003cli>בהיפופיזה האחורית ההורמונים מיוצרים בהיפותלמוס ומשוחררים מן ההיפופיזה.\u003c/li>\u003c/ul>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-title=\"בלבולים שכדאי להימנע מהם\">\u003c/div>\u003c/section>","key":"L-B04","sourcePages":[104,118]},{"topicId":"B05","title":"מערכת החיסון","unit":"יחידה 05 · עמודי מקור 119–126","howTo":"ללמוד לפי סדר היחידות; לאחר כל תת-נושא לפתוח תרגול ולהמשיך רק אחרי הבנה. נוסחאות יש לקרוא עם יחידות מדידה, ולתרשימים יש לתת פירוש מילולי.","sections":[{"title":"מרכיבי המערכת ותפקידה","pages":"119–120"},{"title":"קווי ההגנה","pages":"119–122"},{"title":"תאי הגנה ותהליכים","pages":"120–123"},{"title":"מהי דלקת ומהי פגוציטוזה?","pages":"121–124"},{"title":"בדיקת הבנה בעל פה","pages":""},{"title":"בלבולים שכדאי להימנע מהם","pages":""}],"html":"\u003cp>מערכת הגנה המזהה גורמים זרים, מגיבה אליהם ומצמצמת את הסיכון לנזק ברקמות הגוף.\u003c/p>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">מרכיבי המערכת ותפקידה \u003cspan class=\"pchip\">עמ׳ \u003cbdi>119–120\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cul>\u003cli>החוברת מתארת איברים ורקמות הקשורים להגנה: מח העצם, קשרי לימפה, טחול, תימוס ותאי דם לבנים.\u003c/li>\u003cli>המטרה: זיהוי גורם זר, הפעלת הגנה מקומית או מערכתית וסילוק האיום.\u003c/li>\u003cli>יש תגובות \u003cstrong>לא ספציפיות (מולדות)\u003c/strong> ותגובות \u003cstrong>ספציפיות (נרכשות)\u003c/strong>.\u003c/li>\u003c/ul>\n\u003cdiv class=\"sec-practice\" data-pages=\"119,120\" data-title=\"מרכיבי המערכת ותפקידה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">קווי ההגנה \u003cspan class=\"pchip\">עמ׳ \u003cbdi>119–122\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>קו\u003c/th>\u003cth>דוגמאות\u003c/th>\u003cth>מאפיין מרכזי\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">קו הגנה ראשון\u003c/th>\u003ctd>עור, ריריות, הפרשות וחומרים מגינים\u003c/td>\u003ctd>חסימת כניסת גורמים זרים.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">קו הגנה שני\u003c/th>\u003ctd>תאי בליעה, תגובה דלקתית, גורמים מסיסים בדם\u003c/td>\u003ctd>תגובה לא ספציפית ומהירה יחסית.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">קו הגנה שלישי\u003c/th>\u003ctd>לימפוציטים \u003cbdi>B\u003c/bdi> ו-\u003cbdi>T\u003c/bdi>, נוגדנים וזיכרון חיסוני\u003c/td>\u003ctd>תגובה ממוקדת לגורם מסוים.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-pages=\"119,120,121,122\" data-title=\"קווי ההגנה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">תאי הגנה ותהליכים \u003cspan class=\"pchip\">עמ׳ \u003cbdi>120–123\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>גורם\u003c/th>\u003cth>מה חשוב לזכור?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">נויטרופילים\u003c/th>\u003ctd>משתתפים בתגובה ראשונית ובבליעה של גורמים זרים.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">מקרופאגים\u003c/th>\u003ctd>תאים בולעניים המסייעים בסילוק גורמים זרים ופסולת.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">לימפוציטים \u003cbdi>B\u003c/bdi>\u003c/th>\u003ctd>קשורים לייצור נוגדנים ולזיכרון חיסוני.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">לימפוציטים \u003cbdi>T\u003c/bdi>\u003c/th>\u003ctd>משתתפים בתגובות חיסון תאיות ובהכוונת התגובה.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">נוגדנים\u003c/th>\u003ctd>חלבונים ייחודיים המסוגלים לזהות ולהיקשר לאנטיגנים.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">מערכת המשלים (\u003cbdi>Complement\u003c/bdi>)\u003c/th>\u003ctd>קבוצת חלבונים המשתתפת בהעצמת התגובה החיסונית ובפגיעה בגורמים זרים.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-pages=\"120,121,122,123\" data-title=\"תאי הגנה ותהליכים\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">מהי דלקת ומהי פגוציטוזה? \u003cspan class=\"pchip\">עמ׳ \u003cbdi>121–124\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cp>\u003cstrong>תגובה דלקתית\u003c/strong> היא חלק ממנגנון ההגנה הלא-ספציפי. לאחר פגיעה או חדירת גורם זר מתרחשים שינויים מקומיים בכלי הדם, ותאי הגנה מגויסים לאזור.\u003c/p>\n\u003cfigure class=\"gfig flow\" aria-label=\"רצף\">\u003col>\u003cli>גורם זר / נזק\u003c/li>\u003cli>אותות הגנה\u003c/li>\u003cli>גיוס תאי דם לבנים\u003c/li>\u003cli>בליעה / סילוק\u003c/li>\u003cli>החלמה\u003c/li>\u003c/ol>\u003c/figure>\n\u003cp>\u003cstrong>פגוציטוזה (\u003cbdi>Phagocytosis\u003c/bdi>)\u003c/strong> היא בליעת גורם זר על ידי תא הגנה ופירוקו. התרשים בחוברת (עמ׳ 122) מציג את הכנסת החומר לתא וחיבורו למנגנוני פירוק תוך-תאיים.\u003c/p>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">ההבחנה החשובה למבחן\u003c/span>\u003cdiv>\u003cp>\u003cstrong>הגנה לא-ספציפית:\u003c/strong> מגיבה בדרכים דומות למגוון גורמים. \u003cstrong>הגנה ספציפית:\u003c/strong> מזהה אנטיגנים מסוימים וכוללת תאים ומנגנוני זיכרון.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"selfcheck\">\u003ch3>בדיקת ידע עצמית\u003c/h3>\u003col>\u003cli>\u003cdetails>\u003csummary>מה תפקיד העור בקו ההגנה הראשון?\u003c/summary>\u003cp>מחסום פיזי שמפחית חדירת גורמים זרים.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מהי פגוציטוזה?\u003c/summary>\u003cp>תהליך שבו תא הגנה בולע ומפרק חומר או גורם זר.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>אילו תאים קשורים לייצור נוגדנים?\u003c/summary>\u003cp>לימפוציטים \u003cbdi>B\u003c/bdi> לאחר התמיינות לתאי פלזמה.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>במה מתאפיין קו ההגנה השלישי?\u003c/summary>\u003cp>תגובה ייחודית לאנטיגן, בעזרת לימפוציטים וזיכרון חיסוני.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מהי מערכת המשלים?\u003c/summary>\u003cp>חלבונים המסייעים בהגנה ובפעילות התגובה החיסונית.\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-pages=\"121,122,123,124\" data-title=\"מהי דלקת ומהי פגוציטוזה?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">בדיקת הבנה בעל פה\u003c/h2>\n\u003col>\u003cli>איזה מחסום מגן בקו ההגנה הראשון?\u003c/li>\u003cli>מהו תפקיד הנויטרופילים והמקרופאגים?\u003c/li>\u003cli>מהם ההבדלים בין ההגנה הלא-ספציפית לספציפית?\u003c/li>\u003cli>מה קורה בתהליך פגוציטוזה?\u003c/li>\u003cli>מי קשור לייצור נוגדנים ומה תפקידם?\u003c/li>\u003cli>מהי מערכת המשלים ואיך היא מסייעת להגנה?\u003c/li>\u003c/ol>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-title=\"בדיקת הבנה בעל פה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec\">\u003ch2 class=\"part\">בלבולים שכדאי להימנע מהם\u003c/h2>\n\u003cul>\u003cli>לימפוציטים \u003cbdi>B\u003c/bdi> ו-\u003cbdi>T\u003c/bdi> אינם בעלי אותו תפקיד.\u003c/li>\u003cli>קו ההגנה השני אינו זהה לקו השלישי; האחרון כולל זיהוי ייחודי וזיכרון.\u003c/li>\u003cli>פגוציטוזה היא בליעה ופירוק של גורם זר, לא יצירת נוגדן.\u003c/li>\u003c/ul>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-title=\"בלבולים שכדאי להימנע מהם\">\u003c/div>\u003c/section>","key":"L-B05","sourcePages":[119,126]}],"episodes":[{"id":"PB-AUDIO-01","n":1,"title":"מערכת הלב וכלי הדם","topicId":"B01","durationSec":null,"src":null},{"id":"PB-AUDIO-02","n":2,"title":"פיזיולוגיה של השריר ומערכת העצבים"   try { const raw = localStorage.getItem(LS_KEY); store.local = true; return raw ? normalize(JSON.parse(raw)) : null; }
  catch { store.local = false; return null; }
}
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); store.local = true; } catch { store.local = false; } }
let S = loadLocal() || blankState();
function commit() { S.updatedAt = nowISO(); trimState(S); saveLocal(); scheduleRemote(); renderStatus(); }
function scheduleRemote() { if (!store.ref) return; clearTimeout(store.timer); store.timer = setTimeout(flushRemote, 1500); }
async function flushRemote() {
  if (!store.ref) return;
  if (store.writing) { store.dirty = true; return; }
  store.writing = true;
  try { await store.ref.set(JSON.parse(JSON.stringify(S))); store.lastSync = Date.now(); store.remote = 'on'; }
  catch (e) { const code = e && e.code; if (code === 'unavailable') store.dirty = true; else { store.ref = null; store.remote = code === 'invalid_argument' ? 'readonly' : 'off'; } }
  store.writing = false; renderStatus();
  if (store.dirty && store.ref) { store.dirty = false; setTimeout(flushRemote, 1200 + Math.random() * 800); }
}
async function initRemote() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { store.remote = 'off'; renderStatus(); return; }
  try {
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user) { store.remote = 'off'; renderStatus(); return; }
    const uid = await user.id();
    if (!uid) { store.remote = 'off'; renderStatus(); return; }
    const ref = db.doc(`data/users/${uid}/progress`);
    const snap = await ref.get();
    store.ref = ref; store.remote = 'on';
    const remote = snap.exists ? normalize(JSON.parse(JSON.stringify(snap.data()))) : null;
    if (remote && (!S.updatedAt || (remote.updatedAt && remote.updatedAt > S.updatedAt))) { S = remote; saveLocal(); render(); }
    else if (S.updatedAt) flushRemote();
  } catch { store.ref = null; store.remote = 'off'; }
  renderStatus();
}
const storageMode = () => store.remote === 'on' ? 'account' : store.local ? 'local' : 'none';
function renderStatus() {

  const label = store.remote === 'pending' && store.local ? 'בודק שמירה…' : m === 'account' ? 'נשמר בחשבון' : m === 'local' ? 'נשמר בדפדפן' : 'לא נשמר';
  chip.innerHTML = `<span class="dot" aria-hidden="true"></span>${label}`;

// ---------- derived stats ----------
function latestBy(list) { const m = {}; for (const a of list) m[a.questionId] = a; return m; }
function topicStats(tid) {
  const qs = D.mcq.filter(q => q.topicId === tid);
  const ids = new Set(qs.map(q => q.id));
  const att = S.mcqAttempts.filter(a => ids.has(a.questionId));
  const latest = latestBy(att); const uniq = Object.values(latest);
  const cards = D.flashcards.filter(c => c.topicId === tid);
  const recent = att.slice(-5);
  const lesson = D.lessons.find(l => l.topicId === tid);
  return {
    bank: qs.length, attempts: att.length, correct: att.filter(a => a.correct).length, unique: uniq.length,
    mastery: uniq.length >= 5 ? pct(uniq.filter(a => a.correct).length, uniq.length) : null, coverage: pct(uniq.length, qs.length),
    recentWrong: recent.filter(a => !a.correct).length, recentN: recent.length,
    cards: cards.length, cardsKnown: cards.filter(c => S.flashcards[c.id]?.rating === 'known').length,
    lessonDone: lesson ? S.completedLessons.includes(lesson.key) : false,
  };
}
function cardIsDue(id, now = Date.now()) { const c = S.flashcards[id]; return !c || !c.nextDueAt || Date.parse(c.nextDueAt) <= now; }
const dueCards = tid => { const now = Date.now(); return D.flashcards.filter(c => (!tid || c.topicId === tid) && S.flashcards[c.id] && cardIsDue(c.id, now)); };
const newCards = tid => D.flashcards.filter(c => (!tid || c.topicId === tid) && !S.flashcards[c.id]);
const hardCards = tid => D.flashcards.filter(c => (!tid || c.topicId === tid) && ['unknown', 'almost'].includes(S.flashcards[c.id]?.rating));
const mistakeIds = tid => Object.values(latestBy(S.mcqAttempts)).filter(a => !a.correct && (!tid || Q[a.questionId]?.topicId === tid)).map(a => a.questionId);
// first try vs later tries, per question, from the stored attempt log
function tryStats() {
  const by = {}; for (const a of S.mcqAttempts) (by[a.questionId] = by[a.questionId] || []).push(a);
  let f = 0, fOk = 0, r = 0, rOk = 0;
  for (const list of Object.values(by)) { f++; if (list[0].correct) fOk++; for (const a of list.slice(1)) { r++; if (a.correct) rOk++; } }
  return { first: f, firstOk: fOk, retry: r, retryOk: rOk };
}

// The study plan: fixed rules checked in order, so the reason shown is always the rule that fired.
function plan() {
  const out = [];
  if (S.activeExam) out.push({ title: 'יש מבחן פתוח', text: `ענית על ${Object.keys(S.activeExam.answers).length} מתוך ${S.activeExam.qids.length} שאלות. אפשר להמשיך מאותה נקודה.`, cta: 'המשך למבחן', act: 'go', args: { route: 'exam' } });
  const due = dueCards().length;
  if (due >= 8) out.push({ title: `${due} כרטיסיות מחכות לחזרה`, text: 'הגיע מועד החזרה שלהן לפי הדירוג הקודם שלך.', cta: 'לחזרה על כרטיסיות', act: 'startCardsQuick', args: { mode: 'due' } });
  let worst = null;
  for (const t of TOPICS) { const st = topicStats(t.id); if (st.recentN >= 3 && st.recentWrong >= 2 && (!worst || st.recentWrong > worst.st.recentWrong)) worst = { t, st }; }
  if (worst) out.push({ title: `לחזור על ${worst.t.name}`, text: `${worst.st.recentWrong} טעויות ב-${worst.st.recentN} התשובות האחרונות בנושא.`, cta: 'תרגול הטעויות בנושא', act: 'startPracticeQuick', args: { topic: worst.t.id, pool: 'mistakes' } });
  const next = D.lessons.find(l => !S.completedLessons.includes(l.key));
  if (next) out.push({ title: `ללמוד: ${next.title}`, text: `${next.unit}. בסוף כל תת-נושא יש תרגול על העמודים שלו.`, cta: 'לפתיחת הפרק', act: 'openLesson', args: { key: next.key } });
  let low = null;
  for (const t of TOPICS) { const st = topicStats(t.id); if (!low || st.coverage < low.st.coverage) low = { t, st }; }
  if (low && low.st.coverage < 60) out.push({ title: `לתרגל: ${low.t.name}`, text: `ענית על ${low.st.unique} מתוך ${low.st.bank} השאלות בנושא, הכיסוי הנמוך ביותר.`, cta: 'תרגול 10 שאלות', act: 'startPracticeQuick', args: { topic: low.t.id, pool: 'unseen' } });
  if (out.length < 3) out.push({ title: 'סימולציה מלאה', text: '30 שאלות מכל חמשת הנושאים, 40 דקות. ההסברים מוצגים רק אחרי ההגשה.', cta: 'למבחן', act: 'go', args: { route: 'exam' } });
  return out.slice(0, 3);
}

  document.querySelectorAll('.sec-practice').forEach(el => {

const INTERVAL_DAYS = [0, 1, 3, 7, 14, 30];
function rateCard(id, rating) {
  const c = S.flashcards[id] || { rating: null, reviews: 0, known: 0, almost: 0, unknown: 0, box: 0, lastAt: null, nextDueAt: null };
  c.reviews++; c[rating]++; c.rating = rating; c.lastAt = nowISO();
  const now = Date.now();
  if (rating === 'unknown') { c.box = 0; c.nextDueAt = new Date(now + 10 * 60000).toISOString(); }
  else if (rating === 'almost') { c.box = 1; c.nextDueAt = new Date(now + DAY).toISOString(); }
  else { c.box = Math.min((c.box || 0) + 1, 5); c.nextDueAt = new Date(now + INTERVAL_DAYS[c.box] * DAY).toISOString(); }
  S.flashcards[id] = c;
}
function buildCardQueue(f) {
  const tid = f.topic === 'all' ? null : f.topic;

    const fresh = list.filter(c => !S.flashcards[c.id]);

// ---------- EXAM (from exam_blueprints.json) ----------
// Each topic gets its blueprint weight; inside a topic, at most one question per conceptId (so one formula never
// fills the exam), with difficulties interleaved. If a topic runs short, the gap is filled from the other topics.
function buildExam(bp) {
  const used = new Set(), concepts = new Set(), picked = [];
  const take = (pool, n) => {
    const buckets = ['intermediate', 'advanced', 'basic', 'application'].map(d => shuffle(pool.filter(q => q.difficulty === d)));
    while (n > 0 && buckets.some(b => b.length)) for (const b of buckets) { const q = b.shift(); if (!q || n <= 0) continue; if (used.has(q.id) || concepts.has(q.conceptId)) continue; used.add(q.id); concepts.add(q.conceptId); picked.push(q); n--; }
    return n;
  };
  let short = 0;
  for (const [t, w] of Object.entries(bp.topicWeights)) short += take(D.mcq.filter(q => q.topicId === t), w);
  if (short) take(D.mcq.filter(q => !used.has(q.id)), short);
  return shuffle(picked).map(q => q.id);
}
function startExam(qids, bp) {

  view.examResult = null; commit();
}

function chartSVG(c, W) {
  W = Math.max(300, Math.min(W, 720));
  const H = Math.round(W * (W < 480 ? 0.7 : 0.52));
  const m = { l: 34, r: 16, t: 16, b: 46 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const xs = c.points.map(p => p.x), ys = c.points.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), yMax = Math.max(...ys) * 1.1;
  const X = x => m.l + (x - x0) / ((x1 - x0) || 1) * iw, Y = y => m.t + ih - y / yMax * ih;
  const col = TOPIC[c.topicId].color;
  const grid = [0.25, 0.5, 0.75, 1].map(k => `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih - k * ih}" y2="${m.t + ih - k * ih}" stroke-dasharray="3 4"/>`).join('');
  const d = c.points.map((p, i) => `${i ? 'L' : 'M'}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  const dots = c.points.map(p => `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4" fill="var(--surface)" stroke="${col}" stroke-width="2.5"/>`).join('');
  // axis numbers are deliberately not drawn: the values are illustrative, not measurements
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title)} (${SCHEMATIC})" style="font-size:12.5px">${grid}
    <line class="axis" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${m.t + ih}" stroke-width="1.4"/><line class="axis" x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}" stroke-width="1.4"/>
    <path d="M${m.l + iw - 8},${m.t + ih - 5} l8,5 l-8,5" fill="none" class="axis" stroke-width="1.4"/><path d="M${m.l - 5},${m.t + 8} l5,-8 l5,8" fill="none" class="axis" stroke-width="1.4"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots}
    <text class="axis-title" x="${m.l + iw / 2}" y="${H - 10}" text-anchor="middle">${esc(c.xAxisLabel)}</text>
    <text class="axis-title" transform="translate(14,${m.t + ih / 2}) rotate(-90)" text-anchor="middle">${esc(c.yAxisLabel)}</text></svg>`;
}

// ---------- CALCULATORS & DRILLS ----------
// A fixed function per formula id (an allowlist); the expression strings in study_tools.json are never evaluated.
const FORMULA = {
  CO: v => v.HR * v.SVml / 1000,
  SV: v => v.EDVml - v.ESVml,
  KARVONEN: v => (v.HRmax - v.HRrest) * v.intensity + v.HRrest,
  VE: v => v.TVL * v.f,
  VA: v => (v.TVml - v.VDml) * v.f / 1000,
};
const SUBST = {
  CO: v => `CO = ${v.HR} × ${v.SVml} מ״ל = ${fmtNum(v.HR * v.SVml)} מ״ל לדקה`,
  SV: v => `SV = ${v.EDVml} − ${v.ESVml}`,
  KARVONEN: v => `Target HR = (${v.HRmax} − ${v.HRrest}) × ${v.intensity} + ${v.HRrest}`,
  VE: v => `VE = ${v.TVL} × ${v.f}`,
  VA: v => `VA = (${v.TVml} − ${v.VDml}) × ${v.f} = ${fmtNum((v.TVml - v.VDml) * v.f)} מ״ל לדקה`,
};
const CROSS = {
  SV: v => v.EDVml >= v.ESVml ? null : 'נפח סוף דיאסטולי (EDV) חייב להיות גדול מנפח סוף סיסטולי (ESV) או שווה לו.',
  KARVONEN: v => v.HRmax > v.HRrest ? null : 'הדופק המרבי חייב להיות גבוה מדופק המנוחה.',
  VA: v => v.TVml >= v.VDml ? null : 'הנפח המת (VD) לא יכול להיות גדול מנפח הנשימה (TV).',
};
function calcResult(t, vals) {
  const errs = [];
  for (const i of t.inputs) {
    const v = vals[i.key];
    if (v === '' || v === undefined || isNaN(v)) errs.push(`חסר ערך: ${i.label}.`);
    else if (v < i.min || v > i.max) errs.push(`${i.label} צריך להיות בין ${i.min} ל-${i.max} ${i.unit}.`);
  }
  if (!errs.length && CROSS[t.id]) { const e = CROSS[t.id](vals); if (e) errs.push(e); }
  if (errs.length) return { errs };
  const out = FORMULA[t.id](vals);
  return { out, shown: t.unit === 'bpm' ? Math.round(out) : +out.toFixed(3) };
}

function newMatch(id) {

function matchBoard(ms) {
  const g = D.matching.find(x => x.id === ms.id); const P = Object.fromEntries(g.pairs.map(p => [p.id, p]));

      ${ms.checked && t !== d ? `<span class="fix">ההתאמה הנכונה: ${tx(P[d].left)}</span>` : ''}</li>`;
  }).join('')}</ol>
  ${ms.checked ? `<div class="panel ${correct === g.pairs.length ? 'tint pop' : ''}"><div class="score-hero"><span class="big">${correct}/${g.pairs.length}</span><span>התאמות נכונות · נקודה לכל זוג</span></div></div>` : ''}
  ${ms.revealed ? '<div class="panel">הפתרון מוצג. הניסיון הזה לא נספר בניקוד.</div>' : ''}
  <div class="row">${!ms.checked && !ms.revealed ? `<button class="btn primary" data-act="checkMatch" ${full ? '' : 'disabled'}>בדיקה</button><button class="btn" data-act="clearMatch">ניקוי</button><button class="btn ghost" data-act="revealMatch">הצגת הפתרון</button>` : `<button class="btn primary" data-act="openMatch" data-args='{"id":"${g.id}"}'>ניסיון חדש</button>${nextGameBtn('matching', g.id)}`}</div>`;
}
function nextGameBtn(kind, id) {
  const list = kind === 'matching' ? D.matching : D.sequences; const i = list.findIndex(g => g.id === id);
  return i < list.length - 1 ? `<button class="btn" data-act="${kind === 'matching' ? 'openMatch' : 'openSeq'}" data-args='{"id":"${list[i + 1].id}"}'>לתרגיל הבא ←</button>` : '';
}
function newSeq(id) {
  const s = D.sequences.find(x => x.id === id); let order = shuffle(s.steps.map(x => x.id)); let guard = 0;
  while (order.join() === s.correctOrder.join() && guard++ < 10) order = shuffle(order);
  view.seq = { id, order, checked: false };
}
// Scoring: exact order = 5 points; otherwise one point per adjacent pair that appears in the correct relative order.
function seqScore(s, order) {
  const pos = Object.fromEntries(s.correctOrder.map((id, i) => [id, i])); const exact = order.join() === s.correctOrder.join(); let adj = 0;
  for (let i = 0; i < order.length - 1; i++) if (pos[order[i + 1]] === pos[order[i]] + 1) adj++;
  return { exact, adj, max: order.length - 1, score: exact ? 5 : adj };
}
function seqBoard(ss) {
  const s = D.sequences.find(x => x.id === ss.id); const T = Object.fromEntries(s.steps.map(x => [x.id, x.text]));
  const sc = ss.checked ? seqScore(s, ss.order) : null;
  return `${backBtn('closeGame', 'כל המשחקים')}

    return `<li class="${cls}" data-step="${id}" ${ss.checked ? '' : 'draggable="true"'}><span class="pos">${i + 1}</span><span class="txt">${tx(T[id])}</span>

      ${ss.checked && s.correctOrder[i] !== id ? `<span class="want">במקום ${i + 1} צריך להיות: ${tx(T[s.correctOrder[i]])}</span>` : ''}</li>`;

    <p class="small muted" style="margin:0">ניקוד: רצף מדויק = 5 נקודות. אחרת, נקודה לכל שני שלבים סמוכים שמופיעים זה אחר זה כמו ברצף הנכון.</p>${s.note ? `<p style="margin:0">${tx(s.note)}</p>` : ''}</div>` : ''}
  <div class="row">${ss.checked ? `<button class="btn primary" data-act="openSeq" data-args='{"id":"${s.id}"}'>ניסיון חדש</button>${nextGameBtn('sequence', s.id)}` : '<button class="btn primary" data-act="checkSeq">בדיקה</button>'}</div>`;
}
function wireDnD() {
  document.querySelectorAll('.term[draggable="true"]').forEach(el => el.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', el.dataset.term); }));
  document.querySelectorAll('.def').forEach(el => {
    el.addEventListener('dragover', e => { if (view.match && !view.match.checked) { e.preventDefault(); el.classList.add('drop'); } });
    el.addEventListener('dragleave', () => el.classList.remove('drop'));
    el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('drop'); const t = e.dataTransfer.getData('text/plain'); if (t) assignTerm(t, el.dataset.def); });
  });
  const list = $('#seqList');
  if (list && view.seq && !view.seq.checked) {
    let dragId = null;
    list.querySelectorAll('li[draggable="true"]').forEach(li => {
      li.addEventListener('dragstart', e => { dragId = li.dataset.step; li.classList.add('dragging'); e.dataTransfer.setData('text/plain', dragId); });
      li.addEventListener('dragend', () => li.classList.remove('dragging'));
      li.addEventListener('dragover', e => { e.preventDefault(); li.classList.add('over'); });
      li.addEventListener('dragleave', () => li.classList.remove('over'));
      li.addEventListener('drop', e => { e.preventDefault(); li.classList.remove('over'); const o = view.seq.order, from = o.indexOf(dragId), to = o.indexOf(li.dataset.step); if (from < 0 || to < 0 || from === to) return; o.splice(to, 0, o.splice(from, 1)[0]); render(); });
    });
  }
}
function assignTerm(t, d) { const ms = view.match; for (const k of Object.keys(ms.assign)) if (ms.assign[k] === t) delete ms.assign[k]; ms.assign[d] = t; ms.picked = null; render(); }

// ---------- GLOSSARY ----------
function termLinks(g) {
  const keys = [g.term.replace(/\s*\(.*\)\s*$/, '').trim(), g.he].filter(k => k && k.length > 1);
  const has = s => keys.some(k => s.includes(k));
  const qs = D.mcq.filter(q => q.topicId === g.topicId && (has(q.question) || has(q.options[q.correctIndex])));
  const cs = D.flashcards.filter(c => c.topicId === g.topicId && (has(c.front) || has(c.back)));
  return { qs: qs.map(q => q.id), cs: cs.map(c => c.id) };
}
function glossListHTML() {
  const q = (view.glossQ || '').trim().toLowerCase(); const t = view.glossTopic || 'all';
  const list = D.glossary.filter(g => (t === 'all' || g.topicId === t) && (!q || (g.term + ' ' + (g.he || '') + ' ' + g.definition).toLowerCase().includes(q)));
  return `<p class="small" style="margin:0" role="status" id="glossCount">נמצאו ${list.length} מתוך ${D.glossary.length} מושגים</p>
  ${list.length ? `<dl class="gloss">${list.map(g => { const L = termLinks(g); return `<div class="gl"><dt><b>${tx(g.term)}</b>${g.he ? `<span>${esc(g.he)}</span>` : ''}${topicChip(g.topicId)}</dt><dd>${tx(g.definition)} ${srcRef(g.sourcePages)}

}

    let s = null; try { s = normalize(JSON.parse($('#importBox').value)); } catch { s = null; }
    const msg = $('#importMsg');
    if (!s) { msg.innerHTML = '<p class="small" style="color:var(--bad);margin:0">זה לא נראה כמו גיבוי של אתר פיזיולוגיה חלק ב׳ (חסר schemaVersion 1, או שזה גיבוי של אתר אחר).</p>'; return; }
    view.pendingImport = s;
    msg.innerHTML = `<div class="panel warmtint"><p style="margin:0">בגיבוי: ${s.mcqAttempts.length} תשובות, ${Object.keys(s.flashcards).length} כרטיסיות מדורגות, ${s.examResults.length} מבחנים${s.updatedAt ? ` · עדכון אחרון ${fmtDateTime(s.updatedAt)}` : ''}.</p><p class="small" style="margin:0">הייבוא יחליף את ההתקדמות הנוכחית.</p><div class="row"><button class="btn primary" data-act="importApply">החלפה בגיבוי</button><button class="btn" data-act="importCancel">ביטול</button></div></div>`;
  },
  importApply: () => { S = view.pendingImport; view.pendingImport = null; for (const k of Object.keys(view)) delete view[k]; commit(); render(); toast('הגיבוי שוחזר'); },
  importCancel: () => { view.pendingImport = null; $('#backupArea').innerHTML = ''; },
  resetAsk: () => openSheet(`<h2 id="sheetTitle">לאפס את כל ההתקדמות?</h2><p>כל התשובות, הדירוגים, המבחנים וההערכות יימחקו${store.remote === 'on' ? ', גם מהשמירה בחשבון' : ''}. מומלץ לייצא גיבוי לפני כן.</p><div class="row"><button class="btn danger" data-act="resetYes">איפוס</button><button class="btn" data-act="closeSheet">ביטול</button></div>`, '.btn:not(.danger)'),
  resetYes: () => { S = blankState(); for (const k of Object.keys(view)) delete view[k]; commit(); closeSheet(); go('home'); toast('ההתקדמות אופסה'); },
};

// Delegated events: clicks carry data-act + JSON data-args; form controls update the current screen's form state.
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault();
  let args = {}; try { args = el.dataset.args ? JSON.parse(el.dataset.args) : {}; } catch { }
  fn(args, el, e);
  if (route === 'charts' && view.chartId) drawCharts();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.actChange === 'listened') { S.listened[el.dataset.ep] = el.checked; commit(); return; }
  if (el.id === 'glossTopic') { view.glossTopic = el.value; $('#glossList').innerHTML = glossListHTML(); return; }
  if (el.dataset.rubric !== undefined) return;
  const form = el.closest('[data-form]'); if (!form) return;
  const fd = new FormData(form); const kind = form.dataset.form;
  if (kind === 'cards') view.cardForm = { topic: fd.get('cardTopic'), mode: fd.get('cardMode'), size: fd.get('cardSize'), mix: fd.get('cardMix') === 'on', type: fd.get('cardType') };
  if (kind === 'practice') view.practiceForm = { topic: fd.get('prTopic'), diff: fd.get('prDiff'), kind: fd.get('prKind'), size: fd.get('prSize'), pool: fd.get('prPool') };
  if (kind === 'review') view.revForm = { topic: fd.get('revTopic'), timer: fd.get('revTimer') };
  const id = el.id || el.name, val = el.value;
  render();
  const again = document.getElementById(id) || document.querySelector(`[name="${el.name}"][value="${CSS.escape(val)}"]`);
  if (again) again.focus({ preventScroll: true });
});
// Typing: glossary search and calculator inputs update in place, so the field keeps focus.
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'glossQ') { view.glossQ = el.value; $('#glossList').innerHTML = glossListHTML(); return; }
  const cf = el.closest('[data-calc]');
  if (cf) {
    const t = D.tools.find(x => x.id === cf.dataset.calc);
    view.calcVals[t.id][el.dataset.key] = el.value === '' ? '' : +el.value;
    const card = cf.closest('.calc'); const tmp = document.createElement('div'); tmp.innerHTML = calcCard(t);
    card.querySelector('.calc-out').replaceWith(tmp.querySelector('.calc-out'));
  }
  if (el.id === 'caseDraft') { clearTimeout(ACT._caseT); ACT._caseT = setTimeout(() => { S.caseDrafts[el.dataset.case] = el.value; commit(); }, 800); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.closest('[data-listen-form]')) { e.preventDefault(); ACT.listenSave({ id: e.target.closest('[data-listen-form]').dataset.listenForm }); }
  if (e.key === 'Enter' && e.target.closest('[data-drill]')) { e.preventDefault(); ACT.drillCheck({ id: e.target.closest('[data-drill]').dataset.drill }); }
  if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  if (route === 'cards' && view.cards && !view.cards.done && !e.target.closest('input,select,textarea,button,a')) {
    if (e.key === ' ' && !view.cards.flipped) { e.preventDefault(); ACT.flipCard(); }
    else if (view.cards.flipped && ['1', '2', '3'].includes(e.key)) ACT.rateCard({ r: ['unknown', 'almost', 'known'][+e.key - 1] });
  }
});
document.addEventListener('toggle', e => { if (e.target.dataset?.actToggle === 'examMap') view.examMapOpen = e.target.open; }, true);
window.addEventListener('hashchange', () => { const r = location.hash.slice(1); if (r && r !== route && ROUTES[r]) go(r); });

// ---------- boot ----------
(function boot() {
  const h = location.hash.slice(1);
  route = ROUTES[h] ? h : 'home';
  renderStatus(); render(); initRemote();
})();

</script>
</body></html>
