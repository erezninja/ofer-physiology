SE-01","topicId":"B01","title":"מתאמנת לפני ריצה","scenarioQuestion":"נמדדים דופק 70 פעימות לדקה ונפח פעימה 70 מ״ל. אחרי תחילת הפעילות הדופק והנפח עולים. מה משתנה בתפוקת הלב ומהי במנוחה?","modelAnswer":"במנוחה: 70 × 70 = 4,900 מ״ל לדקה, כלומר 4.9 ליטרים לדקה. במאמץ תפוקת הלב צפויה לעלות.","commonMistake":"תפוקת לב נקבעת רק על ידי לחץ הדם, בלי קשר לדופק ולנפח הפעימה.","sourcePages":[60],"assessmentMode":"self_check","rubric":["ציון העיקרון הפיזיולוגי","שימוש במונחים או בנוסחה הנכונה","הסבר הקשר בין הגורם לתוצאה"]},{"id":"PB-CASE-02","topicId":"B01","title":"דם שחוזר מהריאות","scenarioQuestion":"טיפת דם מועשרת בחמצן בנימי הריאות. באיזה כלי דם ובאיזו עלייה תעבור לפני שתגיע לחדר השמאלי?","modelAnswer":"הדם עובר דרך ורידי הריאה אל העלייה השמאלית, ומשם דרך המסתם המיטרלי לחדר השמאלי.","commonMistake":"וריד תמיד דל חמצן ולכן ורידי הריאה מובילים דם לא מחומצן.","sourcePages":[53],"assessmentMode":"self_check","rubric":["ציון העיקרון הפיזיולוגי","שימוש במונחים או בנוסחה הנכונה","הסבר הקשר בין הגורם לתוצאה"]},{"id":"PB-CASE-03","topicId":"B01","title":"חישוב אזור אימון","scenarioQuestion":"עפר מודדת דופק מנוחה 70 והדופק המרבי המשוער הוא 190. מה דופק המטרה ב-66% מרזרבת הדופק?","modelAnswer":"(190 − 70) × 0.66 + 70 = 149.2, כלומר כ-149 פעימות בדקה.","commonMistake":"לחשב 190 × 0.66 מבלי להביא בחשבון את דופק המנוחה.","sourcePages":[71],"assessmentMode":"self_check","rubric":["ציון העיקרון הפיזיולוגי","שימוש במונחים או בנוסחה הנכונה","הסבר הקשר בין הגורם לתוצאה"]},{"id":"PB-CASE-04","topicId":"B02","title":"פקודה עצבית לשריר","scenarioQuestion":"במעבדה נחסמת הגעת אצטילכולין למפגש עצב-שריר. באיזה שלב תיפגע התחלת הכיווץ?","modelAnswer":"האות העצבי לא יפעיל כראוי את קולטני סיב השריר ולכן תיפגע שרשרת האות החשמלי, שחרור הסידן והפעלת גשרי הרוחב.","commonMistake":"חסימה במפגש עצב-שריר אמורה להגביר מיד את שחרור האינסולין.","sourcePages":[77],"assessmentMode":"self_check","rubric":["ציון העיקרון הפיזיולוגי","שימוש במונחים או בנוסחה הנכונה","הסבר הקשר בין הגורם לתוצאה"]},{"id":"PB-CASE-05","topicId":"B02","title":"כאבים יום לאחר אימון חדש","scenarioQuestion":"מתאמנת מדווחת על כאב שרירים כ-36 שעות אחרי אימון אקסצנטרי חדש. האם נכון לייחס זאת ללקטט שנותר בשריר?","modelAnswer":"לא. מדובר בתיאור אופייני ל-DOMS, והסיבה אינה הצטברות לקטט הנשארת בשריר ימים.","commonMistake":"לקטט נשאר ברקמה ימים רבים ולכן הוא בהכרח הגורם הישיר לכאב.","sourcePages":[85],"assessmentMode":"self_check","rubric":["ציון העיקרון הפיזיולוגי","שימוש במונחים או בנוסחה הנכונה","הסבר הקשר בין הגורם לתוצאה"]},{"id":"PB-CASE-06","topicId":"B02","title":"מעמיסים משקל רב יותר","scenarioQuestion":"מתאמנת מתחילה להרים משקולת קלה ואז עוברת למשקל כבד יותר. מה משתנה בגיוס יחידות מוטוריות?","modelAnswer":"דרישת הכוח גדלה ומגויסות יחידות מוטוריות נוספות, לרוב קטנות ואיטיות לפני גדולות ומהירות.","commonMistake":"כדי להרים יותר משקל צריך להפסיק לגייס יחידות שריר.","sourcePages":[83],"assessmentMode":"self_check","rubric":["ציון העיקרון הפיזיולוגי","שימוש במונחים או בנוסחה הנכונה","הסבר הקשר בין הגורם לתוצאה"]},{"id":"PB-CASE-07","topicId":"B03","title":"אותה כמות אוויר, דפוסים שונים","scenarioQuestion":"שתי מתאמנות מאווררות 6 ליטרים בדקה: הראשונה 12 נשימות של 500 מ״ל; השנייה 20 נשימות של 300 מ״ל. הנפח המת 150 מ״ל בכל נשימה. למי אוורור נאדיתי גבוה יותר?","modelAnswer":"לראשונה: (500−150)×12 = 4.2 ליטר לדקה; לשנייה: (300−150)×20 = 3.0 ליטר לדקה. הראשונה מאווררת יותר אוויר בנאדיות.","commonMistake":"כיוון שהאוורור הכולל זהה, בהכרח גם האוורור הנאדיתי זהה.","sourcePages":[97],"assessmentMode":"self_check","rubric":["ציון העיקרון הפיזיולוגי","שימוש במונחים או בנוסחה הנכונה","הסבר הקשר בין הגורם לתוצאה"]},{"id":"PB-CASE-08","topicId":"B03","title":"נשימה עמוקה","scenarioQuestion":"בשאיפה עמוקה הסרעפת מתכווצת ובית החזה מתרחב. מה קורה ללחץ הריאתי ולזרימת האוויר?","modelAnswer":"עליית הנפח מורידה זמנית את לחץ האוויר בריאות יחסית לאטמוספרה ולכן אוויר נכנס.","commonMistake":"לחץ האוויר עולה כשנפח הריאות גדל ולכן האוויר נכנס.","sourcePages":[96],"assessmentMode":"self_check","rubric":["ציון העיקרון הפיזיולוגי","שימוש במונחים או בנוסחה הנכונה","הסבר הקשר בין הגורם לתוצאה"]},{"id":"PB-CASE-09","topicId":"B03","title":"חילוף גזים","scenarioQuestion":"חמצן מגיע לנאדיות. מה מניע את מעברו לדם והיכן CO₂ נע בכיוון ההפוך?","modelAnswer":"חילוף הגזים הוא בדיפוזיה על פי מפל לחצים חלקיים: O₂ מן הנאדיות אל הדם, CO₂ מן הדם אל הנאדיות.","commonMistake":"הנאדיות מייצרות בעצמן את החמצן מתוך גלוקגון.","sourcePages":[93],"assessmentMode":"self_check","rubric":["ציון העיקרון הפיזיולוגי","שימוש במונחים או בנוסחה הנכונה","הסבר הקשר בין הגורם לתוצאה"]},{"id":"PB-CASE-10","topicId":"B04","title":"אחרי ארוחה עתירת פחמימות","scenarioQuestion":"רמת הגלוקוז בדם עולה לאחר ארוחה. איזה תאי לבלב והורמון מסייעים להחזיר אותה לאיזון?","modelAnswer":"תאי בטא מפרישים אינסולין, שמסייע לקליטה ולאגירה של גלוקוז וכך רמתו פוחתת.","commonMistake":"תאי אלפא מפרישים ADH כדי להפחית גלוקוז.","sourcePages":[111],"assessmentMode":"self_check","rubric":["ציון העיקרון הפיזיולוגי","שימוש במונחים או בנוסחה הנכונה","הסבר הקשר בין הגורם לתוצאה"]},{"id":"PB-CASE-11","topicId":"B04","title":"איבוד נוזלים בהליכה ארוכה","scenarioQuestion":"מתאמנת איבדה מים בהזעה במהלך מאמץ. מהי המגמה הצפויה של ADH ומה יקרה בכליות?","modelAnswer":"ADH נוטה לעלות, ומשפר ספיגה חוזרת של מים כדי לצמצם איבוד מים בשתן.","commonMistake":"ADH תמיד גורם ליותר איבוד מים בשתן.","sourcePages":[115],"assessmentMode":"self_check","rubric":["ציון העיקרון הפיזיולוגי","שימוש במונחים או בנוסחה הנכונה","הסבר הקשר בין הגורם לתוצאה"]},{"id":"PB-CASE-12","topicId":"B04","title":"תגובה למצב חירום","scenarioQuestion":"ספורטאית נבהלת ומתחילה להגיב במהירות. מאיזה חלק בבלוטת יותרת הכליה באים הקטכולאמינים, ואילו הורמונים הם?","modelAnswer":"ליבת יותרת הכליה מפרישה אדרנלין ונוראדרנלין בתגובה מהירה של הילחם או ברח.","commonMistake":"קליפת יותרת הכליה היא המקור היחיד לגלוקגון.","sourcePages":[110],"assessmentMode":"self_check","rubric":["ציון העיקרון הפיזיולוגי","שימוש במונחים או בנוסחה הנכונה","הסבר הקשר בין הגורם לתוצאה"]},{"id":"PB-CASE-13","topicId":"B04","title":"בין ארוחות","scenarioQuestion":"לאחר שעות ללא ארוחה רמת הגלוקוז יורדת. איזה הורמון עשוי לעזור להגדיל את זמינות הגלוקוז?","modelAnswer":"גלוקגון שמופרש מתאי אלפא בלבלב. הוא מסייע לשחרור גלוקוז לדם.","commonMistake":"אוקסיטוצין הוא ההורמון העיקרי שמעלה רמת סוכר בזמן צום.","sourcePages":[112],"assessmentMode":"self_check","rubric":["ציון העיקרון הפיזיולוגי","שימוש במונחים או בנוסחה הנכונה","הסבר הקשר בין הגורם לתוצאה"]},{"id":"PB-CASE-14","topicId":"B05","title":"חתך קטן בעור","scenarioQuestion":"פגיעה בעור מאפשרת חדירת גורם זר. אילו קווי הגנה נכנסים לפעולה, ומה דוגמה לתגובה מקומית?","modelAnswer":"קו ראשון נפגע; בקו שני מופעלת תגובה דלקתית ומגויסים תאים בולעניים. בהמשך יכולה להיות תגובה נרכשת ממוקדת.","commonMistake":"העור הפצוע חוסם לחלוטין כל תגובה חיסונית נוספת.","sourcePages":[121],"assessmentMode":"self_check","rubric":["ציון העיקרון הפיזיולוגי","שימוש במונחים או בנוסחה הנכונה","הסבר הקשר בין הגורם לתוצאה"]},{"id":"PB-CASE-15","topicId":"B05","title":"נוגדן פוגש אנטיגן","scenarioQuestion":"נוגדן נקשר לגורם זר מסוים. מה עשויה להיות התוצאה?","modelAnswer":"קישור הנוגדן יכול לנטרל את הגורם או לסמן אותו לסילוק ולהפעיל מנגנוני הגנה נוספים.","commonMistake":"נוגדן נקשר ישירות לכל חומר בעולם באותה יעילות.","sourcePages":[123],"assessmentMode":"self_check","rubric":["ציון העיקרון הפיזיולוגי","שימוש במונחים או בנוסחה הנכונה","הסבר הקשר בין הגורם לתוצאה"]},{"id":"PB-CASE-16","topicId":"B05","title":"מפגש חוזר עם גורם זר","scenarioQuestion":"למה חשיפה חוזרת לאותו אנטיגן יכולה להוביל לתגובה מהירה וממוקדת יותר?","modelAnswer":"במערכת החיסון הנרכשת נוצרים תאי זיכרון, המסייעים להגיב שוב לאנטיגן מתאים.","commonMistake":"במפגש חוזר הגוף מאבד בהכרח את כל תאי החיסון.","sourcePages":[122],"assessmentMode":"self_check","rubric":["ציון העיקרון הפיזיולוגי","שימוש במונחים או בנוסחה הנכונה","הסבר הקשר בין הגורם לתוצאה"]}],"glossary":[{"id":"PB-TERM-001","topicId":"B01","term":"חדר ימין","definition":"מזרים דם לריאות","sourcePages":[53,54]},{"id":"PB-TERM-002","topicId":"B01","term":"חדר שמאל","defin ","title":"8. חוק פרנק-סטרלינג: למה מילוי הלב חשוב?","pages":"","module":true,"slides":[14,15,16],"pagesList":[60,61,62]},{"id":"s-B01-19","title":"9. מאומן ולא מאומן: לא רק דופק נמוך","pages":"","module":true,"slides":[19,20,21,22,23,24],"pagesList":[64,65,66,67,68,69]},{"id":"s-B01-20","title":"10. זרימת דם מחדש בזמן מאמץ","pages":"","module":true,"slides":[23,24],"pagesList":[68]},{"id":"s-B01-21","title":"11. נוסחת פיק והקשר בין הלב לשרירים","pages":"","module":true,"slides":[23,24,25],"pagesList":[65,66,67,68,69,70]},{"id":"s-B01-22","title":"12. דופק מרבי, דופק מטרה ונוסחת קרבונן","pages":"","module":true,"slides":[25,26,27],"pagesList":[70,71]},{"id":"s-B01-23","title":"חזרה פעילה לפרק","pages":"","module":false,"slides":[],"pagesList":[]}],"html":"\u003cp>מערכת ההובלה של הגוף: הלב מזרים דם, כלי הדם מוליכים אותו, והדם נושא חמצן וחומרים חיוניים אל התאים.\u003c/p>\n\u003csection class=\"lsec \" id=\"s-B01-1\">\u003ch2 class=\"part\">התפקידים העיקריים \u003cspan class=\"pchip\">עמ׳ \u003cbdi>52–53\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>הובלת חמצן\u003c/strong> מהריאות לרקמות והחזרת פחמן דו-חמצני לריאות.\u003c/li>\u003cli>\u003cstrong>הובלת חומרי מזון והורמונים\u003c/strong> לתאי הגוף.\u003c/li>\u003cli>\u003cstrong>פינוי תוצרי פסולת\u003c/strong> מן הרקמות.\u003c/li>\u003cli>\u003cstrong>ויסות\u003c/strong> טמפרטורת הגוף וסיוע בהגנה החיסונית.\u003c/li>\u003c/ul>\n\u003cdiv class=\"sec-practice\" data-pages=\"52,53\" data-slides=\"\" data-deck=\"99516\" data-title=\"התפקידים העיקריים\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B01-2\">\u003ch2 class=\"part\">שני מחזורי הדם \u003cspan class=\"pchip\">עמ׳ \u003cbdi>53–54\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>מחזור\u003c/th>\u003cth>מסלול בסיסי\u003c/th>\u003cth>מטרה\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">\u003cstrong>מחזור קטן / ריאתי\u003c/strong>\u003c/th>\u003ctd>חדר ימין ← עורק הריאה ← ריאות ← ורידי הריאה ← עלייה שמאל\u003c/td>\u003ctd>חמצון הדם בריאות\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cstrong>מחזור גדול / מערכתי\u003c/strong>\u003c/th>\u003ctd>חדר שמאל ← אבי העורקים ← רקמות הגוף ← ורידים נבובים ← עלייה ימין\u003c/td>\u003ctd>אספקת חמצן וחומרי מזון לרקמות\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">סדר זרימת הדם שכדאי לדעת בעל פה\u003c/span>\u003cdiv>\u003cfigure class=\"gfig flow\" aria-label=\"רצף\">\u003col>\u003cli>ורידים נבובים\u003c/li>\u003cli>עלייה ימין\u003c/li>\u003cli>חדר ימין\u003c/li>\u003cli>עורק הריאה\u003c/li>\u003cli>ריאות\u003c/li>\u003cli>ורידי הריאה\u003c/li>\u003cli>עלייה שמאל\u003c/li>\u003cli>חדר שמאל\u003c/li>\u003cli>אבי העורקים\u003c/li>\u003cli>רקמות הגוף\u003c/li>\u003c/ol>\u003c/figure>\u003c/div>\u003c/aside>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">נקודת בלבול נפוצה\u003c/span>\u003cdiv>\u003cp>עורק מוגדר לפי כיוון הזרימה \u003cstrong>מן הלב והלאה\u003c/strong>, ווריד לפי הזרימה \u003cstrong>אל הלב\u003c/strong>. לכן עורק הריאה מוביל דם דל בחמצן, ואילו ורידי הריאה מובילים דם עשיר בחמצן.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"53,54\" data-slides=\"\" data-deck=\"99516\" data-title=\"שני מחזורי הדם\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B01-3\">\u003ch2 class=\"part\">מבנה הלב ומחזור פעימה \u003cspan class=\"pchip\">עמ׳ \u003cbdi>54–55\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>חלק\u003c/th>\u003cth>תפקיד\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">עלייה ימין\u003c/th>\u003ctd>קולטת דם מהמחזור הגדול.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">חדר ימין\u003c/th>\u003ctd>מזרים את הדם אל הריאות.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">עלייה שמאל\u003c/th>\u003ctd>קולטת דם מחומצן מהריאות.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">חדר שמאל\u003c/th>\u003ctd>מזרים את הדם למחזור הגדול.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">מסתמים\u003c/th>\u003ctd>מכוונים זרימת דם בכיוון אחד ומונעים זרימה לאחור.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>סיסטולה, דיאסטולה ותיאום עצבי\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>סיסטולה\u003c/strong>: שלב ההתכווצות והזרקת הדם.\u003c/li>\u003cli>\u003cstrong>דיאסטולה\u003c/strong>: שלב ההרפיה ומילוי חללי הלב.\u003c/li>\u003cli>קוצב הלב ומערכת ההולכה החשמלית מייצרים ומתאמים את סדר ההתכווצות.\u003c/li>\u003cli>המערכת הסימפתטית מגבירה את פעילות הלב במאמץ; הפאראסימפתטית מעורבת בהאטת הדופק.\u003c/li>\u003c/ul>\n\u003cdiv class=\"sec-practice\" data-pages=\"54,55\" data-slides=\"\" data-deck=\"99516\" data-title=\"מבנה הלב ומחזור פעימה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B01-4\">\u003ch2 class=\"part\">כלי הדם: מבנה ולחץ \u003cspan class=\"pchip\">עמ׳ \u003cbdi>56–59\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>כלי דם\u003c/th>\u003cth>מאפיין מבני\u003c/th>\u003cth>תפקיד עיקרי\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">עורקים\u003c/th>\u003ctd>דופן שרירית ואלסטית עבה יחסית\u003c/td>\u003ctd>הובלת דם מן הלב בלחץ גבוה.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">עורקיקים\u003c/th>\u003ctd>שריר חלק המאפשר שינוי בקוטר\u003c/td>\u003ctd>בקרה על התנגדות וזרימה מקומית.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">נימים\u003c/th>\u003ctd>דופן דקה מאוד\u003c/td>\u003ctd>חילוף חמצן, מזון ותוצרי פסולת עם הרקמות.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">ורידים\u003c/th>\u003ctd>לחץ נמוך יחסית; שסתומים בחלק מהם\u003c/td>\u003ctd>החזרת דם אל הלב; מאגר דם משמעותי.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"gnote kind\">\u003cspan class=\"tag\">לחץ דם\u003c/span>\u003cdiv>\u003cp>לחץ הדם כנגד דופן כלי הדם, נמדד במ״מ כספית. בלחץ דם 120/80 הערך הראשון הוא סיסטולי והשני דיאסטולי (עמ׳ 57).\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"56,57,58,59\" data-slides=\"\" data-deck=\"99516\" data-title=\"כלי הדם: מבנה ולחץ\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B01-5\">\u003ch2 class=\"part\">ממה מורכב הדם? \u003cspan class=\"pchip\">עמ׳ \u003cbdi>58–59\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>מרכיב\u003c/th>\u003cth>חלק יחסי בחוברת\u003c/th>\u003cth>תפקיד\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">פלזמה\u003c/th>\u003ctd>כ-55%\u003c/td>\u003ctd>נוזל שבו מומסים חומרים ומועברים מרכיבים.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">תאי דם ותוצרים תאיים\u003c/th>\u003ctd>כ-45%\u003c/td>\u003ctd>תאי דם אדומים, לבנים וטסיות.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">תאי דם אדומים\u003c/th>\u003ctd>מרבית התאים\u003c/td>\u003ctd>הובלת חמצן בעזרת המוגלובין.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">תאי דם לבנים\u003c/th>\u003ctd>חלק קטן\u003c/td>\u003ctd>הגנה מפני גורמים זרים.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">טסיות\u003c/th>\u003ctd>חלק קטן\u003c/td>\u003ctd>תהליך הקרישה ומניעת דימום.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-pages=\"58,59\" data-slides=\"\" data-deck=\"99516\" data-title=\"ממה מורכב הדם?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B01-6\">\u003ch2 class=\"part\">שלוש נוסחאות יסוד \u003cspan class=\"pchip\">עמ׳ \u003cbdi>60–65\u003c/bdi>\u003c/span>\u003c/h2>\n\u003caside class=\"gnote fbox\">\u003cspan class=\"tag\">תפוקת הלב\u003c/span>\u003cdiv>\u003cdiv class=\"eqn\" dir=\"ltr\">CO = HR × SV\u003c/div>\u003cp class=\"legend\">\u003cbdi>CO\u003c/bdi>: תפוקת לב; \u003cbdi>HR\u003c/bdi>: קצב לב לדקה; \u003cbdi>SV\u003c/bdi>: נפח פעימה.\u003c/p>\u003c/div>\u003c/aside>\n\u003caside class=\"gnote fbox\">\u003cspan class=\"tag\">נפח פעימה\u003c/span>\u003cdiv>\u003cdiv class=\"eqn\" dir=\"ltr\">SV = EDV − ESV\u003c/div>\u003cp class=\"legend\">\u003cbdi>EDV\u003c/bdi>: נפח סוף דיאסטולי; \u003cbdi>ESV\u003c/bdi>: נפח סוף סיסטולי.\u003c/p>\u003c/div>\u003c/aside>\n\u003caside class=\"gnote fbox\">\u003cspan class=\"tag\">צריכת החמצן (עיקרון פיק)\u003c/span>\u003cdiv>\u003cdiv class=\"eqn\" dir=\"ltr\">VO₂ = CO × (a−v O₂ difference)\u003c/div>\u003cp class=\"legend\">הצריכה תלויה בזרימת הדם ובהפרש תכולת החמצן בין הדם העורקי לוורידי.\u003c/p>\u003c/div>\u003c/aside>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">דוגמה לחישוב תפוקת לב\u003c/span>\u003cdiv>\u003cp>דופק 70 פעימות בדקה × נפח פעימה 70 מ״ל = 4,900 מ״ל לדקה, כלומר כ-4.9 ליטר לדקה. זו דוגמת המנוחה בחוברת (עמ׳ 60).\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"60,61,62,63,64,65\" data-slides=\"\" data-deck=\"99516\" data-title=\"שלוש נוסחאות יסוד\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B01-7\">\u003ch2 class=\"part\">מה קורה בזמן מאמץ? \u003cspan class=\"pchip\">עמ׳ \u003cbdi>61–69\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>קצב הלב עולה\u003c/strong> עם עליית עצימות המאמץ, עד קצב מרבי בקירוב.\u003c/li>\u003cli>\u003cstrong>נפח הפעימה עולה\u003c/strong> לעומת מנוחה; דפוס העלייה עשוי להשתנות לפי רמת האימון.\u003c/li>\u003cli>\u003cstrong>תפוקת הלב עולה\u003c/strong> כדי להגדיל את אספקת הדם.\u003c/li>\u003cli>\u003cstrong>זרימת הדם מתחלקת מחדש\u003c/strong>: יותר דם לשרירים הפעילים ופחות למערכות שאינן חיוניות למאמץ.\u003c/li>\u003cli>\u003cstrong>הפרש החמצן העורקי-ורידי גדל\u003c/strong> ככל שהשרירים מנצלים יותר חמצן.\u003c/li>\u003c/ul>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>נתון\u003c/th>\u003cth>לא מאומן (כמתואר בחוברת)\u003c/th>\u003cth>מאומן (כמתואר בחוברת)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">דופק במנוחה\u003c/th>\u003ctd>כ-60–80 לדקה\u003c/td>\u003ctd>כ-35–50 לדקה\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">נפח פעימה במנוחה\u003c/th>\u003ctd>כ-70 מ״ל\u003c/td>\u003ctd>כ-110 מ״ל\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">תפוקת לב במנוחה\u003c/th>\u003ctd>כ-5 ליטר לדקה\u003c/td>\u003ctd>כ-5 ליטר לדקה\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">תפוקת לב מרבית\u003c/th>\u003ctd>כ-18–21 ליטר לדקה\u003c/td>\u003ctd>כ-30–40 ליטר לדקה\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>הערכים בטבלה הם דוגמאות והשוואות מתוך עמ׳ 66 של החוברת, ולא טווחים אבחנתיים לאדם מסוים.\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"61,62,63,64,65,66,67,68,69\" data-slides=\"\" data-deck=\"99516\" data-title=\"מה קורה בזמן מאמץ?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B01-8\">\u003ch2 class=\"part\">דופק מטרה ונוסחת קרבונן \u003cspan class=\"pchip\">עמ׳ \u003cbdi>63, 70–71\u003c/bdi>\u003c/span>\u003c/h2>\n\u003caside class=\"gnote fbox\">\u003cspan class=\"tag\">דופק מרבי משוער לפי החוברת\u003c/span>\u003cdiv>\u003cdiv class=\"eqn\" dir=\"ltr\">HRmax ≈ 220 − age\u003c/div>\u003c/div>\u003c/aside>\n\u003caside class=\"gnote fbox\">\u003cspan class=\"tag\">דופק מטרה בשיטת קרבונן\u003c/span>\u003cdiv>\u003cdiv class=\"eqn\" dir=\"ltr\">Target HR = HRrest + intensity × (HRmax − HRrest)\u003c/div>\u003c/div>\u003c/aside>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">דוגמת החוברת\u003c/span>\u003cdiv>\u003cp>גיל 20: דופק מרבי משוער 200; דופק מנוחה 70. ב-50% רזרבה: 70 + 0.50 × (200 − 70) = 135 פעימות לדקה. בחוברת יש גם דוגמאות עם דופק מרבי 190 (עמ׳ 71).\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"selfcheck\">\u003ch3>בדיקת ידע עצמית\u003c/h3>\u003col>\u003cli>\u003cdetails>\u003csummary>מה ההבדל בין המחזור הקטן למחזור הגדול?\u003c/summary>\u003cp>המחזור הקטן מזרים דם דרך הריאות לצורך חילוף גזים; הגדול מזרים דם בין הלב לשאר רקמות הגוף.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מדוע עורק הריאה נחשב עורק אף שהוא מוליך דם דל חמצן?\u003c/summary>\u003cp>מפני שהוא מוציא דם מן הלב, ועורק מוגדר על פי כיוון הזרימה.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מהי תפוקת הלב בדופק 80 ובנפח פעימה 75 מ״ל?\u003c/summary>\u003cp>6,000 מ״ל בדקה, כלומר 6 ליטר לדקה.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מה פירוש לחץ דם 120/80?\u003c/summary>\u003cp>120 הוא לחץ סיסטולי ו-80 הוא לחץ דיאסטולי.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מה ההבדל הכללי בין לב מאומן ללב לא מאומן במנוחה?\u003c/summary>\u003cp>המאומן עשוי לפעום לאט יותר אך להזרים יותר דם בכל פעימה, כך שתפוקת הלב במנוחה דומה.\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-pages=\"63,70,71\" data-slides=\"\" data-deck=\"99516\" data-title=\"דופק מטרה ונוסחת קרבונן\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B01-9\">\u003ch2 class=\"part\">בדיקת הבנה בעל פה\u003c/h2>\n\u003col>\u003cli>התחילו מהוורידים הנבובים: תארו את המסלול שעוברת טיפת דם עד שהיא שבה אל הלב.\u003c/li>\u003cli>מדוע עורק הריאה אינו דומה לעורקים אחרים מבחינת תכולת החמצן?\u003c/li>\u003cli>מהי תפוקת הלב כשקצב הלב 80 לדקה ונפח הפעימה 75 מיליליטר?\u003c/li>\u003cli>מה ההבדל בין דופק במנוחה לבין תפוקת לב במנוחה אצל מאומן ולא מאומן?\u003c/li>\u003cli>כיצד מחשבים דופק מטרה בשיטת קרבונן כאשר ידועים גיל, דופק מנוחה ואחוז רזרבה?\u003c/li>\u003c/ol>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-slides=\"\" data-deck=\"99516\" data-title=\"בדיקת הבנה בעל פה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B01-10\">\u003ch2 class=\"part\">בלבולים שכדאי להימנע מהם\u003c/h2>\n\u003cul>\u003cli>לא להתבלבל בין עורק/וריד לבין דם עשיר/דל בחמצן; ההגדרה היא לפי הכיוון ביחס ללב.\u003c/li>\u003cli>לא להחליף בין \u003cbdi>SV\u003c/bdi>, \u003cbdi>HR\u003c/bdi> ו-\u003cbdi>CO\u003c/bdi>; להקריא יחידות בכל חישוב.\u003c/li>\u003cli>דופק מרבי 220 פחות הגיל הוא אומדן בקורס, לא מדידה אישית.\u003c/li>\u003c/ul>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-slides=\"\" data-deck=\"99516\" data-title=\"בלבולים שכדאי להימנע מהם\">\u003c/div>\u003c/section>\n\u003ch2 class=\"major\">חלק ב׳, גרסה מורחבת: דוגמאות, הסברים ומצגות\u003c/h2>\n\u003cp>\u003cem>תוספת זו הופקה מהמצגת של אירה שקד ומחוברת הקורס. ההפניות לשקפים מתייחסות לקובץ המצגת של מערכת הלב וכלי הדם. חומרי הקורס הם המקורות; השאלות והדוגמאות מנוסחות מחדש ללמידה.\u003c/em>\u003c/p>\n\u003ch2 class=\"major\">הרחבה מעמיקה: מערכת הלב וכלי הדם\u003c/h2>\n\u003cp>הסבר זה משלים את פרק הלב וכלי הדם בחוברת (עמודים 52–74) באמצעות מצגת \u003cstrong>מערכת הלב וכלי הדם במנוחה ובמאמץ\u003c/strong>, אירה שקד, שקופיות 1–27. הדוגמאות נועדו להבין קשרי סיבה ותוצאה, לא להחליף את ההגדרות והנוסחאות של הקורס.\u003c/p>\n\u003csection class=\"lsec module\" id=\"s-B01-11\">\u003ch2 class=\"part\">1. מערכת ההובלה: שלושה רכיבים שעובדים יחד\u003c/h2>\n\u003cp>\u003cstrong>הלב\u003c/strong> הוא המשאבה; \u003cstrong>כלי הדם\u003c/strong> הם רשת ההולכה; \u003cstrong>הדם\u003c/strong> הוא נוזל ההובלה. כל שלושתם נחוצים: משאבה חזקה בלי רשת כלי דם לא תזין רקמות, וכלי דם בלי דם לא יספקו חמצן. המצגת מונה חמצן ופחמן דו-חמצני, מזון, פסולת, הורמונים וחום כחומרים או צורות אנרגיה המועברים במערכת. חשוב להבחין בין \u003cem>הובלה\u003c/em> (מה שהדם עושה) ל-\u003cem>חילוף\u003c/em> (מה שמתרחש בדופן הנימים). \u003cstrong>השריר הפעיל במאמץ\u003c/strong> צורך יותר חמצן וגלוקוז ומייצר יותר פחמן דו-חמצני וחום; לכן מערכת ההובלה משנה את התפוקה ואת חלוקת זרימת הדם.\u003c/p>\n\u003caside class=\"gnote kind\">\u003cspan class=\"tag\">דוגמה למחשבה\u003c/span>\u003cdiv>\u003cp>מדוע אין די בכך שהריאות מכניסות חמצן? משום שחמצן צריך להיקלט לדם ולהגיע באמצעות מערכת ההובלה לכל תא פעיל. \u003cspan class=\"src-inline\">מצגת לב, שקפים 2–3; חוברת 52–53\u003c/span>\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"52,53\" data-slides=\"2,3\" data-deck=\"99516\" data-title=\"1. מערכת ההובלה: שלושה רכיבים שעובדים יחד\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B01-12\">\u003ch2 class=\"part\">2. שני מחזורי דם כמסלול אחד רציף\u003c/h2>\n\u003cp>המחזור הריאתי יוצא מ\u003cstrong>חדר ימין\u003c/strong> אל \u003cstrong>עורק הריאה\u003c/strong>, עובר בריאות וחוזר דרך \u003cstrong>ורידי הריאה\u003c/strong> אל \u003cstrong>עלייה שמאל\u003c/strong>. המחזור הגדול יוצא מ\u003cstrong>חדר שמאל\u003c/strong> דרך \u003cstrong>אבי העורקים\u003c/strong>, עובר ברקמות וחוזר דרך הוורידים הנבובים ל\u003cstrong>עלייה ימין\u003c/strong>. שני המחזורים מחוברים בטור, ולצורך התפקוד התקין אותה כמות דם צריכה לעבור בשניהם לאורך זמן.\u003c/p>\n\u003cp>המושגים \u003cem>עורק\u003c/em> ו-\u003cem>וריד\u003c/em> מבוססים על כיוון ביחס ללב, ולא על ריווי החמצן. לכן עורק הריאה הוא עורק שמוביל דם דל בחמצן, ואילו ורידי הריאה מובילים דם עשיר בחמצן. לומדים את המסלול בעזרת ארבע נקודות עוגן: חדר ימין ← ריאות ← עלייה שמאל ← חדר שמאל ← גוף ← עלייה ימין.\u003c/p>\n\u003caside class=\"gnote kind\">\u003cspan class=\"tag\">שאלת הבנה\u003c/span>\u003cdiv>\u003cp>מה יקרה אם חדר ימין יפסיק להזרים דם? זרימת הדם לריאות תפגע, ולכן גם מילוי הצד השמאלי ואספקת הדם לרקמות ייפגעו. \u003cspan class=\"src-inline\">מצגת לב, שקפים 4–5; חוברת 53–54\u003c/span>\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"53,54\" data-slides=\"4,5\" data-deck=\"99516\" data-title=\"2. שני מחזורי דם כמסלול אחד רציף\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B01-13\">\u003ch2 class=\"part\">3. מבנה הלב, מסתמים וסדר פעימה\u003c/h2>\n\u003cp>העליות הן חללי קליטה והחדרים הם חללי הזרקה. \u003cstrong>דיאסטולה\u003c/strong> היא הרפיית חדרי הלב ומילויים; \u003cstrong>סיסטולה\u003c/strong> היא התכווצות החדרים והזרקת הדם. בשקופית 6 מופיעות חלוקות זמן בקירוב של 62% לדיאסטולה ו-38% לסיסטולה במנוחה. אלו ערכי הוראה מקורבים המשתנים עם קצב הלב, ולא קבועים לכל מצב. מסתמי הלב פועלים בעקבות הפרשי לחצים, ולא משום שמישהו ״פותח״ אותם עצבית באופן ישיר. כאשר הלחץ בצד אחד עולה על הלחץ בצד השני, המסתם המתאים נפתח או נסגר כך שזרימת הדם תתקדם בכיוון הרצוי.\u003c/p>\n\u003cp>קוצב הלב העיקרי מייצר קצב בסיסי, ואילו מערכת העצבים האוטונומית משנה אותו: תגובה \u003cstrong>סימפתטית\u003c/strong> מגבירה בדרך כלל דופק וכוח כיווץ; \u003cstrong>פאראסימפתטית\u003c/strong> מאטה את קצב הלב. אל תבלבלו בין בקרה חשמלית על הקצב לבין פעולה מכנית של דם ומסתמים. \u003cspan class=\"src-inline\">מצגת לב, שקפים 5–7; חוברת 54–55\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"54,55\" data-slides=\"5,6,7\" data-deck=\"99516\" data-title=\"3. מבנה הלב, מסתמים וסדר פעימה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B01-14\">\u003ch2 class=\"part\">4. עורקים, נימים וורידים: המבנה מתאים לתפקיד\u003c/h2>\n\u003cp>עורקים עמידים בלחצי הזרקה גבוהים יותר, ולכן דופנם עבה יחסית ומכילה שריר חלק ורכיבים אלסטיים. \u003cstrong>עורקיקים\u003c/strong> הם גורם חשוב לוויסות ההתנגדות ולחלוקת הדם לרקמות. \u003cstrong>נימים\u003c/strong> דקיקים ובעלי שכבת אנדותל יחידה, כדי לאפשר מעבר גזים וחומרים. \u003cstrong>ורידים\u003c/strong> מחזירים את הדם בלחץ נמוך יותר ומשמשים גם מאגר נפח; באזורים רבים יש בהם מסתמים חד-כיווניים.\u003c/p>\n\u003cp>חזרת דם ורידי אל הלב נעזרת בכיווץ שרירי שלד, במסתמים ובשינויי הלחץ בבית החזה בזמן נשימה. בזמן פעילות של שרירי הרגליים, לדוגמה, כל כיווץ מסייע לדחוף דם בוורידים. אם המסתמים לא ימנעו חזרה לאחור, יעילות מנגנון זה תפחת.\u003c/p>\n\u003caside class=\"gnote kind\">\u003cspan class=\"tag\">השוואה לזכירה\u003c/span>\u003cdiv>\u003cp>עורק = הולכה מן הלב; נים = חילוף; וריד = החזרה ללב. \u003cspan class=\"src-inline\">מצגת לב, שקפים 8–10; חוברת 56–57\u003c/span>\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"56,57\" data-slides=\"8,9,10\" data-deck=\"99516\" data-title=\"4. עורקים, נימים וורידים: המבנה מתאים לתפקיד\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B01-15\">\u003ch2 class=\"part\">5. לחץ הדם: מה בדיוק מודדים?\u003c/h2>\n\u003cp>לחץ דם הוא הכוח שהדם מפעיל על דופן הכלי. \u003cstrong>לחץ סיסטולי\u003c/strong> נמדד בעת התכווצות החדרים; \u003cstrong>לחץ דיאסטולי\u003c/strong> בעת הרפייתם. ערך כמו 120/80 נכתב לפי הסדר סיסטולי/דיאסטולי. אל תטעו ותחשבו שנפח הדם, קוטר הכלי וצמיגות הדם הם שמות שונים לאותו גורם: נפח משפיע על כמות הנוזל במערכת; קוטר משנה את ההתנגדות לזרימה; צמיגות משפיעה על ההתנגדות הנובעת מתכונות הדם.\u003c/p>\n\u003cp>המצגת מדגימה גורמים המשפיעים על לחץ דם, ומדגישה שפעילות גופנית ואימון משפיעים עליו באופן שונה במנוחה ובמאמץ. מספרי לחץ הדם שבמצגת הם \u003cstrong>ערכי לימוד מהקורס\u003c/strong>, לא גבולות לאבחנה רפואית כיום. \u003cspan class=\"src-inline\">מצגת לב, שקף 11; חוברת 57, 61–62\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"57,61,62\" data-slides=\"11\" data-deck=\"99516\" data-title=\"5. לחץ הדם: מה בדיוק מודדים?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B01-16\">\u003ch2 class=\"part\">6. מרכיבי הדם ואנמיה\u003c/h2>\n\u003cp>על פי מצגת הקורס, כ-\u003cstrong>55% מנפח הדם הם פלזמה\u003c/strong> וכ-\u003cstrong>45% מרכיבים תאיים\u003c/strong>. בתוך הפלזמה יש כ-90% מים, כ-8% חלבונים וכ-2% מומסים שונים. תאי הדם האדומים נושאים המוגלובין, המסייע בהובלת רוב החמצן שבדם; תאי דם לבנים קשורים להגנה החיסונית; וטסיות תורמות לקרישה. כשיש מחסור בתאי דם אדומים או בהמוגלובין, עלולה להיפגע כמות החמצן שהדם מסוגל לשאת, גם אם הריאות מחליפות גזים באופן תקין.\u003c/p>\n\u003caside class=\"gnote kind\">\u003cspan class=\"tag\">מבחן הבנה\u003c/span>\u003cdiv>\u003cp>מה ההבדל בין אחוז תאי הדם האדומים לבין ריווי החמצן? הראשון קשור לכמות התאים בדם, והשני למידת קשירת החמצן להמוגלובין. אלו מדדים שונים. \u003cspan class=\"src-inline\">מצגת לב, שקף 12; חוברת 58–59\u003c/span>\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"58,59\" data-slides=\"12\" data-deck=\"99516\" data-title=\"6. מרכיבי הדם ואנמיה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B01-17\">\u003ch2 class=\"part\">7. תפוקת הלב, קצב הלב ונפח הפעימה\u003c/h2>\n\u003cp>\u003cstrong>\u003cbdi>CO\u003c/bdi> = \u003cbdi>HR\u003c/bdi> × \u003cbdi>SV\u003c/bdi>\u003c/strong>. תפוקת הלב היא נפח הדם שהחדר השמאלי מזרים בדקה. \u003cbdi>HR\u003c/bdi> הוא מספר הפעימות בדקה, ו-\u003cbdi>SV\u003c/bdi> הוא נפח הדם המוזרק בכל פעימה. אם \u003cbdi>HR\u003c/bdi> = 75 פעימות/דקה ו-\u003cbdi>SV\u003c/bdi> = 80 מ״ל/פעימה, מקבלים 6,000 מ״ל/דקה = \u003cstrong>6 ליטר/דקה\u003c/strong>. תמיד מציגים גם יחידות, כדי להבין כיצד פעימות מצטמצמות בחישוב.\u003c/p>\n\u003cp>\u003cstrong>\u003cbdi>SV\u003c/bdi> = \u003cbdi>EDV\u003c/bdi> − \u003cbdi>ESV\u003c/bdi>\u003c/strong>, כלומר נפח סוף דיאסטולי פחות נפח סוף סיסטולי. אם בחדר היו 125 מ״ל לפני כיווץ ונשארו 50 מ״ל אחריו, נפח הפעימה הוא 75 מ״ל. ניתן להגדיל את \u003cbdi>CO\u003c/bdi> גם על ידי עליית \u003cbdi>HR\u003c/bdi> וגם על ידי עליית \u003cbdi>SV\u003c/bdi>, אבל תפקידם היחסי משתנה לפי עצימות ומצב אימון.\u003c/p>\n\u003caside class=\"gnote kind\">\u003cspan class=\"tag\">טעות נפוצה\u003c/span>\u003cdiv>\u003cp>לחשב 70×70 ולקבל 4,900 \u003cem>ליטר\u003c/em> בדקה. זו תוצאה במ״ל/דקה שיש לחלק ב-1,000. \u003cspan class=\"src-inline\">מצגת לב, שקפים 13–15, 19; חוברת 60, 64\u003c/span>\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"60,64\" data-slides=\"13,14,15,19\" data-deck=\"99516\" data-title=\"7. תפוקת הלב, קצב הלב ונפח הפעימה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B01-18\">\u003ch2 class=\"part\">8. חוק פרנק-סטרלינג: למה מילוי הלב חשוב?\u003c/h2>\n\u003cp>כאשר יותר דם חוזר לחדר לפני ההתכווצות, דופן החדר נמתחת יותר, ובטווח הפיזיולוגי מתאפשר כיווץ חזק יותר. זהו רעיון \u003cstrong>\u003cbdi>Frank-Starling\u003c/bdi>\u003c/strong>: נפח מילוי משפיע על נפח פעימה. המצגת מצרפת לכך השפעות עצביות-הורמונליות והחזר ורידי. חשוב להפריד בין שני מנגנונים: \u003cem>עלייה במילוי\u003c/em> היא בעיקר עניין של נפח והחזר ורידי; \u003cem>עלייה בכוח הכיווץ\u003c/em> יכולה להיגרם גם מהשפעת קטכולאמינים.\u003c/p>\n\u003caside class=\"gnote kind\">\u003cspan class=\"tag\">דוגמה\u003c/span>\u003cdiv>\u003cp>בתחילת מאמץ שרירי הרגליים מתכווצים בתדירות גבוהה יותר ומסייעים להחזר הוורידי. כך עשוי לעלות מילוי החדר ולהגדיל \u003cbdi>SV\u003c/bdi> גם בטרם נוצר שינוי ארוך טווח במבנה הלב. \u003cspan class=\"src-inline\">מצגת לב, שקפים 14–16; חוברת 60–62\u003c/span>\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"60,61,62\" data-slides=\"14,15,16\" data-deck=\"99516\" data-title=\"8. חוק פרנק-סטרלינג: למה מילוי הלב חשוב?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B01-19\">\u003ch2 class=\"part\">9. מאומן ולא מאומן: לא רק דופק נמוך\u003c/h2>\n\u003cp>במצגת מתואר \u003cstrong>\u003cbdi>SV\u003c/bdi> גבוה יותר במאומן\u003c/strong> גם במנוחה וגם במאמץ, ובהתאם דופק נמוך יותר יכול להספיק לשמירת \u003cbdi>CO\u003c/bdi> של כ-5 ליטר/דקה במנוחה. כושר אירובי משפר את מילוי החדרים, את יכולת הכיווץ, את צפיפות הנימים ברקמה ואת יעילות מיצוי החמצן. במאמץ מרבי מאומן יכול להגיע לתפוקת לב גבוהה יותר. בשקפים 15, 19 מופיעות דוגמאות ערכים לפי קורס, שיש ללמוד בהקשר שלהן ולא כחוק ביולוגי לכל אדם.\u003c/p>\n\u003cp>המצגת מבדילה בין \u003cstrong>היפרטרופיה אקסצנטרית\u003c/strong> המתוארת בעיקר בהתאמות לאימוני סבולת, לבין \u003cstrong>היפרטרופיה קונצנטרית\u003c/strong> בהקשר של עומסי לחץ כמו אימוני התנגדות. זו סכמת הוראה שמסייעת לזכור מהו העומס הדומיננטי; במציאות דפוסי ההסתגלות אינם תמיד מופרדים לגמרי.\u003c/p>\n\u003caside class=\"gnote kind\">\u003cspan class=\"tag\">שאלת הבנה\u003c/span>\u003cdiv>\u003cp>למה \u003cbdi>CO\u003c/bdi> במנוחה אינו בהכרח גבוה יותר אצל מאומן? כי \u003cbdi>SV\u003c/bdi> גדול יותר יכול להתאזן עם \u003cbdi>HR\u003c/bdi> נמוך יותר. \u003cspan class=\"src-inline\">מצגת לב, שקפים 19–24; חוברת 64–69\u003c/span>\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"64,65,66,67,68,69\" data-slides=\"19,20,21,22,23,24\" data-deck=\"99516\" data-title=\"9. מאומן ולא מאומן: לא רק דופק נמוך\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B01-20\">\u003ch2 class=\"part\">10. זרימת דם מחדש בזמן מאמץ\u003c/h2>\n\u003cp>כשעצימות המאמץ עולה, לא כל רקמה מקבלת אותה תוספת דם. זרימת הדם לשרירים העובדים גדלה משמעותית, בעוד שחלקם היחסי של איברים אחרים בתפוקה עשוי לרדת. הטבלה בחוברת בעמוד 68 מדגימה את החלוקה באחוזים ובנפחים במנוחה ובמאמץ. כדי לפרש אותה נכון, צריך להבדיל בין \u003cstrong>אחוז יחסי מתוך תפוקת הלב\u003c/strong> לבין \u003cstrong>נפח מוחלט בדקה\u003c/strong>. אחוז יכול לרדת גם כאשר כמות הדם המוחלטת כמעט לא השתנתה, משום שהמכנה, תפוקת הלב הכוללת, גדל.\u003c/p>\n\u003cp>לדוגמה, אם חלק מסוים מקבל 20% מתוך 5 ליטר, מדובר בליטר. אם במאמץ הוא מקבל 10% מתוך 20 ליטר, עדיין מדובר בשני ליטרים, למרות הירידה באחוז היחסי. \u003cspan class=\"src-inline\">חוברת 68; מצגת לב, שקפים 23–24\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"68\" data-slides=\"23,24\" data-deck=\"99516\" data-title=\"10. זרימת דם מחדש בזמן מאמץ\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B01-21\">\u003ch2 class=\"part\">11. נוסחת פיק והקשר בין הלב לשרירים\u003c/h2>\n\u003cp>הקשר המרכזי הוא \u003cstrong>\u003cbdi>VO₂\u003c/bdi> = \u003cbdi>CO\u003c/bdi> × (\u003cbdi>a\u003c/bdi>−\u003cbdi>vO₂ difference\u003c/bdi>)\u003c/strong>. כמות החמצן שהגוף צורך תלויה בכמות הדם הזורמת בדקה ובכמות החמצן שהרקמות מוציאות מכל יחידת דם. לכן שני אנשים עם תפוקת לב דומה עשויים להיות שונים ביכולת האירובית אם לשרירי אחד מהם נימים רבים יותר, מיטוכונדריות מפותחות יותר ומיצוי חמצן טוב יותר.\u003c/p>\n\u003cp>אין לבלבל בין \u003cstrong>תפוקת לב\u003c/strong> (ליטרים של דם בדקה) לבין \u003cstrong>צריכת חמצן\u003c/strong> (כמות חמצן בדקה). תפוקת הלב היא רכיב אחד במשוואה. \u003cspan class=\"src-inline\">חוברת 65–70; מצגת לב, שקפים 23–25\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"65,66,67,68,69,70\" data-slides=\"23,24,25\" data-deck=\"99516\" data-title=\"11. נוסחת פיק והקשר בין הלב לשרירים\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B01-22\">\u003ch2 class=\"part\">12. דופק מרבי, דופק מטרה ונוסחת קרבונן\u003c/h2>\n\u003cp>המצגת מציגה אומדנים לימודיים לדופק מרבי לפי גיל: לגבר בקירוב 220 פחות הגיל ולאישה 226 פחות הגיל. אלו \u003cstrong>קירובים\u003c/strong> עם שונות אישית גדולה. הם משמשים בתרגילי הקורס, אך אינם מדידה מדויקת של דופק מרבי. נוסחת \u003cstrong>\u003cbdi>Karvonen\u003c/bdi>\u003c/strong> משתמשת ב\u003cstrong>רזרבת הדופק\u003c/strong>: \u003cbdi>HRtarget\u003c/bdi> = \u003cbdi>HRrest\u003c/bdi> + \u003cbdi>intensity\u003c/bdi> × (\u003cbdi>HRmax\u003c/bdi> − \u003cbdi>HRrest\u003c/bdi>).\u003c/p>\n\u003caside class=\"gnote kind\">\u003cspan class=\"tag\">דוגמה מלאה\u003c/span>\u003cdiv>\u003cp>דופק מנוחה 70, דופק מרבי מוערך 190, עצימות מטרה 60%. רזרבת הדופק היא 120; שישים אחוז ממנה הם 72; מוסיפים דופק מנוחה 70 ומקבלים \u003cstrong>142 פעימות לדקה\u003c/strong>. ההבדל בין 60% מדופק מרבי (114) לבין 60% מרזרבת הדופק (142) הוא בסיס לשאלת מלכודת.\u003c/p>\u003c/div>\u003c/aside>\n\u003caside class=\"gnote kind\">\u003cspan class=\"tag\">בדיקת הבנה\u003c/span>\u003cdiv>\u003cp>אם דופק המנוחה יורד לאחר תקופת אימון, הצבה מחדש בנוסחה משנה גם את רזרבת הדופק וגם את הדופק המטרה. \u003cspan class=\"src-inline\">מצגת לב, שקפים 25–27; חוברת 70–71\u003c/span>\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"70,71\" data-slides=\"25,26,27\" data-deck=\"99516\" data-title=\"12. דופק מרבי, דופק מטרה ונוסחת קרבונן\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B01-23\">\u003ch2 class=\"part\">חזרה פעילה לפרק\u003c/h2>\n\u003col>\u003cli>\u003cdetails class=\"solve\">\u003csummary>עקבי אחרי תא דם היוצא מחדר ימין עד שהוא חוזר אליו.\u003c/summary>\u003cp>עורק ריאה ← ריאות ← ורידי ריאה ← עלייה שמאל ← חדר שמאל ← אבי העורקים ← רקמות ← ורידים נבובים ← עלייה ימין ← חדר ימין.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>אם \u003cbdi>SV\u003c/bdi> גדל מ-70 ל-100 מ״ל ו-\u003cbdi>HR\u003c/bdi> נשאר 60, מה קורה לתפוקה?\u003c/summary>\u003cp>עולה מ-4.2 ל-6 ליטר בדקה.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>למה למאומן יכול להיות דופק נמוך יותר באותו מאמץ תת-מרבי?\u003c/summary>\u003cp>בין היתר \u003cbdi>SV\u003c/bdi> גבוה יותר ומיצוי חמצן יעיל יותר.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>מדוע נים ולא עורק גדול הוא האתר המרכזי לחילוף גזים?\u003c/summary>\u003cp>דופן נימית דקה המאפשרת דיפוזיה ומעבר חומרים.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>מה ההבדל בין חלק יחסי של זרימת דם לבין כמות מוחלטת?\u003c/summary>\u003cp>אחוז מתוך כלל \u003cbdi>CO\u003c/bdi> מול נפח בליטר/דקה; האחוז יכול לרדת והנפח לעלות.\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-slides=\"\" data-deck=\"99516\" data-title=\"חזרה פעילה לפרק\">\u003c/div>\u003c/section>","key":"L-B01","sourcePages":[52,74],"deck":"99516"},{"topicId":"B02","title":"פיזיולוגיה של השרירים ומערכת העצבים","unit":"יחידה 02 · עמודי מקור 75–91","howTo":"ללמוד לפי סדר היחידות; לאחר כל תת-נושא לפתוח תרגול ולהמשיך רק אחרי הבנה. נוסחאות יש לקרוא עם יחידות מדידה, ולתרשימים יש לתת פירוש מילולי.","sections":[{"id":"s-B02-1","title":"ארגון השריר מהגדול לקטן","pages":"75–76","module":false,"slides":[],"pagesList":[75,76]},{"id":"s-B02-2","title":"איך מתחיל כיווץ שריר?","pages":"77–78","module":false,"slides":[],"pagesList":[77,78]},{"id":"s-B02-3","title":"יחידה מוטורית וגיוס יחידות","pages":"78–79, 83","module":false,"slides":[],"pagesList":[78,79,83]},{"id":"s-B02-4","title":"השוואה בין סוגי סיבי השריר","pages":"79–82","module":false,"slides":[],"pagesList":[79,80,81,82]},{"id":"s-B02-5","title":"תגובה לאימון והתאוששות","pages":"83–85","module":false,"slides":[],"pagesList":[83,84,85]},{"id":"s-B02-6","title":"בקרה על התנועה: רפלקסים וקולטנים","pages":"86–88","module":false,"slides":[],"pagesList":[86,87,88]},{"id":"s-B02-7","title":"בדיקת הבנה בעל פה","pages":"","module":false,"slides":[],"pagesList":[]},{"id":"s-B02-8","title":"בלבולים שכדאי להימנע מהם","pages":"","module":false,"slides":[],"pagesList":[]},{"id":"s-B02-9","title":"1. שלושה סוגי שרירים ותפקידם בגוף","pages":"","module":true,"slides":[2,3],"pagesList":[75]},{"id":"s-B02-10","title":"2. היררכיית המבנה: מן השריר לסרקומר","pages":"","module":true,"slides":[4,5,6],"pagesList":[75,76,77]},{"id":"s-B02-11","title":"3. מנגנון הכיווץ כסיפור בן עשרה צעדים","pages":"","module":true,"slides":[7,8],"pagesList":[77,78]},{"id":"s-B02-12","title":"4. תאוריה של החלקת סיבים, ולא התקצרות החלבונים","pages":"","module":true,"slides":[6,7,8],"pagesList":[76,77]},{"id":"s-B02-13","title":"5. יחידה מוטורית ועיקרון ״הכול או לא כלום״","pages":"","module":true,"slides":[9],"pagesList":[78,79]},{"id":"s-B02-14","title":"6. סיבי שריר איטיים ומהירים","pages":"","module":true,"slides":[10,11,12,13],"pagesList":[79,80,81,82,83]},{"id":"s-B02-15","title":"7. גיוס יחידות מוטוריות ויצירת כוח","pages":"","module":true,"slides":[9,14,17],"pagesList":[83,84]},{"id":"s-B02-16","title":"8. הסתגלות לאימוני סבולת","pages":"","module":true,"slides":[15,16],"pagesList":[83,84]},{"id":"s-B02-17","title":"9. הסתגלות לאימוני כוח: עצב קודם, מבנה בהמשך","pages":"","module":true,"slides":[15,17],"pagesList":[83,84]},{"id":"s-B02-18","title":"10. DOMS: מדוע הכאב מופיע מאוחר?","pages":"","module":true,"slides":[18,19,20],"pagesList":[85,86]},{"id":"s-B02-19","title":"11. מערכת העצבים ובקרת התנועה","pages":"","module":true,"slides":[21,22],"pagesList":[86]},{"id":"s-B02-20","title":"12. רפלקס מתיחה לעומת אברון הגיד של גולג'י","pages":"","module":true,"slides":[23,24,25],"pagesList":[87,88]},{"id":"s-B02-21","title":"חזרה פעילה לפרק","pages":"","module":false,"slides":[],"pagesList":[]}],"html":"\u003cp>מהרמה של שריר שלם ועד סיבי אקטין ומיוזין: כיצד נוצרת התכווצות, כיצד מגויסים סיבים ואיך הגוף מסתגל לאימון.\u003c/p>\n\u003csection class=\"lsec \" id=\"s-B02-1\">\u003ch2 class=\"part\">ארגון השריר מהגדול לקטן \u003cspan class=\"pchip\">עמ׳ \u003cbdi>75–76\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cfigure class=\"gfig flow\" aria-label=\"רצף\">\u003col>\u003cli>שריר שלם\u003c/li>\u003cli>צרורות\u003c/li>\u003cli>סיבי שריר / תאים\u003c/li>\u003cli>מיופיברילות\u003c/li>\u003cli>סרקומרים\u003c/li>\u003cli>אקטין ומיוזין\u003c/li>\u003c/ol>\u003c/figure>\n\u003cp>סיב שריר הוא תא גדול המכיל מיופיברילות רבות. \u003cstrong>סרקומר\u003c/strong> הוא יחידת הכיווץ התפקודית. בחוברת מתוארים גם קרום התא ומערכת הצינורות המשמשת להעברת אותות ולבקרת סידן.\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"75,76\" data-slides=\"\" data-deck=\"99517\" data-title=\"ארגון השריר מהגדול לקטן\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B02-2\">\u003ch2 class=\"part\">איך מתחיל כיווץ שריר? \u003cspan class=\"pchip\">עמ׳ \u003cbdi>77–78\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cfigure class=\"gfig flow\" aria-label=\"רצף\">\u003col>\u003cli>פקודה עצבית\u003c/li>\u003cli>שחרור אצטילכולין\u003c/li>\u003cli>אות חשמלי בסיב השריר\u003c/li>\u003cli>שחרור סידן\u003c/li>\u003cli>קישור סידן לטרופונין\u003c/li>\u003cli>פעולת גשרי רוחב\u003c/li>\u003c/ol>\u003c/figure>\n\u003cul>\u003cli>האות העצבי מגיע לקצה האקסון במפגש עצב-שריר.\u003c/li>\u003cli>אצטילכולין מועבר במרווח הסינפטי ומפעיל את סיב השריר.\u003c/li>\u003cli>שחרור יוני סידן מאפשר אינטראקציה בין אקטין ומיוזין.\u003c/li>\u003cli>ראשי המיוזין נקשרים לאקטין, מבצעים \u003cbdi>Power Stroke\u003c/bdi> ומשתחררים בעזרת \u003cbdi>ATP\u003c/bdi>.\u003c/li>\u003cli>החזרת הסידן למאגרים מסייעת להפסקת הכיווץ ולהרפיה.\u003c/li>\u003c/ul>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">מה באמת מתקצר?\u003c/span>\u003cdiv>\u003cp>במודל הסיבים המחליקים, סיבי האקטין והמיוזין \u003cstrong>מחליקים זה ביחס לזה\u003c/strong>; הסרקומר מתקצר. אין מדובר בקיצור של חלבוני האקטין והמיוזין עצמם.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"77,78\" data-slides=\"\" data-deck=\"99517\" data-title=\"איך מתחיל כיווץ שריר?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B02-3\">\u003ch2 class=\"part\">יחידה מוטורית וגיוס יחידות \u003cspan class=\"pchip\">עמ׳ \u003cbdi>78–79, 83\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cp>\u003cstrong>יחידה מוטורית\u003c/strong> כוללת נוירון מוטורי ואת סיבי השריר שאותם הוא מעצבב. כשצריך יותר כוח, מערכת העצבים מגייסת יותר יחידות מוטוריות ומעלה את קצב פעולתן.\u003c/p>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">עיקרון הגיוס\u003c/span>\u003cdiv>\u003cp>בחוברת: בגיוס מדורג, יחידות קטנות ואיטיות משתתפות לפני גיוס יחידות מהירות יותר ככל שהדרישה לכוח גדלה.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"78,79,83\" data-slides=\"\" data-deck=\"99517\" data-title=\"יחידה מוטורית וגיוס יחידות\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B02-4\">\u003ch2 class=\"part\">השוואה בין סוגי סיבי השריר \u003cspan class=\"pchip\">עמ׳ \u003cbdi>79–82\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>מאפיין\u003c/th>\u003cth>\u003cbdi>Type I\u003c/bdi> / \u003cbdi>ST\u003c/bdi>\u003c/th>\u003cth>\u003cbdi>Type II\u003c/bdi> / \u003cbdi>FT\u003c/bdi>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">כינוי\u003c/th>\u003ctd>סיבים איטיים\u003c/td>\u003ctd>סיבים מהירים\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">מהירות כיווץ\u003c/th>\u003ctd>איטית\u003c/td>\u003ctd>מהירה\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">יכולת עמידות לאורך זמן\u003c/th>\u003ctd>גבוהה יחסית\u003c/td>\u003ctd>נמוכה יחסית\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">כוח / הספק מהיר\u003c/th>\u003ctd>נמוך יותר\u003c/td>\u003ctd>גבוה יותר\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">מסלול אנרגיה מאפיין\u003c/th>\u003ctd>אירובי\u003c/td>\u003ctd>השתתפות גדולה יותר במסלולים אנאירוביים\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">מיוגלובין ומיטוכונדריות\u003c/th>\u003ctd>רבים יחסית\u003c/td>\u003ctd>פחות בסיבים המהירים ביותר\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">תפקיד אופייני\u003c/th>\u003ctd>פעילות ממושכת\u003c/td>\u003ctd>מאמץ מהיר ועצים\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>בתוך קבוצת הסיבים המהירים החוברת מבחינה בין \u003cstrong>\u003cbdi>Type IIa\u003c/bdi>\u003c/strong> לבין \u003cstrong>\u003cbdi>Type IIb\u003c/bdi>\u003c/strong>, לפי מאפייני עייפות והפקת אנרגיה (עמ׳ 79–82).\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"79,80,81,82\" data-slides=\"\" data-deck=\"99517\" data-title=\"השוואה בין סוגי סיבי השריר\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B02-5\">\u003ch2 class=\"part\">תגובה לאימון והתאוששות \u003cspan class=\"pchip\">עמ׳ \u003cbdi>83–85\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>אימון\u003c/th>\u003cth>התאמה בולטת בחוברת\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">אימון סבולת / אירובי\u003c/th>\u003ctd>שיפור בתפקוד החמצוני, מספר או פעילות המיטוכונדריות, ויכולת לעבוד לאורך זמן.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">אימון כוח / התנגדות\u003c/th>\u003ctd>שיפור בתיאום העצבי וביכולת הפקת כוח; התפתחות היפרטרופיה של סיבי השריר לאורך זמן.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">בתחילת תהליך האימון\u003c/th>\u003ctd>חלק מהשיפור בכוח קשור להתאמות עצביות, עוד לפני שינוי ניכר בגודל השריר.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>מהי היפרטרופיה? ומהו \u003cbdi>DOMS\u003c/bdi>?\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>היפרטרופיה\u003c/strong>: גדילה בגודל סיבי השריר, ולא בהכרח יצירת מספר רב של סיבים חדשים.\u003c/li>\u003cli>\u003cstrong>\u003cbdi>DOMS\u003c/bdi>\u003c/strong>: כאבי שרירים מאוחרים בעקבות מאמץ לא שגרתי, במיוחד עם מרכיב אקסצנטרי.\u003c/li>\u003cli>בחוברת מוסבר שמקור הכאב קשור לנזק זעיר ולתהליך דלקתי מקומי, ולא להצטברות חומצת חלב שנשארת בשריר במשך ימים.\u003c/li>\u003c/ul>\n\u003cdiv class=\"sec-practice\" data-pages=\"83,84,85\" data-slides=\"\" data-deck=\"99517\" data-title=\"תגובה לאימון והתאוששות\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B02-6\">\u003ch2 class=\"part\">בקרה על התנועה: רפלקסים וקולטנים \u003cspan class=\"pchip\">עמ׳ \u003cbdi>86–88\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>מנגנון\u003c/th>\u003cth>מה הוא חש?\u003c/th>\u003cth>תגובה תפקודית מרכזית\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">כישור שריר (\u003cbdi>Muscle Spindle\u003c/bdi>)\u003c/th>\u003ctd>שינוי באורך השריר וקצב המתיחה\u003c/td>\u003ctd>מסייע בתגובה למתיחה ובשמירת תנוחה.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">איבר גולג׳י בגיד (\u003cbdi>Golgi Tendon Organ\u003c/bdi>)\u003c/th>\u003ctd>מתח בגיד\u003c/td>\u003ctd>משפיע על הפעלת שריר בהתאם למתח.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">רפלקס המתיחה\u003c/th>\u003ctd>מתיחה מהירה של שריר\u003c/td>\u003ctd>תגובה עצבית מהירה של השריר הנמתח.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"selfcheck\">\u003ch3>בדיקת ידע עצמית\u003c/h3>\u003col>\u003cli>\u003cdetails>\u003csummary>מהי יחידה מוטורית?\u003c/summary>\u003cp>נוירון מוטורי וסיבי השריר שהוא מפעיל.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מה תפקיד הסידן בכיווץ?\u003c/summary>\u003cp>לאפשר את הקישור בין אקטין למיוזין דרך מערכת חלבוני הבקרה.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מה ההבדל העיקרי בין \u003cbdi>ST\u003c/bdi> לבין \u003cbdi>FT\u003c/bdi>?\u003c/summary>\u003cp>\u003cbdi>ST\u003c/bdi> איטיים ועמידים יחסית; \u003cbdi>FT\u003c/bdi> מהירים ומותאמים להפקת כוח/הספק מהיר.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מהו \u003cbdi>Power Stroke\u003c/bdi>?\u003c/summary>\u003cp>תנועת ראש המיוזין שמושכת את סיב האקטין במהלך מחזור גשרי הרוחב.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מדוע כאבי שרירים מאוחרים אינם פשוט תוצאה של ״חומצת חלב שנתקעה״?\u003c/summary>\u003cp>לפי החוברת הם קשורים לנזק מיקרוסקופי ולתגובה דלקתית לאחר מאמץ לא שגרתי.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מה ההבדל בין כישור השריר לאיבר גולג׳י?\u003c/summary>\u003cp>כישור השריר עוקב אחר מתיחה; איבר גולג׳י רגיש למתח בגיד.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מהו עיקרון הגיוס לפי החוברת?\u003c/summary>\u003cp>עם עליית דרישת הכוח מגויסות יחידות מוטוריות נוספות, כולל מהירות יותר.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מהי היפרטרופיה?\u003c/summary>\u003cp>גדילה של סיבי השריר.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>איזה תפקיד יש ל-\u003cbdi>ATP\u003c/bdi> במעגל גשרי הרוחב?\u003c/summary>\u003cp>הוא מאפשר בין היתר שחרור של ראש המיוזין מן האקטין והמשך מחזור הכיווץ.\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-pages=\"86,87,88\" data-slides=\"\" data-deck=\"99517\" data-title=\"בקרה על התנועה: רפלקסים וקולטנים\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B02-7\">\u003ch2 class=\"part\">בדיקת הבנה בעל פה\u003c/h2>\n\u003col>\u003cli>איזה מבנה נחשב ליחידת הכיווץ התפקודית של השריר?\u003c/li>\u003cli>הקריאו את שרשרת האירועים מפקודה עצבית עד לתנועת ראשי המיוזין.\u003c/li>\u003cli>מה המשמעות של הצמדת \u003cbdi>ATP\u003c/bdi> לראש המיוזין במחזור הכיווץ?\u003c/li>\u003cli>איזו יחידה מוטורית מגויסת קודם ככלל כשעולים בדרישת הכוח?\u003c/li>\u003cli>מה ההבדל בין \u003cbdi>Type I\u003c/bdi> / \u003cbdi>ST\u003c/bdi> ל-\u003cbdi>Type II\u003c/bdi> / \u003cbdi>FT\u003c/bdi>?\u003c/li>\u003cli>מדוע \u003cbdi>DOMS\u003c/bdi> אינו נובע מחומצת חלב שנשארה בשריר ימים?\u003c/li>\u003cli>מה ההבדל בין כישור שריר לבין איבר גולג׳י בגיד?\u003c/li>\u003c/ol>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-slides=\"\" data-deck=\"99517\" data-title=\"בדיקת הבנה בעל פה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B02-8\">\u003ch2 class=\"part\">בלבולים שכדאי להימנע מהם\u003c/h2>\n\u003cul>\u003cli>חלבוני האקטין והמיוזין אינם מתקצרים: הם מחליקים זה ביחס לזה והסרקומר מתקצר.\u003c/li>\u003cli>\u003cbdi>DOMS\u003c/bdi> אינו ״לקטט תקוע״.\u003c/li>\u003cli>לא לערבב בין גיוס יחידות מוטוריות ובין היפרטרופיה.\u003c/li>\u003c/ul>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-slides=\"\" data-deck=\"99517\" data-title=\"בלבולים שכדאי להימנע מהם\">\u003c/div>\u003c/section>\n\u003ch2 class=\"major\">חלק ב׳, גרסה מורחבת: דוגמאות, הסברים ומצגות\u003c/h2>\n\u003cp>\u003cem>תוספת זו הופקה מהמצגת של אירה שקד ומחוברת הקורס. ההפניות לשקפים מתייחסות לקובץ המצגת של מערכת השרירים והעצבים. חומרי הקורס הם המקורות; השאלות והדוגמאות מנוסחות מחדש ללמידה.\u003c/em>\u003c/p>\n\u003ch2 class=\"major\">הרחבה מעמיקה: מערכת השרירים והבקרה העצבית\u003c/h2>\n\u003cp>מלווה את החוברת בעמודים 75–91 ואת מצגת \u003cstrong>מערכת השרירים\u003c/strong>, אירה שקד, שקופיות 1–25. כאן חשוב במיוחד לתאר \u003cem>רצפים\u003c/em>, כי היכרות עם רשימת חלקים אינה מספיקה כדי להסביר כיווץ שריר.\u003c/p>\n\u003csection class=\"lsec module\" id=\"s-B02-9\">\u003ch2 class=\"part\">1. שלושה סוגי שרירים ותפקידם בגוף\u003c/h2>\n\u003cp>שריר \u003cstrong>שלד\u003c/strong> מאפשר תנועה רצונית, יציבה והפקת חום. שריר \u003cstrong>חלק\u003c/strong> נמצא באיברים פנימיים ובדופן כלי דם, ופועל בדרך כלל ללא שליטה רצונית ישירה. שריר \u003cstrong>לב\u003c/strong> מפעיל את המשאבה הדמית ומושפע ממערכת הולכה עצמית ומבקרה עצבית-הורמונלית. המשותף לכל הסוגים הוא יכולת להפוך אנרגיה כימית לתנועה מכנית, אך המבנה, הבקרה וקצב הפעולה שונים.\u003c/p>\n\u003cp>כשמדברים על השריר כמאגר אנרגיה, הכוונה בעיקר למאגרי חומרים כמו גליקוגן; \u003cstrong>\u003cbdi>ATP\u003c/bdi>\u003c/strong> הוא המטבע המיידי להפעלת המנגנונים, ויש לחדשו שוב ושוב. \u003cspan class=\"src-inline\">מצגת שריר, שקפים 2–3; חוברת 75\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"75\" data-slides=\"2,3\" data-deck=\"99517\" data-title=\"1. שלושה סוגי שרירים ותפקידם בגוף\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B02-10\">\u003ch2 class=\"part\">2. היררכיית המבנה: מן השריר לסרקומר\u003c/h2>\n\u003cp>שריר שלם בנוי מ\u003cstrong>צרורות (\u003cbdi>Fascicles\u003c/bdi>)\u003c/strong> של סיבי שריר; כל \u003cstrong>סיב שריר (\u003cbdi>Muscle fiber\u003c/bdi>)\u003c/strong> הוא תא גדול, שבתוכו \u003cstrong>\u003cbdi>Myofibrils\u003c/bdi>\u003c/strong>. המיופיברילות בנויות יחידות חוזרות בשם \u003cstrong>\u003cbdi>Sarcomeres\u003c/bdi>\u003c/strong>, שמאפשרות את ההתקצרות. סרקומרים מכילים חלבוני כיווץ \u003cstrong>\u003cbdi>Actin\u003c/bdi>\u003c/strong> ו-\u003cstrong>\u003cbdi>Myosin\u003c/bdi>\u003c/strong>. כל שכבה עטופה ברקמות חיבור המסייעות להעברת הכוח בסופו של דבר אל הגיד והעצם.\u003c/p>\n\u003cp>התא עטוף ב-\u003cstrong>\u003cbdi>Sarcolemma\u003c/bdi>\u003c/strong>, שההתפשטות החשמלית על פניה ובתעלות \u003cstrong>\u003cbdi>T\u003c/bdi>\u003c/strong> מסייעת להפעלת מנגנון הכיווץ. בתוך התא, \u003cstrong>\u003cbdi>Sarcoplasmic Reticulum\u003c/bdi> (\u003cbdi>SR\u003c/bdi>)\u003c/strong> מאחסן סידן ומשחרר אותו בעת הגירוי המתאים. אל תבלבלו בין תעלת \u003cbdi>T\u003c/bdi>, שמעבירה אות חשמלי, לבין \u003cbdi>SR\u003c/bdi>, שמאגר הסידן שלו משתתף בכיווץ. \u003cspan class=\"src-inline\">מצגת שריר, שקפים 4–6; חוברת 75–77\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"75,76,77\" data-slides=\"4,5,6\" data-deck=\"99517\" data-title=\"2. היררכיית המבנה: מן השריר לסרקומר\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B02-11\">\u003ch2 class=\"part\">3. מנגנון הכיווץ כסיפור בן עשרה צעדים\u003c/h2>\n\u003cp>במצגת מפורט הרצף: 1) אות עצבי מגיע אל החיבור בין עצב לשריר. 2) משתחרר \u003cstrong>\u003cbdi>Acetylcholine\u003c/bdi> (\u003cbdi>ACh\u003c/bdi>)\u003c/strong>. 3) הוא נקשר לקולטן בממברנת השריר. 4) שינויים בתנועת יונים יוצרים התקדמות של אות חשמלי על הסרקולמה ובתעלות \u003cbdi>T\u003c/bdi>. 5) משתחרר סידן מ-\u003cbdi>SR\u003c/bdi>. 6) סידן נקשר ל-\u003cstrong>\u003cbdi>Troponin\u003c/bdi>\u003c/strong>. 7) המבנה של קומפלקס \u003cstrong>\u003cbdi>Tropomyosin\u003c/bdi>\u003c/strong> משתנה, ואתרי הקישור על האקטין נחשפים. 8) ראשי מיוזין נקשרים לאקטין ומבצעים \u003cstrong>\u003cbdi>Power Stroke\u003c/bdi>\u003c/strong>. 9) \u003cbdi>ATP\u003c/bdi> נחוץ לניתוק ראש המיוזין ולהמשך המחזור. 10) \u003cbdi>ATP\u003c/bdi> נחוץ גם למשאבות המחזירות סידן למאגרים, וכך מתאפשרת הרפיה.\u003c/p>\n\u003cp>זהו עיקרון חשוב למבחן: סידן אינו ״דוחף״ ישירות את סיבי האקטין; הוא מאפשר את חשיפת אתרי הקישור. גם ההרפיה אינה רק הפסקת הגירוי, משום שהיא דורשת עבודה של משאבות סידן. \u003cspan class=\"src-inline\">מצגת שריר, שקפים 7–8; חוברת 77–78\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"77,78\" data-slides=\"7,8\" data-deck=\"99517\" data-title=\"3. מנגנון הכיווץ כסיפור בן עשרה צעדים\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B02-12\">\u003ch2 class=\"part\">4. תאוריה של החלקת סיבים, ולא התקצרות החלבונים\u003c/h2>\n\u003cp>בעת כיווץ, סיבי האקטין \u003cstrong>מחליקים יחסית לסיבי המיוזין\u003c/strong>, ולכן אורך הסרקומר פוחת. אין צורך שכל מולקולת אקטין או מיוזין עצמה תתקצר. זהו ההסבר המבני העומד מאחורי מנגנון הכיווץ. אפשר לדמיין שני מסרקים שנכנסים זה לתוך זה: האורך הכולל מתקצר כתוצאה מהגדלת החפיפה, לא משום ששיני המסרק נעשות קצרות יותר.\u003c/p>\n\u003cp>שאלה טובה למבחן: ״מתי מתרחש \u003cbdi>Power Stroke\u003c/bdi>?״ לאחר שראש המיוזין נקשר לאקטין ועובר שינוי מבני המושך את הסיב הדק. \u003cspan class=\"src-inline\">מצגת שריר, שקפים 6–8; חוברת 76–77\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"76,77\" data-slides=\"6,7,8\" data-deck=\"99517\" data-title=\"4. תאוריה של החלקת סיבים, ולא התקצרות החלבונים\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B02-13\">\u003ch2 class=\"part\">5. יחידה מוטורית ועיקרון ״הכול או לא כלום״\u003c/h2>\n\u003cp>יחידה מוטורית היא \u003cstrong>נוירון מוטורי אחד וכל סיבי השריר שהוא מעצבב\u003c/strong>. גודל היחידה משתנה לפי תפקיד השריר: יחידות קטנות מאפשרות שליטה עדינה, ויחידות גדולות מאפשרות הפקת כוח רב. בגירוי מעל הסף, סיבי היחידה מגיבים; כדי להגדיל את הכוח בשריר כולו, מגייסים \u003cstrong>יותר יחידות מוטוריות\u003c/strong> ומשנים את קצב הגירוי שלהן. לכן ״הכול או לא כלום״ חל על תגובת היחידה/סיב ברמת הגירוי המתאימה, \u003cstrong>לא\u003c/strong> על כך ששריר שלם מסוגל רק לכוח מלא או לאפס כוח.\u003c/p>\n\u003cp>לפי המצגת, בשרירים שונים יש בין כ-100 ל-3,000 יחידות מוטוריות; מספר סיבי השריר ליחידה תלוי במשימה. \u003cspan class=\"src-inline\">מצגת שריר, שקף 9; חוברת 78–79\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"78,79\" data-slides=\"9\" data-deck=\"99517\" data-title=\"5. יחידה מוטורית ועיקרון ״הכול או לא כלום״\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B02-14\">\u003ch2 class=\"part\">6. סיבי שריר איטיים ומהירים\u003c/h2>\n\u003cp>\u003cstrong>\u003cbdi>Type I\u003c/bdi> / \u003cbdi>Slow Twitch\u003c/bdi> (\u003cbdi>ST\u003c/bdi>)\u003c/strong> מאופיינים בקצב כיווץ איטי יותר, יכולת סבולת גבוהה, יותר מרכיבי חילוף חומרים אירובי ועמידות טובה לעייפות. \u003cstrong>\u003cbdi>Type II\u003c/bdi> / \u003cbdi>Fast Twitch\u003c/bdi> (\u003cbdi>FT\u003c/bdi>)\u003c/strong> מאפשרים בדרך כלל קצב כיווץ גבוה יותר והפקת כוח/הספק גדולים יותר, אך מתעייפים מהר יותר. המצגת מתארת גם סוג ביניים \u003cstrong>\u003cbdi>Type IIa\u003c/bdi>\u003c/strong>, בעל מאפיינים אירוביים ואנאירוביים, וסוג מהיר יותר המכונה בה \u003cstrong>\u003cbdi>IIb\u003c/bdi>\u003c/strong>. זהו סיווג הוראתי של המצגת; במינוח מחקרי עדכני של סיבי אדם נהוג לעיתים \u003cbdi>IIx\u003c/bdi>. לצורך המבחן יש לזהות את המונחים כפי שנלמדו בקורס.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>תכונה\u003c/th>\u003cth>סיב איטי \u003cbdi>Type I\u003c/bdi>\u003c/th>\u003cth>סיב מהיר \u003cbdi>Type II\u003c/bdi>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">מהירות כיווץ\u003c/th>\u003ctd>נמוכה יחסית\u003c/td>\u003ctd>גבוהה יחסית\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">יכולת עמידה בעייפות\u003c/th>\u003ctd>גבוהה\u003c/td>\u003ctd>נמוכה יותר, במיוחד בסוג המהיר מאוד\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">מאפיינים מטבוליים\u003c/th>\u003ctd>שימוש אירובי יעיל\u003c/td>\u003ctd>יכולת אנאירובית גבוהה יותר\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">תפקיד שכיח\u003c/th>\u003ctd>פעילות ממושכת\u003c/td>\u003ctd>פעולות עצימות וקצרות\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cspan class=\"src-inline\">מצגת שריר, שקפים 10–13; חוברת 79–83\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"79,80,81,82,83\" data-slides=\"10,11,12,13\" data-deck=\"99517\" data-title=\"6. סיבי שריר איטיים ומהירים\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B02-15\">\u003ch2 class=\"part\">7. גיוס יחידות מוטוריות ויצירת כוח\u003c/h2>\n\u003cp>התרשים במצגת מתאר גיוס הדרגתי של יחידות לפי עוצמת הפעילות: תחילה יחידות בסף גירוי נמוך, ובהמשך, כשנדרש כוח גדול יותר, יחידות בסף גבוה יותר. אם בתחילת הליכה נדרש כוח קטן, אין צורך לגייס את כל היחידות. בהרמת משקל כבד יותר המערכת מגייסת אוכלוסייה רחבה יותר של יחידות מוטוריות. חשוב להפריד בין \u003cstrong>מספר היחידות המגויסות\u003c/strong> לבין \u003cstrong>קצב הפעלתן\u003c/strong>, ששניהם יכולים להשפיע על הכוח.\u003c/p>\n\u003caside class=\"gnote kind\">\u003cspan class=\"tag\">שאלת הבנה\u003c/span>\u003cdiv>\u003cp>מדוע אימון כוח עשוי לשפר ביצוע עוד לפני שהשריר גדל משמעותית? בזכות שיפור בבקרה עצבית, בתיאום ובגיוס. \u003cspan class=\"src-inline\">מצגת שריר, שקפים 9, 14, 17; חוברת 83–84\u003c/span>\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"83,84\" data-slides=\"9,14,17\" data-deck=\"99517\" data-title=\"7. גיוס יחידות מוטוריות ויצירת כוח\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B02-16\">\u003ch2 class=\"part\">8. הסתגלות לאימוני סבולת\u003c/h2>\n\u003cp>אימוני סבולת מעודדים התאמות שמתאימות לייצור אנרגיה אירובי: עלייה במספר ובגודל מיטוכונדריות, בפעילות אנזימים אירוביים, בצפיפות נימים, בריכוז מיוגלובין וביכולת להשתמש בשומן כדלק. כתוצאה מכך, באותו מאמץ תת-מרבי יכול שריר מאומן לייצר אנרגיה באופן יעיל יותר ולצבור פחות לקטט ביחס למצבו לפני האימון.\u003c/p>\n\u003caside class=\"gnote kind\">\u003cspan class=\"tag\">הבחנה חשובה\u003c/span>\u003cdiv>\u003cp>שיפור סבולת אינו מחייב עלייה גדולה במסת השריר. יכולת מטבולית ויכולת להפיק כוח מרבי הן יכולות קשורות, אך אינן זהות. \u003cspan class=\"src-inline\">מצגת שריר, שקפים 15–16; חוברת 83–84\u003c/span>\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"83,84\" data-slides=\"15,16\" data-deck=\"99517\" data-title=\"8. הסתגלות לאימוני סבולת\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B02-17\">\u003ch2 class=\"part\">9. הסתגלות לאימוני כוח: עצב קודם, מבנה בהמשך\u003c/h2>\n\u003cp>בתחילת אימוני כוח ניתן לראות שיפור בביצוע בעקבות תיאום עצבי וגיוס יעיל יותר של יחידות מוטוריות. בהמשך בולטים גם שינויים מבניים: \u003cstrong>\u003cbdi>Hypertrophy\u003c/bdi>\u003c/strong> היא הגדלה של סיבי שריר קיימים, יחד עם עלייה בכמות החלבונים המתכווצים. המצגת מתארת שינויים גם במאגרי \u003cbdi>ATP/CrP\u003c/bdi>, בגליקוגן ובאנזימים אנאירוביים.\u003c/p>\n\u003cp>\u003cstrong>\u003cbdi>Hyperplasia\u003c/bdi>\u003c/strong> לעומת זאת היא עלייה במספר תאי השריר. המצגת מזכירה אותה בעיקר בהקשר של מחקרי בעלי חיים, בעוד שהיפרטרופיה היא ההסתגלות המרכזית המתוארת באדם. אין להשוות את המונחים כאילו היו שתי מילים נרדפות ל״התחזקות״. \u003cspan class=\"src-inline\">מצגת שריר, שקפים 15, 17; חוברת 83–84\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"83,84\" data-slides=\"15,17\" data-deck=\"99517\" data-title=\"9. הסתגלות לאימוני כוח: עצב קודם, מבנה בהמשך\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B02-18\">\u003ch2 class=\"part\">10. \u003cbdi>DOMS\u003c/bdi>: מדוע הכאב מופיע מאוחר?\u003c/h2>\n\u003cp>\u003cstrong>\u003cbdi>Delayed Onset Muscle Soreness\u003c/bdi> (\u003cbdi>DOMS\u003c/bdi>)\u003c/strong> מופיע לרוב כעבור יום או יומיים לאחר פעילות לא רגילה, במיוחד במאמץ אקסצנטרי. המצגת מתארת פגיעות מיקרוסקופיות בסיבי השריר וברקמות החיבור, תגובה דלקתית, הצטברות נוזלים והפעלת קולטני כאב. כאב זה \u003cstrong>אינו\u003c/strong> מדד הכרחי לכך שהאימון היה יעיל, ואינו נגרם פשוט מ״חומצת חלב שנשארה בשריר״.\u003c/p>\n\u003cp>בתכנון אימון, העלאה הדרגתית של משך ועומס יכולה להפחית הופעת \u003cbdi>DOMS\u003c/bdi> משמעותי. שאלה אופיינית: ״מתאמן סיים סט חדש של ירידה איטית במדרגות ומרגיש כאב יומיים לאחר מכן. איזה סוג מאמץ היה בולט?״ מאמץ אקסצנטרי של שרירים המווסתים את הירידה. \u003cspan class=\"src-inline\">מצגת שריר, שקפים 18–20; חוברת 85–86\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"85,86\" data-slides=\"18,19,20\" data-deck=\"99517\" data-title=\"10. DOMS: מדוע הכאב מופיע מאוחר?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B02-19\">\u003ch2 class=\"part\">11. מערכת העצבים ובקרת התנועה\u003c/h2>\n\u003cp>מערכת העצבים \u003cstrong>המרכזית\u003c/strong> כוללת מוח וחוט שדרה; המערכת \u003cstrong>ההיקפית\u003c/strong> מקשרת בין המרכז לפריפריה. נוירונים \u003cstrong>סנסוריים\u003c/strong> מעבירים מידע מקולטנים אל מערכת העצבים המרכזית, ונוירונים \u003cstrong>מוטוריים\u003c/strong> מעבירים פקודות לשרירים. תחושה על מיקום הגוף ותנועתו נקראת \u003cstrong>\u003cbdi>Proprioception\u003c/bdi>\u003c/strong>. זו אינה זהה לראייה או לשמיעה: היא מגיעה מקולטנים הקשורים לשרירים, לגידים ולמפרקים.\u003c/p>\n\u003cp>במצגת נעשית גם הבחנה בין המערכת הסומטית לבין המערכת האוטונומית, שתת-הענפים שלה כוללים סימפתטית ופאראסימפתטית. \u003cspan class=\"src-inline\">מצגת שריר, שקפים 21–22; חוברת 86\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"86\" data-slides=\"21,22\" data-deck=\"99517\" data-title=\"11. מערכת העצבים ובקרת התנועה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B02-20\">\u003ch2 class=\"part\">12. רפלקס מתיחה לעומת אברון הגיד של גולג'י\u003c/h2>\n\u003cp>\u003cstrong>\u003cbdi>Muscle spindle\u003c/bdi> / כישור השריר\u003c/strong> מגיב לשינוי באורך השריר ובעיקר למתיחה פתאומית, ויכול להפעיל כיווץ רפלקסיבי של השריר שנמתח. זה מסייע ליציבה ולהגנה מפני שינוי פתאומי. \u003cstrong>\u003cbdi>Golgi tendon organ\u003c/bdi> / אברון הגיד של גולג'י\u003c/strong> קשור לחישת מתח באזור החיבור גיד-שריר. החוברת מתארת תגובת עיכוב של אגוניסט ופעילות אנטגוניסט בעקבות מתח גבוה.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>קולט\u003c/th>\u003cth>מה הוא חש?\u003c/th>\u003cth>תגובה המתוארת בקורס\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">כישור השריר\u003c/th>\u003ctd>מתיחה / שינוי אורך\u003c/td>\u003ctd>כיווץ רפלקסיבי של השריר\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">אברון הגיד של גולג'י\u003c/th>\u003ctd>מתח בגיד\u003c/td>\u003ctd>עיכוב רפלקסיבי בתנאים מתאימים\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>במבחן כדאי להתחיל מהשאלה \u003cstrong>איזה גירוי נקלט?\u003c/strong> ולא מהשם הארוך של הקולט. \u003cspan class=\"src-inline\">מצגת שריר, שקפים 23–25; חוברת 87–88\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"87,88\" data-slides=\"23,24,25\" data-deck=\"99517\" data-title=\"12. רפלקס מתיחה לעומת אברון הגיד של גולג'י\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B02-21\">\u003ch2 class=\"part\">חזרה פעילה לפרק\u003c/h2>\n\u003col>\u003cli>\u003cdetails class=\"solve\">\u003csummary>מה הקשר בין \u003cbdi>ACh\u003c/bdi>, תעלות \u003cbdi>T\u003c/bdi>, סידן וטרופונין?\u003c/summary>\u003cp>\u003cbdi>ACh\u003c/bdi> מפעיל אות חשמלי; האות מגיע לעומק התא; \u003cbdi>SR\u003c/bdi> משחרר סידן; סידן נקשר לטרופונין ומאפשר חיבור אקטין-מיוזין.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>למה צריך \u003cbdi>ATP\u003c/bdi> גם בסיום הכיווץ?\u003c/summary>\u003cp>להפרדת ראש המיוזין מהאקטין ולהחזרת סידן למאגרים.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>איך ייתכן שכוח השריר גדל בלי עלייה גדולה במסה?\u003c/summary>\u003cp>שיפור בגיוס ובתיאום יחידות מוטוריות.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>איזה סיב עדיף לפעילות ממושכת בעצימות נמוכה?\u003c/summary>\u003cp>\u003cbdi>Type I\u003c/bdi> / \u003cbdi>ST\u003c/bdi>.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>מה מבדיל בין כישור השריר לגולג'י?\u003c/summary>\u003cp>מתיחה ואורך לעומת מתח בגיד.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>האם \u003cbdi>DOMS\u003c/bdi> הוא תנאי הכרחי לעלייה בכוח?\u003c/summary>\u003cp>לא.\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-slides=\"\" data-deck=\"99517\" data-title=\"חזרה פעילה לפרק\">\u003c/div>\u003c/section>","key":"L-B02","sourcePages":[75,91],"deck":"99517"},{"topicId":"B03","title":"מערכת הנשימה","unit":"יחידה 03 · עמודי מקור 92–103","howTo":"ללמוד לפי סדר היחידות; לאחר כל תת-נושא לפתוח תרגול ולהמשיך רק אחרי הבנה. נוסחאות יש לקרוא עם יחידות מדידה, ולתרשימים יש לתת פירוש מילולי.","sections":[{"id":"s-B03-1","title":"מהם תפקידי מערכת הנשימה?","pages":"92–94","module":false,"slides":[],"pagesList":[92,93,94]},{"id":"s-B03-2","title":"מסלול האוויר","pages":"92–94","module":false,"slides":[],"pagesList":[92,93,94]},{"id":"s-B03-3","title":"שאיפה ונשיפה: קשר בין נפח ללחץ","pages":"95–96","module":false,"slides":[],"pagesList":[95,96]},{"id":"s-B03-4","title":"מדדים ונוסחאות נשימה","pages":"97–98","module":false,"slides":[],"pagesList":[97,98]},{"id":"s-B03-5","title":"מה משתנה במאמץ?","pages":"98–101","module":false,"slides":[],"pagesList":[98,99,100,101]},{"id":"s-B03-6","title":"בדיקת הבנה בעל פה","pages":"","module":false,"slides":[],"pagesList":[]},{"id":"s-B03-7","title":"בלבולים שכדאי להימנע מהם","pages":"","module":false,"slides":[],"pagesList":[]},{"id":"s-B03-8","title":"1. ארבע משימות של מערכת אחת","pages":"","module":true,"slides":[1,2,3],"pagesList":[92,93]},{"id":"s-B03-9","title":"2. מסלול האוויר ותפקיד דרכי ההולכה","pages":"","module":true,"slides":[3,4,5,6],"pagesList":[92,93]},{"id":"s-B03-10","title":"3. מבנה הנאדיות והדיפוזיה","pages":"","module":true,"slides":[5,7,8],"pagesList":[93,94]},{"id":"s-B03-11","title":"4. מנגנון שאיפה ונשיפה: לחץ ונפח","pages":"","module":true,"slides":[3],"pagesList":[95,96]},{"id":"s-B03-12","title":"5. נפח מתחלף, נפח מת ואוורור ריאתי","pages":"","module":true,"slides":[9,10],"pagesList":[96,97]},{"id":"s-B03-13","title":"6. אוורור נאדיתי: החישוב שבוחן הבנה","pages":"","module":true,"slides":[10],"pagesList":[97,98]},{"id":"s-B03-14","title":"7. נפח מת אנטומי לעומת פיזיולוגי","pages":"","module":true,"slides":[10],"pagesList":[97,98]},{"id":"s-B03-15","title":"8. במאמץ: מה גדל ומדוע?","pages":"","module":true,"slides":[11,12],"pagesList":[98,99,100]},{"id":"s-B03-16","title":"9. רזרבה נשימתית ועלות האנרגיה של הנשימה","pages":"","module":true,"slides":[13,14],"pagesList":[99,100]},{"id":"s-B03-17","title":"10. נפחי ריאה וקיבולות","pages":"","module":true,"slides":[16],"pagesList":[101]},{"id":"s-B03-18","title":"11. עישון, חסימה והמאמץ הנשימתי","pages":"","module":true,"slides":[15],"pagesList":[100,101]},{"id":"s-B03-19","title":"חזרה פעילה לפרק","pages":"","module":false,"slides":[],"pagesList":[]}],"html":"\u003cp>האוויר נכנס לריאות, חמצן עובר לדם ופחמן דו-חמצני נפלט. במאמץ יש צורך להגדיל את קצב האוורור ואת חילוף הגזים.\u003c/p>\n\u003csection class=\"lsec \" id=\"s-B03-1\">\u003ch2 class=\"part\">מהם תפקידי מערכת הנשימה? \u003cspan class=\"pchip\">עמ׳ \u003cbdi>92–94\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>הכנסת חמצן\u003c/strong> לסביבה שבה הוא יכול לעבור אל זרם הדם.\u003c/li>\u003cli>\u003cstrong>הוצאת פחמן דו-חמצני\u003c/strong> שנוצר בתהליכים מטבוליים.\u003c/li>\u003cli>\u003cstrong>סיוע בוויסות חומציות הדם\u003c/strong> דרך פינוי \u003cbdi>CO₂\u003c/bdi>.\u003c/li>\u003cli>תפקידי סינון, חימום ולחלוח של האוויר בדרכי הנשימה.\u003c/li>\u003c/ul>\n\u003cdiv class=\"sec-practice\" data-pages=\"92,93,94\" data-slides=\"\" data-deck=\"99518\" data-title=\"מהם תפקידי מערכת הנשימה?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B03-2\">\u003ch2 class=\"part\">מסלול האוויר \u003cspan class=\"pchip\">עמ׳ \u003cbdi>92–94\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cfigure class=\"gfig flow\" aria-label=\"רצף\">\u003col>\u003cli>אף / פה\u003c/li>\u003cli>קנה הנשימה\u003c/li>\u003cli>סמפונות\u003c/li>\u003cli>סמפונונות\u003c/li>\u003cli>נאדיות ריאה\u003c/li>\u003c/ol>\u003c/figure>\n\u003cp>ב\u003cstrong>נאדיות הריאה (\u003cbdi>Alveoli\u003c/bdi>)\u003c/strong> מתרחש חילוף הגזים: חמצן עובר מן האוויר הנאדיתי אל הדם; פחמן דו-חמצני נע בכיוון ההפוך. התהליך מתרחש בדיפוזיה בהתאם להבדלי לחצים חלקיים.\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"92,93,94\" data-slides=\"\" data-deck=\"99518\" data-title=\"מסלול האוויר\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B03-3\">\u003ch2 class=\"part\">שאיפה ונשיפה: קשר בין נפח ללחץ \u003cspan class=\"pchip\">עמ׳ \u003cbdi>95–96\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>שלב\u003c/th>\u003cth>מה קורה בנפח בית החזה?\u003c/th>\u003cth>מה קורה ללחץ בריאות?\u003c/th>\u003cth>כיוון האוויר\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">שאיפה במנוחה\u003c/th>\u003ctd>הנפח גדל\u003c/td>\u003ctd>הלחץ יורד יחסית לאטמוספרה\u003c/td>\u003ctd>אוויר נכנס\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">נשיפה רגילה\u003c/th>\u003ctd>הנפח קטן\u003c/td>\u003ctd>הלחץ עולה יחסית לאטמוספרה\u003c/td>\u003ctd>אוויר יוצא\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">היגיון לזכירה\u003c/span>\u003cdiv>\u003cp>כשהנפח גדל, הלחץ יורד והאוויר נכנס; כשהנפח קטן, הלחץ עולה והאוויר יוצא. זהו העיקרון שממחיש חוק בויל בחוברת.\u003c/p>\u003c/div>\u003c/aside>\n\u003cp>בשאיפה רגילה הסרעפת מתכווצת ויורדת; בשאיפה עמוקה או במאמץ מגויסים גם שרירי עזר. נשיפה רגילה במנוחה היא בעיקרה פסיבית, בעוד נשיפה מאומצת מסתייעת בשרירים נוספים (עמ׳ 96).\u003c/p>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">שתי שאלות לפני שממשיכים\u003c/span>\u003cdiv>\u003cp>\u003cstrong>מתי האוויר נכנס?\u003c/strong> כשהלחץ בריאות יורד מתחת ללחץ האטמוספרי. \u003cstrong>היכן עובר החמצן לדם?\u003c/strong> מדופן נאדיות הריאה אל הנימים.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"95,96\" data-slides=\"\" data-deck=\"99518\" data-title=\"שאיפה ונשיפה: קשר בין נפח ללחץ\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B03-4\">\u003ch2 class=\"part\">מדדים ונוסחאות נשימה \u003cspan class=\"pchip\">עמ׳ \u003cbdi>97–98\u003c/bdi>\u003c/span>\u003c/h2>\n\u003caside class=\"gnote fbox\">\u003cspan class=\"tag\">אוורור ריאתי בדקה (\u003cbdi>Minute Ventilation\u003c/bdi>)\u003c/span>\u003cdiv>\u003cdiv class=\"eqn\" dir=\"ltr\">VE = breathing frequency × tidal volume\u003c/div>\u003c/div>\u003c/aside>\n\u003caside class=\"gnote fbox\">\u003cspan class=\"tag\">אוורור נאדיתי בדקה\u003c/span>\u003cdiv>\u003cdiv class=\"eqn\" dir=\"ltr\">VA = breathing frequency × (tidal volume − dead space)\u003c/div>\u003c/div>\u003c/aside>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">דוגמת החוברת במנוחה\u003c/span>\u003cdiv>\u003cp>12 נשימות לדקה × 0.5 ליטר לנשימה = \u003cstrong>6 ליטר אוויר לדקה\u003c/strong>. אם הנפח המת 150 מ״ל: 12 × (500 − 150) = 4,200 \u003cbdi>mL/min\u003c/bdi>, כלומר \u003cstrong>4.2 ליטר לדקה\u003c/strong> של אוורור נאדיתי.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>מושג\u003c/th>\u003cth>מה הוא אומר?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Tidal Volume\u003c/bdi> / \u003cbdi>TV\u003c/bdi>\u003c/th>\u003ctd>נפח האוויר המתחלף בנשימה רגילה.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Respiratory Rate\u003c/bdi> / \u003cbdi>F\u003c/bdi>\u003c/th>\u003ctd>מספר הנשימות בדקה.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Dead Space\u003c/bdi>\u003c/th>\u003ctd>נפח אוויר שאינו משתתף בחילוף הגזים בנאדיות.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Minute Ventilation\u003c/bdi> / \u003cbdi>VE\u003c/bdi>\u003c/th>\u003ctd>סך נפח האוויר שמתחלף בדקה.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>Alveolar Ventilation\u003c/bdi> / \u003cbdi>VA\u003c/bdi>\u003c/th>\u003ctd>האוויר שמגיע לנאדיות לצורכי חילוף גזים.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-pages=\"97,98\" data-slides=\"\" data-deck=\"99518\" data-title=\"מדדים ונוסחאות נשימה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B03-5\">\u003ch2 class=\"part\">מה משתנה במאמץ? \u003cspan class=\"pchip\">עמ׳ \u003cbdi>98–101\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cul>\u003cli>עולה \u003cstrong>תדירות הנשימה\u003c/strong> (\u003cbdi>F\u003c/bdi>).\u003c/li>\u003cli>עולה \u003cstrong>הנפח המתחלף בכל נשימה\u003c/strong> (\u003cbdi>TV\u003c/bdi>), עד שלב מסוים.\u003c/li>\u003cli>כתוצאה מכך עולה \u003cstrong>האוורור לדקה\u003c/strong> (\u003cbdi>VE\u003c/bdi>).\u003c/li>\u003cli>קצב האוורור גובר עם עליית עצימות המאמץ, ומתאים את פינוי \u003cbdi>CO₂\u003c/bdi> וקליטת \u003cbdi>O₂\u003c/bdi> לצורכי הגוף.\u003c/li>\u003cli>בחוברת מודגש כי המגבלה בפעילות של אדם בריא אינה בהכרח יכולת מכנית של מערכת הנשימה בלבד.\u003c/li>\u003c/ul>\n\u003cdiv class=\"selfcheck\">\u003ch3>בדיקת ידע עצמית\u003c/h3>\u003col>\u003cli>\u003cdetails>\u003csummary>מה ההבדל בין אוורור ריאתי לבין אוורור נאדיתי?\u003c/summary>\u003cp>האוורור הריאתי כולל את כלל האוויר הנכנס והיוצא; האוורור הנאדיתי מחסיר את הנפח המת.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מהו \u003cbdi>VE\u003c/bdi> בנשימה של 15 פעמים בדקה ונפח 0.6 ליטר?\u003c/summary>\u003cp>9 ליטר לדקה.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>למה חשוב לפנות \u003cbdi>CO₂\u003c/bdi>?\u003c/summary>\u003cp>לצמצם את הצטברותו ולסייע בוויסות מאזן החומצה-בסיס.\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-pages=\"98,99,100,101\" data-slides=\"\" data-deck=\"99518\" data-title=\"מה משתנה במאמץ?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B03-6\">\u003ch2 class=\"part\">בדיקת הבנה בעל פה\u003c/h2>\n\u003col>\u003cli>איך מגיע האוויר מן האף עד לנאדיות?\u003c/li>\u003cli>במהלך שאיפה, מה קורה לנפח בית החזה וללחץ בריאות?\u003c/li>\u003cli>היכן מתרחש מעבר החמצן לדם ובאיזה מנגנון?\u003c/li>\u003cli>חשב \u003cbdi>VE\u003c/bdi> עבור 12 נשימות בדקה ו-500 מ״ל לנשימה.\u003c/li>\u003cli>חשב אוורור נאדיתי כשנפח מת הוא 150 מ״ל.\u003c/li>\u003cli>מדוע האוורור עולה בזמן מאמץ?\u003c/li>\u003c/ol>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-slides=\"\" data-deck=\"99518\" data-title=\"בדיקת הבנה בעל פה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B03-7\">\u003ch2 class=\"part\">בלבולים שכדאי להימנע מהם\u003c/h2>\n\u003cul>\u003cli>\u003cbdi>VE\u003c/bdi> כולל את הנפח המת, ואילו \u003cbdi>VA\u003c/bdi> מחסיר אותו.\u003c/li>\u003cli>הסרעפת מתכווצת בשאיפה רגילה; נשיפה רגילה במנוחה היא בעיקרה פסיבית.\u003c/li>\u003cli>להבחין בין נפח אוויר בנשימה אחת לבין נפח בדקה.\u003c/li>\u003c/ul>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-slides=\"\" data-deck=\"99518\" data-title=\"בלבולים שכדאי להימנע מהם\">\u003c/div>\u003c/section>\n\u003ch2 class=\"major\">חלק ב׳, גרסה מורחבת: דוגמאות, הסברים ומצגות\u003c/h2>\n\u003cp>\u003cem>תוספת זו הופקה מהמצגת של אירה שקד ומחוברת הקורס. ההפניות לשקפים מתייחסות לקובץ המצגת של מערכת הנשימה. חומרי הקורס הם המקורות; השאלות והדוגמאות מנוסחות מחדש ללמידה.\u003c/em>\u003c/p>\n\u003ch2 class=\"major\">הרחבה מעמיקה: מערכת הנשימה במנוחה ובמאמץ\u003c/h2>\n\u003cp>הפרק מבוסס על חוברת הקורס, עמודים 92–103, ועל המצגת \u003cstrong>מערכת הנשימה במנוחה ובמאמץ\u003c/strong> של אירה שקד, שקופיות 1–16. המטרה היא להבחין בין הכנסת אוויר לריאות, הגעתו לנאדיות ושחלוף החמצן והפחמן הדו-חמצני.\u003c/p>\n\u003csection class=\"lsec module\" id=\"s-B03-8\">\u003ch2 class=\"part\">1. ארבע משימות ש
