// Each topic gets its blueprint weight; inside a topic, at most one question per conceptId (so one formula never
// fills the exam), with difficulties interleaved. If a topic runs short, the gap is filled from the other topics.
function buildExam(bp) {
  const used = new Set(), concepts = new Set(), wording = new Set(), picked = [];
  const take = (pool, n) => {
    const buckets = ['intermediate', 'advanced', 'basic', 'application'].map(d => shuffle(pool.filter(q => q.difficulty === d)));
    while (n > 0 && buckets.some(b => b.length)) for (const b of buckets) { const q = b.shift(); if (!q || n <= 0) continue; if (used.has(q.id) || concepts.has(q.conceptId) || wording.has(normQ(q.question))) continue; used.add(q.id); concepts.add(q.conceptId); wording.add(normQ(q.question)); picked.push(q); n--; }
    return n;
  };
  let short = 0;
  for (const [t, w] of Object.entries(bp.topicWeights)) short += take(D.mcq.filter(q => q.topicId === t), w);
  if (short) take(D.mcq.filter(q => !used.has(q.id)), short);
  return shuffle(picked).map(q => q.id);
}

const SCHEMATIC = 'גרף סכמטי להמחשת המגמה, לא נתוני מדידה';
function chartSVG(c, W) {
  W = Math.max(300, Math.min(W, 720));
  const H = Math.round(W * (W < 480 ? 0.7 : 0.52));
  const m = { l: 34, r: 16, t: 16, b: 46 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const xs = c.points.map(p => p.x), ys = c.points.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), yMax = Math.max(...ys) * 1.1;
  const X = x => m.l + (x - x0) / ((x1 - x0) || 1) * iw, Y = y => m.t + ih - y / yMax * ih;
  const col = TOPIC[c.topicId].color;
  const grid = [0.25, 0.5, 0.75, 1].map(k => `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih - k * ih}" y2="${m.t + ih - k * ih}" stroke-dasharray="3 4"/>`).join('');
  const d = c.points.map((p, i) => `${i ? 'L' : 'M'}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  const dots = c.points.map(p => `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4" fill="var(--surface)" stroke="${col}" stroke-width="2.5"/>`).join('');
  // axis numbers are deliberately not drawn: the values are illustrative, not measurements
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title)} (${SCHEMATIC})" style="font-size:12.5px">${grid}
    <line class="axis" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${m.t + ih}" stroke-width="1.4"/><line class="axis" x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}" stroke-width="1.4"/>
    <path d="M${m.l + iw - 8},${m.t + ih - 5} l8,5 l-8,5" fill="none" class="axis" stroke-width="1.4"/><path d="M${m.l - 5},${m.t + 8} l5,-8 l5,8" fill="none" class="axis" stroke-width="1.4"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots}
    <text class="axis-title" x="${m.l + iw / 2}" y="${H - 10}" text-anchor="middle">${esc(c.xAxisLabel)}</text>
    <text class="axis-title" transform="translate(14,${m.t + ih / 2}) rotate(-90)" text-anchor="middle">${esc(c.yAxisLabel)}</text></svg>`;
}

function wireDnD() {

  document.querySelectorAll('.def').forEach(el => {

    el.addEventListener('dragleave', () => el.classList.remove('drop'));
    el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('drop'); const t = e.dataTransfer.getData('text/plain'); if (t) assignTerm(t, el.dataset.def); });
  });
  const list = $('#seqList');
  if (list && view.seq && !view.seq.checked) {
    let dragId = null;
    list.querySelectorAll('li[draggable="true"]').forEach(li => {
      li.addEventListener('dragstart', e => { dragId = li.dataset.step; li.classList.add('dragging'); e.dataTransfer.setData('text/plain', dragId); });

    });
  }
}

// ---------- TRUE / FALSE ----------
// The statement is shown as its question and proposed answer; the verdict and explanation appear only after a choice.
const tfLatest = () => { const m = {}; for (const a of S.tfAttempts) m[a.itemId] = a; return m; };
const tfMistakes = tid => Object.values(tfLatest()).filter(a => !a.correct && (!tid || TF[a.itemId]?.topicId === tid)).map(a => a.itemId);
function tfPool(f) {
  let pool = D.trueFalse.filter(t => f.topic === 'all' || t.topicId === f.topic);
  if (f.pool === 'mistakes') { const m = new Set(tfMistakes()); pool = pool.filter(t => m.has(t.id)); }
  if (f.pool === 'unseen') { const seen = tfLatest(); pool = pool.filter(t => !seen[t.id]); }
  return pool;
}

// ---------- actions ----------
const ACT = {
  go: (a, el) => {
    go(el.dataset.route || a.route, a.route ? Object.fromEntries(Object.entries(a).filter(([k]) => k !== 'route')) : a, { noFocus: !!el.dataset.anchor });
    if (el.dataset.anchor) { const t = document.getElementById(el.dataset.anchor); if (t) { t.scrollIntoView({ block: 'start' }); t.setAttribute('tabindex', '-1'); t.focus({ preventScroll: true }); } }
  },
  resume: () => { const lv = S.lastViewed; if (lv.lessonKey) return go('learn', { lesson: lv.lessonKey }); go(lv.route, lv.topicId ? { topic: lv.topicId } : {}); },
  openMore: () => openSheet(`<h2 id="sheetTitle">עוד</h2><div class="menu-grid">${MORE.map(r => `<button data-act="go" data-route="${r}">${icon(ROUTES[r].icon)}${ROUTES[r].label}</button>`).join('')}</div>`),
  closeSheet,
  openLesson: a => go('learn', { lesson: a.key }),
  toggleLesson: a => { const i = S.completedLessons.indexOf(a.key); if (i >= 0) S.completedLessons.splice(i, 1); else S.completedLessons.push(a.key); commit(); render(); toast(i >= 0 ? 'הסימון בוטל' : 'הפרק סומן כנלמד'); },
  mcqPick: a => { const it = view.practice.items[a.i]; if (it.sel !== null) return; it.sel = a.orig; const q = Q[it.id]; S.mcqAttempts.push({ questionId: it.id, selectedIndex: a.orig, correct: a.orig === q.correctIndex, answeredAt: nowISO(), mode: 'practice' }); commit(); render(); },
  toggleMark: a => { const i = S.markedQuestions.indexOf(a.id); if (i >= 0) S.markedQuestions.splice(i, 1); else S.markedQuestions.push(a.id); commit(); render(); toast(i >= 0 ? 'הסימון הוסר' : 'השאלה סומנה לחזרה'); },
  // flashcards
  startCards: () => { const q = buildCardQueue(view.cardForm); if (!q.length) return; view.cards = newCardSession(q, view.cardForm.topic); render(); },
  startCardsQuick: a => {
    view.cardForm = { topic: a.topic || 'all', mode: a.mode || 'due', size: '10', mix: true, type: 'all' }; view.cards = null;
    const q = buildCardQueue(view.cardForm);
    if (q.length) view.cards = newCardSession(q, view.cardForm.topic); else toast('אין כרטיסיות בבחירה הזו כרגע');
    go('cards', a.topic ? { topic: a.topic } : {});
  },
  cardsByIds: a => { view.cards = newCardSession(shuffle(a.ids), 'all'); go('cards'); },
  flipCard: () => { view.cards.flipped = !view.cards.flipped; render(); const b = $('.fc'); if (b) b.focus({ preventScroll: true }); },
  rateCard: a => {
    const cs = view.cards; const id = cs.queue[cs.pos];
    rateCard(id, a.r); cs.tally[a.r]++; cs.seen++;
    if (a.r === 'unknown' && (cs.requeued[id] || 0) < 2) { cs.requeued[id] = (cs.requeued[id] || 0) + 1; cs.queue.splice(Math.min(cs.pos + 4, cs.queue.length), 0, id); }
    commit(); cs.pos++; cs.flipped = false; if (cs.pos >= cs.queue.length) cs.done = true;
    render(); const f = $('.fc'); if (f) f.focus({ preventScroll: true });
  },
  endCards: () => { view.cards.done = true; render(); },
  newCardRound: () => { view.cards = null; render(); },
  // practice
  startPractice: () => { const f = view.practiceForm; const pool = practicePool(f); const n = f.size === 'all' ? pool.length : Math.min(+f.size, pool.length); startPractice(shuffle(pool).slice(0, n).map(q => q.id), f.pool === 'mistakes' ? 'תרגול טעויות' : 'תרגול'); },
  startPracticeQuick: a => {
    view.practiceForm = { topic: a.topic || 'all', diff: 'all', kind: 'all', size: '10', pool: a.pool || 'all', src: 'all' };
    const pool = practicePool(view.practiceForm);
    if (a.topic) S.lastViewed.topicId = a.topic;
    if (!pool.length) { view.practice = null; toast('אין שאלות מתאימות כרגע'); return go('practice'); }
    startPractice(shuffle(pool).slice(0, 10).map(q => q.id), a.pool === 'mistakes' ? 'תרגול טעויות' : 'תרגול');
  },
  retryPractice: a => startPractice(shuffle(a.ids), a.label || 'תרגול חוזר'),
  practiceNav: a => { const ps = view.practice; ps.pos = Math.max(0, Math.min(ps.items.length - 1, ps.pos + a.d)); render(); window.scrollTo({ top: 0 }); },
  endPractice: () => { view.practice.done = true; render(); },
  newPractice: () => { view.practice = null; render(); },
  // exam
  startExamBp: a => {
    const bp = D.blueprints.find(b => b.id === a.id);
    const qids = bp.dynamicSource ? shuffle(mistakeIds()).slice(0, bp.count) : buildExam(bp);
    startExam(qids, bp); go('exam');
  },
  examPick: a => { const ex = S.activeExam; ex.answers[ex.qids[ex.current]] = a.orig; commit(); render(); },
  examNav: a => { const ex = S.activeExam; ex.current = Math.max(0, Math.min(ex.qids.length - 1, ex.current + a.d)); saveLocal(); render(); window.scrollTo({ top: 0 }); },
  examJump: a => { S.activeExam.current = a.i; saveLocal(); render(); window.scrollTo({ top: 0 }); },
  examFlag: () => { const ex = S.activeExam; const id = ex.qids[ex.current]; const i = ex.flagged.indexOf(id); if (i >= 0) ex.flagged.splice(i, 1); else ex.flagged.push(id); commit(); render(); },
  examSubmitAsk: () => {
    const ex = S.activeExam; const un = ex.qids.length - Object.keys(ex.answers).length;
    openSheet(`<h2 id="sheetTitle">לסיים ולהגיש את המבחן?</h2>
      <p>${un ? (un === 1 ? 'שאלה אחת עדיין בלי תשובה ותיחשב כשגויה.' : `<b>${un}</b> שאלות עדיין בלי תשובה ויחשבו כשגויות.`) : 'ענית על כל השאלות.'}${ex.flagged.length ? ` ${ex.flagged.length === 1 ? 'שאלה אחת מסומנת' : ex.flagged.length + ' שאלות מסומנות'} לבדיקה.` : ''}</p>
      <p class="small muted">אחרי ההגשה יוצגו הציון, התשובות הנכונות וההסברים. אי אפשר לשנות תשובות אחרי ההגשה.</p>
      <div class="row"><button class="btn primary" data-act="examSubmit">הגשה</button><button class="btn" data-act="closeSheet">חזרה למבחן</button></div>`, '.btn.primary');
  },
  examSubmit: () => submitExam(false),
  examFilter: a => { view.examFilter = a.f; render(); },
  newExam: () => { view.examResult = null; render(); },
  openExamResult: a => { const r = S.examResults.find(x => x.id === a.id); if (r) { view.examResult = r; view.examFilter = 'all'; go('exam'); } },
  // charts
  openChart: a => { view.chartId = a.id; view.chartQ = {}; go('charts'); requestAnimationFrame(drawCharts); },
  closeChart: () => { view.chartId = null; render(); },
  chartPick: a => { const st = view.chartQ[a.q]; if (st.sel !== null) return; st.sel = a.orig; const q = CQ[a.q]; S.chartAttempts.push({ questionId: q.id, chartId: q.chartId, selectedIndex: a.orig, correct: a.orig === q.correctIndex, answeredAt: nowISO() }); commit(); render(); drawCharts(); },
  chartRetry: a => { view.chartQ[a.q] = { perm: shuffle([0, 1, 2, 3]), sel: null }; render(); drawCharts(); },
  // calculators
  calcTab: a => { view.calcTab = a.t; render(); },
  calcExample: a => { const t = D.tools.find(x => x.id === a.id); view.calcVals[t.id] = { ...t.example.inputs }; render(); document.getElementById('out-' + t.id)?.scrollIntoView({ block: 'nearest' }); },
  calcClear: a => { const t = D.tools.find(x => x.id === a.id); view.calcVals[t.id] = Object.fromEntries(t.inputs.map(i => [i.key, ''])); render(); },
  drillCheck: a => {
    const c = D.calculations.find(x => x.id === a.id); const raw = $('#dr-' + c.id)?.value;
    if (raw === '' || raw === undefined || isNaN(+raw)) { toast('צריך לכתוב מספר'); return; }
    const v = +raw; const tol = Math.max(Math.abs(c.correctValue) * 0.01, c.unit === 'bpm' ? 0.5 : 0.005);
    const correct = Math.abs(v - c.correctValue) <= tol;
    view.drill[c.id] = { value: raw, correct };
    S.calcAttempts.push({ calcId: c.id, value: v, correct, answeredAt: nowISO() }); commit(); render();
  },
  drillRetry: a => { delete view.drill[a.id]; render(); $('#dr-' + a.id)?.focus(); },
  // games
  gameTab: a => { view.gameTab = a.t; render(); },
  openMatch: a => { view.seq = null; newMatch(a.id); go('games'); },
  openSeq: a => { view.match = null; newSeq(a.id); go('games'); },
  closeGame: () => { view.match = null; view.seq = null; render(); },
  pickTerm: a => { const ms = view.match; ms.picked = ms.picked === a.t ? null : a.t; render(); document.querySelector(`.term[data-term="${a.t}"]`)?.focus({ preventScroll: true }); },
  placeTerm: a => { const ms = view.match; if (ms.picked) return assignTerm(ms.picked, a.d); if (ms.assign[a.d]) { delete ms.assign[a.d]; render(); } },
  clearMatch: () => { view.match.assign = {}; view.match.picked = null; render(); },
  checkMatch: () => { const ms = view.match; const g = D.matching.find(x => x.id === ms.id); ms.checked = true; const wrong = g.pairs.filter(p => ms.assign[p.id] !== p.id).map(p => p.id); S.matchingAttempts.push({ gameId: g.id, correctPairs: g.pairs.length - wrong.length, total: g.pairs.length, wrongPairIds: wrong, answeredAt: nowISO() }); commit(); render(); },
  revealMatch: () => openSheet(`<h2 id="sheetTitle">להציג את הפתרון?</h2><p>הניסיון הנוכחי לא ייספר בניקוד.</p><div class="row"><button class="btn primary" data-act="revealMatchYes">הצגת הפתרון</button><button class="btn" data-act="closeSheet">ביטול</button></div>`),
  revealMatchYes: () => { const ms = view.match; ms.revealed = true; closeSheet(); S.matchingAttempts.push({ gameId: ms.id, correctPairs: 0, total: 5, wrongPairIds: [], revealed: true, answeredAt: nowISO() }); commit(); render(); },
  seqMove: a => { const o = view.seq.order, j = a.i + a.d; if (j < 0 || j >= o.length) return; [o[a.i], o[j]] = [o[j], o[a.i]]; render(); document.querySelectorAll('#seqList li')[j]?.querySelector('.mv button:not([disabled])')?.focus({ preventScroll: true }); },
  checkSeq: () => {
    const ss = view.seq; const s = seqItem(ss); ss.checked = true; const sc = seqScore(s, ss.order);
    if (ss.kind === 'process') S.processAttempts.push({ processId: s.id, order: ss.order.slice(), exact: sc.exact, adjacentCorrect: sc.adj, score: sc.score, answeredAt: nowISO() });
    else S.sequenceAttempts.push({ challengeId: s.id, order: ss.order.slice(), exact: sc.exact, adjacentCorrect: sc.adj, score: sc.score, answeredAt: nowISO() });
    commit(); render();
  },
  openProcess: a => { view.match = null; newSeq(a.id, 'process'); view.procMode = view.procMode || 'learn'; view.seq.learnStep = 1; go('process'); },
  closeProcess: () => { view.seq = null; render(); },
  procMode: a => { view.procMode = a.m === 'learn' ? 'learn' : 'order'; render(); },
  procNext: () => { view.seq.learnStep = (view.seq.learnStep || 1) + 1; render(); },
  procRestart: () => { view.seq.learnStep = 1; render(); },
  showSolution: () => { view.seq.solved = true; render(); },
  dailyPractice: () => {
    const seen = latestBy(S.mcqAttempts); const mist = shuffle(mistakeIds()).slice(0, 4);
    const fresh = []; const per = shuffle(TOPICS.map(t => shuffle(D.mcq.filter(q => q.topicId === t.id && !seen[q.id]))));
    for (let i = 0; fresh.length < 10 - mist.length && per.some(p => p[i]); i++) for (const p of per) if (p[i] && fresh.length < 10 - mist.length) fresh.push(p[i].id);
    const rest = 10 - mist.length - fresh.length; const extra = rest > 0 ? shuffle(D.mcq.filter(q => !mist.includes(q.id) && !fresh.includes(q.id))).slice(0, rest).map(q => q.id) : [];
    startPractice(shuffle([...mist, ...fresh, ...extra]), 'התרגול היומי');
  },
  dailyTf: () => { const seen = tfLatest(); const m = shuffle(tfMistakes()).slice(0, 3); const f = shuffle(D.trueFalse.filter(t => !seen[t.id] && !m.includes(t.id))).slice(0, 10 - m.length).map(t => t.id); const ids = [...m, ...f]; if (ids.length < 10) ids.push(...shuffle(D.trueFalse.filter(t => !ids.includes(t.id))).slice(0, 10 - ids.length).map(t => t.id)); ACT.startTf({ ids, label: 'התרגול היומי' }); },
  // true / false
  startTf: a => { const ids = (a.ids || []).filter(id => TF[id]); if (!ids.length) { toast('אין טענות בבחירה הזו'); return; } view.tfs = { items: shuffle(ids).map(id => ({ id, sel: null })), pos: 0, label: a.label || '', done: false }; go('tf'); },
  startTfForm: () => { const f = view.tfForm; const pool = tfPool(f); const n = f.size === 'all' ? pool.length : Math.min(+f.size, pool.length); ACT.startTf({ ids: shuffle(pool).slice(0, n).map(t => t.id), label: f.pool === 'mistakes' ? 'חזרה על טעויות' : 'נכון / לא נכון' }); },
  tfPick: a => { const ts = view.tfs; const it = ts.items[ts.pos]; if (it.sel !== null) return; it.sel = a.v; S.tfAttempts.push({ itemId: it.id, answer: a.v, correct: a.v === TF[it.id].correct, answeredAt: nowISO() }); commit(); render(); },
  tfNav: a => { const ts = view.tfs; ts.pos = Math.max(0, Math.min(ts.items.length - 1, ts.pos + a.d)); render(); window.scrollTo({ top: 0 }); },
  endTf: () => { view.tfs.done = true; render(); },
  newTf: () => { view.tfs = null; render(); },
  // open response
  openOpen: a => { view.openId = a.id; view.openState = {}; go('open'); },
  closeOpen: () => { view.openId = null; view.openState = null; render(); },
  revealOpen: () => { const ta = $('#openDraft'); if (ta) { S.openDrafts[ta.dataset.open] = ta.value; commit(); } view.openState.revealed = true; render(); },
  saveOpen: a => { const o = D.openResponse.find(x => x.id === a.id); const checks = o.rubric.map((_, i) => !!document.getElementById('ob-' + i)?.checked); const ta = $('#openDraft'); if (ta) S.openDrafts[a.id] = ta.value; S.openReviews[a.id] = { checks, at: nowISO() }; view.openState.checks = checks; commit(); render(); toast('ההערכה נשמרה'); },
  // sources and lesson navigation
  srcDeck: a => { view.srcDeck = a.id; go('sources'); },
  srcBack: () => { view.srcDeck = null; render(); },
  openSection: a => { view.jumpTo = a.id; go('learn', { lesson: a.key }); },
  jumpSection: a => { const t = document.getElementById(a.id); if (t) { t.scrollIntoView({ block: 'start' }); window.scrollBy(0, -70); t.setAttribute('tabindex', '-1'); t.focus({ preventScroll: true }); } },
  printPage: () => { try { window.print(); } catch { toast('ההדפסה לא זמינה כאן'); } },
  // cases
  openCase: a => { view.caseId = a.id; view.caseOpen = {}; go('cases'); },
  closeCase: () => { view.caseId = null; view.caseOpen = null; render(); },
  revealCase: () => { const ta = $('#caseDraft'); if (ta) { S.caseDrafts[ta.dataset.case] = ta.value; commit(); } view.caseOpen.revealed = true; render(); },
  saveCase: a => { const checks = [0, 1, 2].map(i => !!document.getElementById('rb-' + i)?.checked); const ta = $('#caseDraft'); if (ta) S.caseDrafts[a.id] = ta.value; S.caseReviews[a.id] = { checks, at: nowISO() }; view.caseOpen.checks = checks; commit(); render(); toast('ההערכה נשמרה'); },
  // quick review
  startReview: () => { const f = view.revForm; view.rev = { ids: shuffle(D.review.filter(x => f.topic === 'all' || x.topicId === f.topic).map(x => x.id)), pos: 0, revealed: false, marks: [], timer: +f.timer, left: null, done: false }; render(); },
  revReveal: () => { stopReviewTimer(); view.rev.revealed = true; render(); },
  revMark: a => { const r = view.rev; S.reviewAttempts.push({ reviewId: r.ids[r.pos], known: a.k, answeredAt: nowISO() }); commit(); r.marks.push(a.k); r.pos++; r.revealed = false; r.left = null; if (r.pos >= r.ids.length) r.done = true; render(); },
  endReview: () => { view.rev.done = true; stopReviewTimer(); render(); },
  newReview: () => { view.rev = null; render(); },
  // listen
  listenSave: a => { const v = ($('#link-' + a.id)?.value || '').trim(); if (!/^https?:\/\/\S+$/i.test(v)) { toast('צריך קישור מלא שמתחיל ב-https://'); return; } S.listenLinks[a.id] = v; view.listenEdit = null; commit(); render(); toast('הקישור נשמר'); },
  listenEdit: a => { view.listenEdit = a.id; render(); $('#link-' + a.id)?.focus(); },
  listenRemove: a => { delete S.listenLinks[a.id]; commit(); render(); },
  // backup
  exportJSON: async () => {
    const json = JSON.stringify(S, null, 1); const name = `ofer-physiology-b-progress-${new Date().toISOString().slice(0, 10)}.json`;
    let dl = null;
    try { dl = window.claude?.use ? await window.claude.use('downloads') : null; } catch { dl = null; }
    if (dl) { try { const r = await dl.save({ filename: name, data: new Blob([json], { type: 'application/json' }) }); if (r && r.status) { toast('קובץ הגיבוי נשמר'); return; } } catch (e) { if (e && (e.code === 'declined' || e.code === 'rate_limited')) return; } }
    if (!window.claude) { const link = document.createElement('a'); link.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); link.download = name; document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(link.href), 2000); toast('קובץ הגיבוי ירד למחשב'); return; }
    $('#backupArea').innerHTML = `<div class="stack"><p class="small" style="margin:0">לא ניתן לשמור קובץ ישירות מכאן. אפשר להעתיק את הטקסט ולשמור אותו בקובץ <span class="mono">${esc(name)}</span>:</p><textarea id="exportBox" readonly aria-label="נתוני הגיבוי">${esc(json)}</textarea><button class="btn small" data-act="copyExport" style="align-self:flex-start">העתקה</button></div>`;
  },
  copyExport: async () => { const box = $('#exportBox'); try { await navigator.clipboard.writeText(box.value); toast('הועתק'); } catch { box.focus(); box.select(); toast('הטקסט מסומן. אפשר להעתיק אותו ידנית'); } },
  importOpen: () => {
    $('#backupArea').innerHTML = `<div class="stack"><label class="field"><span>קובץ גיבוי (JSON)</span><input type="file" id="importFile" accept="application/json,.json"></label><label class="field"><span>או הדבקת תוכן הגיבוי</span><textarea id="importBox" aria-label="תוכן הגיבוי"></textarea></label><button class="btn small" data-act="importCheck" style="align-self:flex-start">בדיקת הגיבוי</button><div id="importMsg" role="status"></div></div>`;
    $('#importFile').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('#importBox').value = r.result; ACT.importCheck(); }; r.readAsText(f); });
  },
  importCheck: () => {
    let s = null; try { s = normalize(JSON.parse($('#importBox').value)); } catch { s = null; }
    const msg = $('#importMsg');
    if (!s) { msg.innerHTML = '<p class="small" style="color:var(--bad);margin:0">זה לא נראה כמו גיבוי של אתר פיזיולוגיה חלק ב׳ (חסר schemaVersion 1, או שזה גיבוי של אתר אחר).</p>'; return; }
    view.pendingImport = s;
    msg.innerHTML = `<div class="panel warmtint"><p style="margin:0">בגיבוי: ${s.mcqAttempts.length} תשובות, ${Object.keys(s.flashcards).length} כרטיסיות מדורגות, ${s.examResults.length} מבחנים${s.updatedAt ? ` · עדכון אחרון ${fmtDateTime(s.updatedAt)}` : ''}.</p><p class="small" style="margin:0">הייבוא יחליף את ההתקדמות הנוכחית.</p><div class="row"><button class="btn primary" data-act="importApply">החלפה בגיבוי</button><button class="btn" data-act="importCancel">ביטול</button></div></div>`;
  },
  importApply: () => { S = view.pendingImport; view.pendingImport = null; for (const k of Object.keys(view)) delete view[k]; commit(); render(); toast('הגיבוי שוחזר'); },
  importCancel: () => { view.pendingImport = null; $('#backupArea').innerHTML = ''; },
  resetAsk: () => openSheet(`<h2 id="sheetTitle">לאפס את כל ההתקדמות?</h2><p>כל התשובות, הדירוגים, המבחנים וההערכות יימחקו${store.remote === 'on' ? ', גם מהשמירה בחשבון' : ''}. מומלץ לייצא גיבוי לפני כן.</p><div class="row"><button class="btn danger" data-act="resetYes">איפוס</button><button class="btn" data-act="closeSheet">ביטול</button></div>`, '.btn:not(.danger)'),
  resetYes: () => { S = blankState(); for (const k of Object.keys(view)) delete view[k]; commit(); closeSheet(); go('home'); toast('ההתקדמות אופסה'); },
};

// Delegated events: clicks carry data-act + JSON data-args; form controls update the current screen's form state.
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault();
  let args = {}; try { args = el.dataset.args ? JSON.parse(el.dataset.args) : {}; } catch { }
  fn(args, el, e);
  if (route === 'charts' && view.chartId) drawCharts();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.actChange === 'listened') { S.listened[el.dataset.ep] = el.checked; commit(); return; }
  if (el.id === 'glossTopic') { view.glossTopic = el.value; $('#glossList').innerHTML = glossListHTML(); return; }
  if (el.dataset.rubric !== undefined) return;
  const form = el.closest('[data-form]'); if (!form) return;
  const fd = new FormData(form); const kind = form.dataset.form;
  if (kind === 'cards') view.cardForm = { topic: fd.get('cardTopic'), mode: fd.get('cardMode'), size: fd.get('cardSize'), mix: fd.get('cardMix') === 'on', type: fd.get('cardType') };
  if (kind === 'practice') view.practiceForm = { topic: fd.get('prTopic'), diff: fd.get('prDiff'), kind: fd.get('prKind'), size: fd.get('prSize'), pool: fd.get('prPool'), src: fd.get('prSrc') };
  if (kind === 'tf') view.tfForm = { topic: fd.get('tfTopic'), size: fd.get('tfSize'), pool: fd.get('tfPool') };
  if (kind === 'review') view.revForm = { topic: fd.get('revTopic'), timer: fd.get('revTimer') };
  const id = el.id || el.name, val = el.value;
  render();
  const again = document.getElementById(id) || document.querySelector(`[name="${el.name}"][value="${CSS.escape(val)}"]`);
  if (again) again.focus({ preventScroll: true });
});
// Typing: glossary search and calculator inputs update in place, so the field keeps focus.
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'glossQ') { view.glossQ = el.value; $('#glossList').innerHTML = glossListHTML(); return; }
  const cf = el.closest('[data-calc]');
  if (cf) {
    const t = D.tools.find(x => x.id === cf.dataset.calc);
    view.calcVals[t.id][el.dataset.key] = el.value === '' ? '' : +el.value;
    const card = cf.closest('.calc'); const tmp = document.createElement('div'); tmp.innerHTML = calcCard(t);
    card.querySelector('.calc-out').replaceWith(tmp.querySelector('.calc-out'));
  }
  if (el.id === 'learnQ') { view.learnQ = el.value; $('#learnHits').innerHTML = learnSearchHTML(); return; }
  if (el.id === 'openDraft') { clearTimeout(ACT._openT); ACT._openT = setTimeout(() => { S.openDrafts[el.dataset.open] = el.value; commit(); }, 800); return; }
  if (el.id === 'caseDraft') { clearTimeout(ACT._caseT); ACT._caseT = setTimeout(() => { S.caseDrafts[el.dataset.case] = el.value; commit(); }, 800); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.closest('[data-listen-form]')) { e.preventDefault(); ACT.listenSave({ id: e.target.closest('[data-listen-form]').dataset.listenForm }); }
  if (e.key === 'Enter' && e.target.closest('[data-drill]')) { e.preventDefault(); ACT.drillCheck({ id: e.target.closest('[data-drill]').dataset.drill }); }
  if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  if (route === 'cards' && view.cards && !view.cards.done && !e.target.closest('input,select,textarea,button,a')) {
    if (e.key === ' ' && !view.cards.flipped) { e.preventDefault(); ACT.flipCard(); }
    else if (view.cards.flipped && ['1', '2', '3'].includes(e.key)) ACT.rateCard({ r: ['unknown', 'almost', 'known'][+e.key - 1] });
  }
});
document.addEventListener('toggle', e => { const k = e.target.dataset?.actToggle; if (k === 'examMap') view.examMapOpen = e.target.open; if (k === 'toc') view.tocOpen = e.target.open; }, true);
window.addEventListener('hashchange', () => { const r = location.hash.slice(1); if (r && r !== route && ROUTES[r]) go(r); });

// ---------- boot ----------
(function boot() {
  const h = location.hash.slice(1);
  route = ROUTES[h] ? h : 'home';
  renderStatus(); render(); initRemote();
})();

</script>
</body></html>
