ל מערכת אחת\u003c/h2>\n\u003cp>מערכת הנשימה מספקת \u003cstrong>\u003cbdi>O₂\u003c/bdi> לדם\u003c/strong>, מפנה \u003cstrong>\u003cbdi>CO₂\u003c/bdi> מהדם\u003c/strong>, תורמת לוויסות חומציות הגוף ומאפשרת \u003cstrong>יצירת קול\u003c/strong>. הסדר סיבתי: אוויר נכנס דרך דרכי הנשימה, מגיע לנאדיות, גזים עוברים בדיפוזיה בין הנאדיות והדם, והדם מוביל את החמצן לרקמות. לא כל אוויר שנכנס לאף משתתף מיד בחילוף גזים; חלקו נשאר בדרכי ההולכה, ולכן צריך להבחין בין נפח אוורור כללי לבין אוורור נאדיתי.\u003c/p>\n\u003caside class=\"gnote kind\">\u003cspan class=\"tag\">שאלת הבנה\u003c/span>\u003cdiv>\u003cp>האם ריצה משפרת ישירות את כמות החמצן שבאוויר החיצון? לא. ריכוז החמצן בסביבה נשאר תלוי בסביבה, אך קצב האוורור והניצול בגוף עשויים להשתנות. \u003cspan class=\"src-inline\">מצגת נשימה, שקפים 1–3; חוברת 92–93\u003c/span>\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"92,93\" data-slides=\"1,2,3\" data-deck=\"99518\" data-title=\"1. ארבע משימות של מערכת אחת\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B03-9\">\u003ch2 class=\"part\">2. מסלול האוויר ותפקיד דרכי ההולכה\u003c/h2>\n\u003cp>האוויר נע דרך האף והלוע אל הגרון, קנה הנשימה, הסמפונות, הסמפונונים ולבסוף אל הנאדיות. בדרכי ההולכה מתבצעים \u003cstrong>סינון, חימום והוספת לחות\u003c/strong>. תאי \u003cbdi>Goblet\u003c/bdi> מפרישים ריר, ו-\u003cstrong>\u003cbdi>Cilia\u003c/bdi>\u003c/strong> מסייעים להזיז ריר וחלקיקים לכיוון שמאפשר סילוקם. זו מערכת הגנה שמתפקדת עוד לפני שמגיעה תגובה חיסונית ספציפית.\u003c/p>\n\u003cp>בנאדיות אין צורך ברירית מוליכה עבה כזו, משום שהמטרה היא יצירת מחסום דק לחילוף גזים. \u003cspan class=\"src-inline\">מצגת נשימה, שקפים 3–6; חוברת 92–93\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"92,93\" data-slides=\"3,4,5,6\" data-deck=\"99518\" data-title=\"2. מסלול האוויר ותפקיד דרכי ההולכה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B03-10\">\u003ch2 class=\"part\">3. מבנה הנאדיות והדיפוזיה\u003c/h2>\n\u003cp>הנאדיות הן שקיקים מיקרוסקופיים בקצות דרכי הנשימה. שטח הפנים הגדול שלהן והמרחק הקצר בין האוויר לדם מאפשרים מעבר גזים. \u003cstrong>דיפוזיה\u003c/strong> היא תנועה נטו במורד מפל הלחץ החלקי של כל גז. לכן חמצן עובר מן האוויר בנאדיות אל הדם, בעוד שפחמן דו-חמצני עובר בדרך כלל מן הדם אל הנאדיות.\u003c/p>\n\u003cp>קצב הדיפוזיה מושפע בין השאר משטח הפנים, עובי המחסום ומפל הלחצים. אם דופן חילוף הגזים מתעבה או שטח הפנים הפעיל פוחת, שחלוף הגזים עשוי להיפגע. אין צורך לחשב חוק פיק במדויק אם המבחן מבקש רק לזהות מה יגביר או יפחית מעבר. \u003cspan class=\"src-inline\">מצגת נשימה, שקפים 5, 7–8; חוברת 93–94\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"93,94\" data-slides=\"5,7,8\" data-deck=\"99518\" data-title=\"3. מבנה הנאדיות והדיפוזיה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B03-11\">\u003ch2 class=\"part\">4. מנגנון שאיפה ונשיפה: לחץ ונפח\u003c/h2>\n\u003cp>ב\u003cstrong>שאיפה רגילה\u003c/strong>, הסרעפת מתכווצת ויורדת; נפח בית החזה גדל, הלחץ בתוך הריאות יורד יחסית לסביבה, ואוויר זורם פנימה. ב\u003cstrong>נשיפה רגילה\u003c/strong>, השרירים נרפים, הכוחות האלסטיים מסייעים להקטין את הנפח, הלחץ עולה מעט, והאוויר זורם החוצה. \u003cstrong>חוק בויל\u003c/strong> מסייע להבין את הקשר ההפוך בין נפח ללחץ בתנאים מתאימים.\u003c/p>\n\u003caside class=\"gnote kind\">\u003cspan class=\"tag\">הבדל חשוב\u003c/span>\u003cdiv>\u003cp>הנשימה הרגילה החוצה היא במידה רבה תהליך פסיבי, אבל נשיפה מאומצת יכולה להסתייע בשרירים פעילים. \u003cspan class=\"src-inline\">חוברת 95–96; מצגת נשימה, שקף 3\u003c/span>\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"95,96\" data-slides=\"3\" data-deck=\"99518\" data-title=\"4. מנגנון שאיפה ונשיפה: לחץ ונפח\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B03-12\">\u003ch2 class=\"part\">5. נפח מתחלף, נפח מת ואוורור ריאתי\u003c/h2>\n\u003cp>\u003cstrong>\u003cbdi>Tidal Volume\u003c/bdi> (\u003cbdi>TV\u003c/bdi>)\u003c/strong> הוא כמות האוויר בשאיפה או נשיפה רגילה. \u003cstrong>\u003cbdi>Respiratory Rate\u003c/bdi> (\u003cbdi>f\u003c/bdi>)\u003c/strong> הוא מספר הנשימות בדקה. לכן \u003cstrong>\u003cbdi>Minute Ventilation\u003c/bdi> (\u003cbdi>VE\u003c/bdi>) = \u003cbdi>f\u003c/bdi> × \u003cbdi>TV\u003c/bdi>\u003c/strong>. בתרגילי הקורס במנוחה נשתמש למשל ב-12 נשימות/דקה וב-500 מ״ל לנשימה: 12 × 500 = 6,000 מ״ל = \u003cstrong>6 ליטר לדקה\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>\u003cbdi>Anatomical Dead Space\u003c/bdi>\u003c/strong> הוא האוויר בדרכי ההולכה שלא מגיע לנאדיות באותה נשימה, כ-150 מ״ל בדוגמת הקורס. הבעיה במבחן אינה רק חישוב: חשוב להבין למה נשימה מהירה ושטחית עלולה להיות פחות יעילה בשחלוף גזים. \u003cspan class=\"src-inline\">מצגת נשימה, שקפים 9–10; חוברת 96–97\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"96,97\" data-slides=\"9,10\" data-deck=\"99518\" data-title=\"5. נפח מתחלף, נפח מת ואוורור ריאתי\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B03-13\">\u003ch2 class=\"part\">6. אוורור נאדיתי: החישוב שבוחן הבנה\u003c/h2>\n\u003cp>\u003cstrong>\u003cbdi>VA\u003c/bdi> = \u003cbdi>f\u003c/bdi> × (\u003cbdi>TV\u003c/bdi> − \u003cbdi>VD\u003c/bdi>)\u003c/strong>, כאשר \u003cbdi>VD\u003c/bdi> הוא נפח מת. בדוגמת הקורס: \u003cbdi>f\u003c/bdi> = 12, \u003cbdi>TV\u003c/bdi> = 500 מ״ל, \u003cbdi>VD\u003c/bdi> = 150 מ״ל. בכל נשימה מגיעים לנאדיות לחילוף גזים 350 מ״ל, ובדקה 12×350 = \u003cstrong>4,200 מ״ל\u003c/strong>, כלומר \u003cstrong>4.2 ליטר לדקה\u003c/strong>.\u003c/p>\n\u003cp>כדאי להשוות שני מצבים עם \u003cbdi>VE\u003c/bdi> זהה: אדם א׳ נושם 12×500 = 6 ליטר לדקה, ו-\u003cbdi>VA\u003c/bdi> שלו 4.2 ליטר לדקה. אדם ב׳ נושם 20×300 = 6 ליטר לדקה, ו-\u003cbdi>VA\u003c/bdi> שלו 20×(300−150) = \u003cstrong>3 ליטר לדקה\u003c/strong>. מכאן: \u003cstrong>אותו אוורור כללי אינו מבטיח אוורור נאדיתי זהה\u003c/strong>. ההשוואה מבוססת על נפח מת קבוע לצורך התרגיל. \u003cspan class=\"src-inline\">מצגת נשימה, שקף 10; חוברת 97–98\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"97,98\" data-slides=\"10\" data-deck=\"99518\" data-title=\"6. אוורור נאדיתי: החישוב שבוחן הבנה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B03-14\">\u003ch2 class=\"part\">7. נפח מת אנטומי לעומת פיזיולוגי\u003c/h2>\n\u003cp>נפח מת \u003cstrong>אנטומי\u003c/strong> הוא האוויר בדרכי ההולכה. נפח מת \u003cstrong>פיזיולוגי\u003c/strong> כולל גם אזורי נאדיות שאינם משתתפים באופן יעיל בשחלוף גזים. בשימוש בהסבר בסיסי למצבי מנוחה בריאים, הערכים עשויים להיות קרובים. בהקשרים של בעיית התאמה בין אוורור לזרימת דם ההבדל חשוב. \u003cem>למבחן יש לזכור את ההגדרות שהמצגת נותנת\u003c/em>, ולא לחשוב שכל האוויר הנשאף מגיע בהכרח לשטח החילוף. \u003cspan class=\"src-inline\">מצגת נשימה, שקף 10; חוברת 97–98\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"97,98\" data-slides=\"10\" data-deck=\"99518\" data-title=\"7. נפח מת אנטומי לעומת פיזיולוגי\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B03-15\">\u003ch2 class=\"part\">8. במאמץ: מה גדל ומדוע?\u003c/h2>\n\u003cp>במאמץ השרירים הפעילים צורכים יותר חמצן ומייצרים יותר פחמן דו-חמצני. הגוף מגביר \u003cstrong>תדירות נשימה\u003c/strong> ו\u003cstrong>נפח מתחלף\u003c/strong>, ולכן \u003cbdi>VE\u003c/bdi> עולה. בתחילת עלייה בעומס ניתן לעיתים להגדיל במידה רבה את עומק הנשימה; במאמץ עצים מאוד גדל גם תפקיד העלאת התדירות. המצגת מציגה שינויי גודל מקורבים שנועדו להבין את הסדרים היחסיים, לא כלל חשבוני קשיח לכל אדם.\u003c/p>\n\u003caside class=\"gnote kind\">\u003cspan class=\"tag\">טעות נפוצה\u003c/span>\u003cdiv>\u003cp>להסיק ששיפור בכושר דורש בהכרח נשימה מהירה יותר בכל מאמץ נתון. דווקא בשיפור יעילות ובדפוס נשימה, במאמץ תת-מרבי דומה ניתן להסתפק בדפוס חסכוני יותר. \u003cspan class=\"src-inline\">מצגת נשימה, שקפים 11–12; חוברת 98–100\u003c/span>\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"98,99,100\" data-slides=\"11,12\" data-deck=\"99518\" data-title=\"8. במאמץ: מה גדל ומדוע?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B03-16\">\u003ch2 class=\"part\">9. רזרבה נשימתית ועלות האנרגיה של הנשימה\u003c/h2>\n\u003cp>\u003cstrong>\u003cbdi>MVV\u003c/bdi>\u003c/strong> הוא אוורור רצוני מרבי, ואילו \u003cstrong>רזרבה נשימתית\u003c/strong> היא הפער בינו לבין האוורור המרבי הנדרש בזמן מאמץ. כאשר נשאר פער משמעותי, מערכת הנשימה בדרך כלל אינה המגבלה היחידה לביצוע. פעולת הנשימה עצמה צורכת אנרגיה: במנוחה חלקה קטן, וככל שעצימות המאמץ עולה, עלות עבודת שרירי הנשימה עולה.\u003c/p>\n\u003cp>כך מתקבלת מערכת שגם מספקת חמצן וגם צורכת אותו לצורך פעולתה. המספרים שבמצגת לגבי חלק צריכת האנרגיה המוקדש לנשימה נועדו להמחשת העיקרון. \u003cspan class=\"src-inline\">מצגת נשימה, שקפים 13–14; חוברת 99–100\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"99,100\" data-slides=\"13,14\" data-deck=\"99518\" data-title=\"9. רזרבה נשימתית ועלות האנרגיה של הנשימה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B03-17\">\u003ch2 class=\"part\">10. נפחי ריאה וקיבולות\u003c/h2>\n\u003cp>המצגת מפרטת \u003cstrong>\u003cbdi>TV\u003c/bdi>\u003c/strong> (נפח מתחלף), \u003cstrong>\u003cbdi>IRV\u003c/bdi>\u003c/strong> (נפח שאיפה רזרבי), \u003cstrong>\u003cbdi>ERV\u003c/bdi>\u003c/strong> (נפח נשיפה רזרבי), \u003cstrong>\u003cbdi>RV\u003c/bdi>\u003c/strong> (נפח שארית), \u003cstrong>\u003cbdi>VC\u003c/bdi>\u003c/strong> (קיבולת חיונית) ו-\u003cstrong>\u003cbdi>TLC\u003c/bdi>\u003c/strong> (קיבולת כוללת). הקיבולת החיונית היא הסכום \u003cbdi>TV\u003c/bdi> + \u003cbdi>IRV\u003c/bdi> + \u003cbdi>ERV\u003c/bdi>. הקיבולת הכוללת מוסיפה גם את נפח השארית. \u003cstrong>\u003cbdi>RV\u003c/bdi> אינו נפלט גם לאחר נשיפה מרבית\u003c/strong>, ולכן הוא אינו חלק מן הקיבולת החיונית.\u003c/p>\n\u003cp>דוגמה: \u003cbdi>TV\u003c/bdi> = 0.5 ליטר, \u003cbdi>IRV\u003c/bdi> = 3.2 ליטר, \u003cbdi>ERV\u003c/bdi> = 1.0 ליטר. \u003cbdi>VC\u003c/bdi> = \u003cstrong>4.7 ליטרים\u003c/strong>. אם \u003cbdi>RV\u003c/bdi> = 1.3 ליטר, \u003cbdi>TLC\u003c/bdi> = \u003cstrong>6.0 ליטרים\u003c/strong>. אלו נתוני תרגיל, לא טווח נורמה אישי. \u003cspan class=\"src-inline\">מצגת נשימה, שקף 16; חוברת 101\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"101\" data-slides=\"16\" data-deck=\"99518\" data-title=\"10. נפחי ריאה וקיבולות\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B03-18\">\u003ch2 class=\"part\">11. עישון, חסימה והמאמץ הנשימתי\u003c/h2>\n\u003cp>במצגת מודגשת השפעת עישון על מעבר חמצן ועל עבודת הנשימה: פחמן חד-חמצני (\u003cbdi>CO\u003c/bdi>) נקשר להמוגלובין ופוגע בזמינותו להובלת חמצן; פגיעה בדרכי האוויר מגדילה את ההתנגדות לזרימה; ושינויים כרוניים עלולים לפגוע בגמישות ובתפקוד הריאתי. חשוב להפריד בין \u003cstrong>\u003cbdi>CO\u003c/bdi>\u003c/strong>, פחמן חד-חמצני, לבין \u003cstrong>\u003cbdi>CO₂\u003c/bdi>\u003c/strong>, פחמן דו-חמצני, ובין שניהם ל-\u003cstrong>\u003cbdi>CO\u003c/bdi>\u003c/strong> כקיצור \u003cbdi>Cardiac Output\u003c/bdi> בחלק הלב. בהקשר השאלה יש להבחין מה מתכוונים.\u003c/p>\n\u003cp>\u003cspan class=\"src-inline\">מצגת נשימה, שקף 15; חוברת 100–101\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"100,101\" data-slides=\"15\" data-deck=\"99518\" data-title=\"11. עישון, חסימה והמאמץ הנשימתי\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B03-19\">\u003ch2 class=\"part\">חזרה פעילה לפרק\u003c/h2>\n\u003col>\u003cli>\u003cdetails class=\"solve\">\u003csummary>מהו \u003cbdi>VE\u003c/bdi> עבור \u003cbdi>TV\u003c/bdi> של 600 מ״ל ותדירות 15 לדקה?\u003c/summary>\u003cp>9 ליטר לדקה.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>מהו \u003cbdi>VA\u003c/bdi> כאשר \u003cbdi>VD\u003c/bdi>=150 מ״ל באותו מצב?\u003c/summary>\u003cp>15×(600−150)=6.75 ליטר לדקה.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>מה קורה ללחץ התוך-ריאתי בשאיפה רגילה?\u003c/summary>\u003cp>קטן יחסית ללחץ האטמוספרי והאוויר נכנס.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>מדוע קיימת תועלת בשאיפה עמוקה יותר לעומת נשימה שטחית באותו \u003cbdi>VE\u003c/bdi>?\u003c/summary>\u003cp>חלק קטן יחסית נשאר בנפח המת, כך שהאוורור הנאדיתי גדל.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>מהו ההבדל בין \u003cbdi>VC\u003c/bdi> ל-\u003cbdi>TLC\u003c/bdi>?\u003c/summary>\u003cp>\u003cbdi>TLC\u003c/bdi> כוללת גם \u003cbdi>RV\u003c/bdi>.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>באיזה מקום מתרחש שחלוף גזים?\u003c/summary>\u003cp>דרך המחסום הדק של הנאדיות והנימים הסמוכים.\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-slides=\"\" data-deck=\"99518\" data-title=\"חזרה פעילה לפרק\">\u003c/div>\u003c/section>","key":"L-B03","sourcePages":[92,103],"deck":"99518"},{"topicId":"B04","title":"המערכת האנדוקרינית","unit":"יחידה 04 · עמודי מקור 104–118","howTo":"ללמוד לפי סדר היחידות; לאחר כל תת-נושא לפתוח תרגול ולהמשיך רק אחרי הבנה. נוסחאות יש לקרוא עם יחידות מדידה, ולתרשימים יש לתת פירוש מילולי.","sections":[{"id":"s-B04-1","title":"עקרונות יסוד","pages":"104–106","module":false,"slides":[],"pagesList":[104,105,106]},{"id":"s-B04-2","title":"מפת בלוטות והורמונים","pages":"104, 107–115","module":false,"slides":[],"pagesList":[104,107,108,109,110,111,112,113,114,115]},{"id":"s-B04-3","title":"אינסולין מול גלוקגון","pages":"111–112","module":false,"slides":[],"pagesList":[111,112]},{"id":"s-B04-4","title":"יותרת הכליה: קליפה מול ליבה","pages":"108–110","module":false,"slides":[],"pagesList":[108,109,110]},{"id":"s-B04-5","title":"היפופיזה: קדמית ואחורית","pages":"113–116","module":false,"slides":[],"pagesList":[113,114,115,116]},{"id":"s-B04-6","title":"שלושה קשרים חשובים שכדאי לשנן","pages":"111–116","module":false,"slides":[],"pagesList":[111,112,113,114,115,116]},{"id":"s-B04-7","title":"בדיקת הבנה בעל פה","pages":"","module":false,"slides":[],"pagesList":[]},{"id":"s-B04-8","title":"בלבולים שכדאי להימנע מהם","pages":"","module":false,"slides":[],"pagesList":[]},{"id":"s-B04-9","title":"1. תקשורת הורמונלית: איתות שנוסע בדם","pages":"","module":true,"slides":[2,3,4,5],"pagesList":[104,105,106]},{"id":"s-B04-10","title":"2. משוב שלילי: הגוף מחזיר ערך לאיזון","pages":"","module":true,"slides":[6,7,41,42],"pagesList":[105,106,115,116]},{"id":"s-B04-11","title":"3. בלוטת התריס: תירוקסין וציר בקרה","pages":"","module":true,"slides":[8,9,10],"pagesList":[107,108]},{"id":"s-B04-12","title":"4. יותרת הכליה: קליפה מול ליבה","pages":"","module":true,"slides":[11,12,17,18,19],"pagesList":[108,109,110]},{"id":"s-B04-13","title":"5. אלדוסטרון ומערכת RAAS","pages":"","module":true,"slides":[13,14],"pagesList":[109]},{"id":"s-B04-14","title":"6. קורטיזול: עקה, אנרגיה ופעילות חיסונית","pages":"","module":true,"slides":[15,16],"pagesList":[109,110]},{"id":"s-B04-15","title":"7. אדרנלין ונוראדרנלין: ״הילחם או ברח״","pages":"","module":true,"slides":[17,18,19],"pagesList":[110]},{"id":"s-B04-16","title":"8. הלבלב: איבר אקסוקריני ואנדוקריני","pages":"","module":true,"slides":[20,21],"pagesList":[111]},{"id":"s-B04-17","title":"9. אינסולין וגלוקגון: זוג של איזון רמת הגלוקוז","pages":"","module":true,"slides":[22,23,24],"pagesList":[111,112]},{"id":"s-B04-18","title":"10. הורמוני המין וציר היפותלמוס-היפופיזה-גונדות","pages":"","module":true,"slides":[25,26,27,28,29],"pagesList":[113]},{"id":"s-B04-19","title":"11. היפופיזה קדמית ואחורית: ההבחנה החשובה","pages":"","module":true,"slides":[30,31,32,33,37,38],"pagesList":[113,114,115,116]},{"id":"s-B04-20","title":"12. GH ו-IGF-1: גדילה והתאוששות","pages":"","module":true,"slides":[34,35],"pagesList":[114,115]},{"id":"s-B04-21","title":"13. פרולקטין, ADH ואוקסיטוצין","pages":"","module":true,"slides":[36,37,38,39,40,41,42],"pagesList":[115,116]},{"id":"s-B04-22","title":"14. השוואה קצרה בין צירי בקרה","pages":"","module":true,"slides":[9,10,15,25,32,33,34,35],"pagesList":[]},{"id":"s-B04-23","title":"חזרה פעילה לפרק","pages":"","module":false,"slides":[],"pagesList":[]}],"html":"\u003cp>מערכת בקרה כימית: בלוטות מפרישות הורמונים לדם, ההורמונים נקשרים לקולטנים ייעודיים ומשנים פעילות של תאי מטרה.\u003c/p>\n\u003csection class=\"lsec \" id=\"s-B04-1\">\u003ch2 class=\"part\">עקרונות יסוד \u003cspan class=\"pchip\">עמ׳ \u003cbdi>104–106\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>בלוטה אנדוקרינית\u003c/strong> מפרישה הורמונים אל הדם; \u003cstrong>בלוטה אקסוקרינית\u003c/strong> מפרישה דרך צינור אל משטח או חלל בגוף.\u003c/li>\u003cli>הורמון יכול להשפיע רק על תאים בעלי \u003cstrong>קולטן מתאים\u003c/strong>.\u003c/li>\u003cli>התגובה תלויה בסוג ההורמון, סוג הקולטן ומצב התא.\u003c/li>\u003cli>\u003cstrong>משוב שלילי\u003c/strong> הוא מנגנון בקרה מרכזי: כאשר רמת הגורם או התוצאה עולה, האות להמשך הייצור קטן.\u003c/li>\u003c/ul>\n\u003cfigure class=\"gfig flow\" aria-label=\"רצף\">\u003col>\u003cli>שינוי במצב הגוף\u003c/li>\u003cli>הפעלת בלוטה\u003c/li>\u003cli>הפרשת הורמון\u003c/li>\u003cli>תגובה בתא מטרה\u003c/li>\u003cli>משוב שלילי\u003c/li>\u003c/ol>\u003c/figure>\n\u003cdiv class=\"sec-practice\" data-pages=\"104,105,106\" data-slides=\"\" data-deck=\"99519\" data-title=\"עקרונות יסוד\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B04-2\">\u003ch2 class=\"part\">מפת בלוטות והורמונים \u003cspan class=\"pchip\">עמ׳ \u003cbdi>104, 107–115\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>בלוטה / מקור\u003c/th>\u003cth>הורמון מרכזי\u003c/th>\u003cth>פעולה עיקרית לפי החוברת\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">בלוטת התריס\u003c/th>\u003ctd>\u003cbdi>T3\u003c/bdi>, \u003cbdi>T4\u003c/bdi> (\u003cbdi>Thyroxine\u003c/bdi>)\u003c/td>\u003ctd>השפעה על קצב חילוף החומרים והפעילות התאית.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">קליפת יותרת הכליה\u003c/th>\u003ctd>\u003cbdi>Aldosterone\u003c/bdi>\u003c/td>\u003ctd>ויסות מלחים ומים, השפעה על נפח הדם ולחץ הדם.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">קליפת יותרת הכליה\u003c/th>\u003ctd>\u003cbdi>Cortisol\u003c/bdi>\u003c/td>\u003ctd>תגובה לעקה, השפעות על זמינות מקורות אנרגיה ועל מטבוליזם.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">ליבת יותרת הכליה\u003c/th>\u003ctd>\u003cbdi>Adrenaline\u003c/bdi> / \u003cbdi>Noradrenaline\u003c/bdi>\u003c/td>\u003ctd>תגובה מהירה של ״הילחם או ברח״.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">לבלב, תאי בטא\u003c/th>\u003ctd>\u003cbdi>Insulin\u003c/bdi>\u003c/td>\u003ctd>מסייע לכניסת גלוקוז לתאים ומפחית רמת סוכר בדם.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">לבלב, תאי אלפא\u003c/th>\u003ctd>\u003cbdi>Glucagon\u003c/bdi>\u003c/td>\u003ctd>מעלה את זמינות הגלוקוז בדם.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">היפופיזה קדמית\u003c/th>\u003ctd>\u003cbdi>GH\u003c/bdi>\u003c/td>\u003ctd>הורמון גדילה; מקושר גם לפעולות דרך \u003cbdi>IGF-1\u003c/bdi>.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">היפופיזה אחורית\u003c/th>\u003ctd>\u003cbdi>ADH\u003c/bdi>\u003c/td>\u003ctd>וויסות החזרת מים בכליות; פחות מים בשתן.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">היפופיזה אחורית\u003c/th>\u003ctd>\u003cbdi>Oxytocin\u003c/bdi>\u003c/td>\u003ctd>מעורב בהתכווצות הרחם ובהפרשת חלב.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">בלוטות המין\u003c/th>\u003ctd>\u003cbdi>Testosterone\u003c/bdi> / \u003cbdi>Estrogen\u003c/bdi>\u003c/td>\u003ctd>מאפייני מין, רבייה והשפעות על רקמות הגוף.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">בדיקת ידע: מהו משוב שלילי?\u003c/span>\u003cdiv>\u003cp>מנגנון שבו התוצאה או השינוי שנוצר גורמים להחלשת האות להמשך הפעילות. לדוגמה, כשהערך שבבקרה חוזר לאיזון, פוחת הצורך בהפרשה נוספת.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"104,107,108,109,110,111,112,113,114,115\" data-slides=\"\" data-deck=\"99519\" data-title=\"מפת בלוטות והורמונים\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B04-3\">\u003ch2 class=\"part\">אינסולין מול גלוקגון \u003cspan class=\"pchip\">עמ׳ \u003cbdi>111–112\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>אינסולין\u003c/th>\u003cth>גלוקגון\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">מופרש כאשר רמת הגלוקוז בדם עולה.\u003c/th>\u003ctd>מופרש כאשר רמת הגלוקוז בדם יורדת.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">מעודד ניצול ואגירה של גלוקוז.\u003c/th>\u003ctd>מעודד גיוס מאגרי גלוקוז.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">תורם לירידה ברמת הגלוקוז בדם.\u003c/th>\u003ctd>תורם לעלייה ברמת הגלוקוז בדם.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">סיפור קצר לזכירה\u003c/span>\u003cdiv>\u003cfigure class=\"gfig flow\" aria-label=\"רצף\">\u003col>\u003cli>אחרי ארוחה: סוכר עולה\u003c/li>\u003cli>אינסולין עולה\u003c/li>\u003cli>התא קולט/אוגר גלוקוז. בעת מחסור בסוכר: גלוקגון מסייע להעלות את זמינותו\u003c/li>\u003c/ol>\u003c/figure>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"111,112\" data-slides=\"\" data-deck=\"99519\" data-title=\"אינסולין מול גלוקגון\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B04-4\">\u003ch2 class=\"part\">יותרת הכליה: קליפה מול ליבה \u003cspan class=\"pchip\">עמ׳ \u003cbdi>108–110\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>קליפה (\u003cbdi>Cortex\u003c/bdi>)\u003c/th>\u003cth>ליבה (\u003cbdi>Medulla\u003c/bdi>)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">מפרישה הורמונים סטרואידיים כגון קורטיזול ואלדוסטרון.\u003c/th>\u003ctd>מפרישה קטכולאמינים, בעיקר אדרנלין ונוראדרנלין.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">ויסות מטבולי, מאזן מלחים ומים והתמודדות עם עקה.\u003c/th>\u003ctd>תגובה מהירה באמצעות מערכת העצבים הסימפתטית.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-pages=\"108,109,110\" data-slides=\"\" data-deck=\"99519\" data-title=\"יותרת הכליה: קליפה מול ליבה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B04-5\">\u003ch2 class=\"part\">היפופיזה: קדמית ואחורית \u003cspan class=\"pchip\">עמ׳ \u003cbdi>113–116\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>היפופיזה קדמית:\u003c/strong> החוברת מפרטת את תפקידי \u003cbdi>GH\u003c/bdi> ואת הקשר בינו לבין \u003cbdi>IGF-1\u003c/bdi> בתהליכי גדילה.\u003c/li>\u003cli>\u003cstrong>היפופיזה אחורית:\u003c/strong> משחררת \u003cbdi>ADH\u003c/bdi> ואוקסיטוצין, שמיוצרים בהיפותלמוס ומועברים לאחסון ולשחרור.\u003c/li>\u003cli>\u003cstrong>\u003cbdi>ADH\u003c/bdi>:\u003c/strong> משמש לוויסות מאזן הנוזלים. כאשר צריך לחסוך מים, ההפרשה מגבירה החזרת מים בכליות.\u003c/li>\u003c/ul>\n\u003cdiv class=\"sec-practice\" data-pages=\"113,114,115,116\" data-slides=\"\" data-deck=\"99519\" data-title=\"היפופיזה: קדמית ואחורית\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B04-6\">\u003ch2 class=\"part\">שלושה קשרים חשובים שכדאי לשנן \u003cspan class=\"pchip\">עמ׳ \u003cbdi>111–116\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>מצב או גירוי\u003c/th>\u003cth>התגובה ההורמונלית\u003c/th>\u003cth>מה התוצאה שמבקשים להשיג?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">ריכוז גלוקוז גבוה בדם\u003c/th>\u003ctd>עלייה בהפרשת אינסולין\u003c/td>\u003ctd>הכנסת גלוקוז לתאים וירידה ברמתו בדם.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">ריכוז גלוקוז נמוך בדם\u003c/th>\u003ctd>עלייה בהפרשת גלוקגון\u003c/td>\u003ctd>הגדלת זמינות הגלוקוז בדם.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">מחסור במים / צורך בשימור נוזלים\u003c/th>\u003ctd>הפרשת \u003cbdi>ADH\u003c/bdi>\u003c/td>\u003ctd>הגדלת ספיגה חוזרת של מים בכליות.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">הפרשת \u003cbdi>GH\u003c/bdi>\u003c/th>\u003ctd>פעולה ישירה וגם באמצעות \u003cbdi>IGF-1\u003c/bdi>\u003c/td>\u003ctd>השפעות על גדילה והתפתחות רקמות.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">מסלול \u003cbdi>GH\u003c/bdi> ו-\u003cbdi>IGF-1\u003c/bdi>\u003c/span>\u003cdiv>\u003cp>\u003cbdi>GH\u003c/bdi> מופרש מן ההיפופיזה הקדמית. החוברת מתארת השפעות גדילה הקשורות גם ל-\u003cbdi>IGF-1\u003c/bdi>, המיוצר בתגובה ל-\u003cbdi>GH\u003c/bdi> (עמ׳ 114–115). אין לבלבל בין שם הבלוטה לשם ההורמון.\u003c/p>\u003c/div>\u003c/aside>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">דוגמה בתנאי מאמץ\u003c/span>\u003cdiv>\u003cp>באיבוד נוזלים עקב הזעה, מנגנוני הבקרה עשויים להגביר את הפרשת \u003cbdi>ADH\u003c/bdi>, וכך הכליות מחזירות יותר מים לגוף (עמ׳ 115–116).\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"selfcheck\">\u003ch3>בדיקת ידע עצמית\u003c/h3>\u003col>\u003cli>\u003cdetails>\u003csummary>מה ההבדל בין בלוטה אנדוקרינית לאקסוקרינית?\u003c/summary>\u003cp>אנדוקרינית מפרישה הורמונים לדם; אקסוקרינית מפרישה דרך צינור.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>אילו תאים בלבלב מפרישים אינסולין?\u003c/summary>\u003cp>תאי בטא.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מה עושה גלוקגון?\u003c/summary>\u003cp>מסייע בהעלאת רמת הגלוקוז בדם.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מה ההבדל בין קליפת יותרת הכליה לליבה?\u003c/summary>\u003cp>הקליפה קשורה להורמונים כגון קורטיזול ואלדוסטרון; הליבה לאדרנלין ונוראדרנלין.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מהי פעולתו המרכזית של \u003cbdi>ADH\u003c/bdi>?\u003c/summary>\u003cp>סיוע בשמירת מים באמצעות הגברת החזרה שלהם בכליות.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>איפה מיוצר \u003cbdi>ADH\u003c/bdi>, ומאיפה הוא משתחרר לדם?\u003c/summary>\u003cp>מיוצר בהיפותלמוס ומשתחרר מההיפופיזה האחורית.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>איזה הורמון מן ההיפופיזה הקדמית קשור ל-\u003cbdi>IGF-1\u003c/bdi>?\u003c/summary>\u003cp>\u003cbdi>GH\u003c/bdi>, הורמון הגדילה.\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-pages=\"111,112,113,114,115,116\" data-slides=\"\" data-deck=\"99519\" data-title=\"שלושה קשרים חשובים שכדאי לשנן\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B04-7\">\u003ch2 class=\"part\">בדיקת הבנה בעל פה\u003c/h2>\n\u003col>\u003cli>כיצד הורמון שמופרש לדם משפיע רק על תאי מטרה מסוימים?\u003c/li>\u003cli>כיצד משוב שלילי שומר על יציבות בגוף?\u003c/li>\u003cli>מה עושה אינסולין כאשר רמת הסוכר בדם עולה? ומה עושה גלוקגון כשהיא יורדת?\u003c/li>\u003cli>אילו הורמונים קשורים לקליפת יותרת הכליה, ואילו לליבה?\u003c/li>\u003cli>מה ההבדל בין \u003cbdi>GH\u003c/bdi> לבין \u003cbdi>IGF-1\u003c/bdi>?\u003c/li>\u003cli>כיצד \u003cbdi>ADH\u003c/bdi> מפחית אובדן נוזלים דרך הכליה?\u003c/li>\u003c/ol>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-slides=\"\" data-deck=\"99519\" data-title=\"בדיקת הבנה בעל פה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B04-8\">\u003ch2 class=\"part\">בלבולים שכדאי להימנע מהם\u003c/h2>\n\u003cul>\u003cli>לא לערבב בין מקור ההורמון לתפקידו: בייחוד תאי בטא/אלפא בלבלב.\u003c/li>\u003cli>להבחין בין קליפה (\u003cbdi>Cortex\u003c/bdi>) לבין ליבה (\u003cbdi>Medulla\u003c/bdi>) ביותרת הכליה.\u003c/li>\u003cli>בהיפופיזה האחורית ההורמונים מיוצרים בהיפותלמוס ומשוחררים מן ההיפופיזה.\u003c/li>\u003c/ul>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-slides=\"\" data-deck=\"99519\" data-title=\"בלבולים שכדאי להימנע מהם\">\u003c/div>\u003c/section>\n\u003ch2 class=\"major\">חלק ב׳, גרסה מורחבת: דוגמאות, הסברים ומצגות\u003c/h2>\n\u003cp>\u003cem>תוספת זו הופקה מהמצגת של אירה שקד ומחוברת הקורס. ההפניות לשקפים מתייחסות לקובץ המצגת של המערכת האנדוקרינית. חומרי הקורס הם המקורות; השאלות והדוגמאות מנוסחות מחדש ללמידה.\u003c/em>\u003c/p>\n\u003ch2 class=\"major\">הרחבה מעמיקה: המערכת ההורמונלית (האנדוקרינית)\u003c/h2>\n\u003cp>החומר מבוסס על חוברת הקורס, עמודים 104–118, ועל מצגת אירה שקד \u003cstrong>המערכת האנדוקרינית\u003c/strong>, שקופיות 1–43. במבחן חשוב לדעת לא רק \u003cstrong>מה עושה כל הורמון\u003c/strong>, אלא גם \u003cstrong>איפה הוא נוצר, מה מעורר הפרשה ואיך נעצרת התגובה\u003c/strong>.\u003c/p>\n\u003csection class=\"lsec module\" id=\"s-B04-9\">\u003ch2 class=\"part\">1. תקשורת הורמונלית: איתות שנוסע בדם\u003c/h2>\n\u003cp>בלוטה \u003cstrong>אנדוקרינית\u003c/strong> מפרישה הורמון לזרם הדם. הורמון מגיע לרקמות רבות, אך רק תאים בעלי \u003cstrong>קולטן מתאים\u003c/strong> יגיבו לו. זהו עיקרון \u003cem>מפתח ומנעול\u003c/em>. הורמון יכול להיות \u003cstrong>סטרואידי\u003c/strong> או \u003cstrong>חלבוני/פפטידי\u003c/strong>, והסוג משפיע על מיקום הקולטן ואופן התגובה. הורמון סטרואידי עשוי להיקשר לקולטנים תוך-תאיים ולשנות ביטוי גנים, בעוד הורמון חלבוני פועל בדרך כלל דרך קולטנים על ממברנת התא ושרשראות איתות.\u003c/p>\n\u003cp>עוצמת התגובה תלויה גם בכמות ההורמון הזמין ובמספר הקולטנים, כך שאותו ריכוז הורמון אינו מבטיח תמיד אותה תגובה בשני תאים. \u003cspan class=\"src-inline\">מצגת הורמונים, שקפים 2–5; חוברת 104–106\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"104,105,106\" data-slides=\"2,3,4,5\" data-deck=\"99519\" data-title=\"1. תקשורת הורמונלית: איתות שנוסע בדם\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B04-10\">\u003ch2 class=\"part\">2. משוב שלילי: הגוף מחזיר ערך לאיזון\u003c/h2>\n\u003cp>\u003cstrong>משוב שלילי\u003c/strong> הוא עיקרון בקרה שבו תגובת הגוף מפחיתה את הגירוי שהחל אותה. לאחר ארוחה רמת הגלוקוז בדם עולה, תאי בטא בלבלב מפרישים אינסולין, והגלוקוז נכנס או נאגר ברקמות. כשהרמה יורדת, נחלש הגירוי להפרשת אינסולין. הסדר שכדאי לזכור הוא: שינוי ← חיישן/בלוטה ← הורמון ← תא מטרה ← תיקון השינוי ← הפחתת הפרשה.\u003c/p>\n\u003cp>\u003cstrong>משוב חיובי\u003c/strong> הוא מצב אחר, שבו התגובה מגבירה את הגירוי, למשל חלק ממעגלי האוקסיטוצין בלידה. לכן המשפט ״כל ההורמונים נשלטים באמצעות משוב שלילי״ אינו מדויק. \u003cspan class=\"src-inline\">מצגת הורמונים, שקפים 6–7, 41–42; חוברת 105–106, 115–116\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"105,106,115,116\" data-slides=\"6,7,41,42\" data-deck=\"99519\" data-title=\"2. משוב שלילי: הגוף מחזיר ערך לאיזון\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B04-11\">\u003ch2 class=\"part\">3. בלוטת התריס: תירוקסין וציר בקרה\u003c/h2>\n\u003cp>בלוטת התריס נמצאת בקדמת הצוואר ומפרישה הורמוני \u003cstrong>\u003cbdi>T3\u003c/bdi> ו-\u003cbdi>T4\u003c/bdi>\u003c/strong>, הקשורים לקצב חילוף החומרים בגוף. המצגת מתארת את ציר הבקרה: \u003cstrong>\u003cbdi>Hypothalamus\u003c/bdi> ← \u003cbdi>TRH\u003c/bdi> ← \u003cbdi>Pituitary\u003c/bdi> (\u003cbdi>anterior\u003c/bdi>) ← \u003cbdi>TSH\u003c/bdi> ← \u003cbdi>Thyroid\u003c/bdi> ← \u003cbdi>T3/T4\u003c/bdi>\u003c/strong>, כאשר הורמוני התריס מפעילים משוב שלילי על מרכיבים קודמים בציר. כך יש להבחין בין \u003cstrong>הורמון המעורר בלוטה\u003c/strong> (\u003cbdi>TSH\u003c/bdi>) לבין \u003cstrong>הורמון שמופרש מהבלוטה עצמה\u003c/strong> (\u003cbdi>T3/T4\u003c/bdi>).\u003c/p>\n\u003cp>התאמת קצב פעילות הגוף למצבי קור, הריון וגובה היא הקשר פיזיולוגי המופיע במצגת. \u003cspan class=\"src-inline\">מצגת הורמונים, שקפים 8–10; חוברת 107–108\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"107,108\" data-slides=\"8,9,10\" data-deck=\"99519\" data-title=\"3. בלוטת התריס: תירוקסין וציר בקרה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B04-12\">\u003ch2 class=\"part\">4. יותרת הכליה: קליפה מול ליבה\u003c/h2>\n\u003cp>ליותרת הכליה שני אזורי הפרשה בעלי תפקידים שונים. \u003cstrong>\u003cbdi>Cortex\u003c/bdi> / קליפה\u003c/strong> מפרישה הורמונים סטרואידיים ובהם אלדוסטרון וקורטיזול. \u003cstrong>\u003cbdi>Medulla\u003c/bdi> / ליבה\u003c/strong> מפרישה בעיקר קטכולאמינים, אדרנלין ונוראדרנלין, הפועלים במהירות יחסית בתגובה לעקה. דרך זכירה: \u003cem>קליפה = ויסות מתמשך של מים, מלחים ומטבוליזם; ליבה = תגובת סטרס מהירה\u003c/em>.\u003c/p>\n\u003cp>אחת משאלות המלכודת היא ״היכן מיוצר קורטיזול?״ תשובה: בקליפה, לא בליבה. ״מה מעלה במהירות דופק ומרחיב סמפונות במצבי \u003cbdi>Fight or Flight\u003c/bdi>?״ בעיקר קטכולאמינים מהליבה, בשילוב מערכת העצבים הסימפתטית. \u003cspan class=\"src-inline\">מצגת הורמונים, שקפים 11–12, 17–19; חוברת 108–110\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"108,109,110\" data-slides=\"11,12,17,18,19\" data-deck=\"99519\" data-title=\"4. יותרת הכליה: קליפה מול ליבה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B04-13\">\u003ch2 class=\"part\">5. אלדוסטרון ומערכת \u003cbdi>RAAS\u003c/bdi>\u003c/h2>\n\u003cp>\u003cstrong>\u003cbdi>Aldosterone\u003c/bdi>\u003c/strong> מסייע לשמר נתרן ומים דרך פעולת הכליות, ומשפיע על נפח הדם ועל לחץ הדם. מצגת הקורס מתארת רצף של \u003cem>ירידה בלחץ הדם או בנפח הדם\u003c/em> ← \u003cem>הפרשת רנין מהכליה\u003c/em> ← \u003cem>הפיכת \u003cbdi>Angiotensinogen\u003c/bdi> ל-\u003cbdi>Angiotensin I\u003c/bdi>\u003c/em> ← \u003cem>\u003cbdi>ACE\u003c/bdi> מסייע ליצירת \u003cbdi>Angiotensin II\u003c/bdi>\u003c/em> ← \u003cem>כיווץ כלי דם וגרייה להפרשת אלדוסטרון\u003c/em> ← \u003cem>שימור נוזלים ועלייה בלחץ הדם\u003c/em>.\u003c/p>\n\u003cp>חשוב לזכור מי מפריש מה: \u003cstrong>רנין\u003c/strong> מן הכליה, \u003cstrong>אלדוסטרון\u003c/strong> מקליפת יותרת הכליה. אלדוסטרון אינו ״שואב דם״ ללב, אלא משפיע על שימור מלחים ומים ובהמשך על נפח הנוזל. \u003cspan class=\"src-inline\">מצגת הורמונים, שקפים 13–14; חוברת 109\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"109\" data-slides=\"13,14\" data-deck=\"99519\" data-title=\"5. אלדוסטרון ומערכת RAAS\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B04-14\">\u003ch2 class=\"part\">6. קורטיזול: עקה, אנרגיה ופעילות חיסונית\u003c/h2>\n\u003cp>\u003cstrong>\u003cbdi>Cortisol\u003c/bdi>\u003c/strong> הוא הורמון סטרואידי מקליפת האדרנל. הוא מסייע בהתמודדות עם סטרס באמצעות גיוס מקורות אנרגיה, קידום תהליכים שמעלים זמינות גלוקוז ושימוש בשומנים. רמות גבוהות וממושכות יכולות להיות קשורות לפירוק רקמות ולדיכוי פעילות חיסונית. ציר הבקרה המרכזי הוא \u003cstrong>\u003cbdi>CRH\u003c/bdi> (היפותלמוס) ← \u003cbdi>ACTH\u003c/bdi> (היפופיזה קדמית) ← \u003cbdi>Cortisol\u003c/bdi> (קליפה)\u003c/strong>, עם משוב שלילי.\u003c/p>\n\u003cp>המצגת מתייחסת גם לקורטיזול באימון עצים ממושך ובאימון יתר, במיוחד למאזן בין התאוששות לעומס. אין להסיק שכל עלייה זמנית בקורטיזול באימון היא בעיה רפואית: זו תגובה פיזיולוגית תלויה הקשר. \u003cspan class=\"src-inline\">מצגת הורמונים, שקפים 15–16; חוברת 109–110\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"109,110\" data-slides=\"15,16\" data-deck=\"99519\" data-title=\"6. קורטיזול: עקה, אנרגיה ופעילות חיסונית\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B04-15\">\u003ch2 class=\"part\">7. אדרנלין ונוראדרנלין: ״הילחם או ברח״\u003c/h2>\n\u003cp>הקטכולאמינים מן \u003cstrong>\u003cbdi>Adrenal medulla\u003c/bdi>\u003c/strong> מזרזים את תגובת הגוף לעקה גופנית או נפשית: עליית קצב לב, שינויים בלחץ הדם ובחלוקת זרימת הדם, הרחבת סמפונות, הגברת זמינות גלוקוז וחומצות שומן והפחתת פעילות עיכול. במצגת מובאת חלוקת הפרשה של כ-80% אדרנלין וכ-20% נוראדרנלין בהקשר של ליבת האדרנל. במאמץ נתון, אצל מאומן יכולה להיות תגובה הורמונלית שונה מזו של לא מאומן.\u003c/p>\n\u003cp>הבדל לזכירה: \u003cstrong>\u003cbdi>Cortisol\u003c/bdi>\u003c/strong> מתואר כגורם לוויסות מטבולי ועקה לאורך זמן, ואילו \u003cstrong>\u003cbdi>Adrenaline\u003c/bdi>\u003c/strong> מתואר כמתווך מהיר של תגובת עקה. \u003cspan class=\"src-inline\">מצגת הורמונים, שקפים 17–19; חוברת 110\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"110\" data-slides=\"17,18,19\" data-deck=\"99519\" data-title=\"7. אדרנלין ונוראדרנלין: ״הילחם או ברח״\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B04-16\">\u003ch2 class=\"part\">8. הלבלב: איבר אקסוקריני ואנדוקריני\u003c/h2>\n\u003cp>הלבלב פועל בשני ערוצים. הפרשה \u003cstrong>אקסוקרינית\u003c/strong> שולחת מיצי עיכול דרך צינורות למערכת העיכול; הפרשה \u003cstrong>אנדוקרינית\u003c/strong> משחררת הורמונים לדם. בתאי \u003cstrong>\u003cbdi>Beta\u003c/bdi>\u003c/strong> מיוצר \u003cstrong>\u003cbdi>Insulin\u003c/bdi>\u003c/strong>; בתאי \u003cstrong>\u003cbdi>Alpha\u003c/bdi>\u003c/strong> מיוצר \u003cstrong>\u003cbdi>Glucagon\u003c/bdi>\u003c/strong>. לכן ״הלבלב מפריש מיצי עיכול״ ו״הלבלב מפריש הורמונים״ הן שתי אמירות נכונות על חלקי תפקוד שונים. \u003cspan class=\"src-inline\">מצגת הורמונים, שקפים 20–21; חוברת 111\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"111\" data-slides=\"20,21\" data-deck=\"99519\" data-title=\"8. הלבלב: איבר אקסוקריני ואנדוקריני\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B04-17\">\u003ch2 class=\"part\">9. אינסולין וגלוקגון: זוג של איזון רמת הגלוקוז\u003c/h2>\n\u003cp>\u003cstrong>\u003cbdi>Insulin\u003c/bdi>\u003c/strong> מופרש כשגלוקוז בדם עולה, מעודד כניסת גלוקוז לתאים ואגירתו כגליקוגן, וכן תהליכי בנייה ואגירה. \u003cstrong>\u003cbdi>Glucagon\u003c/bdi>\u003c/strong> מופרש בעיקר כשרמת הסוכר נמוכה, ומעודד גיוס אנרגיה ומעלה את זמינות הגלוקוז. בעקבות ארוחה, השינוי שמפעיל אינסולין הוא \u003cem>עלייה ברמת הסוכר\u003c/em>; בזמן צום, השינוי המעורר גלוקגון הוא \u003cem>ירידה ברמתו\u003c/em>.\u003c/p>\n\u003cp>הקשר למאמץ: המצגת מתארת ירידה בהפרשת אינסולין בזמן פעילות ויכולת טובה יותר של השריר הפעיל לקלוט גלוקוז, ולכן אין להסיק שמאמץ מחייב דווקא עלייה באינסולין. \u003cspan class=\"src-inline\">מצגת הורמונים, שקפים 22–24; חוברת 111–112\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"111,112\" data-slides=\"22,23,24\" data-deck=\"99519\" data-title=\"9. אינסולין וגלוקגון: זוג של איזון רמת הגלוקוז\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B04-18\">\u003ch2 class=\"part\">10. הורמוני המין וציר היפותלמוס-היפופיזה-גונדות\u003c/h2>\n\u003cp>המצגת מפרטת \u003cstrong>\u003cbdi>GnRH\u003c/bdi> ← \u003cbdi>FSH/LH\u003c/bdi> ← \u003cbdi>Gonads\u003c/bdi>\u003c/strong>. ההיפותלמוס משחרר גורם בקרה, ההיפופיזה הקדמית מפרישה את \u003cstrong>\u003cbdi>FSH\u003c/bdi>\u003c/strong> ו-\u003cstrong>\u003cbdi>LH\u003c/bdi>\u003c/strong>, ובלוטות המין מפרישות הורמוני מין ומשתתפות ביצירת תאי הרבייה. \u003cstrong>\u003cbdi>Testosterone\u003c/bdi>\u003c/strong> הוא אנדרוגן מרכזי; \u003cstrong>\u003cbdi>Estrogen/Progesterone\u003c/bdi>\u003c/strong> הם הורמונים מרכזיים במערכת הרבייה הנשית. הורמוני המין תורמים גם להתפתחות הגוף, לצפיפות העצם ולהשפעות על שריר.\u003c/p>\n\u003cp>במצגת מובאות השפעות של אימון על רמות טסטוסטרון ועל ציר ההורמונים, וכן שינויים לאורך גיל ההתבגרות. לצורך למידה יש להבחין בין \u003cem>הורמון שמגרה בלוטה\u003c/em> לבין \u003cem>ההורמון המופרש מהבלוטה\u003c/em>. \u003cspan class=\"src-inline\">מצגת הורמונים, שקפים 25–29; חוברת 113\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"113\" data-slides=\"25,26,27,28,29\" data-deck=\"99519\" data-title=\"10. הורמוני המין וציר היפותלמוס-היפופיזה-גונדות\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B04-19\">\u003ch2 class=\"part\">11. היפופיזה קדמית ואחורית: ההבחנה החשובה\u003c/h2>\n\u003cp>החלק \u003cstrong>הקדמי\u003c/strong> של ההיפופיזה מייצר ומפריש הורמונים כגון \u003cstrong>\u003cbdi>GH\u003c/bdi>, \u003cbdi>TSH\u003c/bdi>, \u003cbdi>ACTH\u003c/bdi>, \u003cbdi>LH\u003c/bdi>, \u003cbdi>FSH\u003c/bdi>\u003c/strong> בתגובה לאותות בקרה. החלק \u003cstrong>האחורי\u003c/strong> אוגר ומשחרר את \u003cstrong>\u003cbdi>ADH\u003c/bdi>\u003c/strong> ואת \u003cstrong>\u003cbdi>Oxytocin\u003c/bdi>\u003c/strong>, שמיוצרים בנוירונים שבהיפותלמוס. זו אינה רק רשימת הורמונים: היא הבדל במנגנון ההפרשה. אם שואלים ״היכן מיוצר \u003cbdi>ADH\u003c/bdi>?״ התשובה היא \u003cstrong>היפותלמוס\u003c/strong>, ואילו ההיפופיזה האחורית היא אתר אגירה ושחרורו לדם. \u003cspan class=\"src-inline\">מצגת הורמונים, שקפים 30–33, 37–38; חוברת 113–116\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"113,114,115,116\" data-slides=\"30,31,32,33,37,38\" data-deck=\"99519\" data-title=\"11. היפופיזה קדמית ואחורית: ההבחנה החשובה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B04-20\">\u003ch2 class=\"part\">12. \u003cbdi>GH\u003c/bdi> ו-\u003cbdi>IGF-1\u003c/bdi>: גדילה והתאוששות\u003c/h2>\n\u003cp>\u003cstrong>\u003cbdi>Growth Hormone\u003c/bdi> (\u003cbdi>GH\u003c/bdi>)\u003c/strong> מופרש בהיפופיזה הקדמית ומעודד בין השאר יצירת \u003cstrong>\u003cbdi>IGF-1\u003c/bdi>\u003c/strong>, בעיקר בכבד. \u003cbdi>IGF-1\u003c/bdi> מתווך רבות מההשפעות האנאבוליות של \u003cbdi>GH\u003c/bdi>: תהליכי גדילה, יצירת חלבונים והתפתחות רקמות. רמות \u003cbdi>GH\u003c/bdi> מושפעות גם מהשינה ומהמאמץ. המצגת מדגישה את השפעת עומס האימונים, התאוששות ותזונה על גדילה אצל צעירים.\u003c/p>\n\u003caside class=\"gnote kind\">\u003cspan class=\"tag\">שאלת הבנה\u003c/span>\u003cdiv>\u003cp>האם \u003cbdi>GH\u003c/bdi> ו-\u003cbdi>IGF-1\u003c/bdi> זה אותו הורמון? לא: \u003cbdi>GH\u003c/bdi> הוא הורמון מגרה; \u003cbdi>IGF-1\u003c/bdi> הוא גורם גדילה הנוצר בתגובה אליו ומתווך חלק מהשפעותיו. \u003cspan class=\"src-inline\">מצגת הורמונים, שקפים 34–35; חוברת 114–115\u003c/span>\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"114,115\" data-slides=\"34,35\" data-deck=\"99519\" data-title=\"12. GH ו-IGF-1: גדילה והתאוששות\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B04-21\">\u003ch2 class=\"part\">13. פרולקטין, \u003cbdi>ADH\u003c/bdi> ואוקסיטוצין\u003c/h2>\n\u003cp>\u003cstrong>\u003cbdi>Prolactin\u003c/bdi>\u003c/strong> מופרש מההיפופיזה הקדמית וקשור לייצור חלב. \u003cstrong>\u003cbdi>ADH\u003c/bdi>\u003c/strong> נאגר ומשתחרר מההיפופיזה האחורית ומסייע לכליות להחזיר מים לדם וכך להקטין את אובדנם בשתן. כשאוסמולריות הנוזלים עולה בעקבות מחסור במים, זו אחת הסיבות להגברת \u003cbdi>ADH\u003c/bdi>. לאחר שתייה מרובה, כאשר אוסמולריות הדם יורדת, יש בדרך כלל ירידה בהפרשתו.\u003c/p>\n\u003cp>\u003cstrong>\u003cbdi>Oxytocin\u003c/bdi>\u003c/strong> משתחרר גם הוא מההיפופיזה האחורית, אך מבקר תהליכים שונים כגון כיווצי רחם ופליטת חלב. בתהליך הלידה מתוארת דוגמה למשוב חיובי: מתיחה ← שחרור אוקסיטוצין ← כיווץ מוגבר ← מתיחה נוספת, עד לסיום התהליך. \u003cspan class=\"src-inline\">מצגת הורמונים, שקפים 36–42; חוברת 115–116\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"115,116\" data-slides=\"36,37,38,39,40,41,42\" data-deck=\"99519\" data-title=\"13. פרולקטין, ADH ואוקסיטוצין\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B04-22\">\u003ch2 class=\"part\">14. השוואה קצרה בין צירי בקרה\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>ציר\u003c/th>\u003cth>הורמון מההיפותלמוס\u003c/th>\u003cth>מההיפופיזה הקדמית\u003c/th>\u003cth>האיבר המפריש הורמון יעד\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">תריס\u003c/th>\u003ctd>\u003cbdi>TRH\u003c/bdi>\u003c/td>\u003ctd>\u003cbdi>TSH\u003c/bdi>\u003c/td>\u003ctd>תריס: \u003cbdi>T3/T4\u003c/bdi>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">עקה / קורטיזול\u003c/th>\u003ctd>\u003cbdi>CRH\u003c/bdi>\u003c/td>\u003ctd>\u003cbdi>ACTH\u003c/bdi>\u003c/td>\u003ctd>קליפת אדרנל: קורטיזול\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">רבייה\u003c/th>\u003ctd>\u003cbdi>GnRH\u003c/bdi>\u003c/td>\u003ctd>\u003cbdi>LH\u003c/bdi> / \u003cbdi>FSH\u003c/bdi>\u003c/td>\u003ctd>גונדות: הורמוני מין\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">גדילה\u003c/th>\u003ctd>\u003cbdi>GHRH\u003c/bdi> ועוד גורמי בקרה\u003c/td>\u003ctd>\u003cbdi>GH\u003c/bdi>\u003c/td>\u003ctd>הכבד ורקמות: \u003cbdi>IGF-1\u003c/bdi>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>התפקיד של טבלה זו הוא לזהות את \u003cstrong>שלושת השלבים\u003c/strong>. אל תבלבלו בין שם הבלוטה לשם האות שמגיע אליה. \u003cspan class=\"src-inline\">מצגת הורמונים, שקפים 9–10, 15, 25, 32–35\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-slides=\"9,10,15,25,32,33,34,35\" data-deck=\"99519\" data-title=\"14. השוואה קצרה בין צירי בקרה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B04-23\">\u003ch2 class=\"part\">חזרה פעילה לפרק\u003c/h2>\n\u003col>\u003cli>\u003cdetails class=\"solve\">\u003csummary>מה ההבדל בין אינסולין לגלוקגון?\u003c/summary>\u003cp>אינסולין מקדם ירידת גלוקוז בדם ואגירה; גלוקגון מעלה זמינות גלוקוז.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>מה מופרש מקליפת האדרנל, ומהליבה?\u003c/summary>\u003cp>קליפה: למשל קורטיזול ואלדוסטרון. ליבה: אדרנלין ונוראדרנלין.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>איזה איבר מייצר \u003cbdi>ADH\u003c/bdi>, ואיזה איבר משחרר אותו?\u003c/summary>\u003cp>היפותלמוס מייצר; היפופיזה אחורית מאחסנת ומשחררת.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>כיצד ירידה בלחץ הדם יכולה לעורר אלדוסטרון?\u003c/summary>\u003cp>הפעלת \u003cbdi>RAAS\u003c/bdi> דרך רנין ואנגיוטנסין \u003cbdi>II\u003c/bdi>.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>מדוע הורמון אינו משפיע על כל תאי הגוף באותה דרך?\u003c/summary>\u003cp>נדרשים קולטנים מתאימים, וסוג הקולטן ומספרו שונים בין תאים.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>תני דוגמה למשוב חיובי.\u003c/summary>\u003cp>אוקסיטוצין בכיווצי הלידה.\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-slides=\"\" data-deck=\"99519\" data-title=\"חזרה פעילה לפרק\">\u003c/div>\u003c/section>","key":"L-B04","sourcePages":[104,118],"deck":"99519"},{"topicId":"B05","title":"מערכת החיסון","unit":"יחידה 05 · עמודי מקור 119–126","howTo":"ללמוד לפי סדר היחידות; לאחר כל תת-נושא לפתוח תרגול ולהמשיך רק אחרי הבנה. נוסחאות יש לקרוא עם יחידות מדידה, ולתרשימים יש לתת פירוש מילולי.","sections":[{"id":"s-B05-1","title":"מרכיבי המערכת ותפקידה","pages":"119–120","module":false,"slides":[],"pagesList":[119,120]},{"id":"s-B05-2","title":"קווי ההגנה","pages":"119–122","module":false,"slides":[],"pagesList":[119,120,121,122]},{"id":"s-B05-3","title":"תאי הגנה ותהליכים","pages":"120–123","module":false,"slides":[],"pagesList":[120,121,122,123]},{"id":"s-B05-4","title":"מהי דלקת ומהי פגוציטוזה?","pages":"121–124","module":false,"slides":[],"pagesList":[121,122,123,124]},{"id":"s-B05-5","title":"בדיקת הבנה בעל פה","pages":"","module":false,"slides":[],"pagesList":[]},{"id":"s-B05-6","title":"בלבולים שכדאי להימנע מהם","pages":"","module":false,"slides":[],"pagesList":[]},{"id":"s-B05-7","title":"1. שלושה קווי הגנה, ולא שלוש מערכות נפרדות","pages":"","module":true,"slides":[2,3,4,5,6,23],"pagesList":[119,120,121]},{"id":"s-B05-8","title":"2. מחסומים מכניים וכימיים","pages":"","module":true,"slides":[4],"pagesList":[119]},{"id":"s-B05-9","title":"3. חמש אוכלוסיות תאי דם לבנים: מפת תפקידים","pages":"","module":true,"slides":[5,6,7,8,9,10,11,12],"pagesList":[120,121,122]},{"id":"s-B05-10","title":"4. Neutrophils: הראשונים בשטח","pages":"","module":true,"slides":[7,8],"pagesList":[120,121,122]},{"id":"s-B05-11","title":"5. Eosinophils, Basophils ו-Monocytes","pages":"","module":true,"slides":[9,10,11],"pagesList":[120,121]},{"id":"s-B05-12","title":"6. לימפוציטים B ו-T: שתי אסטרטגיות שונות","pages":"","module":true,"slides":[12,13,14,15,16,17,18,19,20],"pagesList":[122,123]},{"id":"s-B05-13","title":"7. אנטיגן, נוגדן ותאי זיכרון","pages":"","module":true,"slides":[13,14,15],"pagesList":[122,123]},{"id":"s-B05-14","title":"8. מערכת המשלים (Complement)","pages":"","module":true,"slides":[16,17],"pagesList":[123]},{"id":"s-B05-15","title":"9. דלקת: תגובה להגנה ולתיקון","pages":"","module":true,"slides":[23,24,25,26],"pagesList":[120,121]},{"id":"s-B05-16","title":"10. איברי חיסון: מח עצם, תימוס, טחול, קשריות","pages":"","module":true,"slides":[27,28,29,30,31,32,33,34,35],"pagesList":[119,120,121,122]},{"id":"s-B05-17","title":"11. קשריות לימפה: מסלול כניסה ויציאה","pages":"","module":true,"slides":[35,36,37,38,39,40],"pagesList":[119,120,121]},{"id":"s-B05-18","title":"12. מערכת הלימפה: גם מערכת החזרת נוזלים","pages":"","module":true,"slides":[41,42,43,44,45,46,47,48,50,51,52,53],"pagesList":[]},{"id":"s-B05-19","title":"13. מה מזיז לימפה בלי משאבה מרכזית?","pages":"","module":true,"slides":[48,49,50,51,52,53],"pagesList":[]},{"id":"s-B05-20","title":"14. הידרוסטטי מול אוסמוטי בהחלפת נוזלים","pages":"","module":true,"slides":[43,44,45,46],"pagesList":[]},{"id":"s-B05-21","title":"15. חיסון ופעילות גופנית: עומס והתאוששות","pages":"","module":true,"slides":[54,55,56],"pagesList":[]},{"id":"s-B05-22","title":"חזרה פעילה לפרק","pages":"","module":false,"slides":[],"pagesList":[]}],"html":"\u003cp>מערכת הגנה המזהה גורמים זרים, מגיבה אליהם ומצמצמת את הסיכון לנזק ברקמות הגוף.\u003c/p>\n\u003csection class=\"lsec \" id=\"s-B05-1\">\u003ch2 class=\"part\">מרכיבי המערכת ותפקידה \u003cspan class=\"pchip\">עמ׳ \u003cbdi>119–120\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cul>\u003cli>החוברת מתארת איברים ורקמות הקשורים להגנה: מח העצם, קשרי לימפה, טחול, תימוס ותאי דם לבנים.\u003c/li>\u003cli>המטרה: זיהוי גורם זר, הפעלת הגנה מקומית או מערכתית וסילוק האיום.\u003c/li>\u003cli>יש תגובות \u003cstrong>לא ספציפיות (מולדות)\u003c/strong> ותגובות \u003cstrong>ספציפיות (נרכשות)\u003c/strong>.\u003c/li>\u003c/ul>\n\u003cdiv class=\"sec-practice\" data-pages=\"119,120\" data-slides=\"\" data-deck=\"99520\" data-title=\"מרכיבי המערכת ותפקידה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B05-2\">\u003ch2 class=\"part\">קווי ההגנה \u003cspan class=\"pchip\">עמ׳ \u003cbdi>119–122\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>קו\u003c/th>\u003cth>דוגמאות\u003c/th>\u003cth>מאפיין מרכזי\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">קו הגנה ראשון\u003c/th>\u003ctd>עור, ריריות, הפרשות וחומרים מגינים\u003c/td>\u003ctd>חסימת כניסת גורמים זרים.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">קו הגנה שני\u003c/th>\u003ctd>תאי בליעה, תגובה דלקתית, גורמים מסיסים בדם\u003c/td>\u003ctd>תגובה לא ספציפית ומהירה יחסית.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">קו הגנה שלישי\u003c/th>\u003ctd>לימפוציטים \u003cbdi>B\u003c/bdi> ו-\u003cbdi>T\u003c/bdi>, נוגדנים וזיכרון חיסוני\u003c/td>\u003ctd>תגובה ממוקדת לגורם מסוים.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-pages=\"119,120,121,122\" data-slides=\"\" data-deck=\"99520\" data-title=\"קווי ההגנה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B05-3\">\u003ch2 class=\"part\">תאי הגנה ותהליכים \u003cspan class=\"pchip\">עמ׳ \u003cbdi>120–123\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>גורם\u003c/th>\u003cth>מה חשוב לזכור?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">נויטרופילים\u003c/th>\u003ctd>משתתפים בתגובה ראשונית ובבליעה של גורמים זרים.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">מקרופאגים\u003c/th>\u003ctd>תאים בולעניים המסייעים בסילוק גורמים זרים ופסולת.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">לימפוציטים \u003cbdi>B\u003c/bdi>\u003c/th>\u003ctd>קשורים לייצור נוגדנים ולזיכרון חיסוני.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">לימפוציטים \u003cbdi>T\u003c/bdi>\u003c/th>\u003ctd>משתתפים בתגובות חיסון תאיות ובהכוונת התגובה.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">נוגדנים\u003c/th>\u003ctd>חלבונים ייחודיים המסוגלים לזהות ולהיקשר לאנטיגנים.\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">מערכת המשלים (\u003cbdi>Complement\u003c/bdi>)\u003c/th>\u003ctd>קבוצת חלבונים המשתתפת בהעצמת התגובה החיסונית ובפגיעה בגורמים זרים.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-pages=\"120,121,122,123\" data-slides=\"\" data-deck=\"99520\" data-title=\"תאי הגנה ותהליכים\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B05-4\">\u003ch2 class=\"part\">מהי דלקת ומהי פגוציטוזה? \u003cspan class=\"pchip\">עמ׳ \u003cbdi>121–124\u003c/bdi>\u003c/span>\u003c/h2>\n\u003cp>\u003cstrong>תגובה דלקתית\u003c/strong> היא חלק ממנגנון ההגנה הלא-ספציפי. לאחר פגיעה או חדירת גורם זר מתרחשים שינויים מקומיים בכלי הדם, ותאי הגנה מגויסים לאזור.\u003c/p>\n\u003cfigure class=\"gfig flow\" aria-label=\"רצף\">\u003col>\u003cli>גורם זר / נזק\u003c/li>\u003cli>אותות הגנה\u003c/li>\u003cli>גיוס תאי דם לבנים\u003c/li>\u003cli>בליעה / סילוק\u003c/li>\u003cli>החלמה\u003c/li>\u003c/ol>\u003c/figure>\n\u003cp>\u003cstrong>פגוציטוזה (\u003cbdi>Phagocytosis\u003c/bdi>)\u003c/strong> היא בליעת גורם זר על ידי תא הגנה ופירוקו. התרשים בחוברת (עמ׳ 122) מציג את הכנסת החומר לתא וחיבורו למנגנוני פירוק תוך-תאיים.\u003c/p>\n\u003caside class=\"gnote \">\u003cspan class=\"tag\">ההבחנה החשובה למבחן\u003c/span>\u003cdiv>\u003cp>\u003cstrong>הגנה לא-ספציפית:\u003c/strong> מגיבה בדרכים דומות למגוון גורמים. \u003cstrong>הגנה ספציפית:\u003c/strong> מזהה אנטיגנים מסוימים וכוללת תאים ומנגנוני זיכרון.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"selfcheck\">\u003ch3>בדיקת ידע עצמית\u003c/h3>\u003col>\u003cli>\u003cdetails>\u003csummary>מה תפקיד העור בקו ההגנה הראשון?\u003c/summary>\u003cp>מחסום פיזי שמפחית חדירת גורמים זרים.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מהי פגוציטוזה?\u003c/summary>\u003cp>תהליך שבו תא הגנה בולע ומפרק חומר או גורם זר.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>אילו תאים קשורים לייצור נוגדנים?\u003c/summary>\u003cp>לימפוציטים \u003cbdi>B\u003c/bdi> לאחר התמיינות לתאי פלזמה.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>במה מתאפיין קו ההגנה השלישי?\u003c/summary>\u003cp>תגובה ייחודית לאנטיגן, בעזרת לימפוציטים וזיכרון חיסוני.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails>\u003csummary>מהי מערכת המשלים?\u003c/summary>\u003cp>חלבונים המסייעים בהגנה ובפעילות התגובה החיסונית.\u003c/p>\u003c/details>\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"sec-practice\" data-pages=\"121,122,123,124\" data-slides=\"\" data-deck=\"99520\" data-title=\"מהי דלקת ומהי פגוציטוזה?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B05-5\">\u003ch2 class=\"part\">בדיקת הבנה בעל פה\u003c/h2>\n\u003col>\u003cli>איזה מחסום מגן בקו ההגנה הראשון?\u003c/li>\u003cli>מהו תפקיד הנויטרופילים והמקרופאגים?\u003c/li>\u003cli>מהם ההבדלים בין ההגנה הלא-ספציפית לספציפית?\u003c/li>\u003cli>מה קורה בתהליך פגוציטוזה?\u003c/li>\u003cli>מי קשור לייצור נוגדנים ומה תפקידם?\u003c/li>\u003cli>מהי מערכת המשלים ואיך היא מסייעת להגנה?\u003c/li>\u003c/ol>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-slides=\"\" data-deck=\"99520\" data-title=\"בדיקת הבנה בעל פה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B05-6\">\u003ch2 class=\"part\">בלבולים שכדאי להימנע מהם\u003c/h2>\n\u003cul>\u003cli>לימפוציטים \u003cbdi>B\u003c/bdi> ו-\u003cbdi>T\u003c/bdi> אינם בעלי אותו תפקיד.\u003c/li>\u003cli>קו ההגנה השני אינו זהה לקו השלישי; האחרון כולל זיהוי ייחודי וזיכרון.\u003c/li>\u003cli>פגוציטוזה היא בליעה ופירוק של גורם זר, לא יצירת נוגדן.\u003c/li>\u003c/ul>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-slides=\"\" data-deck=\"99520\" data-title=\"בלבולים שכדאי להימנע מהם\">\u003c/div>\u003c/section>\n\u003ch2 class=\"major\">חלק ב׳, גרסה מורחבת: דוגמאות, הסברים ומצגות\u003c/h2>\n\u003cp>\u003cem>תוספת זו הופקה מהמצגת של אירה שקד ומחוברת הקורס. ההפניות לשקפים מתייחסות לקובץ המצגת של מערכת החיסון והלימפה. חומרי הקורס הם המקורות; השאלות והדוגמאות מנוסחות מחדש ללמידה.\u003c/em>\u003c/p>\n\u003ch2 class=\"major\">הרחבה מעמיקה: מערכת החיסון ומערכת הלימפה\u003c/h2>\n\u003cp>מבוסס על חוברת הקורס, עמודים 119–126, ועל מצגת אירה שקד \u003cstrong>מערכת החיסון\u003c/strong>, שקופיות 1–56. המצגת מרחיבה משמעותית את החוברת, בפרט בתאי הדם הלבנים, איברי הלימפה, ויסות נוזלים והקשר למאמץ. חלק מן ההבחנות והערכים המופיעים במצגת הם סכמות הוראה; נלמד אותם כמינוח המקור.\u003c/p>\n\u003csection class=\"lsec module\" id=\"s-B05-7\">\u003ch2 class=\"part\">1. שלושה קווי הגנה, ולא שלוש מערכות נפרדות\u003c/h2>\n\u003cp>קו ההגנה \u003cstrong>הראשון\u003c/strong> הוא המחסום: עור שלם, ריריות, חומציות, דמעות, רוק וריר הלוכד פתוגנים. הקו \u003cstrong>השני\u003c/strong> הוא תגובה מולדת בלתי-ספציפית, ובה תאים בולעניים, תהליך דלקתי ומנגנוני הגנה שמגיבים במהירות. הקו \u003cstrong>השלישי\u003c/strong> הוא התגובה הנרכשת, הנשענת על לימפוציטים ותהליכים ממוקדים באנטיגן, כולל יצירת זיכרון חיסוני.\u003c/p>\n\u003cp>קו ראשון מונע כניסה; קו שני מגיב לפגיעה או לפולש שכבר חדר; קו שלישי מבצע תגובה ייחודית ומפתח זיכרון. שלושתם קשורים זה לזה: תאי ההגנה המולדת מסייעים גם להפעיל תגובות נרכשות. \u003cspan class=\"src-inline\">מצגת חיסון, שקפים 2–6, 23; חוברת 119–121\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"119,120,121\" data-slides=\"2,3,4,5,6,23\" data-deck=\"99520\" data-title=\"1. שלושה קווי הגנה, ולא שלוש מערכות נפרדות\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B05-8\">\u003ch2 class=\"part\">2. מחסומים מכניים וכימיים\u003c/h2>\n\u003cp>העור הוא \u003cstrong>מחסום מכני רציף\u003c/strong>, אך הגוף חשוף לסביבה גם בדרכי נשימה, עיכול, שתן ומין. שם הריריות, הפרשות ורכיבים כימיים מסייעים להגנה. ריר יכול \u003cstrong>ללכוד\u003c/strong> חלקיקים, תנועת הריסונים במערכת הנשימה יכולה \u003cstrong>לפנות\u003c/strong> אותם, ואנזימים וחומציות יכולים \u003cstrong>להקשות\u003c/strong> על גורמים זרים להתבסס. המצגת מזכירה בין ההפרשות סבום, זיעה, דמעות ורוק.\u003c/p>\n\u003caside class=\"gnote kind\">\u003cspan class=\"tag\">דוגמה\u003c/span>\u003cdiv>\u003cp>שיעול ועיטוש אינם תחליף לפעולת תאי \u003cbdi>B\u003c/bdi> או \u003cbdi>T\u003c/bdi>. הם תנועות פינוי מכניות שעשויות לסייע להגנה הראשונית. \u003cspan class=\"src-inline\">מצגת חיסון, שקף 4; חוברת 119\u003c/span>\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"119\" data-slides=\"4\" data-deck=\"99520\" data-title=\"2. מחסומים מכניים וכימיים\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B05-9\">\u003ch2 class=\"part\">3. חמש אוכלוסיות תאי דם לבנים: מפת תפקידים\u003c/h2>\n\u003cp>המצגת מונה \u003cstrong>\u003cbdi>Neutrophils\u003c/bdi>, \u003cbdi>Eosinophils\u003c/bdi>, \u003cbdi>Basophils\u003c/bdi>, \u003cbdi>Monocytes\u003c/bdi>, \u003cbdi>Lymphocytes\u003c/bdi>\u003c/strong>. רבים מהם נוצרים ממקורות במח העצם. חשוב לא לזהות את כל התאים הלבנים כ״תאים שבולעים חיידקים״: נויטרופילים ומקרופאגים הם בולעניים חשובים; אאוזינופילים קשורים במיוחד להתמודדות עם טפילים ולתגובות אלרגיות; בזופילים משחררים מתווכים לתגובה דלקתית ואלרגית; ולימפוציטים מסייעים לתגובה נרכשת.\u003c/p>\n\u003cp>המספרים היחסיים במצגת הם אומדני לימוד ועשויים להשתנות בין אנשים, גילאים ומצבים. \u003cstrong>אל תתבלבלי בין אחוז באוכלוסיית תאי הדם הלבנים לבין חלק מכלל נפח הדם\u003c/strong>. \u003cspan class=\"src-inline\">מצגת חיסון, שקפים 5–12; חוברת 120–122\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"120,121,122\" data-slides=\"5,6,7,8,9,10,11,12\" data-deck=\"99520\" data-title=\"3. חמש אוכלוסיות תאי דם לבנים: מפת תפקידים\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B05-10\">\u003ch2 class=\"part\">4. \u003cbdi>Neutrophils\u003c/bdi>: הראשונים בשטח\u003c/h2>\n\u003cp>\u003cstrong>נויטרופילים\u003c/strong> הם תאים בולעניים חשובים בתגובה המהירה לזיהום, במיוחד בהקשר חיידקי. המצגת מתארת הגעתם לאזור שנפגע בעקבות אותות כימיים, בליעת הפולש ופעולת אנזימים תוך-תאיים בליזוזומים. תהליך \u003cstrong>\u003cbdi>Phagocytosis\u003c/bdi>\u003c/strong> מתרחש בשלבים: זיהוי / היצמדות ← בליעה ← יצירת חלל פנימי ← איחוי עם ליזוזום ← פירוק.\u003c/p>\n\u003caside class=\"gnote kind\">\u003cspan class=\"tag\">שאלה\u003c/span>\u003cdiv>\u003cp>האם תא שבלע חיידק בהכרח מכיל נוגדן ייחודי לאותו חיידק? לא. פגוציטוזה היא מנגנון תאי, והפעילות של נוגדנים היא מנגנון אחר שעשוי להקל עליו. \u003cspan class=\"src-inline\">מצגת חיסון, שקפים 7–8; חוברת 120–122\u003c/span>\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"120,121,122\" data-slides=\"7,8\" data-deck=\"99520\" data-title=\"4. Neutrophils: הראשונים בשטח\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B05-11\">\u003ch2 class=\"part\">5. \u003cbdi>Eosinophils\u003c/bdi>, \u003cbdi>Basophils\u003c/bdi> ו-\u003cbdi>Monocytes\u003c/bdi>\u003c/h2>\n\u003cp>\u003cstrong>\u003cbdi>Eosinophils\u003c/bdi>\u003c/strong> קשורים במיוחד למאבק בטפילים ולתגובות אלרגיה. \u003cstrong>\u003cbdi>Basophils\u003c/bdi>\u003c/strong> נושאים גרנולות עם חומרים כגון היסטמין, המשפיע על כלי דם, חדירות ונוכחות תאי הגנה. \u003cstrong>\u003cbdi>Monocytes\u003c/bdi>\u003c/strong> נעים בדם, וברקמות יכולים להתמיין ל-\u003cstrong>\u003cbdi>Macrophages\u003c/bdi>\u003c/strong>, תאים בולעניים גדולים המשתתפים בפינוי פסולת ובתיאום פעילות חיסונית.\u003c/p>\n\u003cp>חשוב להפריד בין \u003cstrong>גרנולה\u003c/strong> בתוך התא, \u003cstrong>ליזוזום\u003c/strong> שעשוי להכיל אנזימי פירוק, לבין \u003cstrong>אנטיגן\u003c/strong> על גורם זר. השמות מתארים מבנים ותפקידים שונים. \u003cspan class=\"src-inline\">מצגת חיסון, שקפים 9–11; חוברת 120–121\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"120,121\" data-slides=\"9,10,11\" data-deck=\"99520\" data-title=\"5. Eosinophils, Basophils ו-Monocytes\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B05-12\">\u003ch2 class=\"part\">6. לימפוציטים \u003cbdi>B\u003c/bdi> ו-\u003cbdi>T\u003c/bdi>: שתי אסטרטגיות שונות\u003c/h2>\n\u003cp>\u003cstrong>\u003cbdi>B cells\u003c/bdi>\u003c/strong> מתמיינים לתאי פלזמה שמפרישים נוגדנים, ולתאי זיכרון שמאפשרים תגובה יעילה יותר בחשיפה חוזרת לאנטיגן מתאים. \u003cstrong>\u003cbdi>T cells\u003c/bdi>\u003c/strong> כוללים תת-אוכלוסיות שונות: תאים מסייעים, תאים ציטוטוקסיים ותאים מווסתים. \u003cstrong>תא \u003cbdi>T\u003c/bdi> ציטוטוקסי\u003c/strong> יכול לסייע בהרס תא גוף נגוע בנגיף; \u003cstrong>תא \u003cbdi>B\u003c/bdi>\u003c/strong> פועל במסלול של הפרשת נוגדנים ספציפיים. אלו אינם שני שמות לאותו סוג תגובה.\u003c/p>\n\u003caside class=\"gnote kind\">\u003cspan class=\"tag\">השוואה קצרה\u003c/span>\u003cdiv>\u003cp>\u003cbdi>B\u003c/bdi> ← נוגדנים ופלזמה; \u003cbdi>T\u003c/bdi> ציטוטוקסי ← פעולה כנגד תא נגוע; \u003cbdi>T\u003c/bdi> מסייע ← איתות ותיאום של תגובות חיסוניות. המצגת משתמשת גם במונח \u003cbdi>Suppressor\u003c/bdi> בהקשר היסטורי-לימודי של בקרה חיסונית. \u003cspan class=\"src-inline\">מצגת חיסון, שקפים 12–20; חוברת 122–123\u003c/span>\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"122,123\" data-slides=\"12,13,14,15,16,17,18,19,20\" data-deck=\"99520\" data-title=\"6. לימפוציטים B ו-T: שתי אסטרטגיות שונות\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B05-13\">\u003ch2 class=\"part\">7. אנטיגן, נוגדן ותאי זיכרון\u003c/h2>\n\u003cp>\u003cstrong>\u003cbdi>Antigen\u003c/bdi>\u003c/strong> הוא מבנה שהמערכת החיסונית יכולה לזהות כיעד לתגובה. נוגדן הוא חלבון בעל אזורי קישור ייחודיים לאנטיגן מסוים. כאשר \u003cbdi>B\u003c/bdi> מתאים מופעל, הוא יכול ליצור \u003cstrong>\u003cbdi>Plasma cells\u003c/bdi>\u003c/strong> המייצרים נוגדנים ו-\u003cstrong>\u003cbdi>Memory cells\u003c/bdi>\u003c/strong> שנשארים תקופה ארוכה יחסית ומסייעים לתגובה חוזרת.\u003c/p>\n\u003cp>לכן בפעם השנייה שהגוף פוגש אותו אנטיגן, ייתכן שהתגובה תהיה מהירה יותר. \u003cstrong>זיכרון חיסוני\u003c/strong> אינו פירושו שכל נוגדן שנוצר נשאר בדם לנצח; הוא קשור גם לקיום תאי זיכרון. \u003cspan class=\"src-inline\">מצגת חיסון, שקפים 13–15; חוברת 122–123\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"122,123\" data-slides=\"13,14,15\" data-deck=\"99520\" data-title=\"7. אנטיגן, נוגדן ותאי זיכרון\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B05-14\">\u003ch2 class=\"part\">8. מערכת המשלים (\u003cbdi>Complement\u003c/bdi>)\u003c/h2>\n\u003cp>המצגת מתארת מערכת של חלבונים בפלזמה, המופעלים ברצף ויכולים לסייע לסילוק פתוגנים בכמה דרכים. רצף ההפעלה יכול להסתיים ביצירת מבנים שפוגעים בשלמות ממברנת הפולש. החלבונים יכולים גם לסייע ב\u003cstrong>גיוס תאי דלקת\u003c/strong>, ב\u003cstrong>הגברת תגובת דלקת\u003c/strong> וב\u003cstrong>סימון פולשים לבליעה\u003c/strong>. תפקוד המשלים אינו זהה לתפקוד נוגדנים, אף שמנגנונים יכולים להשפיע זה על זה.\u003c/p>\n\u003cp>דוגמה לשאלה: ״מהו הסדר הבסיסי?״ הפעלת חלבון ראשון ← הפעלת נוספים בשרשרת ← תגובות שמסייעות לסילוק גורם זר. \u003cspan class=\"src-inline\">מצגת חיסון, שקפים 16–17; חוברת 123\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"123\" data-slides=\"16,17\" data-deck=\"99520\" data-title=\"8. מערכת המשלים (Complement)\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B05-15\">\u003ch2 class=\"part\">9. דלקת: תגובה להגנה ולתיקון\u003c/h2>\n\u003cp>\u003cstrong>דלקת\u003c/strong> היא תגובה לרקמה שנפגעה או לפולש. המצגת מדגישה \u003cstrong>אודם, חום מקומי, כאב ונפיחות\u003c/strong>. חלק מהסימנים קשורים להרחבת כלי דם, לשינוי חדירות הנימים ולכניסת תאים ונוזלים. פגוציטים יכולים לעזוב את זרם הדם ולנוע לרקמה הפגועה. \u003cstrong>מוגלה\u003c/strong> עשויה להכיל תאי הגנה מתים, חיידקים מתים ושאריות רקמה.\u003c/p>\n\u003caside class=\"gnote kind\">\u003cspan class=\"tag\">טעות נפוצה\u003c/span>\u003cdiv>\u003cp>דלקת איננה בהכרח זיהום. הגוף יכול לייצר תגובה דלקתית גם לאחר פגיעה ללא גורם זיהומי. \u003cem>לצורך המבחן, תארי את מנגנון התגובה ואת הסימנים לפני שאת מסיקה על הגורם.\u003c/em> \u003cspan class=\"src-inline\">מצגת חיסון, שקפים 23–26; חוברת 120–121\u003c/span>\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"120,121\" data-slides=\"23,24,25,26\" data-deck=\"99520\" data-title=\"9. דלקת: תגובה להגנה ולתיקון\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B05-16\">\u003ch2 class=\"part\">10. איברי חיסון: מח עצם, תימוס, טחול, קשריות\u003c/h2>\n\u003cp>\u003cstrong>מח העצם\u003c/strong> הוא אתר מרכזי ליצירת תאי הדם. \u003cstrong>תימוס (\u003cbdi>Thymus\u003c/bdi>)\u003c/strong> משתתף בהתבגרות של תאי \u003cbdi>T\u003c/bdi>. \u003cstrong>טחול (\u003cbdi>Spleen\u003c/bdi>)\u003c/strong> מסנן דם, משתתף בתגובה חיסונית ומסלק תאי דם זקנים או פגועים. \u003cstrong>קשריות לימפה\u003c/strong> מסננות לימפה ומאפשרות לתאי מערכת החיסון לפגוש חומרים שהגיעו מהרקמות. שקדים ופוליפים קשורים להגנה באזור כניסת דרכי הנשימה והעיכול.\u003c/p>\n\u003cp>הבחנה חביבה על מבחנים: \u003cstrong>הטחול מסנן דם, קשריות הלימפה מסננות לימפה\u003c/strong>. הם אינם שני שמות לאותו איבר. \u003cspan class=\"src-inline\">מצגת חיסון, שקפים 27–35; חוברת 119–122\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"119,120,121,122\" data-slides=\"27,28,29,30,31,32,33,34,35\" data-deck=\"99520\" data-title=\"10. איברי חיסון: מח עצם, תימוס, טחול, קשריות\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B05-17\">\u003ch2 class=\"part\">11. קשריות לימפה: מסלול כניסה ויציאה\u003c/h2>\n\u003cp>נוזל לימפה נכנס לקשרית דרך כלי \u003cstrong>\u003cbdi>Afferent\u003c/bdi>\u003c/strong>, עובר במעברים שבהם מצויים תאי חיסון ופגוציטים, ויוצא דרך \u003cstrong>\u003cbdi>Efferent\u003c/bdi>\u003c/strong>. המצגת מתארת דוגמה של חדירת חיידקים מתחת לעור: חלקם מסולקים מקומית, וחלקם עשויים להגיע למערכת הלימפה; קשרית קרובה מופעלת ועשויה לגדול בגלל התרבות ופעילות של תאי חיסון.\u003c/p>\n\u003cp>לא כל קשרית מוגדלת מוכיחה זיהום, והמצגת מזכירה גם מצבים אחרים. למבחן תפקוד מערכת הלימפה, המנגנון העיקרי הוא \u003cstrong>סינון, זיהוי ותגובה\u003c/strong>. \u003cspan class=\"src-inline\">מצגת חיסון, שקפים 35–40; חוברת 119–121\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"119,120,121\" data-slides=\"35,36,37,38,39,40\" data-deck=\"99520\" data-title=\"11. קשריות לימפה: מסלול כניסה ויציאה\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B05-18\">\u003ch2 class=\"part\">12. מערכת הלימפה: גם מערכת החזרת נוזלים\u003c/h2>\n\u003cp>מערכת הלימפה ממלאת שלוש משימות מרכזיות: \u003cstrong>החזרת נוזלים וחלבונים מן המרווח הבין-תאי אל הדם\u003c/strong>, \u003cstrong>הובלת שומנים שנספגו במעי הדק\u003c/strong>, ו\u003cstrong>תנועה ובקרה של רכיבים חיסוניים\u003c/strong>. היא מקבלת נוזלים מתוך רקמות ומחזירה אותם לזרם הדם דרך צינורות הניקוז הגדולים. הנימים הלימפתיים בנויים כך שנוזלים וחלקיקים יכולים להיכנס אליהם בקלות יחסית, בעוד שמסתמים עוזרים לשמור על זרימה בכיוון אחד.\u003c/p>\n\u003cp>אם מערכת הלימפה אינה מפנה נוזל כראוי, הנוזל יכול להצטבר ברקמות. זוהי דרך להבין את הקשר בין מערכת הלימפה לבין בצקת, בלי להפוך את המערכת ל״וריד נוסף״. \u003cspan class=\"src-inline\">מצגת חיסון, שקפים 41–48, 50–53\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-slides=\"41,42,43,44,45,46,47,48,50,51,52,53\" data-deck=\"99520\" data-title=\"12. מערכת הלימפה: גם מערכת החזרת נוזלים\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B05-19\">\u003ch2 class=\"part\">13. מה מזיז לימפה בלי משאבה מרכזית?\u003c/h2>\n\u003cp>בניגוד למחזור הדם, למערכת הלימפה אין לב עצמאי שדוחף את הנוזל לכל אורכה. הזרימה מתאפשרת בעזרת \u003cstrong>מסתמים חד-כיווניים\u003c/strong>, \u003cstrong>כיווץ שרירי שלד\u003c/strong>, \u003cstrong>שינויי לחץ בעת נשימה\u003c/strong>, \u003cstrong>שריר חלק בדפנות כלי הלימפה\u003c/strong> ותנועות של כלי דם סמוכים. לכן הליכה ותנועה עשויות לסייע לתנועת נוזל לימפה.\u003c/p>\n\u003caside class=\"gnote kind\">\u003cspan class=\"tag\">שאלת הבנה\u003c/span>\u003cdiv>\u003cp>מה יהיה האפקט של מסתמים לא תקינים? יעילות הזרימה בכיוון הרצוי עלולה לרדת. \u003cspan class=\"src-inline\">מצגת חיסון, שקפים 48–53\u003c/span>\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-slides=\"48,49,50,51,52,53\" data-deck=\"99520\" data-title=\"13. מה מזיז לימפה בלי משאבה מרכזית?\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B05-20\">\u003ch2 class=\"part\">14. הידרוסטטי מול אוסמוטי בהחלפת נוזלים\u003c/h2>\n\u003cp>המצגת מזכירה \u003cstrong>לחץ הידרוסטטי\u003c/strong>, שנוטה לדחוף נוזל החוצה מכלי הדם, ו\u003cstrong>לחץ אוסמוטי/אונקוטי של חלבוני הפלזמה\u003c/strong>, שתורם למשיכת נוזל אל מערכת כלי הדם. המאזן בין לחצים, חדירות הדופן והניקוז הלימפתי מסביר מדוע נוזלים עוברים בין הנימים לרקמות וחוזרים בהמשך.\u003c/p>\n\u003cp>להבנה מספיק לדעת ששני לחצים אלו אינם אותו דבר, ושמערכת הלימפה חיונית לטיפול בחלק מן הנוזל והחלבונים שאינם חוזרים ישירות לנימים. המספרים המופיעים במצגת הם חלק מן הסכמה ההוראתית שלה, ואין צורך להכליל אותם ללא הקשר. \u003cspan class=\"src-inline\">מצגת חיסון, שקפים 43–46\u003c/span>\u003c/p>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-slides=\"43,44,45,46\" data-deck=\"99520\" data-title=\"14. הידרוסטטי מול אוסמוטי בהחלפת נוזלים\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec module\" id=\"s-B05-21\">\u003ch2 class=\"part\">15. חיסון ופעילות גופנית: עומס והתאוששות\u003c/h2>\n\u003cp>המצגת מתארת השפעות שונות של מאמץ על תאים חיסוניים: פעילות גופנית מתונה/רגילה יכולה להיות קשורה לשינויים חיוביים בתפקוד, בעוד תקופות עומס גבוה עם התאוששות חסרה עלולות להכביד על המערכת. בחלק מהשקפים מתואר המושג ההוראתי \u003cstrong>״חלון הזדמנויות״ לאחר מאמץ ממושך\u003c/strong>. זהו מודל לימודי המופיע במצגת, ולא כלל מוכח שכל מאמץ עצים יגרום לזיהום בטווח זמן קבוע. שינה, תזונה והתאוששות הן מרכיבים חיוניים בהקשר זה.\u003c/p>\n\u003caside class=\"gnote kind\">\u003cspan class=\"tag\">שאלת הבנה\u003c/span>\u003cdiv>\u003cp>האם ״מאמץ גופני מדכא חיסון״ הוא משפט מדויק לכל פעילות? לא. משך, עצימות, מצב מתאמן ועומס מצטבר משפיעים על התמונה, ויש להבדיל בין תגובה זמנית לשינוי ממושך. \u003cspan class=\"src-inline\">מצגת חיסון, שקפים 54–56\u003c/span>\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"sec-practice\" data-pages=\"\" data-slides=\"54,55,56\" data-deck=\"99520\" data-title=\"15. חיסון ופעילות גופנית: עומס והתאוששות\">\u003c/div>\u003c/section>\n\u003csection class=\"lsec \" id=\"s-B05-22\">\u003ch2 class=\"part\">חזרה פעילה לפרק\u003c/h2>\n\u003col>\u003cli>\u003cdetails class=\"solve\">\u003csummary>מה ההבדל בין הקו הראשון לשלישי?\u003c/summary>\u003cp>מחסומים לא ספציפיים לעומת תגובה נרכשת ספציפית לאנטיגן.\u003c/p>\u003c/details>\u003c/li>\u003cli>\u003cdetails class=\"solve\">\u003csummary>מי בולע חיידקים ומגיע במהירות לאזור זיהום?\u003c/summary>\u003cp>\u003cbdi>Neutrophils\u003c/bdi>, ובתפקידים משלימים גם פגוציטים אחרים.\u003c/p>\u003c/details>\u003c/li>\u0   try { await store.ref.set(JSON.parse(JSON.stringify(S))); store.lastSync = Date.now(); store.remote = 'on'; }
  catch (e) { const code = e && e.code; if (code === 'unavailable') store.dirty = true; else { store.ref = null; store.remote = code === 'invalid_argument' ? 'readonly' : 'off'; } }
  store.writing = false; renderStatus();

}
async function initRemote() {

  try {
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user) { store.remote = 'off'; renderStatus(); return; }
    const uid = await user.id();
    if (!uid) { store.remote = 'off'; renderStatus(); return; }
    const ref = db.doc(`data/users/${uid}/progress`);
    const snap = await ref.get();
    store.ref = ref; store.remote = 'on';
    const remote = snap.exists ? normalize(JSON.parse(JSON.stringify(snap.data()))) : null;
    if (remote && (!S.updatedAt || (remote.updatedAt && remote.updatedAt > S.updatedAt))) { S = remote; saveLocal(); render(); }

}

// ---------- derived stats ----------
function latestBy(list) { const m = {}; for (const a of list) m[a.questionId] = a; return m; }
function topicStats(tid) {
  const qs = D.mcq.filter(q => q.topicId === tid);
  const ids = new Set(qs.map(q => q.id));
  const att = S.mcqAttempts.filter(a => ids.has(a.questionId));
  const latest = latestBy(att); const uniq = Object.values(latest);
  const cards = D.flashcards.filter(c => c.topicId === tid);
  const recent = att.slice(-5);
  const lesson = D.lessons.find(l => l.topicId === tid);
  return {
    bank: qs.length, attempts: att.length, correct: att.filter(a => a.correct).length, unique: uniq.length,
    mastery: uniq.length >= 5 ? pct(uniq.filter(a => a.correct).length, uniq.length) : null, coverage: pct(uniq.length, qs.length),
    recentWrong: recent.filter(a => !a.correct).length, recentN: recent.length,
    cards: cards.length, cardsKnown: cards.filter(c => S.flashcards[c.id]?.rating === 'known').length,
    lessonDone: lesson ? S.completedLessons.includes(lesson.key) : false,
  };
}
function cardIsDue(id, now = Date.now()) { const c = S.flashcards[id]; return !c || !c.nextDueAt || Date.parse(c.nextDueAt) <= now; }
const dueCards = tid => { const now = Date.now(); return D.flashcards.filter(c => (!tid || c.topicId === tid) && S.flashcards[c.id] && cardIsDue(c.id, now)); };
const newCards = tid => D.flashcards.filter(c => (!tid || c.topicId === tid) && !S.flashcards[c.id]);
const hardCards = tid => D.flashcards.filter(c => (!tid || c.topicId === tid) && ['unknown', 'almost'].includes(S.flashcards[c.id]?.rating));
const mistakeIds = tid => Object.values(latestBy(S.mcqAttempts)).filter(a => !a.correct && (!tid || Q[a.questionId]?.topicId === tid)).map(a => a.questionId);
// first try vs later tries, per question, from the stored attempt log
function tryStats() {
  const by = {}; for (const a of S.mcqAttempts) (by[a.questionId] = by[a.questionId] || []).push(a);
  let f = 0, fOk = 0, r = 0, rOk = 0;
  for (const list of Object.values(by)) { f++; if (list[0].correct) fOk++; for (const a of list.slice(1)) { r++; if (a.correct) rOk++; } }
  return { first: f, firstOk: fOk, retry: r, retryOk: rOk };
}

// The study plan: fixed rules checked in order, so the reason shown is always the rule that fired.
function plan() {
  const out = [];
  if (S.activeExam) out.push({ title: 'יש מבחן פתוח', text: `ענית על ${Object.keys(S.activeExam.answers).length} מתוך ${S.activeExam.qids.length} שאלות. אפשר להמשיך מאותה נקודה.`, cta: 'המשך למבחן', act: 'go', args: { route: 'exam' } });
  const due = dueCards().length;
  if (due >= 8) out.push({ title: `${due} כרטיסיות מחכות לחזרה`, text: 'הגיע מועד החזרה שלהן לפי הדירוג הקודם שלך.', cta: 'לחזרה על כרטיסיות', act: 'startCardsQuick', args: { mode: 'due' } });
  let worst = null;
  for (const t of TOPICS) { const st = topicStats(t.id); if (st.recentN >= 3 && st.recentWrong >= 2 && (!worst || st.recentWrong > worst.st.recentWrong)) worst = { t, st }; }
  if (worst) out.push({ title: `לחזור על ${worst.t.name}`, text: `${worst.st.recentWrong} טעויות ב-${worst.st.recentN} התשובות האחרונות בנושא.`, cta: 'תרגול הטעויות בנושא', act: 'startPracticeQuick', args: { topic: worst.t.id, pool: 'mistakes' } });
  const next = D.lessons.find(l => !S.completedLessons.includes(l.key));
  if (next) out.push({ title: `ללמוד: ${next.title}`, text: `${next.unit}. בסוף כל תת-נושא יש תרגול על העמודים שלו.`, cta: 'לפתיחת הפרק', act: 'openLesson', args: { key: next.key } });
  let low = null;
  for (const t of TOPICS) { const st = topicStats(t.id); if (!low || st.coverage < low.st.coverage) low = { t, st }; }
  if (low && low.st.coverage < 60) out.push({ title: `לתרגל: ${low.t.name}`, text: `ענית על ${low.st.unique} מתוך ${low.st.bank} השאלות בנושא, הכיסוי הנמוך ביותר.`, cta: 'תרגול 10 שאלות', act: 'startPracticeQuick', args: { topic: low.t.id, pool: 'unseen' } });
  if (out.length < 3) out.push({ title: 'סימולציה מלאה', text: '30 שאלות מכל חמשת הנושאים, 40 דקות. ההסברים מוצגים רק אחרי ההגשה.', cta: 'למבחן', act: 'go', args: { route: 'exam' } });
  return out.slice(0, 3);
}

// Leitner boxes: לא ידעתי → box 0, back in this round and again in 10 minutes; כמעט → box 1, tomorrow;
// ידעתי → one box up, intervals 1 / 3 / 7 / 14 / 30 days.
const INTERVAL_DAYS = [0, 1, 3, 7, 14, 30];
function rateCard(id, rating) {
  const c = S.flashcards[id] || { rating: null, reviews: 0, known: 0, almost: 0, unknown: 0, box: 0, lastAt: null, nextDueAt: null };
  c.reviews++; c[rating]++; c.rating = rating; c.lastAt = nowISO();
  const now = Date.now();
  if (rating === 'unknown') { c.box = 0; c.nextDueAt = new Date(now + 10 * 60000).toISOString(); }
  else if (rating === 'almost') { c.box = 1; c.nextDueAt = new Date(now + DAY).toISOString(); }
  else { c.box = Math.min((c.box || 0) + 1, 5); c.nextDueAt = new Date(now + INTERVAL_DAYS[c.box] * DAY).toISOString(); }
  S.flashcards[id] = c;
}
function buildCardQueue(f) {
  const tid = f.topic === 'all' ? null : f.topic;
  let list = D.flashcards.filter(c => (!tid || c.topicId === tid) && (f.type === 'all' || c.type === f.type));
  if (f.mode === 'hard') list = list.filter(c => ['unknown', 'almost'].includes(S.flashcards[c.id]?.rating));
  else if (f.mode === 'due') {
    const now = Date.now();
    const due = list.filter(c => S.flashcards[c.id] && cardIsDue(c.id, now)).sort((a, b) => Date.parse(S.flashcards[a.id].nextDueAt || 0) - Date.parse(S.flashcards[b.id].nextDueAt || 0));
    const fresh = list.filter(c => !S.flashcards[c.id]);
    list = due.concat(f.mix ? shuffle(fresh) : fresh);
  } else if (f.mode === 'oldest') list = list.filter(c => S.flashcards[c.id]).sort((a, b) => Date.parse(S.flashcards[a.id].lastAt) - Date.parse(S.flashcards[b.id].lastAt));
  else if (f.mix) list = shuffle(list);
  const n = f.size === 'all' ? list.length : Math.min(+f.size, list.length);
  return list.slice(0, n).map(c => c.id);
}

function practicePool(f) {
  let pool = D.mcq.filter(q => (f.topic === 'all' || q.topicId === f.topic) && (f.diff === 'all' || q.difficulty === f.diff) && (f.kind === 'all' || q.kind === f.kind) && (!f.src || f.src === 'all' || (f.src === 'slides' ? !!q.sourceDeck : !q.sourceDeck)));
  if (f.pool === 'mistakes') { const m = new Set(mistakeIds()); pool = pool.filter(q => m.has(q.id)); }
  if (f.pool === 'unseen') { const seen = latestBy(S.mcqAttempts); pool = pool.filter(q => !seen[q.id]); }
  if (f.pool === 'marked') { const m = new Set(S.markedQuestions); pool = pool.filter(q => m.has(q.id)); }
