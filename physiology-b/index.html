<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>לומדים אנטומיה עם עפר · פיזיולוגיה ב׳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="מרכז לימוד אינטראקטיבי לפיזיולוגיה חלק ב׳: לב וכלי דם, שריר ועצב, נשימה, הורמונים וחיסון">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app shell — sticky top bar, side nav from 960px, bottom tab bar on phones; one reading column up to 780px. */
:root {
  --bg: #f3f6f5;
  --surface: #ffffff;
  --surface-2: #eaf1ee;
  --ink: #12302a;
  --ink-2: #4a605b;
  --ink-3: #6f827d;
  --line: #d6e1dd;
  --accent: #0f6b5c;
  --accent-ink: #0b5649;
  --accent-soft: #dcefe9;
  --on-accent: #ffffff;
  --warm: #b85c1e;
  --warm-soft: #fbece0;
  --reco-eyebrow: #f4a873;
  --ok: #1d7446;
  --ok-soft: #e1f3e8;
  --bad: #b1352c;
  --bad-soft: #fbe6e3;
  --flag: #8a5a00;
  --flag-soft: #fbf0d6;
  --sys-p: #c7621d;
  --sys-g: #a33a6f;
  --sys-a: #1f6aa5;
  --sys-t: #0f6b5c;
  --shadow: 0 1px 2px rgb(18 48 42 / .06), 0 4px 14px rgb(18 48 42 / .06);
  --f-display: "Frank Ruhl Libre", "David", "Times New Roman", serif;
  --f-body: "IBM Plex Sans Hebrew", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  --r: 14px;
  --r-s: 10px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1715; --surface: #15211e; --surface-2: #1b2b27; --ink: #e2ede9; --ink-2: #a3b8b2; --ink-3: #82978f; --line: #2a3d38;
    --accent: #4dbfa5; --accent-ink: #7fd6c1; --accent-soft: #163a32; --on-accent: #062621;
    --warm: #f0a064; --warm-soft: #3a2618; --reco-eyebrow: #9a4a12; --ok: #67d095; --ok-soft: #133524; --bad: #f2877d; --bad-soft: #3d1b18;
    --flag: #f0c35a; --flag-soft: #3a2e10; --sys-p: #f0995a; --sys-g: #e277ad; --sys-a: #6fb1e8; --sys-t: #4dbfa5;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1715; --surface: #15211e; --surface-2: #1b2b27; --ink: #e2ede9; --ink-2: #a3b8b2; --ink-3: #82978f; --line: #2a3d38;
  --accent: #4dbfa5; --accent-ink: #7fd6c1; --accent-soft: #163a32; --on-accent: #062621;
  --warm: #f0a064; --warm-soft: #3a2618; --reco-eyebrow: #9a4a12; --ok: #67d095; --ok-soft: #133524; --bad: #f2877d; --bad-soft: #3d1b18;
  --flag: #f0c35a; --flag-soft: #3a2e10; --sys-p: #f0995a; --sys-g: #e277ad; --sys-a: #6fb1e8; --sys-t: #4dbfa5;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-ink); }
bdi { unicode-bidi: isolate; }
:focus-visible { outline: 3px solid var(--warm); outline-offset: 2px; border-radius: 6px; }
.skip { position: absolute; inset-inline-start: 8px; top: -60px; background: var(--accent); color: var(--on-accent); padding: 8px 12px; border-radius: 8px; z-index: 50; }
.skip:focus { top: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1200px; margin-inline: auto; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; text-align: start; min-width: 0; }
.brand-txt { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.brand-txt b { font-family: var(--f-display); font-size: clamp(1rem, 4.4vw, 1.2rem); font-weight: 900; letter-spacing: .01em; }
.brand-txt small { color: var(--ink-3); font-size: .75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.store-chip { flex: none; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); border-radius: 999px; padding: 4px 10px; font-size: .75rem; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; }
.store-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.store-chip[data-s="account"] .dot { background: var(--ok); }
.store-chip[data-s="local"] .dot { background: var(--flag); }
.store-chip[data-s="none"] .dot { background: var(--bad); }

.shell { max-width: 1200px; margin-inline: auto; display: grid; grid-template-columns: 1fr; }
main { min-width: 0; padding-block: 20px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main:focus { outline: none; }
.view { max-width: 780px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
.side { display: none; }
.bottom { position: fixed; inset: auto 0 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.bottom button { background: none; border: 0; min-height: var(--nav-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .72rem; color: var(--ink-3); padding: 6px 2px; }
.bottom button svg, .side button svg { width: 22px; height: 22px; }
.bottom button[aria-current="page"] { color: var(--accent-ink); font-weight: 600; }
.bottom button[aria-current="page"] svg { stroke: var(--accent); }
@media (min-width: 960px) {
  .shell { grid-template-columns: 220px 1fr; gap: 8px; }
  .side { display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); align-self: start; padding: 20px 12px; padding-right: max(12px, env(safe-area-inset-right, 0px)); }
  .side button { display: flex; align-items: center; gap: 10px; background: none; border: 0; border-radius: var(--r-s); padding: 9px 12px; text-align: start; color: var(--ink-2); font-size: .95rem; }
  .side button:hover { background: var(--surface-2); }
  .side button[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  .side hr { border: 0; border-top: 1px solid var(--line); margin: 8px 6px; }
  .bottom { display: none; }
  main { padding-bottom: 48px; }
}
.ico { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* sheet (more menu, confirmations) */
.sheet-back { position: fixed; inset: 0; background: rgb(8 20 17 / .45); z-index: 40; }
.sheet { position: fixed; z-index: 41; inset: auto 0 0; background: var(--surface); border-radius: 18px 18px 0 0; padding: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 85vh; overflow: auto; box-shadow: var(--shadow); }
@media (min-width: 700px) { .sheet { inset: 50% auto auto 50%; transform: translate(-50%, -50%); border-radius: 18px; width: min(520px, 92vw); } }
.sheet h2 { margin: 0 0 12px; font-size: 1.15rem; }
.menu-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.menu-grid button { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r-s); padding: 14px 12px; text-align: start; min-height: 56px; }
.menu-grid button svg { width: 22px; height: 22px; color: var(--accent); flex: none; }
.toast { position: fixed; z-index: 45; inset-inline: 0; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); margin-inline: auto; width: fit-content; max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: .9rem; box-shadow: var(--shadow); }
@media (min-width: 960px) { .toast { bottom: 24px; } }

/* ---------- type & generic ---------- */
h1, h2, h3, h4 { text-wrap: balance; line-height: 1.25; margin: 0; }
.page-head { display: flex; flex-direction: column; gap: 6px; }
.page-head h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(1.7rem, 5.5vw, 2.3rem); letter-spacing: -.005em; }
.page-head h1:focus { outline: none; }
.eyebrow { font-size: .78rem; font-weight: 600; color: var(--warm); letter-spacing: .04em; }
.lede { color: var(--ink-2); margin: 0; max-width: 62ch; }
.muted { color: var(--ink-3); }
.small { font-size: .85rem; }
.mono { font-family: var(--f-mono); font-size: .82em; letter-spacing: .01em; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel h2 { font-size: 1.1rem; }
.panel.tint { background: var(--accent-soft); border-color: transparent; }
.panel.warmtint { background: var(--warm-soft); border-color: transparent; }
.section-title { font-size: .8rem; font-weight: 700; color: var(--ink-3); letter-spacing: .05em; margin: 4px 0 -6px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; text-decoration: none; text-align: center; }
.btn:hover { border-color: var(--accent); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent-ink); padding-inline: 10px; }
.btn.small { min-height: 38px; padding: 6px 12px; font-size: .88rem; border-radius: 10px; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent-ink); text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }

.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: .78rem; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.t { background: var(--accent-soft); color: var(--accent-ink); }
.chip.warm { background: var(--warm-soft); color: var(--warm); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.flag { background: var(--flag-soft); color: var(--flag); }
.tid { font-family: var(--f-mono); font-size: .75rem; }

/* form controls */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span, .field legend { font-size: .85rem; font-weight: 600; color: var(--ink-2); padding: 0; }
fieldset.field { border: 0; margin: 0; padding: 0; }
select, input[type="text"], textarea { width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 8px 12px; }
textarea { min-height: 120px; font-family: var(--f-mono); font-size: .8rem; direction: ltr; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; min-width: 52px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: .92rem; }
.seg input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.seg input:focus-visible + span { outline: 3px solid var(--warm); outline-offset: 2px; }
.seg input:disabled + span { opacity: .4; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checks label { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-height: 42px; background: var(--surface); font-size: .9rem; }
.checks input { width: 18px; height: 18px; accent-color: var(--accent); }
details.explain { border: 1px dashed var(--line); border-radius: var(--r-s); padding: 10px 14px; font-size: .9rem; color: var(--ink-2); }
details.explain summary { cursor: pointer; font-weight: 600; color: var(--ink); }
details.explain p, details.explain ul { margin: 8px 0 0; }

.progressbar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progressbar > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.progressbar.warm > i { background: var(--warm); }
.counter { font-variant-numeric: tabular-nums; font-family: var(--f-mono); font-size: .85rem; color: var(--ink-2); }

/* ---------- home ---------- */
.hello { display: flex; flex-direction: column; gap: 6px; }
.hello h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(2rem, 7vw, 2.8rem); }
.reco { display: grid; gap: 12px; background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 20px; }
.reco .eyebrow { color: var(--reco-eyebrow); }
.reco h2 { font-size: 1.25rem; font-family: var(--f-display); font-weight: 700; }
.reco p { margin: 0; opacity: .85; }
.reco .btn.primary { background: var(--bg); color: var(--ink); border-color: var(--bg); justify-self: start; }
.quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.quick button { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); text-align: start; min-height: 96px; min-width: 0; }
.quick button b { font-size: 1.5rem; font-variant-numeric: tabular-nums; font-family: var(--f-display); line-height: 1; }
.quick button span { font-size: .82rem; color: var(--ink-2); line-height: 1.3; }
.quick button:hover { border-color: var(--accent); }
.topic-list { display: flex; flex-direction: column; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.topic-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 14px 16px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: start; width: 100%; }
.topic-row:last-child { border-bottom: 0; }
.topic-row:hover { background: var(--surface-2); }
.topic-row .num { font-family: var(--f-mono); font-size: .8rem; color: var(--accent-ink); background: var(--accent-soft); border-radius: 8px; padding: 4px 6px; }
.topic-row .nm { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.topic-row .nm b { font-weight: 600; font-size: .98rem; }
.topic-row .meta { font-size: .78rem; color: var(--ink-3); }
.topic-row .score { text-align: end; font-size: .8rem; color: var(--ink-2); min-width: 64px; }
.topic-row .score b { display: block; font-size: 1.05rem; color: var(--ink); font-variant-numeric: tabular-nums; }
@media (max-width: 560px) {
  .topic-row { grid-template-columns: auto 1fr; align-items: start; }
  .topic-row .score { grid-column: 2; text-align: start; min-width: 0; display: flex; gap: 6px; align-items: baseline; }
  .topic-row .score b { display: inline; }
}

/* ---------- learn ---------- */
.lesson-list { display: flex; flex-direction: column; gap: 10px; }
.lesson-item { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); text-align: start; width: 100%; }
.lesson-item:hover { border-color: var(--accent); }
.lesson-item .lbl { font-size: .78rem; font-weight: 700; color: var(--warm); }
.lesson-item h3 { font-size: 1.02rem; font-weight: 600; }
.lesson-item .meta { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .8rem; color: var(--ink-3); }
.done-mark { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; }
.done-mark.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.prose { display: flex; flex-direction: column; gap: 14px; font-size: 1.02rem; line-height: 1.75; }
.prose p, .prose ul, .prose ol { margin: 0; max-width: 66ch; }
.prose ul, .prose ol { padding-inline-start: 22px; display: flex; flex-direction: column; gap: 6px; }
.prose li .sub { color: var(--ink-3); font-size: .9rem; }
.prose h2.part { font-family: var(--f-display); font-size: 1.45rem; font-weight: 700; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
.prose h3 { font-size: 1.18rem; color: var(--accent-ink); margin-top: 6px; }
.prose h4 { font-size: 1rem; }
.prose .src { font-size: .82rem; color: var(--ink-3); margin-top: -8px; }
.gcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.gcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-s); padding: 14px; display: flex; flex-direction: column; gap: 6px; font-size: .95rem; line-height: 1.6; min-width: 0; }
.gcard h4 { color: var(--accent-ink); }
.gcard p, .gcard ul { margin: 0; }
.gstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 10px; }
.gstat { background: var(--accent-soft); border-radius: var(--r-s); padding: 14px; display: flex; flex-direction: column; gap: 2px; text-align: center; }
.gstat .v { font-family: var(--f-display); font-weight: 900; font-size: 2rem; color: var(--accent-ink); line-height: 1.1; }
.gstat .l { font-weight: 600; font-size: .9rem; }
.gstat .c { font-size: .78rem; color: var(--ink-3); }
.gnote { background: var(--warm-soft); border-radius: var(--r-s); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; font-size: .95rem; }
.gnote .tag, .gcheck .tag { font-size: .78rem; font-weight: 700; color: var(--warm); letter-spacing: .03em; }
.gnote > div { display: flex; flex-direction: column; gap: 8px; }
.gcheck { border: 1px dashed var(--warm); border-radius: var(--r-s); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.gcheck p { font-weight: 600; }
.gfig { margin: 0; background: var(--surface-2); border-radius: var(--r-s); padding: 14px; display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.gfig figcaption { font-size: .85rem; color: var(--ink-2); }
.gfig.flow ol { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; max-width: none; }
.gfig.flow li { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-weight: 600; font-size: .92rem; }
.gfig.flow li + li::before { content: "←"; color: var(--warm); margin-inline-end: 8px; font-weight: 700; }
.gfig.eq .eqn { font-family: var(--f-mono); font-size: 1.05rem; font-weight: 500; text-align: center; background: var(--surface); border-radius: 8px; padding: 10px; overflow-x: auto; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: start; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
thead th { background: var(--surface-2); font-size: .82rem; color: var(--ink-2); white-space: nowrap; }
tbody tr:last-child th, tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { font-variant-numeric: tabular-nums; text-align: end; white-space: nowrap; }
.lesson-foot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }

/* ---------- question cards (MCQ, graph, exam) ---------- */
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); min-width: 0; }
.qmeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.qtext { font-size: 1.12rem; font-weight: 600; line-height: 1.55; }
.opts { display: flex; flex-direction: column; gap: 8px; list-style: none; padding: 0; margin: 0; }
.opt { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: start; padding: 12px 14px; min-height: 52px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); line-height: 1.45; }
.opt .k { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); font-weight: 700; font-size: .85rem; color: var(--ink-2); }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-pressed="true"] .k { background: var(--accent); color: var(--on-accent); }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.correct .k { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); color: #fff; }
.opt[disabled] { cursor: default; }
.opt .mark { font-size: .78rem; font-weight: 700; }
.opt.correct .mark { color: var(--ok); }
.opt.wrong .mark { color: var(--bad); }
.feedback { border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: .95rem; }
.feedback.ok { background: var(--ok-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback b.h { font-size: 1rem; }
.feedback.ok b.h { color: var(--ok); }
.feedback.bad b.h { color: var(--bad); }
.srcref { font-size: .8rem; color: var(--ink-3); }
.qnav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }

/* ---------- flashcards ---------- */
.fc-stage { perspective: 1200px; }
.fc { position: relative; width: 100%; min-height: 260px; border: 0; padding: 0; background: none; text-align: center; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3,.7,.3,1); display: grid; }
.fc.flipped { transform: rotateY(180deg); }
.fc .face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 18px; padding: 26px 22px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; border: 1px solid var(--line); box-shadow: var(--shadow); min-height: 260px; }
.fc .front { background: var(--surface); }
.fc .back { background: var(--accent-soft); transform: rotateY(180deg); }
.fc .face .q { font-size: 1.3rem; font-weight: 600; line-height: 1.5; font-family: var(--f-body); }
.fc .face .a { font-size: 1.15rem; line-height: 1.6; }
.fc .face .hint { font-size: .8rem; color: var(--ink-3); }
.fc .face .top-row { position: absolute; inset: 12px 14px auto; display: flex; justify-content: space-between; gap: 6px; }
.rate { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rate button { min-height: 58px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px; }
.rate button small { font-weight: 400; font-size: .72rem; color: var(--ink-3); }
.rate .r-unknown { border-color: var(--bad); color: var(--bad); }
.rate .r-almost { border-color: var(--flag); color: var(--flag); }
.rate .r-known { border-color: var(--ok); color: var(--ok); }
.rate .r-unknown:hover { background: var(--bad-soft); }
.rate .r-almost:hover { background: var(--flag-soft); }
.rate .r-known:hover { background: var(--ok-soft); }
.tally { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center; }
.tally div { border-radius: 12px; padding: 12px 6px; background: var(--surface-2); }
.tally b { display: block; font-size: 1.6rem; font-family: var(--f-display); font-variant-numeric: tabular-nums; }

/* ---------- exam ---------- */
.exam-bar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 57px); z-index: 10; background: var(--bg); padding-block: 8px; display: flex; flex-direction: column; gap: 8px; }
.timer { font-family: var(--f-mono); font-size: 1.05rem; font-variant-numeric: tabular-nums; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px 10px; }
.timer.low { color: var(--bad); border-color: var(--bad); }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; }
.qgrid button { min-height: 42px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--surface); font-family: var(--f-mono); font-size: .85rem; position: relative; }
.qgrid button.ans { background: var(--accent-soft); border-color: var(--accent); }
.qgrid button.cur { outline: 2px solid var(--ink); outline-offset: 1px; }
.qgrid button.flg::after { content: ""; position: absolute; top: 3px; inset-inline-end: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--flag); }
.qgrid button.res-ok { background: var(--ok-soft); border-color: var(--ok); }
.qgrid button.res-bad { background: var(--bad-soft); border-color: var(--bad); }
.legend-row { display: flex; flex-wrap: wrap; gap: 12px; font-size: .78rem; color: var(--ink-3); }
.legend-row i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; border: 1.5px solid var(--line); vertical-align: -2px; margin-inline-end: 4px; }
.score-hero { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.score-hero .big { font-family: var(--f-display); font-weight: 900; font-size: 3.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.review-item { border: 1px solid var(--line); border-radius: var(--r-s); padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.review-item.bad { border-inline-start: 4px solid var(--bad); }
.review-item.ok { border-inline-start: 4px solid var(--ok); }
.review-item .ans-line { font-size: .92rem; }
.review-item .ans-line b { font-weight: 600; }

/* ---------- graphs ---------- */
.chart-card { display: flex; flex-direction: column; gap: 10px; }
.chart-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 8px 8px; min-width: 0; }
.chart-box svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-box svg text { fill: var(--ink-2); font-family: var(--f-body); }
.chart-box svg .axis-title { fill: var(--ink); font-weight: 600; }
.chart-box svg .grid { stroke: var(--line); }
.chart-box svg .axis { stroke: var(--ink-3); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 6px 8px 2px; font-size: .82rem; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 4px; border-radius: 2px; display: inline-block; }
.legend i.dash { background: repeating-linear-gradient(90deg, currentColor 0 5px, transparent 5px 8px) !important; height: 3px; }
.status-tag { font-size: .78rem; }
.chart-tile { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); text-align: start; width: 100%; }
.chart-tile:hover { border-color: var(--accent); }
.chart-tile h3 { font-size: .98rem; font-weight: 600; }
.chart-tile .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* ---------- games ---------- */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; background: var(--surface-2); border-radius: 12px; padding: 4px; width: fit-content; max-width: 100%; }
.tabs button { border: 0; background: none; border-radius: 9px; padding: 8px 16px; min-height: 40px; font-weight: 600; color: var(--ink-2); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--accent-ink); box-shadow: var(--shadow); }
.game-tile { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); text-align: start; width: 100%; }
.game-tile:hover { border-color: var(--accent); }
.game-tile h3 { font-size: .98rem; font-weight: 600; }
.game-tile .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .8rem; color: var(--ink-3); }
.terms { display: flex; flex-wrap: wrap; gap: 8px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 57px); z-index: 5; background: var(--bg); padding-block: 8px; }
.term { border: 1.5px solid var(--accent); background: var(--surface); color: var(--accent-ink); border-radius: 10px; padding: 8px 12px; min-height: 44px; font-weight: 600; font-size: .95rem; touch-action: manipulation; }
.term[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.term.used { border-style: dashed; color: var(--ink-3); border-color: var(--line); background: transparent; }
.term[draggable="true"] { cursor: grab; }
.defs { display: flex; flex-direction: column; gap: 10px; list-style: none; margin: 0; padding: 0; }
.def { display: flex; flex-direction: column; gap: 8px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); padding: 12px 14px; }
.def.drop { border-color: var(--accent); background: var(--accent-soft); }
.def .slot { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; border: 1.5px dashed var(--line); border-radius: 10px; padding: 4px 6px 4px 12px; background: var(--surface-2); text-align: start; width: 100%; }
.def .slot.filled { border-style: solid; border-color: var(--accent); background: var(--accent-soft); font-weight: 600; color: var(--accent-ink); }
.def .slot .ph { color: var(--ink-3); font-weight: 400; font-size: .88rem; }
.def.ok { border-color: var(--ok); }
.def.ok .slot { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.def.bad { border-color: var(--bad); }
.def.bad .slot { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.def .fix { font-size: .85rem; color: var(--ok); font-weight: 600; }
.seq { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.seq li { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); padding: 8px 8px 8px 10px; }
.seq li.dragging { opacity: .5; }
.seq li.over { border-color: var(--accent); }
.seq li .pos { width: 30px; height: 30px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font-family: var(--f-mono); font-size: .85rem; }
.seq li .txt { line-height: 1.45; }
.seq li .mv { display: flex; gap: 4px; }
.seq li .mv button { width: 40px; height: 40px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; }
.seq li .mv button[disabled] { opacity: .3; }
.seq li.ok { border-color: var(--ok); background: var(--ok-soft); }
.seq li.bad { border-color: var(--bad); background: var(--bad-soft); }
.seq li .want { grid-column: 2 / -1; font-size: .8rem; color: var(--ink-2); }
.seq li[draggable="true"] { cursor: grab; }

/* ---------- listen ---------- */
.ep { display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.ep h3 { font-size: 1.02rem; font-weight: 600; }
.ep audio { width: 100%; height: 44px; }
.ep .n { font-family: var(--f-mono); color: var(--warm); font-size: .8rem; }

/* ---------- progress ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.kpi b { font-family: var(--f-display); font-size: 1.8rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi span { font-size: .82rem; color: var(--ink-2); }
.kpi small { font-size: .74rem; color: var(--ink-3); }
.empty { text-align: center; padding: 22px; color: var(--ink-3); border: 1px dashed var(--line); border-radius: var(--r); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
@keyframes pop { from { transform: scale(.96); opacity: .6; } to { transform: none; opacity: 1; } }
.pop { animation: pop .35s ease-out; }

/* ---------- anatomy additions ---------- */
.en { font-family: var(--f-body); unicode-bidi: isolate; }
.actions3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.act-main { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 16px 14px; min-height: 92px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); text-align: start; min-width: 0; }
.act-main:first-child { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.act-main:first-child span { color: var(--on-accent); opacity: .85; }
.act-main b { font-family: var(--f-display); font-size: 1.15rem; line-height: 1.2; }
.act-main span { font-size: .8rem; color: var(--ink-2); line-height: 1.35; }
.act-main:hover { border-color: var(--accent); }
@media (max-width: 520px) { .actions3 { grid-template-columns: 1fr; } .act-main { min-height: 0; flex-direction: row; justify-content: space-between; align-items: center; } }
.plan-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.plan-list li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.plan-list .num { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-family: var(--f-mono); font-size: .8rem; }
.plan-list .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
@media (max-width: 520px) { .plan-list li { grid-template-columns: auto 1fr; } .plan-list li .btn { grid-column: 2; justify-self: start; } }
.topic-block { display: flex; flex-direction: column; gap: 10px; }
.tb-h { font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
.tb-h .num { font-family: var(--f-mono); font-size: .78rem; color: var(--accent-ink); background: var(--accent-soft); border-radius: 8px; padding: 3px 6px; }
.terms-mini { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 8px; }
.term-mini { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); min-width: 0; }
.term-mini .en { color: var(--accent-ink); font-size: .85rem; }
details.why { font-size: .95rem; }
details.why summary { cursor: pointer; font-weight: 700; width: fit-content; }
details.why > span { display: block; margin-top: 4px; }
.mark-btn { align-self: flex-start; }
.mark-btn[aria-pressed="true"] { color: var(--flag); }
.mark-btn[aria-pressed="true"] svg { fill: currentColor; }
.atlas { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 10px; }
.atlas-card { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); min-width: 0; }
.atlas-card h3 { font-size: 1.08rem; font-family: var(--f-body); font-weight: 700; }
.af { display: grid; grid-template-columns: 56px 1fr; gap: 8px; align-items: baseline; font-size: .93rem; line-height: 1.5; }
.af .al { font-size: .78rem; font-weight: 700; color: var(--ink-3); }
.af.revealed { background: var(--warm-soft); border-radius: 8px; padding: 4px 6px; margin-inline: -6px; }
.af .reveal { justify-self: start; }
.gloss { margin: 0; display: flex; flex-direction: column; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.gl { padding: 12px 16px; border-bottom: 1px solid var(--line); }
.gl:last-child { border-bottom: 0; }
.gl dt { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.gl dt .en { color: var(--accent-ink); font-size: .9rem; }
.gl dd { margin: 4px 0 0; font-size: .93rem; color: var(--ink-2); }
input[type="search"] { width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 8px 12px; }
.id-list { display: flex; flex-direction: column; gap: 8px; }
.id-item { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); cursor: pointer; }
.id-item input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--accent); }
.id-txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.gsteps { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 120px), 1fr)); gap: 8px; max-width: none; }
.gsteps li { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--accent-soft); font-weight: 600; font-size: .93rem; line-height: 1.45; }
.gsteps .sn { font-family: var(--f-mono); color: var(--accent-ink); font-size: .8rem; }
.gfig.labels .lbl-row { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
.gfig.labels .lbl-row span { font-family: var(--f-mono); font-size: .85rem; padding: 8px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); }
.gfig.labels .lbl-row span:nth-child(odd) { border-color: var(--warm); color: var(--warm); }

/* ---------- identification figures ---------- */
.idfig-wrap { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.idfig { position: relative; overflow: hidden; margin-inline: auto; background: #fff; border: 1px solid var(--line); border-radius: var(--r-s); }
.idfig img { position: absolute; max-width: none; user-select: none; -webkit-user-drag: none; }
.idfig.qa { cursor: crosshair; touch-action: manipulation; }
.hs { position: absolute; aspect-ratio: 1; min-width: 22px; transform: translate(-50%, -50%); border-radius: 50%; border: 3px solid #e0007a; box-shadow: 0 0 0 2px #fff, inset 0 0 0 2px #fff; pointer-events: none; display: grid; place-items: center; }
.hs::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #e0007a; box-shadow: 0 0 0 2px #fff; }
.hs b { position: absolute; top: -2px; left: calc(100% + 2px); background: #e0007a; color: #fff; font: 700 12px/1 var(--f-mono); padding: 3px 5px; border-radius: 6px; }
.hs.ok { border-color: #1d7446; } .hs.ok::after { background: #1d7446; }
.hs.bad { border-color: #b1352c; } .hs.bad::after { background: #b1352c; }
.hs.qa { border-style: dashed; }
@keyframes hspulse { 0%, 100% { box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgb(224 0 122 / .0); } 50% { box-shadow: 0 0 0 2px #fff, 0 0 0 9px rgb(224 0 122 / .25); } }
.hs.pulse { animation: hspulse 1.6s ease-in-out infinite; }
.credit { font-size: .72rem; color: var(--ink-3); }
.credit a { color: inherit; }
.id-counts { display: flex; flex-wrap: wrap; gap: 6px; }
.asset-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .85rem; min-height: 36px; }
.chip-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.study-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.study-list li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); }
.study-list .num { width: 26px; height: 26px; border-radius: 7px; background: #e0007a; color: #fff; display: grid; place-items: center; font: 700 .8rem var(--f-mono); }
.study-list .txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.qa-list { display: flex; flex-direction: column; gap: 6px; }
.qa-row { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); text-align: start; width: 100%; }
.qa-row.on { border-color: var(--accent); background: var(--accent-soft); }
.qa-row .txt { display: flex; flex-direction: column; min-width: 0; }
.qa-ed { border-color: var(--accent); }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.credits { display: flex; flex-direction: column; gap: 8px; }
.credit-card { display: grid; grid-template-columns: 72px 1fr; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); align-items: start; }

ק מטרה\" בהתאם ליכולת גופנית","pdf":"sources/decks/B01_99516_presentation.pdf"},{"id":"SL-99517-001","topicId":"B02","deckId":"99517","slide":1,"excerpt":"מערכת השרירים","pdf":"sources/decks/B02_99517_presentation.pdf"},{"id":"SL-99517-002","topicId":"B02","deckId":"99517","slide":2,"excerpt":"השרירים חלק שלד לב רצוניים 500 סוגים בלתי רצוניים 300 סוגים בלתי רצוני בעלי יכולת להתכווץ: הפיכת אנרגיה כימית לאנרגיה מכנית","pdf":"sources/decks/B02_99517_presentation.pdf"},{"id":"SL-99517-003","topicId":"B02","deckId":"99517","slide":3,"excerpt":"תפקיד השרירים תנועת הגוף במרחב הנעת האיברים הפנימיים שיווי משקל ויציבה פעולת הלב פעולת הנשימה יצירת חום הגוף מאגר אנרגיה","pdf":"sources/decks/B02_99517_presentation.pdf"},{"id":"SL-99517-004","topicId":"B02","deckId":"99517","slide":4,"excerpt":"מבנה שרירי השלד מורכבים ממים (75%), חלבונים (20%) וחומרים אנאורגניים (5%) אחוזי המים בשריר יורדים בתהליך הגדילה: בעובר - 90% בתינוקות - 80% ואחוזי החלבון עולים. רקמת השריר בנויה מתאים שנראים כמו סיבים (Muscle fiber) התאים מסודרים בחבילות ומספר חבילות יוצרות שריר שלם כל תא בודד, כל חבילת תאים והשריר כולו עטופים ברקמת חיבור שההמשך שלה יוצר את הגיד המחבר את השריר לעצם","pdf":"sources/decks/B02_99517_presentation.pdf"},{"id":"SL-99517-005","topicId":"B02","deckId":"99517","slide":5,"excerpt":"מבנה תאי שריר שלד כמות סיבי השריר עולה בעובר ובתינוק עד גיל 4 חודשים. אורכו כאורך השריר. עטוף בסרקולמה היוצרת רשת תעלות T. מכיל הרבה גרעינים בהיקף (כמותם עולה בתוך הסיב במשך גדילתו לאורך-תאי לווין). מכיל מאגרי סידן (SR). מכיל 100-1000 מיופיברילות הבנויות מסרקומרים.","pdf":"sources/decks/B02_99517_presentation.pdf"},{"id":"SL-99517-006","topicId":"B02","deckId":"99517","slide":6,"excerpt":"מבנה הסרקומר יחידה תפקודית של תא השריר","pdf":"sources/decks/B02_99517_presentation.pdf"},{"id":"SL-99517-007","topicId":"B02","deckId":"99517","slide":7,"excerpt":"מנגנון הכיווץ גירוי עצבי שחרור אצטיל כולין קשירת Ach לרצפטור זרם יוני נטרן דרך סרקולמה ותעלות T שחרור הסידן מממאגרים תוך תאיים קשירת הסידן לטרופונין חשיפת אתרי קשירה על גבי האקטין קשירת ראש מיוזין לאקטין והזזתו ניתוק ראש מיוזין מאקטין (ATP) החזרת הסידן למאגרים (ATP) התקצרות הסרקומר כיווץ השרירי הרפיית השריר","pdf":"sources/decks/B02_99517_presentation.pdf"},{"id":"SL-99517-008","topicId":"B02","deckId":"99517","slide":8,"excerpt":"תיאוריית ההחלקה","pdf":"sources/decks/B02_99517_presentation.pdf"},{"id":"SL-99517-009","topicId":"B02","deckId":"99517","slide":9,"excerpt":"יחידה מוטורית היחידה הפיזיולוגית הקטנה ביותר האחראית על פיתוח הכוח. כוללת נוירון מוטורי אחד וכל תאי השריר המעוצבבים על ידו. עקרון \"הכל או לא כלום\": גירוי תת סיפי- אין כיווץ, גירוי על סיפי- כיווץ מקסימלי כמותן בשריר: 100-3000 שונות בין אישית: 50% ± יכולה להכיל מס' שונה של תאי שריר: 10-2000 (מוטריקה עדינה וגסה). מכילה תאי שריר מאותו סוג: אדום (סך גירוי נמוך) וורוד (סף גירו בינוני) לבן (סף גירוי גבוה)","pdf":"sources/decks/B02_99517_presentation.pdf"},{"id":"SL-99517-010","topicId":"B02","deckId":"99517","slide":10,"excerpt":"סוגי תאי שריר שלד Slow Twitch Fiber (ST) הסיבים האירוביים Fast Twitch Fiber (FT) הסיבים האנאירוביים Type II B Type II A \"סיבים ורודים\" יותר מיטוכונדריות יותר אינזימים אירוביים יותר סיבולת \"סיבים אדומים\" \"סיבים לבנים\" אנאירוביים טהורים Type I","pdf":"sources/decks/B02_99517_presentation.pdf"},{"id":"SL-99517-011","topicId":"B02","deckId":"99517","slide":11,"excerpt":"השוואה בין הסיבים המהירים והסיבים האיטיים","pdf":"sources/decks/B02_99517_presentation.pdf"},{"id":"SL-99517-012","topicId":"B02","deckId":"99517","slide":12,"excerpt":"השוואה בין הסיבים המהירים והסיבים האיטיים","pdf":"sources/decks/B02_99517_presentation.pdf"},{"id":"SL-99517-013","topicId":"B02","deckId":"99517","slide":13,"excerpt":"התפלגות הסיבים בגוף נקבעת גנטית לפי סוג הנוירון המוטורי. ברך הנולד: סיבים אדומים- 40%, סיבים ורודים- 35%, סיבים לבנים- 10%, שאר הסיבים לא מוגדרים- 15% עד גיל שנה עליה בעיקר באחוז הסיבים האדומים וירידה באחוז הסיבים הלא מוגדרים עד כ- 5% אינה משתנה כתוצאה מאימון. מצביעה על התאמה לספורט מסוים: ספורטאים אירוביים - יותר סיבים איטיים ספורטאים אנאירוביים - יותר סיבים מהירים אנשים רגילים - התפלגות שווה","pdf":"sources/decks/B02_99517_presentation.pdf"},{"id":"SL-99517-014","topicId":"B02","deckId":"99517","slide":14,"excerpt":"השפעת עוצמת הכיווץ על גיוס היחידות המוטוריות השונות אופן גיוס דומה גם לאורך הפעילויות הממושכות","pdf":"sources/decks/B02_99517_presentation.pdf"},{"id":"SL-99517-015","topicId":"B02","deckId":"99517","slide":15,"excerpt":"הסתגלות מערכת השרירים לאימוני סבולת וכוח היפרטרופיה (בני אדם) עלייה במסת השריר היפרפלזיה (חיות) עלייה בעובי תא השריר עלייה במספר תאי השריר","pdf":"sources/decks/B02_99517_presentation.pdf"},{"id":"SL-99517-016","topicId":"B02","deckId":"99517","slide":16,"excerpt":"התאמה לאימוני סיבולת עלייה בגודל המיטוכונדריות עלייה במספר המיטוכונדריות עלייה בריכוז האינזימים האירוביים עלייה במאגרי הגליקוגן והשומן עלייה בשימוש בשומן כמקור אנרגיה עלייה בריכוזי המיוגלובין עלייה בצפיפות נימי הדם עלייה קטנה בחתך הרוחב עליה ביכולת השריר להפיק אנרגיה במסלול האירובי ירידה בריכוז לקטט במאמץ נתון","pdf":"sources/decks/B02_99517_presentation.pdf"},{"id":"SL-99517-017","topicId":"B02","deckId":"99517","slide":17,"excerpt":"התאמה לאימוני כוח שיפור עצבי (עיקרי בתחילת תקופת האימון): יכולת לגייס יותר יחידות מוטוריות שיפור התזמון הגיוס היחידות המוטוריות שיפור שרירי (עיקרי בהמשך תקופת האימון): עלייה בכמות החלבונים המתכווצים עלייה במסת רקמות החיבור עלייה בכ- 20% בריכוזי ATP ו- CrP עלייה בכ- 70% במאגרי הגליקוגן עלייה בפעילות האינזימים האנאירוביים ירידה בצפיפות המיטוכונדריות ירידה בצפיפות הנימים היפרטרופיה בעיקר בסיבים המהירים (עד 50%), אך גם באיטיים","pdf":"sources/decks/B02_99517_presentation.pdf"},{"id":"SL-99517-018","topicId":"B02","deckId":"99517","slide":18,"excerpt":"כאבי שרירים מאוחרים Delayed Onset Muscle Soreness (DOMS) מופיעים בד\"כ יום או יומיים לאחר פעילות גופנית לא שגרתית מופיעים יותר לאחר מאמצים אקסצנטריים גורמים אפשריים: קרעים במעטפת תאי השריר פגיעה בחלבונים הקשורים לתהליך הכיווץ פגיעה ברקמות החיבור שבשריר בצקת מקומית עווית בשריר: שיבוש בזרימת הדם הצטברות חומרי פסולת גירוי קצות העצבי סיים כעבור מספר שעות מתום המאמץ באימון יתר: רמתו גבוהה יותר מהרגיל במנוחה (מצב קטבולי) רמתו עולה במידה לא מספקת במאמץ (פגיעה אפשרית במשאבת נתרן-אשלגן החשובה ליכולת התכווצות השריר) היחס בין רמת הטסטוסטרון החופשי לבין רמת הקורטיזול יורד ביותר מ-30% (ירידה בכוח השריר)","pdf":"sources/decks/B04_99519_presentation.pdf"},{"id":"SL-99519-017","topicId":"B04","deckId":"99519","slide":17,"excerpt":"Adrenal medulla הליבה - מפרישה הורמונים חלבוניים (לא סטרואידיים) אדרנלין (אפינפרין) נוראדרנלין (נוראפינפרין) מהווה 80% מהווה 20%","pdf":"sources/decks/B04_99519_presentation.pdf"},{"id":"SL-99519-018","topicId":"B04","deckId":"99519","slide":18,"excerpt":"אדרנלין ונוראדרנלין מופרשים בעקבות השפעת מעי העצבים על הבלוטה במצבי לחץ נפשי או גופני מגבירים את פעילות הלב מעלים את לחץ הדם מגבירים את פעילות מע' הנשימה (הרחבת הסמפונות) מגבירים את זרימת הדם לשרירים מגבירים את זרימת הדם לרקמת השומן ולכבד מעלים רמת הגלוקז וח. שומן בדם מגבירים הזעה מאטים את פע' מע' העיכול","pdf":"sources/decks/B04_99519_presentation.pdf"},{"id":"SL-99519-019","topicId":"B04","deckId":"99519","slide":19,"excerpt":"רמתם עולה ככל שדרגת המאמץ גבוהה יותר לבעלי כושר גופני טוב יותר רמתם נמוכה יותר במאמץ נתון באימון יתר: בשלב התחלתי - רמתם גבוהה יותר מהרגיל במנוחה ובמאמץ תת-מרבי (דופק ול\"ד גבוהים יותר מהרגיל) בהמשך - ירידה ברמת הרצפטורים (Down regulation) בהמשך - רמתם נמוכה יותר מהרגיל במנוחה ובמאמץ תת-מרבי רמתם נמוכה יותר מהרגיל במאמץ מרבי (עקב הירידה ביכולת הגליקוליטית וביצור לקטט) אדרנלין ונוראדרנלין","pdf":"sources/decks/B04_99519_presentation.pdf"},{"id":"SL-99519-020","topicId":"B04","deckId":"99519","slide":20,"excerpt":"בלוטת הלבלב (Pancreas) איבר מאורך הנמצא בחלק האחורי של חלל הבטן מאחורי הקיבה","pdf":"sources/decks/B04_99519_presentation.pdf"},{"id":"SL-99519-021","topicId":"B04","deckId":"99519","slide":21,"excerpt":"בלוטת הלבלב (Pancreas) לבלב אקסוקריני לבלב אנדוקריני מפריש את מיצי העיכול לתוך צינור העיכול מפריש הורמונים חלבוניים לזרם הדם גלוקגון אינסולין","pdf":"sources/decks/B04_99519_presentation.pdf"},{"id":"SL-99519-022","topicId":"B04","deckId":"99519","slide":22,"excerpt":"אינסולין- הורמון השובע מיוצר על ידי תאי בטא בלבלב מופרש בתגובה לעלייה ברמת הגלוקוז בדם גורם להכנסת הגלוקוז לתאים מוריד את רמת הגלוקוז בדם מעודד אגירה של חומרי המזון (בניית גליקוגן, טריגליצרידים, חלבונים) חיוני ליעילות של GH בעידוד בניית חלבונים במאמץ רמתו יורדת, אך כמות הרצפטורים בשרירי הפעיל עולה רמתו נמוכה יותר מהרגיל באימון יתר (ירידה ביכולת האנאבולית)","pdf":"sources/decks/B04_99519_presentation.pdf"},{"id":"SL-99519-023","topicId":"B04","deckId":"99519","slide":23,"excerpt":"ויסות הפרשת אינסולין עלייה ברמת גלוקוז בדם הפרשת אינסולין ירידה ברמת גלוקוז בדם דיכוי הפרשת אינסולין ארוחה משוב שלילי","pdf":"sources/decks/B04_99519_presentation.pdf"},{"id":"SL-99519-024","topicId":"B04","deckId":"99519","slide":24,"excerpt":"גלוקגון- הורמון הרעב מיוצר על ידי תאי אלפא בלבלב מופרש בתגובה לירידה ברמת הגלוקוז בדם מעלה את רמת הגלוקוז בדם מעודד פירוק מאגרי הגליקוגן, השומן והחלבון במאמץ רמתו עולה צום הפרשת גלוקגון דיכוי הפרשת גלוקגון עלייה ברמת הגלוקוז בדם פירוק המאגרים ירידה ברמת הגלוקוז בדם משוב שלילי","pdf":"sources/decks/B04_99519_presentation.pdf"},{"id":"SL-99519-025","topicId":"B04","deckId":"99519","slide":25,"excerpt":"בלוטות המין- Gonads אשכים שחלות אנדרוגנים (טסטוסטרון) אסטרוגנים ופרוגסטרון GNRH LH FSH הורמיני המין היפותלמוס בלוטות המין - - היפופיזה קדמית ((אדנו-היפופיזה הורמונים סטרואידיים","pdf":"sources/decks/B04_99519_presentation.pdf"},{"id":"SL-99519-026","topicId":"B04","deckId":"99519","slide":26,"excerpt":"מווסתים את היצור של הורמוני המין ושל תאי המין (זרע/ביצית) בבלוטות המין. מווסתים את הגדילה והתפתחות של בלוטות המין: משקל האשכים עולה קצת בשנתיים הראשונות לחיים ואז נשאר ללא שינוי עד גיל ההתבגרות שבמהלכו עולה פי 10 משקל השחלות עולה באופן הדרגתי יותר במשך הילדות וגיל ההתבגרות. רמות FSH ו- LH בתינוקות: עד גיל שנתיים רמת FSH בבנות גבוהה יותר מזו של הבנים תוך כדי שהיא יורדת בהדרגה עד גיל שנה יש שונות רבה מאוד ברמות LH ללא הבדלים בין המינים עד גיל 9-10 רמות FSH ו- LH נמוכות ויציבות ללא הבדלים מהותיים בין המינים ועולות בצורה ניכרת במהלך גיל ההתבגרות. בסוף גיל ההתבגרות הפרשת FSH ו- LH בבנות מקבלת אופי מחזורי ומתייצבת בבנים בגיל הפסקת הווסת בנשים יש עליה דרסטית ברמות FSH (פי 10) גונדוטרופינים: FSH ו- LH","pdf":"sources/decks/B04_99519_presentation.pdf"},{"id":"SL-99519-027","topicId":"B04","deckId":"99519","slide":27,"excerpt":"הורמוני המין אנדרוגנים (טסטוסטרון) אסטרוגנים ופרוגסטרון יצירת איברי מין חיצוניים גבריים בעובר הופעת סימני מין מישניים גבריים בגיל ההתבגרות (שיעור, גדילת שרירים, עיבוי הקול) יצור זרע וקיום הזקפה גדילת עצמות לאורך ביחד עם GH, עליה בצפיפות עצם (הגברת פעילות תאי בוני עצם) עידוד הפרשת GH התפתחות אברי המין הנשיים בעובר הופעת סימני מין משניים נשיים בגיל ההתבגרות (עליה באחוזי השומן, התפלגות השומן) ביחד עם LH ו- FSH אחראים על ויסות מחזור הביוץ של האישה עליה בצפיפות עצם (הגברת פעילות תאי בוני עצם), עידוד התגרמות עצמות (סגירת פלטות הגדילה) עידוד הפרשת GH","pdf":"sources/decks/B04_99519_presentation.pdf"},{"id":"SL-99519-028","topicId":"B04","deckId":"99519","slide":28,"excerpt":"בתינוקות: עד גיל שנה רמת הטסטוסטרון בבנים גבוהה יותר מזו של הבנות תוך כדי שהיא יורדת בהדרגה אין הבדלים ברמת האסטרדיול בין בנים לבנות עד גיל 12-10 רמות הורמוני המין נמוכות ויציבות ללא הבדלים מהותיים בין המינים במהלך גיל ההתבגרות: בבנים - הפרשת הטסטוסטרון עולה באופן ניכר ויש גם עליה קלה ברמת האסטרדיול בבנות - הפרשת האסטרדיול עולה באופן ניכר ללא שינוי ברמות הטסטוסטרון בסוף גיל ההתבגרות רמות הטסטוסטרון בבנים ממשיכות לעלות עוד קצת ורמות האסטרדיול בבנות מקבלות אופי מחזורי הורמוני המין","pdf":"sources/decks/B04_99519_presentation.pdf"},{"id":"SL-99519-029","topicId":"B04","deckId":"99519","slide":29,"excerpt":"טסטוסטרון ואימון גופני מעודד היפרטרופיה של השריר מפעיל את האינזים הבונה גליקוגן (התאוששות) רמתו עולה בתגובה למאמץ בודד ביחס ישיר לאורך המאמץ, לעוצמתו ולמסת השריר המעורבת בו רמתו יורדת בתגובה למאמץ בודד ארוך מאוד (מעל 3 שעות) ונשארת נמוכה מספר שעות ואף ימים לאחר תום המאמץ באימון יתר רמתו יורדת בשני המינים עקב דיכוי הפרשת GNRH בהיפותלמוס ודיכוי הפרשת LH בהיפופיזה (ירידה בפריון)","pdf":"sources/decks/B04_99519_presentation.pdf"},{"id":"SL-99519-030","topicId":"B04","deckId":"99519","slide":30,"excerpt":"נמצאת בתוך קופסת הגולגולת בקרבת היפותלמוס בתוך שקע ברצפת הגולגולת שנקרא \"האוכף הטורקי\" היפופיזה - בלוטת יותרת המוח","pdf":"sources/decks/B04_99519_presentation.pdf"},{"id":"SL-99519-031","topicId":"B04","deckId":"99519","slide":31,"excerpt":"היפופיזה - בלוטת יותרת המוח מזכירה בצורתה תאנה מורכבת מגוף ומגבעול משקלה כחצי גרם גודלה מספר מילימטרים מחולקת לשני חלקים: קדמי (אדנו-היפופיזה)- מייצר ומפריש הורמונים בהשפעת היפותלמוס אחורי (נוירו-היפופיזה)- מפריש הורמונים המיוצרים בהיפותלמוס","pdf":"sources/decks/B04_99519_presentation.pdf"},{"id":"SL-99519-032","topicId":"B04","deckId":"99519","slide":32,"excerpt":"החלק הקדמי של היפופיזה ((אדנו-היפופיזה מפריש הורמונים מעודדים בהשפעת הורמונים משחררים היפותלמוס: (הורמונים משחררים) היפופיזה חלק קדמי: (הורמונים מעודדים) בלוטה פריפרית: (הורמוני מטרה) TRH GNRH LH FSH TSH ACTH CRH בלוטת המגן בלוטת אדרנל אשכים ושחלות - -","pdf":"sources/decks/B04_99519_presentation.pdf"},{"id":"SL-99519-033","topicId":"B04","deckId":"99519","slide":33,"excerpt":"מפריש הורמוני מטרה בהשפעת הורמונים מהיפותלמוס היפותלמוס: היפופיזה חלק קדמי: איבר המטרה: + + - - GHRH Prolactin PIH PRH GH GHIH כל תאי הגוף בלוטות בשד החלק הקדמי של היפופיזה ((אדנו-היפופיזה","pdf":"sources/decks/B04_99519_presentation.pdf"},{"id":"SL-99519-034","topicId":"B04","deckId":"99519","slide":34,"excerpt":"הורמון הגדילה - GH מופרש במנות כל כמה שעות בעיקר בלילה בשינה עמוקה רמתו עולה לאורך ילדות, מגיעה לשיאה בגיל ההתבגרות ויורדת בהדרגה בהמשך החיים הבוגרים. גורם לתאי הכבד לייצר ולהפריש גורם גדילה IGF-1, אשר מתווך את מרבית הפעולות האנאבוליות של GH: חיוני לגדילת הגוף (בעיקר עצמות ושרירים) מעודד חלוקת תאים (תאי סחוס בלוחיות הגדילה) מגביר כניסת ח. אמינו לתאים מעודד בניית חלבונים בתאים וחידוש רקמות מגביר שימוש בשומנים כמקור אנרגיה: מעודד פירוק טריגליצרידים במאגרי השומן מעודד פירוק ח. שומן בתאים הפעילים מעלה רמת הסוכר בדם לטובת המוח מעלה פירוק גליקוגן בכבד","pdf":"sources/decks/B04_99519_presentation.pdf"},{"id":"SL-99519-035","topicId":"B04","deckId":"99519","slide":35,"excerpt":"השפעת האימון על GH ו-IGF-1 מאמץ גופני בודד מעלה את הרמות של GH ו-IGF-1 למבוגרים ומתבגרים בעלי כושר גופני טוב יותר יש רמות גבוהות יותר של IGF-1 בשלבי האימון הראשוניים יש ירידה ברמות IGF-1 בילדים ומתבגרים, למרות השיפור שמתרחש ביכולת הגופנית (מנגנון פיצוי- המשאבים האנרגטיים מופנים יותר לשריר הפעיל במחיר של האטה בגדילה הכללית) בשלבי האימון המאוחרים יותר (מספר חודשים עד שנה) יש עליה ברמות IGF-1 בילדים ומתבגרים עם האימון אינטנסיבי מידי נמשך זמן רב בליווי תזונה לא מספקת, אז ההאטה בגדילה תהפוך לבלתי הפיכה. יש להקפיד על מחזוריות והדרגתיות בעומס האימונים","pdf":"sources/decks/B04_99519_presentation.pdf"},{"id":"SL-99519-036","topicId":"B04","deckId":"99519","slide":36,"excerpt":"פרולקטין חיוני ליצור חלב באישה מניקה: רמת PRH עולה במהלך היריון פעולת ההנקה מורידה את רמת PIH מושפע בעיקר משינוים ברמות PIH רמות PRH ו- PIHמושפעות מהורמוני המין הפרשת יתר (עודף PRH, חוסר PIH, גידול בהיפופיזה): הפרשת חלב באישה לא מניקה הפרעות במחזור החודשי הפרעות בזיקפה","pdf":"sources/decks/B04_99519_presentation.pdf"},{"id":"SL-99519-037","topicId":"B04","deckId":"99519","slide":37,"excerpt":"החלק האחורי של היפופיזה נוירו-היפופיזה אוגר ומפריש הורמונים המיוצרים בהיפותלמוס ההורמונים נוצרים בנוירונים שהסומות שלהם יושבות בהיפותלמוס ההורמונים עוברים לאורך האקסון ונאגרים בקצהו הנמצא בהיפופיזה ההורמונים מופרשים לזרם הדם בעקבות הגירוי העצבי","pdf":"sources/decks/B04_99519_presentation.pdf"},{"id":"SL-99519-038","topicId":"B04","deckId":"99519","slide":38,"excerpt":"הורמונים המופרשים מן החלק האחורי של היפופיזה Antidiuretic Hormone - A.D.H - משתתף בויסות משק המים בגוף דרך השפעתו על הכליות (מונע איבוד נוגלים בשתן) Oxytocin - גורם לכיווץ שרירי הרחם ולהפרשת חלב בנשים מניקות","pdf":"sources/decks/B04_99519_presentation.pdf"},{"id":"SL-99519-039","topicId":"B04","deckId":"99519","slide":39,"excerpt":"Antidiuretic Hormone - A.D.H אוסמולריות הדם- ריכוז סך המומסים בפלזמה אוסמורצפטורים- קולטנים בהי ם לבנים אחרים משתתפים בתהליכי דלקת ואלרגיה","pdf":"sources/decks/B05_99520_presentation.pdf"},{"id":"SL-99520-011","topicId":"B05","deckId":"99520","slide":11,"excerpt":"מונוציטים- Monocytes מהווים כ- 10% מכלל תאי הדם הלבנים בעלי גרעין דמוי פרסה חיים מספר שנים ברקמות הופכים למאקרופגים (big eaters) תפקידם לבלוע ולפרק גורמים זרים ורקמות פגועות בעלי גרנולות (ליזוזומים) עם אינזימים מעכלים מפרישים חומרים שמווסתים את פעי מערכת החיסון (גיוס תאים נוספים)","pdf":"sources/decks/B05_99520_presentation.pdf"},{"id":"SL-99520-012","topicId":"B05","deckId":"99520","slide":12,"excerpt":"לימפוציטים- Lymphocytes מהווים כ- 25% מכלל תאי הדם הלבנים הקטנים מבין תאי הדם הלבנים בעלי גרעין עגול גדול מתחלקים לשתי קבוצות: תאי T – פועלים באופן ישיר תאי B – מייצרים נוגדנים","pdf":"sources/decks/B05_99520_presentation.pdf"},{"id":"SL-99520-013","topicId":"B05","deckId":"99520","slide":13,"excerpt":"נוגדנים חלבונים המיוצרים על ידי תאי B בעלי גוף ושתי זרועות נקשרים באופן ספציפי לאנטיגן (מולקולה או מבנה בגוף זר המעוררים תגובה חיסונית) גוף זר אחד (חיידק) מכיל מספר מבנים שונים (אנטיגנים) ולכן כנגד כל גוף זר ישנם מספר סוגי נוגדנים","pdf":"sources/decks/B05_99520_presentation.pdf"},{"id":"SL-99520-014","topicId":"B05","deckId":"99520","slide":14,"excerpt":"תאי B נוצרים בסמוך ללידה ולאחריה מייצרים נוגדנים- רצפטורים (כל סוג ספציפי של נוגדן מיוצר על ידי סוג ספציפי של תאי B) ישנם המון סוגים נודדים גם לקשריות לימפה, לטחול ולכבד לא פעילים פעילים מפגש עם אנטיגן ספציפי מתחלקים מהר ויוצרים שתי קבוצות של תאים: תאי פלזמה – מייצרים ומפרישים נוגדנים ספציפיים לדם (חיים כמה ימים) תאי זיכרון - נשארים בקשריות לימפה, בטחול ובכבד (הופכים לתאי פלזמה במפגש חוזר עם אותו האנטיגן)- חיים הרבה שנים","pdf":"sources/decks/B05_99520_presentation.pdf"},{"id":"SL-99520-015","topicId":"B05","deckId":"99520","slide":15,"excerpt":"פעולת הנוגדנים הפיכת הרעלן לחומר שאינו מזיק לגוף גיוס מהיר של תאים בולעניים הנקשרים לנוגדן הקשור לאנטיגן חשיפת אתר קשירה על גבי הנוגדן עבור מערכת החלבונים הנקראת משלים (Complement) ההורסת את הפולש היקשרות הנו esentation.pdf"},{"id":"SL-99520-031","topicId":"B05","deckId":"99520","slide":31,"excerpt":"תפקידי הטחול סינון הדם בעזרת: מאקרופאגים (בליעה ופירוק הגורם הזר) לימפוציטים (יצור נוגדנים והרס ישיר) הגנה סילוק תאי דם אדומים וטסיות מאגר דם יצירת תאי דם אדומים בליעת תאיי דם זקנים ופגועים ע\" מאקרופאגים שחרור תוצרי פירוק ההמוגלובין למח עצם ולכבד כיווץ הקפסולה עקב גירוי סימפטטי (דימום) יציאת הדם למחזור הדם בעיקר בשלב העוברות במצבים קיצוניים של איבוד דם (אנמיה)","pdf":"sources/decks/B05_99520_presentation.pdf"},{"id":"SL-99520-032","topicId":"B05","deckId":"99520","slide":32,"excerpt":"התימוס - Thymus איבר שטוח בעל שתי אונות נמצא בין עצם החזה לבין קרום הלב בילוד מגיע לגודלו המרבי ביחס לגוף ממשיך להתפתח עד גיל ההתבגרות (35-40 גר') מתנוון מגיל ההתבגרות והילך","pdf":"sources/decks/B05_99520_presentation.pdf"},{"id":"SL-99520-033","topicId":"B05","deckId":"99520","slide":33,"excerpt":"התימוס - Thymus עטוף בקפסולה סיבית כל אונה מחולקת לתתי מבנים בכל תת מבנה יש קליפה וליבה כל תת מבנה בנוי מתאי אפיתל כל תת מבנה מכיל הרבה לימפוציטים","pdf":"sources/decks/B05_99520_presentation.pdf"},{"id":"SL-99520-034","topicId":"B05","deckId":"99520","slide":34,"excerpt":"תפקיד התימוס הבשלת מערכת החיסון אתר אחרון בהתפתחות לימפוציטים מסוג T הפרשת הורמונים המאפשרים הפיכת לימפוציטים ראשוניים לתאי T בוגרים","pdf":"sources/decks/B05_99520_presentation.pdf"},{"id":"SL-99520-035","topicId":"B05","deckId":"99520","slide":35,"excerpt":"קשריות הלימפה מבנים אובליים הנמצאים על צינורות הלימפה קוטרן 1-20 מ\"מ עטופות בקפסולה סיבית מכילות קבוצות של לימפוציטים המוקפות בסינוסים הסינוסים בנויים מרקמה רשתית ועליה מקרופאגים","pdf":"sources/decks/B05_99520_presentation.pdf"},{"id":"SL-99520-036","topicId":"B05","deckId":"99520","slide":36,"excerpt":"מעבר נוזל הלימפה בתוך קשריות הלימפה כניסת הלימפה (afferent) מעבר בתוך הסינוסים יציאת הלימפה (efferent)","pdf":"sources/decks/B05_99520_presentation.pdf"},{"id":"SL-99520-037","topicId":"B05","deckId":"99520","slide":37,"excerpt":"תפקיד קשריות הלימפה סינון נוזל הלימפה העובר sources/decks/B05_99520_presentation.pdf"},{"id":"SL-99520-045","topicId":"B05","deckId":"99520","slide":45,"excerpt":"ויסות נוזלי הגוף הנוזל העובר מהנימים לתווך הבין תאי נספג בתאים חוזר לנימים מצטבר בין התאים מתנקז לכלי הלימפה חוזר לדם דרך הורידים","pdf":"sources/decks/B05_99520_presentation.pdf"},{"id":"SL-99520-046","topicId":"B05","deckId":"99520","slide":46,"excerpt":"ויסות נוזלי הגוף חלבוני הפלזמה (אלבומין) 8% מנפח הפלזמה יוצרים לחץ אוסמוטי של הפלזמה 50% דולפים לנוזל הבין תאי במשך היממה לחץ אוסמוטי של הפלזמה יורד חודרים לנימי הלימפה חוזרים לדם דרך הורידים לחץ אוסמוטי של הפלזמה עולה","pdf":"sources/decks/B05_99520_presentation.pdf"},{"id":"SL-99520-047","topicId":"B05","deckId":"99520","slide":47,"excerpt":"נוזל הלימפה נוזל שקוף מקורו בנוזל החוץ תאי (נוזל הבין תאי ונוזל הפלזמה) אינו כולל כדוריות דם אדומות כולל תאי דם לבנים כולל שומנים וחלבונים (ריכוז נמוך יותר מאשר בפלזמה) איזוטוני עם הנוזל הבין תאי המקומי אינו נקרש","pdf":"sources/decks/B05_99520_presentation.pdf"},{"id":"SL-99520-048","topicId":"B05","deckId":"99520","slide":48,"excerpt":"כלי הלימפה רשת נימי הלימפה נוזל בין תאי כלי לימפה קטנים כלי לימפה בינוניים Right lymphatic ducts כלי לימפה גדולים Thoracic duct Left subclavian vein Right subclavian vein","pdf":"sources/decks/B05_99520_presentation.pdf"},{"id":"SL-99520-049","topicId":"B05","deckId":"99520","slide":49,"excerpt":"נוזל הלימפה ב- Thoracic duct תערובת הלימפה מרוב חלקי הגוף 2.5-2.8 ליטר ביום מורכב ב- 50% מנוזל הלימפה המגיע מהכבד ומהמעי הדק ריכוז החלבונים 4 גר' / 100 מ\"ל (כפול מזה שבנוזל בין תאי טיפוסי)","pdf":"sources/decks/B05_99520_presentation.pdf"},{"id":"SL-99520-050","topicId":"B05","deckId":"99520","slide":50,"excerpt":"הדופן של נימי הלימפה בנויה מאפיתל חד שכבתי שטוח מאופיינת במרווחים בין תאי האפיתל הסמוכים מאפשרת כניסה של נוזלים, חלקיקים ותאים כוללת מסתמים חד כיווניים","pdf":"sources/decks/B05_99520_presentation.pdf"},{"id":"SL-99520-051","topicId":"B05","deckId":"99520","slide":51,"excerpt":"TUNICA ADVENTITA רקמת חיבור צפופה מסתם חד כיווני TUNICA MEDIA שריר חלק ELASTIC TISSUE TUNICA INTIMA אפיתל חד שכבתי שטוח הדופן של כלי הלימפה דומה לדופן הוריד:","pdf":"sources/decks/B05_99520_presentation.pdf"},{"id":"SL-99520-052","topicId":"B05","deckId":"99520","slide":52,"excerpt":"הדופן של כלי הלימפה בהשוואה לדופן הוריד: דקה יותר מחולקת לשכבות פחות מוגדרות כוללת יותר מסתמים (כל כמה מ\"מ) מקוטעת ע\" קשריות הלימפה","pdf":"sources/decks/B05_99520_presentation.pdf"},{"id":"SL-99520-053","topicId":"B05","deckId":"99520","slide":53,"excerpt":"זרימת הלימפה בקצב של 125 מ\"ל/ שעה מתקיימת למרות: היעדר איבר הפועל כמשאבה השפעת כוח הכובד מתקיימת בזכות: מסתמים חד כיווניים כיווץ שרירים חלקים שבדופן כלי הלימפה פעולת שרירי השלד פעולת הנשימה תנועתיות דופן העורקים הסמוכים","pdf":"sources/decks/B05_99520_presentation.pdf"},{"id":"SL-99520-054","topicId":"B05","deckId":"99520","slide":54,"excerpt":"מערכת החיסון ופעילות גופנית פעילות גופנית חובבנית משפיעה לטובה על מערכת החיסון. תוכנית אימונים תובענית עלולה לפגוע בתפקוד מערכת החיסון ולהגביר את הנטייה לחלות במחלות זיהומיות (בעיקר ויראליות). זיהומים נפוצים: בדרכי הנשימה העליונות ובדרכי העיכול. המשך האימונים בזמן המחלה עלול לגרום להתארכותה או להחמרת תסמיניה: דלקת ריאות לאחר זיהום ויראלי בדרכי הנשימה העליונות. דלקת שריר הלב לאחר זיהום ויראלי בדרכי העיכול.","pdf":"sources/decks/B05_99520_presentation.pdf"},{"id":"SL-99520-055","topicId":"B05","deckId":"99520","slide":55,"excerpt":"מערכת החיסון ופעילות גופנית תגובה למאמץ רגיל: עליה במספר הכולל של כדוריות דם לבנות במחזור הדם (שחרורן מטחול, מח עצם) בהשפעת הורמוני הלחץ. העלייה של הלימפוציטים המדכאים (T suppressor) גדולה יותר מזו של הלימפוציטים המסייעים (T helper). תגובה למאמץ ממושך מאוד/ תקופת עומס: מאגרי כדוריות הדם הלבנות מידלדלים ורמתן בדם יורדת. ירידה במספר הנוגדנים וביכולתם להגיב לנוכחות מזהמים שונים. ירידה ביכולת התאים הבולעניים לנוע לעבר המזהם. השינויים בתפקוד מערכת החיסון נמשכים עד כ-24 שעות מתום המאמץ (\"חלון הזדמנויות\")","pdf":"sources/decks/B05_99520_presentation.pdf"},{"id":"SL-99520-056","topicId":"B05","deckId":"99520","slide":56,"excerpt":"לבצע חיסונים כנגד מזהמים שכיחים. שינה מספקת תזונה מאוזנת אין הוכחות חד משמעיות לגבי יעילות תוספי המזון: תוספת ויטמינים (C,E) :שיפור בתפקוד התאים הבולעניים. שימוש בתכשירי חלב פרוביוטיים: מניעת זיהומים במערכת העיכול. חיזוק מערכת החיסון","pdf":"sources/decks/B05_99520_presentation.pdf"}],"mcq":[{"id":"PB-Q-001","topicId":"B01","conceptId":"PB-C-001","difficulty":"intermediate","kind":"concept","question":"איזה מסלול מתאר את המחזור הריאתי?","options":["חדר שמאל → רקמות → עלייה ימין","חדר ימין → ריאות → עלייה שמאל","חדר ימין → רקמות → עלייה שמאל","עלייה שמאל → רקמות → חדר ימין"],"correctIndex":1,"explanation":"החדר הימני שולח דם לריאות, ומהריאות הוא שב לעלייה השמאלית.","sourcePages":[53],"sourceKind":"course_paraphrase","tags":["course-part-b"]},{"id":"PB-Q-002","topicId":"B01","conceptId":"PB-C-002","difficulty":"advanced","kind":"concept","question":"איזה מסלול מתאר את המחזור הגדול?","options":["חדר שמאל → ריאות → עלייה ימין","חדר שמאל → רקמות הגוף → עלייה ימין","עלייה ימין → עורק ריאה → עלייה שמאל","חדר ימין → ריאות → עלייה שמאל"],"correctIndex":1,"explanation":"המחזור המערכתי מעביר דם מחומצן אל רקמות הגוף, ומחזיר דם ורידי אל העלייה הימנית.","sourcePages":[53],"sourceKind":"course_paraphrase","tags":["course-part-b"]},{"id":"PB-Q-003","topicId":"B01","conceptId":"PB-C-003","difficulty":"basic","kind":"concept","question":"מה מגדיר כלי דם כעורק?","options":["בכל מצב הוא מכיל מסתמים","זרימת הדם בו היא מן הלב החוצה","בכל מצב הדם בו עשיר בחמצן","הוא מוביל דם רק לריאות"],"correctIndex":1,"explanation":"עורק מוגדר לפי כיוון הזרימה, ולא לפי רמת החמצן.","sourcePages":[53],"sourceKind":"course_paraphrase","tags":["course-part-b"]},{"id":"PB-Q-004","topicId":"B01","conceptId":"PB-C-004","difficulty":"intermediate","kind":"concept","question":"מה מגדיר כלי דם כווריד?","options":["הוא תמיד חסר מסתמים","הוא מחזיר דם אל הלב","הוא תמיד דל חמצן","הוא תמיד קטן מעורק"],"correctIndex":1,"explanation":"ורידים מחזירים דם אל הלב, גם ורידי הריאה המחזירים דם עשיר בחמצן."," יזה ציר מוביל להפרשת קורטיזול?","back":"CRH → ACTH → Cortisol","detail":"ראו המערכת האנדוקרינית, מצגת אירה שקד, שקף 15. CRH בהיפותלמוס מעודד ACTH בהיפופיזה, שמפעיל את הקליפה. (מקור: המערכת האנדוקרינית, שקף 15.)","sourcePages":[],"sourceDeck":"99519","sourceSlides":[15],"conceptId":"PB-SLIDE-99519-15","type":"slide_focus"},{"id":"PB-FC-232","topicId":"B04","front":"איזה הורמון מופרש מליבת יותרת הכליה?","back":"Adrenaline","detail":"ראו המערכת האנדוקרינית, מצגת אירה שקד, שקף 17. הליבה מפרישה קטכולאמינים, בעיקר אדרנלין ונוראדרנלין. (מקור: המערכת האנדוקרינית, שקף 17.)","sourcePages":[],"sourceDeck":"99519","sourceSlides":[17],"conceptId":"PB-SLIDE-99519-17","type":"slide_focus"},{"id":"PB-FC-233","topicId":"B04","front":"איזו תגובה אופיינית לאדרנלין במאמץ?","back":"האצת פעילות הלב והרחבת סמפונות","detail":"ראו המערכת האנדוקרינית, מצגת אירה שקד, שקף 18. התגובה המהירה מסייעת להעמיד חמצן ודלק לרשות השרירים. (מקור: המערכת האנדוקרינית, שקף 18.)","sourcePages":[],"sourceDeck":"99519","sourceSlides":[18],"conceptId":"PB-SLIDE-99519-18","type":"slide_focus"},{"id":"PB-FC-234","topicId":"B04","front":"איזו הבחנה נכונה לגבי תפקודי הלבלב?","back":"גם הפרשה אנדוקרינית וגם אקסוקרינית","detail":"ראו המערכת האנדוקרינית, מצגת אירה שקד, שקף 20. מיצי עיכול עוברים דרך צינור והורמונים נכנסים לדם. (מקור: המערכת האנדוקרינית, שקף 20.)","sourcePages":[],"sourceDeck":"99519","sourceSlides":[20],"conceptId":"PB-SLIDE-99519-20","type":"slide_focus"},{"id":"PB-FC-235","topicId":"B04","front":"מה מופרש מתאי בטא בלבלב?","back":"Insulin","detail":"ראו המערכת האנדוקרינית, מצגת אירה שקד, שקף 22. תאי Beta מייצרים אינסולין, הקשור לירידת גלוקוז בדם. (מקור: המערכת האנדוקרינית, שקף 22.)","sourcePages":[],"sourceDeck":"99519","sourceSlides":[22],"conceptId":"PB-SLIDE-99519-22","type":"slide_focus"},{"id":"PB-FC-236","topicId":"B04","front":"מה מופרש מתאי אלפא בלבלב?","back":"Glucagon","detail":"ראו המערכת האנדוקרינית, מצגת אירה שקד, שקף 24. תאי Alpha מפרישים גלוקגון, המעלה זמינות גלוקוז. (מקור: המערכת האנדוקרינית, שקף 24.)","sourcePages":[],"sourceDeck":"99519","sourceSlides":[24],"conceptId":"PB-SLIDE-99519-24","type":"slide_focus"},{"id":"PB-FC-237","topicId":"B04","front":"איזו תגובה אופיינית לאחר ארוחה שעולה בה גלוקוז בדם?","back":"עלייה בהפרשת אינסולין","detail":"ראו המערכת האנדוקרינית, מצגת אירה שקד, שקף 22. אינסולין מסייע בקליטת גלוקוז ובהורדת רמתו בדם. (מקור: המערכת האנדוקרינית, שקף 22.)","sourcePages":[],"sourceDeck":"99519","sourceSlides":[22],"conceptId":"PB-SLIDE-99519-22","type":"slide_focus"},{"id":"PB-FC-238","topicId":"B04","front":"באיזה מצב צפויה עלייה בגלוקגון?","back":"ירידה בגלוקוז הדם בזמן צום","detail":"ראו המערכת האנדוקרינית, מצגת אירה שקד, שקף 24. גלוקגון מסייע לעלות את זמינות הגלוקוז בעת מחסור. (מקור: המערכת האנדוקרינית, שקף 24.)","sourcePages":[],"sourceDeck":"99519","sourceSlides":[24],"conceptId":"PB-SLIDE-99519-24","type":"slide_focus"},{"id":"PB-FC-239","topicId":"B04","front":"מהו רצף מרכזי לבקרת הורמוני מין?","back":"GnRH → LH/FSH → בלוטות המין","detail":"ראו המערכת האנדוקרינית, מצגת אירה שקד, שקף 25. היפותלמוס מפעיל דרך ההיפופיזה הקדמית את הגונדות. (מקור: המערכת האנדוקרינית, שקף 25.)","sourcePages":[],"sourceDeck":"99519","sourceSlides":[25],"conceptId":"PB-SLIDE-99519-25","type":"slide_focus"},{"id":"PB-FC-240","topicId":"B04","front":"מהו הבדל בין חלקי ההיפופיזה?","back":"הקדמית מייצרת הורמונים; האחורית משחררת הורמונים שנוצרו בהיפותלמוס","detail":"ראו המערכת האנדוקרינית, מצגת אירה שקד, שקף 31. Neurohypophysis אוגרת ומשחררת בעיקר ADH ואוקסיטוצין שנוצרו בהיפותלמוס. (מקור: המערכת האנדוקרינית, שקף 31.)","sourcePages":[],"sourceDeck":"99519","sourceSlides":[31],"conceptId":"PB-SLIDE-99519-31","type":"slide_focus"},{"id":"PB-FC-241","topicId":"B04","front":"מה הקשר בין GH ל-IGF-1?","back":"GH מגביר ייצור IGF-1 המתווך השפעות גדילה","detail":"ראו המערכת האנדוקרינית, מצגת אירה שקד, שקף 34. GH מההיפופיזה הקדמית מעודד יצירת IGF-1, בעיקר בכבד. (מקור: המערכת האנדוקרינית, שקף 34.)","sourcePages":[],"sourceDeck":"99519","sourceSlides":[34],"concept
