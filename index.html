<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>לומדים פיזיולוגיה עם עפר</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="מרכז לימוד אינטראקטיבי לפיזיולוגיה של המאמץ, חלק א׳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app shell — sticky top bar, side nav from 960px, bottom tab bar on phones; one reading column up to 780px. */
:root {
  --bg: #f3f6f5;
  --surface: #ffffff;
  --surface-2: #eaf1ee;
  --ink: #12302a;
  --ink-2: #4a605b;
  --ink-3: #6f827d;
  --line: #d6e1dd;
  --accent: #0f6b5c;
  --accent-ink: #0b5649;
  --accent-soft: #dcefe9;
  --on-accent: #ffffff;
  --warm: #b85c1e;
  --warm-soft: #fbece0;
  --reco-eyebrow: #f4a873;
  --ok: #1d7446;
  --ok-soft: #e1f3e8;
  --bad: #b1352c;
  --bad-soft: #fbe6e3;
  --flag: #8a5a00;
  --flag-soft: #fbf0d6;
  --sys-p: #c7621d;
  --sys-g: #a33a6f;
  --sys-a: #1f6aa5;
  --sys-t: #0f6b5c;
  --shadow: 0 1px 2px rgb(18 48 42 / .06), 0 4px 14px rgb(18 48 42 / .06);
  --f-display: "Frank Ruhl Libre", "David", "Times New Roman", serif;
  --f-body: "IBM Plex Sans Hebrew", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  --r: 14px;
  --r-s: 10px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1715; --surface: #15211e; --surface-2: #1b2b27; --ink: #e2ede9; --ink-2: #a3b8b2; --ink-3: #82978f; --line: #2a3d38;
    --accent: #4dbfa5; --accent-ink: #7fd6c1; --accent-soft: #163a32; --on-accent: #062621;
    --warm: #f0a064; --warm-soft: #3a2618; --reco-eyebrow: #9a4a12; --ok: #67d095; --ok-soft: #133524; --bad: #f2877d; --bad-soft: #3d1b18;
    --flag: #f0c35a; --flag-soft: #3a2e10; --sys-p: #f0995a; --sys-g: #e277ad; --sys-a: #6fb1e8; --sys-t: #4dbfa5;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1715; --surface: #15211e; --surface-2: #1b2b27; --ink: #e2ede9; --ink-2: #a3b8b2; --ink-3: #82978f; --line: #2a3d38;
  --accent: #4dbfa5; --accent-ink: #7fd6c1; --accent-soft: #163a32; --on-accent: #062621;
  --warm: #f0a064; --warm-soft: #3a2618; --reco-eyebrow: #9a4a12; --ok: #67d095; --ok-soft: #133524; --bad: #f2877d; --bad-soft: #3d1b18;
  --flag: #f0c35a; --flag-soft: #3a2e10; --sys-p: #f0995a; --sys-g: #e277ad; --sys-a: #6fb1e8; --sys-t: #4dbfa5;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-ink); }
bdi { unicode-bidi: isolate; }
:focus-visible { outline: 3px solid var(--warm); outline-offset: 2px; border-radius: 6px; }
.skip { position: absolute; inset-inline-start: 8px; top: -60px; background: var(--accent); color: var(--on-accent); padding: 8px 12px; border-radius: 8px; z-index: 50; }
.skip:focus { top: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1200px; margin-inline: auto; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; text-align: start; min-width: 0; }
.brand-txt { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.brand-txt b { font-family: var(--f-display); font-size: clamp(1rem, 4.4vw, 1.2rem); font-weight: 900; letter-spacing: .01em; }
.brand-txt small { color: var(--ink-3); font-size: .75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.store-chip { flex: none; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); border-radius: 999px; padding: 4px 10px; font-size: .75rem; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; }
.store-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.store-chip[data-s="account"] .dot { background: var(--ok); }
.store-chip[data-s="local"] .dot { background: var(--flag); }
.store-chip[data-s="none"] .dot { background: var(--bad); }

.shell { max-width: 1200px; margin-inline: auto; display: grid; grid-template-columns: 1fr; }
main { min-width: 0; padding-block: 20px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main:focus { outline: none; }
.view { max-width: 780px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
.side { display: none; }
.bottom { position: fixed; inset: auto 0 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.bottom button { background: none; border: 0; min-height: var(--nav-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .72rem; color: var(--ink-3); padding: 6px 2px; }
.bottom button svg, .side button svg { width: 22px; height: 22px; }
.bottom button[aria-current="page"] { color: var(--accent-ink); font-weight: 600; }
.bottom button[aria-current="page"] svg { stroke: var(--accent); }
@media (min-width: 960px) {
  .shell { grid-template-columns: 220px 1fr; gap: 8px; }
  .side { display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); align-self: start; padding: 20px 12px; padding-right: max(12px, env(safe-area-inset-right, 0px)); }
  .side button { display: flex; align-items: center; gap: 10px; background: none; border: 0; border-radius: var(--r-s); padding: 9px 12px; text-align: start; color: var(--ink-2); font-size: .95rem; }
  .side button:hover { background: var(--surface-2); }
  .side button[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  .side hr { border: 0; border-top: 1px solid var(--line); margin: 8px 6px; }
  .bottom { display: none; }
  main { padding-bottom: 48px; }
}
.ico { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* sheet (more menu, confirmations) */
.sheet-back { position: fixed; inset: 0; background: rgb(8 20 17 / .45); z-index: 40; }
.sheet { position: fixed; z-index: 41; inset: auto 0 0; background: var(--surface); border-radius: 18px 18px 0 0; padding: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 85vh; overflow: auto; box-shadow: var(--shadow); }
@media (min-width: 700px) { .sheet { inset: 50% auto auto 50%; transform: translate(-50%, -50%); border-radius: 18px; width: min(520px, 92vw); } }
.sheet h2 { margin: 0 0 12px; font-size: 1.15rem; }
.menu-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.menu-grid button { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r-s); padding: 14px 12px; text-align: start; min-height: 56px; }
.menu-grid button svg { width: 22px; height: 22px; color: var(--accent); flex: none; }
.toast { position: fixed; z-index: 45; inset-inline: 0; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); margin-inline: auto; width: fit-content; max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: .9rem; box-shadow: var(--shadow); }
@media (min-width: 960px) { .toast { bottom: 24px; } }

/* ---------- type & generic ---------- */
h1, h2, h3, h4 { text-wrap: balance; line-height: 1.25; margin: 0; }
.page-head { display: flex; flex-direction: column; gap: 6px; }
.page-head h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(1.7rem, 5.5vw, 2.3rem); letter-spacing: -.005em; }
.page-head h1:focus { outline: none; }
.eyebrow { font-size: .78rem; font-weight: 600; color: var(--warm); letter-spacing: .04em; }
.lede { color: var(--ink-2); margin: 0; max-width: 62ch; }
.muted { color: var(--ink-3); }
.small { font-size: .85rem; }
.mono { font-family: var(--f-mono); font-size: .82em; letter-spacing: .01em; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel h2 { font-size: 1.1rem; }
.panel.tint { background: var(--accent-soft); border-color: transparent; }
.panel.warmtint { background: var(--warm-soft); border-color: transparent; }
.section-title { font-size: .8rem; font-weight: 700; color: var(--ink-3); letter-spacing: .05em; margin: 4px 0 -6px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; text-decoration: none; text-align: center; }
.btn:hover { border-color: var(--accent); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent-ink); padding-inline: 10px; }
.btn.small { min-height: 38px; padding: 6px 12px; font-size: .88rem; border-radius: 10px; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent-ink); text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }

.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: .78rem; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.t { background: var(--accent-soft); color: var(--accent-ink); }
.chip.warm { background: var(--warm-soft); color: var(--warm); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.flag { background: var(--flag-soft); color: var(--flag); }
.tid { font-family: var(--f-mono); font-size: .75rem; }

/* form controls */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span, .field legend { font-size: .85rem; font-weight: 600; color: var(--ink-2); padding: 0; }
fieldset.field { border: 0; margin: 0; padding: 0; }
select, input[type="text"], textarea { width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 8px 12px; }
textarea { min-height: 120px; font-family: var(--f-mono); font-size: .8rem; direction: ltr; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; min-width: 52px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: .92rem; }
.seg input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.seg input:focus-visible + span { outline: 3px solid var(--warm); outline-offset: 2px; }
.seg input:disabled + span { opacity: .4; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checks label { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-height: 42px; background: var(--surface); font-size: .9rem; }
.checks input { width: 18px; height: 18px; accent-color: var(--accent); }
details.explain { border: 1px dashed var(--line); border-radius: var(--r-s); padding: 10px 14px; font-size: .9rem; color: var(--ink-2); }
details.explain summary { cursor: pointer; font-weight: 600; color: var(--ink); }
details.explain p, details.explain ul { margin: 8px 0 0; }

.progressbar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progressbar > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.progressbar.warm > i { background: var(--warm); }
.counter { font-variant-numeric: tabular-nums; font-family: var(--f-mono); font-size: .85rem; color: var(--ink-2); }

/* ---------- home ---------- */
.hello { display: flex; flex-direction: column; gap: 6px; }
.hello h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(2rem, 7vw, 2.8rem); }
.reco { display: grid; gap: 12px; background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 20px; }
.reco .eyebrow { color: var(--reco-eyebrow); }
.reco h2 { font-size: 1.25rem; font-family: var(--f-display); font-weight: 700; }
.reco p { margin: 0; opacity: .85; }
.reco .btn.primary { background: var(--bg); color: var(--ink); border-color: var(--bg); justify-self: start; }
.quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.quick button { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); text-align: start; min-height: 96px; min-width: 0; }
.quick button b { font-size: 1.5rem; font-variant-numeric: tabular-nums; font-family: var(--f-display); line-height: 1; }
.quick button span { font-size: .82rem; color: var(--ink-2); line-height: 1.3; }
.quick button:hover { border-color: var(--accent); }
.topic-list { display: flex; flex-direction: column; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.topic-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 14px 16px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: start; width: 100%; }
.topic-row:last-child { border-bottom: 0; }
.topic-row:hover { background: var(--surface-2); }
.topic-row .num { font-family: var(--f-mono); font-size: .8rem; color: var(--accent-ink); background: var(--accent-soft); border-radius: 8px; padding: 4px 6px; }
.topic-row .nm { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.topic-row .nm b { font-weight: 600; font-size: .98rem; }
.topic-row .meta { font-size: .78rem; color: var(--ink-3); }
.topic-row .score { text-align: end; font-size: .8rem; color: var(--ink-2); min-width: 64px; }
.topic-row .score b { display: block; font-size: 1.05rem; color: var(--ink); font-variant-numeric: tabular-nums; }
@media (max-width: 560px) {
  .topic-row { grid-template-columns: auto 1fr; align-items: start; }
  .topic-row .score { grid-column: 2; text-align: start; min-width: 0; display: flex; gap: 6px; align-items: baseline; }
  .topic-row .score b { display: inline; }
}

/* ---------- learn ---------- */
.lesson-list { display: flex; flex-direction: column; gap: 10px; }
.lesson-item { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); text-align: start; width: 100%; }
.lesson-item:hover { border-color: var(--accent); }
.lesson-item .lbl { font-size: .78rem; font-weight: 700; color: var(--warm); }
.lesson-item h3 { font-size: 1.02rem; font-weight: 600; }
.lesson-item .meta { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .8rem; color: var(--ink-3); }
.done-mark { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; }
.done-mark.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.prose { display: flex; flex-direction: column; gap: 14px; font-size: 1.02rem; line-height: 1.75; }
.prose p, .prose ul, .prose ol { margin: 0; max-width: 66ch; }
.prose ul, .prose ol { padding-inline-start: 22px; display: flex; flex-direction: column; gap: 6px; }
.prose li .sub { color: var(--ink-3); font-size: .9rem; }
.prose h2.part { font-family: var(--f-display); font-size: 1.45rem; font-weight: 700; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
.prose h3 { font-size: 1.18rem; color: var(--accent-ink); margin-top: 6px; }
.prose h4 { font-size: 1rem; }
.prose .src { font-size: .82rem; color: var(--ink-3); margin-top: -8px; }
.gcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.gcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-s); padding: 14px; display: flex; flex-direction: column; gap: 6px; font-size: .95rem; line-height: 1.6; min-width: 0; }
.gcard h4 { color: var(--accent-ink); }
.gcard p, .gcard ul { margin: 0; }
.gstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 10px; }
.gstat { background: var(--accent-soft); border-radius: var(--r-s); padding: 14px; display: flex; flex-direction: column; gap: 2px; text-align: center; }
.gstat .v { font-family: var(--f-display); font-weight: 900; font-size: 2rem; color: var(--accent-ink); line-height: 1.1; }
.gstat .l { font-weight: 600; font-size: .9rem; }
.gstat .c { font-size: .78rem; color: var(--ink-3); }
.gnote { background: var(--warm-soft); border-radius: var(--r-s); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; font-size: .95rem; }
.gnote .tag, .gcheck .tag { font-size: .78rem; font-weight: 700; color: var(--warm); letter-spacing: .03em; }
.gnote > div { display: flex; flex-direction: column; gap: 8px; }
.gcheck { border: 1px dashed var(--warm); border-radius: var(--r-s); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.gcheck p { font-weight: 600; }
.gfig { margin: 0; background: var(--surface-2); border-radius: var(--r-s); padding: 14px; display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.gfig figcaption { font-size: .85rem; color: var(--ink-2); }
.gfig.flow ol { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; max-width: none; }
.gfig.flow li { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-weight: 600; font-size: .92rem; }
.gfig.flow li + li::before { content: "←"; color: var(--warm); margin-inline-end: 8px; font-weight: 700; }
.gfig.eq .eqn { font-family: var(--f-mono); font-size: 1.05rem; font-weight: 500; text-align: center; background: var(--surface); border-radius: 8px; padding: 10px; overflow-x: auto; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: start; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
thead th { background: var(--surface-2); font-size: .82rem; color: var(--ink-2); white-space: nowrap; }

פשר פינוי וניצול של לקטט.","sourcePages":"38,45"},{"id":"Q-115","topicId":"T05","difficulty":"hard","question":"איזה שינוי צפוי בסף של מתאמנת ששיפרה כושר אירובי?","options":["הסף חייב להיעלם","היא תוכל להתמיד בעצימות גבוהה יותר לפני עלייה חדה בריכוז לקטט","לא ייווצר ATP באימון","כל מערכות האנרגיה יפעלו רק לפי דופק"],"correctIndex":1,"explanation":"שיפור בסף משמעו דחיית הצטברות מואצת של לקטט לעצימות גבוהה יותר.","sourcePages":"40-41"},{"id":"Q-116","topicId":"T05","difficulty":"hard","question":"מה לא ניתן להסיק ממדידת VO₂max לבדה?","options":["יכולת מרבית של צריכת חמצן","את הערך היחסי של צריכת חמצן מרבית","איזה מסלול אנרגיה דומיננטי בכל רגע של כל פעילות","מדד מרכזי לכושר אירובי"],"correctIndex":2,"explanation":"VO₂max אינו מתאר לבדו את חלוקת התרומה בין מערכות לפי כל משך ועצימות.","sourcePages":"34-35,41-42"},{"id":"Q-117","topicId":"T05","difficulty":"hard","question":"במהלך מאמץ מדורג ריכוז הלקטט נשאר נמוך ואז מטפס במהירות. מה הדבר מלמד?","options":["כל האנרגיה מגיעה רק משומן","ייתכן שנחצה אזור הסף האנאירובי","השריר הפסיק לעבוד","מלאי החמצן בריאות גדל בלי גבול"],"correctIndex":1,"explanation":"שינוי השיפוע בעקומת הלקטט מתאים למעבר לאזור הצטברות מואצת.","sourcePages":"39-41"},{"id":"Q-118","topicId":"T06","difficulty":"easy","question":"כיצד פועלות שלוש מערכות האנרגיה במהלך מאמץ?","options":["רק אחת מסוגלת לחדש ATP","הן פועלות רק במהלך שינה","הן פועלות במקביל ביחסים משתנים","כל אחת מתחילה רק כשהקודמת נכבית לגמרי"],"correctIndex":2,"explanation":"התרומה היחסית משתנה לפי מאפייני הפעילות, אך יש חפיפה.","sourcePages":"41-42"},{"id":"Q-119","topicId":"T06","difficulty":"easy","question":"אילו שני גורמים חשובים במיוחד לחלוקת התרומה בין מסלולי האנרגיה?","options":["עצימות ומשך הפעילות","צבע הבגדים וסוג הנעל","גובה המתאמן ושם התחרות","טמפרטורת החדר בלבד"],"correctIndex":0,"explanation":"החוברת מדגישה משך ועצימות כגורמים מרכזיים.","sourcePages":"41-42"},{"id":"Q-120","topicId":"T06","difficulty":"medium","question":"איזה מסלול בולט במיוחד בקפיצה בודדת מרבית?","options":["ATP-CrP","מעגל קרבס בלבד","גליקוליזה ממושכת","חמצון שומן בלבד"],"correctIndex":0,"explanation":"מאמץ מרבי של שניות בודדות נשען בעיקר על פוספגנים.","sourcePages":"19-21,42"},{"id":"Q-121","topicId":"T06","difficulty":"medium","question":"מדוע בריצת 400 מטר יש תרומה חשובה של הגליקוליזה?","options":["כי שומן הוא הדלק היחיד","כי אין בכלל ATP בתחילת הריצה","כי המאמץ עצים ונמשך מעבר לקיבולת הפוספוגנית הקצרה","כי 400 מטר תמיד נמשכים שעה"],"correctIndex":2,"explanation":"לאחר השניות הראשונות חשיבות הגליקוליזה גדלה לצד מסלולים נוספים.","sourcePages":"24,42"},{"id":"Q-122","topicId":"T06","difficulty":"easy","question":"איזו מערכת בדרך כלל תספק רוב האנרגיה בריצה רצופה ממושכת?","options":["אין צורך ב-ATP","אירובית","גליקוליטית בלבד","פוספוגנית בלבד"],"correctIndex":1,"explanation":"במשך זמן ארוך הקיבולת של המערכת האירובית נעשית חשובה במיוחד.","sourcePages":"41-42"},{"id":"Q-123","topicId":"T06","difficulty":"medium","question":"מהו גירעון חמצן בתחילת מאמץ?","options":["חוסר חמצן תמידי בדם","ירידה של כל הלקטט לאפס","פער זמני בין דרישת החמצן לבין הצריכה בפועל","הפסקה מוחלטת של הנשימה"],"correctIndex":2,"explanation":"צריכת החמצן עולה בהדרגה ואינה תואמת מיד את הדרישה החדשה.","sourcePages":"43"},{"id":"Q-124","topicId":"T06","difficulty":"medium","question":"איך הגוף מספק ATP כאשר צריכת החמצן עדיין עולה בתחילת הפעילות?","options":["המסלולים האנאירוביים מסייעים להשלים את הדרישה","הוא משתמש רק בחלבון","הוא מפסיק את פעילות השריר","הוא מחכה בלי לייצר ATP"],"correctIndex":0,"explanation":"ATP-CrP וגליקוליזה תורמים עד לעלייה בתרומה האירובית.","sourcePages":"43"},{"id":"Q-125","topicId":"T06","difficulty":"easy","question":"מה פירוש EPOC?","options":["סף לקטט נוסף","מקסימום שומן בשריר","צריכת חמצן עודפת לאחר מאמץ","קצב פעימות לב במנוחה"],"correctIndex":2,"explanation":"Excess Post-exercise Oxygen Consumption היא צריכת חמצן מעל המנוחה בתקופת התאוששות.","sourcePages":"43"},{"id":"Q-126","topicId":"T06","difficulty":"medium","question":"מה מסביר נשימה מוגברת במשך זמן לאחר אימון עצים?","options":["המשך צריכת חמצן לתהליכי התאוששות","הפסקה מוחלטת של חילוף חומרים","היווצרות חמצן מהעצמות","אפס צריכת אנרגיה"],"correctIndex":0,"explanation":"אחרי המאמץ הגוף ממשיך לחדש מאגרים ולתמוך בתהליכי התאוששות.","sourcePages":"43-44"},{"id":"Q-127","topicId":"T06","difficulty":"medium","question":"איזה מאגר מתחדש במנוחה לאחר פעילות עצימה קצרה?","options":["CrP","רק תאי עור","המוגלובין מתחדש כולו בשנייה","עצמות צומחות מייד"],"correctIndex":0,"explanation":"חידוש פוספגנים הוא מרכיב חשוב בתהליכי התאוששות.","sourcePages":"44-45"},{"id":"Q-128","topicId":"T06","difficulty":"easy","question":"כיצד מגדירים התאוששות פסיבית?","options":["ריצה בקצב תחרות","הליכה נינוחה","מנוחה ללא פעילות משמעותית","רכיבה קלה"],"correctIndex":2,"explanation":"בהתאוששות פסיבית כמעט לא מבצעים פעילות גופנית.","sourcePages":"45"},{"id":"Q-129","topicId":"T06","difficulty":"easy","question":"כיצד מגדירים התאוששות אקטיבית?","options":["שכיבה בלבד","עצירת כל תנועה","פעילות קלה בזמן ההפסקה","שינה ממושכת"],"correctIndex":2,"explanation":"לדוגמה הליכה איטית או תנועה מתונה בין מקטעים.","sourcePages":"45"},{"id":"Q-130","topicId":"T06","difficulty":"medium","question":"איזו התאוששות מתאימה בדרך כלל להאצת פינוי לקטט מהדם?","options":["שכיבה בלבד תמיד","אקטיבית קלה","הימנעות מכל זרימת דם","ספרינט נוסף מקסימלי"],"correctIndex":1,"explanation":"תנועה קלה יכולה לעודד שימוש בלקטט ופינויו.","sourcePages":"45"},{"id":"Q-131","topicId":"T06","difficulty":"hard","question":"איזו מנוחה תתאים יותר להשגת ביצוע מרבי נוסף במאמץ פוספוגני קצר מאוד?","options":["ספרינט בעוצמה מרבית בזמן ההפסקה","מנוחה מספקת לחידוש CrP","מאמץ עצים רציף ללא הפסקה","אין חשיבות למנוחה"],"correctIndex":1,"explanation":"חידוש מאגרי הפוספגנים משפר זמינות אנרגיה לביצוע חוזר.","sourcePages":"20,44-45"},{"id":"Q-132","topicId":"T06","difficulty":"medium","question":"מה נכון על '10 שניות' במערכת הפוספוגנית?","options":["אחרי 10 שניות המערכת נעלמת לנצח","המערכת מתחילה רק בשנייה העשירית","כל המאמצים באורך 10 שניות זהים","זהו זמן דומיננטיות משוער, לא מתג הפעלה או כיבוי"],"correctIndex":3,"explanation":"זמני הדומיננטיות הם בקירוב ויש חפיפה בכל המערכות.","sourcePages":"20-21,41-42"},{"id":"Q-133","topicId":"T06","difficulty":"medium","question":"בפעילות קבועה בעצימות תת-מרבית, מה קורה לרוב לצריכת החמצן לאחר תחילת הפעילות?","options":["היא הופכת ללקטט","היא נשארת אפס","היא עולה ומתקרבת לרמה יציבה","היא תמיד נעצרת מיד"],"correctIndex":2,"explanation":"צריכת החמצן מסתגלת בהדרגה לעומס החדש.","sourcePages":"43"},{"id":"Q-134","topicId":"T06","difficulty":"medium","question":"איך ניתן להבחין בין גירעון חמצן ל-EPOC?","options":["אין הבדל, שניהם זהים","שניהם מתרחשים רק בזמן שינה","שניהם שמות ל-CrP","גירעון מתייחס לתחילת המאמץ, EPOC לאחר סיומו"],"correctIndex":3,"explanation":"אלה שלבים שונים בעקומת צריכת החמצן ביחס למאמץ.","sourcePages":"43"},{"id":"Q-135","topicId":"T06","difficulty":"hard","question":"באיזה מצב הצורך ב-EPOC עשוי לגדול?","options":["רק לפני תחילת אימון","לאחר מאמץ מאתגר המצריך התאוששות משמעותית","אחרי ישיבה שקטה בלבד","רק כשאין פעילות תאית"],"correctIndex":1,"explanation":"מאמץ מאתגר מגדיל לעיתים את דרישות ההתאוששות.","sourcePages":"43-44"},{"id":"Q-136","topicId":"T06","difficulty":"hard","question":"מאמן מתכנן 5 קפיצות מרביות עם מנוחה. מה המטרה העיקרית של מנוחה בין קפיצות?","options":["להפוך ATP לגלוקוז","לאפשר חידוש של פוספגנים זמינים","למנוע כל צורך בחמצן","להפוך את המאמץ לאירובי בלבד"],"correctIndex":1,"explanation":"במאמצים מרביים קצרים זמינות מחודשת של CrP חשובה.","sourcePages":"44-45"},{"id":"Q-137","topicId":"T06","difficulty":"hard","question":"מהו ניסוח מדויק של תרומת מערכות האנרגיה לאורך מאמץ?","options":["הכל תלוי רק במרחק","כל מערכת פועלת לבדה למשך מדויק וקבוע","כולן מתחילות רק אחרי האימון","כולן פעילות והיחס ביניהן משתנה עם העצימות והמשך"],"correctIndex":3,"explanation":"זהו עיקרון היסוד של התרשימים וטבלת התרומות בחוברת.","sourcePages":"41-42"},{"id":"Q-138","topicId":"T07","difficulty":"hard","question":"מתאמנת מבצעת ספרינט מרבי של 6 שניות. מהו המסלול הדומיננטי והסיבה?","options":["חמצון שומנים כי steps":[{"id":"SQ-18-1","text":"מסיימים פעילות"},{"id":"SQ-18-2","text":"צריכת החמצן עוד גבוהה ביחס למנוחה"},{"id":"SQ-18-3","text":"תהליכי התאוששות נמשכים"},{"id":"SQ-18-4","text":"צריכת החמצן יורדת בהדרגה לכיוון רמת המנוחה"}],"correctOrder":["SQ-18-1","SQ-18-2","SQ-18-3","SQ-18-4"],"explanation":"אין להסיק שבכל מאמץ EPOC זהה."},{"id":"SQ-19","topicId":"T06","title":"התאוששות פעילה ופינוי לקטט","sourcePages":[45],"difficulty":"medium","instruction":"סדרי את השלבים מהראשון לאחרון.","steps":[{"id":"SQ-19-1","text":"מסתיים מאמץ עצים עם לקטט גבוה"},{"id":"SQ-19-2","text":"ממשיכים בפעילות קלה במקום ישיבה מלאה"},{"id":"SQ-19-3","text":"זרימת דם ופעילות חמצונית ממשיכות לתמוך בפינוי"},{"id":"SQ-19-4","text":"רמת הלקטט בדם יורדת במהירות יחסית להתאוששות פסיבית"}],"correctOrder":["SQ-19-1","SQ-19-2","SQ-19-3","SQ-19-4"],"explanation":"לפי ההשוואה בגרף בעמוד 45."},{"id":"SQ-20","topicId":"T07","title":"סדר הענפים לפי תרומה אירובית עולה בטבלת האתלטיקה","sourcePages":[42],"difficulty":"hard","instruction":"סדרי את השלבים מהראשון לאחרון.","steps":[{"id":"SQ-20-1","text":"200 מטר: 10%"},{"id":"SQ-20-2","text":"800 מטר: 40%"},{"id":"SQ-20-3","text":"1500 מטר: 60%"},{"id":"SQ-20-4","text":"מרתון: 96%"}],"correctOrder":["SQ-20-1","SQ-20-2","SQ-20-3","SQ-20-4"],"explanation":"מבוסס על נתוני האתלטיקה בעמוד 42. תרומה אירובית בריצת 100 מטר מסומנת במקף ולא נכללה."}],"lessons":[{"key":"L00","topicId":null,"label":"איך ללמוד","title":"מפת הדרך למבחן","source":"","html":"\u003cp>איך ללמוד\u003c/p>\n\u003cp>חלק א׳ • עמ׳ 6–51\u003c/p>\n\u003cp>המבחן מתמקד בפיזיולוגיה של המאמץ: מאיפה הגוף מקבל אנרגיה, איך הוא מחדש \u003cbdi>ATP\u003c/bdi>, מה קורה כשהעצימות עולה, ואיך הוא מתאושש. הנושאים קשורים זה לזה, ולכן כדאי ללמוד אותם בסדר הבא.\u003c/p>\n\u003col>\u003cli>\u003cstrong>אנרגיה ואבות המזון\u003c/strong>\u003cdiv class=\"sub\">מטבוליזם, \u003cbdi>BMR\u003c/bdi>, גלוקוז, גליקוגן ושומן\u003cbr>6–14\u003c/div>\u003c/li>\u003cli>\u003cstrong>\u003cbdi>ATP\u003c/bdi> ומערכת הפוספוגן\u003c/strong>\u003cdiv class=\"sub\">תפקיד \u003cbdi>ATP\u003c/bdi>, מאגרי \u003cbdi>ATP\u003c/bdi> ו-\u003cbdi>CrP\u003c/bdi>\u003cbr>15–21\u003c/div>\u003c/li>\u003cli>\u003cstrong>גליקוליזה ומטבוליזם אירובי\u003c/strong>\u003cdiv class=\"sub\">פירובט, לקטט, קרבס ושרשרת הנשימה\u003cbr>22–30\u003c/div>\u003c/li>\u003cli>\u003cstrong>צריכת חמצן וסף אנאירובי\u003c/strong>\u003cdiv class=\"sub\">\u003cbdi>VO₂\u003c/bdi>, \u003cbdi>VO₂max\u003c/bdi>, לקטט ועצימות\u003cbr>34–41\u003c/div>\u003c/li>\u003cli>\u003cstrong>שילוב מערכות והתאוששות\u003c/strong>\u003cdiv class=\"sub\">דומיננטיות לפי משך, \u003cbdi>EPOC\u003c/bdi>, פינוי לקטט\u003cbr>42–45\u003c/div>\u003c/li>\u003c/ol>\n\u003cdiv class=\"gcards\">\u003cdiv class=\"gcard\">\u003ch4>שאלת מפתח\u003c/h4>\u003cp>באימון קצר ועצים: מה מאפשר לשריר להמשיך לעבוד גם כשהחמצן אינו מספיק לקצב הדרישה?\u003c/p>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>שאלת מפתח\u003c/h4>\u003cp>באימון ממושך: מדוע תרומת המערכת האירובית עולה, וכיצד זה משפיע על משך הפעילות?\u003c/p>\u003c/div>\u003c/div>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">איך להשתמש בסיכום\u003c/span>\u003cdiv>\u003cp>קוראים נושא, מנסים להסביר בקול בלי להסתכל, ואז עונים על שאלת הבדיקה. בסוף מבצעים את מבחן התרגול ומסמנים טעויות לחזרה.\u003c/p>\u003c/div>\u003c/aside>\n\u003cp>מקור: חוברת ״מבנה מערכות הגוף ותפקודן״, פיזיולוגיה 37 שעות, חלק א׳. המספרים והתיאורים מוצגים לצורך חזרה על חומר הקורס; הגוף בפועל פועל ברצף ולא לפי גבולות זמן חדים.\u003c/p>"},{"key":"L01","topicId":"T01","label":"פרק 01","title":"אנרגיה, חילוף חומרים ואבות המזון","source":"חוברת מקור: עמ׳ 6–14","html":"\u003ch3>מהו מטבוליזם?\u003c/h3>\n\u003cp>מטבוליזם הוא כלל תהליכי חילוף החומרים בגוף. \u003cstrong>קטבוליזם\u003c/strong> הוא פירוק חומרים ושחרור אנרגיה; \u003cstrong>אנבוליזם\u003c/strong> הוא בנייה של חומרים ורקמות, שדורשת אנרגיה. שני סוגי התהליכים פועלים כל הזמן.\u003c/p>\n\u003cdiv class=\"gcards\">\u003cdiv class=\"gcard\">\u003ch4>קטבוליזם = פירוק\u003c/h4>\u003cp>לדוגמה: פירוק גלוקוז בתא כדי לאפשר חידוש \u003cbdi>ATP\u003c/bdi>.\u003c/p>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>אנבוליזם = בנייה\u003c/h4>\u003cp>לדוגמה: בניית חלבוני שריר ושיקום רקמות לאחר אימון.\u003c/p>\u003c/div>\u003c/div>\n\u003ch3>חילוף חומרים בסיסי (\u003cbdi>BMR\u003c/bdi> / \u003cbdi>REE\u003c/bdi>)\u003c/h3>\n\u003cp>כמות האנרגיה הנדרשת לתחזוקה של הגוף במנוחה: נשימה, פעילות לב, פעילות תאי הגוף ושמירה על תנאי החיים. בחוברת מובא טווח לימודי כללי של כ-1,200–2,400 קק״ל ביום, בהתאם לאדם.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>מושפע מ:\u003c/strong> מסת הגוף והרכבו, גיל, מין, גנטיקה, הורמונים ומצב פיזיולוגי.\u003c/li>\u003cli>\u003cstrong>מסה רזה:\u003c/strong> לרוב רקמה פעילה מטבולית יותר, ולכן תורמת לדרישה הבסיסית.\u003c/li>\u003cli>\u003cstrong>חשוב:\u003c/strong> \u003cbdi>BMR\u003c/bdi> איננו הוצאה אנרגטית יומית כוללת. פעילות גופנית, עיכול ותנועה מוסיפים על ההוצאה הבסיסית.\u003c/li>\u003c/ul>\n\u003ch3>כמה אנרגיה מפיקים מאבות המזון?\u003c/h3>\n\u003cdiv class=\"gstats\">\u003cdiv class=\"gstat\">\u003cspan class=\"v\" dir=\"ltr\">4\u003c/span>\u003cspan class=\"l\">פחמימות\u003c/span>\u003cspan class=\"c\">קק״ל לגרם\u003c/span>\u003c/div>\u003cdiv class=\"gstat\">\u003cspan class=\"v\" dir=\"ltr\">4\u003c/span>\u003cspan class=\"l\">חלבונים\u003c/span>\u003cspan class=\"c\">קק״ל לגרם\u003c/span>\u003c/div>\u003cdiv class=\"gstat\">\u003cspan class=\"v\" dir=\"ltr\">9\u003c/span>\u003cspan class=\"l\">שומנים\u003c/span>\u003cspan class=\"c\">קק״ל לגרם\u003c/span>\u003c/div>\u003c/div>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">לא להתבלבל\u003c/span>\u003cdiv>\u003cp>קק״ל הן יחידות אנרגיה של המזון. \u003cbdi>ATP\u003c/bdi> הוא נשא האנרגיה הזמין לשימוש התאי; אין זה אותו הדבר.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">עצירה לבדיקה\u003c/span>\u003cp>מדוע שני אנשים באותו משקל גוף יכולים להיות בעלי \u003cbdi>BMR\u003c/bdi> שונה?\u003c/p>\u003c/div>\n\u003ch2 class=\"part\">מהמזון אל השריר\u003c/h2>\n\u003cp class=\"src\">חוברת מקור: עמ׳ 10–14\u003c/p>\n\u003ch3>המסלול שעוברת האנרגיה\u003c/h3>\n\u003cfigure class=\"gfig flow\" aria-label=\"תרשים זרימה\">\u003col>\u003cli>מזון\u003c/li>\u003cli>פירוק ועיכול\u003c/li>\u003cli>ספיגת תוצרים לדם\u003c/li>\u003cli>הובלה לתאים\u003c/li>\u003cli>חידוש \u003cbdi>ATP\u003c/bdi>\u003c/li>\u003c/ol>\u003c/figure>\n\u003ch3>המאגר העיקרי של הפחמימות\u003c/h3>\n\u003cp>\u003cstrong>גלוקוז\u003c/strong> הוא חד-סוכר המשמש ליצירת אנרגיה; \u003cstrong>גליקוגן\u003c/strong> הוא הצורה שבה הגוף מאחסן פחמימות, בעיקר בשרירים ובכבד. בעת מאמץ השריר משתמש גם בגליקוגן שלו; גליקוגן הכבד מסייע בשמירה על רמת הגלוקוז בדם.\u003c/p>\n\u003cdiv class=\"gcards\">\u003cdiv class=\"gcard\">\u003ch4>פחמימות\u003c/h4>\u003cul>\u003cli>מקור יעיל ליצירת \u003cbdi>ATP\u003c/bdi>, גם במסלול אנאירובי וגם במסלול אירובי.\u003c/li>\u003cli>חשובות במיוחד כשנדרשת אספקת \u003cbdi>ATP\u003c/bdi> בקצב גבוה.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>שומנים\u003c/h4>\u003cul>\u003cli>מאגר אנרגיה גדול בגוף.\u003c/li>\u003cli>דורשים מסלול אירובי לפירוק מלא, ולכן תרומתם מוגבלת במאמץ עצים מאוד.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\n\u003cdiv class=\"gcards\">\u003cdiv class=\"gcard\">\u003ch4>חלבונים\u003c/h4>\u003cp>תפקידם המרכזי בנייה, תיקון ותפקוד רקמות. יכולים לספק אנרגיה אך אינם מקור האנרגיה המועדף בפעילות רגילה.\u003c/p>\u003c/div>\u003c/div>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">דוגמה מחיי האימון\u003c/span>\u003cdiv>\u003cp>\u003cstrong>ספרינט לעומת הליכה ממושכת\u003c/strong> בספרינט הגוף חייב לחדש \u003cbdi>ATP\u003c/bdi> במהירות, ולכן עולה תרומת מסלולים מהירים. בהליכה ממושכת אפשר להסתמך הרבה יותר על תהליכים אירוביים, כולל חמצון שומנים.\u003c/p>\u003c/div>\u003c/aside>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">נתון לימודי בחוברת\u003c/span>\u003cdiv>\u003cp>בעמ׳ 11 מוצגת חלוקה לדוגמה של 55% פחמימות, 20% חלבונים ו-25% שומנים. זהו נתון במסגרת חומר הלימוד, לא המלצה תזונתית אישית.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">עצירה לבדיקה\u003c/span>\u003cp>היכן נאגר גליקוגן, ומה ההבדל בין תפקיד מאגרי השריר והכבד?\u003c/p>\u003c/div>"},{"key":"L02","topicId":"T02","label":"פרק 02","title":"ATP: מטבע האנרגיה של התא","source":"חוברת מקור: עמ׳ 15–18","html":"\u003ch3>למה חייבים \u003cbdi>ATP\u003c/bdi>?\u003c/h3>\n\u003cp>\u003cbdi>ATP\u003c/bdi> (אדנוזין טריפוספט) הוא המולקולה שבאמצעותה תאים מעבירים אנרגיה לפעולה. בשריר הוא נדרש לכיווץ, לתהליכי העברה פעילה, ולהחזרת מערכות התא למצב המאפשר כיווץ נוסף.\u003c/p>\n\u003cfigure class=\"gfig eq\">\u003cdiv class=\"eqn\" dir=\"ltr\">ATP → ADP + Pi + Energy\u003c/div>\u003cfigcaption>פירוק קבוצת פוספט מאפשר שחרור אנרגיה זמינה\u003c/figcaption>\u003c/figure>\n\u003cp>כדי להמשיך לעבוד חייבים \u003cstrong>לחדש \u003cbdi>ATP\u003c/bdi>\u003c/strong>: משקיעים אנרגיה שמגיעה מפירוק חומרי דלק ומחברים מחדש \u003cbdi>ADP\u003c/bdi> + \u003cbdi>Pi\u003c/bdi>.\u003c/p>\n\u003cfigure class=\"gfig eq\">\u003cdiv class=\"eqn\" dir=\"ltr\">ADP + Pi + Energy → ATP\u003c/div>\u003cfigcaption>חידוש \u003cbdi>ATP\u003c/bdi> תוך שימוש באנרגיה ממסלולי חילוף חומרים\u003c/figcaption>\u003c/figure>\n\u003ch3>למה אי אפשר להסתמך רק על ה-\u003cbdi>ATP\u003c/bdi> שנאגר בשריר?\u003c/h3>\n\u003cul>\u003cli>כמות ה-\u003cbdi>ATP\u003c/bdi> המוכנה בשריר קטנה מאוד, מספיקה רק לזמן קצר מאוד של פעילות עצימה.\u003c/li>\u003cli>הגוף מפעיל בו-זמנית מערכות שונות שמחדשות אותו בקצבים שונים.\u003c/li>\u003cli>השריר לא מחליף את ה-\u003cbdi>ATP\u003c/bdi> בחומר דלק אחר: כל המערכות נועדו בסופו של דבר לחדש \u003cbdi>ATP\u003c/bdi>.\u003c/li>\u003c/ul>\n\u003cdiv class=\"gcards\">\u003cdiv class=\"gcard\">\u003ch4>מאגר קטן\u003c/h4>\u003cp>\u003cbdi>ATP\u003c/bdi> קיים מראש בשריר, אך מתרוקן מהר.\u003c/p>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>חידוש מהיר\u003c/h4>\u003cp>\u003cbdi>CrP\u003c/bdi> וגליקוליזה תורמים בקצב גבוה.\u003c/p>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>חידוש מתמשך\u003c/h4>\u003cp>מטבוליזם אירובי מאפשר פעילות ארוכה.\u003c/p>\u003c/div>\u003c/div>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">זכרי למבחן\u003c/span>\u003cdiv>\u003cp>השאלה אינה ״באיזו מערכת השריר משתמש במקום \u003cbdi>ATP\u003c/bdi>?״, אלא ״איזו מערכת מחדשת \u003cbdi>ATP\u003c/bdi> בקצב שמתאים לדרישה?״\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">עצירה לבדיקה\u003c/span>\u003cp>מהם \u003cbdi>ADP\u003c/bdi> ו-\u003cbdi>Pi\u003c/bdi>, ומדוע חידוש \u003cbdi>ATP\u003c/bdi> חיוני להמשך מאמץ?\u003c/p>\u003c/div>"},{"key":"L03","topicId":"T02","label":"פרק 03","title":"המערכת הפוספוגנית (ATP–CrP)","source":"חוברת מקור: עמ׳ 19–21","html":"\u003cp>המערכת הפוספוגנית היא מערכת \u003cstrong>אנאירובית-אלקטית\u003c/strong>: אינה דורשת חמצן לצורך תגובת חידוש ה-\u003cbdi>ATP\u003c/bdi> הישירה, ואינה מייצרת לקטט כתוצר המסלול. היא מאפשרת אספקת אנרגיה בקצב גבוה ביותר, אך לזמן קצר.\u003c/p>\n\u003cfigure class=\"gfig eq\">\u003cdiv class=\"eqn\" dir=\"ltr\">CrP + ADP → Cr + ATP\u003c/div>\u003cfigcaption>קריאטין פוספט מוסר קבוצת פוספט ל-\u003cbdi>ADP\u003c/bdi>\u003c/figcaption>\u003c/figure>\n\u003ch3>מתי היא דומיננטית?\u003c/h3>\n\u003cdiv class=\"gcards\">\u003cdiv class=\"gcard\">\u003ch4>שניות ראשונות\u003c/h4>\u003cp>מאגרי \u003cbdi>ATP\u003c/bdi> ו-\u003cbdi>CrP\u003c/bdi> תורמים במיוחד בתחילת מאמץ מרבי. בחוברת מודגש חלון של כ-10 שניות.\u003c/p>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>דוגמאות\u003c/h4>\u003cp>זינוק, קפיצה, הרמה כבדה בודדת, ספרינט קצר מאוד.\u003c/p>\u003c/div>\u003c/div>\n\u003ch3>מה מגביל את המערכת?\u003c/h3>\n\u003cul>\u003cli>כמות הקריאטין פוספט (\u003cbdi>CrP\u003c/bdi>) בשריר מוגבלת.\u003c/li>\u003cli>כאשר המאגר יורד, מערכות נוספות מגדילות את תרומתן לחידוש \u003cbdi>ATP\u003c/bdi>.\u003c/li>\u003cli>לא מדובר ב״כיבוי״ חד של המערכת בתום 10 שניות: כל המערכות פועלות במקביל.\u003c/li>\u003c/ul>\n\u003ch3>חידוש מאגרי \u003cbdi>CrP\u003c/bdi> במנוחה\u003c/h3>\n\u003cp>חידוש \u003cbdi>CrP\u003c/bdi> תלוי במידה רבה באנרגיה המיוצרת במסלול האירובי. לכן מנוחה והתאוששות אירובית בין מאמצים מאפשרות למאגר להתמלא מחדש. בעמ׳ 45 מודגש שחידוש המאגר דורש כמה דקות.\u003c/p>\n\u003cdiv class=\"gcards\">\u003cdiv class=\"gcard\">\u003ch4>0–10 שנ׳\u003c/h4>\u003cp>תרומה פוספוגנית גבוהה\u003c/p>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>10 שנ׳–2 דק׳\u003c/h4>\u003cp>עולה חשיבות הגליקוליזה\u003c/p>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>מאמץ ממושך\u003c/h4>\u003cp>תרומה אירובית עולה\u003c/p>\u003c/div>\u003c/div>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">מלכודת נפוצה\u003c/span>\u003cdiv>\u003cp>״אנאירובי״ פירושו שהמסלול עצמו אינו תלוי בחמצן. הוא אינו אומר שהאדם אינו נושם בזמן המאמץ.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">עצירה לבדיקה\u003c/span>\u003cp>למה ספרינט בן 6 שניות מתאים יותר למערכת הפוספוגנית מריצה של 3 דקות?\u003c/p>\u003c/div>"},{"key":"L04","topicId":"T03","label":"פרק 04","title":"גליקוליזה: המסלול האנאירובי-לקטי","source":"חוברת מקור: עמ׳ 22–24","html":"\u003cp>הגליקוליזה מפרקת גלוקוז או גליקוגן במספר שלבים עד ליצירת פירובט, ומאפשרת יצירת \u003cbdi>ATP\u003c/bdi> במהירות. התהליך מתרחש בציטוזול ואינו מחייב שימוש ישיר בחמצן.\u003c/p>\n\u003cfigure class=\"gfig flow\" aria-label=\"תרשים זרימה\">\u003col>\u003cli>גלוקוז / גליקוגן\u003c/li>\u003cli>גליקוליזה\u003c/li>\u003cli>פירובט\u003c/li>\u003cli>\u003cbdi>ATP\u003c/bdi>\u003c/li>\u003c/ol>\u003c/figure>\n\u003ch3>מה קורה לפירובט?\u003c/h3>\n\u003cdiv class=\"gcards\">\u003cdiv class=\"gcard\">\u003ch4>בתנאים המאפשרים חמצון\u003c/h4>\u003cp>הפירובט יכול להיכנס למיטוכונדריה ולהמשיך למסלול האירובי.\u003c/p>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>כשקצב הדרישה גבוה\u003c/h4>\u003cp>חלק גדול יותר מהפירובט עובר ללקטט, בתהליך שתומך בהמשך הגליקוליזה.\u003c/p>\u003c/div>\u003c/div>\n\u003ch3>מאפייני המערכת\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>קצב:\u003c/strong> מהיר יחסית, אך איטי מהמערכת הפוספוגנית.\u003c/li>\u003cli>\u003cstrong>תפוקה:\u003c/strong> כמות \u003cbdi>ATP\u003c/bdi> קטנה יחסית לכל מולקולת גלוקוז.\u003c/li>\u003cli>\u003cstrong>דומיננטיות לימודית:\u003c/strong> מאמצים עצימים שנמשכים מעבר לשניות הראשונות, ועד סדר גודל של דקות מעטות.\u003c/li>\u003cli>\u003cstrong>אנזים חשוב בקורס:\u003c/strong> \u003cbdi>PFK\u003c/bdi> משתתף בבקרה על קצב הגליקוליזה.\u003c/li>\u003c/ul>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">דיוק חשוב\u003c/span>\u003cdiv>\u003cp>לקטט אינו ״פסולת״ חסרת שימוש: הוא יכול לשמש דלק ברקמות שונות או להפוך בחזרה לגלוקוז בכבד. העלייה בחומציות בזמן מאמץ מורכבת יותר מן הטענה הפשוטה ש״לקטט הוא החומצה״.\u003c/p>\u003c/div>\u003c/aside>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">דוגמה\u003c/span>\u003cdiv>\u003cp>\u003cstrong>ריצה חזקה ל-400 מטר\u003c/strong> הדרישה לחידוש \u003cbdi>ATP\u003c/bdi> גבוהה, ולכן חלקה של הגליקוליזה האנאירובית משמעותי, לצד תרומה של מערכות האנרגיה האחרות.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">עצירה לבדיקה\u003c/span>\u003cp>מה ההבדל בין גליקוליזה לבין התהליך הפוספוגני, גם מבחינת חומר הדלק וגם מבחינת משך?\u003c/p>\u003c/div>"},{"key":"L05","topicId":"T04","label":"פרק 05","title":"המערכת האירובית ושרשרת הנשימה","source":"חוברת מקור: עמ׳ 25–28","html":"\u003cp>המערכת האירובית מחדשת \u003cbdi>ATP\u003c/bdi> באמצעות חמצון חומרי דלק במיטוכונדריה. היא מפיקה כמות גדולה של \u003cbdi>ATP\u003c/bdi> ליחידת חומר דלק, אך אינה יכולה להגיע לקצב החידוש המרבי של המסלולים האנאירוביים.\u003c/p>\n\u003col>\u003cli>\u003cstrong>גליקוליזה\u003c/strong>\u003cdiv class=\"sub\">פחמימות מתפרקות לפירובט בציטוזול.\u003c/div>\u003c/li>\u003cli>\u003cstrong>אצטיל-\u003cbdi>CoA\u003c/bdi> ומעגל קרבס\u003c/strong>\u003cdiv class=\"sub\">תוצרים נכנסים למסלולי חמצון במיטוכונדריה; נפלט \u003cbdi>CO₂\u003c/bdi> ונוצרים נשאי אלקטרונים.\u003c/div>\u003c/li>\u003cli>\u003cstrong>שרשרת העברת האלקטרונים\u003c/strong>\u003cdiv class=\"sub\">ניצול האנרגיה מן הנשאים ליצירת רוב ה-\u003cbdi>ATP\u003c/bdi>. חמצן משמש קולט אלקטרונים סופי ונוצרים מים.\u003c/div>\u003c/li>\u003c/ol>\n\u003cdiv class=\"gcards\">\u003cdiv class=\"gcard\">\u003ch4>יתרון\u003c/h4>\u003cp>קיבולת אנרגטית גדולה: מאפשרת התמדה בפעילות לאורך זמן.\u003c/p>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>מגבלה\u003c/h4>\u003cp>קצב חידוש \u003cbdi>ATP\u003c/bdi> נמוך יותר ממסלולים אנאירוביים בשיא העצימות.\u003c/p>\u003c/div>\u003c/div>\n\u003ch3>ומה לגבי המספר 36 \u003cbdi>ATP\u003c/bdi>?\u003c/h3>\n\u003cp>בחוברת (עמ׳ 28–30) מופיע אומדן לימודי של כ-36 \u003cbdi>ATP\u003c/bdi> מגלוקוז במסלול אירובי מלא. בספרות ביוכימית חדשה יותר האומדנים משתנים בהתאם לשיטת החישוב. לצורכי המבחן כדאי לזהות את המספר ואת ההיגיון המופיעים בחוברת.\u003c/p>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">רעיון מרכזי\u003c/span>\u003cdiv>\u003cp>״אירובי״ אינו שווה ״קל״: גם בעצימות גבוהה מאוד המערכת האירובית פועלת, אך לעיתים אינה מסוגלת לספק לבדה את קצב ה-\u003cbdi>ATP\u003c/bdi> הנדרש.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">עצירה לבדיקה\u003c/span>\u003cp>מהו תפקיד החמצן בשרשרת הנשימה, ומהם שני התוצרים הנוספים של חמצון מלא של גלוקוז?\u003c/p>\u003c/div>\n\u003ch2 class=\"part\">פירוק שומנים ויעילות אנרגטית\u003c/h2>\n\u003cp class=\"src\">חוברת מקור: עמ׳ 29–30\u003c/p>\n\u003ch3>כיצד שומן הופך לאנרגיה זמינה?\u003c/h3>\n\u003cp>טריגליצריד הוא מאגר המורכב מגליצרול ושלוש חומצות שומן. בליפוליזה מתפרק הטריגליצריד למרכיביו. חומצות השומן עוברות חמצון במיטוכונדריה (בטא-אוקסידציה) ונוצר אצטיל-\u003cbdi>CoA\u003c/bdi>, שממשיך למעגל קרבס ולשרשרת הנשימה.\u003c/p>\n\u003cfigure class=\"gfig flow\" aria-label=\"תרשים זרימה\">\u003col>\u003cli>טריגליצריד\u003c/li>\u003cli>ליפוליזה\u003c/li>\u003cli>חומצות שומן\u003c/li>\u003cli>בטא-אוקסידציה\u003c/li>\u003cli>\u003cbdi>ATP\u003c/bdi>\u003c/li>\u003c/ol>\u003c/figure>\n\u003cdiv class=\"gcards\">\u003cdiv class=\"gcard\">\u003ch4>למה שומן יעיל לאורך זמן?\u003c/h4>\u003cul>\u003cli>מאגרי השומן גדולים יחסית.\u003c/li>\u003cli>פירוק מלא של חומצות שומן מפיק הרבה \u003cbdi>ATP\u003c/bdi>.\u003c/li>\u003cli>המסלול תלוי בתהליכים אירוביים.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>למה לא ספרינט על שומן בלבד?\u003c/h4>\u003cul>\u003cli>קצב אספקת \u003cbdi>ATP\u003c/bdi> משומן נמוך יחסית.\u003c/li>\u003cli>מאמץ מרבי דורש \u003cbdi>ATP\u003c/bdi> מהר יותר.\u003c/li>\u003cli>במאמץ עצים עולה חשיבות הפחמימות והמערכות האנאירוביות.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\n\u003ch3>איך העצימות משפיעה על בחירת הדלק?\u003c/h3>\n\u003cfigure class=\"gfig chartfig\" data-chart=\"G03\">\u003cdiv class=\"chart-slot\">\u003c/div>\u003cfigcaption>הפסים ממחישים מגמה איכותית בלבד, ולא אחוזים מדודים או יחס קבוע בין מקורות הדלק.\u003c/figcaption>\u003c/figure>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">הבחנה חשובה\u003c/span>\u003cdiv>\u003cp>אחוז השומן מתוך האנרגיה הכוללת אינו זהה לכמות השומן המוחלטת שנשרפת. שניהם עשויים להשתנות עם העצימות.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">עצירה לבדיקה\u003c/span>\u003cp>למה יש יתרון לשימוש בשומן בהליכה ממושכת, אך חיסרון בהפקת כוח מרבי מיידי?\u003c/p>\u003c/div>"},{"key":"L06","topicId":"T06","label":"מפת השוואה","title":"שלוש מערכות האנרגיה במבט אחד","source":"חוברת מקור: עמ׳ 18–25, 41–42","html":"\u003cp>אין שלוש ״קופסאות״ שנדלקות בזו אחר זו. שלושת המסלולים תורמים במקביל; \u003cstrong>העצימות והמשך\u003c/strong> קובעים מי מהם דומיננטי בכל רגע.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>מאפיין\u003c/th>\u003cth>פוספוגנית\u003c/th>\u003cth>גליקוליטית\u003c/th>\u003cth>אירובית\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">דלק / מקור\u003c/th>\u003ctd>\u003cbdi>ATP\u003c/bdi> ו-\u003cbdi>CrP\u003c/bdi>\u003c/td>\u003ctd>גלוקוז / גליקוגן\u003c/td>\u003ctd>פחמימות ושומנים\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">חמצן במסלול\u003c/th>\u003ctd>לא נדרש\u003c/td>\u003ctd>לא נדרש ישירות\u003c/td>\u003ctd>נדרש\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">קצב חידוש \u003cbdi>ATP\u003c/bdi>\u003c/th>\u003ctd>מהיר מאוד\u003c/td>\u003ctd>מהיר\u003c/td>\u003ctd>איטי יחסית\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">קיבולת\u003c/th>\u003ctd>קטנה\u003c/td>\u003ctd>בינונית\u003c/td>\u003ctd>גדולה\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">דומיננטיות טיפוסית\u003c/th>\u003ctd>שניות ראשונות\u003c/td>\u003ctd>עשרות שניות עד דקות\u003c/td>\u003ctd>מאמץ ממושך\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">דוגמה\u003c/th>\u003ctd>קפיצה או זינוק\u003c/td>\u003ctd>ספרינט ארוך\u003c/td>\u003ctd>הליכה/ריצה ממושכת\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>שלושה תרחישים: מה דומיננטי?\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>הרמת משקל כבדה לחזרה אחת\u003c/strong> המערכת הפוספוגנית דומיננטית, כי דרוש \u003cbdi>ATP\u003c/bdi> בקצב גבוה למשך שניות.\u003c/li>\u003cli>\u003cstrong>ריצה חזקה במשך דקה\u003c/strong> תרומה ניכרת של גליקוליזה, לצד הפוספוגנית והאירובית.\u003c/li>\u003cli>\u003cstrong>ריצה נוחה במשך 30 דקות\u003c/strong> המערכת האירובית דומיננטית, תוך שימוש בתמהיל פחמימות ושומנים.\u003c/li>\u003c/ul>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">זה מה שבוחנים\u003c/span>\u003cdiv>\u003cp>״דומיננטית״ אינו אומר ״היחידה שפועלת״. אם מופיעה שאלה על מקור האנרגיה בפעילות נתונה, התייחסי גם לזמן וגם לעצימות.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">עצירה לבדיקה\u003c/span>\u003cp>האם באימון בן 10 דקות מערכת \u003cbdi>CrP\u003c/bdi> מפסיקה לפעול לגמרי? הסבירי.\u003c/p>\u003c/div>"},{"key":"L07","topicId":"T05","label":"פרק 06","title":"צריכת חמצן ויכולת אירובית","source":"חוברת מקור: עמ׳ 34–36","html":"\u003ch3>\u003cbdi>VO₂\u003c/bdi> לעומת \u003cbdi>VO₂max\u003c/bdi>\u003c/h3>\n\u003cdiv class=\"gcards\">\u003cdiv class=\"gcard\">\u003ch4>\u003cbdi>VO₂\u003c/bdi> • צריכת חמצן\u003c/h4>\u003cp>כמות החמצן שהגוף קולט ומשתמש בה ליחידת זמן, למשל ליטרים לדקה או מ״ל לק״ג לדקה. עולה בדרך כלל עם עצימות המאמץ.\u003c/p>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>\u003cbdi>VO₂max\u003c/bdi> • צריכת חמצן מרבית\u003c/h4>\u003cp>הקצב המרבי שבו הגוף מסוגל לקלוט ולהשתמש בחמצן במאמץ הולך ומתגבר. מדד מרכזי ליכולת אירובית.\u003c/p>\u003c/div>\u003c/div>\n\u003cfigure class=\"gfig chartfig\" data-chart=\"G05\">\u003cdiv class=\"chart-slot\">\u003c/div>\u003cfigcaption>עקומה סכמטית לצורך המחשה, ללא ערכים מספריים.\u003c/figcaption>\u003c/figure>\n\u003ch3>מה קובע את היכולת האירובית?\u003c/h3>\n\u003cul>\u003cli>יכולת הריאות ומערכת הנשימה להכניס חמצן.\u003c/li>\u003cli>יכולת מערכת הלב וכלי הדם להוביל חמצן אל השרירים.\u003c/li>\u003cli>יכולת השריר לקלוט ולהשתמש בחמצן במיטוכונדריה.\u003c/li>\u003c/ul>\n\u003cp>צריכת חמצן מרבית מושפעת מאימון, גיל, תורשה ומאפיינים אישיים. בחוברת מוצגים גם טווחי השוואה לפי גיל ומין; יש לפרש אותם כנתוני ייחוס ולא כציון מוחלט של יכולת אישית.\u003c/p>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">מלכודת נפוצה\u003c/span>\u003cdiv>\u003cp>היכולת האירובית אינה נקבעת רק לפי נפח הריאות. תפוקת הלב, אספקת הדם ויכולת ניצול החמצן בשריר משמעותיות מאוד.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">עצירה לבדיקה\u003c/span>\u003cp>מה ההבדל בין \u003cbdi>VO₂\u003c/bdi> רגעי במהלך ריצה לבין \u003cbdi>VO₂max\u003c/bdi>?\u003c/p>\u003c/div>"},{"key":"L08","topicId":"T05","label":"פרק 07","title":"לקטט, יוני מימן ועייפות","source":"חוברת מקור: עמ׳ 37–39","html":"\u003ch3>איך נוצר לקטט?\u003c/h3>\n\u003cp>במהלך גליקוליזה, פירובט יכול להפוך ללקטט. תהליך זה מאפשר למחזר נשאי אלקטרונים שהגליקוליזה זקוקה להם ולכן מסייע להמשך ייצור \u003cbdi>ATP\u003c/bdi> בקצב גבוה.\u003c/p>\n\u003cdiv class=\"gcards\">\u003cdiv class=\"gcard\">\u003ch4>ייצור לקטט\u003c/h4>\u003cp>מתרחש גם במנוחה וגם במאמץ; קצב הייצור עשוי לעלות כשהעצימות עולה.\u003c/p>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>פינוי ושימוש בלקטט\u003c/h4>\u003cp>הלב, שרירים ורקמות נוספות יכולים לחמצן לקטט; הכבד מסוגל להשתמש בו ליצירת גלוקוז.\u003c/p>\u003c/div>\u003c/div>\n\u003ch3>אז למה ריכוזו בדם עולה?\u003c/h3>\n\u003cp>ריכוז הלקטט בדם משקף את האיזון בין הקצב שבו הוא מופיע בדם לבין קצב סילוקו. כשההופעה גוברת על הסילוק, הריכוז עולה. משום כך ריכוז גבוה אינו שקול לכך ש״הגוף הפסיק לפנות לקטט״.\u003c/p>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">יוני מימן (\u003cbdi>H\u003c/bdi>⁺) וחומציות\u003c/span>\u003cdiv>\u003cp>במאמץ עצים יכולים להצטבר יוני מימן ולרדת רמת ה-\u003cbdi>pH\u003c/bdi>, שינוי שפוגע בתפקוד השריר. לקטט ו-\u003cbdi>H\u003c/bdi>⁺ קשורים למטבוליזם העִצים, אך אין להציג את הלקטט לבדו כ״רעל שמחמיץ את השריר״.\u003c/p>\u003c/div>\u003c/aside>\n\u003ch3>מה מסייע לפינוי הלקטט אחרי מאמץ?\u003c/h3>\n\u003cul>\u003cli>ירידה בעצימות מאפשרת למערכות האירוביות להתמודד עם תוצרי המאמץ.\u003c/li>\u003cli>התאוששות אקטיבית קלה עשויה להאיץ פינוי לקטט מהדם ביחס למנוחה פסיבית.\u003c/li>\u003cli>הזמן והעצימות של ההתאוששות חשובים; התאוששות קשה מדי עלולה להאט את התהליך.\u003c/li>\u003c/ul>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">עצירה לבדיקה\u003c/span>\u003cp>אם בבדיקת דם נצפה לקטט גבוה, האם פירוש הדבר שהשריר אינו מסוגל להשתמש בלקטט כדלק?\u003c/p>\u003c/div>\n\u003ch2 class=\"part\">סף אנאירובי ויכולת להתמיד במאמץ\u003c/h2>\n\u003cp class=\"src\">חוברת מקור: עמ׳ 39–41\u003c/p>\n\u003cp>בסביבת הסף האנאירובי, כשמעלים את עצימות המאמץ, ריכוז הלקטט בדם מתחיל לעלות מהר יותר. הכינוי ״סף״ אינו מתאר מעבר חד ממצב שבו אין לקטט למצב שבו יש לקטט, אלא שינוי ביחס בין הייצור, ההופעה בדם והפינוי.\u003c/p>\n\u003cfigure class=\"gfig chartfig\" data-chart=\"G06\">\u003cdiv class=\"chart-slot\">\u003c/div>\u003cfigcaption>תרשים סכמטי: עם העלייה בעצימות, קצב העלייה בריכוז הלקטט יכול לגדול.\u003c/figcaption>\u003c/figure>\n\u003ch3>מה מציין \u003cbdi>OBLA\u003c/bdi>?\u003c/h3>\n\u003cp>בחוברת (עמ׳ 39) מצוין \u003cbdi>OBLA\u003c/bdi> כנקודת ייחוס של כ-4 מילימול ללקטט בליטר דם. זהו סמן מקובל בהקשר לימודי, אך אינו סף ביולוגי אחיד לכל אדם.\u003c/p>\n\u003cdiv class=\"gcards\">\u003cdiv class=\"gcard\">\u003ch4>מתאמן מאומן\u003c/h4>\u003cp>מסוגל לרוב לפעול בעצימות גבוהה יותר לפני עלייה חדה בלקטט; הסף עשוי להופיע באחוז גבוה יותר מה-\u003cbdi>VO₂max\u003c/bdi>.\u003c/p>\u003c/div>\u003cdiv class=\"gcard\">\u003ch4>מתאמן פחות מאומן\u003c/h4>\u003cp>ייתכן שעלייה חדה בריכוז הלקטט תופיע בעצימות נמוכה יותר באופן יחסי.\u003c/p>\u003c/div>\u003c/div>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">במילים פשוטות\u003c/span>\u003cdiv>\u003cp>שיפור הסף מאפשר להחזיק קצב גבוה יותר לאורך זמן בלי שריכוז הלקטט יעלה בחדות באותה נקודת מאמץ.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">עצירה לבדיקה\u003c/span>\u003cp>אם שני רצים בעלי \u003cbdi>VO₂max\u003c/bdi> דומה, למה אחד יכול להחזיק קצב מהיר יותר לזמן רב?\u003c/p>\u003c/div>"},{"key":"L09","topicId":"T06","label":"פרק 08","title":"התאוששות, חוב חמצן ו-EPOC","source":"חוברת מקור: עמ׳ 42–45","html":"\u003ch3>מה קורה בתחילת מאמץ?\u003c/h3>\n\u003cp>צריכת החמצן אינה קופצת מיד לרמה הדרושה לעומס. בזמן שהמערכת האירובית מגבירה את פעילותה, מסלולים אנאירוביים מסייעים למלא את פער האספקה. זהו \u003cstrong>גירעון חמצן\u003c/strong> בתחילת המאמץ.\u003c/p>\n\u003ch3>מה קורה לאחר שמפסיקים?\u003c/h3>\n\u003cp>צריכת החמצן נשארת גבוהה לזמן מה מרמת המנוחה. התופעה נקראת \u003cbdi>EPOC\u003c/bdi> (צריכת חמצן עודפת לאחר מאמץ). הגוף משתמש באנרגיה לשיקום המצב הפיזיולוגי, בין היתר לחידוש \u003cbdi>CrP\u003c/bdi>, איזון מאגרים, ויסות טמפרטורה ותמיכה בפעילות לב ונשימה.\u003c/p>\n\u003cfigure class=\"gfig chartfig\" data-chart=\"G11\">\u003cdiv class=\"chart-slot\">\u003c/div>\u003cfigcaption>איור סכמטי: צריכת החמצן מתקרבת בהדרגה לדרישה ויורדת בהדרגה במהלך ההתאוששות.\u003c/figcaption>\u003c/figure>\n\u003ch3>פסיבית או אקטיבית?\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>סוג התאוששות\u003c/th>\u003cth>מאפיין\u003c/th>\u003cth>מתאימה במיוחד ל…\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">פסיבית\u003c/th>\u003ctd>מנוחה או ישיבה\u003c/td>\u003ctd>חידוש משאבים כשחשוב למזער עבודה נוספת\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">אקטיבית קלה\u003c/th>\u003ctd>הליכה או תנועה קלה\u003c/td>\u003ctd>סיוע לפינוי לקטט לאחר מאמץ משמעותי\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">הפרדה חשובה\u003c/span>\u003cdiv>\u003cp>לקטט אינו הסיבה המרכזית לכאבי שרירים מאוחרים ביום שאחרי אימון. הוא יכול להתפנות מהר יחסית, ואילו \u003cbdi>DOMS\u003c/bdi> הוא תהליך אחר.\u003c/p>\u003c/div>\u003c/aside>\n\u003cdiv class=\"gcheck\">\u003cspan class=\"tag\">עצירה לבדיקה\u003c/span>\u003cp>למה צריכת החמצן נשארת גבוהה גם אחרי שהאימון הסתיים?\u003c/p>\u003c/div>"},{"key":"L10","topicId":"T07","label":"דף חזרה","title":"המספרים, הנוסחאות וההבחנות לזכור","source":"חוברת מקור: עמ׳ 9–51","html":"\u003cdiv class=\"gstats\">\u003cdiv class=\"gstat\">\u003cspan class=\"v\" dir=\"ltr\">4\u003c/span>\u003cspan class=\"l\">קק״ל / גרם פחמימה\u003c/span>\u003cspan class=\"c\">וכן חלבון\u003c/span>\u003c/div>\u003cdiv class=\"gstat\">\u003cspan class=\"v\" dir=\"ltr\">9\u003c/span>\u003cspan class=\"l\">קק״ל / גרם שומן\u003c/span>\u003cspan class=\"c\">צפיפות אנרגטית גבוהה\u003c/span>\u003c/div>\u003cdiv class=\"gstat\">\u003cspan class=\"v\" dir=\"ltr\">~10\u003c/span>\u003cspan class=\"l\">שניות\u003c/span>\u003cspan class=\"c\">חלון דומיננטיות פוספוגנית בקורס\u003c/span>\u003c/div>\u003cdiv class=\"gstat\">\u003cspan class=\"v\" dir=\"ltr\">4\u003c/span>\u003cspan class=\"l\">מילימול / ליטר\u003c/span>\u003cspan class=\"c\">נקודת ייחוס \u003cbdi>OBLA\u003c/bdi> בחוברת\u003c/span>\u003c/div>\u003c/div>\n\u003ch3>טבלת השוואה מהירה\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>מונח\u003c/th>\u003cth>מה הוא אומר\u003c/th>\u003cth>טעות שכיחה\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">\u003cbdi>BMR\u003c/bdi>\u003c/th>\u003ctd>הוצאה אנרגטית בסיסית במנוחה\u003c/td>\u003ctd>לא כל ההוצאה היומית\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>ATP\u003c/bdi>\u003c/th>\u003ctd>נשא האנרגיה הזמין בתא\u003c/td>\u003ctd>אינו מאגר הדלק העיקרי\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>CrP\u003c/bdi>\u003c/th>\u003ctd>מחדש \u003cbdi>ATP\u003c/bdi> במהירות לשניות\u003c/td>\u003ctd>אינו מקור ארוך טווח\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">גליקוליזה\u003c/th>\u003ctd>פירוק גלוקוז/גליקוגן\u003c/td>\u003ctd>לא חייבת חמצן\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">אירובי\u003c/th>\u003ctd>חמצון דלק ליצירת \u003cbdi>ATP\u003c/bdi>\u003c/td>\u003ctd>פועל גם במאמץ עצים\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>VO₂max\u003c/bdi>\u003c/th>\u003ctd>קצב שימוש מרבי בחמצן\u003c/td>\u003ctd>לא דופק מרבי\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">סף אנאירובי\u003c/th>\u003ctd>אזור עלייה מואצת בלקטט\u003c/td>\u003ctd>לא הפסקה מוחלטת של חמצון\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">\u003cbdi>EPOC\u003c/bdi>\u003c/th>\u003ctd>צריכת חמצן עודפת לאחר מאמץ\u003c/td>\u003ctd>לא רק ״סילוק חומצת חלב״\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>שלוש השאלות שצריכות להידלק בראש\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>מה משך המאמץ?\u003c/strong> שניות, עשרות שניות, או דקות רבות?\u003c/li>\u003cli>\u003cstrong>כמה גבוהה העצימות?\u003c/strong> קצב חידוש \u003cbdi>ATP\u003c/bdi> שנדרש עכשיו.\u003c/li>\u003cli>\u003cstrong>מה מודדים?\u003c/strong> מאגר \u003cbdi>ATP\u003c/bdi>, לקטט בדם, צריכת חמצן, או משך התאוששות?\u003c/li>\u003c/ul>\n\u003caside class=\"gnote\">\u003cspan class=\"tag\">לפני המבחן\u003c/span>\u003cdiv>\u003cp>תנסי להסביר בקול את ההבדל בין שלוש מערכות האנרגיה, בלי להסתכל בטבלה. אם זה מצליח עם דוגמה לכל מערכת, הבנת את הציר המרכזי של חלק א׳.\u003c/p>\u003c/div>\u003c/aside>"},{"key":"L11","topicId":"T07","label":"תרגול עצמי","title":"מבחן קצר מחוברת הסיכום","source":"","kind":"quiz","quiz":[{"n":1,"question":"מהו BMR?","options":[{"letter":"א","text":"כמות האנרגיה המנוצלת רק במהלך אימון"},{"letter":"ב","text":"צריכת האנרגיה הדרושה לתחזוקת הגוף במנוחה"},{"letter":"ג","text":"כמות ה-ATP המאוחסנת בשריר"},{"letter":"ד","text":"כמות החמצן המרבית הנצרכת בריצה"}],"correctIndex":1,"keyNote":"תחזוקת הגוף במנוחה."},{"n":2,"question":"מה מחדשת כל מערכת אנרגיה כדי לאפשר פעילות שריר?","options":[{"letter":"א","text":"גליקוגן"},{"letter":"ב","text":"חמצן"},{"letter":"ג","text":"ATP"},{"letter":"ד","text":"לקטט"}],"correctIndex":2,"keyNote":"ATP הוא הנשא התאי."},{"n":3,"question":"מה מאפיין במיוחד את המערכת הפוספוגנית?","options":[{"letter":"א","text":"קיבולת עצומה וקצב נמוך"},{"letter":"ב","text":"תלות ישירה בחמצן"},{"letter":"ג","text":"קצב גבוה מאוד אך מאגר מוגבל"},{"letter":"ד","text":"ייצור לקטט כתוצר עיקרי"}],"correctIndex":2,"keyNote":"מהירה אך מוגבלת."},{"n":4,"question":"מהו התוצר המרכזי של הגליקוליזה לפני מסלולי ההמשך?","options":[{"letter":"א","text":"פירובט"},{"letter":"ב","text":"חמצן"},{"letter":"ג","text":"קריאטין"},{"letter":"ד","text":"חומצת שומן"}],"correctIndex":0,"keyNote":"פירובט."},{"n":5,"question":"מה תפקיד החמצן בשרשרת הנשימה?","options":[{"letter":"א","text":"לשמש קולט אלקטרונים סופי"},{"letter":"ב","text":"להפוך ישירות לגליקוגן"},{"letter":"ג","text":"לפרק את CrP"},{"letter":"ד","text":"לייצר לקטט"}],"correctIndex":0,"keyNote":"קולט סופי."},{"n":6,"question":"באיזה מאמץ צפויה תרומה אירובית דומיננטית?","options":[{"letter":"א","text":"קפיצה בודדת"},{"letter":"ב","text":"הרמה מרבית אחת"},{"letter":"ג","text":"ריצה רציפה של 30 דקות"},{"letter":"ד","text":"זינוק של 3 שניות"}],"correctIndex":2,"keyNote":"מאמץ ממושך."},{"n":7,"question":"מהו VO₂max?","options":[{"letter":"א","text":"קצב הנשימה בזמן שינה"},{"letter":"ב","text":"הקצב המרבי שבו הגוף קולט ומשתמש בחמצן"},{"letter":"ג","text":"ריכוז לקטט מרבי"},{"letter":"ד","text":"הדופק המרבי לבדו"}],"correctIndex":1,"keyNote":"יכולת שימוש מרבית בחמצן."},{"n":8,"question":"כיצד יש להבין את הסף האנאירובי?","options":[{"letter":"א","text":"רגע שבו הפעילות האירובית מפסיקה"},{"letter":"ב","text":"רגע שבו כל הלקטט הופך לפסולת"},{"letter":"ג","text":"אזור שבו ריכוז הלקטט מתחיל לעלות במהירות יחסית"},{"letter":"ד","text":"הנקודה שבה הדופק בהכרח 220"}],"correctIndex":2,"keyNote":"עלייה מואצת בלק <script>

const D = JSON.parse(document.getElementById('data').textContent);
const TOPICS = [

const TOPIC = Object.fromEntries(TOPICS.map(t => [t.id, t]));
const Q = Object.fromEntries(D.mcq.map(q => [q.id, q]));
const FC = Object.fromEntries(D.flashcards.map(c => [c.id, c]));
const CHART = Object.fromEntries(D.charts.map(c => [c.id, c]));
const DIFF = { easy: 'קלה', medium: 'בינונית', hard: 'קשה' };
const LETTERS = ['א', 'ב', 'ג', 'ד', 'ה'];
const DAY = 86400000;

// ---------- small helpers ----------
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
// Escape and isolate Latin terms (ATP, VO₂max, ATP–CrP) so they keep their order inside Hebrew sentences.
const tx = s => esc(s).replace(/[A-Za-z][A-Za-z0-9₀-₉]*(?:[–\-/+][A-Za-z0-9₀-₉]+)*(?: [A-Za-z0-9][A-Za-z0-9₀-₉]*(?:[–\-/+.][A-Za-z0-9₀-₉]+)*)*/g, w => `<bdi>${w}</bdi>`);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const nowISO = () => new Date().toISOString();
const pagesTxt = p => Array.isArray(p) ? (p.length > 1 && p.every((v, i) => i === 0 || v === p[i - 1] + 1) ? `${p[0]}–${p[p.length - 1]}` : p.join(', ')) : String(p).replace(/-/g, '–');
const srcRef = p => `<span class="srcref">מקור: עמ׳ <bdi>${esc(pagesTxt(p))}</bdi> בחוברת</span>`;
const topicChip = id => id ? `<span class="chip t"><span class="tid">${id}</span> ${esc(TOPIC[id].short)}</span>` : '';
const fmtDate = iso => { try { return new Date(iso).toLocaleDateString('he-IL', { day: 'numeric', month: 'numeric', year: '2-digit' }); } catch { return ''; } };
const fmtDateTime = iso => { try { return new Date(iso).toLocaleString('he-IL', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch { return ''; } };
const fmtDur = sec => { sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec / 60), s = sec % 60; return `${m}:${String(s).padStart(2, '0')}`; };
const plural = (n, one, many) => n === 1 ? one : `${n} ${many}`;
const ICON = {
  home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  learn: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M9 7h6"/>',
  cards: '<rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/>',
  practice: '<circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/>',
  exam: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M9 2h6"/>',
  graphs: '<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>',
  games: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 17.5h7M17.5 14v7"/>',
  progress: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  listen: '<path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="2" y="14" width="5" height="7" rx="2"/><rect x="17" y="14" width="5" height="7" rx="2"/>',
  more: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  up: '<path d="M12 19V5M6 11l6-6 6 6"/>',
  down: '<path d="M12 5v14M6 13l6 6 6-6"/>',
  check: '<path d="M5 12l5 5 9-10"/>',
  flag: '<path d="M5 21V4h11l-2 4 2 4H5"/>',
};
const icon = (n, cls = 'ico') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const ROUTES = {
  home: { label: 'בית', icon: 'home' },
  learn: { label: 'ללמוד', icon: 'learn' },
  cards: { label: 'כרטיסיות', icon: 'cards' },
  practice: { label: 'תרגול', icon: 'practice' },
  exam: { label: 'מבחן', icon: 'exam' },
  graphs: { label: 'גרפים', icon: 'graphs' },
  games: { label: 'משחקים', icon: 'games' },
  progress: { label: 'ההתקדמות שלי', icon: 'progress' },
  listen: { label: 'להאזין', icon: 'listen' },
};

// ---------- state ----------
const LS_KEY = 'ofer-study-hub-v1';
const blankState = () => ({
  schemaVersion: 1, updatedAt: null,
  flashcards: {}, mcqAttempts: [], graphAttempts: [], matchingAttempts: [], sequenceAttempts: [],
  examResults: [], completedLessons: [], listened: {}, activeExam: null,
  lastViewed: { route: 'home', topicId: null, lessonKey: null },
});
function normalize(s) {
  const b = blankState();
  if (!s || typeof s !== 'object' || s.schemaVersion !== 1) return null;
  for (const k of Object.keys(b)) if (s[k] === undefined) s[k] = b[k];
  for (const k of ['mcqAttempts', 'graphAttempts', 'matchingAttempts', 'sequenceAttempts', 'examResults', 'completedLessons']) if (!Array.isArray(s[k])) return null;
  if (typeof s.flashcards !== 'object' || Array.isArray(s.flashcards)) return null;
  return s;
}
function trimState(s) {
  const cap = (k, n) => { if (s[k].length > n) s[k] = s[k].slice(-n); };
  cap('mcqAttempts', 1200); cap('graphAttempts', 300); cap('matchingAttempts', 250); cap('sequenceAttempts', 250); cap('examResults', 30);
}
const store = { local: false, remote: 'pending', ref: null, writing: false, dirty: false, timer: null, lastSync: null, error: null };
function loadLocal() {
  try { const raw = localStorage.getItem(LS_KEY); store.local = true; return raw ? normalize(JSON.parse(raw)) : null; }
  catch { store.local = false; return null; }
}
function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); store.local = true; } catch { store.local = false; }
}
let S = loadLocal() || blankState();

function commit() {
  S.updatedAt = nowISO();
  trimState(S);
  saveLocal();
  scheduleRemote();
  renderStatus();
}
function scheduleRemote() {
  if (!store.ref) return;
  clearTimeout(store.timer);
  store.timer = setTimeout(flushRemote, 1500);
}
async function flushRemote() {
  if (!store.ref) return;
  if (store.writing) { store.dirty = true; return; }
  store.writing = true;
  try {
    await store.ref.set(JSON.parse(JSON.stringify(S)));
    store.lastSync = Date.now(); store.error = null; store.remote = 'on';
  } catch (e) {
    const code = e && e.code;
    if (code === 'unavailable') { store.dirty = true; }
    else { store.ref = null; store.remote = code === 'invalid_argument' ? 'readonly' : 'off'; store.error = code || 'error'; }
  }
  store.writing = false;
  renderStatus();
  if (store.dirty && store.ref) { store.dirty = false; setTimeout(flushRemote, 1200 + Math.random() * 800); }
}
async function initRemote() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { store.remote = 'off'; renderStatus(); return; }
  try {
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user) { store.remote = 'off'; renderStatus(); return; }
    const uid = await user.id();
    if (!uid) { store.remote = 'off'; renderStatus(); return; }
    const ref = db.doc(`data/users/${uid}/progress`);
    const snap = await ref.get();
    store.ref = ref;
    store.remote = 'on';
    const remote = snap.exists ? normalize(JSON.parse(JSON.stringify(snap.data()))) : null;
    if (remote && (!S.updatedAt || (remote.updatedAt && remote.updatedAt > S.updatedAt))) {
      S = remote; saveLocal(); render();
    } else if (S.updatedAt) {
      flushRemote();
    }
  } catch (e) {
    store.ref = null; store.remote = 'off'; store.error = e && e.code;
  }
  renderStatus();
}
function storageMode() {
  if (store.remote === 'on') return 'account';
  if (store.local) return 'local';
  return 'none';
}
function renderStatus() {
  const chip = $('#storeChip');
  const m = storageMode();
  chip.dataset.s = m;
  const label = store.remote === 'pending' && store.local ? 'בודק שמירה…' : m === 'account' ? 'נשמר בחשבון' : m === 'local' ? 'נשמר בדפדפן' : 'לא נשמר';
  chip.innerHTML = `<span class="dot" aria-hidden="true"></span>${label}`;
  chip.setAttribute('aria-label', `מצב שמירה: ${label}. פתיחת גיבוי ושחזור`);
}

// ---------- derived stats ----------
function latestByQuestion() {
  const m = {};
  for (const a of S.mcqAttempts) m[a.questionId] = a;
  return m;
}
function topicStats(tid) {
  const qs = D.mcq.filter(q => q.topicId === tid);
  const ids = new Set(qs.map(q => q.id));
  const att = S.mcqAttempts.filter(a => ids.has(a.questionId));
  const latest = {};
  for (const a of att) latest[a.questionId] = a;
  const uniq = Object.values(latest);
  const cards = D.flashcards.filter(c => c.topicId === tid);
  const known = cards.filter(c => S.flashcards[c.id]?.rating === 'known').length;
  const recent = att.slice(-5);
  return {
    bank: qs.length, attempts: att.length, correct: att.filter(a => a.correct).length,
    unique: uniq.length, uniqueCorrect: uniq.filter(a => a.correct).length,
    mastery: uniq.length >= 5 ? pct(uniq.filter(a => a.correct).length, uniq.length) : null,
    coverage: pct(uniq.length, qs.length),
    recentWrong: recent.filter(a => !a.correct).length, recentN: recent.length,
    cards: cards.length, cardsKnown: known,
    lessons: D.lessons.filter(l => l.topicId === tid), lessonsDone: D.lessons.filter(l => l.topicId === tid && S.completedLessons.includes(l.key)).length,
  };
}
function cardIsDue(id, now = Date.now()) {
  const c = S.flashcards[id];
  return !c || !c.nextDueAt || Date.parse(c.nextDueAt) <= now;
}
function dueCards(tid) {
  const now = Date.now();
  return D.flashcards.filter(c => (!tid || c.topicId === tid) && S.flashcards[c.id] && cardIsDue(c.id, now));
}
const newCards = tid => D.flashcards.filter(c => (!tid || c.topicId === tid) && !S.flashcards[c.id]);
const hardCards = tid => D.flashcards.filter(c => (!tid || c.topicId === tid) && ['unknown', 'almost'].includes(S.flashcards[c.id]?.rating));
function mistakeIds(filterTid) {
  const latest = latestByQuestion();
  return Object.values(latest).filter(a => !a.correct && (!filterTid || Q[a.questionId]?.topicId === filterTid)).map(a => a.questionId);
}
function recurringMistakes() {
  const wrong = {};
  for (const a of S.mcqAttempts) if (!a.correct) wrong[a.questionId] = (wrong[a.questionId] || 0) + 1;
  const latest = latestByQuestion();
  return Object.entries(wrong).filter(([id, n]) => n >= 2 || !latest[id]?.correct).sort((a, b) => b[1] - a[1]).map(([id, n]) => ({ id, n, fixed: !!latest[id]?.correct }));
}

// Recommendation: a fixed rule list, checked in order, so the reason shown is always the rule that fired.
function recommend() {
  if (S.activeExam) {
    const ex = S.activeExam;
    return { title: 'יש מבחן פתוח', text: `ענית על ${Object.keys(ex.answers).length} מתוך ${ex.qids.length} שאלות. אפשר להמשיך מאותה נקודה.`, cta: 'המשך למבחן', act: 'go', args: { route: 'exam' } };
  }
  const due = dueCards().length;
  if (due >= 10) return { title: `${due} כרטיסיות מחכות לחזרה`, text: 'הגיע מועד החזרה שלהן לפי הדירוג הקודם שלך. סבב קצר של 10 כרטיסיות לוקח כמה דקות.', cta: 'לחזרה על כרטיסיות', act: 'startCardsQuick', args: { mode: 'due' } };
  let worst = null;
  for (const t of CORE) {
    const st = topicStats(t.id);
    if (st.recentN >= 3 && st.recentWrong >= 2 && (!worst || st.recentWrong > worst.st.recentWrong)) worst = { t, st };
  }
  if (worst) return { title: `מומלץ לחזור על ${worst.t.id}: ${worst.t.short}`, text: `${worst.st.recentWrong} טעויות ב-${worst.st.recentN} התשובות האחרונות בנושא. כדאי לעבור על ההסבר ואז לתרגל שוב את הטעויות.`, cta: 'תרגול הטעויות בנושא', act: 'startPracticeQuick', args: { topic: worst.t.id, pool: 'mistakes' } };
  const unlearned = D.lessons.find(l => l.topicId && l.topicId !== 'T07' && !S.completedLessons.includes(l.key));
  const touched = S.mcqAttempts.length > 0;
  if (unlearned && (!touched || S.completedLessons.length < 2)) return { title: `להתחיל מ${unlearned.label}: ${unlearned.title}`, text: `הפרק הבא ברצף הלמידה (עמ׳ ${unlearned.source.replace(/^.*עמ׳\s*/, '')}). בסוף הפרק יש שלוש שאלות בדיקה קצרות.`, cta: 'לפתיחת הפרק', act: 'openLesson', args: { key: unlearned.key } };
  let low = null;
  for (const t of CORE) { const st = topicStats(t.id); if (!low || st.coverage < low.st.coverage) low = { t, st }; }
  if (low && low.st.coverage < 60) return { title: `לתרגל את ${low.t.id}: ${low.t.short}`, text: `ענית עד עכשיו על ${low.st.unique} מתוך ${low.st.bank} השאלות בנושא, הכיסוי הנמוך ביותר מבין הנושאים.`, cta: 'תרגול 10 שאלות', act: 'startPracticeQuick', args: { topic: low.t.id, pool: 'unseen' } };
  return { title: 'זמן למבחן מסכם', text: 'יש לך כיסוי סביר בכל הנושאים. מבחן של 30 שאלות יראה איפה עוד כדאי לחזק.', cta: 'למבחן 30 שאלות', act: 'go', args: { route: 'exam' } };
}

// ---------- shared MCQ card ----------
// perm maps display position → original option index; grading always compares the original index to correctIndex.
function mcqCard(q, perm, selOrig, o) {
  const answered = selOrig !== null && selOrig !== undefined;
  const ok = answered && selOrig === q.correctIndex;
  return `<article class="qcard" aria-label="שאלה">
    ${o.showMeta !== false ? `<div class="qmeta">${topicChip(q.topicId)}<span class="chip">${DIFF[q.difficulty]}</span>${o.counter || ''}</div>` : ''}
    <div class="qtext">${tx(q.question)}</div>
    <ul class="opts">${perm.map((orig, d) => {
      let cls = '', mark = '';
      if (answered) {
        if (orig === q.correctIndex) { cls = 'correct'; mark = 'התשובה הנכונה'; }
        else if (orig === selOrig) { cls = 'wrong'; mark = 'הבחירה שלך'; }
      }
      return `<li><button class="opt ${cls}" ${answered ? 'disabled' : ''} data-act="mcqPick" data-args='${esc(JSON.stringify({ ctx: o.ctx, key: o.key, i: o.i, orig }))}'><span class="k">${LETTERS[d]}</span><span>${tx(q.options[orig])}</span><span class="mark">${mark}</span></button></li>`;
    }).join('')}</ul>
    ${answered ? `<div class="feedback ${ok ? 'ok' : 'bad'}" role="status"><b class="h">${ok ? 'נכון' : 'לא נכון'}</b><span>${tx(q.explanation)}</span>${srcRef(q.sourcePages)}</div>` : ''}
  </article>`;
}
function recordMcq(qid, orig, mode) {
  const q = Q[qid];
  S.mcqAttempts.push({ questionId: qid, selectedIndex: orig, correct: orig === q.correctIndex, answeredAt: nowISO(), mode });
}

// ---------- FLASHCARDS ----------

// ידעתי → one box up, intervals 1 / 3 / 7 / 14 / 30 days.
const INTERVAL_DAYS = [0, 1, 3, 7, 14, 30];
function rateCard(id, rating) {
  const c = S.flashcards[id] || { rating: null, reviews: 0, known: 0, almost: 0, unknown: 0, box: 0, lastAt: null, nextDueAt: null };
  c.reviews++; c[rating]++; c.rating = rating; c.lastAt = nowISO();
  const now = Date.now();
  if (rating === 'unknown') { c.box = 0; c.nextDueAt = new Date(now + 10 * 60000).toISOString(); }
  else if (rating === 'almost') { c.box = 1; c.nextDueAt = new Date(now + DAY).toISOString(); }
  else { c.box = Math.min((c.box || 0) + 1, 5); c.nextDueAt = new Date(now + INTERVAL_DAYS[c.box] * DAY).toISOString(); }
  S.flashcards[id] = c;
}
function buildCardQueue(topic, mode, size, mix) {
  let list;
  const tid = topic === 'all' ? null : topic;
  if (mode === 'hard') list = hardCards(tid);
  else if (mode === 'all') list = D.flashcards.filter(c => !tid || c.topicId === tid);
  else {
    const due = dueCards(tid).sort((a, b) => Date.parse(S.flashcards[a.id].nextDueAt || 0) - Date.parse(S.flashcards[b.id].nextDueAt || 0));
    list = due.concat(mix ? shuffle(newCards(tid)) : newCards(tid));
  }
  if (mix && mode !== 'due') list = shuffle(list);
  const n = size === 'all' ? list.length : Math.min(+size, list.length);
  return list.slice(0, n).map(c => c.id);
}

// Proportional quota per topic (largest remainder), and inside each topic the difficulties are interleaved
// medium → easy → hard so every topic contributes a mix rather than a run of one level.
function buildExam(n, topicIds) {
  const pool = D.mcq.filter(q => topicIds.includes(q.topicId));
  n = Math.min(n, pool.length);
  const groups = topicIds.map(t => ({ t, qs: pool.filter(q => q.topicId === t) })).filter(g => g.qs.length);
  const exact = groups.map(g => n * g.qs.length / pool.length);
  const quota = exact.map(Math.floor);
  let left = n - quota.reduce((a, b) => a + b, 0);
  exact.map((e, i) => [e - Math.floor(e), i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (left > 0 && quota[i] < groups[i].qs.length) { quota[i]++; left--; } });
  const picked = [];
  groups.forEach((g, gi) => {
    const buckets = ['medium', 'easy', 'hard'].map(d => shuffle(g.qs.filter(q => q.difficulty === d)));
    const order = [];
    while (buckets.some(b => b.length)) for (const b of buckets) if (b.length) order.push(b.shift());
    picked.push(...order.slice(0, quota[gi]));
  });
  return shuffle(picked).map(q => q.id);
}
