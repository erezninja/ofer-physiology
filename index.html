// ---------- GRAPHS ----------
const STATUS = {
  schematic: { chip: 'warm', label: 'תרשים להמחשה', note: 'הערכים בציר האנכי הם מדד יחסי לצורך הצגת הצורה, לא מדידה.' },
  course_table: { chip: 'ok', label: 'נתוני טבלת החוברת', note: 'המספרים לקוחים מהטבלה בחוברת, כהערכות לימודיות.' },
  digitized_approximate: { chip: 'flag', label: 'שחזור בקירוב', note: 'נקודות מעוגלות מקריאה חזותית של הגרף בחוברת, לא נתוני מעבדה.' },
  source_labeled_thresholds: { chip: 'warm', label: 'ספים לפי החוברת', note: 'העקומות זהות בכוונה; רק קווי הסף מסומנים לפי המקור.' },
};
const statusChip = c => `<span class="chip ${STATUS[c.dataStatus].chip} status-tag">${STATUS[c.dataStatus].label}</span>`;
function seriesColor(name, i) {
  if (/ATP|CrP/.test(name) && !/גליקו|אירובי/.test(name)) return name === 'ATP זמין' ? 'var(--sys-a)' : 'var(--sys-p)';
  if (/גליקו/.test(name)) return 'var(--sys-g)';
  if (/אירובי|פעילה|אחרי/.test(name)) return 'var(--sys-a)';
  if (/פסיבית|לפני/.test(name)) return 'var(--sys-p)';
  return ['var(--sys-t)', 'var(--sys-p)', 'var(--sys-a)', 'var(--sys-g)'][i % 4];
}
function wrapLabel(s, max) {
  s = String(s);
  if (s.length <= max || !s.includes(' ')) return [s];
  const words = s.split(' '); let a = '', b = '';
  for (const w of words) { if ((a + ' ' + w).trim().length <= max && !b) a = (a + ' ' + w).trim(); else b = (b + ' ' + w).trim(); }
  return b ? [a, b] : [a];
}
// Draws the chart from its data series. Schematic charts get no Y numbers; the X (time) axis always runs left → right as in the booklet.
function chartSVG(c, W) {
  W = Math.max(300, Math.min(W, 720));
  const small = W < 480;
  const H = Math.round(W * (small ? 0.78 : 0.56));
  const fs = small ? 11 : 12.5;
  const showY = c.dataStatus === 'course_table' || c.dataStatus === 'digitized_approximate';
  const m = { l: showY ? 58 : 30, r: 14, t: c.id === 'G08' ? 40 : 16, b: 58 };
  const iw = W - m.l - m.r;
  // X labels: when a single word is wider than its slot, labels alternate between two rows (each row gets two slots)
  const xs = c.xLabels;
  const slot = iw / xs.length, charW = fs * 0.6, lh = fs + 2;
  const longestWord = Math.max(...xs.map(l => Math.max(...String(l).split(' ').map(w => w.length))));
  const stagger = longestWord * charW > slot;
  const maxChars = Math.max(6, Math.floor((stagger ? 2 * slot : slot) / charW));
  const xLines = xs.map(l => wrapLabel(c.id === 'G08' ? l + '%' : l, maxChars));
  const rowLines = k => Math.max(1, ...xLines.filter((_, i) => i % 2 === k).map(l => l.length));
  const evenLines = stagger ? rowLines(0) : Math.max(...xLines.map(l => l.length));
  const labelBlock = (stagger ? evenLines + rowLines(1) : evenLines) * lh + (stagger ? 6 : 0);
  m.b = labelBlock + fs + 22;
  const ih = H - m.t - m.b;
  const numeric = xs.every(v => typeof v === 'number');
  let xPos;
  if (c.chartType === 'stacked_bar') { const bw = iw / xs.length; xPos = i => m.l + bw * (i + .5); }
  else if (numeric) { const lo = Math.min(...xs), hi = Math.max(...xs); xPos = i => m.l + (xs[i] - lo) / (hi - lo || 1) * iw; }
  else xPos = i => m.l + (xs.length === 1 ? iw / 2 : i / (xs.length - 1) * iw);
  const all = c.series.flatMap(s => s.values).filter(v => v !== null);
  let yMax = c.yMax || (c.chartType === 'stacked_bar' ? 100 : Math.max(...all));
  if (!c.yMax) yMax = showY ? Math.ceil(yMax / 2) * 2 : yMax * 1.08;
  const y = v => m.t + ih - v / yMax * ih;
  const out = [];
  out.push(`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title)}" style="font-size:${fs}px">`);
  // grid
  const ticks = 4;
  for (let k = 0; k <= ticks; k++) {
    const v = yMax * k / ticks, yy = y(v);
    out.push(`<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}" stroke-width="1" ${k ? 'stroke-dasharray="3 4"' : ''}/>`);
    if (showY) out.push(`<text x="${m.l - 6}" y="${yy + 4}" text-anchor="end" direction="ltr">${c.dataStatus === 'digitized_approximate' && k ? '≈' : ''}${+v.toFixed(1)}</text>`);
  }
  out.push(`<line class="axis" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${m.t + ih}" stroke-width="1.2"/>`);
  out.push(`<line class="axis" x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}" stroke-width="1.2"/>`);
  // x labels
  xs.forEach((lab, i) => {
    const lines = xLines[i];
    const y0 = m.t + ih + fs + 6 + (stagger && i % 2 ? evenLines * lh + 6 : 0);
    if (stagger && i % 2) out.push(`<line class="grid" x1="${xPos(i)}" x2="${xPos(i)}" y1="${m.t + ih + 3}" y2="${y0 - fs + 1}" stroke-width="1"/>`);
    // keep edge labels inside the drawing
    const half = Math.max(...lines.map(l => l.length)) * charW / 2;
    const lx = Math.min(Math.max(xPos(i), half + 2), W - half - 2);
    out.push(`<text x="${lx}" y="${y0}" text-anchor="middle">${lines.map((ln, j) => `<tspan x="${lx}" dy="${j ? fs + 2 : 0}">${esc(ln)}</tspan>`).join('')}</text>`);
  });
  out.push(`<text class="axis-title" x="${m.l + iw / 2}" y="${H - 4}" text-anchor="middle">${esc(c.xAxisLabel)}</text>`);
  out.push(`<text class="axis-title" transform="translate(${small ? 11 : 13},${m.t + ih / 2}) rotate(-90)" text-anchor="middle">${esc(showY ? c.yAxisLabel : (/יחסי/.test(c.yAxisLabel) ? c.yAxisLabel : c.yAxisLabel + ' · מדד יחסי'))}</text>`);
  if (c.chartType === 'stacked_bar') {
    const bw = iw / xs.length * 0.56;
    xs.forEach((lab, i) => {
      let acc = 0; const missing = [];
      c.series.forEach((s, si) => {
        const v = s.values[i];
        if (v === null) { missing.push(s.name); return; }
        const y0 = y(acc), y1 = y(acc + v);
        out.push(`<rect x="${xPos(i) - bw / 2}" y="${y1}" width="${bw}" height="${Math.max(0, y0 - y1)}" fill="${seriesColor(s.name, si)}" stroke="var(--surface)" stroke-width="1.5"><title>${esc(s.name)}: ${v}%</title></rect>`);
        if (y0 - y1 > fs + 2) out.push(`<text x="${xPos(i)}" y="${(y0 + y1) / 2 + fs / 3}" text-anchor="middle" style="fill:#fff;font-weight:700" direction="ltr">${v}%</text>`);
        acc += v;
      });
      if (missing.length) out.push(`<text x="${xPos(i)}" y="${y(acc) - 6}" text-anchor="middle" style="font-size:${fs - 1}px">${esc(missing.join(', '))}: לא דווח</text>`);
    });
  } else {
    if (c.id === 'G11') {
      // oxygen deficit (start) and EPOC (after) shading, per the booklet's two diagrams on p.43
      const act = c.series[0].values, dem = c.series[1].values, base = act[0];
      const def = [1, 2, 3].map(i => `${xPos(i)},${y(dem[i])}`).concat([3, 2, 1].map(i => `${xPos(i)},${y(act[i])}`));
      out.push(`<polygon points="${xPos(1)},${y(act[1])} ${def.join(' ')}" fill="var(--warm)" opacity=".18"/>`);
      const ep = [4, 5, 6].map(i => `${xPos(i)},${y(act[i])}`).concat([6, 4].map(i => `${xPos(i)},${y(base)}`));
      out.push(`<polygon points="${ep.join(' ')}" fill="var(--sys-a)" opacity=".16"/>`);
      out.push(`<text x="${(xPos(1) + xPos(2)) / 2}" y="${y(dem[1]) - 9}" text-anchor="middle" style="fill:var(--warm);font-weight:700">גירעון חמצן</text>`);
      out.push(`<text x="${xPos(5)}" y="${y(act[5]) - 10}" text-anchor="middle" style="fill:var(--sys-a);font-weight:700" direction="ltr">EPOC</text>`);
    }
    c.series.forEach((s, si) => {
      const col = seriesColor(s.name, si);
      const dash = c.id === 'G08' && si === 1 ? 'stroke-dasharray="7 6"' : '';
      const width = c.id === 'G08' && si === 0 ? 6 : 2.6;
      let d = '', pen = false;
      s.values.forEach((v, i) => { if (v === null) { pen = false; return; } d += `${pen ? 'L' : 'M'}${xPos(i).toFixed(1)},${y(v).toFixed(1)} `; pen = true; });
      out.push(`<path d="${d}" fill="none" stroke="${col}" stroke-width="${width}" stroke-linejoin="round" stroke-linecap="round" ${dash} ${c.id === 'G08' && si === 0 ? 'opacity=".45"' : ''}/>`);
      if (c.id !== 'G08') s.values.forEach((v, i) => { if (v !== null) out.push(`<circle cx="${xPos(i)}" cy="${y(v)}" r="3.4" fill="var(--surface)" stroke="${col}" stroke-width="2">${showY ? `<title>${esc(s.name)}: ${c.dataStatus === 'digitized_approximate' ? '≈' : ''}${v}</title>` : ''}</circle>`); });
    });
    (c.annotations || []).forEach((a, k) => {
      if (a.type !== 'vertical') return;
      const lo = Math.min(...xs), hi = Math.max(...xs), xx = m.l + (a.x - lo) / (hi - lo) * iw;
      const col = k === 0 ? 'var(--sys-t)' : 'var(--sys-p)';
      out.push(`<line x1="${xx}" x2="${xx}" y1="${m.t + ih}" y2="${m.t - (k ? 0 : 0)}" stroke="${col}" stroke-width="2" stroke-dasharray="4 3"/>`);
      out.push(`<text x="${xx}" y="${m.t - 8 - k * (fs + 4)}" text-anchor="middle" style="fill:${col};font-weight:700">${esc(a.label)}</text>`);
    });
  }
  out.push('</svg>');
  const legend = c.series.map((s, si) => `<span><i class="${c.id === 'G08' && si === 1 ? 'dash' : ''}" style="background:${seriesColor(s.name, si)};color:${seriesColor(s.name, si)}"></i>${tx(s.name)}</span>`).join('')
    + (c.id === 'G11' ? '<span><i style="background:var(--warm);opacity:.4"></i>גירעון חמצן</span><span><i style="background:var(--sys-a);opacity:.4"></i><bdi>EPOC</bdi></span>' : '');
  return out.join('') + `<div class="legend">${legend}</div>`;
}
function drawChartInto(el) {

VIEWS.games = (p) => {
  const tab = view.gameTab || 'matching';
  if (view.match) return matchBoard(view.match);

  const topic = p.topic && TOPIC[p.topic] ? p.topic : null;

function newMatch(id) {

  }).join('')}</ol>
  ${ms.checked ? `<div class="panel ${correct === g.pairs.length ? 'tint pop' : ''}"><div class="score-hero"><span class="big">${correct}/${g.pairs.length}</span><span>התאמות נכונות · נקודה לכל זוג</span></div></div>` : ''}
  ${ms.revealed ? '<div class="panel">הפתרון מוצג. הניסיון הזה לא נספר בניקוד.</div>' : ''}
  <div class="row">
    ${!ms.checked && !ms.revealed ? `<button class="btn primary" data-act="checkMatch" ${full ? '' : 'disabled'}>בדיקה</button><button class="btn" data-act="clearMatch">ניקוי</button><button class="btn ghost" data-act="revealMatch">הצגת הפתרון</button>`

function nextGameBtn(kind, id) {
  const list = kind === 'matching' ? D.matchingGames : D.sequenceChallenges;
  const i = list.findIndex(g => g.id === id);
  return i < list.length - 1 ? `<button class="btn" data-act="${kind === 'matching' ? 'openMatch' : 'openSeq'}" data-args='{"id":"${list[i + 1].id}"}'>לתרגיל הבא ←</button>` : '';
}
function newSeq(id) {
  const s = D.sequenceChallenges.find(x => x.id === id);
  let order = shuffle(s.steps.map(x => x.id));
  let guard = 0;
  while (order.join() === s.correctOrder.join() && guard++ < 10) order = shuffle(order);
  view.seq = { id, order, checked: false };
}
// Scoring: exact order = 5 points; otherwise one point per adjacent pair that appears in the correct relative order.
function seqScore(s, order) {
  const pos = Object.fromEntries(s.correctOrder.map((id, i) => [id, i]));
  const exact = order.join() === s.correctOrder.join();
  let adj = 0;
  for (let i = 0; i < order.length - 1; i++) if (pos[order[i + 1]] === pos[order[i]] + 1) adj++;
  return { exact, adj, max: order.length - 1, score: exact ? 5 : adj };
}
function seqBoard(ss) {
  const s = D.sequenceChallenges.find(x => x.id === ss.id);

  </div>

// HTML5 drag-and-drop for desktop; taps and the arrow buttons cover touch and keyboard.
function wireDnD() {
  document.querySelectorAll('.term[draggable="true"]').forEach(el => {
    el.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', el.dataset.term); e.dataTransfer.effectAllowed = 'move'; });
  });
  document.querySelectorAll('.def').forEach(el => {
    el.addEventListener('dragover', e => { if (view.match && !view.match.checked) { e.preventDefault(); el.classList.add('drop'); } });
    el.addEventListener('dragleave', () => el.classList.remove('drop'));
    el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('drop'); const t = e.dataTransfer.getData('text/plain'); if (t) assignTerm(t, el.dataset.def); });
  });
  const list = $('#seqList');
  if (list && view.seq && !view.seq.checked) {
    let dragId = null;
    list.querySelectorAll('li[draggable="true"]').forEach(li => {
      li.addEventListener('dragstart', e => { dragId = li.dataset.step; li.classList.add('dragging'); e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; });
      li.addEventListener('dragend', () => li.classList.remove('dragging'));
      li.addEventListener('dragover', e => { e.preventDefault(); li.classList.add('over'); });
      li.addEventListener('dragleave', () => li.classList.remove('over'));
      li.addEventListener('drop', e => {
        e.preventDefault(); li.classList.remove('over');
        const o = view.seq.order, from = o.indexOf(dragId), to = o.indexOf(li.dataset.step);
        if (from < 0 || to < 0 || from === to) return;
        o.splice(to, 0, o.splice(from, 1)[0]);
        render();
      });
    });
  }
}
function assignTerm(t, d) {
  const ms = view.match;
  for (const k of Object.keys(ms.assign)) if (ms.assign[k] === t) delete ms.assign[k];
  ms.assign[d] = t; ms.picked = null;
  render();
}

  const total = D.episodes.reduce((a, e) => a + e.durationSec, 0);
  const heard = D.episodes.filter(e => S.listened[e.id]).length;
  return `<div class="page-head"><span class="eyebrow">פודקאסט NotebookLM · ${D.episodes.length} פרקים · כ-${Math.round(total / 60)} דקות</span><h1>להאזין</h1>
  <p class="lede">פרקי שמע שהופקו מחומר חלק א׳. אפשר להאזין כאן ישירות, גם בטלפון. סומנו ${heard} מתוך ${D.episodes.length} כפרקים שהואזנו.</p></div>
  ${D.episodes.map(e => `<article class="ep">
    <div class="row between"><span class="n">פרק ${String(e.n).padStart(2, '0')}</span><span class="counter">${fmtDur(e.durationSec)}</span></div>
    <h3>${tx(e.title)}</h3>
    <audio controls preload="none" src="${esc(e.src)}" data-ep="${e.id}" aria-label="נגן: ${esc(e.title)}"></audio>
    <p class="small" data-ep-err="${e.id}" hidden style="margin:0;color:var(--bad)">הקובץ לא נטען כאן.${e.drive ? ' אפשר להאזין בקישור ל-Google Drive.' : ''}</p>
    <div class="row between">
      <div class="checks"><label><input type="checkbox" id="heard-${e.id}" data-act-change="listened" data-ep="${e.id}" ${S.listened[e.id] ? 'checked' : ''}> הואזן</label></div>
      ${e.drive ? `<a class="btn small" href="${esc(e.drive)}" target="_blank" rel="noopener">פתיחה ב-Google Drive</a>` : ''}
    </div>
  </article>`).join('')}
  <p class="small muted">הקבצים כאן דחוסים לאיכות דיבור כדי שייטענו מהר. המקוריים, באיכות מלאה, נמצאים <a href="https://drive.google.com/drive/folders/1lMdDW7s7DIL15pVPhEvq38uwgkUnmIzX" target="_blank" rel="noopener">בתיקיית ה-Drive</a> (כרגע פרקים 1–3 בלבד).</p>`;
};
function wireAudio() {
  document.querySelectorAll('audio[data-ep]').forEach(a => {
    a.addEventListener('error', () => { const p = document.querySelector(`[data-ep-err="${a.dataset.ep}"]`); if (p) p.hidden = false; });
    a.addEventListener('play', () => document.querySelectorAll('audio[data-ep]').forEach(o => { if (o !== a) o.pause(); }));
    a.addEventListener('ended', () => { if (!S.listened[a.dataset.ep]) { S.listened[a.dataset.ep] = true; commit(); toast('הפרק סומן כהואזן'); } });
  });
}

// ---------- actions ----------
const ACT = {
  go: (a, el) => {
    go(el.dataset.route || a.route, a.route ? Object.fromEntries(Object.entries(a).filter(([k]) => k !== 'route')) : a, { noFocus: !!el.dataset.anchor });
    if (el.dataset.anchor) { const t = document.getElementById(el.dataset.anchor); if (t) { t.scrollIntoView({ block: 'start' }); t.setAttribute('tabindex', '-1'); t.focus({ preventScroll: true }); } }
  },
  resume: () => {
    const lv = S.lastViewed;
    if (lv.lessonKey) return go('learn', { lesson: lv.lessonKey });
    go(lv.route, lv.topicId ? { topic: lv.topicId } : {});
  },
  openMore: () => openSheet(`<h2 id="sheetTitle">עוד</h2><div class="menu-grid">${['exam', 'graphs', 'games', 'progress', 'listen'].map(r => `<button data-act="go" data-route="${r}">${icon(ROUTES[r].icon)}${ROUTES[r].label}</button>`).join('')}</div>`),
  closeSheet,
  openLesson: a => { view.gq = null; go('learn', { lesson: a.key }); },
  toggleLesson: a => {
    const i = S.completedLessons.indexOf(a.key);
    if (i >= 0) S.completedLessons.splice(i, 1); else S.completedLessons.push(a.key);
    commit(); render(); toast(i >= 0 ? 'הסימון בוטל' : 'הפרק סומן כנלמד');
  },
  newLessonQs: a => { delete view.lessonQ[a.key]; render(); },
  gqPick: a => { view.gq.sel[a.n] = a.i; render(); },
  gqCheck: () => { view.gq.checked = true; render(); },
  gqReset: () => { view.gq = null; render(); },
  mcqPick: a => {
    if (a.ctx === 'lesson') {
      const it = view.lessonQ[a.key][a.i]; if (it.sel !== null) return;
      it.sel = a.orig; recordMcq(it.id, a.orig, 'learn');
    } else {
      const it = view.practice.items[a.i]; if (it.sel !== null) return;
      it.sel = a.orig; recordMcq(it.id, a.orig, 'practice');
    }
    commit(); render();
  },
  // flashcards
  startCards: () => {
    const f = view.cardForm;
    const queue = buildCardQueue(f.topic, f.mode, f.size, f.mix);
    if (!queue.length) return;
    view.cards = { queue, pos: 0, flipped: false, tally: { known: 0, almost: 0, unknown: 0 }, requeued: {}, seen: 0, topic: f.topic, done: false };
    render();
  },
  startCardsQuick: a => {
    view.cardForm = { topic: a.topic || 'all', mode: a.mode || 'due', size: '10', mix: true };
    view.cards = null;
    const queue = buildCardQueue(view.cardForm.topic, view.cardForm.mode, '10', true);
    if (queue.length) view.cards = { queue, pos: 0, flipped: false, tally: { known: 0, almost: 0, unknown: 0 }, requeued: {}, seen: 0, topic: view.cardForm.topic, done: false };
    else toast('אין כרטיסיות בבחירה הזו כרגע');
    go('cards', a.topic ? { topic: a.topic } : {});
  },
  flipCard: () => { view.cards.flipped = !view.cards.flipped; render(); const b = $('.rate button, .fc'); if (b) b.focus({ preventScroll: true }); },
  rateCard: a => {
    const cs = view.cards; const id = cs.queue[cs.pos];
    rateCard(id, a.r); cs.tally[a.r]++; cs.seen++;
    // "לא ידעתי" comes back three cards later, at most twice per round
    if (a.r === 'unknown' && (cs.requeued[id] || 0) < 2) { cs.requeued[id] = (cs.requeued[id] || 0) + 1; cs.queue.splice(Math.min(cs.pos + 4, cs.queue.length), 0, id); }
    commit();
    cs.pos++; cs.flipped = false;
    if (cs.pos >= cs.queue.length) cs.done = true;
    render(); const f = $('.fc'); if (f) f.focus({ preventScroll: true });
  },
  endCards: () => { view.cards.done = true; render(); },
  newCardRound: () => { view.cards = null; render(); },
  // practice
  startPractice: () => {
    const f = view.practiceForm; const pool = practicePool(f);
    const n = f.size === 'all' ? pool.length : Math.min(+f.size, pool.length);
    startPractice(shuffle(pool).slice(0, n).map(q => q.id), f.pool === 'mistakes' ? 'תרגול טעויות' : 'תרגול');
  },
  startPracticeQuick: a => {
    view.practiceForm = { topic: a.topic || 'all', diff: 'all', size: '10', pool: a.pool || 'all' };
    const pool = practicePool(view.practiceForm);
    if (!pool.length) { view.practice = null; toast('אין שאלות מתאימות כרגע'); return go('practice', a.topic ? { topic: a.topic } : {}); }
    if (a.topic) S.lastViewed.topicId = a.topic;
    startPractice(shuffle(pool).slice(0, 10).map(q => q.id), a.pool === 'mistakes' ? 'תרגול טעויות' : a.topic ? `תרגול ${a.topic}` : 'תרגול');
  },
  retryPractice: a => startPractice(shuffle(a.ids), a.label || 'תרגול חוזר של טעויות'),
  practiceNav: a => { const ps = view.practice; ps.pos = Math.max(0, Math.min(ps.items.length - 1, ps.pos + a.d)); render(); window.scrollTo({ top: 0 }); },
  endPractice: () => { view.practice.done = true; render(); },
  newPractice: () => { view.practice = null; render(); },
  // exam
  startExam: () => {
    const f = view.examForm;
    const qids = buildExam(+f.size, f.topics);
    if (!qids.length) return;
    S.activeExam = { id: 'EX-' + Date.now().toString(36), startedAt: nowISO(), limitSec: +f.time * qids.length, qids, perms: Object.fromEntries(qids.map(id => [id, shuffle([0, 1, 2, 3])])), answers: {}, flagged: [], current: 0 };
    view.examResult = null; commit(); render(); window.scrollTo({ top: 0 });
  },
  examPick: a => { const ex = S.activeExam; ex.answers[ex.qids[ex.current]] = a.orig; commit(); render(); },
  examNav: a => { const ex = S.activeExam; ex.current = Math.max(0, Math.min(ex.qids.length - 1, ex.current + a.d)); saveLocal(); render(); window.scrollTo({ top: 0 }); },
  examJump: a => { S.activeExam.current = a.i; saveLocal(); render(); window.scrollTo({ top: 0 }); },
  examFlag: () => { const ex = S.activeExam; const id = ex.qids[ex.current]; const i = ex.flagged.indexOf(id); if (i >= 0) ex.flagged.splice(i, 1); else ex.flagged.push(id); commit(); render(); },
  examSubmitAsk: () => {
    const ex = S.activeExam; const un = ex.qids.length - Object.keys(ex.answers).length;
    openSheet(`<h2 id="sheetTitle">להגיש את המבחן?</h2>
      <p>${un ? (un === 1 ? 'שאלה אחת עדיין בלי תשובה ותיחשב כשגויה.' : `<b>${un}</b> שאלות עדיין בלי תשובה ויחשבו כשגויות.`) : 'ענית על כל השאלות.'}${ex.flagged.length ? ` ${ex.flagged.length === 1 ? 'שאלה אחת מסומנת' : ex.flagged.length + ' שאלות מסומנות'} לבדיקה.` : ''}</p>
      <p class="small muted">אחרי ההגשה יוצגו הציון, התשובות הנכונות וההסברים. אי אפשר לשנות תשובות אחרי ההגשה.</p>
      <div class="row"><button class="btn primary" data-act="examSubmit">הגשה</button><button class="btn" data-act="closeSheet">חזרה למבחן</button></div>`, '.btn.primary');
  },
  examSubmit: () => submitExam(false),
  examFilter: a => { view.examFilter = a.f; render(); },
  newExam: () => { view.examResult = null; render(); },
  openExamResult: a => { const r = S.examResults.find(x => x.id === a.id); if (r) { view.examResult = r; view.examFilter = 'all'; go('exam'); } },
  // graphs
  openChart: a => { view.chartId = a.id; view.graphQ = {}; go('graphs'); },
  closeChart: () => { view.chartId = null; render(); },
  graphPick: a => {
    const st = view.graphQ[a.ch]; if (st.sel !== null) return;
    const ch = D.challenges.find(x => x.id === a.ch);
    st.sel = a.orig;
    S.graphAttempts.push({ challengeId: ch.id, chartId: ch.chartId, selectedIndex: a.orig, correct: a.orig === ch.correctIndex, answeredAt: nowISO() });
    commit(); render();
  },
  graphRetry: a => { const ch = D.challenges.find(x => x.id === a.ch); view.graphQ[a.ch] = { perm: shuffle(ch.options.map((_, k) => k)), sel: null }; render(); },
  // games
  gameTab: a => { view.gameTab = a.t; render(); },
  openMatch: a => { view.seq = null; newMatch(a.id); go('games'); },
  openSeq: a => { view.match = null; newSeq(a.id); go('games'); },
  closeGame: () => { view.match = null; view.seq = null; render(); },
  pickTerm: a => { const ms = view.match; ms.picked = ms.picked === a.t ? null : a.t; render(); const b = document.querySelector(`.term[data-term="${a.t}"]`); if (b) b.focus({ preventScroll: true }); },
  placeTerm: a => {
    const ms = view.match;
    if (ms.picked) return assignTerm(ms.picked, a.d);
    if (ms.assign[a.d]) { delete ms.assign[a.d]; render(); }
  },
  clearMatch: () => { view.match.assign = {}; view.match.picked = null; render(); },
  checkMatch: () => {
    const ms = view.match; const g = D.matchingGames.find(x => x.id === ms.id);
    ms.checked = true;
    const wrong = g.pairs.filter(p => ms.assign[p.id] !== p.id).map(p => p.id);
    S.matchingAttempts.push({ gameId: g.id, correctPairs: g.pairs.length - wrong.length, total: g.pairs.length, wrongPairIds: wrong, answeredAt: nowISO() });
    commit(); render();
  },
  revealMatch: () => {
    const ms = view.match;
    openSheet(`<h2 id="sheetTitle">להציג את הפתרון?</h2><p>הניסיון הנוכחי לא ייספר בניקוד. אפשר לנסות שוב אחר כך עם ערבוב חדש.</p>
      <div class="row"><button class="btn primary" data-act="revealMatchYes">הצגת הפתרון</button><button class="btn" data-act="closeSheet">ביטול</button></div>`);
  },
  revealMatchYes: () => {
    const ms = view.match; ms.revealed = true; closeSheet();
    S.matchingAttempts.push({ gameId: ms.id, correctPairs: 0, total: 5, wrongPairIds: [], revealed: true, answeredAt: nowISO() });
    commit(); render();
  },
  seqMove: a => {
    const o = view.seq.order, j = a.i + a.d;
    if (j < 0 || j >= o.length) return;
    [o[a.i], o[j]] = [o[j], o[a.i]];
    render();
    const btn = document.querySelectorAll('#seqList li')[j]?.querySelector(`.mv button:nth-child(${a.d < 0 ? 1 : 2})`);
    (btn && !btn.disabled ? btn : document.querySelectorAll('#seqList li')[j]?.querySelector('.mv button:not([disabled])'))?.focus({ preventScroll: true });
  },
  checkSeq: () => {
    const ss = view.seq; const s = D.sequenceChallenges.find(x => x.id === ss.id);
    ss.checked = true;
    const sc = seqScore(s, ss.order);
    S.sequenceAttempts.push({ challengeId: s.id, order: ss.order.slice(), exact: sc.exact, adjacentCorrect: sc.adj, score: sc.score, maxScore: 5, answeredAt: nowISO() });
    commit(); render();
  },
  // backup
  exportJSON: async () => {
    const json = JSON.stringify(S, null, 1);
    const name = `ofer-study-progress-${new Date().toISOString().slice(0, 10)}.json`;
    let dl = null;
    try { dl = window.claude?.use ? await window.claude.use('downloads') : null; } catch { dl = null; }
    if (dl) {
      try { const r = await dl.save({ filename: name, data: new Blob([json], { type: 'application/json' }) }); if (r && r.status) { toast('קובץ הגיבוי נשמר'); return; } }
      catch (e) { if (e && (e.code === 'declined' || e.code === 'rate_limited')) return; }
    }
    // outside Claude (e.g. the GitHub Pages copy) a plain download link works
    if (!window.claude) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      toast('קובץ הגיבוי ירד למחשב'); return;
    }
    $('#backupArea').innerHTML = `<div class="stack"><p class="small" style="margin:0">לא ניתן לשמור קובץ ישירות מכאן. אפשר להעתיק את הטקסט ולשמור אותו בקובץ <span class="mono">${esc(name)}</span>:</p>
      <textarea id="exportBox" readonly aria-label="נתוני הגיבוי">${esc(json)}</textarea><button class="btn small" data-act="copyExport" style="align-self:flex-start">העתקה</button></div>`;
  },
  copyExport: async () => {
    const box = $('#exportBox');
    try { await navigator.clipboard.writeText(box.value); toast('הועתק'); } catch { box.focus(); box.select(); toast('הטקסט מסומן. אפשר להעתיק אותו ידנית'); }
  },
  importOpen: () => {
    $('#backupArea').innerHTML = `<div class="stack"><label class="field"><span>קובץ גיבוי (JSON)</span><input type="file" id="importFile" accept="application/json,.json"></label>
      <label class="field"><span>או הדבקת תוכן הגיבוי</span><textarea id="importBox" aria-label="תוכן הגיבוי"></textarea></label>
      <button class="btn small" data-act="importCheck" style="align-self:flex-start">בדיקת הגיבוי</button><div id="importMsg" role="status"></div></div>`;
    $('#importFile').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('#importBox').value = r.result; ACT.importCheck(); }; r.readAsText(f); });
  },
  importCheck: () => {
    let s = null;
    try { s = normalize(JSON.parse($('#importBox').value)); } catch { s = null; }
    const msg = $('#importMsg');
    if (!s) { msg.innerHTML = '<p class="small" style="color:var(--bad);margin:0">זה לא נראה כמו קובץ גיבוי של האתר (חסר schemaVersion 1 או שהמבנה שונה).</p>'; return; }
    view.pendingImport = s;
    msg.innerHTML = `<div class="panel warmtint"><p style="margin:0">בגיבוי: ${s.mcqAttempts.length} תשובות, ${Object.keys(s.flashcards).length} כרטיסיות מדורגות, ${s.examResults.length} מבחנים, ${s.completedLessons.length} פרקים שנלמדו${s.updatedAt ? ` · עדכון אחרון ${fmtDateTime(s.updatedAt)}` : ''}.</p>
      <p class="small" style="margin:0">הייבוא יחליף את ההתקדמות הנוכחית.</p><div class="row"><button class="btn primary" data-act="importApply">החלפה בגיבוי</button><button class="btn" data-act="importCancel">ביטול</button></div></div>`;
  },
  importApply: () => { S = view.pendingImport; view.pendingImport = null; resetViews(); commit(); render(); toast('הגיבוי שוחזר'); },
  importCancel: () => { view.pendingImport = null; $('#backupArea').innerHTML = ''; },
  resetAsk: () => openSheet(`<h2 id="sheetTitle">לאפס את כל ההתקדמות?</h2><p>כל התשובות, דירוגי הכרטיסיות, המבחנים וסימוני הפרקים יימחקו${store.remote === 'on' ? ', גם מהשמירה בחשבון' : ''}. מומלץ לייצא גיבוי לפני כן.</p>
    <div class="row"><button class="btn danger" data-act="resetYes">איפוס</button><button class="btn" data-act="closeSheet">ביטול</button></div>`, '.btn:not(.danger)'),
  resetYes: () => { S = blankState(); resetViews(); commit(); closeSheet(); go('home'); toast('ההתקדמות אופסה'); },
};
function resetViews() { for (const k of Object.keys(view)) delete view[k]; }

// Delegated events: clicks carry data-act + JSON data-args; form controls update the current screen's form state.
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault();
  let args = {};
  try { args = el.dataset.args ? JSON.parse(el.dataset.args) : {}; } catch { }
  fn(args, el, e);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.actChange === 'listened') { S.listened[el.dataset.ep] = el.checked; commit(); return; }
  const form = el.closest('[data-form]'); if (!form) return;
  const fd = new FormData(form);
  if (form.dataset.form === 'cards') view.cardForm = { topic: fd.get('cardTopic'), mode: fd.get('cardMode'), size: fd.get('cardSize'), mix: fd.get('cardMix') === 'on' };
  if (form.dataset.form === 'practice') view.practiceForm = { topic: fd.get('prTopic'), diff: fd.get('prDiff'), size: fd.get('prSize'), pool: fd.get('prPool') };
  if (form.dataset.form === 'exam') view.examForm = { size: fd.get('exSize'), time: fd.get('exTime'), topics: fd.getAll('exTopic') };
  const id = el.id || el.name, val = el.value;
  render();
  const again = document.getElementById(id) || document.querySelector(`[name="${el.name}"][value="${CSS.escape(val)}"]`);
  if (again) again.focus({ preventScroll: true });
});
document.addEventListener('toggle', e => { if (e.target.dataset?.actToggle === 'examMap') view.examMapOpen = e.target.open; }, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  if (route === 'cards' && view.cards && !view.cards.done && !e.target.closest('input,select,textarea,button,a')) {
    if (e.key === ' ' && !view.cards.flipped) { e.preventDefault(); ACT.flipCard(); }
    else if (view.cards.flipped && ['1', '2', '3'].includes(e.key)) ACT.rateCard({ r: ['unknown', 'almost', 'known'][+e.key - 1] });
  }
});
window.addEventListener('hashchange', () => { const r = location.hash.slice(1); if (r && r !== route && ROUTES[r]) go(r); });

// ---------- boot ----------
(function boot() {
  const h = location.hash.slice(1);
  route = ROUTES[h] ? h : 'home';
  renderStatus();
  render();
  initRemote();
})();

</script>
</body></html>
